<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodado Atlas 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ink: #e9edf4; --ink-2: #9aa5b6; --ink-3: #6c7688;
    --line: rgba(255,255,255,.10); --card: rgba(14,17,23,.72);
    --shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  body {
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Arial, sans-serif;
  }
  #graph { position: fixed; inset: 0; }
  #graph canvas { outline: none; }

  .hud {
    position: fixed; z-index: 4; pointer-events: none;
  }
  .hud a, .hud button, .hud input { pointer-events: auto; }

  .top-left {
    top: 18px; left: 18px; max-width: 380px;
  }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 13px 16px 14px; backdrop-filter: blur(10px);
    box-shadow: var(--shadow);
  }
  .back {
    display: inline-block; margin-bottom: 8px;
    font-size: 11.5px; color: var(--ink-3); text-decoration: none;
  }
  .back:hover { color: var(--ink); }
  h1 {
    margin: 0 0 4px; font-size: 16px; font-weight: 700; letter-spacing: -.01em;
  }
  .sub {
    margin: 0; font-size: 12px; line-height: 1.55; color: var(--ink-2);
  }
  .stats {
    display: flex; gap: 16px; margin-top: 12px; padding-top: 11px;
    border-top: 1px solid var(--line);
  }
  .stat b {
    display: block; font-family: "IBM Plex Mono", monospace;
    font-size: 15px; font-weight: 600; letter-spacing: -.02em;
  }
  .stat span {
    font-size: 9.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em;
  }

  .bottom-left { bottom: 18px; left: 18px; max-width: 230px; }
  .legend-t {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-3); margin: 0 0 8px;
  }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
  .legend .it {
    display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .legend .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  .bottom-right { bottom: 18px; right: 18px; text-align: right; }
  .hint {
    font-size: 10.5px; color: var(--ink-3); line-height: 1.7;
    font-family: "IBM Plex Mono", monospace;
  }

  .top-right { top: 18px; right: 18px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .modebar { display: flex; gap: 6px; }
  .modebar button {
    font: 500 11.5px "IBM Plex Sans", sans-serif; color: var(--ink-2);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; cursor: pointer; backdrop-filter: blur(10px);
    box-shadow: var(--shadow);
  }
  .modebar button:hover { color: var(--ink); border-color: rgba(255,255,255,.22); }
  .modebar button[aria-pressed="true"] { color: #fff; border-color: rgba(255,255,255,.35); }
  .slider-panel { padding: 9px 13px 10px; }
  .slider-row + .slider-row { margin-top: 10px; }
  .slider-row .rl {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; margin-bottom: 6px;
  }
  .slider-row label {
    font-size: 9.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em;
  }
  .slider-row .val {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .slider-row input[type="range"] {
    width: 180px; accent-color: #7f93e6; display: block;
  }

  #tip {
    position: fixed; z-index: 5; pointer-events: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 10px; backdrop-filter: blur(10px); box-shadow: var(--shadow);
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
    opacity: 0; transition: opacity .12s; max-width: 280px;
  }
  #tip.on { opacity: 1; }
  #tip em { font-style: normal; color: var(--ink-3); }

  @media (max-width: 720px) {
    .bottom-left { display: none; }
    .top-left { max-width: 78vw; }
  }
</style>
</head>
<body>

<div id="graph"></div>

<div class="hud top-left">
  <div class="panel">
    <a class="back" href="index.html">&larr; atlas</a>
    <h1>Rodado Atlas — 3D</h1>
    <p class="sub">Cada esfera colorida é um dataset; as esferas cinzas são as colunas que aparecem em mais de um lugar. Clique numa esfera pra aproximar, arraste pra girar.</p>
    <div class="stats">
      <div class="stat"><b id="s-d">—</b><span>datasets</span></div>
      <div class="stat"><b id="s-k">—</b><span>chaves</span></div>
      <div class="stat"><b id="s-e">—</b><span>ligações</span></div>
    </div>
  </div>
</div>

<div class="hud top-right">
  <div class="modebar">
    <button id="m-rotate" aria-pressed="true">girar sozinho</button>
    <button id="m-labels" aria-pressed="true">nomes</button>
    <button id="m-colornames" aria-pressed="false">cor nos nomes</button>
    <button id="m-curve" aria-pressed="false">ligações curvas</button>
  </div>
  <div class="panel slider-panel">
    <div class="slider-row">
      <div class="rl"><label for="m-edgeop">transparência das ligações</label><span class="val" id="v-edgeop">22</span></div>
      <input type="range" id="m-edgeop" min="2" max="60" value="22">
    </div>
    <div class="slider-row">
      <div class="rl"><label for="m-edgewidth">espessura das ligações</label><span class="val" id="v-edgewidth">100</span></div>
      <input type="range" id="m-edgewidth" min="20" max="260" value="100">
    </div>
    <div class="slider-row">
      <div class="rl"><label for="m-expand">expansão do grafo</label><span class="val" id="v-expand">100</span></div>
      <input type="range" id="m-expand" min="55" max="170" value="100">
    </div>
  </div>
</div>

<div class="hud bottom-left">
  <p class="legend-t">Temas</p>
  <div class="legend" id="legend"></div>
</div>

<div class="hud bottom-right">
  <p class="hint">arrastar → girar<br>rolar → zoom<br>clique → focar</p>
</div>

<div id="tip"></div>

arget":"k147","name":"sigla_uf_fornecedor","color":"#2fbf2f","wn":0.691,"lbl":true},{"source":"d178","target":"k9","name":"chave","color":"#2fbf2f","wn":0.1,"lbl":false},{"source":"d178","target":"k108","name":"id_tabela","color":"#2fbf2f","wn":0.105,"lbl":false},{"source":"d178","target":"k120","name":"nome_coluna","color":"#2fbf2f","wn":0.105,"lbl":false},{"source":"d178","target":"k8","name":"cep","color":"#2fbf2f","wn":0.195,"lbl":false},{"source":"d179","target":"k29","name":"cpf","color":"#2fbf2f","wn":0.153,"lbl":false},{"source":"d179","target":"k39","name":"data_cancelamento","color":"#2fbf2f","wn":0.473,"lbl":true},{"source":"d179","target":"k83","name":"id_municipio","color":"#2fbf2f","wn":0.012,"lbl":false},{"source":"d179","target":"k90","name":"id_municipio_tse","color":"#2fbf2f","wn":0.166,"lbl":false},{"source":"d179","target":"k144","name":"sigla_partido","color":"#2fbf2f","wn":0.177,"lbl":false},{"source":"d179","target":"k146","name":"sigla_uf","color":"#2fbf2f","wn":0.005,"lbl":false},{"source":"d185","target":"k36","name":"data","color":"#8a93a3","wn":0.139,"lbl":false},{"source":"d186","target":"k36","name":"data","color":"#8a93a3","wn":0.139,"lbl":false},{"source":"d188","target":"k59","name":"date","color":"#2fbf2f","wn":0.345,"lbl":true},{"source":"d188","target":"k152","name":"year","color":"#2fbf2f","wn":0.171,"lbl":false},{"source":"d191","target":"k152","name":"year","color":"#4a97ea","wn":0.171,"lbl":false},{"source":"d192","target":"k152","name":"year","color":"#cd76d1","wn":0.171,"lbl":false},{"source":"d193","target":"k152","name":"year","color":"#4a97ea","wn":0.171,"lbl":false},{"source":"d194","target":"k152","name":"year","color":"#e0a030","wn":0.171,"lbl":false},{"source":"d195","target":"k152","name":"year","color":"#8a93a3","wn":0.171,"lbl":false},{"source":"d196","target":"k0","name":"ano","color":"#8a93a3","wn":0.0,"lbl":false},{"source":"d196","target":"k36","name":"data","color":"#8a93a3","wn":0.139,"lbl":false},{"source":"d197","target":"k9","name":"chave","color":"#e0a030","wn":0.1,"lbl":false},{"source":"d197","target":"k108","name":"id_tabela","color":"#e0a030","wn":0.105,"lbl":false},{"source":"d197","target":"k120","name":"nome_coluna","color":"#e0a030","wn":0.105,"lbl":false},{"source":"d197","target":"k0","name":"ano","color":"#e0a030","wn":0.0,"lbl":false},{"source":"d197","target":"k36","name":"data","color":"#e0a030","wn":0.139,"lbl":false},{"source":"d197","target":"k72","name":"id_empenho","color":"#e0a030","wn":0.377,"lbl":true},{"source":"d197","target":"k80","name":"id_licitacao","color":"#e0a030","wn":0.219,"lbl":false},{"source":"d197","target":"k83","name":"id_municipio","color":"#e0a030","wn":0.012,"lbl":false},{"source":"d197","target":"k112","name":"id_unidade_gestora","color":"#e0a030","wn":0.239,"lbl":false},{"source":"d197","target":"k113","name":"mes","color":"#e0a030","wn":0.043,"lbl":false},{"source":"d197","target":"k146","name":"sigla_uf","color":"#e0a030","wn":0.005,"lbl":false},{"source":"d197","target":"k4","name":"ano_processo","color":"#e0a030","wn":0.691,"lbl":true},{"source":"d197","target":"k37","name":"data_abertura","color":"#e0a030","wn":0.555,"lbl":true},{"source":"d197","target":"k139","name":"nome_vencedor","color":"#e0a030","wn":0.691,"lbl":true},{"source":"d197","target":"k8","name":"cep","color":"#e0a030","wn":0.195,"lbl":false},{"source":"d197","target":"k135","name":"nome_responsavel","color":"#e0a030","wn":0.418,"lbl":true},{"source":"d197","target":"k128","name":"nome_orgao","color":"#e0a030","wn":0.239,"lbl":false},{"source":"d197","target":"k138","name":"nome_unidade_gestora","color":"#e0a030","wn":0.264,"lbl":false}]}</script>

<script>
"use strict";
const G = JSON.parse(document.getElementById("graph-data").textContent);

document.getElementById("s-d").textContent = G.meta.datasets.toLocaleString("pt-BR");
document.getElementById("s-k").textContent = G.meta.keys.toLocaleString("pt-BR");
document.getElementById("s-e").textContent = G.meta.edges.toLocaleString("pt-BR");

document.getElementById("legend").innerHTML = G.themes.map(([name, color]) =>
  `<span class="it"><i class="sw" style="background:${color}"></i>${name}</span>`).join("");

const elGraph = document.getElementById("graph");
const tip = document.getElementById("tip");
let showLabels = true;
let colorNames = false;
let edgeBase = 0.22;
let edgeWidthMul = 1;
let curved = false;
let focusId = null;
let activeNodes = null;   // Set of node ids kept lit while a node is focused
let activeLinks = null;   // Set of link object refs kept lit while focused

// idOf: 3d-force-graph rewrites link.source/target from the id string to the
// actual node object once the simulation binds them — this reads either.
const idOf = x => (x && typeof x === "object") ? x.id : x;
const linkTouches = (l, id) => idOf(l.source) === id || idOf(l.target) === id;

const Graph = ForceGraph3D()(elGraph)
  .graphData({ nodes: G.nodes, links: G.links })
  .backgroundColor("#05060a")
  .nodeId("id")
  .nodeLabel(n => `${n.name} <i>· ${n.grp === "dataset" ? n.tables + " tabelas · " + fmt(n.rows) + " linhas" : n.tables + " tabelas · " + n.datasets + " datasets"}</i>`)
  .nodeVal(n => n.val)
  .nodeColor(n => n.color)
  .nodeOpacity(n => (!focusId || activeNodes.has(n.id)) ? 0.98 : 0.08)
  .nodeResolution(n => (n.grp === "dataset" ? 14 : 8))
  .linkColor(l => l.color)
  .linkOpacity(l => (!focusId || activeLinks.has(l)) ? edgeBase : edgeBase * 0.05)
  .linkWidth(l => (0.35 + 1.8 * l.wn) * edgeWidthMul)
  .linkCurvature(l => curved ? 0.28 : 0)
  .linkDirectionalParticles(l => (!focusId || activeLinks.has(l)) ? 1 + Math.round(2 * l.wn) : 0)
  .linkDirectionalParticleWidth(l => 0.9 + 1.1 * l.wn)
  .linkDirectionalParticleSpeed(l => 0.0018 + 0.006 * l.wn)
  .linkDirectionalParticleColor(l => l.color)
  .warmupTicks(80)
  .cooldownTime(6000)
  .showNavInfo(false);

// Default charge repulsion pushes a 326-node graph into a diffuse cloud —
// fitting the camera to that means every sphere shrinks to a sub-pixel dot.
// Capping the repulsion's reach and shortening link distance keeps it a
// dense, legible cluster instead. `expansion` scales both live off the same
// base numbers, so the slider can loosen or tighten the whole cluster.
let expansion = 1;
function applyForces(reheat) {
  Graph.d3Force("charge").strength(-34 * expansion).distanceMax(240 * expansion);
  Graph.d3Force("link").distance(l => (14 + 34 * (1 - l.wn)) * expansion);
  // the simulation isn't up yet on the very first call at load — only the
  // slider's later calls need to kick it back into motion
  if (reheat) Graph.d3ReheatSimulation();
}
applyForces(false);

// zoomToFit frames the whole cluster, which on first load reads as a distant,
// sparse haze — the first settle instead lands the camera inside the cluster,
// close enough to read names; later reheats (from the expansion slider) still
// get the full fit, since the user is deliberately checking the whole shape.
let firstFit = true;
Graph.onEngineStop(() => {
  if (firstFit) {
    firstFit = false;
    Graph.zoomToFit(0, 40);
    const cam = Graph.camera(), dist = cam.position.length() * 0.4;
    const dir = cam.position.clone().normalize();
    Graph.cameraPosition({ x: dir.x * dist, y: dir.y * dist, z: dir.z * dist }, { x: 0, y: 0, z: 0 }, 1000);
  } else {
    Graph.zoomToFit(700, 40);
  }
});

// node label sprites, floating above each sphere
Graph.nodeThreeObject(node => {
  const isDs = node.grp === "dataset";
  const sprite = new SpriteText(node.name);
  sprite.color = isDs ? (colorNames ? node.color : "#f4f6fa") : "#aab4c4";
  sprite.fontFace = "IBM Plex Mono, monospace";
  sprite.fontWeight = isDs ? "600" : "500";
  sprite.textHeight = isDs ? Math.min(3.6, 1.9 + node.val * 0.22) : 1.55;
  sprite.padding = 0;
  sprite.strokeWidth = isDs ? 0.35 : 0.22;
  sprite.strokeColor = "rgba(5,6,10,.85)";
  sprite.position.y = Math.cbrt(node.val) * 3.4 + (isDs ? 3 : 2);
  sprite.material.transparent = true;
  sprite.userData.__labelSprite = true;
  sprite.visible = showLabels;
  node.__label = sprite;
  return sprite;
}).nodeThreeObjectExtend(true);

// link-name sprites at the midpoint, only for the less generic keys — every
// edge into "ano" or "sigla_uf" repeating the same word a hundred times would
// be noise, not signal; the node label already carries those.
Graph.linkThreeObjectExtend(true);
Graph.linkThreeObject(link => {
  if (!link.lbl) return null;
  const sprite = new SpriteText(link.name);
  sprite.color = "rgba(220,226,236,.75)";
  sprite.fontFace = "IBM Plex Mono, monospace";
  sprite.textHeight = 1.15;
  sprite.material.transparent = true;
  sprite.userData.__labelSprite = true;
  sprite.visible = showLabels;
  link.__label = sprite;
  return sprite;
});
Graph.linkPositionUpdate((sprite, { start, end }) => {
  if (!sprite) return;
  sprite.position.x = (start.x + end.x) / 2;
  sprite.position.y = (start.y + end.y) / 2;
  sprite.position.z = (start.z + end.z) / 2;
});

// a quiet starfield behind everything, for depth
(function starfield() {
  const N = 1800, R = 2600;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = R * (0.35 + 0.65 * Math.random());
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
    pos[i*3+2] = r * Math.cos(ph);
  }
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0x8892a6, size: 1.15, sizeAttenuation: true, transparent: true, opacity: 0.55 });
  Graph.scene().add(new THREE.Points(geo, mat));
  Graph.scene().fog = new THREE.FogExp2(0x05060a, 0.0016);
})();

// gentle idle orbit until the visitor takes the wheel
const controls = Graph.controls();
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
elGraph.addEventListener("pointerdown", () => {
  controls.autoRotate = false;
  document.getElementById("m-rotate").setAttribute("aria-pressed", "false");
}, { once: true, passive: true });

document.getElementById("m-rotate").onclick = e => {
  controls.autoRotate = !controls.autoRotate;
  e.currentTarget.setAttribute("aria-pressed", String(controls.autoRotate));
};
document.getElementById("m-labels").onclick = e => {
  showLabels = !showLabels;
  e.currentTarget.setAttribute("aria-pressed", String(showLabels));
  Graph.scene().traverse(o => { if (o.userData && o.userData.__labelSprite) o.visible = showLabels; });
};
document.getElementById("m-colornames").onclick = e => {
  colorNames = !colorNames;
  e.currentTarget.setAttribute("aria-pressed", String(colorNames));
  G.nodes.forEach(n => {
    if (n.grp === "dataset" && n.__label) n.__label.color = colorNames ? n.color : "#f4f6fa";
  });
};
document.getElementById("m-edgeop").oninput = e => {
  edgeBase = +e.target.value / 100;
  document.getElementById("v-edgeop").textContent = e.target.value;
  Graph.refresh();
};
document.getElementById("m-edgewidth").oninput = e => {
  edgeWidthMul = +e.target.value / 100;
  document.getElementById("v-edgewidth").textContent = e.target.value;
  Graph.refresh();
};
document.getElementById("m-expand").oninput = e => {
  expansion = +e.target.value / 100;
  document.getElementById("v-expand").textContent = e.target.value;
  applyForces(true);
};
document.getElementById("m-curve").onclick = e => {
  curved = !curved;
  e.currentTarget.setAttribute("aria-pressed", String(curved));
  Graph.refresh();
};

// Clicking a node dims everything that isn't it or a direct neighbour, so the
// lines that matter stand out; clicking the empty background lights it all
// back up. Opacity for the sphere/lines goes through the accessor functions
// above (refresh() re-runs them); the label sprites are our own three.js
// objects, so their opacity is set directly here instead.
function applyFocus(id) {
  focusId = id;
  if (id) {
    activeNodes = new Set([id]);
    activeLinks = new Set(G.links.filter(l => linkTouches(l, id)));
    activeLinks.forEach(l => { activeNodes.add(idOf(l.source)); activeNodes.add(idOf(l.target)); });
  } else {
    activeNodes = null;
    activeLinks = null;
  }

  G.nodes.forEach(n => {
    if (!n.__label) return;
    const on = !focusId || activeNodes.has(n.id);
    n.__label.material.opacity = on ? 1 : (n.grp === "dataset" ? 0.15 : 0.08);
  });
  G.links.forEach(l => {
    if (!l.__label) return;
    l.__label.material.opacity = (!focusId || activeLinks.has(l)) ? 1 : 0.04;
  });

  Graph.refresh();
}

Graph.onNodeClick(node => {
  const wasFocused = focusId === node.id;
  applyFocus(wasFocused ? null : node.id);
  if (!wasFocused) {
    const dist = 90;
    const ratio = 1 + dist / Math.hypot(node.x || 1e-6, node.y || 1e-6, node.z || 1e-6);
    Graph.cameraPosition(
      { x: node.x * ratio, y: node.y * ratio, z: node.z * ratio },
      node,
      1400
    );
  }
});
if (typeof Graph.onBackgroundClick === "function") {
  Graph.onBackgroundClick(() => applyFocus(null));
}

Graph.onNodeHover(node => {
  elGraph.style.cursor = node ? "pointer" : "grab";
});

function fmt(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(".", ",") + " bi";
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(".", ",") + " mi";
  if (n >= 1e3) return Math.round(n / 1e3) + " mil";
  return String(n);
}

addEventListener("resize", () => Graph.width(innerWidth).height(innerHeight));
</script>
