<title>A emenda que pagou a própria empresa — rodado</title>
<meta name="description" content="Cruzando emenda → convênio → licitação → contrato (SICONV) com nome de urna → CPF (TSE) e CPF → sócio (Receita Federal), aparecem 16 empresas em que o sócio tem nome e os seis dígitos centrais do CPF idênticos ao do parlamentar que autorou a emenda que pagou o contrato daquela empresa — 69 contratos, R$ 60,96 milhões. Duda Ramos (PODE-RR) responde por 83% do valor sozinho; Ciro Nogueira e Iracema Portella, os dois políticos do PP-PI, aparecem juntos na mesma revenda de motos. Tabela completa com número de emenda, para conferência direta no Portal da Transparência.">
