<title>Os vira-casacas: de Lula em 2022 a Flávio Bolsonaro em 2026 — rodado</title>
<meta name="description" content="Lula venceu em 3.371 municípios no 1º turno de 2022, e 703 deles deram a vitória a Flávio Bolsonaro em 2026. Nenhum fez o caminho inverso. O que mais distingue esses 703 é que Lula já tinha ganhado ali por pouco em 2022 (mediana de 7 p.p.), e quase todos ficam no Sul, no Centro-Oeste ou no interior de SP e MG. Comparados com municípios da mesma UF e de margem parecida, sobra um perfil modesto: menos Bolsa Família, mais população branca, agro com mais crédito por hectare e municípios menores. Emprego público, IDH e a estrutura setorial da economia não resistem a esse controle.">
