<meta name="description" content="Refazendo o cruzamento do relatório &quot;A Rede de Flávio&quot; e da reportagem da Pública com cadastros que eles não consultaram: cinco rádios e TVs do grupo WT, incluindo a Jota Comunicação, onde hoje dirigem a esposa e a filha de Weverton Rocha, respondem juntas por R$ 28,5 milhões em dívida ativa da União. Desde janeiro de 2026 a Jota está na mesma sala da holding do senador em São Luís. Eliziane Gama reembolsou R$ 87,7 mil de combustível pela cota do Senado no posto de Weverton, e a Bonsucesso das duas apurações hoje é a Neoverde Alliance, com capital cem vezes maior. E o telefone atribuído à Voga não é o que a Voga declara.">
