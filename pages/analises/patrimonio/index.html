<style>

/* ─── fichário: papel de livro-razão, filete de 1px, número em mono tabular ── */
:root{
  --paper:#e9ede8; --surface:#f4f7f3; --sunk:#dfe5de;
  --ink:#131816; --ink2:#5b6663; --ink3:#828c88;
  --rule:#ccd4cd; --rule2:#b3bdb6;
  --accent:#1d5450; --accent-fg:#f4f7f3;
  --abaixo:#5d7f88;  /* cabe no subsídio — mesma cor dos gráficos publicados */
  --acima:#d1453b;   /* não cabe */
  --neutro:#a9b2ac;
  --serif:Charter,"Bitstream Charter","Iowan Old Style",Georgia,ui-serif,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#101416; --surface:#171d1f; --sunk:#0b0e10;
    --ink:#e7ece9; --ink2:#9aa5a1; --ink3:#6d7873;
    --rule:#2b3436; --rule2:#3d4749;
    --accent:#6fb3aa; --accent-fg:#0b0e10;
    --abaixo:#7fa3ad; --acima:#e2695e; --neutro:#5c6763;
  }
}
:root[data-theme="dark"]{
  --paper:#101416; --surface:#171d1f; --sunk:#0b0e10;
  --ink:#e7ece9; --ink2:#9aa5a1; --ink3:#6d7873;
  --rule:#2b3436; --rule2:#3d4749;
  --accent:#6fb3aa; --accent-fg:#0b0e10;
  --abaixo:#7fa3ad; --acima:#e2695e; --neutro:#5c6763;
}
:root[data-theme="light"]{
  --paper:#e9ede8; --surface:#f4f7f3; --sunk:#dfe5de;
  --ink:#131816; --ink2:#5b6663; --ink3:#828c88;
  --rule:#ccd4cd; --rule2:#b3bdb6;
  --accent:#1d5450; --accent-fg:#f4f7f3;
  --abaixo:#5d7f88; --acima:#d1453b; --neutro:#a9b2ac;
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
     font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ─── cabeçalho ─────────────────────────────────────────────────────────── */
header{border-bottom:1px solid var(--rule2);background:var(--surface);
       padding:10px 18px 9px;display:flex;flex-wrap:nowrap;gap:16px;
       align-items:baseline;justify-content:space-between}
header h1{font-size:19px;letter-spacing:-.01em;display:inline}
header > div:first-child{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;min-width:0}
header p{margin:0;color:var(--ink2);font-size:12.5px;max-width:none;white-space:nowrap;
         overflow:hidden;text-overflow:ellipsis}
.selo{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
      text-transform:uppercase;color:var(--ink3)}
.tema{background:none;border:1px solid var(--rule2);color:var(--ink2);
      font-family:var(--mono);font-size:11px;padding:5px 9px;cursor:pointer}
.tema:hover{border-color:var(--accent);color:var(--accent)}

/* ─── estrutura ─────────────────────────────────────────────────────────── */
.tela{display:grid;grid-template-columns:298px minmax(0,1fr);
      min-height:calc(100vh - 48px)}
.rail{border-right:1px solid var(--rule2);background:var(--surface);
      padding:16px 18px 40px;display:flex;flex-direction:column;gap:16px;
      max-height:calc(100vh - 48px);overflow-y:auto;position:sticky;top:0}
.palco{padding:16px 18px 40px;min-width:0;display:flex;
       flex-direction:column}
#palcoConteudo{flex:1 1 auto;display:flex;flex-direction:column;width:100%}
#palcoConteudo > .quadro:first-child{flex:1 1 auto;display:flex;
       flex-direction:column}
#palcoConteudo > .quadro:first-child canvas{flex:1 1 auto}

/* ─── filtros ───────────────────────────────────────────────────────────── */
.grupo{display:flex;flex-direction:column;gap:7px}
.rotulo{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
        text-transform:uppercase;color:var(--ink3)}
.busca{width:100%;padding:7px 9px;border:1px solid var(--rule2);
       background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:11.5px;padding:4px 8px;cursor:pointer;
      border:1px solid var(--rule2);background:var(--paper);color:var(--ink2);
      user-select:none}
.chip:hover{border-color:var(--ink3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);
                           border-color:var(--ink)}
.chip.esq[aria-pressed="true"]{background:#b2544f;border-color:#b2544f;color:#fff}
.chip.cen[aria-pressed="true"]{background:#8a8f7e;border-color:#8a8f7e;color:#fff}
.chip.dir[aria-pressed="true"]{background:var(--abaixo);border-color:var(--abaixo);color:#fff}
select{width:100%;padding:6px 8px;border:1px solid var(--rule2);
       background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13.5px}
.check{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink2);
       cursor:pointer}
.contagem{font-family:var(--mono);font-size:12px;color:var(--ink2);
          border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
          padding:9px 0}
.contagem b{color:var(--ink);font-size:16px}
.limpar{background:none;border:none;color:var(--accent);font-size:12.5px;
        cursor:pointer;padding:0;text-align:left;text-decoration:underline}

/* ─── lista de pessoas ──────────────────────────────────────────────────── */
/* Cada linha é uma ficha: filete de espectro à esquerda, nome, meta, o
   múltiplo em número e a forma da trajetória em miniatura. A miniatura é
   normalizada por pessoa — ela mostra o desenho do que aconteceu, não a
   escala, que já está no número ao lado. */
.lista{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 9px;
      padding:8px 8px 8px 10px;border-bottom:1px solid var(--rule);cursor:pointer;
      background:none;border-top:none;border-right:none;
      border-left:3px solid var(--rule2);text-align:left;
      font-family:inherit;color:inherit;width:100%;align-items:center}
.item[data-e="0"]{border-left-color:#b2544f}
.item[data-e="1"]{border-left-color:#8a8f7e}
.item[data-e="2"]{border-left-color:var(--abaixo)}
.item:hover{background:var(--sunk)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.item[aria-current="true"]{background:var(--sunk)}
.item[aria-current="true"] .nm{font-weight:600}
.item .nm{font-size:13.5px;line-height:1.25;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap}
.item .sub{grid-column:1;font-family:var(--mono);font-size:10.5px;
           color:var(--ink3);overflow:hidden;text-overflow:ellipsis;
           white-space:nowrap}
.item .mult{font-family:var(--mono);font-size:13.5px;
            font-variant-numeric:tabular-nums;text-align:right;line-height:1.25}
.item .spark{grid-column:2;justify-self:end;display:block}
.item .pin{color:var(--accent)}
.mais{font-family:var(--mono);font-size:11.5px;color:var(--ink2);padding:10px 6px;
      background:none;border:none;border-bottom:1px solid var(--rule);
      cursor:pointer;text-align:left;width:100%;text-decoration:underline}
.mais:hover{color:var(--accent)}
.nada{font-family:var(--serif);font-size:14px;color:var(--ink2);padding:18px 4px;
      line-height:1.55}
.ordena{display:flex;align-items:center;gap:6px}
.ordena select{font-size:12px;padding:4px 6px}

/* ─── abas ──────────────────────────────────────────────────────────────── */
.abas{display:flex;gap:0;border-bottom:1px solid var(--rule2);margin-bottom:18px}
.aba{font-family:var(--mono);font-size:12px;letter-spacing:.05em;
     text-transform:uppercase;padding:9px 15px;background:none;border:none;
     border-bottom:2px solid transparent;color:var(--ink3);cursor:pointer;
     margin-bottom:-1px}
.aba[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.aba:hover{color:var(--ink2)}

/* ─── gráficos ──────────────────────────────────────────────────────────── */
.quadro{border:1px solid var(--rule);background:var(--surface);padding:14px}
.quadro + .quadro{margin-top:16px}
.legenda{display:flex;flex-wrap:wrap;gap:14px;font-family:var(--mono);
         font-size:11px;color:var(--ink2);margin-top:10px}
.legenda span{display:flex;align-items:center;gap:5px}
.swatch{width:11px;height:11px;flex:none}
canvas{display:block;width:100%;cursor:crosshair}
svg{display:block;width:100%;overflow:visible}
.dica{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);
      font-family:var(--mono);font-size:11.5px;padding:6px 8px;line-height:1.45;
      z-index:40;max-width:260px;opacity:0;transition:opacity .1s}

/* ─── dossiê ────────────────────────────────────────────────────────────── */
.ficha{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;
       border-bottom:1px solid var(--rule2);padding-bottom:12px;margin-bottom:16px}
.ficha h2{font-size:25px;letter-spacing:-.015em;width:100%}
.dado{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.dado b{color:var(--ink);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:right;padding:6px 9px;border-bottom:1px solid var(--rule);
      font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
   color:var(--ink3);font-weight:400;border-bottom-color:var(--rule2)}
td:first-child,th:first-child{text-align:left}
.rolagem{overflow-x:auto}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;padding:1px 4px;
     border:1px solid currentColor;text-transform:uppercase}
.t-eleito{color:var(--accent)}
.t-parcial{color:var(--ink3)}

/* ─── nota de leitura ───────────────────────────────────────────────────── */
.notas{margin-top:26px;border-top:1px solid var(--rule2);padding-top:16px}
.notas summary{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
               text-transform:uppercase;color:var(--ink2);cursor:pointer}
.notas .corpo{font-family:var(--serif);font-size:15px;line-height:1.65;
              max-width:66ch;color:var(--ink2);margin-top:12px;
              display:flex;flex-direction:column;gap:11px}
.notas .corpo b{color:var(--ink)}
.vazio{font-family:var(--serif);font-size:17px;color:var(--ink2);padding:50px 0;
       max-width:50ch}

/* ─── controles do panorama ─────────────────────────────────────────────── */
.ferramentas{display:flex;gap:6px;align-items:center;margin-bottom:10px;
             flex-wrap:wrap}
.ferramentas .dizer{font-family:var(--mono);font-size:11px;color:var(--ink3);
                    margin-left:auto}
.bt{font-family:var(--mono);font-size:12px;padding:5px 10px;cursor:pointer;
    border:1px solid var(--rule2);background:var(--paper);color:var(--ink2);
    line-height:1;min-height:32px}
.bt:hover{border-color:var(--accent);color:var(--accent)}

/* ─── gaveta de filtros (só aparece em tela estreita) ───────────────────── */
.gaveta-bt{display:none}

@media (max-width:880px){
  /* minmax(0,1fr) e não 1fr: senão o conteúdo do rail que não encolhe (nomes
     longos, <select> de partido) estica a coluna e leva o gráfico junto para
     fora da tela */
  .tela{grid-template-columns:minmax(0,1fr)}
  /* em coluna única o panorama vem primeiro: o gráfico é o que a pessoa veio
     ver, e os filtros ficam logo abaixo dele em vez de empurrá-lo para fora
     da primeira tela */
  .palco{order:-1;padding:12px 12px 22px}
  /* o rail vira gaveta: fechado por padrão, para o resultado ficar à vista */
  .rail{position:static;max-height:none;border-right:none;
        border-top:1px solid var(--rule2);padding:12px 14px 18px;gap:13px}
  .rail[data-aberto="false"] .so-gaveta{display:none}
  .gaveta-bt{display:flex;align-items:center;justify-content:space-between;
             width:100%;font-family:var(--mono);font-size:12px;padding:9px 11px;
             border:1px solid var(--rule2);background:var(--paper);
             color:var(--ink);cursor:pointer;min-height:42px}
  .gaveta-bt b{color:var(--accent);font-weight:600}
  header{padding:13px 14px 11px}
  header h1{font-size:19px}
  header p{font-size:12.5px}
  .abas{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .aba{padding:10px 12px;font-size:11.5px;white-space:nowrap;flex:none}
  .quadro{padding:10px}
  .ficha h2{font-size:21px}
  /* alvo de toque decente nos chips e na lista */
  .chip{padding:7px 11px;font-size:12px}
  .item{padding:10px 6px}
  .busca{font-size:16px;padding:10px}   /* 16px evita o zoom automático do iOS */
  select{font-size:16px;padding:9px 8px}
  .check{padding:3px 0}
  .lista{max-height:none}
  .dica{display:none}                   /* no toque a dica atrapalha; usa o clique */
}
@media (max-width:520px){
  .legenda{gap:9px;font-size:10.5px}
  th,td{padding:5px 6px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.voltar-painel{display:inline-block;font-family:var(--mono);font-size:12px;
  color:var(--accent);padding:10px 22px 0;text-decoration:none}
.voltar-painel:hover{text-decoration:underline}
</style>
</head>
<body>
<a class="voltar-painel" href="/analises/bens-dos-candidatos/">&larr; voltar à análise</a>
<header>
  <div>
    <p class="selo">rodado · registros da justiça eleitoral</p>
    <h1>O que o mandato pagou</h1>
    <p>Patrimônio declarado por quem foi eleito deputado federal, contra o subsídio do cargo.</p>
  </div>
  <button class="tema" id="btnTema" type="button">tema</button>
</header>

<div class="tela">
  <aside class="rail" id="rail" data-aberto="false">
    <div class="grupo">
      <label class="rotulo" for="q">Buscar pessoa</label>
      <input class="busca" id="q" type="search" placeholder="nome ou sobrenome"
             autocomplete="off" enterkeyhint="search">
    </div>

    <button class="gaveta-bt" id="gaveta" type="button" aria-expanded="false"
            aria-controls="rail">
      <span>Filtros</span><b id="gavetaSelo">nenhum</b>
    </button>

    <div class="grupo so-gaveta">
      <span class="rotulo">Espectro</span>
      <div class="chips" id="fEspectro"></div>
    </div>

    <div class="grupo so-gaveta">
      <label class="rotulo" for="fPartido">Partido no último registro</label>
      <select id="fPartido"></select>
    </div>

    <div class="grupo so-gaveta">
      <label class="rotulo" for="fUf">Unidade da federação</label>
      <select id="fUf"></select>
    </div>

    <div class="grupo so-gaveta">
      <span class="rotulo">Recorte</span>
      <label class="check"><input type="checkbox" id="fEmpresa"> só quem é sócio de empresa</label>
      <label class="check"><input type="checkbox" id="fRegua"> só quem tem régua comparável</label>
      <label class="check"><input type="checkbox" id="fAcima"> só quem cresceu acima do subsídio</label>
    </div>

    <div class="contagem" id="contagem"></div>
    <button class="limpar so-gaveta" id="limpar" type="button">limpar filtros</button>

    <div class="grupo">
      <label class="rotulo" for="fOrdem">Resultados, ordenados por</label>
      <select id="fOrdem"></select>
      <div class="lista" id="lista"></div>
    </div>
  </aside>

  <main class="palco">
    <div class="abas" role="tablist">
      <button class="aba" role="tab" data-aba="panorama" aria-selected="true">Panorama</button>
      <button class="aba" role="tab" data-aba="dossie" aria-selected="false">Dossiê</button>
    </div>
    <div id="palcoConteudo"></div>

    <details class="notas">
      <summary>Como ler estes números</summary>
      <div class="corpo" id="notas"></div>
    </details>
  </main>
</div>

<div class="dica" id="dica"></div>
<script src="app.js"></script>
</body>
</html>
