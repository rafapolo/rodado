<title>Bens dos candidatos — rodado</title>
<meta name="description" content="Painel interativo com as declarações de bens de 1.025 pessoas já eleitas deputado federal — 4.000 declarações, de 2010 a 2026 — medidas contra o subsídio que o próprio cargo pagou. O crescimento mediano é 0,24 vez o salário do período, e 65% dos eleitos em 2018 declararam ao fim do mandato possuir menos do que ele lhes pagou. Dois terços são sócios de empresa — e 39,7% desses não põem a participação societária na declaração de bens, sendo 40 deles donos de capital social somado acima de R$ 1 milhão. Na outra ponta, 156 cresceram mais do que todo o subsídio recebido.">
