# Overlay do dsh para o harness do rodado.
#
#   bunx dsh --profile web --patch harness/dsh/rodado.patch.yml
#
# Duas coisas: apontar o modelo para o Gemma 4 local no beelink, e montar o
# mcp_server.py do projeto como servidor de ferramentas.

# --- modelo local -----------------------------------------------------------
# Rota declarada à mão: pi-ai não traz nada sob esta chave, então o perfil
# fornece o provider inteiro. llama-server fala openai-completions e ignora a
# chave de API, então `apiKeyEnv` fica de fora (rota não autenticada).
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      beelink-local:
        displayName: Gemma 4 26B-A4B (beelink)
        api: openai-completions
        # O llama-server não autentica e ignora o valor, mas o pi-ai exige a
        # referência: sem ela o boot morre com "No API key for provider". O README
        # do plugin diz que omitir deixa a rota não autenticada — vale para rota
        # do catálogo, não para rota declarada à mão.
        apiKeyEnv: HARNESS_LLM_KEY
        # O llama-server escuta em 127.0.0.1 no beelink — de propósito, para não
        # expor inferência na rede. Do mac, abra o túnel antes de rodar o dsh:
        #     ssh -f -N -L 8099:127.0.0.1:8099 beelink
        baseURL: http://127.0.0.1:8099/v1
        models:
          - id: gemma-4-26B-A4B-it-qat
            name: Gemma 4 26B-A4B q4_0 QAT
            # llama-server sobe com -c 32768; o modelo suporta 262k, mas o KV
            # a 262k não cabe junto do mirror na mesma máquina.
            contextWindow: 32768
            maxTokens: 4096
            # `false` declara um modelo NÃO-raciocinante — nenhum parâmetro de
            # thinking vai na requisição. É o que vale 28x aqui: com thinking
            # ligado o Gemma gastou 1.200 tokens e 94,8 s sem produzir SQL
            # nenhuma; desligado, 3,4 s com a query completa (medido 2026-09-01).
            #
            # Declarar só `off:` NÃO funciona: o plugin recusa com "offers no
            # level beyond off". E `--dump-config` não pega isso — ele valida a
            # composição do patch, não o carregamento do plugin. Só o boot pega.
            reasoningEfforts: false

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: beelink-local
    model: gemma-4-26B-A4B-it-qat

# --- ferramentas do espelho -------------------------------------------------
# `insert` (sem id) anexa entradas novas na raiz — patch com id só sobrepõe
# entrada existente, e este plugin não está no perfil base.
- insert:
    # O servidor MCP do harness (harness/mcp.ts), não o mcp_server.py.
    #
    # Dois motivos. Superfície: as docstrings do mcp_server.py somam 3.482 tokens
    # de nuance escrita para o Claude, que um 26B em q4 não aproveita e que
    # dilui o prompt — aqui são 4 ferramentas com descrição curta. E o portão:
    # `consultar` valida antes de executar, e a REJEIÇÃO VOLTA COMO RESULTADO DA
    # FERRAMENTA. É isso que faz o laço agêntico do dsh virar o mecanismo de
    # reparo da SQL, com o log de sessão junto — em vez de um retry escrito à mão.
    - id: mcp-rodado
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rodado
        transport: stdio
        command: bun
        args:
          - harness/mcp.ts
        cwd: .
        env:
          BEELINK_HOST: beelink

# --- desliga o que contorna o portão -----------------------------------------
# Medido em 2026-09-02: o modelo descobriu a ferramenta `bash` do perfil e
# escreveu `ssh beelink '~/bin/duckdb -readonly ...'` direto, passando por cima
# do `consultar` e portanto do portão inteiro — sem checagem de partição, de
# codificação de CID nem de tabela aposentada. Todo o trabalho de validação vira
# decoração se o modelo tem shell.
#
# O mesmo vale para leitura de arquivo: o espelho tem 38 bilhões de linhas e o
# caminho para elas é o `consultar`, não o sistema de arquivos.
#
# Efeito colateral bom: a superfície de ferramenta encolhe, e um 26B em q4
# escolhe melhor entre 4 ferramentas do que entre vinte.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-web
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: skill-badge
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true

# --- a prosa cita o órgão, não a ferramenta ----------------------------------
# backlog.md item 3. A convenção de pages/analises/results/ é citar o ÓRGÃO de
# origem do dado (Ministério da Saúde/SIM, IBGE, RAIS...) — nunca a tabela, o
# dataset ou o SQL. A instrução sozinha é do tipo que o modelo obedece na
# maioria das vezes; `revisar_resposta` (harness/mcp.ts, checaCitacaoTabela em
# portao.ts) é a metade que transforma "maioria" em "todas" — mesmo mecanismo
# do portão de SQL: a rejeição volta como resultado de ferramenta.
- id: system-prompt
  config:
    persona: >-
      Você apura dados públicos brasileiros pelo espelho do projeto rodado,
      usando as ferramentas do servidor MCP "rodado". Você opera sozinho, sem
      humano disponível para aprovar passos — NUNCA pare a resposta num plano
      de investigação esperando confirmação ("aguardando aprovação",
      "próximo passo: executar..."). Execute as consultas direto, uma após a
      outra, até ter o número final; um plano sem execução não é resposta.
      Escreva a resposta final em português, citando o ÓRGÃO de origem do
      dado (ex.: Ministério da Saúde/SIM, IBGE, RAIS/CAGED do Ministério do
      Trabalho) — NUNCA o nome da tabela, do dataset ou o SQL usado. Antes de
      responder ao usuário, chame a ferramenta revisar_resposta com o
      parágrafo pronto; só entregue a resposta depois que ela aprovar.
