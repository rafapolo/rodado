- id: igpm_2022_mes_trocado
  origem: br_fgv_igp (achado 2026-10-20, sem gotcha ainda)
  pergunta: Qual foi a variação acumulada do IGP-M em 2022, em percentual?
  # igp_m_ano termina em 2021; 2022 só existe em igp_m_mes, com ano e mes trocados (ano = 12, mes = 2022)
  sql: SELECT variacao_acumulada_ano AS v FROM br_fgv_igp.igp_m_mes WHERE mes = 2022 AND ano = 12
  sql2: SELECT (exp(sum(ln(1 + variacao_mensal / 100))) - 1) * 100 AS v FROM br_fgv_igp.igp_m_mes WHERE mes = 2022
  tol: "0,05"

- id: igpm_2020
  origem: br_fgv_igp/ano_e_mes_trocados
  pergunta: Qual foi a variação acumulada do IGP-M em 2020, em percentual?
  sql: SELECT variacao_anual AS v FROM br_fgv_igp.igp_m_ano WHERE ano = 2020
  # nas tabelas *_mes, ano e mes vêm trocados (ano = 12, mes = 2020) — medido 2026-10-20
  sql2: SELECT (exp(sum(ln(1 + variacao_mensal / 100))) - 1) * 100 AS v FROM br_fgv_igp.igp_m_mes WHERE mes = 2020
  tol: "0,05"

- id: educacao_especial_comuns_2024
