- id: sinan_dengue_menor1ano_2024
  origem: br_ms_sinan/dengue_idade_com_unidade
  pergunta: Quantos casos prováveis de dengue em bebês com menos de 1 ano de idade o Brasil teve em 2024?
  sql: |
    SELECT count(*) AS v FROM br_ms_sinan.microdados_dengue
