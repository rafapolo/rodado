- id: estoque_divida_out2022
  origem: br_me_estoque_divida_publica/carteira_do_banco_central
  pergunta: Qual era o estoque da dívida pública federal em poder do mercado em outubro de 2022, em reais?
  # somar todas as carteiras inclui R$ 2,07 tri da carteira do Banco Central, que não é estoque em mercado — medido 2026-10-20
  sql: SELECT sum(valor_estoque) AS v FROM br_me_estoque_divida_publica.microdados WHERE ano = 2022 AND mes = 10 AND classe_carteira = 'Mercado'
  sql2: |
    SELECT sum(s) AS v FROM (SELECT tipo_divida, sum(valor_estoque) AS s FROM br_me_estoque_divida_publica.microdados
    WHERE ano = 2022 AND mes = 10 AND classe_carteira = 'Mercado' GROUP BY tipo_divida)
  armadilha: 7850221979085
  tol: 0,1%

- id: inss_aposentadoria_idade_dez2024
  origem: br_mps_beneficios/rotulo_truncado
  pergunta: Quantas aposentadorias por idade o INSS mantinha em dezembro de 2024?
  sql: |
    SELECT sum(quantidade) AS v FROM br_mps_beneficios.beneficio_mantido_municipio_mes
    WHERE ano = 2024 AND mes = 12 AND especie_beneficio_rotulo ILIKE 'Aposentadoria por Id%'
  # o rótulo vem truncado em 20 caracteres e especie_beneficio é NULL nessas linhas; 'Aposent. por Idade%' pega 386 — medido 2026-10-20
  armadilha: 386
  sql2: |
    SELECT sum(s) AS v FROM (SELECT clientela, sum(quantidade) AS s FROM br_mps_beneficios.beneficio_mantido_municipio_mes
    WHERE ano = 2024 AND mes = 12 AND especie_beneficio_rotulo ILIKE 'Aposentadoria por Id%' GROUP BY clientela)

