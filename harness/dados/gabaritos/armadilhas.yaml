  pergunta: Quantos fundos de investimento estão em funcionamento normal no cadastro da CVM?
  # a tabela antiga `fundos` (pré-RCVM 175) dá 22, e registro_fundo tem 686 linhas repetidas (34.454) — medido 2026-10-20
