- id: pep_2025_dez
  origem: br_mp_pep
  pergunta: Quantos cargos comissionados executivos (CCE) estavam ocupados no governo federal em dezembro de 2025?
  sql: SELECT max(ano * 100 + mes) / 100 AS v FROM br_mp_pep.cargos_funcoes WHERE mes = 12
  sem_dado_ano: 2025
