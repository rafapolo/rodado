# Perguntas cuja resposta certa é "o espelho não tem esse dado" (gabarito SEM_DADO).
# `sem_dado_ano`: o ano pedido fica fora da faixa medida por `sql` (max(ano), ou min com `antes`).
# `vazio: true`: `sql` conta o que existiria (coluna preenchida, país presente) e tem de dar 0.

- id: srag_sexo_vazio
  origem: br_ms_sinan/srag_sexo_vazio
  pergunta: Quantos casos de SRAG notificados no SINAN foram em mulheres?
  sql: SELECT count(sexo) AS v FROM br_ms_sinan.microdados_influenza_srag
  vazio: true

- id: pirls_brasil
  origem: world_iea_pirls/sem_brasil
  pergunta: Qual foi a pontuação média dos alunos brasileiros no PIRLS?
  sql: SELECT count(*) FILTER (WHERE country_iso3_code IN ('BRA', '076', '76')) AS v FROM world_iea_pirls.student_achievement
  vazio: true

- id: compras_mgi_2025
  origem: br_mgi_compras_publicas/compras_terminam_em_2024
  pergunta: Quantos itens de licitação o governo federal homologou em 2025, segundo os dados de compras públicas?
  sql: SELECT max(ano) AS v FROM br_mgi_compras_publicas.licitacao_item
  sem_dado_ano: 2025

- id: firjan_ifgf_2024
  origem: br_firjan_ifgf
  pergunta: Qual foi o Índice Firjan de Gestão Fiscal de Niterói em 2024?
  sql: SELECT max(ano) AS v FROM br_firjan_ifgf.ranking
  sem_dado_ano: 2024

