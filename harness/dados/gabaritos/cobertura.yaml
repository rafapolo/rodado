- id: filiados_regulares
  origem: br_tse_filiacao_partidaria
  pergunta: Quantas filiações partidárias regulares havia no Brasil na extração mais recente do TSE?
  sql: |
    SELECT count(*) AS v FROM br_tse_filiacao_partidaria.microdados
    WHERE situacao_registro = 'Regular' AND data_extracao = (SELECT max(data_extracao) FROM br_tse_filiacao_partidaria.microdados)
  sql2: |
    SELECT sum(n) AS v FROM (SELECT sigla_partido, count(*) AS n FROM br_tse_filiacao_partidaria.microdados
    WHERE situacao_registro = 'Regular' AND data_extracao = (SELECT max(data_extracao) FROM br_tse_filiacao_partidaria.microdados) GROUP BY 1)

