- id: transferegov_planos_repasse
  origem: br_transferegov
  pergunta: Qual é o valor total de repasses previsto nos planos de ação das transferências especiais registrados no Transferegov, em reais?
  sql: SELECT sum(valor_total_repasse_plano_acao) AS v FROM br_transferegov.planos_acao
  sql2: |
    SELECT sum(coalesce(valor_repasse_emenda_plano_acao, 0) + coalesce(valor_repasse_especifico_plano_acao, 0)
             + coalesce(valor_repasse_voluntario_plano_acao, 0)) AS v FROM br_transferegov.planos_acao
