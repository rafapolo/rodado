# Uma ou duas perguntas por dataset que nenhum TSV nem gotcha cobria. A segunda via
# (`sql2`) chega ao mesmo número por outro caminho: outra tabela, as partes que somam o
# todo, ou a decomposição por UF/mês. Holdout: nenhuma nota do harness foi escrita daqui.
# Valores em texto com vírgula decimal: x.

- id: abrinq_pre_escola_2019
  origem: br_abrinq_oca
  pergunta: Quantas crianças estavam matriculadas na pré-escola no Brasil em 2019, somando os municípios, segundo o Observatório da Criança e do Adolescente da Abrinq?
  sql: SELECT sum(numero_absoluto_bruto_matricula_pre_escola) AS v FROM br_abrinq_oca.municipio_primeira_infancia WHERE ano = 2019
  sql2: |
    SELECT sum(s) AS v FROM (SELECT substr(id_municipio, 1, 2) AS uf, sum(numero_absoluto_bruto_matricula_pre_escola) AS s
    FROM br_abrinq_oca.municipio_primeira_infancia WHERE ano = 2019 GROUP BY 1)

- id: ana_esgoto_vazao_total
  origem: br_ana_atlas_esgotos
  pergunta: Segundo o Atlas Esgotos da ANA, qual é a vazão total de esgoto gerada nas áreas urbanas dos municípios brasileiros, em litros por segundo?
  sql: SELECT sum(vazao_total) AS v FROM br_ana_atlas_esgotos.municipio
  sql2: |
    SELECT sum(vazao_sem_coleta_sem_tratamento + vazao_solucao_individual + vazao_com_coleta_sem_tratamento + vazao_com_coleta_com_tratamento) AS v
    FROM br_ana_atlas_esgotos.municipio
  tol: 1%

