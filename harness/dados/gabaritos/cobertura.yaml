- id: pep_cce_dez2023
  origem: br_mp_pep
  pergunta: Quantos cargos comissionados executivos e funções comissionadas executivas (CCE e FCE) estavam ocupados no Executivo federal em dezembro de 2023?
  # DAS some com a troca por CCE/FCE: 6.663 em dez/2022, 16 em dez/2023 — medido 2026-10-20
  sql: SELECT sum(cce_e_fce) AS v FROM br_mp_pep.cargos_funcoes WHERE ano = 2023 AND mes = 12
  sql2: |
    SELECT sum(s) AS v FROM (SELECT sexo, sum(cce_e_fce) AS s FROM br_mp_pep.cargos_funcoes
    WHERE ano = 2023 AND mes = 12 GROUP BY sexo)


- id: esf_cobertura_dez2020
  origem: br_ms_atencao_basica
  pergunta: Qual era a cobertura populacional da Estratégia Saúde da Família no Brasil em dezembro de 2020, em percentual?
  sql: |
    SELECT 100.0 * sum(populacao_coberta_estrategia_saude_familia) / sum(populacao) AS v
    FROM br_ms_atencao_basica.municipio WHERE ano = 2020 AND mes = 12
  sql2: |
    SELECT sum(proporcao_cobertura_estrategia_saude_familia * populacao) / sum(populacao) AS v
    FROM br_ms_atencao_basica.municipio WHERE ano = 2020 AND mes = 12
  tol: "0,2"
  casas: 1

