- id: mapbiomas_floresta_2023
  origem: br_mapbiomas_estatisticas
  pergunta: Quantos hectares de floresta o Brasil tinha em 2023, segundo o MapBiomas?
  sql: SELECT sum(area_ha) AS v FROM br_mapbiomas_estatisticas.cobertura_municipio_classe WHERE ano = 2023 AND classe_nivel_1 = '1. Forest'
  sql2: |
    SELECT sum(s) AS v FROM (SELECT bioma, sum(area_ha) AS s FROM br_mapbiomas_estatisticas.cobertura_municipio_classe
    WHERE ano = 2023 AND classe_nivel_1 = '1. Forest' GROUP BY bioma)
  tol: 0,1%

- id: snis_agua_2022
  origem: br_mdr_snis
  pergunta: Quantas pessoas eram atendidas por abastecimento de água no Brasil em 2022, segundo o SNIS?
  sql: SELECT sum(populacao_atendida_agua) AS v FROM br_mdr_snis.municipio_agua_esgoto WHERE ano = 2022
  sql2: |
    SELECT sum(s) AS v FROM (SELECT sigla_uf, sum(populacao_atendida_agua) AS s FROM br_mdr_snis.municipio_agua_esgoto
    WHERE ano = 2022 GROUP BY sigla_uf)

- id: cadunico_familias_dez2024
  origem: br_mds_cadunico
  pergunta: Quantas famílias estavam inscritas no Cadastro Único em dezembro de 2024?
  sql: |
    SELECT sum(valor) AS v FROM br_mds_cadunico.indicadores_municipio
    WHERE id_indicador = '00cf548d54db' AND referencia = DATE '2024-12-01'
  sql2: |
    SELECT sum(s) AS v FROM (SELECT substr(id_municipio, 1, 2) AS uf, sum(valor) AS s FROM br_mds_cadunico.indicadores_municipio
    WHERE id_indicador = '00cf548d54db' AND referencia = DATE '2024-12-01' GROUP BY 1)

- id: comex_exportacao_2024
