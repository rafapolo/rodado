- id: consumo_energia_2023
  origem: br_mme_consumo_energia_eletrica
  pergunta: Qual foi o consumo total de energia elétrica no Brasil em 2023, em MWh, segundo a EPE?
  sql: SELECT sum(consumo) AS v FROM br_mme_consumo_energia_eletrica.uf WHERE ano = 2023 AND tipo_consumo = 'Total'
  sql2: |
    SELECT sum(consumo) AS v FROM br_mme_consumo_energia_eletrica.uf
