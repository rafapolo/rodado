<meta charset="utf-8"><title>paridade</title>
<pre id="out">carregando…</pre>
<script type="module">
const out = document.getElementById("out");
const log = (s) => (out.textContent += "\n" + s);
try {
  const { pipeline, env } = await import("./vendor/transformers.js");
  env.allowLocalModels = false;
  out.textContent = "baixando modelo…";
  const pipe = await pipeline("feature-extraction", "Xenova/paraphrase-multilingual-MiniLM-L12-v2", { dtype: "q8" });
  const casos = await fetch("./_paridade.json").then(r => r.json());
  const cos = (a,b) => { let d=0,na=0,nb=0; for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]**2;nb+=b[i]**2;} return d/(Math.sqrt(na)*Math.sqrt(nb)); };
  let min = 1;
  out.textContent = "";
  for (const c of casos) {
    const v = (await pipe(c.text, { pooling: "mean", normalize: true })).data;
    const s = cos(Array.from(v), c.embedding);
    min = Math.min(min, s);
    log(`${s.toFixed(4)}  ${c.id}`);
  }
  log(`MIN=${min.toFixed(4)}`);
  window.__min = min;
  window.__done = true;
} catch (e) { log("ERRO: " + e.message); window.__done = true; window.__min = -1; }
</script>
