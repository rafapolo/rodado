<meta charset="utf-8"><title>bancada multi-tabela</title><pre id="out">…</pre>
<script type="module">
/**
 * Roda o conjunto dourado multi-tabela e mede, em quatro degraus:
 *   1 recuperou TODAS as tabelas esperadas?   (se falha aqui, o resto é sorte)
 *   2 o SQL cita 2+ tabelas?
 *   3 o SQL tem JOIN?
 *   4 executa e devolve dado não-nulo?
 * Separar os degraus é o ponto: diz SE o gargalo é a busca ou o modelo.
 *
 * ?k=8&modelo=3b&n=50&semllm=1
 */
const out=document.getElementById("out"), log=s=>out.textContent+=s+"\n";
const P_=new URLSearchParams(location.search);
const K=+(P_.get("k")??8), NMAX=+(P_.get("n")??50), SEMLLM=P_.get("semllm")==="1";
const DECOMPOR=P_.get("decompor")==="1", GRAFO=P_.get("grafo")==="1";
const ESTRATEGIA=P_.get("estrategia")??"tabela";
const CONJUNTO=P_.get("conjunto")==="temas"?"temas":"multi";

/**
 * Uma pergunta de pesquisa e uma CONJUNCAO de aspectos ("mortalidade por raca"
 * E "indicadores socioeconomicos"), e cada aspecto mora numa tabela diferente.
 * Buscar a frase inteira devolve o centro de massa -- que nao e nenhuma delas.
 * Buscar cada aspecto e unir cobre as pontas com k pequeno por aspecto.
 */
function fatiar(q){
  const partes = q.split(/\s+(?:e|com|versus|vs\.?|,|;)\s+|\?\s*/i)
    .map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=3);
  return partes.length>1 ? partes : [q];
}
async function selecionarDecomposto(q, embed, lex, k){
  const fatias=fatiar(q);
  const porFatia=Math.max(2, Math.ceil(k/fatias.length));
  const vistos=new Map();
  for(const f of fatias){
    for(const t of await embed.selecionarHibrido(f, lex, porFatia)){
      const a=vistos.get(t.id);
      if(!a||a.score<t.score) vistos.set(t.id,t);
    }
  }
  return [...vistos.values()].sort((a,b)=>b.score-a.score).slice(0,k);
}

/**
 * Decomposição pelo LLM: parte a pergunta de pesquisa em aspectos AUTOCONTIDOS
 * (o regex quebrava por conjunção e produzia fatias sem sentido). Cada aspecto
 * busca suas próprias tabelas; o merge por score máximo une as pontas.
 */
async function selecionarDecompLLM(q, embed, lex, k, llm){
  const bruto=await llm.completar(
`Divida esta pergunta de pesquisa em 2 a 4 aspectos independentes. Cada aspecto deve ser uma frase curta e autocontida descrevendo um dado ou indicador (uma tabela de dados do governo brasileiro responde cada um). Um aspecto por linha, sem numeração, sem explicação.

Pergunta: ${q}`, {maxTokens:200});
  const fatias=[...bruto.split("\n").map(s=>s.replace(/^[-*\d.)\s]+/,"").trim()).filter(s=>s.length>8)];
  if(fatias.length<2) fatias.push(q);
  const vistos=new Map();
  for(const f of fatias.slice(0,4)){
    for(const t of await embed.selecionarHibrido(f, lex, Math.max(3, Math.ceil(k/Math.min(4,fatias.length))))){
      const a=vistos.get(t.id);
      if(!a||a.score<t.score) vistos.set(t.id,t);
    }
  }
  return [...vistos.values()].sort((a,b)=>b.score-a.score).slice(0,k);
}
try{
  const embed=await import("/embed.js"), lex=await import("/lexical.js");
  const P=await import("/prompt.js"), ask=await import("/ask.js"), llm=await import("/llm.js");
  await embed.carregar(({pct})=>out.textContent=`busca ${pct}%`);
  const cols=await ask.carregarColunas(embed.tabelas());
  await P.carregarSemantica();
  lex.indexar(embed.tabelas(), cols);
  if (GRAFO) embed.indexarGrafo(cols);
  if(!SEMLLM || ESTRATEGIA==="decomporllm"){ await llm.carregar(P_.get("modelo")??"1.5b",({pct,texto})=>{out.textContent=`llm ${pct}% ${texto??""}`;}); }
  out.textContent="";

  // temas: expectativa é de DATASET (>=1 tabela de cada citado); multi: tabela exata
  const {perguntas}=await fetch(CONJUNTO==="temas"?"/_douradas_temas.json":"/_douradas_multi.json").then(r=>r.json());
  const esperadosDe=(p)=>CONJUNTO==="temas"?p.datasets:p.tabelas;
  const cobrados=(ids,esperados)=>{ const ach=new Set(ids.map(t=>t.id));
    return CONJUNTO==="temas"
      ? esperados.filter(d=>ids.some(t=>t.id.startsWith(d+".")))
      : esperados.filter(t=>ach.has(t)); };
  const alvo=perguntas.slice(0,NMAX);
  let recallTudo=0,recallParcial=0,multi=0,comJoin=0,executou=0,comDado=0;
  const linhas=[];

  // modo diagnostico: rank de CADA tabela esperada no híbrido (h) vs com grafo (g)
  if(P_.get("diag")==="1"){
    for(const p of alvo){
      const hib=await embed.selecionarHibrido(p.q,lex,50);
      const grf=GRAFO?await embed.selecionarComGrafo(p.q,lex,50):hib;
      const rh=new Map(hib.map((t,i)=>[t.id,i+1]));
      const rg=new Map(grf.map((t,i)=>[t.id,i+1]));
      const det=esperadosDe(p).map(e=>{ const alvo=CONJUNTO==="temas"?`${e}.`:e;
        const h=rh.get(alvo)??[...rh.entries()].find(([k])=>alvo.endsWith(".")?k.startsWith(alvo):k===alvo)?.[1];
        const g=rg.get(alvo)??[...rg.entries()].find(([k])=>alvo.endsWith(".")?k.startsWith(alvo):k===alvo)?.[1];
        return `${alvo.replace(/\.$/,"").split(".").pop().slice(0,26)} h${h??"-"} g${g??"-"}`;}).join(" | ");
      linhas.push(`${String(p.n).padStart(2)} ${det}`);
      out.textContent=linhas.join("\n");
    }
    window.__done=true;
  } else {

  for(const p of alvo){
    const top = ESTRATEGIA==="decomporllm" ? await selecionarDecompLLM(p.q, embed, lex, K, llm)
                         : DECOMPOR ? await selecionarDecomposto(p.q, embed, lex, K)
                         : GRAFO ? await embed.selecionarComGrafo(p.q, lex, K)
                         : ESTRATEGIA==="dataset" ? await embed.selecionarPorDataset(p.q, lex, K)
                         : ESTRATEGIA==="afinidade" ? await embed.selecionarComAfinidade(p.q, lex, K)
                         : await embed.selecionarHibrido(p.q, lex, K);
    const ids=top.map(t=>t.id);
    const achou=cobrados(top,esperadosDe(p));
    const tudo=achou.length===esperadosDe(p).length;
    if(tudo) recallTudo++; else if(achou.length) recallParcial++;

    let marca=`${tudo?"R+":achou.length?"R~":"R-"}(${achou.length}/${esperadosDe(p).length})`;
    if(!SEMLLM){
      try{
        const g=await llm.gerarSQL(P.montarPrompt(p.q, top, cols));
        if(g.sql){
          const c=ask.corrigirTabelas(g.sql, top); const sql=c?c.sql:g.sql;
          const nTab=new Set([...sql.matchAll(/\b(?:FROM|JOIN)\s+([\w]+\.[\w]+)/gi)].map(m=>m[1])).size;
          const temJoin=/\bJOIN\b/i.test(sql);
          if(nTab>=2) multi++;
          if(temJoin) comJoin++;
          const r=await fetch("/api/executar",{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({sql})}).then(x=>x.json());
          const vazio=!r.rows?.length||r.rows.every(l=>Object.values(l).every(v=>v===null||v===undefined));
          if(!r.erro) executou++;
          if(!r.erro&&!vazio) comDado++;
          marca+=` T${nTab}${temJoin?" JOIN":"    "} ${r.erro?"ERRO":vazio?"vazio":"dado"}`;
        } else marca+=` ${g.erro?.slice(0,28)}`;
      }catch(e){ marca+=` falhou:${e.message.slice(0,24)}`; }
    }
    linhas.push(`${String(p.n).padStart(2)} ${marca}  ${p.q.slice(0,52)}`);
    out.textContent=linhas.join("\n");
  }
  const n=alvo.length, pc=x=>`${x}/${n} (${Math.round(100*x/n)}%)`;
  log(`\n${"=".repeat(58)}`);
  log(`recuperou TODOS os ${CONJUNTO==="temas"?"datasets":"alvos"} (k=${K}): ${pc(recallTudo)}   parcial: ${recallParcial}`);
  if(!SEMLLM){
    log(`SQL com 2+ tabelas:                 ${pc(multi)}`);
    log(`SQL com JOIN:                       ${pc(comJoin)}`);
    log(`executou sem erro:                  ${pc(executou)}`);
    log(`devolveu dado não-nulo:             ${pc(comDado)}`);
  }
  }
}catch(e){ log("ERRO: "+e.message+"\n"+(e.stack??"").slice(0,500)); }
window.__done=true;
</script>
