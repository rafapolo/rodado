<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rodado · perguntar</title>
<link rel="stylesheet" href="./ask.css">
</head>
<body>
<main>
  <h1>rodado · perguntar</h1>
  <p class="sub">Pergunte em português. O modelo roda no seu navegador; o dado vem do beelink.</p>

  <div class="barra">
    <textarea id="q" rows="2" placeholder="Quantos óbitos por município em Pernambuco em 2020?" autofocus></textarea>
    <button id="ir" disabled>Perguntar</button>
  </div>
  <div class="linha-cfg">
    <label>modelo
      <select id="modelo">
        <option value="1.5b">1,5 B — rápido (1,1 GB)</option>
        <option value="3b" selected>3 B — equilíbrio (2,0 GB)</option>
        <option value="7b">7 B — melhor (4,5 GB)</option>
      </select>
    </label>
    <button id="carregar" style="background:none;border:1px solid var(--rule);color:var(--ink-soft);font-weight:400;padding:.35rem .6rem;font-size:.8rem">carregar modelo</button>
    <span id="cfg"></span>
  </div>

  <div class="hist" id="hist"></div>
  <div class="status" id="status"></div>

  <div class="bloco" id="b-tabelas" hidden><h2>Tabelas escolhidas</h2><div class="tabelas" id="tabelas"></div></div>
  <div class="bloco" id="b-sql" hidden><h2>SQL</h2><div id="sql"></div></div>
  <div class="bloco" id="b-prosa" hidden><h2>Resposta</h2><p class="prosa" id="prosa"></p></div>
  <div class="bloco" id="b-gr" hidden><h2>Gráfico</h2><canvas id="gr"></canvas></div>
  <div class="bloco" id="b-tab" hidden><h2>Resultado</h2><div id="tab"></div></div>
  <div class="bloco" id="b-erro" hidden><h2>Erro</h2><div class="erro" id="erro"></div></div>
</main>

<script type="module">
import * as embed from "./embed.js";
import * as llm from "./llm.js";
import * as P from "./prompt.js";
import * as ask from "./ask.js";
import * as render from "./render.js";
import { desenhar } from "./chart.js";

const $ = (id) => document.getElementById(id);
const mostrar = (id, v = true) => ($("b-" + id).hidden = !v);
const status = (h) => ($("status").innerHTML = h);
const historico = [];

function limpar() {
  for (const b of ["tabelas", "sql", "prosa", "gr", "tab", "erro"]) mostrar(b, false);
}

// ---- boot: embedding primeiro; ele sozinho já é útil ----------------------
status("carregando índice e modelo de busca…");
try {
  const n = await embed.carregar(({ pct }) => status(`baixando modelo de busca… <b>${pct}%</b>`));
  await ask.carregarColunas(embed.tabelas());
  await P.carregarSemantica();
  $("ir").disabled = false;
  status(`${n} tabelas indexadas. ` + (llm.temWebGPU()
    ? "Carregue um modelo para gerar SQL, ou pergunte já para ver as tabelas relevantes."
    : "<b>Sem WebGPU</b> — este navegador não gera SQL. Use Chrome ou Edge; as tabelas relevantes ainda funcionam."));
  $("carregar").disabled = !llm.temWebGPU();
} catch (e) {
  status(`falha ao carregar o índice: ${e.message}`);
}

$("carregar").onclick = async () => {
  $("carregar").disabled = true;
  try {
    await llm.carregar($("modelo").value, ({ texto, pct }) =>
      status(`carregando modelo… <b>${pct}%</b> ${texto ?? ""}`));
    status("modelo pronto.");
    $("cfg").textContent = llm.modeloAtual();
  } catch (e) { status(`falha ao carregar o modelo: ${e.message}`); $("carregar").disabled = false; }
};

async function perguntar(texto) {
  const pergunta = (texto ?? $("q").value).trim();
  if (!pergunta) return;
  $("q").value = pergunta;
  limpar(); $("ir").disabled = true;
  if (!historico.includes(pergunta)) {
    historico.unshift(pergunta);
    $("hist").innerHTML = "";
    for (const h of historico.slice(0, 6)) {
      const b = document.createElement("button");
      b.textContent = h.length > 46 ? h.slice(0, 45) + "…" : h;
      b.onclick = () => perguntar(h);
      $("hist").append(b);
    }
  }

  let ultimas = null;
  const t0 = performance.now();
  await ask.perguntar(pergunta, (ev, d) => {
    if (ev === "fase") status({
      embedando: "escolhendo tabelas…", gerando: "escrevendo o SQL…",
      reparando: `corrigindo o SQL (tentativa ${d.tentativa})…`,
      executando: "consultando o beelink…", explicando: "redigindo a resposta…",
    }[d.nome] ?? d.nome);

    if (ev === "tier1") status(d.caiu
      ? `métrica <b>${d.metrica}</b> reconhecida, mas ${d.caiu} — indo para o modelo…`
      : `métrica <b>${d.metrica}</b> resolvida sem o modelo.`);

    if (ev === "tabelas") {
      mostrar("tabelas");
      $("tabelas").innerHTML = "";
      for (const t of d) {
        const c = document.createElement("span");
        c.className = "chip" + (t.duplicada ? " dup" : "");
        c.innerHTML = `${t.id}<span class="s">${t.score.toFixed(2)}</span>`;
        const notas = [];
        if (t.via) notas.push(`casou com: "${t.via}"`);
        if (t.duplicada) notas.push("Devolve toda linha duas vezes — precisa de SELECT DISTINCT.");
        if (notas.length) c.title = notas.join("\n");
        $("tabelas").append(c);
      }
    }

    if (ev === "reparo") status(`${d.local ? "coluna inexistente" : "o DuckDB recusou"} — corrigindo (${d.tentativa}/2)…`);

    if (ev === "sql") { mostrar("sql"); render.sql($("sql"), d.sql, d.origem); }

    if (ev === "linhas") {
      ultimas = d;
      mostrar("tab"); render.tabela($("tab"), d.colunas, d.rows);
      if (d.truncado) $("tab").insertAdjacentHTML("beforeend",
        `<p class="origem">${d.note ?? `mostrando ${d.returned} de ${d.total} linhas`}</p>`);
      if (d.rewrittenTables?.length) $("tab").insertAdjacentHTML("beforeend",
        `<p class="origem">lido direto do parquet: ${d.rewrittenTables.join(", ")}</p>`);
    }

    if (ev === "prosa") { mostrar("prosa"); $("prosa").textContent = d.texto; }

    if (ev === "grafico" && ultimas?.rows?.length) {
      mostrar("gr");
      if (!desenhar($("gr"), d, ultimas.rows)) mostrar("gr", false);
    }

    if (ev === "erro") {
      mostrar("erro");
      $("erro").textContent = d.mensagem;
      status(`parou em: ${d.fase}`);
    }

    if (ev === "fim") status(`pronto em ${((performance.now() - t0) / 1000).toFixed(1)}s`);
  });
  $("ir").disabled = false;
}

$("ir").onclick = () => perguntar();
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) perguntar();
});
</script>
</body>
</html>
