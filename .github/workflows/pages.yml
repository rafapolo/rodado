name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # /analises/shutafut é buscado do repo rafapolo/shutafut a cada deploy;
  # o cron garante que mudanças lá cheguem aqui mesmo sem push no rodado.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout shutafut
        uses: actions/checkout@v4
        with:
          repository: rafapolo/shutafut
          path: pages/analises/shutafut
      - name: Remove arquivos não-públicos do shutafut
        run: |
          cd pages/analises/shutafut
          rm -rf .git .github node_modules generate.js package.json bun.lock
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pages'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
