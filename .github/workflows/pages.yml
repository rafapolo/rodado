name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # /analises/shutafut e /analises/patrimonio são buscados dos repos
  # rafapolo/shutafut e rafapolo/tse-bens a cada deploy. O push no tse-bens
  # aciona este workflow via repository_dispatch (workflow "Aciona o deploy
  # no rodado" daquele repositório), então não precisa esperar um cron.
  repository_dispatch:
    types: [tse-bens-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout shutafut
        uses: actions/checkout@v4
        with:
          repository: rafapolo/shutafut
          path: pages/analises/shutafut
      - name: Remove arquivos não-públicos do shutafut
        run: |
          cd pages/analises/shutafut
          rm -rf .git .github node_modules generate.js package.json bun.lock
      - name: Checkout tse-bens
        uses: actions/checkout@v4
        with:
          repository: rafapolo/tse-bens
          ref: ${{ github.event.client_payload.sha }}
          path: pages/analises/patrimonio
      - name: Remove arquivos não-públicos do tse-bens
        run: |
          cd pages/analises/patrimonio
          rm -rf .git .gitignore README.md screenshot.png
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pages'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
