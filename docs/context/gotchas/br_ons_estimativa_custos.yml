dataset: br_ons_estimativa_custos
gotchas:
  - id: sin_e_soma_dos_subsistemas
    resumo: "balanco_energia_subsistemas traz o SIN (Sistema Interligado Nacional) como um quinto subsistema, que já é a soma dos outros quatro. Somar tudo dobra o total; filtre id_subsistema = 'SIN' ou exclua-o."
    tabelas: [balanco_energia_subsistemas]
    colunas: [id_subsistema, subsistema]
    severidade: silencioso
    verificado: "2023, eólica: N 1,8 + NE 87,3 + S 5,7 + SE 0,1 = 94,9 TWh = SIN 94,9 TWh; 24 horas × 5 subsistemas = 120 linhas por dia — medido 2026-10-20"
  - id: geracao_vezes_1e8
    resumo: "As colunas de geração e carga vêm em MWmed × 10^8, como em br_ons_avaliacao_operacao: divida por 1e8 (a soma horária no ano dá MWh)."
    tabelas: [balanco_energia_subsistemas]
    colunas: [geracao_eolica_verificada, geracao_hidraulica_verificada, geracao_termica_verificada, geracao_fotovoltaica_verificada, carga_verificada]
    severidade: silencioso
    verificado: "2023, id_subsistema = 'SIN': sum(geracao_eolica_verificada) / 1e8 = 94,9 TWh, igual ao total de geracao_usina em br_ons_avaliacao_operacao (94,6 TWh) — medido 2026-10-20"
  - id: escala_1e8_so_em_parte_das_colunas
    resumo: "O ×10^8 vale para balanco_energia_subsistemas (todas as colunas, intercâmbio incluso), custo_marginal_operacao_semanal (as 4 colunas), custo_marginal_operacao_semi_horario e, no balanco_energia_subsistemas_dessem, só valor_demanda, usina_hidraulica_verificada e geracao_usina_termica_verificada. Não têm: eólica, fotovoltaica e pequenas usinas do dessem, nem custo_variavel_unitario (R$/MWh normal). Dividir a coluna errada por 1e8 zera o resultado."
    detalhe: >
      Médias medidas, antes de dividir. balanco (SIN, 2023): carga
      7,37e12, ou 73.702 MW depois de /1e8. dessem (NE): valor_demanda
      1,31e12, hidráulica 3,32e11, térmica 8,81e9 (todos /1e8), mas eólica
      992.136, fotovoltaica 248.579, pequena hidráulica 10.001 e pequena
      térmica 39.448 já em escala própria (unidade não documentada; não
      divida). CMO semanal do SE: média 2,07e10, ou R$ 206/MWh depois de
      /1e8; CMO semi-horário do SE em 2023: 6,60e8, ou R$ 6,6/MWh;
      custo_variavel_unitario: média 606, máximo 5.298 R$/MWh sem dividir.
    tabelas: [balanco_energia_subsistemas, balanco_energia_subsistemas_dessem, custo_marginal_operacao_semanal, custo_marginal_operacao_semi_horario, custo_variavel_unitario_usinas_termicas]
    colunas: [valor_demanda, usina_hidraulica_verificada, geracao_usina_termica_verificada, geracao_eolica_verificada, geracao_fotovoltaica_verificada, custo_marginal_operacao, custo_variavel_unitario]
    severidade: silencioso
    verificado: "balanco (SIN, 2023): carga 73.702 MW, hidráulica 50.471, térmica 8.239, eólica 10.923, fotovoltaica 4.885 e intercâmbio 817 depois de /1e8; dessem NE: valor_demanda 1.313.709.545.750 (13.137 MW), usina_hidraulica 332.437.676.822, térmica 8.811.745.708, eólica 992.136, fotovoltaica 248.579; CMO semanal SE 20.677.083.916 (206,8 R$/MWh) e CMO semi-horário SE 2023 660.386.396 (6,6 R$/MWh) depois de /1e8; custo_variavel_unitario média 605,6 — medido 2026-10-28"
