dataset: br_ibge_inpc
gotchas:
  - id: categorias_em_cinco_niveis_na_mesma_coluna
    resumo: "Nas tabelas mes_categoria_*, a coluna categoria mistura cinco níveis (índice geral, grupo como 'Alimentação e bebidas', subgrupo, item e subitem como 'Arroz') e o peso_mensal de dezembro/2023 soma 500,0, não 100: cada nível fecha em 100. Somar peso ou média de variação sem fixar o nível conta o mesmo gasto cinco vezes. Para o grupo use id_categoria de 1 dígito, para subgrupo 2, item 4 e subitem 7 dígitos."
    detalhe: >
      Exemplo (Brasil, dez/2023): 1 Alimentação e bebidas peso 23,94; 11 Alimentação no domicílio
      18,56; 1101 Cereais, leguminosas e oleaginosas 1,25; 1101002 Arroz 0,99 (variação em 12
      meses de 24,76%). O índice geral e a variação do conjunto estão em mes_brasil.
    tabelas: [mes_categoria_brasil, mes_categoria_rm, mes_categoria_municipio]
    colunas: [id_categoria, categoria, peso_mensal]
    severidade: silencioso
    verificado: "mes_categoria_brasil dez/2023: sum(peso_mensal) = 500,0; Arroz 0,99% de peso e +24,76% em 12 meses — medido 2026-11-04"
  - id: acumulado_confere_com_o_oficial
    resumo: "Em mes_brasil a variacao_doze_meses de dezembro confere com o INPC divulgado: 2020 = 5,45%, 2021 = 10,16%, 2022 = 5,93%, 2023 = 3,71%, 2024 = 4,77%, 2025 = 3,90%. As variações estão em percentual (3,71 = 3,71%), não em fração, e variacao_anual é o acumulado do ano até o mês (igual à de doze meses só em dezembro)."
    tabelas: [mes_brasil, mes_categoria_brasil]
    colunas: [variacao_mensal, variacao_anual, variacao_doze_meses]
    severidade: aviso
    verificado: "dez/2021: v12 = 10,16; dez/2022 = 5,93; dez/2023 = 3,71 = variacao_anual — medido 2026-11-04"
  - id: indice_com_buracos_e_base_de_moedas_antigas
    resumo: "mes_brasil começa em 1979-03 e mistura bases de moedas antigas no indice (1979-04 = 5,77e-09; 2023-12 = 6.954,74), então ele só serve para razão entre meses; dos 563 meses, 559 têm indice e 560 têm variacao_mensal, e os primeiros meses de 1979 trazem indice e variação em meses alternados (1979-03 sem indice, 1979-04 sem variação). Use a variação publicada em vez de recalcular a partir do indice nos anos 1979-1994."
    tabelas: [mes_brasil]
    colunas: [indice, variacao_mensal]
    severidade: silencioso
    verificado: "563 linhas de 1979-03 a 2026-03; count(indice) = 559; 1979-04 indice 5,7689e-09 e variação nula; recalculo difere da publicada em 1 de 558 meses — medido 2026-11-04"
  - id: municipio_so_9_cidades_desde_2020
    resumo: "mes_categoria_municipio cobre 9 municípios de 2020-01 a 2026-03 (não todas as capitais), e peso_mensal e variação ficam nulos em 1/3 das linhas (2023: 31.836 de 48.276). mes_categoria_rm cobre regiões metropolitanas de 2020 a 2026. A série nacional (mes_brasil) é a única longa."
    tabelas: [mes_categoria_municipio, mes_categoria_rm]
    colunas: [id_municipio, peso_mensal, variacao_mensal]
    severidade: silencioso
    verificado: "mes_categoria_municipio: 9 id_municipio, 446 categorias, 202001 a 202603; 2023: 48.276 linhas, 31.836 com peso — medido 2026-11-04"
