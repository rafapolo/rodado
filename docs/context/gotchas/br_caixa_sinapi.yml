dataset: br_caixa_sinapi
gotchas:
  - id: janela_de_24_meses
    resumo: "insumos tem só 24 meses (mes_referencia 2024-10 a 2026-09, VARCHAR 'aaaa-mm'); não há série longa de preço de construção nem anos anteriores a 2024-10."
    detalhe: >
      Todo mês tem as 27 UFs (90.896 a 99.151 linhas por mês) e 4.811 a 4.984
      insumos. O grão é (mes_referencia, uf, codigo_insumo), único em todas as
      2.258.550 linhas. Para deflacionar ou comparar com o INCC use só essa janela.
    tabelas: [insumos]
    colunas: [mes_referencia]
    severidade: silencioso
    verificado: "min/max mes_referencia 2024-10/2026-09; 2.258.550 linhas = 2.258.550 chaves (mes, uf, insumo) — medido 2026-11-04"
  - id: preco_representado_nao_coletado
    resumo: "origem_preco: 93,8% das linhas são 'CR' (preço representado, não coletado naquele estado/mês) e só 6,2% são 'C' (coletado); o preço de um insumo numa UF pequena costuma ser derivado."
    detalhe: >
      Quem lê preco_mediano como preço de mercado observado na UF/mês
      superestima a cobertura da coleta. Filtre origem_preco = 'C' se a pergunta
      exige preço coletado.
    tabelas: [insumos]
    colunas: [origem_preco, preco_mediano]
    severidade: silencioso
    verificado: "origem_preco CR 2.118.245, C 140.305 de 2.258.550 — medido 2026-11-04"
  - id: unidades_mistas_nao_agregar_entre_insumos
    resumo: "unidade tem 21 valores (UN, M, M2, KG, MES, H, L, M3, UNXMES, CENTO, MIL, 100M, 310ML, SC25KG...) e classificacao mistura equipamento de R$ 11 milhões (usina de asfalto) com material de centavos; AVG/SUM de preco_mediano entre insumos não tem sentido."
    detalhe: >
      Compare sempre o mesmo codigo_insumo entre meses ou UFs. A mediana por
      classificacao varia de R$ 1,12 (ESPECIAIS) a R$ 12.717 (EQUIPAMENTO
      AQUISIÇÃO). Máximo observado: R$ 11.064.504,55 (perfuratriz de estacas, RS,
      2025-02) e R$ 10.996.119,18 (usina de asfalto 150 t/h, SP), valores corretos,
      não erro.
    tabelas: [insumos]
    colunas: [preco_mediano, unidade, classificacao]
    severidade: silencioso
    verificado: "21 unidades distintas; medianas por classificacao de R$ 1,12 a 12.717,18; preco_mediano min 0,01 max 11.064.504,55 — medido 2026-11-04"
