dataset: br_anp_producao
gotchas:
  - id: vazao_diaria_media_do_mes
    resumo: "oleo/petroleo/agua em bbl/dia e gás em Mm³/dia são médias diárias do mês. Para a produção do mês, multiplique pelos dias do mês; para o ano, some os meses assim convertidos (somar as médias dá 30x menos)."
    detalhe: >
      Média de petroleo_bbl_dia somado por mês, em 2023: 3,40 milhões de bbl/dia (o número
      público da ANP). volume_gas_royalties_mm3_mes já é volume do mês: vale ~30x o
      gas_total_mm3_dia nos dois layouts, embora o cabeçalho da fonte tenha mudado de unidade.
    tabelas: [poco_mes]
    colunas: [petroleo_bbl_dia, oleo_bbl_dia, gas_total_mm3_dia, volume_gas_royalties_mm3_mes]
    severidade: silencioso
    verificado: "sum(petroleo_bbl_dia)/12 em 2023 = 3,40 M bbl/dia; 2015 = 2,44 M — medido 2026-11-27"
  - id: poco_mes_termina_2023
    resumo: "poco_mes vai de 2005-01 a 2023-12: a ANP não publica mais a produção por poço em arquivo (2024+ só na consulta com captcha). Para 2024 em diante, use as tabelas *_estado (até 2026-09)."
    tabelas: [poco_mes, producao_petroleo_estado]
    severidade: aviso
    verificado: "o arquivo de jan/2024 não existe na fonte — 2026-11-27"
  - id: poco_2005_duplicado_e_gas_zerado
    resumo: "Em 2005 há 5.374 poço-mês repetidos na fonte (mesmo óleo, gás diferente; ~0,2% a mais de óleo) e o gás de jan–jun/2005 vem quase zerado (~1% do total estadual). Para série de gás, comece em 2005-07 ou use a tabela estadual."
    tabelas: [poco_mes]
    colunas: [gas_total_mm3_dia]
    severidade: silencioso
    verificado: "relatado na coleta, conferido contra producao_gas_natural_estado — 2026-11-27"
  - id: pre_sal_subconjunto
    resumo: "pre_sal = true marca poços que a fonte lista também no arquivo de pré-sal, que é subconjunto do mar: não some pré-sal com mar, filtre por pre_sal dentro de ambiente = mar."
    tabelas: [poco_mes]
    colunas: [pre_sal, ambiente]
    severidade: silencioso
    verificado: "deduplicado na coleta (2020-11 repetia o mar inteiro no arquivo de pré-sal) — 2026-11-27"
  - id: soma_bate_com_estado
    resumo: "A soma de poco_mes por mês bate com producao_petroleo_estado (≤0,6%) e producao_gas_natural_estado (≤0,3%) em 216 meses de 2006 a 2023: use a estadual para totais e a por poço para detalhe."
    tabelas: [poco_mes, producao_petroleo_estado, producao_gas_natural_estado]
    severidade: aviso
    verificado: "216 meses conferidos — medido 2026-11-27"
