dataset: br_cgu_seguro_defeso
gotchas:
  - id: cpf_completado
    resumo: "A coluna de CPF mistura CPF completo (completado pelo projeto) e CPF mascarado. count(DISTINCT cpf) conta máscara como pessoa."
    detalhe: >
      O CPF mascarado da fonte foi trocado pelo completo só quando nome
      idêntico, dígitos visíveis e unicidade garantiam a pessoa
      (procedimento local, fora do repositório). O resto ficou
      mascarado: filtre regexp_full_match(col, '[0-9]{11}') para ter só os
      completos, e não trate a máscara como identificador — ela repete entre
      pessoas diferentes.
    tabelas: [seguro_defeso]
    colunas: [cpf_favorecido]
    severidade: silencioso
    verificado: "21.042.406 de 29.299.818 linhas completadas — medido 2026-10-07"
  - id: contar_por_nis
    resumo: "Conte pescadores por nis_favorecido (o CPF mistura completo e mascarado). O município vem do código SIAFI, que junta com o diretório como inteiro, como no Garantia-Safra."
    tabelas: [seguro_defeso]
    colunas: [nis_favorecido, codigo_municipio_siafi]
    severidade: aviso
    verificado: "2024: 1.112.240 pescadores, R$ 5,9 bi — medido 2026-10-22 (bragro)"
  - id: agregue_pela_pagamento
    resumo: "seguro_defeso é uma view (pagamento JOIN favorecido). Soma, contagem e agrupamento sem nome/CPF/NIS/RGP vão direto na pagamento: pela view o join custa ~9x mais."
    detalhe: >
      Desde 2026-10-22 a tabela é normalizada: favorecido guarda CPF, NIS,
      RGP e nome por linha com um favorecido_id inteiro, e pagamento guarda o
      mês com favorecido_id no lugar das quatro colunas. A view seguro_defeso
      devolve as mesmas colunas de antes, mas o DuckDB não elimina o join
      mesmo quando a consulta não usa a pessoa. count(DISTINCT favorecido_id)
      na pagamento conta combinações, não pescadores: para pescadores, conte
      nis_favorecido (ver contar_por_nis).
    tabelas: [seguro_defeso, pagamento, favorecido]
    colunas: [favorecido_id, valor_parcela]
    severidade: aviso
    verificado: "total por mês (161 meses, R$ 48,98 bi nos dois caminhos): 0,93 s pela view, 0,10 s na pagamento; 3.982.685 combinações (2.182.852 NIS distintos) para 43.418.500 pagamentos — medido 2026-10-26"
  - id: pescador_acima_de_10pct_da_populacao
    resumo: "140 municípios têm mais pescadores com seguro-defeso em 2024 que 10% da população, o máximo em Mocajuba/PA (14.730 para 28.821 habitantes, 51%). O espelho não tem o RGP ativo para dizer se é cadastro inflado ou pesca de fato: trate como outlier antes de tirar média."
    tabelas: [seguro_defeso, pagamento]
    colunas: [nis_favorecido, codigo_municipio_siafi]
    severidade: aviso
    verificado: "2024: 1.112.240 pescadores (nis_favorecido) em 3.240 municípios; população 2024 do IBGE; MA 4,9% e PA 3,3% da população do estado — medido 2026-11-04"
