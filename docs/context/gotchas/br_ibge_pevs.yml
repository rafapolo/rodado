dataset: br_ibge_pevs
gotchas:
  - id: silvicultura_so_tem_tudo_a_partir_de_2013
    resumo: "producao_silvicultura de 1986 a 2012 tem só 3 produtos (acácia-negra, resina, folha de eucalipto; ~150 linhas por ano); a madeira em tora, carvão e lenha de plantio entram em 2013 (7.076 linhas, 15 produtos). Série longa de silvicultura é artefato."
    detalhe: >
      O valor da silvicultura vai de R$ 0,14 bi (2010) para R$ 14,15 bi (2013)
      porque o conjunto de produtos mudou, não porque a atividade cresceu 100x.
      Compare silvicultura só de 2013 em diante (R$ 14,2 bi em 2013, 27,9 bi em
      2022, 31,7 bi em 2023, 37,2 bi em 2024). tipo_produto/subtipo_produto são
      nulos antes de 2013.
    tabelas: [producao_silvicultura]
    colunas: [ano, produto, valor, tipo_produto]
    severidade: silencioso
    verificado: "linhas por ano: 146 (2012) -> 7.076 (2013); produtos distintos 3 -> 15; soma de valor 0,13 -> 14,15 (milhões de mil R$) — medido 2026-11-04"
  - id: valor_em_mil_reais_e_zero_antes_de_1994
    resumo: "valor está em MIL reais: soma da silvicultura 2022 = 27,92 milhões de mil = R$ 27,9 bi. Em extração vegetal valor é 0 para 12.363 de 12.945 linhas de 1986 (moedas pré-Real não convertidas) e só vira série confiável de 1994 em diante."
    detalhe: >
      Extração vegetal: R$ 3,04 bi (1994), 4,19 bi (2010), 6,22 bi (2023), 7,03 bi
      (2024) somando valor x 1.000. 1986-1992 têm valor 0 em 94% a 99%
      das linhas, 1993 soma 0,11. valor é nulo em ~15 mil linhas (3%) e quantidade 0 em
      831 linhas de 2024. A chave (ano, município, produto) repete 415 vezes.
    tabelas: [producao_extracao_vegetal, producao_silvicultura]
    colunas: [valor, quantidade]
    severidade: silencioso
    verificado: "sum(valor) em milhões: extração 1986 = 0,00, 1993 = 0,11, 1994 = 3,04, 2023 = 6,22; silvicultura 2022 = 27,92; valor=0 em 12.363 de 12.945 linhas de 1986 — medido 2026-11-04"
  - id: unidades_misturadas_por_produto
    resumo: "quantidade está em m³ para lenha e madeira em tora (19,5 e 11,4 milhões em 2023) e em toneladas para erva-mate, carvão, açaí, castanha etc.; extração tem 40 produtos em 3 unidades. Não some quantidade entre produtos."
    detalhe: >
      tipo_produto só vem preenchido em 136.969 das 463.825 linhas de extração
      vegetal (29%): agrupe por produto, não por tipo_produto. A silvicultura tem
      dois pares produto 'lenha' e 'carvão' por espécie (eucalipto, pinus, outras).
    tabelas: [producao_extracao_vegetal, producao_silvicultura]
    colunas: [quantidade, unidade, tipo_produto]
    severidade: silencioso
    verificado: "2023 extração: Lenha 19.537.726 m³, Madeira em tora 11.393.636 m³, Erva-mate 425.837 t, Carvão vegetal 379.511 t; tipo_produto nn = 136.969 de 463.825 — medido 2026-11-04"
