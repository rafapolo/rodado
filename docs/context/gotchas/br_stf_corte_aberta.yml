dataset: br_stf_corte_aberta
gotchas:
  - id: linha_e_decisao_nao_processo
    resumo: "decisoes tem uma linha por decisão, e o mesmo processo (classe + numero) aparece em várias linhas: 2.708.849 linhas para bem menos processos (2022: 89.898 linhas, 74.955 processos distintos). Contar linhas conta decisões; para processos use count(DISTINCT classe, numero). Não há coluna de id único do processo: numero só vale junto da classe."
    tabelas: [decisoes]
    colunas: [classe, numero]
    severidade: silencioso
    verificado: "2022: 89.898 linhas, 74.955 pares classe+numero distintos; 2007: 165.151 e 147.375 — medido 2026-11-04"
  - id: serie_corta_em_2024
    resumo: "A série vai de 2000-01-03 a 2025-01-19, mas termina quebrada: 2023 acaba em 2023-09-26, 2024 em 2024-09-03 (72.731 linhas) e 2025 tem 1.068 linhas (até 19 de janeiro). Comparar 2023, 2024 e 2025 com anos cheios (89.898 em 2022) mede o corte do arquivo, não queda de decisões."
    tabelas: [decisoes]
    colunas: [ano, data_decisao]
    severidade: silencioso
    verificado: "max(data_decisao) 2023 = 2023-09-26, 2024 = 2024-09-03; linhas 2022 = 89.898, 2023 = 76.707, 2024 = 72.731, 2025 = 1.068 — medido 2026-11-04"
  - id: ano_e_o_da_decisao
    resumo: "ano é o ano de data_decisao (zero linhas com ano diferente), não o da autuação: processo antigo decidido hoje cai no ano da decisão. Há 7.809 decisões com data_decisao anterior à data_autuacao, que não devem entrar em cálculo de duração."
    tabelas: [decisoes]
    colunas: [ano, data_autuacao, data_decisao]
    severidade: silencioso
    verificado: "year(data_decisao) <> ano em 0 de 2.708.849 linhas; data_decisao < data_autuacao em 7.809 — medido 2026-11-04"
  - id: sem_chave_geografica
    resumo: "decisoes não tem nenhuma coluna de UF, município ou comarca: só classe (AI 783.110, ARE 779.138, RE 682.143, HC 198.463, Rcl 106.746...), relator e andamento. Não serve para recorte territorial sem outra tabela."
    tabelas: [decisoes]
    severidade: aviso
    verificado: "17 colunas, nenhuma geográfica; classes mais frequentes AI, ARE, RE, HC, Rcl — medido 2026-11-04"
