dataset: br_bd_vizinhanca
gotchas:
  - id: pares_nos_dois_sentidos
    resumo: "Cada divisa aparece duas vezes (A,B e B,A): 2020 tem 31.832 linhas para 15.916 divisas, e 522.866 pares têm o inverso presente. Contar linhas dobra o número de fronteiras; conte pares com id_municipio_1 < id_municipio_2, ou dividida por dois. Vale igual para uf (100 linhas = 50 divisas)."
    tabelas: [municipio, uf]
    colunas: [id_municipio_1, id_municipio_2]
    severidade: silencioso
    verificado: "municipio 2020: 31.832 linhas, 15.916 com id_1 < id_2, 5.568 municípios; 2019: 31.896 linhas e 5.570; uf 2010: 100 linhas, 50 com sigla_1 < sigla_2 — medido 2026-11-04"
  - id: sentinela_zero_e_na_nos_ids
    resumo: "Em anos antigos ids com sentinela: id_municipio '0' (27 linhas em 1940, 18 em 1991) e 'NA' (22 linhas em 1991, 4 delas ligando NA a NA), em vez de nulo. Filtre length(id_municipio_1) = 7 antes de juntar."
    tabelas: [municipio]
    colunas: [id_municipio_1, id_municipio_2]
    severidade: silencioso
    verificado: "1940: 27 linhas com id '0' contra 8.931 de 7 dígitos; 1991: 18 com '0', 22 com 'NA', 26.610 de 7 dígitos; de 2000 em diante todos de 7 dígitos — medido 2026-11-04"
  - id: ano_e_texto_de_malha
    resumo: "ano é texto e é o ano da malha municipal (1872, 1900, 1911, 1920, 1933, 1940, 1950, 1960, 1970, 1980, 1991, 2000, 2005, 2007, 2010, 2013-2020), não série contínua. Escolha o ano da malha do dado que vai cruzar: em 2000 há 5.504 municípios, em 2013 5.570 e em 2020 5.568."
    tabelas: [municipio, uf]
    colunas: [ano]
    severidade: aviso
    verificado: "municípios distintos por malha: 1872 639; 1940 1.574; 1991 4.490; 2000 5.504; 2010 5.564; 2013-2019 5.570; 2020 5.568 — medido 2026-11-04"
