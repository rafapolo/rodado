dataset: br_mps_beneficios
gotchas:
  - id: rotulo_truncado
    resumo: "especie_beneficio_rotulo vem cortado em 20 caracteres e especie_beneficio é NULL nas maiores espécies: filtre pelo rótulo truncado ('Aposentadoria por Id%')."
    detalhe: >
      Em dez/2024 as aposentadorias por idade (13,2 milhões) estão sob o rótulo
      'Aposentadoria por Id' com especie_beneficio NULL. Um filtro pelo nome
      oficial ('Aposent. por Idade%') acha um rótulo residual com 386
      benefícios — número plausível o bastante para passar.
    tabelas: [beneficio_mantido_municipio_mes, beneficio_concedido_municipio_mes]
    colunas: [especie_beneficio, especie_beneficio_rotulo]
    severidade: silencioso
    verificado: "dez/2024, mantidos: 'Aposentadoria por Id' = 13.165.773 (especie_beneficio NULL); 'Aposent. por Idade%' = 386 — medido 2026-10-20"
  - id: valor_total_so_de_2023_06
    resumo: "valor_total é NULL em 47% das linhas (todo 2021-07 a 2023-05) e em 2023-06 e 2023-07 vem inflado em BPC e auxílio-incapacidade: série de valor só vale de 2023-08."
    detalhe: >
      Em beneficio_mantido_municipio_mes, valor_total começa em 2023-06. Nesse mês o BPC soma
      R$ 49,09 bi (R$ 9.133 por benefício) contra R$ 7,25 bi em 2023-08 (R$ 1.318 por benefício,
      perto do salário mínimo), e o auxílio por incapacidade temporária R$ 13,74 bi
      contra R$ 1,72 bi; as demais categorias batem entre meses. O total do mês passa de R$ 70 bi
      a R$ 124 bi só em 06 e 07. A quantidade de benefícios não tem o problema.
    tabelas: [beneficio_mantido_municipio_mes]
    colunas: [valor_total]
    severidade: silencioso
    verificado: "valor_total NULL em 26.025.167 de 54.741.513 linhas (2021: 6.797.730; 2022: 13.549.357; 2023 meses 1 a 5: 5.678.080); total do mês R$ 124,22 bi em 2023-06 e 2023-07, R$ 70,57 bi em 2023-08, R$ 71,5 a 71,8 bi em 2023-10 a 12; valor médio por benefício 2023-06 R$ 3.262, 2023-08 R$ 1.839 — medido 2026-11-12"
  - id: mes_2023_07_copia_do_06
    resumo: "Em beneficio_mantido_municipio_mes, o mês 2023-07 repete a quantidade e o valor de 2023-06 em todas as 14 categorias: some um dos dois, nunca os dois."
    detalhe: >
      As linhas diferem em número (1.139.834 em 06 e 1.138.857 em 07), mas a soma de quantidade é
      a mesma por categoria (38.074.913 benefícios no total) e, onde as chaves casam, 912.023
      linhas têm quantidade e valor_total idênticos. Parece o arquivo de junho carregado também
      como julho (por dedução); o estoque real de 2023-07 não existe aqui. Contas de variação
      mês a mês passam a dar zero entre 06 e 07 e salto em 08.
    tabelas: [beneficio_mantido_municipio_mes]
    colunas: [ano, mes, quantidade, valor_total]
    severidade: silencioso
    verificado: "2023-06 e 2023-07: soma de quantidade igual (38.074.913) e igual por categoria em 14 de 14; 912.023 pares de linhas com a mesma chave, quantidade e valor_total — medido 2026-11-12"
