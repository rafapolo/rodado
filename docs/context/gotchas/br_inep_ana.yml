dataset: br_inep_ana
gotchas:
  - id: nivel_socio_economico_muda_de_codigo
    resumo: "nivel_socio_economico usa faixas de código diferentes nos dois únicos anos: 2014 vai de 8 a 14 e 2016 de 15 a 21, para os mesmos 7 rótulos. Comparar o código bruto entre anos ordena errado, em silêncio."
    detalhe: >
      Mapeie por posição: código - 7 (2014) ou código - 14 (2016) dá o nível 1 a 7.
      O campo é VARCHAR e é nulo em 9.159 linhas de 2014 e 9.392 de 2016 (escolas
      pequenas sem NSE), o que também zera as colunas escola_similar_* (79.523
      preenchidas de 98.074). A tabela só tem 2 edições (2014 e 2016); 49.357 e
      48.717 escolas, uma linha por escola e ano.
    tabelas: [escola]
    colunas: [nivel_socio_economico, ano]
    severidade: silencioso
    verificado: "2014: nivel_socio_economico 8..14 (8: 591, 9: 3.732, 10: 8.340, 11: 10.031, 12: 13.353, 13: 4.096, 14: 55); 2016: 15..21 (15: 576 ... 21: 54); nulos 9.159 e 9.392 — medido 2026-11-04"
  - id: id_municipio_nem_sempre_e_ibge_e_taxa_acima_de_100
    resumo: "id_municipio tem 7.395 valores distintos (há só 5.570 municípios; 345 linhas de 2014 e 969 de 2016 não casam com o diretório), id_uf tem 30 valores e taxa_participacao_lp/mt chega a 193,9% (3.539 linhas em 2014, 4.133 em 2016 acima de 100)."
    detalhe: >
      Para geografia use id_escola e junte com o Censo Escolar, ou o diretório
      depois de descartar os IDs inválidos. A taxa passa de 100 quando
      numero_presentes > numero_matriculados_censo (aluno de fora do censo). Valores
      0 a 100 nas colunas nivel_* e escola_similar_* são percentual de alunos. Os
      códigos de rede (1, 2, 3) e tipo_area (1, 2) vêm sem rótulo (ver dicionario).
      Alunos matriculados somam 2.483.120 (2014) e 2.492.601 (2016).
    tabelas: [escola]
    colunas: [id_municipio, id_uf, taxa_participacao_lp, taxa_participacao_mt, rede, tipo_area]
    severidade: silencioso
    verificado: "id_municipio d=7.395 (max 6111155); sem correspondência no diretório: 345 (2014), 969 (2016); taxa_participacao_lp > 100: 3.539 e 4.133; máx 193,94 — medido 2026-11-04"
