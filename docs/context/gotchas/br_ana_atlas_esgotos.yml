dataset: br_ana_atlas_esgotos
gotchas:
  - id: indices_sao_fracoes_e_somam_um
    resumo: "Os quatro indice_* de atendimento (sem atendimento, solução individual, coleta sem tratamento, coleta com tratamento) são FRAÇÕES de 0 a 1 da população urbana e somam 1,0 em cada município, não percentuais. Para o Brasil, pondere por populacao_urbana_2013: com coleta e tratamento 43,5%, coleta sem tratamento 18,2%, solução individual 12,1%, sem atendimento 26,2%. Média simples entre municípios dá outro número."
    tabelas: [municipio]
    colunas: [indice_atendimento_com_coleta_com_tratamento, indice_sem_atendimento_sem_coleta_sem_tratamento, populacao_urbana_2013]
    severidade: silencioso
    verificado: "5.570 municípios; soma dos 4 índices = 1,0 em média; população urbana 2013 = 169.780.605; ponderado: com tratamento 0,435, sem coleta 0,262 — medido 2026-11-04"
  - id: investimento_total_ja_e_a_soma
    resumo: "investimento_coleta_tratatamento (grafia com 'tratatamento') é o total de coleta + tratamento: R$ 149,5 bi = R$ 101,86 bi (investimento_coleta) + R$ 47,63 bi (investimento_tratamento). Somar as três colunas conta o investimento em dobro. É um investimento necessário projetado (horizonte 2035), não gasto realizado."
    tabelas: [municipio]
    colunas: [investimento_coleta, investimento_tratamento, investimento_coleta_tratatamento]
    severidade: silencioso
    verificado: "soma: coleta 101,86 bi + tratamento 47,63 bi = 149,49 bi; coleta_tratatamento = 149,5 bi — medido 2026-11-04"
  - id: retrato_2013_com_projecao_2035
    resumo: "É um retrato de 2013 (populacao_urbana_2013, 169,8 milhões) com projeções para 2035 nas colunas *_2035: sem série temporal intermediária e sem atualização. Cargas e vazões (vazao_total 304.697 no Brasil; carga_gerada_total 9,10 milhões contra carga_lancada_total 5,52 milhões, ou seja, 61% chega ao rio) são de 2013."
    detalhe: >
      A diferença entre carga gerada e lançada é a remoção do tratamento. As unidades de vazao_*
      e carga_* (a ordem de grandeza de 54 g de DBO por habitante por dia sugere kg/dia na carga)
      não estão documentadas na tabela; confirmar na fonte antes de converter. Os atributos
      categóricos necessidade_remocao_dbo ('Entre 60 e 80%' 2.969, 'Acima de 80%' 1.291) são
      faixas, não números.
    tabelas: [municipio]
    colunas: [populacao_urbana_2013, vazao_total, carga_gerada_total, carga_lancada_total]
    severidade: aviso
    verificado: "sum(carga_gerada_total) = 9.098.237; sum(carga_lancada_total) = 5.515.537; sum(vazao_total) = 304.697 — medido 2026-11-04"
