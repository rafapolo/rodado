dataset: br_inea_boletim
gotchas:
  - id: boletim_nao_e_chave
    resumo: "boletins tem 1.081 linhas (uma por PDF/data) para só 226 valores de boletim: o número do boletim repete entre anos e entre datas. Chave da edição é (boletim, data_boletim). Junte processos, empresas e atos_pdf por boletim e data_boletim, senão cruza edições diferentes."
    tabelas: [boletins, processos, empresas, tipos_documento, atos_pdf]
    colunas: [boletim, data_boletim]
    severidade: silencioso
    verificado: "boletins: 1.081 linhas, 226 boletim distintos, 2019-01-28 a 2026-08-26; 2 linhas com ano_arquivo nulo (2019-12-27 a 2021-04-20) — medido 2026-11-04"
  - id: contagens_n_processos_e_repeticao
    resumo: "n_processos e n_empresas em boletins são contagens extraídas do texto do PDF: somam 7.161 e 6.877, e as tabelas processos e empresas têm exatamente essas linhas, mas com repetição (processos: 7.161 linhas para 7.072 pares boletim-processo; empresas: 6.877 para 6.644). 26 boletins vêm com n_processos = 0. Conte com count(DISTINCT processo), e não leia o total como número de licenças emitidas."
    tabelas: [boletins, processos, empresas]
    colunas: [n_processos, n_empresas, processo, empresa]
    severidade: silencioso
    verificado: "soma n_processos 7.161; pares distintos (boletim, processo) 7.072; empresas 6.877 linhas e 6.644 pares; n_processos = 0 em 26 boletins — medido 2026-11-04"
  - id: serie_cai_depois_de_2023
    resumo: "O volume de processos por ano é irregular: 1.184 (2019), 717 (2020), 705 (2021), 1.328 (2022), 2.367 (2023), 417 (2024), 303 (2025), 85 (2026 até agosto). A queda a partir de 2024 reflete o formato dos boletins extraídos (menos atos listados), não menos licenciamento. atos_pdf traz o texto do ato (7.052 linhas, 21 com menos de 50 caracteres)."
    tabelas: [boletins, atos_pdf]
    colunas: [ano_arquivo, n_processos, texto_ato, n_chars]
    severidade: silencioso
    verificado: "soma de n_processos por ano_arquivo: 2019 1.184; 2020 717; 2021 705; 2022 1.328; 2023 2.367; 2024 417; 2025 303; 2026 85; boletins por ano 133, 150, 171, 199, 154, 126, 102, 44 — medido 2026-11-04"
