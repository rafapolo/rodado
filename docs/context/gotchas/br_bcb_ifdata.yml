dataset: br_bcb_ifdata
gotchas:
  - id: um_tipo_e_um_relatorio
    resumo: "Filtre um tipo_instituicao e um numero_relatorio antes de somar: a mesma conta ('Ativo Total') aparece no Resumo e no Ativo, e os tipos 1 (prudencial), 2 (financeiro) e 3 (individual) contam o mesmo banco de novo. Sem filtro, o ativo do sistema dobra."
    tabelas: [relatorio]
    colunas: [tipo_instituicao, numero_relatorio, conta, saldo]
    severidade: silencioso
    verificado: "ativo total Resumo tipo 1 = R$ 17,05 tri em 2024-12; carteira de crédito tipo 3 bate SGS 20539 com ±0,4% — medido 2026-09-25"
  - id: conta_muda_de_codigo
    resumo: "O código de conta muda entre trimestres (layout novo a partir de 2025-03: Ativo Total era 78182 e virou 140220; desde 202506 o nome \"Ativo Total\" aparece também no relatório 4, filtre numero_relatorio = 1). Filtre a conta dentro do trimestre, não compare código entre anos."
    tabelas: [relatorio]
    colunas: [conta, nome_coluna]
    severidade: silencioso
    verificado: "layout de 202509 diferente do de 202506 — medido 2026-09-25; código de Ativo Total muda em 202503 — medido 2026-11-10"
  - id: instituicao_da_bd_nao_casa
    resumo: "cadastro e relatorio usam cod_inst de 8 caracteres (CNPJ básico com zeros ou C00xxxxx). A tabela instituicao (Base dos Dados) usa id_instituicao recodificado: C0080099 vira 1000080099 e o CNPJ perde os zeros (7221678). Não junte uma com a outra."
    tabelas: [cadastro, relatorio, instituicao]
    colunas: [cod_inst, id_instituicao]
    severidade: erro
    verificado: "cadastro: Banco do Brasil = '00000000', Itaú prudencial = 'C0080099'; instituicao: Itaú prudencial id_instituicao = '1000080099' — medido 2026-09-25"
  - id: resultado_acumulado_no_semestre
    resumo: "O resultado do relatório 4 (e o Lucro Líquido do relatório 1) é acumulado no semestre, não no trimestre nem no ano: março e setembro trazem um trimestre, junho e dezembro trazem o semestre. Somar os 4 trimestres dá 1,5x o ano; pegar dezembro como anual dá só o 2º semestre."
    detalhe: >
      Lucro do ano = junho + dezembro. Trimestre isolado: março; junho −
      março; setembro; dezembro − setembro. Vale nos dois layouts (antes e
      depois de 202503) e nos tipos de instituição 1, 2 e 3. As contas de
      balanço (relatórios 1 a 3, ativo, passivo, PL) são estoque na data e
      não têm esse problema.
    tabelas: [relatorio]
    colunas: [saldo, numero_relatorio, ano_mes]
    severidade: silencioso
    verificado: "Despesas de Pessoal de C0080738 (tipo 1) 2024: 03 −8.044 mi, 06 −15.262, 09 −7.076, 12 −14.865; mesmo padrão em 2019, 2023, 2025 e 2026; Lucro Líquido 2025: 5.388 / 8.719 / 3.416 / 5.862 mi, iguais nos relatórios 1 e 4 — medido 2026-11-12"
