dataset: br_sgb_setorizacao_risco
gotchas:
  - id: setorizacoes_repetidas
    resumo: "Um município pode ter setorizações de anos diferentes: somar num_pessoas de todas as linhas conta a mesma gente mais de uma vez. Filtre setorizacao_mais_recente para o retrato atual."
    tabelas: [setores]
    colunas: [setorizacao_mais_recente, ano_setorizacao, num_pessoas]
    severidade: erro
    verificado: "17.838 setores, 4.691.210 pessoas sem filtro; 7.808 setores e 2.032.865 pessoas com o filtro — medido 2026-10-31"
  - id: so_risco_alto
    resumo: "A camada só traz setores de risco alto e muito alto, e só onde o SGB mapeou. Município ausente não quer dizer sem risco."
    tabelas: [setores]
    colunas: [id_municipio]
    severidade: silencioso
    verificado: "1.587 municípios na setorização mais recente, 2010–2026 — medido 2026-10-31"
  - id: tipologia_repete_setor
    resumo: "Cada setor tem até 5 tipologias em colunas (tipolo_g1 a tipolo_g5): contar por tipologia depois de empilhar repete o setor."
    tabelas: [setores]
    colunas: [tipolo_g1, tipolo_g2, cobrade_01]
    severidade: silencioso
    verificado: "fid único em 17.838 linhas — medido 2026-10-31"
  - id: nome_sem_casar
    resumo: "O SGB não traz código IBGE: id_municipio sai de UF + nome. 40 linhas ficaram sem código por grafia (Itapajé-CE, Dona Euzébia-MG, São Luíz do Paraitinga-SP, Muquém do São Francisco-BA)."
    tabelas: [setores]
    colunas: [id_municipio, municipio]
    severidade: aviso
    verificado: "40 de 17.838 — medido 2026-10-31"
