dataset: br_ibge_cbo_2002
gotchas:
  - id: grande_area_e_letra_local_da_ocupacao
    resumo: "Em perfil_ocupacional, grande_area (A a P) e atividade (1 a 37) são códigos locais de cada ocupação, não categorias globais: a letra A significa grupos de atividade diferentes em cada cbo_2002 (4.495 pares letra-descrição para 16 letras). A chave da linha é (cbo_2002, grande_area, atividade), 169.836 linhas únicas. Agrupar por grande_area ou atividade sozinhas mistura assuntos sem relação; agrupe por descricao_grande_area ou descricao_atividade."
    tabelas: [perfil_ocupacional]
    colunas: [grande_area, atividade, descricao_grande_area, descricao_atividade]
    severidade: silencioso
    verificado: "169.836 linhas = 169.836 chaves (cbo_2002, grande_area, atividade); 2.641 cbo_2002; 20.332 pares (cbo, grande_area); 4.495 pares distintos (grande_area, descricao_grande_area); 37 valores de atividade — medido 2026-11-04"
  - id: cbo_texto_com_zero_a_esquerda
    resumo: "cbo_2002 é texto de 6 dígitos com zero à esquerda preservado (2.018 linhas de perfil começam com 0, as ocupações militares e de segurança: '020105'). Junte com tabelas que guardam o CBO sem zero (RAIS recente) normalizando com lpad(cbo, 6, '0'); só 1.849 dos 2.641 CBO do perfil têm sinônimo registrado."
    tabelas: [perfil_ocupacional, sinonimo]
    colunas: [cbo_2002]
    severidade: silencioso
    verificado: "length(cbo_2002) = 6 em todas as linhas de perfil e sinonimo; cbo começando com 0: 2.018 linhas; sinonimo 7.720 linhas, 1.849 cbo distintos; 802 cbo do perfil sem sinônimo — medido 2026-11-04"
