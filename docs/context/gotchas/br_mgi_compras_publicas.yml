dataset: br_mgi_compras_publicas
gotchas:
  - id: cpf_vencedor_com_letras
    resumo: "Em compra_sem_licitacao_item, 12,8% de cpf_vencedor trazem letras no lugar dos dígitos ('***RANGEI**'): pedaço de nome, não CPF. Em licitacao_item o CPF vem inteiro."
    tabelas: [compra_sem_licitacao_item, licitacao_item]
    colunas: [cpf_vencedor]
    severidade: silencioso
    verificado: "compra_sem_licitacao_item: 53.088 com letra, 361.977 na máscara ***######** de 415.065; licitacao_item: 7.630 de 8.536 com 11 dígitos — medido 2026-10-15"
  - id: compras_terminam_em_2024
    resumo: "licitacao_item e compra_sem_licitacao_item vão até 2024: compra depois disso está em contratacao/contratacao_item (Lei 14.133, lote SEGES) ou no PNCP (br_mgi_pncp, br_pncp)."
    tabelas: [licitacao_item, compra_sem_licitacao_item]
    colunas: [ano]
    severidade: aviso
    verificado: "max(ano) = 2024 nas duas — medido 2026-10-15"
  - id: fornecedor_duplica_sicaf
    resumo: "fornecedor é o mesmo cadastro de br_comprasgov_sicaf.fornecedores (extração de 04/10/2026). Não some os dois."
    tabelas: [fornecedor]
    colunas: [cnpj]
    severidade: silencioso
    verificado: "772.020 de 772.073 CNPJs no SICAF, mesmo indicador de ativo — medido 2026-10-15"
  - id: parquets_malformados_cabecalho_numa_coluna
    resumo: "Parte dos parquets de ata_registro_preco, contratacao, contratacao_item e contratacao_item_resultado veio malformada: o cabeçalho inteiro virou o nome de UMA coluna enorme, com as linhas dentro dela em texto separado por ';' e todas as colunas reais nulas. Essas linhas entram na view e contam em count(*). Filtre pela chave da tabela IS NOT NULL: numero_ata_registro_preco (ata), cod_compra (contratacao), srk_pncp_item_compra (contratacao_item), srk_item_resultado (contratacao_item_resultado)."
    detalhe: >
      Filtrar por mês ou ano (ano_compra, data_publicacao_pncp) também
      descarta as linhas ruins, que vêm com essas colunas nulas, e então o
      mês parece vazio. ata_registro_preco: o arquivo 2023.parquet inteiro
      (31.495 linhas, 7,8% do total); as atas de ano_compra 2023 da tabela
      vêm de outros arquivos. contratacao: 15 de 62 arquivos mensais
      inteiros (238.212 linhas, 23,8%), por exemplo 2023_07, 2023_08,
      2023_10, 2024_12, 2025_02 e 2026_09. contratacao_item: 25 arquivos
      inteiros mais 14 arquivos com algumas linhas, 5,33 milhões de 9,52
      milhões de linhas (56%); há dois nomes diferentes de coluna enorme (um
      com ';' e outro com '";"'). contratacao_item_resultado: só 732 linhas
      (2022_01 inteiro, mais 7 e 39 linhas em 2024_07 e 2025_07). A linha
      ruim pode ser recuperada separando a coluna gigante por ';', mas campos
      com ';' no texto (objeto, descricao) quebram a divisão.
    tabelas: [ata_registro_preco, contratacao, contratacao_item, contratacao_item_resultado]
    colunas: [numero_ata_registro_preco, cod_compra, srk_pncp_item_compra, srk_item_resultado]
    severidade: erro
    verificado: "ata_registro_preco 402.724 linhas, 371.229 com numero_ata_registro_preco (2023.parquet 31.495 linhas, 0 válidas); contratacao 1.001.583 linhas, 763.371 com cod_compra, 62 arquivos dos quais 15 sem nenhuma linha válida; contratacao_item 9.521.510 linhas, 4.192.871 com srk_pncp_item_compra (25 arquivos sem nenhuma, 14 com poucas ruins), cod_compra preenchido em 4.096.302; contratacao_item_resultado 6.565.099 linhas, 6.564.367 com srk_item_resultado (3 arquivos afetados: 2022_01 686, 2024_07 7, 2025_07 39) — medido 2026-10-28"
