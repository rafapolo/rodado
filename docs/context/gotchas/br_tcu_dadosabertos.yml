dataset: br_tcu_dadosabertos
gotchas:
  - id: data_sessao_texto
    resumo: "dataSessao é DATE desde 2026-10-21 (era texto dd/mm/aaaa, cujo min/max textual devolvia datas erradas). strptime sobre ela agora dá erro: use a coluna direto."
    tabelas: [dados]
    colunas: [dataSessao]
    severidade: silencioso
    verificado: "min/max textual 01/04/2025 e 31/07/2024; com strptime 2024-07-23 a 2026-07-08 — medido 2026-09-25; DATE 2024-07-02 a 2026-10-06 em 37.698 linhas, medido 2026-10-21"
  - id: sem_cnpj_no_texto
    resumo: "O acórdão não traz CNPJ: 2 de 36.499 sumários, e 24.995 (os de relação) vêm sem sumário. Ligar a empresa pelo número do acórdão (ponte em bridges.yaml), não por CNPJ."
    tabelas: [dados]
    colunas: [sumario, numeroAcordao, anoAcordao, colegiado]
    severidade: erro
    verificado: "regex de CNPJ em sumario+titulo: 2 acórdãos; ponte DELIBERACAO ↔ numero/ano/colegiado casa 4 de 4 inidôneos na janela — medido 2026-09-25"
  - id: raspador_traz_recorte
    resumo: "O raspador pagina por offset e para em 25 min: cada rodada traz só os acórdãos recentes e perde a cauda antiga. Atualizar por fusão (novo ∪ espelho fora da chave `key`), nunca promover o staging puro nem com --aceitar-encolher."
    tabelas: [dados]
    colunas: [key, dataSessao]
    severidade: erro
    verificado: "2026-11-02: staging 36.996 linhas x espelho 37.698; fusão por key (única nos dois) deu 38.630, dataSessao até 2026-10-28"
