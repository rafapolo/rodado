dataset: br_cgu_gas_do_povo
gotchas:
  - id: cpf_completado
    resumo: "A coluna de CPF mistura CPF completo (completado pelo projeto) e CPF mascarado. count(DISTINCT cpf) conta máscara como pessoa."
    detalhe: >
      O CPF mascarado da fonte foi trocado pelo completo só quando nome
      idêntico, dígitos visíveis e unicidade garantiam a pessoa
      (procedimento local, fora do repositório). O resto ficou
      mascarado: filtre regexp_full_match(col, '[0-9]{11}') para ter só os
      completos, e não trate a máscara como identificador — ela repete entre
      pessoas diferentes.
    tabelas: [gas_do_povo]
    colunas: [cpf_beneficiario]
    severidade: silencioso
    verificado: "15.912.089 de 24.494.950 linhas completadas — medido 2026-10-31"
  - id: meses_recentes_revisados
    resumo: "A fonte reescreve meses já publicados: 2026-06 e 2026-07 cresceram 3% e 25% depois da primeira coleta, com linhas trocadas, não só somadas."
    detalhe: >
      Número recente muda entre coletas. O raspador grava outro nome de arquivo e
      outro schema, então a promoção direta dobraria as linhas: converter para
      <aaaamm>.parquet no schema da tabela e rodar completa_cpf.py depois.
    tabelas: [gas_do_povo]
    colunas: [mes_referencia]
    severidade: aviso
    verificado: "202606: 3.146.781 -> 3.244.172, 25.922 linhas antigas substituídas; 202607: 3.640.842 -> 4.567.857, 36.460 substituídas — medido 2026-10-31"
