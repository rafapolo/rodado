dataset: br_abrinq_oca
gotchas:
  - id: taxa_acima_de_100
    resumo: "As taxas de matrícula na pré-escola passam de 100% em muitos municípios, pois o numerador (matrículas) e o denominador (população estimada) vêm de fontes diferentes: em 2019, 1.185 municípios têm taxa bruta acima de 100 (máximo 271,8) e 611 têm taxa líquida acima de 100 (máximo 246,3). Em município pequeno (59 matrículas, taxa 232) é ruído da estimativa. Não leia como cobertura real; para o país some os números absolutos."
    tabelas: [municipio_primeira_infancia]
    colunas: [taxa_bruta_matricula_pre_escola, taxa_liquida_matricula_pre_escola]
    severidade: silencioso
    verificado: "2019: 5.570 municípios; taxa bruta > 100 em 1.185, líquida > 100 em 611; máximos 271,8 e 246,3; em 2010 máx bruta 290,5 — medido 2026-11-04"
  - id: media_das_taxas_nao_e_taxa_nacional
    resumo: "A média simples das taxas municipais (86,4% em 2019) pesa todo município igual; não é a taxa do país. Some os numeradores ou pondere por população (que não está na tabela). Há 4 municípios com taxa bruta exatamente 0 em 2019 e 5 sem taxa em alguns anos."
    tabelas: [municipio_primeira_infancia]
    colunas: [taxa_bruta_matricula_pre_escola, taxa_liquida_matricula_pre_escola]
    severidade: silencioso
    verificado: "média simples da taxa bruta 82,4 (2010) a 86,8 (2018), 86,4 (2019); count(taxa_bruta) 5.565 de 5.570 em 2010-2012; count(taxa_liquida) 5.565 em 2010 e 2013-2016; matrículas brutas 4,72 milhões (2010) e 5,22 milhões (2019) — medido 2026-11-04"
  - id: salto_na_liquida_2012_2013
    resumo: "A matrícula líquida salta de 3,09 milhões (2012) para 4,27 milhões (2013), +38%, enquanto a bruta sobe 2%: indício de quebra de método, não de realidade. Compare líquidas dentro de 2010-2012 e de 2013-2019, não através. A série vai de 2010 a 2019."
    tabelas: [municipio_primeira_infancia]
    colunas: [numero_absoluto_liquido_matricula_pre_escola, taxa_liquida_matricula_pre_escola]
    severidade: silencioso
    verificado: "soma de numero_absoluto_liquido: 2011 3.091.834; 2012 3.087.537; 2013 4.272.243; 2019 4.744.889; bruto 2012 4.765.943, 2013 4.870.332 — medido 2026-11-04"
