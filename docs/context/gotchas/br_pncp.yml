dataset: br_pncp
gotchas:
  - id: ano_contrato_corrompido
    resumo: "anoContrato tem valores impossíveis (até 26042024, uma data colada): use year(dataAssinatura)."
    tabelas: [contratos]
    colunas: [anoContrato, dataAssinatura]
    severidade: aviso
    verificado: "72 de 5.229.507 linhas com anoContrato fora de 2000–2030 (máx 26042024) — medido 2026-10-20"
  - id: contrato_uma_linha_por_chave
    resumo: "Desde 2026-11-26, contratos tem uma linha por numeroControlePNCP, a da última dataAtualizacaoGlobal: count(*) já conta contratos. Antes disso a tabela repetia ~980 mil linhas (2025 e 2026), e número publicado antes dessa data pode ter sido contado sobre linhas."
    detalhe: >
      A carga completa trazia cópias exatas da mesma linha em ano_publicacao 2025 e 2026 e 1.411
      versões do mesmo contrato com dataAtualizacaoGlobal diferente. A consolidação de 2026-11-26
      ficou com a versão mais recente e mandou o resto para o registro de mudanças
      (~/rodado/_historico/br_pncp/contratos). Cada incremento que traz versão nova de contrato já
      existente é consolidado do mesmo jeito. O ano da soma: use year(dataAssinatura), não anoContrato.
    tabelas: [contratos]
    colunas: [numeroControlePNCP, dataAtualizacaoGlobal, valorGlobal]
    severidade: aviso
    verificado: "2026-11-26: 5.504.572 linhas -> 4.525.064, igual a count(DISTINCT numeroControlePNCP); 2025 2.189.821 -> 1.690.768, 2026 2.364.635 -> 1.884.180 (979.508 tiradas)"
  - id: tipo_pessoa_nao_confere_com_digitos
    resumo: "tipoPessoa='PJ' tem fornecedor de 11 dígitos (1.726 em 2025) e 'PF' de 14 (642). Classifique CPF/CNPJ por length(niFornecedor)."
    tabelas: [contratos]
    colunas: [tipoPessoa, niFornecedor]
    severidade: aviso
    verificado: "ano_publicacao=2025: PJ 14 dígitos 2.105.929, PJ 11 dígitos 1.726, PF 11 dígitos 74.928, PF 14 dígitos 642 — medido 2026-11-04"
  - id: valorglobal_outliers_dominam_a_soma
    resumo: "Em contratos, cerca de 90 contratos com valorGlobal de R$ 10 bi ou mais somam R$ 34,2 tri, mais de 90% do valor da tabela: filtre valorGlobal < 1e10 (e revise os maiores) antes de somar."
    detalhe: "O máximo é R$ 6,0 tri (um contrato). Na versão mais recente de cada numeroControlePNCP, o valor assinado em 2025 cai de R$ 14.235 bi para R$ 1.003 bi sem esses contratos, e o de 2026 de R$ 17.489 bi para R$ 731 bi. Valores dessa ordem (a tabela inteira soma R$ 36,4 tri em 2022–2026) não são contratação plausível; a deduplicação sozinha não resolve."
    tabelas: [contratos]
    colunas: [valorGlobal, valorInicial]
    severidade: silencioso
    verificado: "89 contratos com valorGlobal >= 1e10 (86 acima, 48 assinados em 2025), R$ 34,2 tri na versão mais recente; soma total R$ 36,4 tri; por year(dataAssinatura): 2025 R$ 14.234,8 bi e 1.003,5 bi sem eles, 2026 R$ 17.489,1 bi e 730,8 bi — medido 2026-11-18"
