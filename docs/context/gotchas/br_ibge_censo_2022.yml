dataset: br_ibge_censo_2022
gotchas:
  - id: sigilo_e_null
    resumo: "Nas tabelas agregados_* e setor_censitario_*, NULL é sigilo estatístico ('X' na fonte) ou não se aplica ('.'), nunca zero. Somar áreas pequenas dá menos que o total do município."
    detalhe: >
      Para total de município use agregados_municipio, não a soma de bairros,
      distritos ou setores. As variáveis v* têm o mesmo significado em todos os
      níveis e estão descritas em agregados_dicionario_variaveis; as de
      indígenas e quilombolas (v01500 em diante) não existem em setor_censitario.
    tabelas: [agregados_municipio, agregados_distrito, agregados_subdistrito, agregados_bairro]
    colunas: [pessoas]
    severidade: silencioso
    verificado: "agregados_municipio: 5.570 linhas, soma de pessoas 203.080.756 (o total oficial do Censo 2022); São Paulo 11.451.999 — medido 2026-10-10"
  - id: bairro_repetido
    resumo: "id_bairro não é chave única em agregados_bairro: o bairro 3205200069 (São Torquato, Vila Velha/ES) vem em duas linhas, uma por subdistrito. A chave é id_bairro + id_subdistrito."
    tabelas: [agregados_bairro]
    colunas: [id_bairro, id_subdistrito]
    severidade: silencioso
    verificado: "17.576 linhas, 17.575 id_bairro distintos; as duas linhas de 3205200069 têm 1.632 e 2.444 pessoas — medido 2026-10-10"
  - id: favela_e_por_setor
    resumo: "População e domicílios de uma favela não estão numa tabela própria: some as variáveis de setor_censitario pelos setores de favela_setor. A cobertura de bairro é parcial (só município que tem bairro oficial)."
    detalhe: >
      favela_setor liga cada setor censitário a uma Favela ou Comunidade Urbana
      (id_favela, 11 dígitos). favela_entorno_cobertura traz só os moradores com
      informação de entorno. agregados_bairro cobre os municípios que têm bairro
      na base territorial do IBGE, não o país inteiro.
    tabelas: [favela_setor, favela_entorno_cobertura, agregados_bairro]
    colunas: [id_favela, id_setor_censitario]
    severidade: silencioso
    verificado: "favela_setor: 33.272 setores em 12.348 favelas, todos presentes em setor_censitario; favela_entorno_cobertura: 12.348 linhas — medido 2026-10-10"
  - id: sidra_formato_longo
    resumo: "sidra_recortes é formato longo com todos os cruzamentos de 245 tabelas do SIDRA: sempre filtre id_tabela e fixe TODAS as classificações (categoria_N = 'Total' nas que não interessam), senão a soma conta a mesma pessoa várias vezes."
    detalhe: >
      Cada linha é uma célula: tabela, localidade (Brasil ou UF), variável e até seis pares
      classificacao_N / categoria_N. A categoria 'Total' de cada classificação convive com as
      partes. valor NULL com simbolo preenchido é sigilo ('X') ou dado inexistente ('...').
      sidra_recortes_tabelas diz o que cada id_tabela mede, quais classificações tem, se
      existe por município na fonte (tem_municipio) e se entrou (no_espelho): 20 tabelas de
      etnia e língua indígena passam de 5 milhões de células e ficaram só no índice.
    tabelas: [sidra_recortes, sidra_recortes_tabelas]
    colunas: [id_tabela, categoria_1, categoria_2, valor, simbolo]
    severidade: silencioso
    verificado: "27.358.290 células de 245 tabelas, 27.270 com símbolo no lugar do valor; tabela 9608, Brasil, Total × Total = 1.694.836 pessoas indígenas (o número oficial); índice com 314 tabelas, 245 no espelho — medido 2026-10-11"
  - id: setor_pct_em_tabelas_separadas
    resumo: "Indígenas e quilombolas por setor não estão em setor_censitario: ficam em setor_censitario_{pessoas,domicilios}_{indigenas,quilombolas}, com as variáveis v01500 em diante descritas em agregados_dicionario_variaveis."
    tabelas: [setor_censitario, setor_censitario_pessoas_indigenas, setor_censitario_domicilios_indigenas, setor_censitario_pessoas_quilombolas, setor_censitario_domicilios_quilombolas]
    colunas: [id_setor_censitario]
    severidade: erro
    verificado: "458.772 setores em cada uma das quatro, todos presentes em setor_censitario; v03196 (pessoas quilombolas) soma 1.317.569 por setor, igual à soma de agregados_municipio — medido 2026-10-11"

  - id: agregados_municipio_difere_do_sidra_exato
    resumo: "Os totais de `agregados_municipio` (e a soma dos setores) não batem exatamente com as tabelas municipais do SIDRA: em Nova Friburgo, domicílios com lixo coletado por serviço de limpeza são 63.837 nos agregados e 63.875 no SIDRA 6892 (caçamba 12.164 contra 12.288; queimado 207 contra 278; total 76.295 contra 76.597)."
    detalhe: >
      A diferença é de 0,1% a 30% por categoria pequena, e vai nos dois sentidos. Para a leitura oficial de um
      município (tabelas 4712, 4714, 6326, 6803 a 6806, 6892, 9515, 9543 e 9756) o SIDRA é a referência; os agregados
      servem para o recorte fino (setor, bairro, distrito) e para cruzar com outras colunas do mesmo conjunto.
      A causa não foi medida. Essas 11 tabelas do SIDRA não estão no espelho (das 32 tabelas do Base dos Dados checadas,
      21 estão em `sidra_recortes`, no nível Brasil e UF). Para baixar o nível de município falta o id das
      classificações, que vem dos metadados do IBGE, e esses respondem só por IP brasileiro.
    tabelas: [agregados_municipio, agregados_distrito, agregados_bairro]
    colunas: [v00397, v00398, v00399]
    severidade: aviso
    verificado: "2026-11-03: Nova Friburgo (3303401), SIDRA 6892 n6 ano 2022 contra agregados_municipio v00397 a v00402"
