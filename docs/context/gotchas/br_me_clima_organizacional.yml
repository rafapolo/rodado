    resumo: "Somar quantidade_resposta dá 764.186; os respondentes são 32.393. Use a linha classe = 'Médias' ou só os órgãos de nível 1 (código sem ponto) em UMA das duas leituras: area_empresa 'Empresa' e 'Área' têm a mesma quantidade_resposta mas médias diferentes, não são cópia."
    detalhe: >
      Cada corte vem duas vezes (area_empresa 'Empresa' e 'Área'): mesma
      quantidade_resposta, mas outra ponderação das médias (media_geral 55,84 x
      62,04 na linha Médias; nenhuma linha tem media_geral igual nas duas).
