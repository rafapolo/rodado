      Gênero, Idade...) é um corte do mesmo conjunto, e dentro de 'Órgão' os
      códigos são hierárquicos (116.5.14.15), então somar os níveis repete
      gente. Os 188 órgãos cujo código não tem ponto somam exatamente 32.393.
