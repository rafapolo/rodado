dataset: br_cnj_estatisticas_poder_judiciario
gotchas:
  - id: linhas_de_agregado_por_ramo
    resumo: "A tabela traz, ao lado dos tribunais, uma linha de total por ramo: TJ, TRE, TRF, TRT, TJM (id_tribunal 999991) e JMU (999992, que repete o STM). Somar todas as linhas de um ano conta a despesa em dobro: em 2024 dá R$ 288,7 bi em vez de R$ 146,5 bi."
    detalhe: >
      O Justiça em Números publica esses totais como linhas da mesma base, e a tabela os mantém,
      como fazia a cópia da BD. Para o total do Judiciário, some só as linhas com
      id_tribunal fora de ('999991', '999992'). Também dá certo somar os agregados mais os
      tribunais superiores presentes (STJ, TST, TSE; o STM já está no JMU). STF e CNJ não estão na
      tabela. Totais conferidos:
      2023 = R$ 132,6 bi, 2024 = R$ 146,5 bi, 2025 = R$ 164,6 bi, iguais nos dois jeitos.
    tabelas: [recursos_financeiros]
    colunas: [id_tribunal, sigla_tribunal, despesa_total_justica_estadual]
    severidade: silencioso
    verificado: "2024: soma de todas as 98 linhas = 288,7 bi; sem as 6 de agregado (JMU, TJ, TJM, TRE, TRF, TRT) = 146,5 bi — medido 2026-11-23"
  - id: despesa_total_justica_estadual_e_de_todo_tribunal
    resumo: "Apesar do nome, despesa_total_justica_estadual é a despesa total de cada tribunal, de qualquer ramo. No dicionário do CNJ é o código Dpj, 'Despesa Total da Justiça'. Não filtra Justiça Estadual."
    tabelas: [recursos_financeiros]
    colunas: [despesa_total_justica_estadual]
    severidade: aviso
    verificado: "TRT2 2024 = R$ 3,70 bi e TJSP 2024 = R$ 16,46 bi na mesma coluna — medido 2026-11-23"
  - id: valores_em_reais_inflados_ate_2021_corrigido
    resumo: "Até 2026-11-22 as colunas em R$ (despesas, médias, execução, orçamento, receitas, depósitos) vinham infladas ×10 ou ×100: a BD apagou a vírgula decimal ao ler o CSV do CNJ. Desde 2026-11-23 a tabela é refeita da fonte e os valores estão certos. Quem guardou um número antigo deve refazer a conta."
    detalhe: >
      Exemplo: "10085769619,34" virou 1.008.576.961.934. O fator era 10^(casas decimais do texto):
      ×100 com duas casas, ×10 com uma, ×1 se o valor era inteiro (2009 quase todo inteiro).
      Daí as despesa_media_* em ~5e14 e tribunais de R$ 6 tri que este arquivo registrava
      antes (id antigo medias_corrompidas_desde_2015). Proporções, índices por habitante e
      contagens a BD leu certo. Refeita por scripts/scrap/cnj_justica_em_numeros.py. Com o
      parse da BD reproduzido, 97–100% das células batem por coluna em 2009–2021.
    tabelas: [recursos_financeiros]
    colunas: [despesa_total_justica_estadual, despesa_rh, despesa_media_magistrado, despesa_media_servidor, despesa_media_terceirizado, despesa_media_estagiario, execucao_orcamentaria_despesa_capital, saldo_depositos_judiciais]
    severidade: erro
    verificado: "antes: despesa_media_magistrado > 1e7 em 90–96 de 97 linhas/ano 2015–2021. Depois: mediana em 2024 = R$ 805.582; dpj TJSP 2015 = 10.085.769.619,34 (era 1.008.576.961.934) — medido 2026-11-23"
  - id: revisoes_do_cnj_em_gastos_totais_e_por_habitante
    resumo: "O CNJ revisa a série a cada edição. gastos_totais (GT, a despesa pública usada como denominador) mudou em 65 tribunais/ano de 2014 a 2019 e em todos em 2020–2021. Por isso proporcao_despesa_total_dp (G2) e despesa_total_justica_pc (G7, que muda com a população) diferem da cópia antiga. Uma série baixada noutra edição não casa célula a célula com esta."
    detalhe: >
      Contra a cópia da BD (edição anterior), na mesma linha tribunal-ano: gastos_totais bate em
      51%, G2 em 78%, G7 em 90%; o resto das colunas em 97–100%. gastos_totais tem valores
      estranhos na própria fonte: TRT2 2014 = 0, mas com G2 preenchido; TRT2 2024 = R$ 4,69 tri
      (despesa da União). Use G2 como vem e não recalcule a partir de GT.
      Em 69 células a edição atual dá 'nd' onde a antiga tinha valor: G2 de 64 TREs em 2014
      e G8 em 5 linhas de 2015–2016. Elas ficaram com o valor antigo.
    tabelas: [recursos_financeiros]
    colunas: [gastos_totais, proporcao_despesa_total_dp, despesa_total_justica_pc]
    severidade: aviso
    verificado: "edição jun/2026 x cópia BD: gastos_totais 605/1.189 iguais, G2 918/1.176, G7 1.056/1.176; 69 células mantidas — medido 2026-11-23"
  - id: sigla_uf_so_tribunal_estadual_e_eleitoral
    resumo: "sigla_uf só vem preenchida para TJ estadual, TRE e TJM estadual; os outros tribunais (TRT, TRF, superiores e agregados) ficam NULL, mesmo os que têm sede numa UF. Desde 2026-11-23 o TJMSP é SP (antes MS) e o TSE é NULL (antes SE)."
    tabelas: [recursos_financeiros]
    colunas: [sigla_uf, sigla_tribunal]
    severidade: aviso
    verificado: "sigla_uf diferente da cópia BD só em TJMSP (MS->SP) e TSE (SE->NULL) — medido 2026-11-23"
  - id: trf6_desde_2022_e_2009_2010_parciais
    resumo: "2009 e 2010 têm 61 linhas (sem Justiça Eleitoral nem Militar; superiores só STJ e TST); 2011–2021 têm 97; 2022–2025 têm 98, com o TRF6 (criado em 2022)."
    tabelas: [recursos_financeiros]
    colunas: [ano, sigla_tribunal]
    severidade: aviso
    verificado: "linhas por ano: 61, 61, 97×11, 98×4 = 1.581; TRF6 em 4 anos — medido 2026-11-23"
