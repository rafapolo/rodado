dataset: br_bcb_scrdata
gotchas:
  - id: escala_em_reais_confere
    resumo: "As colunas de carteira estão em reais (não em milhares) e somam o saldo do SFN: carteira_ativa de dezembro/2023 dá R$ 5,97 tri (PF 3,58 + PJ 2,38), em linha com o crédito total do sistema divulgado pelo Banco Central. Os valores são DOUBLE: some direto, sem tirar vírgula ou ponto de milhar."
    tabelas: [dados]
    colunas: [carteira_ativa, carteira_a_vencer, carteira_vencida]
    severidade: aviso
    verificado: "2023-12-31: sum(carteira_ativa) = 5.965,9 bi = sum(a_vencer + vencida); cliente PF 3,582 tri, PJ 2,384 tri — medido 2026-11-04"
  - id: carteira_e_um_estoque
    resumo: "Cada data_base (fim de mês) é um retrato do saldo da carteira, não um fluxo. Somar meses de um ano conta o mesmo crédito 12 vezes. Para o ano, use a data_base de dezembro (ou a de um mês fixo)."
    detalhe: >
      Série: 2012-07-31 a 2026-08-31 (2012 só tem 6 meses; 2026 tem 8). Dezembro: 2013 R$ 2,74 tri,
      2019 R$ 3,69 tri, 2022 R$ 5,51 tri, 2025 R$ 7,44 tri.
    tabelas: [dados]
    colunas: [data_base]
    severidade: silencioso
    verificado: "dezembro: 2013 = 2,740 tri, 2023 = 5,966 tri, 2025 = 7,444 tri; 2012 com 6 meses, 2026 com 8 — medido 2026-11-04"
  - id: inadimplencia_nao_e_vencido_90
    resumo: "carteira_inadimplencia (R$ 185,5 bi em dez/2023) não é igual a vencido_acima_de_90_dias (R$ 87,6 bi): a primeira leva o saldo inteiro dos contratos com atraso acima de 90 dias (inclui a parte a vencer), a segunda só as parcelas vencidas. ativo_problematico (R$ 430,1 bi) é ainda maior. Escolha a coluna conforme o indicador do BC."
    detalhe: >
      Dezembro/2023: carteira_vencida 128,6 bi; vencido_de_15_ate_90_dias + vencido_acima_de_90_dias
      não somam carteira_inadimplencia. A leitura de 'carteira inadimplida = contrato com atraso
      acima de 90 dias, saldo total' é a definição do SCR.data, não conferida aqui; a medição
      é a diferença entre as colunas.
    tabelas: [dados]
    colunas: [carteira_inadimplencia, vencido_acima_de_90_dias, ativo_problematico]
    severidade: silencioso
    verificado: "2023-12-31: carteira_inadimplencia 185,5 bi, vencido_acima_de_90_dias 87,6 bi, ativo_problematico 430,1 bi — medido 2026-11-04"
  - id: porte_e_cnae_dependem_do_cliente
    resumo: "porte e cnae_ocupacao têm significado diferente para PF e PJ: em PF porte é faixa de renda em salários mínimos ('Até 1 salário mínimo' ... 'Acima de 20') e cnae_ocupacao é ocupação; em PJ porte é Micro/Pequeno/Médio/Grande e cnae_ocupacao é o CNAE. Há também 'Indisponível' (R$ 152,7 bi) e 'Sem rendimento'. Sempre filtre cliente antes de agrupar por porte."
    tabelas: [dados]
    colunas: [porte, cnae_ocupacao, cliente]
    severidade: silencioso
    verificado: "2023-12-31: 13 valores de porte (4 de porte PJ + Indisponível + 8 faixas de renda); 30 valores de cnae_ocupacao; 'Indisponível' = 152,7 bi — medido 2026-11-04"
  - id: numero_de_operacoes_e_texto
    resumo: "numero_de_operacoes vem como texto (todos os 312.370 valores de dez/2023 são numéricos, máximo 5.770.982): ordenar ou somar sem CAST dá ordem alfabética ou erro. Use try_cast(numero_de_operacoes AS BIGINT)."
    tabelas: [dados]
    colunas: [numero_de_operacoes]
    severidade: aviso
    verificado: "2023-12-31: 312.370 linhas, 0 não numéricas; coluna VARCHAR — medido 2026-11-04"
