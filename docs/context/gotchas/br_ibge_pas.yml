      Escolha a id_tabela pelo tema e pela era em sidra_tabelas e filtre-a sempre. O
      período 2007 é o mais afetado (9.936 células repetidas) por estar em duas séries.
    tabelas: [sidra]
    colunas: [id_tabela, valor, periodo, id_variavel]
