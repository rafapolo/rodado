    resumo: "Em sidra, a mesma célula (localidade, período, variável e categorias) aparece em mais de uma id_tabela, e em 47.575 de 57.239 casos com valor diferente: as tabelas de eras diferentes se sobrepõem. Somar ou contar sem filtrar uma id_tabela repete e mistura metodologias."
