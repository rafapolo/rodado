dataset: br_ibge_pib
gotchas:
  - id: sem_va_por_setor_2022_2023
    resumo: "municipio de 2022 e 2023 traz só pib e impostos: va e va_agropecuaria (e os outros setores) vêm NULL nos 5.570 municípios. Valores em R$, não em R$ mil."
    tabelas: [municipio]
    colunas: [va, va_agropecuaria]
    severidade: silencioso
    verificado: "VA agropecuário 2021: R$ 591 bi; 2022 e 2023: 5.570 nulos — medido 2026-10-22 (bragro)"
  - id: contas_nacionais_longo_serie_inteira_e_revisada
    resumo: "contas_nacionais é longo: uma linha por (id_tabela, id_variavel, id_setor, ano, trimestre). Somar sem fixar id_tabela/id_variavel mistura índice, valor corrente, valor encadeado e taxa. O IBGE revisa o histórico a cada divulgação: não anexe, a recoleta troca a tabela inteira."
    detalhe: >
      id_tabela 1846 é valor corrente (R$ milhões, variável 585), 6612/6613 valor encadeado a preços de 1995,
      1620/1621 número-índice (base 1995 = 100; 1621 e 6613 dessazonalizados), 5932 taxas em %
      (4 variáveis: contra o mesmo trimestre do ano anterior, acumulada em 4 trimestres, acumulada no ano e contra
      o trimestre anterior). Não some trimestres de índice nem de taxa. O PIB anual é a soma dos 4 trimestres do
      setor 'PIB a preços de mercado' só em 1846 e 6612. Símbolo '...' da fonte (22 células de taxa trimestre
      contra trimestre, do primeiro trimestre) fica em `simbolo` com `valor` nulo; '-' virou zero.
    tabelas: [contas_nacionais]
    colunas: [id_tabela, id_variavel, id_setor, valor, simbolo]
    severidade: silencioso
    verificado: "2026-11-03: 24.034 linhas, 1996T1 a 2026T2; soma dos 4 trimestres de 1846 para 'PIB a preços de mercado' = R$ 7,61 tri (2020), 9,01 tri (2021), 10,08 tri (2022)"
