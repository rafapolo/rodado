dataset: br_prf_acidentes
gotchas:
  - id: sem_vitimas_quebra_2015
    resumo: "Acidentes 'Sem Vítimas' caem 90% entre 2010 e 2023, com a quebra em 2014–2016: a série de acidentes não é comparável antes e depois. Compare com classificacao_acidente <> 'Sem Vítimas', ou use mortos."
    tabelas: [ocorrencia, pessoa, pessoa_causa_tipo]
    colunas: [classificacao_acidente]
    severidade: silencioso
    verificado: "Sem Vítimas 113.118 (2010) → 98.312 (2014) → 58.411 (2015) → 34.478 (2016) → 10.963 (2023); com vítimas 69.359 → 56.802 — medido 2026-10-15"
  - id: pessoa_causa_tipo_multiplica
    resumo: "pessoa_causa_tipo tem uma linha por pessoa × causa × tipo de acidente: contar linhas multiplica vítimas. Use pessoa, ou count(DISTINCT id_pessoa)."
    tabelas: [pessoa_causa_tipo]
    colunas: [id_pessoa, indicador_morto]
    severidade: silencioso
    verificado: "2023: 26.552 linhas de morto para 5.627 mortos distintos (= pessoa = sum(quantidade_mortos) de ocorrencia) — medido 2026-10-15"
  - id: so_rodovia_federal
    resumo: "É só a malha federal: os mortos da PRF são 16% dos óbitos de transporte do SIM, de 2,5% (AM) a 25,8% (AC). Não é taxa de mortalidade no trânsito do município."
    tabelas: [ocorrencia]
    colunas: [quantidade_mortos, sigla_uf]
    severidade: aviso
    verificado: "2023: 5.627 mortos PRF × 34.881 óbitos SIM V01–V89 por UF de ocorrência — medido 2026-10-15"
  - id: prf_2026_setembro_da_prf
    resumo: "Em 2026, setembro e 38 ocorrências de jan-ago que a BD não tinha vêm direto da PRF (CSV de dados abertos), acrescentadas ao último shard de ocorrencia, pessoa e pessoa_causa_tipo. Ressincronizar da BD apaga ou duplica esse trecho."
    tabelas: [ocorrencia, pessoa, pessoa_causa_tipo]
    colunas: [ano, data, id_ocorrencia, id_municipio]
    severidade: aviso
    detalhe: >
      Fusão de 2026-11-10 (scripts/scrap/prf_acidentes_2026.py, local): o espelho tinha 48.712
      ocorrências até 2026-08-31; entraram 6.187 (6.149 de setembro + 38 de jan-ago), total 54.899.
      Linhas que o espelho já tinha não foram tocadas, mesmo as que a PRF revisou depois (cerca de
      0,4% das ocorrências diferem da fonte em coordenada, tracado_via, regional/delegacia/uop).
      A PRF renumerou 115 ocorrências de jan-ago (mesmo dia, hora, UF e BR, id novo): o espelho
      guarda a de id antigo, e a de id novo não entrou, para não duplicar o evento. Por isso 119
      ids do espelho não existem mais no arquivo atual da PRF (115 renumerados + 4 sem
      correspondente). uso_solo vem da PRF como Sim/Não e foi traduzido para Urbano/Rural (Sim =
      Urbano), como a BD grava. id_municipio: casado por nome+UF com br_bd_diretorios_brasil.municipio;
      3 cidades que o diretório grafa diferente (Santa Izabel do Pará, Itapajé, Poxoréu) levam o código
      que a BD já pôs nelas, sem nulos. Travado em docs/context/fonte_propria.yaml: uma
      ressincronização da BD que traga setembro duplica (ou, se for completa, apaga) o trecho; o
      backup dos shards originais está em ~/scrap_tmp/backup/br_prf_acidentes/.
    verificado: "ocorrencia 54.899 (48.712 + 6.187), pessoa 148.897 (132.544 + 16.353), pessoa_causa_tipo 457.618 (408.893 + 48.725); mortos de setembro 487 em ocorrencia = 487 id_pessoa com indicador_morto em pessoa — medido 2026-11-10"
