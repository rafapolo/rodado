dataset: br_ms_sia
gotchas:
  - id: id_paciente_proto_e_municipio
    resumo: "Em producao_ambulatorial, id_paciente_proto não é ID de paciente: é o município de residência (6 dígitos)."
    detalhe: >
      Junho de 2022, registros individualizados: 5.613 valores distintos, dos
      quais 5.570 casam com id_municipio_6 do diretório IBGE. Vem vazio ('') no
      BPA consolidado (instrumento_registro = 'C'), que não tem paciente. Não
      serve para contar pacientes nem para ligar registros entre si.
    tabelas: [producao_ambulatorial]
    colunas: [id_paciente_proto, instrumento_registro]
    severidade: silencioso
    verificado: "jun/2022: 5.613 distintos, 5.570 = id_municipio_6; BPA-C: 1 valor distinto (vazio) — medido 2026-10-05"
  - id: raca_cor_ordem_propria
    resumo: "Em producao_ambulatorial, raca_cor_paciente 3 = parda e 4 = amarela — o inverso do SIM, SINASC, SINAN e SISVAN."
    detalhe: >
      Dicionário da SIA: 1 branca, 2 preta, 3 parda, 4 amarela, 5 indígena,
      0 não exigido, 99 sem informação. Nos demais sistemas do MS, 3 = amarela e
      4 = parda. Empilhar ou comparar por código troca o maior grupo do país por
      um dos menores, sem erro. Decodifique cada fonte pelo próprio dicionario.
    tabelas: [producao_ambulatorial]
    colunas: [raca_cor_paciente]
    severidade: silencioso
    verificado: "2022: código 3 = 25,9%, 4 = 5,5%; br_ms_sia.dicionario 3 = parda — medido 2026-10-05"
  - id: bpa_consolidado_sem_paciente
    resumo: "Em producao_ambulatorial, o BPA consolidado (instrumento_registro = 'C') não tem CID, idade de paciente nem residência."
    detalhe: >
      É produção agregada por procedimento: em junho de 2022, 6,3 milhões de
      linhas e 190 milhões de procedimentos aprovados (57% do total), sem CID.
      Só BPA-I, APAC, RAAS têm dado de paciente; mesmo neles, o CID vem em 33%
      dos registros. Contar linhas não é contar atendimentos: some
      quantidade_aprovada_procedimento.
    tabelas: [producao_ambulatorial]
    colunas: [instrumento_registro, cid_principal_categoria, quantidade_aprovada_procedimento]
    severidade: silencioso
    verificado: "jun/2022: BPA-C 6.313.904 linhas, 189.762.245 procedimentos, 0 com CID; total 331.287.982 procedimentos — medido 2026-10-05"
  - id: meses_ausentes_por_municipio
    resumo: "Em producao_ambulatorial, um município pode faltar num mês em que o resto da UF está presente; somar o ano subconta. Confira count(DISTINCT mes) antes de comparar anos."
    tabelas: [producao_ambulatorial]
    colunas: [ano, mes, id_municipio]
    severidade: silencioso
    verificado: "Nova Friburgo sem jan/24, out/24 e fev/25 (só 1.573 linhas tardias daqueles meses de realização); RJ tem 69–92 de 92 municípios por mês — medido 2026-10-15"
  - id: ordenada_pela_chave
    resumo: "producao_ambulatorial está ordenada por ano e, dentro do ano, por id_estabelecimento_cnes: filtre pelo CNES cru (= ou IN), com ou sem ano, e o min/max dos row groups pula quase tudo. Outros filtros (município, procedimento, mes) leem o ano inteiro."
    tabelas: [producao_ambulatorial]
    colunas: [id_estabelecimento_cnes, ano]
    severidade: aviso
    detalhe: >
      495 arquivos numerados de ~100 MB, nenhum com mais de um ano, com faixas contíguas de
      id_estabelecimento_cnes (desempate por mes) dentro de cada ano. CNES vai como texto de 7
      dígitos com zero à esquerda ('2077485'), não número.
    verificado: "495 arquivos, 50.370 row groups, zero sobrepostos em id_estabelecimento_cnes, 6.159.969.884 linhas e soma de hash conferidas na troca — medido 2026-10-29 no beelink; CNES 2077485 sem ano (18 anos, 18.216.213 linhas) em 3,9 s"
