dataset: br_rodado_indicadores_municipais
gotchas:
  - id: formato_longo_com_unidade_por_indicador
    resumo: "municipio é uma tabela longa (12,4 milhões de linhas, 987 indicadores em 19 seções, 5.571 ids): cada linha é (município, indicador, ano, mês, dimensão) com valor numérico OU texto. Somar valor sem filtrar indicador mistura R$, hectares, contagens e coordenadas."
    detalhe: >
      Sempre filtre indicador (e dimensao, quando houver). valor é nulo em 5% das
      linhas (588 mil) e há 259.351 linhas sem valor nem texto. ano é nulo em 19%
      (indicadores sem data: retratos) e mes só existe em 2,5% das linhas.
      O grão (id_municipio, indicador, ano, mes, dimensao) é único na seção
      demografia (773.924 linhas = 773.924 chaves). Valores negativos são legítimos
      em sede_municipal.lat/lon (coordenadas), caged.saldo e demografia_empresarial.saldo.
    tabelas: [municipio]
    colunas: [indicador, valor, texto, dimensao, ano]
    severidade: silencioso
    verificado: "12.382.056 linhas; 987 indicadores; valor nn=11.793.997; texto nn=328.708; ano nn=10.031.942; sem valor e sem texto = 259.351 — medido 2026-11-04"
  - id: indicadores_com_valor_impossivel
    resumo: "car.camadas_ha.app tem hectares de 2,2e47 a 1,7e50 em 7 municípios (Boa Vista 1,69e50); compras_federais.fornecedores_locais.top.valor de Maceió é R$ 51,3 trilhões; bancario.depositos_totais de São Paulo em 2023 é R$ 22,5 trilhões. Não somar nem ranquear esses indicadores sem cortar o topo."
    detalhe: >
      Também 14 linhas de energia_gd.por_ano_cadastro com ano = 1900 (cadastro sem
      data). pib.serie.pib está em reais inteiros (São Paulo: R$ 1,067 trilhão no ano
      mais recente), sem fator de escala; os 49 valores acima de R$ 100 bi são
      capitais e grandes cidades. Antes de usar qualquer indicador de valor,
      confira o máximo por indicador.
    tabelas: [municipio]
    colunas: [valor, indicador, ano]
    severidade: silencioso
    verificado: "car.camadas_ha.app: 7 linhas com valor entre 2,20e47 e 1,69e50; compras_federais.fornecedores_locais.top.valor máx 51.292.281.497.025,71 (Maceió); bancario.depositos_totais SP 2023 = 22.490.479.448.871; energia_gd ano=1900 em 14 linhas — medido 2026-11-04"
