dataset: br_ibama_autos
gotchas:
  - id: auto_cancelado_soma_no_valor
    resumo: "auto_infracao traz autos cancelados, excluídos e substituídos junto com os válidos. Somar val_auto_infracao sem filtrar sit_cancelado = 'N' infla o valor: de 2020 em diante os cancelados somam R$ 2,07 bilhões, 7,6% do total."
    tabelas: [auto_infracao]
    colunas: [val_auto_infracao, sit_cancelado]
    severidade: silencioso
    verificado: "2020 em diante: sit_cancelado N 86.420 autos, R$ 25,11 bi; S 4.195 autos, R$ 2,07 bi; des_status_formulario Lavrado 82.956, Cancelado 790, Excluído 79, Substituído 18 — medido 2026-11-04"
  - id: valor_de_1992_em_moeda_da_epoca
    resumo: "Antes do Real (julho de 1994) val_auto_infracao está na moeda da época sem conversão: 1992 soma R$ 14 bilhões e traz um auto de 4,3 bilhões, 1993 soma 7,8 bilhões, contra 10 a 55 milhões em 1995-1998. Compare valores só de 1995 em diante. Valores acima de R$ 50 milhões (teto legal) aparecem até 2019 (máx 1 bilhão em 2016, 544 milhões em 2018); de 2020 em diante o máximo é 50 milhões."
    tabelas: [auto_infracao]
    colunas: [val_auto_infracao]
    severidade: silencioso
    verificado: "ano 1992: 1.063 autos, soma 14.012 milhões, máx 4.306.569.666; 1993: soma 7.817 milhões; 1995: 10 milhões; máximo individual 1.000.000.000 em 2016, 544.449.500 em 2018, 75.000.000 em 2019 e 50.000.000 em 2020-2026 — medido 2026-11-04"
  - id: chave_do_auto_nula_a_partir_de_2019
    resumo: "seq_auto_infracao e des_status_formulario vêm nulos juntos em linhas de 2019 em diante (22% em 2026: 2.822 de 12.794; 8% em 2023) e count(DISTINCT seq_auto_infracao) subconta. num_auto_infracao nunca é nulo, mas (num_auto_infracao, ser_auto_infracao) também repete: 683.216 pares para 691.168 linhas de 1996 em diante."
    tabelas: [auto_infracao]
    colunas: [seq_auto_infracao, des_status_formulario]
    severidade: silencioso
    verificado: "2026: 12.794 linhas, 9.972 com seq_auto_infracao; 2025 16.272/14.992; 2023 17.192/16.409; 2018 17.884/17.884; pares (num, ser) distintos 683.216 em 691.168 linhas (ano >= 1996) — medido 2026-11-04"
  - id: campos_de_fato_e_ano
    resumo: "dt_fato_infracional só é preenchido a partir de 2019 (nulo em todas as linhas de 2010 e quase todas até 2018); ano é o ano do auto (dat_hora_auto_infracao), não do fato. Antes de 1996 há apenas 2 a 3,7 mil autos por ano (36.651 em 1996), série incompleta."
    tabelas: [auto_infracao]
    colunas: [dt_fato_infracional, ano]
    severidade: silencioso
    verificado: "dt_fato_infracional preenchido: 2010 0 de 21.384; 2018 10 de 17.884; 2020 8.413 de 9.533; 2023 16.417 de 17.192; autos por ano 1995 3.755 e 1996 36.651 — medido 2026-11-04"
  - id: cod_municipio_e_texto
    resumo: "cod_municipio é id_municipio de 7 dígitos em texto: junta direto com br_inpe_deter.avisos.GEOCODIBGE (não com MUNICIPALI, que é nome)."
    tabelas: [auto_infracao]
    colunas: [cod_municipio]
    severidade: silencioso
    verificado: "cod_municipio preenchido em todas as linhas de 2010-2026 exceto 2019 (14.527 de 14.530) e 2020 (9.530 de 9.533); nota do harness (notas.json) — medido 2026-11-04"
