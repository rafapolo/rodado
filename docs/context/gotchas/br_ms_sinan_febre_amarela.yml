dataset: br_ms_sinan_febre_amarela
gotchas:
  - id: notificacao_nao_e_caso_confirmado
    resumo: "microdados_febre_amarela é uma linha por NOTIFICAÇÃO de caso suspeito, não por caso. Contar linhas conta suspeitos: 82.844 linhas, das quais só 3.895 (4,7%) têm CLASSI_FIN = '1' (confirmado). Para casos, filtre CLASSI_FIN = '1'."
    detalhe: >
      CLASSI_FIN: '2' descartado 68.200, '' vazio 6.722, '8' 4.027 (inconclusivo, código fora do
      dicionário v5), '1' confirmado 3.895. O pico de notificações de 2023 (17.942 linhas) é
      quase todo descarte (15.970 descartados, 359 confirmados): olhar o total de linhas faz 2023
      parecer um surto 5x maior que 2019 (4.852 linhas), quando os confirmados são 359 contra 286.
      Em 2025 e 2026 o vazio cresce (1.865 e 1.045 linhas sem classificação, casos ainda em
      investigação), então a série de confirmados dos últimos 2 anos está subestimada.
    tabelas: [microdados_febre_amarela]
    colunas: [CLASSI_FIN]
    severidade: silencioso
    verificado: "82.844 linhas; CLASSI_FIN 2 = 68.200, vazio = 6.722, 8 = 4.027, 1 = 3.895; confirmados por ano 2019 = 286, 2023 = 359, 2024 = 409 — medido 2026-11-04"
  - id: obitos_pela_evolucao
    resumo: "Óbito por febre amarela: EVOLUCAO = '2' entre os confirmados (1.124), não DT_OBITO, que também vem preenchida em outros desfechos (1.160 confirmados com DT_OBITO)."
    detalhe: >
      Entre os 3.895 confirmados: EVOLUCAO '1' (cura) 2.511, '2' (óbito pelo agravo) 1.124, '3'
      (óbito por outra causa) 34, '9' (ignorado) 82, vazio 144. DT_OBITO não vazia em 1.160
      confirmados = 1.124 + 34 + 2 de outros desfechos. Letalidade pelo agravo = 1.124 / 3.895
      = 28,9%. Sem filtrar CLASSI_FIN = '1', a letalidade despenca para ~1,4% porque o
      denominador são os suspeitos.
    tabelas: [microdados_febre_amarela]
    colunas: [EVOLUCAO, DT_OBITO]
    severidade: silencioso
    verificado: "confirmados: EVOLUCAO 1 = 2.511, 2 = 1.124, 3 = 34, 9 = 82, vazio = 144; DT_OBITO preenchida em 1.160 — medido 2026-11-04"
  - id: notificacoes_repetidas
    resumo: "Há linhas repetidas: 82.844 linhas para 82.666 combinações distintas de ano, data de notificação, município, unidade, início dos sintomas, idade, sexo e município de residência (178 sobrando). Contar pessoas pede deduplicar."
    tabelas: [microdados_febre_amarela]
    severidade: aviso
    verificado: "count(*) = 82.844; count(DISTINCT 8 campos) = 82.666 — medido 2026-11-04"
  - id: sem_confirmados_de_2017_2018_completos
    resumo: "A série de confirmados por ano é baixa nos anos de surto: 2017 = 186 e 2018 = 256 casos confirmados, enquanto os boletins do Ministério da Saúde para as temporadas 2016/17 e 2017/18 falam em mais de mil confirmados cada. Não use esta tabela para dimensionar o surto de 2017-2018."
    detalhe: >
      Comparação com a ordem de grandeza do boletim oficial (de memória, não reconferida na
      fonte nesta rodada). O que foi medido aqui: confirmados e óbitos por agravo em 2017 e 2018
      somam 442 e 162. Notificações de 2018 (4.733) não chegam a 5% do total de 20 anos.
    tabelas: [microdados_febre_amarela]
    colunas: [CLASSI_FIN]
    severidade: silencioso
    verificado: "confirmados 2017 = 186, 2018 = 256; óbitos por agravo 67 e 95; comparação oficial não reconferida — medido 2026-11-04"
