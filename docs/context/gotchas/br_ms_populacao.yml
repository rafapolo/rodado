dataset: br_ms_populacao
gotchas:
  - id: grao_sexo_por_faixa
    resumo: "municipio tem uma linha por município × sexo × grupo_idade (34 por município e ano, 189.380 por ano): SUM(populacao) dá a população, count(*) ou AVG(populacao) não. Para o total do município, some sem filtro; para o sexo, filtre sexo ('masculino'/'feminino', minúsculo)."
    tabelas: [municipio]
    colunas: [sexo, grupo_idade, populacao]
    severidade: silencioso
    verificado: "2022: 2 sexos × 17 grupos de idade, 5.570 municípios, nenhum com contagem diferente de 34; masculino 102.875.114 + feminino 107.987.869 = 210.862.983 — medido 2026-11-03"
  - id: degrau_2022_2023_contra_ibge
    resumo: "Em 2022 e 2023 a população do MS não aplica o Censo 2022 e fica 3,8% e 4,2% acima de br_ibge_populacao (210,9 e 211,7 mi contra 203,1 mi); nos municípios, 5.569 de 5.570 diferem em 2022 (até 23,5%). Não misture as duas séries nesses dois anos; fora deles (2019–2021, 2024–2025) os totais são iguais."
    detalhe: >
      Os totais batem exatamente em 2019 (210.147.125), 2020 (211.755.692),
      2021 (213.317.639), 2024 (212.583.750) e 2025 (213.421.037). Para taxa
      por habitante em 2022 ou 2023, use br_ibge_populacao (métrica populacao).
    tabelas: [municipio]
    colunas: [populacao, ano]
    severidade: silencioso
    verificado: "soma por ano, br_ms_populacao × br_ibge_populacao: 2022 210.862.983 × 203.080.756; 2023 211.695.158 × 203.078.668; join por município em 2022: 5.570 pares, 5.569 diferem, maior diferença relativa 23,5% — medido 2026-11-03"
