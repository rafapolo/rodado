dataset: br_cvm_oferta_publica_distribuicao
gotchas:
  - id: duas_fontes_no_mesmo_dia
    resumo: "Desde 2026-11-20 a tabela dia junta dois arquivos da CVM: oferta_distribuicao.csv (ICVM 400/476/555, uma linha por oferta-série-ativo, até 2022) e oferta_resolucao_160.csv (Resolução CVM 160, 2023 em diante, uma linha por requerimento). O regime está em rito_oferta: 'ICVM 476' 27.865, 'CVM 160' 15.247, 'ICVM 555 (com registro automatico)' 11.109, 'ICVM 400 (com registro)' 9.183, 'ICVM 400 (dispensada de registro)' 672, 'RCVM 160 (rito ordinario)' 118. Contar linhas mistura séries com requerimentos."
    tabelas: [dia]
    colunas: [rito_oferta]
    severidade: silencioso
    verificado: "count() por rito_oferta = 64.194 linhas no total — medido 2026-11-20"
  - id: colunas_da_res160_sem_par
    resumo: "As 15.247 linhas da Resolução 160 vêm sem par em numero_registro_oferta, data_inicio_oferta, data_abertura_processo, data_dispensa_oferta, data_emissao, data_vencimento, cnpj_ofertante, nome_ofertante, nome_vendedor, modalidade_oferta, modalidade_dispensa_registro, preco_unitario, serie, classe_ativo, especie_ativo, forma_ativo, quantidade_*_lote_suplementar, tipo_fundo_investimento, atualizacao_monetaria, juros, projeto_audiovisual, data_comunicado: ficam NULL. Filtrar ou agrupar por data_inicio_oferta corta 2023 em diante; para as duas regras juntas use coalesce(data_inicio_oferta, data_registro_oferta). Pares adotados: Numero_Processo→numero_processo, Valor_Mobiliario→tipo_ativo (vocabulário próprio, maiúsculas: 'COTAS DE FIDC', 'DEBENTURES'), Rito_Requerimento→modalidade_registro, Data_requerimento→data_protocolo, Data_Registro→data_registro_oferta, Qtde_Total_Registrada→quantidade_total, Valor_Total_Registrado→valor_total, Titulo_incentivado→oferta_incentivo_fiscal, Status_Requerimento→ultimo_comunicado. As colunas da fonte sem lugar no schema (investidores por tipo, gestor, administrador, lastro, destinação) ficam de fora."
    tabelas: [dia]
    colunas: [data_inicio_oferta, data_registro_oferta, data_protocolo, tipo_ativo, ultimo_comunicado]
    severidade: erro
    verificado: "data_inicio_oferta preenchida em 27.865 de 64.194 (nenhuma da CVM 160); data_registro_oferta em 35.591 — medido 2026-11-20"
  - id: res160_valor_registrado_e_status
    resumo: "Nas linhas da CVM 160, valor_total e quantidade_total são o valor/quantidade REGISTRADOS, não o distribuído, e ultimo_comunicado traz o status do requerimento: só 'Oferta Encerrada' (13.141 de 15.247) saiu de fato; 'Registro Caducado' (453), 'Oferta Revogada' (100), 'Requerimento Expirado' (26), 'Oferta Suspensa' (12) não. Somar valor_total sem filtrar status superestima: R$ 3.363 bi no total (2023: 553; 2024: 934; 2025: 1.040; 2026 até 11-19: 832)."
    tabelas: [dia]
    colunas: [valor_total, quantidade_total, ultimo_comunicado]
    severidade: silencioso
    verificado: "ultimo_comunicado das linhas rito_oferta = 'CVM 160': Oferta Encerrada 13.141, Registro Concedido 1.486, Registro Caducado 453, Oferta Revogada 100, Aguardando Bookbuilding 29, Requerimento Expirado 26, Oferta Suspensa 12 — medido 2026-11-20"
  - id: linhas_antigas_sem_data_de_inicio_e_valor_placeholder
    resumo: "21.082 linhas do arquivo antigo (ICVM 400 com registro e as 11.109 'ICVM 555 com registro automatico', de fundos) vêm sem data_inicio_oferta: têm numero_processo e quase todas data_registro_oferta, mas aparecem fora de qualquer filtro por início. Nas 'ICVM 555' valor_total chega a 99.999.999.999.999 (placeholder da CVM): a soma dá R$ 217 mil bi, impossível. Antes de somar valor_total, exclua esse rito ou limite o valor. O espelho antigo (BD) só trazia as 27.486 linhas com data de início e nenhum numero_processo; o arquivo da CVM tem numero_processo nessas 21.082."
    tabelas: [dia]
    colunas: [data_inicio_oferta, valor_total, numero_processo, rito_oferta]
    severidade: erro
    verificado: "21.082 linhas rito <> 'CVM 160' sem data_inicio_oferta; sum(valor_total) ICVM 555 = R$ 217.228 bi, max 99.999.999.999.999; ICVM 476 = R$ 3.009 bi — medido 2026-11-20"
  - id: valores_em_texto_e_linha_por_serie
    resumo: "valor_total, quantidade_total e preco_unitario são TEXTO ('820030.00'): some com try_cast(... AS DOUBLE). Nas ICVM 476, cada linha é uma oferta-série-ativo, não uma oferta (cotas de fundos fechados dominam). 95 linhas idênticas se repetem tal como a CVM publica; não deduplicar sem critério."
    tabelas: [dia]
    colunas: [valor_total, quantidade_total, preco_unitario, tipo_ativo]
    severidade: silencioso
    verificado: "ICVM 476: 27.865 linhas, R$ 3.009,2 bi; 95 linhas idênticas repetidas na saída do gate — medido 2026-11-20"
  - id: nome_do_lider_revisado_na_fonte
    resumo: "A CVM revisou nomes de líder de ofertas antigas desde a cópia da BD (112 linhas do espelho de 2026-11 mudaram, 90 só em nome_lider, ex. 'CBSF TRUST ...' virou 'APOCK TRUST ...'). A tabela guarda a versão atual da CVM, então agrupar por nome_lider pode diferir de análises feitas com a BD; o cnpj_lider não mudou."
    tabelas: [dia]
    colunas: [nome_lider]
    severidade: informativo
    verificado: "112 linhas do espelho de 27.486 sem linha idêntica na fonte; 90 diferem só em nome_lider — medido 2026-11-20"
