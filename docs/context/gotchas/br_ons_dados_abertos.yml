dataset: br_ons_dados_abertos
gotchas:
  - id: sin_ja_e_o_total
    resumo: "balanco_energia_subsistema_ho tem, a cada hora, uma linha por subsistema (N, NE, S, SE) e uma 'SIN' que já é o total nacional: somar tudo conta o dobro. Exclua 'SIN' para somar subsistemas, ou use só 'SIN' para o total."
    tabelas: [balanco_energia_subsistema_ho]
    colunas: [id_subsistema, val_carga, val_gerhidraulica, val_gertermica, val_gereolica, val_gersolar]
    severidade: silencioso
    verificado: "5 linhas por hora; em 2025 (8.760 horas) a carga somada dos 4 subsistemas é 697,374 mil GWmed-hora e a da linha SIN 697,374 (diferença máxima por hora 0,005 MWmed) — medido 2026-10-28"
  - id: id_subsistema_com_espaco
    resumo: "Desde 2026-01-01 id_subsistema vem com espaço no fim ('N  ', 'NE ', 'S  ', 'SE '; 'SIN' não): id_subsistema = 'N' perde todas as linhas de 2026. Use trim(id_subsistema)."
    tabelas: [balanco_energia_subsistema_ho]
    colunas: [id_subsistema]
    severidade: silencioso
    verificado: "28.416 linhas de 2026-01-01 a 2026-10-23 com id_subsistema <> trim(id_subsistema) (7.104 por N, NE, S, SE); id_subsistema = 'N' tem 0 linhas em 2026 — medido 2026-10-28"
  - id: restricao_coff_meia_hora_e_ceg_vazio
    resumo: "restricao_coff_eolica_tm e restricao_coff_fotovoltaica_tm são de meia hora, em MWmed (para MWh, some e divida por 2), e ceg vem como '-' para usina de conjunto: a UF é id_estado. A taxa de corte é val_geracaolimitada / (val_geracao + val_geracaolimitada); val_geracaoreferenciafinal quase não é preenchida."
    tabelas: [restricao_coff_eolica_tm, restricao_coff_fotovoltaica_tm]
    colunas: [val_geracao, val_geracaolimitada, val_geracaoreferenciafinal, val_geracaonaorealizadaapurada, ceg, id_estado]
    severidade: silencioso
    verificado: "eólica 2025: 2.712.912 linhas, geração 111,07 TWh (soma ÷ 2) e limitada 43,93 TWh (28,3%); a apurada não realizada dá 26,22 TWh (19,1%); referência final 3,98 TWh; a solar começa em 2024 (2025: 31,72 TWh gerados, 19,12 limitados, 37,6%) — medido 2026-11-04"
  - id: capacidade_geracao_ceg_com_zero
    resumo: "capacidade_geracao liga ao SIGA da ANEEL pela CEG, mas o último segmento vem com dois dígitos ('.01') e o SIGA com um ('.1'): normalize antes de juntar. Itaipu tem 14.000 MW aqui e 7.000 MW na ANEEL (parte brasileira)."
    tabelas: [capacidade_geracao]
    colunas: [ceg, val_potenciaefetiva, dat_desativacao]
    severidade: silencioso
    verificado: "1.972 CEG sem desativação, 1.946 casam (98,7%) com br_aneel_dadosabertos.siga_empreendimentos_geracao.CodCEG; hidrelétrica 109,15 GW contra 102,15 GW, 95,15 contra 95,15 sem Itaipu — medido 2026-11-04"
