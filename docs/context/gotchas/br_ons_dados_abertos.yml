dataset: br_ons_dados_abertos
gotchas:
  - id: sin_ja_e_o_total
    resumo: "balanco_energia_subsistema_ho tem, a cada hora, uma linha por subsistema (N, NE, S, SE) e uma 'SIN' que já é o total nacional: somar tudo conta o dobro. Exclua 'SIN' para somar subsistemas, ou use só 'SIN' para o total."
    tabelas: [balanco_energia_subsistema_ho]
    colunas: [id_subsistema, val_carga, val_gerhidraulica, val_gertermica, val_gereolica, val_gersolar]
    severidade: silencioso
    verificado: "5 linhas por hora; em 2025 (8.760 horas) a carga somada dos 4 subsistemas é 697,374 mil GWmed-hora e a da linha SIN 697,374 (diferença máxima por hora 0,005 MWmed) — medido 2026-10-28"
  - id: id_subsistema_com_espaco
    resumo: "Desde 2026-01-01 id_subsistema vem com espaço no fim ('N  ', 'NE ', 'S  ', 'SE '; 'SIN' não): id_subsistema = 'N' perde todas as linhas de 2026. Use trim(id_subsistema)."
    tabelas: [balanco_energia_subsistema_ho]
    colunas: [id_subsistema]
    severidade: silencioso
    verificado: "28.416 linhas de 2026-01-01 a 2026-10-23 com id_subsistema <> trim(id_subsistema) (7.104 por N, NE, S, SE); id_subsistema = 'N' tem 0 linhas em 2026 — medido 2026-10-28"
  - id: restricao_coff_meia_hora_e_ceg_vazio
    resumo: "restricao_coff_eolica_tm e restricao_coff_fotovoltaica_tm são de meia hora, em MWmed (para MWh, some e divida por 2), e ceg vem como '-' para usina de conjunto: a UF é id_estado. A taxa de corte é val_geracaolimitada / (val_geracao + val_geracaolimitada); val_geracaoreferenciafinal quase não é preenchida."
    tabelas: [restricao_coff_eolica_tm, restricao_coff_fotovoltaica_tm]
    colunas: [val_geracao, val_geracaolimitada, val_geracaoreferenciafinal, val_geracaonaorealizadaapurada, ceg, id_estado]
    severidade: silencioso
    verificado: "eólica 2025: 2.712.912 linhas, geração 111,07 TWh (soma ÷ 2) e limitada 43,93 TWh (28,3%); a apurada não realizada dá 26,22 TWh (19,1%); referência final 3,98 TWh; a solar começa em 2024 (2025: 31,72 TWh gerados, 19,12 limitados, 37,6%) — medido 2026-11-04"
  - id: capacidade_geracao_ceg_com_zero
    resumo: "capacidade_geracao liga ao SIGA da ANEEL pela CEG, mas o último segmento vem com dois dígitos ('.01') e o SIGA com um ('.1'): normalize antes de juntar. Itaipu tem 14.000 MW aqui e 7.000 MW na ANEEL (parte brasileira)."
    tabelas: [capacidade_geracao]
    colunas: [ceg, val_potenciaefetiva, dat_desativacao]
    severidade: silencioso
    verificado: "1.972 CEG sem desativação, 1.946 casam (98,7%) com br_aneel_dadosabertos.siga_empreendimentos_geracao.CodCEG; hidrelétrica 109,15 GW contra 102,15 GW, 95,15 contra 95,15 sem Itaipu — medido 2026-11-04"
  - id: deprec_e_copia_do_diario_hidrologico
    resumo: "deprec_hidro e deprec_fluv são conjuntos marcados como 'deprec' (depreciados) no bucket do ONS. deprec_hidro tem o mesmo dicionário de dados_hidrologicos_di (Dados Hidrológicos Diários, mesmas colunas, id_reservatorio, 2000 em diante) e é a mesma série; para análise use dados_hidrologicos_di e não some as duas. deprec_fluv é a série diária das grandezas fluviométricas (a partir de 2015), a mesma família de grandezas_fluviometricas_di."
    tabelas: [deprec_hidro, deprec_fluv, dados_hidrologicos_di, grandezas_fluviometricas_di]
    colunas: [id_reservatorio, din_instante, din_medicao]
    severidade: silencioso
    verificado: "deprec_hidro 1.642.081 linhas de 2000-01-01 a 2026-10-28 (176 reservatórios) contra 1.602.669 de dados_hidrologicos_di até 2026-10-25 — medido 2026-11-10; a conferência linha a linha entre as duas não foi feita"
  - id: fusao_hidrologico_ena_2026_11
    resumo: "dados_hidrologicos_di e ena_reservatorio_di são fundidas: a fonte novou o histórico, mas perdeu usinas e dias que só o espelho tinha. Três reservatórios da ENA mudaram de nome (ITAPARICA -> LUIZ GONZAGA, MAUA -> GOV JAYME CANET JR, MOXOTO -> APOLONIO SALES, mesmo cod_resplanejamento): as linhas antigas com o nome velho foram substituídas pelas da fonte com o nome novo, então filtrar pelo nome antigo não acha nada."
    tabelas: [dados_hidrologicos_di, ena_reservatorio_di]
    colunas: [id_reservatorio, cod_usina, nom_reservatorio, cod_resplanejamento, din_instante, ena_data]
    severidade: aviso
    verificado: "2026-11-23 16:45: dados_hidrologicos_di 4.126.107 (fonte, desde 1931, 178 reservatórios) + 29.564 do espelho (6 reservatórios só de 2022 e dias faltantes de TIEDSO, PBSTAC, DCSACM etc.) = 4.155.671; ena_reservatorio_di 1.512.702 + 178 (DARDANELOS 2000-2011, RONDON II 2000-2009) = 1.512.880; chaves por (id, dia) e (cod, dia)"
  - id: res_cotaareavolume_curva_completa
    resumo: "res_cotaareavolume passou de 2 reservatórios (45.102 linhas) para a tabela cota-área-volume completa da fonte (174 reservatórios, 9,15 milhões de linhas). din_valinicial/din_valfinal marcam a vigência de cada versão da curva (18 datas de início, 1901-01-01 a 2021-06-09; fim 3000-12-31): para a curva atual de um reservatório, pegue a linha de maior din_valinicial."
    tabelas: [res_cotaareavolume]
    colunas: [id_reservatorio, din_valinicial, din_valfinal, val_cota, val_area, val_volume]
    severidade: silencioso
    verificado: "2026-11-23 16:45: 45.102 -> 9.154.684 linhas; as duas curvas antigas (PNTBCA 17.101, PNESTR 28.001) têm as mesmas contagens e cotas na fonte; a área difere até 0,005 (versão mais nova); sem filtrar por vigência a mesma cota aparece uma vez por versão"
