    resumo: "A série municipal mistura Censo, Contagem e estimativas, com saltos que não são crescimento: 2006 = 186,8 mi, 2007 = 184,0 mi (Contagem), 2012 = 193,9 mi para 2013 = 201,0 mi, 2021 = 213,3 mi para 2022 = 203,1 mi (Censo 2022) e 2023 = 203,1 mi (repete o Censo) para 2024 = 212,6 mi (estimativa). Taxa de crescimento ou per capita atravessando essas viradas mede revisão de método."
    detalhe: >
      Os totais batem com os números oficiais do Censo: 2010 = 190.755.799 e 2022 = 203.080.756,
      iguais nas três tabelas (municipio, uf, brasil). 2022 e 2023 trazem praticamente o mesmo
      total (203.080.756 e 203.078.668) porque 2023 é o Censo reponderado; as estimativas voltam
      em 2024 (212.583.750) e 2025 (213.421.037).
    tabelas: [municipio, uf, brasil]
