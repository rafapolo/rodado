dataset: br_rf_cno
gotchas:
  - id: snapshot_por_extracao
    resumo: "microdados, areas, cnaes e vinculos têm só o último retrato (uma data_extracao). O passado está em *_historico: filtrar uma data antiga nas tabelas atuais devolve zero linhas."
    detalhe: >
      Desde 2026-11-03 as 4 tabelas guardam só o retrato mais novo de cada uma
      (microdados 2026-01-28; areas, cnaes e vinculos 2026-09-12: as tabelas não andam
      juntas). Os 192/312 retratos de 2024-08-05 em diante estão em microdados_historico,
      areas_historico, cnaes_historico e vinculos_historico (ver historico_como_ler).
      Evolução ou estado numa data passada sai do histórico, nunca das tabelas atuais.
      Retrato novo da fonte entra por `gera_retrato_historico.py --anexa` (docs/tecnico/mes_novo_cno.md, só local):
      as datas acima mudam a cada anexo; a vigente de cada tabela é `max(fim)` do seu `*_historico`.
    tabelas: [microdados, areas, cnaes, vinculos]
    colunas: [data_extracao]
    severidade: silencioso
    verificado: "1 data_extracao por tabela: microdados 3.259.913 linhas = 3.259.913 id_cno (2026-01-28), areas 4.531.627, cnaes 3.942.713, vinculos 431.211 (2026-09-12); contagens iguais às do mesmo retrato antes da troca — medido 2026-11-03"
  - id: id_responsavel_nan
    resumo: "id_responsavel é a string 'nan' para todo responsável pessoa física: não junte por CPF."
    detalhe: >
      Artefato de pipeline (NaN serializado como texto), não NULL. Só as
      linhas com 14 dígitos (CNPJ) servem para join; nome_responsavel segue
      preenchido nas demais.
    tabelas: [microdados]
    colunas: [id_responsavel, nome_responsavel]
    severidade: silencioso
    verificado: "extração 2025-07-28: 1.981.742 de 3.006.410 linhas com id_responsavel = 'nan', 1.024.668 com 14 dígitos, 0 NULL — medido 2026-09-25"
  - id: retratos_com_buraco_desde_2025_07
    resumo: "No histórico de microdados não há retrato entre 2025-07-28 e 2026-01-28: não calcule evolução nesse trecho."
    detalhe: >
      Cada data_extracao repete a base inteira. Em 2026-11-01 a coleta trouxe só o
      retrato mais novo com linhas, 2026-01-28, e pulou os ~120 intermediários
      (148 GB de leitura). O metadado da fonte lista datas até 2026-10 que estão
      vazias na contagem exata. Em microdados_historico o período 2025-07-28 → 2026-01-28 é um salto, não uma série.
    tabelas: [microdados_historico]
    colunas: [inicio, fim]
    severidade: silencioso
    verificado: "max(data_extracao) = 2026-01-28, 192 retratos no disco — medido 2026-11-01"
  - id: historico_como_ler
    resumo: "Nas tabelas *_historico cada linha vale de inicio a fim (datas de data_extracao, inclusive). Retrato de uma data D: WHERE D BETWEEN inicio AND fim. Estado atual: fim = max(fim)."
    detalhe: >
      microdados_historico, areas_historico, cnaes_historico e vinculos_historico
      guardam todos os retratos (as tabelas atuais só têm o último) em forma compacta: uma linha
      por período em que a linha inteira (todas as colunas menos data_extracao) se
      repetiu em retratos consecutivos. Não há data_extracao: a coluna virou inicio e
      fim. Uma obra que muda qualquer campo abre um período novo, então contar linhas
      do histórico não conta obras; conte id_cno distinto dentro de um retrato. Linha
      repetida dentro do mesmo retrato (areas, vinculos de 2025-06-04) vira uma linha
      por cópia. A data D precisa ser um retrato existente: entre dois retratos o
      histórico responde como o anterior. O último retrato de microdados é 2026-01-28;
      o de areas, cnaes e vinculos é 2026-09-12 (as tabelas não andam juntas; um retrato novo
      anexado por `--anexa` avança `max(fim)` da sua tabela, e só dela).
    tabelas: [microdados_historico, areas_historico, cnaes_historico, vinculos_historico]
    colunas: [inicio, fim]
    severidade: silencioso
    verificado: "reconstrução por inicio <= data <= fim igual à tabela original em todos os retratos (contagem e soma do hash da linha): microdados 192, areas 192, cnaes 192, vinculos 312; 2025-03-09 dá 2.816.370 obras nos dois lados — medido 2026-11-03"
  - id: retratos_duplicados_no_espelho
    resumo: "Consultas antigas sobre as tabelas de antes de 2026-11-03 contavam em dobro algumas extrações (arquivo copiado duas vezes no sync); o histórico não tem a duplicação."
    detalhe: >
      Os pares de arquivo eram idênticos byte a byte (md5): microdados 115/116 e
      134/135, 13 pares em areas e 6 em cnaes (2025-05-26 em microdados: 5,8 mi linhas
      para 2,9 mi obras). As tabelas *_historico foram geradas sem a segunda cópia.
      Número tirado das tabelas antigas nessas datas está dobrado.
    tabelas: [microdados_historico, areas_historico, cnaes_historico]
    colunas: [inicio, fim]
    severidade: silencioso
    verificado: "md5 igual em 2 pares de microdados, 13 de areas, 6 de cnaes; 2025-05-26: 5.831.496 linhas, 2.915.748 id_cno — medido 2026-11-03"
  - id: retrato_2026_01_nulo_no_lugar_de_nan
    resumo: "Em microdados (retrato 2026-01-28) os vazios são NULL; nos retratos anteriores do histórico são a string 'nan'. Filtre os dois (IS NULL OR = 'nan')."
    detalhe: >
      O coletor novo grava NULL em id_responsavel, id_cno_vinculado, nome_empresarial,
      caixa_postal e afins. Por isso toda obra que existia em 2025-07-28 abre um período
      novo em 2026-01-28 em microdados_historico, sem mudança de conteúdo.
    tabelas: [microdados, microdados_historico]
    colunas: [id_responsavel, id_cno_vinculado, nome_empresarial, caixa_postal]
    severidade: silencioso
    verificado: "id_cno 330000038368: 'nan' em 2025-07-28, NULL em 2026-01-28; 3.006.410 obras com mais de um período = as 3.006.410 de 2025-07-28 — medido 2026-11-03"
