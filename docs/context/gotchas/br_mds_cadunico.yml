dataset: br_mds_cadunico
gotchas:
  - id: formato_longo_filtre_variavel
    resumo: "indicadores_municipio tem uma linha por município, mês, indicador e variável: filtre id_indicador E variavel. Filtrar só variavel pode dobrar, e somar tudo mistura pessoas, famílias e percentuais."
    detalhe: >
      A mesma variável aparece em mais de um indicador, com o mesmo valor. Variável
      de percentual não soma entre municípios. O nível é só municipal, embora o
      catálogo liste outros. São 350 mi de linhas sem partição: filtre referencia,
      que é DATE no 1º dia do mês.
    tabelas: [indicadores_municipio, indicadores_catalogo]
    colunas: [id_indicador, variavel, valor, referencia]
    severidade: silencioso
    verificado: "2026-10-31: 2019-12-01 com 2.153.158 linhas e grão único; 'Número total de pessoas cadastradas no Cadastro Único' soma 152.834.708, o dobro de 76.417.354 (2 indicadores: c2fe1194f018 e 3cc6954ecb8d); 28.884.000 famílias"
  - id: indicadores_entram_e_saem
    resumo: "Os indicadores mudam ao longo da série: 73 em 2012, 132 em 2023 e 115 em 2026; 24 terminaram, vários em fev/2023. A série não é contínua para todos."
    detalhe: >
      A série vai de 2012-08 a 2026-09. Confira min e max de referencia do indicador
      antes de comparar anos. Vários nomes avisam '(até fev/2023)'.
    tabelas: [indicadores_municipio]
    colunas: [id_indicador, indicador, referencia]
    severidade: silencioso
    verificado: "2026-10-31: 139 indicadores, 5.571 municípios, 350.069.210 linhas; distintos por ano: 73 (2012), 96 (2022), 132 (2023), 115 (2026); 24 sem dado em 2026, ao menos 8 com fim em 2023-02-01"
  - id: ultimo_mes_sem_todos_indicadores
    resumo: "Em indicadores_municipio, os últimos meses chegam sem parte dos indicadores: 2026-09 tem 109, contra 115 em 2026-07. Para o 'mais recente', pegue o max(referencia) de cada indicador, não o mês global."
    detalhe: >
      Faltam em 2026-09, entre outros, as faixas de renda após o PBF (famílias e
      pessoas inscritas param em 2026-07) e trabalho infantil (para em 2026-08).
      Filtrar referencia = max(referencia) da tabela devolve vazio para esses
      indicadores, sem erro, e uma comparação entre indicadores mistura meses.
    tabelas: [indicadores_municipio]
    colunas: [id_indicador, referencia]
    severidade: silencioso
    verificado: "2026-11-03: indicadores distintos por mês 113 (2026-05), 115 (06 e 07), 113 (08), 109 (09), sempre 5.571 municípios; dc30866959a9 e cfbbb3a75881 com último mês 2026-07, 38867ce26ad1 e 9fec08d62b19 com 2026-08"
