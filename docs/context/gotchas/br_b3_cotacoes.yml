dataset: br_b3_cotacoes
gotchas:
  - id: preco_nao_ajustado_e_sem_moeda_unica
    resumo: "Os preços são nominais: sem ajuste de proventos, sem ajuste de grupamento e na moeda do dia (CZ$, NCZ$, CR$, R$ e outras até 1994). Filtre moeda = 'R$' e divida por fator_cotacao antes de comparar datas ou calcular retorno."
    detalhe: >
      fator_cotacao diz por quantas ações o preço vale (1 ou 1000 no passado):
      1.854.001 linhas têm fator diferente de 1. Grupamento e desdobramento aparecem como
      salto de preço, e dividendo como queda no ex-data. Retorno de longo prazo calculado
      direto daqui sai errado sem aviso.
    tabelas: [cotacoes]
    colunas: [preco_fechamento, fator_cotacao, moeda]
    severidade: silencioso
    verificado: "2026-10-31: 24.760.472 linhas; R$ 1994+, CR$ 1986-1994, CZ$ 1986-1989, NCZ$ 1989-1990; PETR4 lote padrão em 2024-12-30 = 36,19"
  - id: uma_linha_por_mercado_e_bdi
    resumo: "Uma linha por ticker, dia, tipo_mercado e codigo_bdi. A maior parte da tabela é opção (BDI 78 e 82, 15,2 mi de 24,8 mi): para ações à vista, filtre codigo_bdi = '02' (lote padrão) e tipo_mercado = '010'."
    detalhe: >
      Somar `volume` sem filtrar mistura à vista, fracionário, termo e opções.
      ticker não é identidade da empresa: é reaproveitado e muda; use isin para
      seguir o papel, e note que 938.727 tickers vêm quase todos de séries de opção.
    tabelas: [cotacoes]
    colunas: [codigo_bdi, tipo_mercado, ticker, isin, volume]
    severidade: aviso
    verificado: "2026-10-31: BDI 78 = 8.070.569, 82 = 7.119.486, 02 = 3.253.028, 96 = 2.493.240; 0 duplicatas de data+ticker+mercado+BDI+prazo em 2024"
