dataset: br_susep_dados_abertos
gotchas:
  - id: contabeis_com_subtotais
    resumo: "As tabelas contabeis_* têm uma linha por conta, com subtotais e a linha '**** TOTAL DO ATIVO ****' junto das contas. Somar valor por empresa conta o mesmo dinheiro várias vezes: filtre a conta pelo cmptitulo ou cmpid."
    tabelas: [contabeis_ativo, contabeis_passivo, contabeis_dre]
    colunas: [cmpid, cmptitulo, cmpnumero, valor]
    severidade: erro
    verificado: "CNPJ 14868712000131 em 2025-12: TOTAL DO ATIVO 2.357.934.783,53 ao lado de CIRCULANTE 1.469.251.713,78 — medido 2026-10-31"
  - id: empresa_em_varios_mercados
    resumo: "empresas_cadastro tem uma linha por empresa × mercado e só as entidades autorizadas hoje: 371 linhas para 274 CNPJs. Contar linhas não conta empresas, e empresa extinta não está lá, embora siga nas séries."
    tabelas: [empresas_cadastro]
    colunas: [entcgc, mercodigo]
    severidade: silencioso
    verificado: "371 linhas, 274 entcgc distintos; receitas_seguros tem 184 CNPJs em 2016–2026 — medido 2026-10-31"
  - id: mesreferencia_primeiro_dia
    resumo: "mesreferencia é DATE no primeiro dia do mês e a série só começa em 2016. Nas tabelas contábeis há menos linhas de outubro a dezembro porque 2026 ainda não chegou lá: compare anos completos."
    tabelas: [receitas_seguros, contabeis_ativo]
    colunas: [mesreferencia]
    severidade: aviso
    verificado: "2016-01 a 2026-09, 129 meses — medido 2026-10-31"
  - id: valores_negativos
    resumo: "receitas_seguros tem valores negativos, que vêm assim da fonte (o motivo não foi apurado; costumam ser estornos). Não descarte essas linhas ao somar prêmios sem olhar o caso."
    tabelas: [receitas_seguros]
    colunas: [valor]
    severidade: silencioso
    verificado: "14.004 linhas negativas em 624.222; R$ 202,7 bi em 2025 — medido 2026-10-31"
  - id: administradores_so_recentes
    resumo: "administradores só cobre os últimos meses (MesAnoBase de 2026-07 a 2026-09): não serve para histórico de dirigentes."
    tabelas: [administradores]
    colunas: [MesAnoBase]
    severidade: silencioso
    verificado: "3.164 linhas, 2026-07 a 2026-09 — medido 2026-10-31"
