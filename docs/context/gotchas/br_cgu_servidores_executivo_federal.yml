dataset: br_cgu_servidores_executivo_federal
gotchas:
  - id: cpf_completado
    resumo: "A coluna de CPF mistura CPF completo (completado pelo projeto) e CPF mascarado. count(DISTINCT cpf) conta máscara como pessoa."
    detalhe: >
      O CPF mascarado da fonte foi trocado pelo completo só quando nome
      idêntico, dígitos visíveis e unicidade garantiam a pessoa
      (procedimento local, fora do repositório). O resto ficou
      mascarado: filtre regexp_full_match(col, '[0-9]{11}') para ter só os
      completos, e não trate a máscara como identificador — ela repete entre
      pessoas diferentes.
    tabelas: [cadastro_pensionistas]
    colunas: [cpf_instituidor_pensao, cpf_representante_legal]
    severidade: silencioso
    verificado: "instituidor 16.473.155 de 24.628.365; representante 1.271.733 de 1.702.995 linhas completadas — medido 2026-10-07"
  - id: ordenada_pela_chave
    resumo: "cadastro_servidores, cadastro_aposentados, cadastro_pensionistas e remuneracao estão ordenadas por cpf: filtre pela coluna crua (= ou IN) e o min/max dos row groups pula quase tudo. Função em volta da coluna (regexp_replace, LIKE '%...') lê a tabela inteira."
    tabelas: [cadastro_servidores, cadastro_aposentados, cadastro_pensionistas, remuneracao]
    colunas: [cpf]
    severidade: aviso
    detalhe: >
      remuneracao (26) e cadastro_servidores (12) estão em arquivos numerados de ~100 MB com
      faixas contíguas de cpf; aposentados e pensionistas são um arquivo cada, ordenado. O nome
      do arquivo não diz mais a UF em cadastro_servidores: filtre por sigla_uf.
    verificado: "zero row groups sobrepostos em cpf nas quatro tabelas (1.332 row groups em cadastro_servidores, 230 em aposentados, 265 em pensionistas), soma de hash de todas as linhas igual antes e depois de cada troca — medido 2026-10-26; busca por um CPF no db.rodado.xyz em ~6 s com cache (era 28 s)"
