dataset: br_cgu_servidores_executivo_federal
gotchas:
  - id: cpf_completado
    resumo: "A coluna de CPF mistura CPF completo (completado pelo projeto) e CPF mascarado. count(DISTINCT cpf) conta máscara como pessoa."
    detalhe: >
      O CPF mascarado da fonte foi trocado pelo completo só quando nome
      idêntico, dígitos visíveis e unicidade garantiam a pessoa
      (procedimento local, fora do repositório). O resto ficou
      mascarado: filtre regexp_full_match(col, '[0-9]{11}') para ter só os
      completos, e não trate a máscara como identificador — ela repete entre
      pessoas diferentes.
    tabelas: [cadastro_pensionistas]
    colunas: [cpf_instituidor_pensao, cpf_representante_legal]
    severidade: silencioso
    verificado: "instituidor 16.473.155 de 24.628.365; representante 1.271.733 de 1.702.995 linhas completadas — medido 2026-10-07"
