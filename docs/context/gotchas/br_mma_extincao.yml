dataset: br_mma_extincao
gotchas:
  - id: flora_cada_especie_duas_vezes
    resumo: "flora_ameacada repete cada espécie em duas linhas idênticas: 6.418 linhas para 3.210 combinações de espécie, categoria e família (3.208 nomes distintos). count(*) dobra a lista: a flora ameaçada real tem cerca de 3.200 táxons, não 6.418. Use count(DISTINCT especie_ou_subespecie_variedade). A fauna não tem o problema (1.258 linhas = 1.258 nomes)."
    tabelas: [flora_ameacada]
    colunas: [especie_ou_subespecie_variedade, categoria]
    severidade: silencioso
    verificado: "flora: 6.418 linhas, 3.208 nomes distintos, 3.210 chaves (espécie, categoria, família, lista_2014); contagem por categoria dobrada: EN 3.688, CR 1.362, VU 1.362; fauna 1.258 = 1.258 — medido 2026-11-04"
  - id: lista_2014_e_flag_zero_um
    resumo: "lista_2014 é flag 0/1: 1 = já constava da lista de 2014, 0 = entrou depois (220 de 1.258 na fauna; 2.480 de 6.418 linhas na flora, já dobradas). Não é ano. categoria usa a sigla da IUCN, com 'CR (PEX)' para provavelmente extinta na natureza (36 na fauna, 6 na flora); EX, RE e EW (extinta, extinta regionalmente, extinta na natureza) são 6, 3 e 1 e não são 'ameaçadas'."
    tabelas: [fauna_ameacada, flora_ameacada]
    colunas: [lista_2014, categoria]
    severidade: silencioso
    verificado: "fauna: lista_2014 = 0 em 220; categoria VU 465, EN 425, CR 322, CR (PEX) 36, EX 6, RE 3, EW 1; flora lista_2014 = 0: 2.480 de 6.418 linhas — medido 2026-11-04"
