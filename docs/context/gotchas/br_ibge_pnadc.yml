dataset: br_ibge_pnadc
gotchas:
  - id: pesar_por_v1028
    resumo: "Microdado é amostra: some V1028 (peso calibrado), nunca count(*). V1027 é o peso sem calibração e não estima população."
    tabelas: [microdados, educacao, rendimentos_outras_fontes]
    colunas: [V1028, V1027]
    severidade: silencioso
    verificado: "2025-T3: sum(V1028) com VD4002='1' = 102,4 mi ocupados (= IBGE); count(*) do trimestre = 490.488 — medido 2026-10-19"
  - id: sem_municipio
    resumo: "Não há id_municipio nos microdados; o mais fino é id_uf + capital + rm_ride. As tabelas ano_municipio_* cobrem só as 27 capitais, de 2012 a 2019."
    tabelas: [microdados, ano_municipio_grupo_idade, ano_municipio_raca_cor]
    colunas: [capital, rm_ride, id_municipio]
    severidade: silencioso
    verificado: "count(DISTINCT id_municipio) em ano_municipio_grupo_idade = 27 (capitais), anos 2012–2019 — medido 2026-10-19"
  - id: deflator_base_2026t3
    resumo: "habitual/efetivo são os deflatores do IBGE (Deflatores.zip) com base no último trimestre do arquivo: 2026-T3 vale 1 (habitual). Rendimento real = VD4016*habitual (ou VD4017*efetivo). A série inteira usa o mesmo arquivo; quando entrar trimestre novo a base muda e a tabela inteira é regravada."
    tabelas: [microdados]
    colunas: [habitual, efetivo]
    severidade: silencioso
    verificado: "count(habitual) = count(*) = 30.460.012; habitual 2012-T1 por UF ~2,1–2,2 (a cópia da BD tinha 1,65–1,81, outra base; razão 1,27–1,33 por UF) — medido 2026-11-19"
  - id: pesos_censo_2022
    resumo: "Desde 2026-11-19 a série inteira (2012-T1 em diante) está com os pesos do Censo 2022 (republicação do IBGE de 2025-08-15, Nota técnica 02/2025). A população sobe sem quebra de 196,7 mi (2012-T1) a 213,7 mi (2026-T3). Números absolutos calculados antes desta data com a cópia da BD (217,5 mi em 2024-T4) não batem com os de hoje."
    tabelas: [microdados]
    colunas: [V1028, V1027, V1029, V1033]
    severidade: silencioso
    verificado: "sum(V1028) 2024-T4 = 212,3 mi (era 217,5 na cópia da BD), 2025-T1 = 212,5 mi — medido 2026-11-19"
  - id: amostra_menor_na_pandemia
    resumo: "A amostra caiu de ~570 mil para 320–370 mil pessoas por trimestre de 2020-T2 a 2021-T2 (entrevista por telefone): estimativas desse período têm erro maior."
    tabelas: [microdados]
    colunas: [V1028]
    severidade: silencioso
    verificado: "count(*) 2019-T4 = 542.802, 2021-T1 = 319.898, 2022-T1 = 475.193 — medido 2026-10-19"
  - id: variavel_trocada_por_versao_a
    resumo: "Perguntas reformuladas mudam de coluna: V3003 vale até 2015-T3 e V3003A dali em diante (idem V3009/V3009A, V4006/V4006A, V4072/V4072A, VD4023/VD4030...). Fora do período a coluna vem NULL — série longa precisa juntar as duas."
    tabelas: [microdados]
    colunas: [V3003, V3003A, V3009, V3009A, V4006, V4006A, VD4004, VD4004A, VD4023, VD4030]
    severidade: silencioso
    verificado: "2014-T1: V3003 preenchida 154.056, V3003A 0; 2020-T1: V3003 0, V3003A 116.288 — medido 2026-10-19"
  - id: procedencia_ibge
    resumo: "Desde 2026-11-19 os 59 trimestres (ibge_<aaaa>t<t>.parquet) vêm do FTP do IBGE por scripts/scrap/ibge_pnadc_microdados.py, no schema da antiga cópia da BD e com as regras de código dela; a cópia da BD foi substituída. Diferenças contra ela, todas revisões oficiais: V1022 corrigida (~680 domicílios por trimestre, 2014–2021), id_estrato renumerado (2016–2021), módulo de educação de 2019-T2 e 2022-T2, V3006A (2020-T2, 2024-T2) e o código todo zero de V4010/V4013/V4041/V4044, agora '0' em toda a série (a BD alternava '0' e '000')."
    tabelas: [microdados]
    colunas: [ano, trimestre, V1022, id_estrato, V4010, V4013, V4041, V4044]
    severidade: informativo
    verificado: "mesmo número de linhas nos 59 trimestres; hash da linha fora de pesos/deflator idêntico em 2012–2013, 2021-T4..2022-T1 e nos demais só nas colunas citadas — medido 2026-11-19"
  - id: gerente_nao_e_o_do_ibge
    resumo: "Contar 'cargo gerencial' como V4010 no grande grupo 1 da COD (diretores e gerentes) dá pretos e pardos em 33,7% em 2025, contra 30,7% em 'Desigualdades Sociais por Cor ou Raça' (IBGE, 2026-11-18): o recorte do IBGE é mais estreito e não está nos microdados. O resto do estudo bate (55,1% dos ocupados; 19,6% dos 20% de gerentes mais bem pagos; desocupação por cor)."
    tabelas: [microdados]
    colunas: [V4010, V2010]
    severidade: silencioso
    verificado: "2025-T1..T4 pesados por V1028/4, VD4002='1': pretos+pardos 55,4% dos ocupados, 33,7% do grupo 1; top 20% de VD4016 entre gerentes 19,1–20,5% por trimestre — medido 2026-11-19"
  - id: anuais_arquivo_inteiro_desde_2026_11_22
    resumo: "educacao e rendimentos_outras_fontes trazem desde 2026-11-22 o arquivo anual INTEIRO do IBGE (todas as pessoas entrevistadas), com os pesos do Censo 2022. A cópia anterior da BD guardava um subconjunto: educacao 2016–2022 só ~140 mil pessoas/ano (quem frequentava escola, 43–50 mi de população) e o arquivo inteiro em 2023–2024; rendimentos_outras_fontes ~30 mil pessoas/trimestre. Contagem de linhas e soma do peso por ano mudaram (agora ~475–570 mil linhas e ~203–213 mi de população na educacao). Filtre a população de interesse (ex.: v3002 frequenta escola) em vez de contar linhas."
    tabelas: [educacao, rendimentos_outras_fontes]
    colunas: [v1028, V1032, v3002]
    severidade: silencioso
    verificado: "toda pessoa da cópia da BD está no arquivo novo (id_pessoa+trimestre, 100% em todos os anos); educacao 2023: 474.575 nos dois lados — 2026-11-22"
  - id: rendimentos_visita5_na_pandemia
    resumo: "rendimentos_outras_fontes vem da 1ª visita, exceto 2020 e 2021, que vêm da 5ª (a 1ª visita não foi a campo na pandemia; é a escolha do IBGE): 355 e 335 mil pessoas contra ~450 mil nos outros anos. 39 colunas do questionário antigo (V5001…V5013 e derivados) só existem de 2012 a 2015 e ficam NULL depois."
    tabelas: [rendimentos_outras_fontes]
    severidade: aviso
    verificado: "2020 355.436, 2021 335.100, 2022 376.821 pessoas — 2026-11-22"
  - id: anuais_codigos_sem_ponto_e_id_domicilio
    resumo: "Nas anuais, códigos VARCHAR passaram de '11.0' (como a BD gravava) para '11', e V1008 de '02' para '2', no padrão de microdados; id_domicilio agora tem o V1008 com 2 dígitos (UPA||V1008||V1014), igual a microdados — antes a BD montava sem o zero e o join por id_domicilio entre as tabelas falhava. id_pessoa não mudou."
    tabelas: [educacao, rendimentos_outras_fontes]
    colunas: [id_domicilio, V1008, capital, rm_ride]
    severidade: silencioso
    verificado: "confere 2023 (educacao) e 2022 (rendimentos) campo a campo contra a cópia da BD — 2026-11-22"
