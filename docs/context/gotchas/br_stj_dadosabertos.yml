dataset: br_stj_dadosabertos
gotchas:
  - id: linhas_duplicadas
    resumo: "count(*) superconta: 3.604.791 linhas para 3.540.898 documentos. Conte por SeqDocumento distinto."
    detalhe: >
      Há linhas repetidas, e nem DISTINCT * resolve: o mesmo documento aparece
      com linhas diferentes entre si. Em 2021: 550.291 linhas, 533.230
      documentos.
    tabelas: [documentos]
    colunas: [SeqDocumento]
    severidade: silencioso
    verificado: "count(*) 3.604.791, count(DISTINCT SeqDocumento) 3.540.898; 2021: 550.291 × 533.230 — medido 2026-10-20"
  - id: data_publicacao_texto
    resumo: "dataPublicacao é texto 'AAAA-MM-DD' e a tabela vai de jan/2021 a out/2026. Recorte o ano com LIKE '2021%' ou strptime, não com year()."
    tabelas: [documentos]
    colunas: [dataPublicacao]
    severidade: aviso
    verificado: "min/max de dataPublicacao 2021-01-04 / 2026-10-07; documentos distintos por ano de 533 mil (2021) a 705 mil (2025) — medido 2026-10-20"
