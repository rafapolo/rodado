dataset: br_senatran_frota
gotchas:
  - id: linha_total_dobra_soma
    resumo: "municipio_tipo tem tipo_veiculo = 'total' ao lado dos 21 tipos: somar a coluna inteira dobra a frota. Filtre tipo_veiculo <> 'total' ou use só a linha total."
    tabelas: [municipio_tipo]
    colunas: [tipo_veiculo, quantidade]
    severidade: silencioso
    verificado: "dez/2023: soma de tudo 238.455.314; linha total 119.227.657 = soma dos tipos = br_senatran_estatisticas.uf_tipo — medido 2026-10-15"
  - id: frota_e_estoque_mensal
    resumo: "Cada mês é o estoque registrado, não o emplacamento do mês: somar meses multiplica a frota. Use um mês (dezembro) por ano."
    tabelas: [municipio_tipo]
    colunas: [ano, mes, quantidade]
    severidade: silencioso
    verificado: "12 meses por ano 2013–2025, 8 em 2026; dez/2022 119,2 mi → dez/2023 119,2 mi na linha total (estoque) — medido 2026-10-15"
  - id: municipio_nao_informado
    resumo: "Há linhas sem id_municipio ('MUNICIPIO NAO INFORMADO'); são residuais, mas caem fora de qualquer join municipal."
    tabelas: [municipio_tipo]
    colunas: [id_municipio, municipio]
    severidade: aviso
    verificado: "264 a 528 linhas por ano; dez/2023, total: 2 veículos em SP — medido 2026-10-15"
