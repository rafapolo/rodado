    resumo: "O serviço só traz 10 moedas (AUD, CAD, CHF, DKK, EUR, GBP, JPY, NOK, SEK, USD). Peso argentino, yuan e o resto do boletim de ~150 moedas não estão aqui."
    tabelas: [moedas, cotacao_moeda_dia]
