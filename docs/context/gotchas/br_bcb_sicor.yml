dataset: br_bcb_sicor
gotchas:
  - id: proagro_sem_ano_na_fonte
    resumo: "Os arquivos do Proagro não trazem ano: ano_emissao/mes_emissao vêm da operacao pelo id_referencia_bacen (a emissão mais antiga, porque operacao repete o id). Operação fora do espelho fica sem ano: filtrar por ano descarta essas linhas."
    tabelas: [proagro_cop, proagro_complemento_cop, proagro_rcp, proagro_complemento_rcp, proagro_rcp_gleba, proagro_parcela, proagro_sumula_julgamento]
    colunas: [ano_emissao, mes_emissao]
    severidade: silencioso
    verificado: "proagro_parcela: 292.781 de 13.432.346 sem ano (2,2%); demais tabelas 0,5–1% — medido 2026-10-15"
  - id: proagro_cop_chave_repetida
    resumo: "(id_referencia_bacen, numero_ordem) não é único no COP: há comunicado repetido. Não use o par como chave sem deduplicar."
    tabelas: [proagro_cop]
    colunas: [id_referencia_bacen, numero_ordem]
    severidade: silencioso
    verificado: "1.007.340 linhas, 11.260 a mais que pares distintos — medido 2026-10-15"
  - id: proagro_gleba_wkt_invalido
    resumo: "geometria é o WKT da fonte (POLYGON com Z sem a etiqueta) convertido para 2D; 2% dos polígonos não convertem e ficam com geometria nula e geometria_original preenchida."
    tabelas: [proagro_rcp_gleba]
    colunas: [geometria, geometria_original]
    severidade: aviso
    verificado: "36.975 de 1.764.450 com geometria nula, todos com geometria_original — medido 2026-10-15"
  - id: operacao_sem_municipio
    resumo: "operacao não tem município: só recurso_publico_complemento_operacao o traz, e só para crédito de recurso controlado/equalizado. LCA livre, recursos livres e BNDES livre ficam sem município."
    tabelas: [operacao, recurso_publico_complemento_operacao]
    colunas: [id_municipio, id_fonte_recurso]
    severidade: silencioso
    verificado: "safra 2023/24: R$ 421,7 bi no total (bate com o anuário do BCB), R$ 135,7 bi com município; fonte 430 (LCA livre) R$ 166,2 bi com R$ 0,9 bi com município — medido 2026-10-22 (bragro)"
  - id: mutuario_sem_numero_ordem
    resumo: "recurso_publico_mutuario é chaveado só por id_referencia_bacen (sem numero_ordem) e traz vários mutuários por operação: o tomador é o de primeiro_mutuario = 'S'."
    tabelas: [recurso_publico_mutuario]
    colunas: [id_referencia_bacen, primeiro_mutuario]
    severidade: aviso
    verificado: "17,8 M linhas; 'N' em 28 mil — medido 2026-10-22 (bragro)"
  - id: dicionario_duplicado
    resumo: "dicionario repete cada chave de id_programa duas vezes: deduplique antes de juntar."
    tabelas: [dicionario]
    colunas: [chave]
    severidade: aviso
    verificado: "id_programa: 40 linhas para 20 chaves — medido 2026-10-22 (bragro)"
  - id: datas_de_plantio
    resumo: "operacao.data_inicio_plantio e data_fim_colheita vêm em ~70% do custeio agrícola com município, com poucas datas absurdas; servem para calendário agrícola (moda do plantio da soja: outubro)."
    tabelas: [operacao]
    colunas: [data_inicio_plantio, data_fim_colheita]
    severidade: aviso
    verificado: "soja: 1,17 M de 1,62 M operações com data, 83 fora de 2010–2027; ciclo médio 173 dias — medido 2026-10-22 (bragro)"
  - id: id_car_sem_hifen
    resumo: "recurso_publico_propriedade.id_car é o código do CAR sem os hífens: junte com replace(area_imovel.id_imovel, '-', ''). Vazio até 2017, 3% em 2018; daí em diante 95–99% e casa quase todo com a foto 2025-10-15 do CAR. Uma operação traz vários CARs (média 1,65): reparta o valor antes de somar por imóvel."
    tabelas: [recurso_publico_propriedade]
    colunas: [id_car]
    severidade: silencioso
    verificado: "2019–2024: 100,0% das linhas com id_car casam com a foto 2025-10-15 (99,3–99,8% sem cancelados); 2018: 51.568 linhas, 90%; amostra 2023/24: 3.053 operações, 935 com mais de um CAR — medido 2026-10-25 (chao)"
  - id: gleba_dentro_do_car
    resumo: "O centroide da gleba cai num polígono do CAR em 98% das glebas 2023/24, e no CAR que a própria operação declara em ~91%. 16% caem em mais de um CAR (os CARs se sobrepõem)."
    tabelas: [recurso_publico_gleba]
    colunas: [geometria]
    severidade: aviso
    verificado: "amostra de 3.066 glebas 2023/24: 3.018 num CAR, 503 em dois ou mais; 2.754 de 3.016 com id_car caem no CAR declarado — medido 2026-10-25 (chao)"
  - id: registro_muda_em_2023
    resumo: "A partir da safra 2023/24 a gleba e o CAR do SICOR passam a concordar muito mais: a operação cuja área financiada passa da área dos CARs declarados cai de ~2% para 0,2%, e a gleba fora do CAR declarado de ~20% para 6%. É mudança de registro, não do campo: não compare antes e depois como série."
    detalhe: >
      Não é efeito da foto do CAR: com a foto 2024-10-04 (mais próxima das
      safras) o degrau é o mesmo. Divergência gleba × código por UF: PA 40%,
      AC 40%, MT 38%; RS 11%, PR 10%, MS 9% (operações com os dois, 2017–2025).
    tabelas: [recurso_publico_propriedade, recurso_publico_gleba, operacao]
    colunas: [id_car, geometria, area_financiada]
    severidade: aviso
    verificado: "área financiada > 1,1 × CARs (foto 2024-10-04): 2,18% em 2019, 1,09% em 2022, 0,17% em 2023, 0,05% em 2024; gleba fora do CAR declarado: 20,7% em 2021, 13,8% em 2023, 6,3% em 2024 — medido 2026-10-25 (chao)"
  - id: proagro_liga_imovel_antes_de_2019
    resumo: "As glebas do Proagro (proagro_rcp_gleba) ligam ao imóvel do CAR as perdas de 2016–2018, que o id_car (vazio até 2018) e a gleba do SICOR cobrem só em parte."
    tabelas: [proagro_rcp_gleba, proagro_rcp]
    colunas: [geometria]
    severidade: aviso
    verificado: "perdas com operação no CAR pela ponte código/gleba do SICOR: 28% em 2016, 55% em 2017, 84% em 2018, ~100% de 2019 em diante; 98–100% delas têm gleba do Proagro — medido 2026-10-25 (chao)"
