dataset: br_bcb_sgs
gotchas:
  - id: series_name_corrigido_em_2026_11
    resumo: "Até 2026-11-23, nove series_name não descreviam o conteúdo de series_code. Foram corrigidos pelo valor: 1207 = pib_anual_valores_correntes (R$ 12,7 tri em 2025; era estoque_credito_total), 7326 = pib_variacao_real_anual (era taxa_juros_credito_pf_livre), 13521 = meta_inflacao (era reservas_internacionais), 24363 = ibc_br (era inadimplencia_pf), 24369 = taxa_desocupacao_pnadc (era divida_liquida_setor_publico_pib), 3695 = dolar_venda_mensal (era saldo_balanca_comercial), 4390 = selic_acumulada_mes (era meta_selic), 22701 = transacoes_correntes_usd_milhoes (era investimento_estrangeiro_direto), 27574 = indice_commodities_icbr (IC-Br, dez/2005 = 100; era taxa_desocupacao_pnadc). Consulta antiga que filtrava pelo nome velho volta vazia ou, no caso de taxa_desocupacao_pnadc, troca de série: filtre por series_code."
    detalhe: >
      Inadimplência de PF, reservas internacionais, dívida líquida do setor
      público, estoque de crédito e saldo da balança comercial não estão nesta
      tabela. O raspador (bcb_sgs.py) usa os nomes novos.
    tabelas: [series]
    colunas: [series_name, series_code]
    severidade: silencioso
    verificado: "25.276 linhas antes e depois, sum(hash(series_code,date,value)) igual; 18 nomes distintos — corrigido 2026-11-23"
  - id: value_texto_unidades_e_frequencias_misturadas
    resumo: "value é texto (use CAST) e a tabela mistura unidades e frequências: diária (dólar, Selic, CDI desde 2000-01-03), mensal e anual (1207, 7326 e 13521 com uma observação por ano, a última em 2025-01-01). Não calcule média ou correlação entre series_code diferentes sem alinhar a data e a unidade (percentual, R$, R$ milhões, US$ milhões, índice)."
    tabelas: [series]
    colunas: [value, date]
    severidade: silencioso
    verificado: "25.179 linhas; dólar 6.739 dias (2000-01-03 a 2026-10-30); 1207: 63 observações anuais de 1963 a 2025; 7326: 63; 13521: 28 (1999 a 2026); nenhum value não numérico — medido 2026-11-04"
  - id: series_com_historia_curta_e_parada
    resumo: "As séries acabam em datas diferentes: ipca_mensal até 2026-09-01, inadimplência 24363 até 2026-08, e as anuais 1207 e 7326 em 2025-01-01. A última data de cada série não é a mesma, então 'dado mais recente' depende do código."
    tabelas: [series]
    colunas: [date]
    severidade: aviso
    verificado: "datas máximas: 1 2026-10-30; 11 e 12 2026-10-29; 189 2026-10-01; 433 2026-09-01; 24363 2026-08-01; 1207 e 7326 2025-01-01; 13521 2026-01-01 — medido 2026-11-04"
