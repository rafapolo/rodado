dataset: br_bcb_sgs
gotchas:
  - id: series_name_trocado_em_oito_series
    resumo: "Em oito das 18 séries, series_name não descreve o conteúdo de series_code. Pelos valores (conferidos com números conhecidos): 1207 é o PIB anual em R$ (12,7 tri em 2025), não estoque de crédito; 7326 é a variação real anual do PIB (4,39% em 2000, 7,53% em 2010, 3,42% em 2024), não juros de PF; 13521 é a meta de inflação (8,0 em 1999, 3,0 em 2024), não reservas internacionais; 24363 é um índice de atividade (IBC-Br: 102,3 em 2012-03), não inadimplência de PF; 24369 é a taxa de desocupação da PNAD (8,0 em 2012-03, 13,6 em 2020-06), não dívida líquida; 3695 é o dólar (5,4754 em 2020-06, contra 5,4760 da série 1), não saldo da balança comercial; 4390 é a Selic acumulada no mês (0,97 em 2024-01), não a meta Selic; 22701 é saldo em transações correntes em US$ milhões (-8.592 em 2025-01), não investimento direto. 27574 sobe de 43 (1999) a 482 (2025) e não é taxa de desocupação. Leia o conteúdo pelo valor e pelo código do SGS, não pelo nome."
    detalhe: >
      Séries cujo nome confere com os valores: 1 (dólar venda, 1,53 a 6,21),
      11 e 12 (Selic e CDI diários em % ao dia), 189 (IGP-M mensal), 433 (IPCA
      mensal), 4380 (PIB mensal em R$ milhões), 4391 (Selic anualizada), 20714
      (juros PJ livre) e 21082 (inadimplência PJ). A inadimplência de PF, as
      reservas internacionais e a dívida líquida do setor público não estão
      nesta tabela, apesar dos nomes.
    tabelas: [series]
    colunas: [series_name, series_code]
    severidade: silencioso
    verificado: "18 séries; 1207: 1999 R$ 1,09 tri, 2025 R$ 12,74 tri; 7326: 2000 4,39, 2010 7,53, 2024 3,42; 13521: 1999 8,00, 2000 6,00, 2024 3,00; 24369: 2012-03 8,0, 2020-06 13,6; 3695 2020-06 5,4754 e série 1 em 2020-06-30 5,4760; 4390 2024-01 0,97; 22701 2025-01 -8.592,3 — medido 2026-11-04"
  - id: value_texto_unidades_e_frequencias_misturadas
    resumo: "value é texto (use CAST) e a tabela mistura unidades e frequências: diária (dólar, Selic, CDI desde 2000-01-03), mensal e anual (1207, 7326 e 13521 com uma observação por ano, a última em 2025-01-01). Não calcule média ou correlação entre series_code diferentes sem alinhar a data e a unidade (percentual, R$, R$ milhões, US$ milhões, índice)."
    tabelas: [series]
    colunas: [value, date]
    severidade: silencioso
    verificado: "25.179 linhas; dólar 6.739 dias (2000-01-03 a 2026-10-30); 1207: 63 observações anuais de 1963 a 2025; 7326: 63; 13521: 28 (1999 a 2026); nenhum value não numérico — medido 2026-11-04"
  - id: series_com_historia_curta_e_parada
    resumo: "As séries acabam em datas diferentes: ipca_mensal até 2026-09-01, inadimplência 24363 até 2026-08, e as anuais 1207 e 7326 em 2025-01-01. A última data de cada série não é a mesma, então 'dado mais recente' depende do código."
    tabelas: [series]
    colunas: [date]
    severidade: aviso
    verificado: "datas máximas: 1 2026-10-30; 11 e 12 2026-10-29; 189 2026-10-01; 433 2026-09-01; 24363 2026-08-01; 1207 e 7326 2025-01-01; 13521 2026-01-01 — medido 2026-11-04"
