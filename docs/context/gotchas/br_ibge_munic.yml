dataset: br_ibge_munic
gotchas:
  - id: duas_familias_de_tabela
    resumo: "O dataset tem dois formatos: as tabelas normalizadas da origem (Base dos Dados) (recursos_humanos, habitacao...), com edições até a década passada, e as base_<tema>_<ano> cruas do IBGE, de 2020 a 2024. As cruas têm coluna por código de variável, que muda a cada edição: MREH0111 em 2020–2023 é MREH011 em 2024. Traduza pelo dicionario_base, nunca pelo nome."
    tabelas: [dicionario_base, base_recursos_humanos_2024, base_recursos_humanos_2023]
    colunas: [coluna, pergunta, casamento]
    severidade: erro
    verificado: "41 tabelas cruas, 4.754 linhas de dicionario_base — medido 2026-10-31"
  - id: tudo_varchar_com_sentinela
    resumo: "Nas base_*, toda coluna é VARCHAR e pode trazer 'Recusa', 'Não informou', 'Não sabe informar', '-' (não se aplica) e '(*)', inclusive em coluna numérica. Use TRY_CAST e trate cada sentinela: '-' não é zero."
    tabelas: [base_saude_2021]
    colunas: [msau544]
    severidade: silencioso
    verificado: "msau544 em 2021: '-' 5.541, 'Sim' 26, 'Recusa' 2, 'Não informou' 1 — medido 2026-10-31"
  - id: casamento_nao_exato
    resumo: "Em cerca de 70 colunas, o código da planilha diverge do dicionário. dicionario_base.casamento diz como a pergunta foi achada (exato, posicional, override, sem_dicionario): desconfie de quem não for exato."
    tabelas: [dicionario_base]
    colunas: [casamento]
    severidade: silencioso
    verificado: "scraper de 2026-10-25, listado no cabeçalho de ibge_munic_estadic.py"
  - id: rs_so_497
    resumo: "base_evento_climatico_rs_2024 só tem os 497 municípios do RS, por desenho da pesquisa."
    tabelas: [base_evento_climatico_rs_2024]
    colunas: [id_municipio]
    severidade: aviso
    verificado: "497 linhas — medido 2026-10-31"
