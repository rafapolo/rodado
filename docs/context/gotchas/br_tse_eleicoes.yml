dataset: br_tse_eleicoes
gotchas:
  - id: receitas_2026_parciais
    resumo: "As receitas de 2026 são do ciclo em aberto: relatórios de 72 h e parciais, sem as prestações finais. Não compare total com 2022 como se fosse fechado."
    detalhe: >
      Desde o sync de 2026-10-09 o 2026 vem do espelho da Base dos Dados (antes,
      de scripts/scrap/tse_receitas_2026.py). Na BD, titulo_eleitoral_candidato e
      os campos *_orig ficam nulos em 2026; quem pagou na origem está em
      receitas_candidato_doador_originario. sequencial_receita se repete quando
      uma doação estimável é rateada entre itens — não deduplique por ele.
    tabelas: [receitas_candidato]
    colunas: [tipo_prestacao_contas, sequencial_receita, cpf_cnpj_doador_orig]
    severidade: silencioso
    verificado: "ano=2026: 189.666 linhas, R$ 6,73 bi, prestação até 2026-10-25, cpf_cnpj_doador_orig 0 preenchidos — medido 2026-10-25"
  - id: receitas_2026_data_futura
    resumo: "66 receitas de 2026 têm data_receita depois da carga (até 29/11/2026). Erro do prestador, mantido como veio."
    tabelas: [receitas_candidato]
    colunas: [data_receita]
    severidade: silencioso
    verificado: "66 linhas com data_receita > 2026-10-07 na carga de 2026-10-07"
  - id: doacao_presidencial_2022_pix
    resumo: "Em 2022, a campanha de Bolsonaro tem 392 mil receitas (Pix de pessoa física) e a de Lula 533. Contar doações mede o canal, não o apoio."
    tabelas: [receitas_candidato]
    colunas: [cargo, sigla_partido, origem_receita]
    severidade: silencioso
    verificado: "ano=2022, cargo='presidente': PL 392.138 linhas / R$ 125,0 mi; PT 533 / R$ 135,5 mi — medido 2026-10-07"
  - id: cpf_candidato_2024_pela_metade
    resumo: "Em candidatos de 2024, metade das linhas vem sem CPF (vereador 48% preenchido). Cruzamento por CPF em 2024 subconta."
    tabelas: [candidatos]
    colunas: [cpf]
    severidade: silencioso
    verificado: "2024: 230.724 com CPF de 462.821; vereador 208.320 de 431.577; 2020: 555.034 de 557.313 — medido 2026-10-15"
  - id: sequencial_nao_unico
    resumo: "sequencial_candidato não é único no ano: o join com resultados_candidato precisa de ano + sequencial + sigla_uf + id_eleicao, senão infla os resultados."
    tabelas: [candidatos, resultados_candidato]
    colunas: [sequencial, sequencial_candidato]
    severidade: silencioso
    verificado: "127 candidaturas da Lista Suja geraram 276 linhas de resultado só por ano+sequencial; com UF e eleição, uma por candidatura — medido 2026-10-15"
  - id: dois_id_eleicao_no_ano_geral
    resumo: "Em ano de eleição geral há dois id_eleicao com a mesma data e o mesmo tipo_eleicao: um federal (só presidente) e um estadual (governador, senador e deputados). Não é duplicata. Somar por número ou partido sem filtrar cargo junta presidente, governador e deputados."
    detalhe: >
      O número 13 em SP/2026 soma 23.543.008 votos sem filtro de cargo: são
      9.505.413 para presidente (6257), 8.423.656 para governador (6259),
      3.146.068 para deputado estadual e 2.467.871 para deputado federal. Não há
      linha repetida, e SP tem 34,1 mi de aptos, não ~9 mi. Filtre sempre por
      cargo. Em 2026 há duas vagas de senador, cada eleitor dá dois votos, e os
      votos nominais para senador passam do comparecimento (43,5 mi contra
      26,4 mi em SP).
    tabelas: [resultados_candidato_secao, resultados_candidato, detalhes_votacao_secao]
    colunas: [id_eleicao, cargo, numero_candidato, numero_partido]
    severidade: silencioso
    verificado: "ano=2026, SP: 15.718.756 linhas = 15.718.756 chaves (município, zona, seção, cargo, número, turno); 6257 presidente / 6259 demais; aptos 34.122.892 (pres.) — medido 2026-10-15"
  - id: doador_originario_1_n
    resumo: "O doador originário é 1:N com a receita: uma transferência de partido se abre em centenas de pessoas físicas. Juntar com receitas_candidato por sequencial_receita e somar valor_receita da receita multiplica o dinheiro."
    detalhe: >
      Some valor_receita da própria tabela de doador originário (é a parte de
      cada doador), nunca o da receita depois do join. A soma dos originários
      bate com o valor da receita em 98% dos casos; em 116 receitas passa dele.
      Linhas sem doador (SQ_RECEITA=-1 na fonte) foram descartadas na carga.
      Carga de 2018 a 2026 (um arquivo por eleição); em 2026 todo doador
      originário é pessoa física (tipo_doador_orig = 'F').
    tabelas: [receitas_candidato_doador_originario, receitas_orgao_partidario_doador_originario, receitas_candidato]
    colunas: [sequencial_receita, valor_receita]
    severidade: silencioso
    verificado: "candidatos: 285.201 linhas, 6.518 receitas, 6.518 casam com receitas_candidato 2026; soma igual em 6.398, maior em 116, menor em 4. Órgãos: 66.315 linhas, 697 receitas, 696 com soma igual — medido 2026-10-25"
  - id: rede_social_url_crua
    resumo: "rede_social_candidato.url vem como o candidato digitou: caixa alta em 2026, 'facebook' sem endereço, '@fulano', 'instagran'. Use plataforma para contar por rede, e lower() para comparar endereço."
    detalhe: >
      plataforma é classificação por padrão de texto feita na carga, não
      validação de URL: 'outro' fica entre 3% e 15% por ano (sites próprios,
      e-mails, texto solto). O mesmo endereço aparece em ordens diferentes no
      mesmo candidato em ~1% das linhas. Para ligar a candidatos use ano +
      sequencial_candidato + sigla_uf + id_eleicao (ver sequencial_nao_unico).
    tabelas: [rede_social_candidato]
    colunas: [url, plataforma, ordem]
    severidade: silencioso
    verificado: "851.922 linhas 2018-2026; 2026: 63.250, 8.473 'outro'; 2020: 317.548, 47.064 'outro'; casam com candidatos 98,5-100% por ano — medido 2026-10-25"
  - id: orgao_partidario_2026_fundo_especial
    resumo: "Em receitas_orgao_partidario 2026, R$ 4,95 bi dos R$ 6,12 bi são Fundo Especial recebido pelos diretórios nacionais (30 linhas). Ranking de receita por diretório mede o repasse do Tesouro, não a arrecadação."
    tabelas: [receitas_orgao_partidario]
    colunas: [fonte_receita, esfera_partidaria, valor_receita]
    severidade: silencioso
    verificado: "ano=2026: 15.735 linhas, R$ 6.119.205.440; esfera nacional + fundo especial = 30 linhas, R$ 4.951.779.737 — medido 2026-10-25"
  - id: despesa_orgao_sequencial_repete
    resumo: "Em despesas_contratadas_orgao_partidario, sequencial_despesa não é único: a mesma despesa se abre em uma linha por item (ex.: uma produção de vídeo em 7 linhas, uma por candidato). Some as linhas para o valor; não deduplique por sequencial_despesa."
    detalhe: >
      Somar as linhas bate com as despesas pagas (2018: R$ 2,58 bi contratado,
      R$ 2,56 bi pago). A paga não traz partido nem fornecedor: junte com a
      contratada por (ano, sequencial_despesa) — uma contratada pode ter várias
      parcelas pagas (sequencial_parcelamento_despesa). Não existe na Base dos
      Dados em ano nenhum; vem do CDN do TSE.
    tabelas: [despesas_contratadas_orgao_partidario, despesas_pagas_orgao_partidario]
    colunas: [sequencial_despesa, valor_despesa, valor_pagamento]
    severidade: silencioso
    verificado: "2018–2026: 1.096.000 linhas contratadas para 839.658 (ano, sequencial_despesa); 866.927 pagas, todas casam com uma contratada — medido 2026-10-25"
  - id: segundo_turno_2026_so_municipio
    resumo: "O 2º turno de 2026 (presidente e governador) vem do sistema de divulgação do TSE, só no nível de município: resultados_candidato_municipio_zona, _secao e os detalhes por zona/seção ainda não têm turno=2."
    detalhe: >
      Até 26/10/2026 os dados abertos do TSE (votacao_*_2026.zip) só traziam o
      1º turno. Os arquivos 2026_t2_divulgacao.parquet saem de
      scripts/scrap/tse_resultados_2t_2026.py, que lê o JSON por município de
      resultados.tse.jus.br. secoes_agregadas, aptos_totalizadas e
      secoes_totalizadas ficam nulos (o JSON não tem o primeiro; a BD grava 0
      nos outros dois). votos_nulos inclui os nulos técnicos (tvn), como a BD.
      data_eleicao = 2026-10-25. Governador só em AC, AM, DF, ES, RN e TO.
      aptos muda entre os turnos em 3.779 municípios (soma das diferenças
      absolutas 19.048, máximo 845; o total nacional é igual), provavelmente o
      voto em trânsito, pedido por turno: comparecimento de um turno para o
      outro tem denominador que se move. Quando a BD publicar o 2º turno nos
      shards numerados, apague os 2026_t2_divulgacao.parquet das quatro
      tabelas e rode scripts/repara_views_beelink.py --apply; sem isso as
      views somam o turno duas vezes (o script avisa pela trava).
    tabelas: [resultados_candidato_municipio, resultados_partido_municipio, detalhes_votacao_municipio, resultados_candidato, resultados_candidato_municipio_zona, resultados_candidato_secao]
    colunas: [turno, secoes_agregadas, aptos_totalizadas, secoes_totalizadas]
    severidade: silencioso
    verificado: "turno=2: presidente 5.757 municípios (186 ZZ), Lula 64.256.232 × Flávio 59.826.041, aptos 158.745.502 = 1º turno; governador 469 municípios em 6 UFs; o mesmo código remontou o 1º turno com 0 diferença em 69.084 linhas — medido 2026-10-26"
  - id: governador_rj_2026_resultado_defasado
    resumo: "No 1º turno de 2026, Douglas Ruas e Eduardo Paes (governador do RJ) estão como resultado = '2º turno', mas não houve 2º turno no RJ: a retotalização de 10/10 elegeu Ruas no 1º turno com 50,88% dos válidos."
    detalhe: >
      O espelho da BD é do sync de 09/10, anterior à retotalização. Os votos
      já são os finais (Ruas 4.271.199 de 8.394.627 válidos, iguais ao
      rj-c0003-e006259-u.json do TSE); só a coluna resultado ficou velha. Não
      conte "quantas UFs tiveram 2º turno" pelo resultado do 1º turno: use a
      existência de linhas com turno=2.
    tabelas: [resultados_candidato, resultados_candidato_municipio]
    colunas: [resultado]
    severidade: silencioso
    verificado: "ano=2026, turno=1, governador, RJ: 22 e 55 com resultado '2º turno'; divulgação do TSE (6259, 10/10/2026 15:09) dá 22 'Eleito' com 4.271.199 votos — medido 2026-10-26"
