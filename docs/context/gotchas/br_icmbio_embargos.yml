dataset: br_icmbio_embargos
gotchas:
  - id: varias_feicoes_por_embargo
    resumo: "termo_embargo tem uma linha por feição, não por embargo: 14.806 feições são 13.585 embargos, chave (numero_emb, coalesce(serie, '')). numero_emb sozinho dá 13.357 (repete entre séries do tipo Papel) e numero_emb || serie dá 6.398, porque serie é NULL em todo o tipo Eletrônico e a concatenação descarta as 7.572 feições."
    detalhe: >
      origem 'Papel' (7.234 feições, 6.398 embargos, serie sempre preenchida) e
      'Eletrônico' (7.572 feições, 7.187 embargos, serie sempre NULL). Em SQL, NULL
      em || dá NULL e count(DISTINCT) ignora NULL: trate a série com coalesce. 228 numero_emb aparecem com mais de uma série.
    tabelas: [termo_embargo]
    colunas: [numero_emb, serie, geometria]
    severidade: silencioso
    verificado: "14.806 feições; 13.585 embargos distintos por (numero_emb, coalesce(serie,'')) = 6.398 Papel + 7.187 Eletrônico; numero_emb || serie dá só 6.398; 272 feições sem geometria e 13 GEOMETRYCOLLECTION — medido 2026-10-28"
  - id: sem_desembargo
    resumo: "Não há data de desembargo. julgamento é texto livre sobre o auto de infração ('Homologado 1ª instancia', 'Anulado 1ª instancia, Embargo mantido'); o embargo quase sempre fica. Tratar como vigente desde data é a leitura possível."
    tabelas: [termo_embargo]
    colunas: [julgamento, data]
    severidade: aviso
    verificado: "julgamento nulo em 12.832 de 14.806; menos de 30 citam anulação ou cancelamento, quase todos com 'Embargo mantido/homologado'; data nula em 5 — medido 2026-10-25 (chao)"
  - id: area_texto
    resumo: "area é texto ('0', 'Não informada'); use area_calc_ha, calculada do polígono em EPSG:5880."
    tabelas: [termo_embargo]
    colunas: [area, area_calc_ha]
    severidade: aviso
    verificado: "area_calc_ha soma 952.901 ha nas 14.534 feições com geometria — medido 2026-10-25 (chao)"
