dataset: world_imdb_movies
gotchas:
  - id: budget_em_moeda_local_e_win_sempre_zero
    resumo: "budget está na moeda original do filme, não em dólar: 53 filmes passam de 1 bilhão (Harbin 2024 = 300.000.000.000, wons coreanos) e 17 têm budget < 1.000. gross_* é em dólar. A coluna win é 0 nas 33.600 linhas; o número de Oscars ganhos está em oscar."
    detalhe: >
      Razão gross_world_wide / budget só vale para filmes com budget em dólar
      (filtre country_origin ou descarte budget > 1e9). gross_world_wide é
      nulo em 45% das linhas (18.222 preenchidas) e budget em 65% (11.815), então
      lucro e ROI são de uma amostra viesada para filmes grandes. gross_world_wide < 1.000
      em 231 linhas. oscar > 0 em 2.097 filmes e nomination > 0 em 10.147.
    tabelas: [top_movies_per_year]
    colunas: [budget, gross_world_wide, win, oscar, nomination]
    severidade: silencioso
    verificado: "budget > 1e9 em 53 linhas (Harbin 2024 = 3,0e11); win min=max=0; oscar>0 = 2.097; budget nn=11.815 de 33.600 — medido 2026-11-04"
  - id: top_por_ano_nao_e_censo_e_texto_sujo
    resumo: "top_movies_per_year guarda os ~500-600 filmes mais votados de cada ano de 1960 a 2024 (33.600 linhas, id único): não é o catálogo do IMDb. duration é texto ('1h 52m'), vote chega a 26 milhões e 10 títulos têm caractere corrompido."
    detalhe: >
      Contagem por ano é artefato do corte (598 em 1960, 500 em 2000, 600 em
      2024), não produção cinematográfica. duration não termina em 'm' em 481
      linhas (ex. só '2h' ou 'X'). 66 filmes com vote > 5 milhões são suspeitos
      (o maior real é ~3 milhões): trate vote como texto abreviado ('26K')
      convertido errado. Campos de pessoas (director, star, genre) são listas
      separadas por vírgula num só texto; acentos foram removidos em alguns nomes
      ('Franois').
    tabelas: [top_movies_per_year]
    colunas: [year, duration, vote, title, director, star, genre]
    severidade: silencioso
    verificado: "33.600 linhas = 33.600 id; linhas por year: 598 (1960), 499 (1980), 500 (2000), 600 (2024); vote > 5e6 em 66; title com '�' em 10; duration irregular 481 — medido 2026-11-04"
