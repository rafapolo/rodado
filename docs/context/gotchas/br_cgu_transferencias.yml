dataset: br_cgu_transferencias
gotchas:
  - id: uma_linha_nao_e_um_repasse
    resumo: "Valor é por combinação de mês, ação, favorecido e localizador: some valor_transferido, não conte linhas. Há 6.688 estornos negativos (R$ -8,08 bi)."
    detalhe: >
      Cada linha agrega o que foi pago naquele mês para aquela classificação
      orçamentária e aquele favorecido. Valores negativos são devolução ou
      estorno e entram na soma; filtrar valor > 0 infla o total.
    tabelas: [transferencias]
    colunas: [valor_transferido]
    severidade: aviso
    verificado: "23.060.808 linhas, R$ 6.621,2 bi em 2014-01..2026-10, 6.688 linhas negativas — medido 2026-10-31"
  - id: orgao_sem_informacao
    resumo: "Constitucionais e parte das emergenciais vêm sem órgão (nome_orgao 'Sem informação' ou nulo): filtre programa pela coluna acao, nunca por nome_orgao."
    detalhe: >
      4,8 milhões de linhas para municípios têm nome_orgao 'Sem informação'; a
      ação 00UR (Lei Paulo Gustavo) vem com órgão nulo. A mesma ação também muda
      de órgão: 00UV (PNAB) aparece em Fundo Nacional de Cultura e no MinC no
      mesmo mês. Códigos úteis: 00UV PNAB, 00S8 Aldir Blanc 2020, 00UR Paulo
      Gustavo, 00R2 FNSP, 00R3 FUNPEN.
    tabelas: [transferencias]
    colunas: [nome_orgao, acao]
    severidade: silencioso
    verificado: "4.818.399 linhas sem órgão em favorecido municipal; 00UV com os dois órgãos em 2026-09 — medido 2026-10-31"
  - id: municipio_siafi
    resumo: "codigo_municipio_siafi é código SIAFI, não IBGE, e é o id_municipio_rf do diretório: junte como inteiro (try_cast(codigo_municipio_siafi AS INTEGER) = id_municipio_rf; como texto perde 20% dos municípios). ~1,15 M de linhas não têm município."
    detalhe: >
      Repasse a estado e parte das entidades vêm sem município. Para mapear por
      município, junte pelo id_municipio_rf do diretório (ponte em bridges.yaml), e diga que o
      total municipal fica abaixo do total da tabela.
    tabelas: [transferencias]
    colunas: [codigo_municipio_siafi, nome_municipio]
    severidade: silencioso
    verificado: "1.152.116 linhas sem município nos seis maiores tipos de favorecido — medido 2026-10-31; jun/2024: 5.569 de 5.569 códigos casam com id_municipio_rf como inteiro (R$ 40,02 bi dos dois lados), 4.571 como texto — medido 2026-11-04"
  - id: paulo_gustavo_so_audiovisual
    resumo: "A Lei Paulo Gustavo (00UR) aqui é quase só o audiovisual: R$ 2,82 bi dos R$ 3,862 bi da LC 195/2022. Faltam R$ 1,04 bi das demais áreas da cultura; não some isto como o total da lei."
    detalhe: >
      A ação tem dois planos orçamentários. AUDIOVISUAL (0001) soma R$ 2.796,9 mi,
      os R$ 2,797 bi do art. 5º. DEMAIS AREAS DA CULTURA (0002) soma R$ 21,5 mi,
      contra R$ 1,065 bi do art. 8º. A falta é proporcional em cada ente, a soma
      confere com o CSV da fonte e nenhuma outra ação cobre a diferença: o fundo
      estadual de SP só tem a 00UR em 2023. O Ministério da Cultura declara R$ 3,93 bi
      executados, então o dinheiro saiu; por qual via, este arquivo não mostra.
      Para o total da lei, cite a LC 195; para o repasse por ente, use só o plano 0001.
    tabelas: [transferencias]
    colunas: [acao, codigo_plano_orcamentario, valor_transferido]
    severidade: silencioso
    verificado: "plano 0001: R$ 2.796,9 mi, 5.483 favorecidos; plano 0002: R$ 21,5 mi, 442 favorecidos, meses 8 a 10 de 2023 — medido 2026-10-31"
  - id: mes_corrente_parcial
    resumo: "O último mês publicado pode estar incompleto: 2026 tem 10 meses e o de outubro saiu com o mês em curso. Compare anos fechados."
    detalhe: >
      A fonte regrava arquivos antigos (os CSVs de 2024 e 2026 baixados em
      2026-10-31 têm data de 26 e 28/10), portanto valor de mês passado pode
      mudar entre coletas.
    tabelas: [transferencias]
    colunas: [ano, mes]
    severidade: aviso
    verificado: "2026 com 10 meses e R$ 690,9 bi na coleta de 2026-10-31"
  - id: paulo_gustavo_onde_esta_o_resto
    resumo: "Os R$ 1,04 bi que faltam da Lei Paulo Gustavo existem na execução orçamentária, não aqui: br_cgu_despesas_publicas.execucao tem a ação 00UR com R$ 3.862,0 mi empenhados (plano 0001 audiovisual R$ 2.797,0 mi, plano 0002 demais áreas R$ 1.065,0 mi), tudo pago como restos a pagar (valor_pago_r = 0, valor_restos_a_pagar_pagos_r = R$ 3.862,0 mi). Falta a ponta de quem recebeu: o dado de transferência por favorecido do plano 0002 não chegou a este arquivo. O ComunicaBR (R$ 1,94 bi aos municípios) inclui os dois planos."
    detalhe: >
      Por município o ComunicaBR é 1,50 a 1,56 vez o plano 0001 daqui (Salvador 1,50,
      Rio de Janeiro 1,52, São Paulo 1,56): a diferença é a parcela das demais áreas
      da cultura. Para a lei toda, a ordem de grandeza é a execução (3,862 bi) e a
      LC 195; para o repasse por ente, só o plano 0001 está completo.
    tabelas: [transferencias]
    colunas: [acao, codigo_plano_orcamentario, valor_transferido]
    severidade: silencioso
    verificado: "execucao: 27 linhas da ação 00UR, empenhado R$ 3.862,0 mi, RAP pagos R$ 3.862,0 mi; transferencias: R$ 2.818,4 mi em 2023 — medido 2026-11-04"
  - id: pnae_pdde_pnate_contra_comunicabr
    resumo: "O repasse do PNAE (ação 00PI) bate exato com o ComunicaBR por município (R$ 124.787.916 no Rio de Janeiro em 2025); PDDE (0515) e PNATE (0969) não: o favorecido do PDDE é a escola/unidade executora, não a prefeitura, e o PNATE diverge até 39% (Nova Friburgo 0,61x)."
    tabelas: [transferencias]
    colunas: [acao, codigo_favorecido, valor_transferido]
    severidade: aviso
    verificado: "2025: PNAE 3 de 3 municípios com razão 1,000; PDDE 0,73 a 1,19; PNATE 0,61 a 1,00 — medido 2026-11-04"
  - id: fonte_reagrega_linhas_mesma_soma
    resumo: "Em 2026-11-10 a fonte devolveu 201908, 201909, 202307 e 202404 com menos linhas e a mesma soma: não são duplicatas nem reversões, é re-agregação (linhas de mesma chave foram somadas numa só). Os parquet atuais foram mantidos."
    detalhe: >
      Comparando por chave sem rótulos (todos os códigos, sem codigo_orgao_siafi, mais
      o valor), as chaves são as mesmas nos dois lados (nenhuma só de um lado) e a soma
      de valor_transferido por chave coincide; muda só a multiplicidade. Exemplo em
      201908: duas linhas de R$ 68.950,00 (órgão nulo) viram uma de R$ 137.900,00 com
      codigo_orgao_siafi 53000. Nos quatro meses o que sumiu é a parte sem órgão: a
      fonte passou a preencher o órgão e, com ele, juntou o que antes eram linhas
      separadas. Contagens atual → nova: 201908 141.686 → 141.684 (2 chaves),
      201909 186.433 → 186.430 (3), 202307 140.922 → 140.907 (15), 202404
      223.395 → 220.349 (3.052 chaves com menos linhas, 6 com mais). Zero linhas sem
      correspondente e zero chaves com soma diferente, então reversão real não houve.
      Como a decisão de promoção só cobre duplicata exata e reversão, esses quatro
      meses não foram trocados. A fonte também reescreve rótulos (nome_orgao, nome_*)
      e codigo_orgao_siafi em muitos meses: compare sempre por chave sem rótulo e sem
      o código do órgão, e conte multiplicidade e soma por chave, não linha inteira.
    tabelas: [transferencias]
    colunas: [codigo_orgao_siafi, nome_orgao, valor_transferido]
    severidade: aviso
    verificado: "4 meses comparados em beelink, staging _recusados_transferencias_20261110: 0 chaves exclusivas de um lado, 0 chaves com soma diferente — medido 2026-11-10"
