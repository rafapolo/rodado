dataset: br_cgu_novo_bolsa_familia
gotchas:
  - id: cpf_completado
    resumo: "A coluna de CPF mistura CPF completo (completado pelo projeto) e CPF mascarado. count(DISTINCT cpf) conta máscara como pessoa."
    detalhe: >
      O CPF mascarado da fonte foi trocado pelo completo só quando nome
      idêntico, dígitos visíveis e unicidade garantiam a pessoa
      (procedimento local, fora do repositório). O resto ficou
      mascarado: filtre regexp_full_match(col, '[0-9]{11}') para ter só os
      completos, e não trate a máscara como identificador — ela repete entre
      pessoas diferentes.
    tabelas: [novo_bolsa_familia]
    colunas: [cpf_favorecido]
    severidade: silencioso
    verificado: "457.170.327 de 688.107.627 linhas completadas — medido 2026-10-07"
  - id: diverge_da_copia_cgu
    resumo: "Para o mesmo mês, o total pago aqui difere da cópia em br_cgu_beneficios_cidadao.novo_bolsa_familia (março/2024: 2,8%). Diga de qual tabela veio o número."
    detalhe: >
      Mesmo programa e mesma fonte (Portal da Transparência), baixados em datas
      diferentes. Em mar/2024: R$ 13,40 bi aqui (mes_competencia '202403') e
      R$ 13,03 bi na outra (ano_competencia 2024, mes_competencia 3). A causa
      não foi apurada.
    tabelas: [novo_bolsa_familia]
    colunas: [valor_parcela, mes_competencia]
    severidade: aviso
    verificado: "mar/2024: 13.399.004.244 aqui × 13.028.687.949 em br_cgu_beneficios_cidadao.novo_bolsa_familia — medido 2026-10-20"
