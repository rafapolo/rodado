dataset: br_epe_webmap
gotchas:
  - id: extensao_lt_planejada_unidade_mista
    resumo: "linhas_transmissao_planejada.extensao mistura metros (7 linhas) e km (o resto): somar dá 1,2 milhão. Calcule a extensão pela geometria (~33,8 mil km)."
    tabelas: [linhas_transmissao_planejada]
    colunas: [extensao]
    severidade: silencioso
    verificado: "7 valores > 3.000 em extensao; soma pela geometria ~33.800 km — medido 2026-11-27"
  - id: projetos_onshore_mistura_fontes
    resumo: "projetos_onshore junta hidro, eólica, biomassa e UFV: filtre pela coluna fonte antes de contar. ini_oper = 1899-12-30 é nulo disfarçado."
    tabelas: [projetos_onshore]
    colunas: [fonte, ini_oper]
    severidade: silencioso
    verificado: "relatado na coleta — 2026-11-27"
  - id: irradiacao_geometria_emprestada
    resumo: "As quatro tabelas de irradiação são a mesma grade INPE de 0,1° (72.207 células); a geometria de todas veio do polígono de irradiacao_direta_normal, casado por lon/lat (o servidor não entrega geometria nas outras)."
    tabelas: [irradiacao_global_horizontal, irradiacao_direta_normal, irradiacao_plano_inclinado, irradiacao_difusa]
    severidade: aviso
    verificado: "lon/lat única nas 72.207 células — medido 2026-11-27"
  - id: uhes_planejadas_eixo_inferido
    resumo: "uhes_planejadas (201) é o reservatório (polígono) dos estudos de inventário/viabilidade, não o eixo da barragem; o polígono do OBJECTID_1 67 veio simplificado a ~11 m porque derruba o servidor."
    tabelas: [uhes_planejadas]
    severidade: aviso
    verificado: "relatado na coleta — 2026-11-27"
  - id: ceg_chave_com_siga
    resumo: "As usinas existentes trazem ceg, a chave com br_aneel_dadosabertos.siga_empreendimentos_geracao e br_aneel_sigel; os formatos diferem entre as bases (normalize para letras e dígitos e compare os 14 primeiros)."
    tabelas: [uhe_existente, pch_existente, eol_existente, ufv_existente]
    colunas: [ceg]
    severidade: aviso
    verificado: "ver gotcha ceg_formatos em br_aneel_sigel — 2026-11-27"
