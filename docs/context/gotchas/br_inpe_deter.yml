dataset: br_inpe_deter
gotchas:
  - id: pantanal_e_queimada
    resumo: "No Pantanal, 68% dos alertas são cicatriz de queimada, não desmatamento. Filtre a classe antes de somar área."
    detalhe: >
      A classe vem em CLASSNAME (Amazônia, Cerrado) ou class_name (Pantanal,
      não-floresta), conforme o arquivo de origem: use
      coalesce(CLASSNAME, class_name). Somar AREAMUNKM sem filtro mistura
      fogo com supressão de vegetação, e o Pantanal sozinho passa a pesar como
      se fosse fronteira de desmatamento.
    tabelas: [avisos]
    colunas: [CLASSNAME, class_name, AREAMUNKM]
    severidade: silencioso
    verificado: "pantanal: 16.457 de 24.155 alertas com class_name='cicatriz de queimada' — medido 2026-10-07"
  - id: municipio_por_centroide
    resumo: "Em Pantanal e não-floresta, o município vem do centroide: o polígono inteiro cai num só município."
    detalhe: >
      Os shapes desses dois biomas não trazem município. GEOCODIBGE foi
      preenchido pelo município que contém o centroide, e AREAMUNKM = area_km.
      Na Amazônia e no Cerrado, ao contrário, o INPE parte o polígono por
      município: um alerta vira várias linhas e AREAMUNKM é a fatia de cada um.
      Contar alertas por count(*) nesses dois biomas conta pedaços, não alertas,
      e a tabela não traz id do alerta inteiro para reagrupar: FID é único por
      linha dentro de cada bioma (a chave é (bioma_arquivo, OGC_FID)) e se repete
      entre biomas, então count(DISTINCT FID) não dedupe nada por bioma e, somando
      os biomas, perde 145.550 linhas. Diga "fatias município-alerta" ao contar.
    tabelas: [avisos]
    colunas: [GEOCODIBGE, AREAMUNKM, FID]
    severidade: silencioso
    verificado: "pantanal 24.152 e nao_floresta_amz 79.677 alertas com município pelo centroide — medido 2026-10-07; FID: 699.077 linhas, 553.527 FID distintos no total, mas count(DISTINCT FID) = count(*) em cada um dos 4 biomas — medido 2026-10-28"
  - id: classe_em_duas_colunas
    resumo: "A classe está em CLASSNAME (Amazônia, Cerrado) ou em class_name (Pantanal, não-floresta), com nomes diferentes ('DESMATAMENTO_CR' × 'supressão com solo exposto'). Use coalesce e mapeie as duas grafias."
    tabelas: [avisos]
    colunas: [CLASSNAME, class_name]
    severidade: silencioso
    verificado: "CLASSNAME NULL em 103.838 avisos, todos com class_name — medido 2026-10-22 (bragro)"
  - id: avisos_poligono_mesma_coleta
    resumo: "avisos_poligono tem o polígono dos mesmos shapefiles de avisos (coleta de 2026-10-07): junte pela chave (bioma_arquivo, OGC_FID). A classe já vem numa coluna só e em caixa alta ('SUPRESSÃO COM SOLO EXPOSTO', 'DESMATAMENTO_CR')."
    detalhe: >
      Amazônia e Cerrado continuam partidos por município (area_km é AREAMUNKM,
      a fatia); Pantanal e não-floresta vêm inteiros (area_km = AREA_KM). Ao
      regravar avisos com uma coleta nova, regrave avisos_poligono junto
      (scripts/scrap/poligonos_ambientais.sh deter), senão o OGC_FID deixa de casar.
    tabelas: [avisos_poligono]
    colunas: [bioma_arquivo, OGC_FID, classe, area_km]
    severidade: silencioso
    verificado: "amazonia 461.074, cerrado 134.165, nao_floresta_amz 79.683, pantanal 24.155 linhas, iguais às de avisos — medido 2026-10-25 (chao)"
