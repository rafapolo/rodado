dataset: br_me_cnpj
gotchas:
  - id: so_o_ultimo_retrato
    resumo: "empresas, estabelecimentos e socios têm só o cadastro mais recente (2026-09). O passado está em *_historico; filtrar ano/mes antigo devolve zero linhas."
    detalhe: >
      Até 2026-10-13 cada (ano, mes) era o cadastro inteiro da Receita e as
      três tabelas guardavam 56 retratos. Hoje guardam um só, e a série
      2021-11 a 2026-09 vive compacta em empresas_historico,
      estabelecimentos_historico e socios_historico. Para o cadastro atual
      não é preciso filtrar ano/mes; para qualquer data anterior, ou para
      saber quem saiu, use o histórico. O retrato muda a cada atualização:
      não escreva ano = 2026 AND mes = 9 fixo em consulta que vai ser
      reaproveitada.
    tabelas: [empresas, estabelecimentos, socios]
    colunas: [ano, mes, data]
    severidade: erro
    verificado: "empresas, estabelecimentos e socios: min e max de ano*100+mes = 202609; 70.081.764, 73.366.147 e 28.341.092 linhas — medido 2026-10-13"
  - id: historico_como_ler
    resumo: "Nas tabelas *_historico o retrato é aaaamm (202609). Vigente = fim = (SELECT max(fim)) em empresas/estabelecimentos, no_ultimo_retrato em sócios."
    detalhe: >
      empresas_historico e estabelecimentos_historico: uma linha por período
      em que nenhuma coluna mudou, com inicio e fim. Estado numa data X:
      inicio <= X AND fim >= X. socios_historico: uma linha por (cnpj_basico,
      tipo, documento, nome, qualificacao), com primeiro_retrato,
      ultimo_retrato, n_retratos e n_retratos_esperados; mudar nome ou
      qualificação abre outra linha. Ex-sócio = NOT no_ultimo_retrato: a
      Receita não publica data de saída, então ultimo_retrato é o último mês
      em que o vínculo apareceu. Antes de 2021-11 só existe o que a própria
      Receita guarda (data_entrada_sociedade, data_inicio_atividade,
      data_situacao_cadastral).
    tabelas: [empresas_historico, estabelecimentos_historico, socios_historico]
    colunas: [inicio, fim, primeiro_retrato, ultimo_retrato, no_ultimo_retrato]
    severidade: silencioso
    verificado: "socios_historico 35.022.573 linhas, 28.340.770 com no_ultimo_retrato; empresas_historico 80.024.491 períodos, 70.081.764 com fim=202609 = empresas; estabelecimentos_historico 196.655.712 períodos, 73.366.147 vigentes = estabelecimentos; os três de 202111 a 202609 — medido 2026-10-13"
  - id: historico_meses_ausentes
    resumo: "O histórico não tem 2022-02 a 2022-04 (nenhuma tabela), 2024-09 em sócios e 2024-10 em estabelecimentos. Fim ou saída no mês anterior a um buraco pode ter ocorrido em qualquer mês do buraco."
    detalhe: >
      2022-02 a 2022-04 não existem na fonte. Os retratos de sócios 2024-09
      (11,3M empresas contra 13,95M no mês anterior, completado com linhas
      repetidas) e de estabelecimentos 2024-10 (59,9M CNPJs contra 62,6M)
      vieram quebrados da fonte e ficaram de fora do histórico. Por isso
      ultimo_retrato = 202201 e 202408 em sócios, e fim = 202201 e 202409 em
      estabelecimentos, acumulam as saídas dos meses seguintes: uma série
      mensal de saídas ou baixas tem pico falso nesses pontos.
      n_retratos_esperados conta retratos, não meses de calendário.
    tabelas: [empresas_historico, estabelecimentos_historico, socios_historico]
    colunas: [inicio, fim, primeiro_retrato, ultimo_retrato, n_retratos_esperados]
    severidade: silencioso
    verificado: "socios_historico: 233.708 vínculos com ultimo_retrato=202201 contra 67.230 em 202112; 175.725 em 202408 contra 81.476 em 202407; nenhum em 202409; 144.706 com n_retratos < n_retratos_esperados (eram 4.848.349 com 2024-09 dentro). Na fonte: sócios 2024-09 com 24.527.613 linhas e 11.314.719 empresas, estabelecimentos 2024-10 com 64.528.600 linhas e 59.893.804 CNPJs — medido 2026-10-13"
  - id: capital_social_sentinela
    resumo: "capital_social = 999999999999 é sentinela, não capital. Exclua antes de somar."
    detalhe: >
      124 empresas têm exatamente R$ 999.999.999.999 (quase um PIB inteiro).
      Qualquer SUM, média ou HHI sobre capital_social distorce o CNAE/UF onde
      elas caem. Filtre capital_social < 999999999999 ou trate como nulo.
      Mesmo sem a sentinela a soma não fecha: 906 empresas declaram R$ 100 bi
      ou mais e somam R$ 128,8 tri; as que declaram menos de R$ 10 bi somam
      R$ 16,7 tri.
      Soma ou média de capital_social precisa de corte de outlier (ou mediana).
    tabelas: [empresas, empresas_historico]
    colunas: [capital_social]
    severidade: silencioso
    verificado: "124 linhas com capital_social = 999999999999 em empresas (retrato 2026-09) — medido 2026-10-13; 906 com capital_social entre 1e11 e a sentinela somam R$ 128,8 tri, as abaixo de 1e10 R$ 16,7 tri — medido 2026-10-20"
  - id: cpf_completado
    resumo: "A coluna de CPF mistura CPF completo (completado pelo projeto) e CPF mascarado. count(DISTINCT cpf) conta máscara como pessoa."
    detalhe: >
      O CPF mascarado da fonte foi trocado pelo completo só quando nome
      idêntico, dígitos visíveis e unicidade garantiam a pessoa
      (procedimento local, fora do repositório). O resto ficou
      mascarado: filtre regexp_full_match(col, '[0-9]{11}') para ter só os
      completos, e não trate a máscara como identificador — ela repete entre
      pessoas diferentes. Um retrato novo chega mascarado até o procedimento
      rodar de novo.
    tabelas: [socios, socios_historico]
    colunas: [documento, cpf_representante_legal]
    severidade: silencioso
    verificado: "documento com 11 dígitos: 22.375.377 de 28.341.092 linhas em socios, 27.146.498 de 35.022.573 em socios_historico — medido 2026-10-13"
  - id: socios_linha_repetida
    resumo: "socios tem o mesmo vínculo em mais de uma linha. Para contar vínculos use socios_historico com no_ultimo_retrato."
    detalhe: >
      O retrato herda da fonte linhas repetidas do mesmo (cnpj_basico, tipo,
      documento, nome, qualificacao), às vezes com as outras colunas
      diferentes. socios_historico guarda uma linha por vínculo, com a versão
      de menos colunas vazias. empresas e estabelecimentos não têm repetição
      no retrato atual.
    tabelas: [socios]
    colunas: [cnpj_basico, documento, nome, qualificacao]
    severidade: silencioso
    verificado: "socios 2026-09: 28.341.092 linhas, 28.340.770 vínculos distintos; empresas 70.081.764 linhas = cnpj_basico distintos; estabelecimentos 73.366.147 linhas = cnpj distintos — medido 2026-10-13"
