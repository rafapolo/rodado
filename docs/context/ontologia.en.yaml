# Versão em inglês dos rótulos de `ontologia.yaml`, usada pelo atlas em
# rodado.xyz/atlas/en. `scripts/gera_ontologia.ts` recusa o build se um
# domínio, classe, tipo de relação ou `via` de ontologia.yaml não tiver
# tradução aqui — classe nova, relação nova ou `via` reescrito pede a linha
# correspondente. Traduções que sobram (de algo que saiu) também barram.
#
#   dominios  id do domínio → nome
#   classes   id da classe → {nome, desc}
#   tipos     tipo da relação → rótulo (lido de `de` para `para`)
#   vias      texto de `via` em pt-BR, exatamente como em ontologia.yaml → inglês

dominios:
  territorio: Territory
  tempo: Time
  pessoa: People
  empresa: Companies
  titular: CPF or CNPJ
  classificacao: Classifications
  educacao: Education
  saude: Health
  estado: State and procurement
  seguranca: Public safety
  meio_ambiente: Environment
  politica: Politics
  infraestrutura: Infrastructure

classes:
  municipio:
    nome: Municipality
    desc: The axis of the mirror. 7-digit IBGE code; every other municipality code (TSE, Receita, SIAFI, BCB, DATASUS's 6 digits) converts to it.
  uf:
    nome: State (UF)
    desc: Federative unit, by abbreviation (SP) or IBGE code (35). The most shared column in the mirror.
  regiao:
    nome: Macro-region
    desc: North, Northeast, Southeast, South, Center-West.
  regiao_ibge:
    nome: Geographic region
    desc: IBGE divisions between state and municipality — meso- and microregions (until 2017), intermediate and immediate regions (after).
  regiao_metropolitana:
    nome: Metropolitan region
    desc: Metropolitan region and urban concentration — groups of municipalities.
  regiao_saude:
    nome: Health region
    desc: The unit in which SUS plans health policy; groups municipalities.
  distrito:
    nome: District
    desc: Subdivision of a municipality (and sub-district, one level below). The boundaries change with every census.
  setor_censitario:
    nome: Census tract
    desc: The finest geography in the mirror — 15 digits, the first 7 are the municipality.
  cep:
    nome: Postal code (CEP)
    desc: Postal code; the directory maps each CEP to a municipality.
  pais:
    nome: Country
    desc: Country codes (M49, ISO3…) — foreign trade and the world_* datasets.
  imovel_rural:
    nome: Rural property
    desc: Rural property in CAR, SNCR/INCRA or the Receita (NIRF) — three registries that only partly link.
  tempo:
    nome: Period
    desc: Year, month, quarter, date. It is in almost every table and is the partition to filter first — so it draws no edges, it just exists.
  empresa:
    nome: Company
    desc: The legal entity, by the first 8 digits of the CNPJ — no branches.
  estabelecimento:
    nome: Establishment
    desc: Head office or branch, full 14-digit CNPJ. The mirror has 60 million in br_me_cnpj.
  companhia_aberta:
    nome: Listed company
    desc: Company with shares on B3, registered with the CVM. The ticker carries no CNPJ; the link is the CVM filing.
  fundo:
    nome: Investment fund
    desc: Fund registered with the CVM, with its own CNPJ. A class with no concept in bridges.yaml — it comes only from the keys.
  pessoa:
    nome: Person
    desc: Individual, by CPF — almost always masked in public data, which makes the date of birth the tie-breaker.
  titular:
    nome: CPF or CNPJ
    desc: A single column holding either a CPF or a CNPJ — payee, supplier, donor, sanctioned party. The length of the value makes it a Person or an Establishment.
  cnae:
    nome: CNAE
    desc: Economic activity. Subclass → class → group → division → section, by the code itself.
  cbo:
    nome: CBO
    desc: Occupation (CBO 2002; the 1994 version in older RAIS files).
  cid:
    nome: ICD-10
    desc: Disease and cause of death. Category (3 characters) → chapter.
  ncm:
    nome: NCM
    desc: Product in foreign trade, 8 digits.
  sh:
    nome: Harmonized System
    desc: The level above NCM (HS4 = the first 4 digits).
  natureza_juridica:
    nome: Legal nature
    desc: Whether the CNPJ is a limited company, a foundation, a municipality, an agency… Separates public from private.
  escola:
    nome: School
    desc: 8-digit INEP code — school census, IDEB, SAEB.
  turma:
    nome: Class
    desc: School class in the school census.
  aluno:
    nome: Student
    desc: Student within one survey edition — does not carry across years.
  ies:
    nome: Higher education institution
    desc: University, university center or college.
  curso:
    nome: Undergraduate course
    desc: Undergraduate course at an HEI.
  enem:
    nome: ENEM participant
    desc: ENEM registration; links the microdata to the same year's socioeconomic questionnaire.
  cnes:
    nome: Health facility
    desc: CNES code, 7 digits — the backbone of SUS data.
  equipe:
    nome: Health team
    desc: Primary care team registered in CNES.
  orgao:
    nome: Government body
    desc: Government body; in procurement, it rolls up to the parent body.
  unidade_gestora:
    nome: Management unit
    desc: The budget level that spending is attributed to (UG).
  licitacao:
    nome: Tender
    desc: The bidding process; links items, bidders, commitments and contracts.
  contrato:
    nome: Contract
    desc: Procurement contract, with items, amendments and annotations.
  empenho:
    nome: Budget commitment
    desc: Budget reservation (empenho) — the link between the tender and the money actually committed, settled and paid.
  contratacao_pncp:
    nome: PNCP procurement
    desc: Procurement published on the National Public Procurement Portal (PNCP).
  processo:
    nome: Administrative case
    desc: Case number — free text across sources; normalize the digits before joining.
  acordao_tcu:
    nome: TCU ruling
    desc: Federal Court of Accounts ruling — links the decision to the person or company declared unfit or barred.
  partido:
    nome: Party
    desc: Party abbreviation — results, membership and Chamber votes.
  candidatura:
    nome: Candidacy
    desc: A candidacy at the TSE (sequential id) — assets, revenue, expenses, social media.
  parlamentar:
    nome: Legislator
    desc: Deputy or senator — expenses, votes, committees.
  usina:
    nome: Power plant
    desc: Generation project at ANEEL, by CEG.
  obra:
    nome: Construction work
    desc: Construction project in the Receita's National Registry of Works (CNO).
  obito:
    nome: Death
    desc: Death certificate in SIM — cause (ICD), place, age, race.
  nascimento:
    nome: Birth
    desc: Live birth certificate in SINASC — prenatal care, delivery, weight.
  internacao:
    nome: Hospitalization
    desc: SUS hospital admission authorization (SIH) — diagnosis, procedure, amount.
  atendimento:
    nome: SUS outpatient care
    desc: Outpatient and primary care output — visits, tests, procedures.
  notificacao:
    nome: Notifiable disease report
    desc: Case reported to SINAN — dengue, zika, malaria, domestic and sexual violence.
  vacinacao:
    nome: Vaccination
    desc: Doses given and vaccine coverage (SI-PNI, immunizations, covid-19).
  ocorrencia:
    nome: Crime record
    desc: Homicide, robbery, femicide, seizure — recorded by the police (SINESP, SSP-SP, ISP-RJ, Public Safety Forum).
  acidente:
    nome: Traffic accident
    desc: Accident on federal highways (PRF) — victims, cause, stretch; and the traffic violations issued.
  prisao:
    nome: Prisoner or wanted person
    desc: Prison population by facility (SISDEPEN) and open arrest warrants.
  avaliacao:
    nome: Test score
    desc: Exam score — ENEM, SAEB, IDEB, literacy, and the international comparisons (PISA, TIMSS, PIRLS).
  vinculo:
    nome: Employment contract
    desc: Formal job declared in RAIS and the CAGED hires and separations.
  beneficio:
    nome: Social benefit
    desc: Payment to a person or family — Bolsa Família, BPC, Pé-de-Meia, Seguro-Defeso, Garantia-Safra, Bolsa Verde, INSS benefits.
  credito:
    nome: Credit and financing
    desc: Loans and financing — BNDES, rural credit (SICOR), bank portfolios (ESTBAN, SCR).
  reclamacao:
    nome: Consumer complaint
    desc: Complaint filed on consumidor.gov.br and with Procons against a company.
  sancao:
    nome: Sanction
    desc: Company or person punished — unfit, suspended, misconduct, slave labor, international sanctions.
  divida:
    nome: Federal tax debt
    desc: Debt enrolled in the Union's active debt roll (PGFN) — tax, social security, FGTS.
  despesa:
    nome: Public spending
    desc: Money going out — payment to a payee, corporate card, travel, amendment, transfer, parliamentary allowance.
  voto:
    nome: Election result
    desc: Votes by candidate, polling section and municipality; electorate profile.
  doacao:
    nome: Campaign donation
    desc: Revenue of a candidate, committee or party — who gave and how much.
  votacao:
    nome: Congressional vote
    desc: A deputy's or senator's vote on a bill, on the floor or in committee.
  infracao_ambiental:
    nome: Environmental violation
    desc: Violation notice and embargoed area — IBAMA, ICMBio, state agencies.
  desmatamento:
    nome: Deforestation and fire
    desc: Deforested area (PRODES, DETER), fire hotspot, land cover transition (MapBiomas), greenhouse gas emissions (SEEG).
  subsistema:
    nome: Power subsystem
    desc: Southeast/Center-West, South, Northeast, North — the four regions in which ONS runs the interconnected grid.
  convenio:
    nome: Grant agreement
    desc: Proposal and agreement for a voluntary federal transfer (SICONV/TransfereGov) — the route of much of the budget amendments.
  programa:
    nome: Government program
    desc: Budget program and action — the "what for" of spending.
  domicilio:
    nome: Household
    desc: Dwelling counted or interviewed — the CNEFE address, the household in the Census, PNAD and POF.
  conta:
    nome: Chart of accounts
    desc: Accounting and budget account — the line of the balance sheet, revenue and expenditure (SICONFI, CVM, ANS).
  operadora:
    nome: Health insurer
    desc: Health plan operator registered with ANS.
  estacao:
    nome: Monitoring station
    desc: Weather (INMET) or hydrological (ANA) station — the point where rain, flow and temperature are measured.
  projeto_cultural:
    nome: Cultural project
    desc: Lei Rouanet project (PRONAC) — proponent, sponsor, supplier.
  processo_minerario:
    nome: Mining case
    desc: Title and application at ANM — exploration, mining, licensing — and the CFEM royalties mining pays.
  especie:
    nome: Threatened species
    desc: Fauna and flora on the national list of species threatened with extinction.
  energia:
    nome: Power generation and load
    desc: Grid operation — generation by plant, load, reservoirs, marginal cost, distributor continuity and tariffs, consumption.
  pesquisa_domiciliar:
    nome: Census and household survey
    desc: What IBGE asks at home — 2010 and 2022 Census, Continuous PNAD, PNAD Covid, POF, PNS.
  financas:
    nome: Government finances
    desc: Revenue, spending and balance sheets of the Union, states and municipalities — SICONFI, SIOP, federal tax collection, CAPAG, CAUC, SIOPS, Fundeb.
  plano_saude:
    nome: Health plan
    desc: Beneficiary, plan, complaint and reimbursement to SUS in private health insurance (ANS).
  medicao:
    nome: Hydro-meteorological measurement
    desc: Rainfall, river flow, river level, reservoir volume, temperature and air quality.
  legislativo:
    nome: Legislative activity
    desc: Bill, speech, committee, caucus, event — the work of Congress beyond voting.
  decisao_judicial:
    nome: Court decision
    desc: STF decision, STJ document, misconduct conviction, CNJ statistics.
  preco:
    nome: Price and index
    desc: Inflation (IPCA, INPC, IGP, IPP), exchange rate, retail fuel prices, drug prices, car prices and construction input prices.
  transporte:
    nome: Transportation
    desc: Flights and aircraft (ANAC), freight carriers and freight (ANTT), vehicle fleet (SENATRAN).
  cadeia_commodity:
    nome: Commodity supply chain
    desc: Soy and beef from the producing municipality to the port and the buyer (TRASE) — slaughterhouse, crusher, warehouse.

