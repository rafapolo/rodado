# Famílias temáticas — a unidade de uma hipótese.
#
# Uma hipótese distinta é uma combinação de FAMÍLIAS, não de tabelas:
# `RAIS × SIM × PIB` e `CAGED × SIM × Censo` testam a mesma proposição
# (trabalho × mortalidade × demografia) com fontes diferentes. Sem esta
# taxonomia, 145 mil "trincas" são 2 mil hipóteses contadas 70 vezes cada.
#
# Gerado à mão, revisável. Consumido por `scripts/hipoteses/93_inedito.py`.
#
# papel:
#   desfecho   — pode ser a variável que a hipótese explica ou que explica
#   controle   — covariável estrutural (renda, porte, demografia). Uma hipótese
#                com duas pernas de controle não é uma hipótese, é um controle
#                correlacionado com outro
#   referencia — diretório, dicionário, malha. Não tem desfecho nenhum
#
# escopo: municipal | uf | outro   (medido, ver docs/context/cobertura_municipal.json)

familias:
  demografia_censo:   {desc: "População, composição e condições do domicílio"}
