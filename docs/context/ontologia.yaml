# Ontologia do espelho — as coisas do mundo que as chaves de join identificam.
#
# O atlas desenha tabela → chave (o mapa físico). Aqui o nível sobe: cada
# CLASSE é uma entidade (Município, Estabelecimento, Licitação…) e junta os
# conceitos de `bridges.yaml → concepts` que a identificam. Os 62 conceitos
# entram cada um em exatamente uma classe — `scripts/gera_ontologia.ts`
# recusa o build se algum sobrar ou repetir.
#
#   python3 scripts/gera_schema_graph.py   # schema_graph.json (já existe no fluxo do atlas)
#   bun scripts/gera_ontologia.ts          # este arquivo + bridges.yaml + schema_graph.json
#                                          #   -> pages/atlas/ontologia.html
#
# Campos de cada classe:
#   nome      rótulo do nó
#   dominio   uma das chaves de `dominios` (dá a cor)
#   desc      uma frase, pt-BR
#   conceitos nomes de `bridges.yaml → concepts` (casam a chave homônima do atlas)
#   chaves    regex (sem distinção de maiúsculas) aplicada a TODA coluna do
#             espelho (schemas.json), não só às chaves do atlas:
#             `id_municipio_residencia`, `cpf_cnpj_contratado`… A primeira
#             classe cuja regex casa leva a coluna.
#   chaves_amplas  regex de último recurso, testada depois de todas as `chaves`
#             ("tem cnpj no nome" → Estabelecimento).
#   colunas   colunas nomeadas por inteiro (dataset.tabela.coluna), para nomes
#             genéricos demais para regex: o `documento` do MIDES é CPF/CNPJ.
#   tabelas   regex sobre "dataset.tabela": a tabela inteira registra a classe.
#             É o que define um FATO (`tipo: fato`): óbito, internação,
#             ocorrência, nota, vínculo — coisas que acontecem a uma entidade
#             num lugar, e que nenhuma coluna-chave sozinha identifica.
#   Precedência: conceito exato → coluna nomeada → chaves → chaves_amplas.
#
# Relações: `de -[tipo]-> para`. `via` diz por qual coluna a ligação passa
# no espelho; `ligacao: conceito` marca as que existem no mundo mas que o
# espelho não consegue fazer (microdado desidentificado, CPF mascarado,
# texto livre) — desenhadas tracejadas.

dominios:
  territorio:     {nome: Território,        cor: territorio}
  tempo:          {nome: Tempo,             cor: outros}
  pessoa:         {nome: Pessoas,           cor: populacao}
  empresa:        {nome: Empresas,          cor: economia}
  titular:        {nome: CPF ou CNPJ,       cor: outros}
  classificacao:  {nome: Classificações,    cor: cultura_arte}
  educacao:       {nome: Educação,          cor: educacao}
  saude:          {nome: Saúde,             cor: saude}
  estado:         {nome: Estado e compras,  cor: governo}
  seguranca:      {nome: Segurança,         cor: seguranca}
  meio_ambiente:  {nome: Meio ambiente,     cor: meio_ambiente}
  politica:       {nome: Política,          cor: politica}
  infraestrutura: {nome: Infraestrutura,    cor: infraestrutura}

classes:
  # ── território ────────────────────────────────────────────────────────
  municipio:
    nome: Município
    dominio: territorio
    desc: O eixo do espelho. Código IBGE de 7 dígitos; todo outro código de município (TSE, Receita, SIAFI, BCB, 6 dígitos do DATASUS) se converte nele.
    conceitos: [id_municipio, id_municipio_6, id_municipio_tse, id_municipio_rf, id_municipio_bcb, codigo_municipio_siafi, municipio, nome_municipio]
    chaves: ['^id_municipio', '^cod(igo)?_municipio', '^municipio', '^nome_municipio', '^ID_MUNICIP$', '^ID_MN_RESI$']
  uf:
    nome: UF
    dominio: territorio
    desc: Unidade da federação, por sigla (SP) ou código IBGE (35). A coluna mais compartilhada do espelho.
    conceitos: [sigla_uf, id_uf, uf, estado]
    chaves: ['^sigla_uf', '^uf(_|$)', '_uf$', '^sg_uf$', '^uf_', '^nome_uf$', '^id_uf']
  regiao:
    nome: Grande região
    dominio: territorio
    desc: Norte, Nordeste, Sudeste, Sul, Centro-Oeste.
    conceitos: [id_regiao]
    chaves: ['^nome_regiao$']
  regiao_ibge:
    nome: Região geográfica
    dominio: territorio
    desc: Recortes do IBGE entre a UF e o município — meso e microrregião (até 2017), regiões intermediária e imediata (depois).
    conceitos: [id_mesorregiao, id_microrregiao, id_regiao_imediata, id_regiao_intermediaria]
    chaves: ['^nome_regiao_(imediata|intermediaria)$']
  regiao_metropolitana:
    nome: Região metropolitana
    dominio: territorio
    desc: Região metropolitana e concentração urbana — conjuntos de municípios.
    conceitos: [id_regiao_metropolitana]
    chaves: ['regiao_metropolitana', 'concentracao_urbana']
  regiao_saude:
    nome: Região de saúde
    dominio: territorio
    desc: A unidade em que o SUS planeja a política de saúde; agrupa municípios.
    conceitos: [id_regiao_saude]
    chaves: ['regiao_saude', '^ID_REGIONA$', '^ID_RG_RESI$']
  distrito:
    nome: Distrito
    dominio: territorio
    desc: Subdivisão do município (e subdistrito, um nível abaixo). Malha muda a cada censo.
    conceitos: [id_distrito, id_subdistrito]
    chaves: ['^nome_(sub)?distrito$']
  setor_censitario:
    nome: Setor censitário
    dominio: territorio
    desc: A geografia mais fina do espelho — 15 dígitos, os 7 primeiros são o município.
    conceitos: [id_setor_censitario]
  cep:
    nome: CEP
    dominio: territorio
    desc: Código postal; o diretório leva cada CEP a um município.
    conceitos: [cep]
    chaves: ['^cep']
  pais:
    nome: País
    dominio: territorio
    desc: Códigos de país (M49, ISO3…) — comércio exterior e as bases world_*.
    conceitos: [id_pais, sigla_pais_iso3]
    chaves: ['^pais_', '^sigla_pais', '^nome_pais$']
  imovel_rural:
    nome: Imóvel rural
    dominio: territorio
    desc: Imóvel rural no CAR, no SNCR/INCRA ou na Receita (NIRF) — três cadastros que só se ligam em parte.
    conceitos: [id_imovel_car, codigo_imovel_sncr, nirf]
    chaves: ['^id_imovel(_incra|_receita_federal)?$', '^(id|num|cod)_car$', '^id_sncr$', '^cod_imovel$', '^nome_imovel$']

  # ── tempo ─────────────────────────────────────────────────────────────
  tempo:
    nome: Período
    dominio: tempo
    # está em quase toda tabela e não liga a nada: desenhado, ficava solto num
    # canto do grafo. Os conceitos seguem classificados aqui; o nó não sai.
    desenha: false
    desc: Ano, mês, trimestre, data. Está em quase toda tabela e é a partição a filtrar primeiro — por isso não desenha arestas, só existe.
    conceitos: [ano, mes, data, trimestre, semestre, year]
    chaves: ['^(ano|mes|data|date|dt_|trimestre|semestre|year)', '^NU_ANO$', 'ano(mes|processo|contrato)$', '^data']

  # ── empresas ──────────────────────────────────────────────────────────
  empresa:
    nome: Empresa
    dominio: empresa
    desc: A pessoa jurídica, pelos 8 primeiros dígitos do CNPJ — sem filial.
    conceitos: [cnpj_basico]
    chaves: ['^cnpj_basico']
  estabelecimento:
    nome: Estabelecimento
    dominio: empresa
    desc: Matriz ou filial, CNPJ completo de 14 dígitos. O espelho tem 60 milhões em br_me_cnpj.
    conceitos: [cnpj]
    chaves: ['^cnpj_(empresa|estabelecimento|dv|ordem|cliente|agencia|exportador|emissor|controlador|custodiante|auditor|admin|periciadora|prestador_contas|candidato|instituicao)', '^nome_(empresarial|fantasia|razao_social|empresa)$']
    chaves_amplas: ['cnpj']
  companhia_aberta:
    nome: Companhia aberta
    dominio: empresa
    desc: Empresa com ações na B3, registrada na CVM. O ticker não traz CNPJ; o elo é o formulário da CVM.
    conceitos: [ticker]
    chaves: ['^cnpj_cia$', '^cnpj_companhia$', '^cd_cvm$', '^codigo_cvm$']
  fundo:
    nome: Fundo de investimento
    dominio: empresa
    desc: Fundo registrado na CVM, com CNPJ próprio. Classe sem conceito em bridges.yaml — vem só das chaves.
    conceitos: []
    chaves: ['^cnpj_fundo']
  # ── pessoas ───────────────────────────────────────────────────────────
  pessoa:
    nome: Pessoa
    dominio: pessoa
    desc: Pessoa física, pelo CPF — quase sempre mascarado no dado público, o que faz da data de nascimento o desempate.
    conceitos: [cpf, data_nascimento]
    chaves: ['^cpf_(?!cnpj)', '^id_pessoa$', '^id_servidor$', '^ano_nasc', '^nome_(completo|beneficiario|parlamentar|eleitoral|candidato|responsavel|representante_legal)$']
    chaves_amplas: ['cpf']
  # ── a dobradiça: a mesma coluna guarda uma pessoa ou uma empresa ──────
  titular:
    nome: CPF ou CNPJ
    dominio: titular
    desc: Uma coluna só que guarda CPF ou CNPJ — favorecido, fornecedor, doador, sancionado. Pelo tamanho do valor vira Pessoa ou Estabelecimento.
    conceitos: [cpf_cnpj]
    chaves: ['cpf_?cnpj', 'cnpj_?cpf', 'cgc_?cpf', '^ni_fornecedor$', '^nome_(favorecido|fornecedor|credor|devedor|contratado|vencedor|doador)$']
    colunas:
      - world_wb_mides.licitacao_item.documento
      - world_wb_mides.licitacao_participante.documento
      - br_rf_cno.microdados.id_responsavel
      - br_rf_cno.vinculos.id_responsavel
      - br_ms_sih.servicos_profissionais.id_prestador_servico

  # ── classificações ────────────────────────────────────────────────────
  cnae:
    nome: CNAE
    dominio: classificacao
    desc: Atividade econômica. Subclasse → classe → grupo → divisão → seção, pelo próprio código.
    conceitos: [cnae_2_subclasse, cnae_1]
    chaves: ['cnae']
  cbo:
    nome: CBO
    dominio: classificacao
    desc: Ocupação (CBO 2002; a de 1994 nos arquivos antigos da RAIS).
    conceitos: [cbo_2002]
    chaves: ['^cbo', '^ID_OCUPA_N$']
  cid:
    nome: CID-10
    dominio: classificacao
    desc: Doença e causa de morte. Categoria (3 caracteres) → capítulo.
    conceitos: [cid_principal_categoria]
    chaves: ['^cid_', '^ID_AGRAVO$']
  ncm:
    nome: NCM
    dominio: classificacao
    desc: Produto no comércio exterior, 8 dígitos.
    conceitos: [id_ncm]
    chaves: ['ncm']
  sh:
    nome: Sistema Harmonizado
    dominio: classificacao
    desc: O nível acima da NCM (SH4 = os 4 primeiros dígitos).
    conceitos: [id_sh4]
  natureza_juridica:
    nome: Natureza jurídica
    dominio: classificacao
    desc: Se o CNPJ é LTDA, fundação, município, autarquia… Separa o público do privado.
    conceitos: [id_natureza_juridica]

  # ── educação ──────────────────────────────────────────────────────────
  escola:
    nome: Escola
    dominio: educacao
    desc: Código INEP de 8 dígitos — censo escolar, IDEB, SAEB.
    conceitos: [id_escola]
  turma:
    nome: Turma
    dominio: educacao
    desc: Turma no censo escolar.
    conceitos: [id_turma]
  aluno:
    nome: Aluno
    dominio: educacao
    desc: Aluno dentro de uma edição de pesquisa — não atravessa anos.
    conceitos: [id_aluno]
  ies:
    nome: Instituição de ensino superior
    dominio: educacao
    desc: Universidade, centro universitário ou faculdade.
    conceitos: [id_ies]
    chaves: ['^cnpj_mantenedora$']
  curso:
    nome: Curso superior
    dominio: educacao
    desc: Curso de graduação de uma IES.
    conceitos: [id_curso]
    chaves: ['^nome_curso$']
  enem:
    nome: Participante do ENEM
    dominio: educacao
    desc: Inscrição no ENEM; liga o microdado ao questionário socioeconômico do mesmo ano.
    conceitos: [id_inscricao]

  # ── saúde ─────────────────────────────────────────────────────────────
  cnes:
    nome: Estabelecimento de saúde
    dominio: saude
    desc: Código CNES, 7 dígitos — a espinha dos dados do SUS.
    conceitos: [id_estabelecimento_cnes]
  equipe:
    nome: Equipe de saúde
    dominio: saude
    desc: Equipe de atenção primária cadastrada no CNES.
    conceitos: [id_equipe]

  # ── estado e compras ──────────────────────────────────────────────────
  orgao:
    nome: Órgão público
    dominio: estado
    desc: Órgão do governo; em compras, sobe para o órgão superior.
    conceitos: [id_orgao]
    chaves: ['orgao']
  unidade_gestora:
    nome: Unidade gestora
    dominio: estado
    desc: O nível orçamentário a que o gasto é atribuído (UG).
    conceitos: [id_unidade_gestora]
    chaves: ['unidade_gestora']
  licitacao:
    nome: Licitação
    dominio: estado
    desc: O certame; liga itens, participantes, empenhos e contratos.
    conceitos: [id_licitacao]
    chaves: ['^id_licitacao']
    tabelas: ['\.[^.]*(licitac|pregao)']
  contrato:
    nome: Contrato
    dominio: estado
    desc: Contrato de compra, com itens, aditivos e apostilamentos.
    conceitos: [id_contrato]
    tabelas: ['\.[^.]*contrat']
  empenho:
    nome: Empenho
    dominio: estado
    desc: Reserva do orçamento — o elo entre a licitação e o dinheiro de fato comprometido, liquidado e pago.
    conceitos: [id_empenho]
    chaves: ['^id_(empenho|liquidacao|pagamento)']
    tabelas: ['\.[^.]*(empenho|liquidacao)']
  contratacao_pncp:
    nome: Contratação no PNCP
    dominio: estado
    desc: Contratação publicada no Portal Nacional de Contratações Públicas.
    conceitos: [numero_controle_pncp]
  processo:
    nome: Processo administrativo
    dominio: estado
    desc: Número de processo — texto livre entre fontes; normalizar os dígitos antes de juntar.
    conceitos: [numero_processo]
    chaves: ['^id_processo$']
  acordao_tcu:
    nome: Acórdão do TCU
    dominio: estado
    desc: Deliberação do Tribunal de Contas — liga a decisão à pessoa ou empresa declarada inidônea ou inabilitada.
    conceitos: [numero_acordao_tcu]
    tabelas: ['^br_tcu_dadosabertos\.']

  # ── política ──────────────────────────────────────────────────────────
  partido:
    nome: Partido
    dominio: politica
    desc: Sigla partidária — resultados, filiação e votações da Câmara.
    conceitos: [sigla_partido]
  candidatura:
    nome: Candidatura
    dominio: politica
    desc: Uma candidatura no TSE (sequencial) — bens, receitas, despesas, redes sociais.
    conceitos: [sequencial_candidato]
  parlamentar:
    nome: Parlamentar
    dominio: politica
    desc: Deputado ou senador — despesas, votos, comissões.
    conceitos: [id_deputado]
    chaves: ['^id_senador$', '^id_votacao$', '^id_legislatura$']

  # ── infraestrutura ────────────────────────────────────────────────────
  usina:
    nome: Usina de energia
    dominio: infraestrutura
    desc: Empreendimento de geração na ANEEL, pelo CEG.
    conceitos: [ceg]
  obra:
    nome: Obra
    dominio: infraestrutura
    desc: Obra de construção civil no Cadastro Nacional de Obras da Receita.
    conceitos: [id_cno]

  # ══ FATOS ═════════════════════════════════════════════════════════════
  # O que acontece a uma entidade num lugar. Entram pela tabela (`tabelas`),
  # não por coluna: um óbito não tem código próprio, mas o SIM inteiro é
  # registro de óbitos. As seções do painel municipal (xyz/dataviz/municipio)
  # foram o guia do que um município conta.

  # ── saúde ─────────────────────────────────────────────────────────────
  obito:
    nome: Óbito
    dominio: saude
    tipo: fato
    desc: Declaração de óbito no SIM — causa (CID), local, idade, raça.
    conceitos: []
    tabelas: ['^br_ms_sim\.']
  nascimento:
    nome: Nascimento
    dominio: saude
    tipo: fato
    desc: Declaração de nascido vivo no SINASC — pré-natal, parto, peso.
    conceitos: []
    tabelas: ['^br_ms_sinasc\.']
  internacao:
    nome: Internação
    dominio: saude
    tipo: fato
    desc: Autorização de internação hospitalar no SUS (SIH) — diagnóstico, procedimento, valor.
    conceitos: []
    tabelas: ['^br_ms_sih\.']
  atendimento:
    nome: Atendimento no SUS
    dominio: saude
    tipo: fato
    desc: Produção ambulatorial e de atenção básica — consultas, exames, procedimentos.
    conceitos: []
    tabelas: ['^br_ms_sia\.', '^br_ms_atencao_basica\.', '^br_ms_sisvan\.', '^br_saude_farmaciapopular\.']
  notificacao:
    nome: Notificação de agravo
    dominio: saude
    tipo: fato
    desc: Caso notificado ao SINAN — dengue, zika, malária, violência doméstica e sexual.
    conceitos: []
    tabelas: ['^br_ms_sinan']
  vacinacao:
    nome: Vacinação
    dominio: saude
    tipo: fato
    desc: Dose aplicada e cobertura vacinal (SI-PNI, imunizações, covid-19).
    conceitos: []
    tabelas: ['^br_ms_(sipni|imunizacoes|vacinacao_covid19)']

  # ── segurança ─────────────────────────────────────────────────────────
  ocorrencia:
    nome: Ocorrência criminal
    dominio: seguranca
    tipo: fato
    desc: Homicídio, roubo, feminicídio, apreensão — registrados pela polícia (SINESP, SSP-SP, ISP-RJ, Fórum de Segurança).
    conceitos: []
    tabelas: ['^br_mjs?p?_sinesp\.', '^br_mj_sinesp\.', '^br_sp_gov_ssp\.', '^br_rj_isp_', '^br_fbsp_absp\.', '^br_ipea_atlasviolencia\.']
  acidente:
    nome: Acidente de trânsito
    dominio: seguranca
    tipo: fato
    desc: Acidente nas rodovias federais (PRF) — vítimas, causa, trecho; e as infrações autuadas.
    conceitos: []
    tabelas: ['^br_prf_']
  prisao:
    nome: Pessoa presa ou procurada
    dominio: seguranca
    tipo: fato
    desc: População carcerária por unidade prisional (SISDEPEN) e mandados em aberto.
    conceitos: []
    tabelas: ['^br_mjs?p?_sisdepen\.', '^br_mj_sisdepen\.', '^br_mjsp_procurados\.']

  # ── educação ──────────────────────────────────────────────────────────
  avaliacao:
    nome: Nota de avaliação
    dominio: educacao
    tipo: fato
    desc: Nota em prova — ENEM, SAEB, IDEB, alfabetização, e as comparações internacionais (PISA, TIMSS, PIRLS).
    conceitos: []
    tabelas: ['^br_inep_(enem|saeb|ideb|ana|avaliacao_alfabetizacao)\.', '^world_(oecd_pisa|iea_timss|iea_pirls)\.']

  # ── pessoas: trabalho e renda ─────────────────────────────────────────
  vinculo:
    nome: Vínculo de emprego
    dominio: pessoa
    tipo: fato
    desc: Emprego formal declarado na RAIS e as admissões e desligamentos do CAGED.
    conceitos: []
    tabelas: ['^br_me_rais\.microdados_vinculos', '^br_me_caged\.']
  beneficio:
    nome: Benefício social
    dominio: pessoa
    tipo: fato
    desc: Pagamento a pessoa ou família — Bolsa Família, BPC, Pé-de-Meia, Seguro-Defeso, Garantia-Safra, Bolsa Verde, benefícios do INSS.
    conceitos: []
    tabelas: ['^br_cgu_(beneficios_cidadao|novo_bolsa_familia|pe_de_meia|seguro_defeso|garantia_safra)\.', '^br_mps_beneficios\.', '^br_mma_bolsa_verde\.', '^br_mds_cadunico\.']

  # ── empresas: dinheiro e consumo ──────────────────────────────────────
  credito:
    nome: Crédito e financiamento
    dominio: empresa
    tipo: fato
    desc: Empréstimo e financiamento — BNDES, crédito rural (SICOR), carteira dos bancos (ESTBAN, SCR).
    conceitos: []
    tabelas: ['^br_bndes_', '^br_bcb_(sicor|estban|scrdata)\.']
  reclamacao:
    nome: Reclamação de consumidor
    dominio: empresa
    tipo: fato
    desc: Queixa registrada no consumidor.gov.br e nos Procons contra uma empresa.
    conceitos: []
    tabelas: ['^br_mj_consumidorgovbr\.', '^br_mjsp_ckan\.procon']

  # ── estado: punição, dívida e gasto ───────────────────────────────────
  sancao:
    nome: Sanção
    dominio: estado
    tipo: fato
    desc: Empresa ou pessoa punida — inidônea, suspensa, improbidade, trabalho escravo, sanções internacionais.
    conceitos: []
    tabelas: ['^br_cgu_sancoes\.', '^br_tcu_inidoneos\.', '^br_mte_listasuja\.', '^br_cnj_improbidade', '^br_bcb_penalidades\.', '^(eu|un)_sanctions\.', '^global_(ofac_sanctions|opensanctions)\.']
  divida:
    nome: Dívida ativa
    dominio: estado
    tipo: fato
    desc: Débito inscrito na dívida ativa da União (PGFN) — tributário, previdenciário, FGTS.
    conceitos: []
    tabelas: ['^br_pgfn_dividaativa\.', '^br_mf_divida_ativa\.']
  despesa:
    nome: Despesa pública
    dominio: estado
    tipo: fato
    desc: Dinheiro que saiu — pagamento a favorecido, cartão corporativo, viagem, emenda, transferência, cota parlamentar.
    conceitos: []
