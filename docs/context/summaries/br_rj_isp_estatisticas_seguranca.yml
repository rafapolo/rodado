# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_rj_isp_estatisticas_seguranca
tabelas:
  evolucao_mensal_cisp:
    ultima_data: "2026-06"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma CISP (circunscrição de delegacia) × mês
    chave: (ano, mes, id_cisp)
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2003-01–2026-06
    territorio:
      nivel: outro
      colunas:
        id_cisp: delegacia (CISP), texto sem zero à esquerda
        id_aisp: área integrada de segurança (AISP)
        id_risp: região integrada (RISP)
        id_municipio: município do RJ; '9999999' em 282 linhas (sem município); 8 CISPs aparecem com mais de um município
        regiao: Capital, Baixada Fluminense, Grande Niterói, Interior; 'Grande Niterói' vem também com grafia corrompida ('Grande NiterÃƒ...', 2.610 linhas)
    medidas:
    - coluna: quantidade_homicidio_doloso
      o_que: homicídios dolosos
      unidade: ocorrências
      soma: sim
    - coluna: quantidade_crimes_violentos_letais_intencionais
      o_que: CVLI
      unidade: ocorrências
      soma: sim
    - coluna: quantidade_letalidade_violenta
      o_que: letalidade violenta (inclui intervenção policial)
      unidade: ocorrências
      soma: sim
    - coluna: quantidade_total_roubos
      o_que: total de roubos
      unidade: ocorrências
      soma: sim
    - coluna: quantidade_total_furtos
      o_que: total de furtos
      unidade: ocorrências
      soma: sim
    - coluna: quantidade_registro_ocorrencia
      o_que: registros de ocorrência
      unidade: registros
      soma: sim
    filtros_tipicos:
    - 'tipo_fase = ''Consolidado com errata'' (até 2026-03: 37.588 linhas) ou ''Consolidado sem errata'' (2026-04–2026-06: 411 linhas); cada mês tem uma só fase'
    - regiao IN ('Grande Niterói') não pega as 2.610 linhas com grafia corrompida; use regiao LIKE 'Grande Niter%'
    use_para: crimes por delegacia/AISP/RISP e mês no estado do RJ
    nao_use_para: comparar com outras UFs; somar com evolucao_mensal_municipio (mesmo fato em outro recorte)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 37.999 linhas = 37.999 distintas em (ano, mes, id_cisp); soma de homicídio doloso em 2019 = 4.004 (igual à de evolucao_mensal_municipio e evolucao_mensal_uf) — medido 2026-10-27
  evolucao_mensal_municipio:
    ultima_data: "2026-08"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um município do RJ × mês
    chave: (ano, mes, id_municipio)
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2014-01–2026-08
    territorio:
      nivel: municipio
      colunas:
        id_municipio: código IBGE de 7 dígitos (92 municípios)
        regiao: Capital, Baixada Fluminense, Grande Niterói, Interior
    medidas:
    - coluna: quantidade_homicidio_doloso
      o_que: homicídios dolosos
      unidade: ocorrências
      soma: sim
    - coluna: quantidade_total_roubos
      o_que: total de roubos
      unidade: ocorrências
      soma: sim
    - coluna: quantidade_total_furtos
      o_que: total de furtos
      unidade: ocorrências
      soma: sim
    - coluna: quantidade_registro_ocorrencia
      o_que: registros de ocorrência
      unidade: registros
      soma: sim
    filtros_tipicos:
    - 'tipo_fase = ''Consolidado com errata'' (2014-01–2026-06: 13.800 linhas) ou ''Consolidado sem errata'' (2026-07–2026-08: 184 linhas)'
    use_para: crimes por município do RJ e mês
    nao_use_para: taxas por habitante (use taxa_evolucao_mensal_municipio)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 13.984 linhas = 13.984 distintas em (ano, mes, id_municipio); homicídio doloso 2019 = 4.004 — medido 2026-10-27
  evolucao_mensal_uf:
    ultima_data: "2026-08"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: o estado do RJ × mês
    chave: (ano, mes)
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 1991-01–2026-08
    territorio:
      nivel: uf
      colunas: {}
    medidas:
    - coluna: quantidade_homicidio_doloso
      o_que: homicídios dolosos
      unidade: ocorrências
      soma: sim
    - coluna: quantidade_total_roubos
      o_que: total de roubos
      unidade: ocorrências
      soma: sim
    - coluna: quantidade_total_furtos
      o_que: total de furtos
      unidade: ocorrências
      soma: sim
    - coluna: quantidade_registro_ocorrencia
      o_que: registros de ocorrência (22% nulo)
      unidade: registros
      soma: sim
    filtros_tipicos:
    - tipo_fase IN ('Consolidado com errata','Consolidado sem errata')
    use_para: série longa estadual (desde 1991) de homicídios, roubos e furtos; só o RJ, sem coluna de UF
    nao_use_para: comparar UFs; colunas recentes (estupro, celular, drogas) têm 20–64% de nulos nos anos antigos
    rascunho:
    - use_para
    - nao_use_para
    verificado: 428 linhas = 428 distintas em (ano, mes); homicídio doloso 2019 = 4.004, 2026 (parcial) = 1.789 — medido 2026-10-27
  evolucao_mensal_upp:
    ultima_data: "2024-06"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma UPP (Unidade de Polícia Pacificadora) × mês
    chave: (ano, mes, id_upp)
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2007-01–2024-06
    territorio:
      nivel: outro
      colunas:
        id_upp: código da UPP
        nome: nome da UPP
    medidas:
    - coluna: quantidade_homicidio_doloso
      o_que: homicídios dolosos
      unidade: ocorrências
      soma: sim
    - coluna: quantidade_total_roubos
      o_que: roubos
      unidade: ocorrências
      soma: sim
    - coluna: quantidade_registro_ocorrencia
      o_que: registros
      unidade: registros
      soma: sim
    use_para: crimes em áreas de UPP do RJ
    nao_use_para: estado inteiro (só as áreas de UPP)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 7.980 linhas = 7.980 distintas em (ano, mes, id_upp) — medido 2026-10-27
  evolucao_policial_morto_servico_mensal:
    ultima_data: "2026-08"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma CISP × mês
    chave: (ano, mes, id_cisp)
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2003-01–2026-08
    territorio:
      nivel: outro
      colunas:
        id_cisp: delegacia (CISP)
    medidas:
    - coluna: quantidade_policial_militar_morto_servico
      o_que: PMs mortos em serviço
      unidade: pessoas
      soma: sim
    - coluna: quantidade_policial_civil_morto_servico
      o_que: policiais civis mortos em serviço
      unidade: pessoas
      soma: sim
    use_para: policiais mortos em serviço por CISP e mês
    nao_use_para: mortes de civis
    rascunho:
    - use_para
    - nao_use_para
    verificado: 38.273 linhas = 38.273 distintas em (ano, mes, id_cisp) — medido 2026-10-27
  feminicidio_mensal_cisp:
    ultima_data: "2026-06"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma CISP × município × mês (8 CISPs cobrem mais de um município)
    chave: '(ano, mes, id_cisp, id_municipio); (ano, mes, id_cisp) sozinha repete: 17.018 linhas contra 15.918 distintas'
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2016-11–2026-06
    territorio:
      nivel: outro
      colunas:
        id_cisp: delegacia
        id_aisp: AISP
        id_risp: RISP
        id_municipio: município
    medidas:
    - coluna: quantidade_morte_feminicidio
      o_que: mortes por feminicídio
      unidade: pessoas
      soma: sim
    - coluna: quantidade_tentativa_feminicidio
      o_que: tentativas de feminicídio
      unidade: ocorrências
      soma: sim
    filtros_tipicos:
    - tipo_fase IN ('Consolidado com errata','Consolidado sem errata')
    use_para: feminicídio por delegacia e mês no RJ
    nao_use_para: junção com outras tabelas por (ano, mes, id_cisp) sem id_municipio (duplica)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 17.018 linhas = 17.018 distintas em (ano, mes, id_cisp, id_municipio); soma de mortes em 2019 = 85 — medido 2026-10-27
  armas_apreendidas_mensal:
    ultima_data: "2026-08"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma CISP × mês
    chave: (ano, mes, id_cisp)
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2007-01–2026-08
    territorio:
      nivel: outro
      colunas:
        id_cisp: delegacia
        id_aisp: AISP
        id_risp: RISP
    medidas:
    - coluna: quantidade_arma_fogo_total
      o_que: armas de fogo apreendidas
      unidade: armas
      soma: sim
    - coluna: quantidade_fuzil
      o_que: fuzis
      unidade: armas
      soma: sim
    - coluna: quantidade_pistola
      o_que: pistolas
      unidade: armas
      soma: sim
    - coluna: quantidade_municao_total
      o_que: munições (36% nulo)
      unidade: unidades
      soma: sim
    - coluna: quantidade_simulacro_total
      o_que: simulacros (36% nulo)
      unidade: unidades
      soma: sim
    - coluna: quantidade_artefato_explosivo_total
      o_que: artefatos explosivos (25% nulo)
      unidade: unidades
      soma: sim
    use_para: apreensões de armas por tipo, CISP e mês
    nao_use_para: série anterior a 2007 (use armas_fogo_apreendidas_mensal, 2003–2006)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 32.476 linhas = 32.476 distintas em (ano, mes, id_cisp) — medido 2026-10-27
  armas_fogo_apreendidas_mensal:
    ultima_data: "2006-12"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma CISP × mês (2003–2006)
    chave: (ano, mes, id_cisp, id_municipio), também única só com (ano, mes, id_cisp)
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2003-01–2006-12
    territorio:
      nivel: outro
      colunas:
        id_cisp: delegacia
        id_aisp: AISP
        id_risp: RISP
        id_municipio: município; inclui '9999999'
    medidas:
    - coluna: quantidade_arma_fogo_apreendida
      o_que: armas de fogo apreendidas
      unidade: armas
      soma: sim
    use_para: apreensão de armas de fogo antes de 2007
    nao_use_para: anos depois de 2006 (use armas_apreendidas_mensal)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 6.206 linhas = 6.206 distintas em (ano, mes, id_cisp, id_municipio) e em (ano, mes, id_cisp) — medido 2026-10-27
  relacao_cisp_aisp_risp:
    grao: uma unidade territorial (bairro ou parte) atendida por uma CISP, ligando CISP, AISP, RISP e município
    chave: (id_cisp, unidade_territorial); id_cisp sozinha repete (147 linhas, 137 CISPs)
    tempo:
      natureza: sem_tempo
      coluna: nenhuma
      cobertura: cadastro atual
    territorio:
      nivel: municipio
      colunas:
        id_cisp: delegacia
        id_aisp: AISP
        id_risp: RISP
        id_municipio: município (92)
        unidade_territorial: bairros atendidos, texto livre
        regiao: 'região (7 valores, ex.: Baixadas Litorâneas, Serrana)'
    use_para: tabela de ligação entre CISP, AISP, RISP e município
    nao_use_para: junção direta em tabelas mensais sem tratar CISPs com mais de uma linha (multiplica)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 147 linhas; 137 id_cisp distintos; (id_cisp, unidade_territorial) 147 distintas — medido 2026-10-27
  taxa_evolucao_anual_municipio:
    ultima_data: "2020"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um município × ano
    chave: (ano, id_municipio)
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 2014–2020
    territorio:
      nivel: municipio
      colunas:
        id_municipio: IBGE (92)
        regiao: Capital, Baixada Fluminense, Grande Niterói, Interior
    medidas:
    - coluna: taxa_homicidio_doloso
      o_que: taxa de homicídio doloso
      unidade: por 100 mil habitantes
      soma: nao
    - coluna: taxa_total_roubos
      o_que: taxa de roubos
      unidade: por 100 mil habitantes
      soma: nao
    use_para: taxas anuais por município
    nao_use_para: somar taxas; 54 dos 92 municípios por ano têm todas as taxas nulas (59% nulo)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 644 linhas = 644 distintas em (ano, id_municipio); taxa_homicidio_doloso não nula em 266 linhas, 54 nulas em cada ano — medido 2026-10-27
  taxa_evolucao_anual_uf:
    ultima_data: "2023"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: o estado do RJ × ano
    chave: ano
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 1991–2023
    territorio:
      nivel: uf
      colunas: {}
    medidas:
    - coluna: taxa_homicidio_doloso
      o_que: taxa de homicídio doloso
      unidade: por 100 mil habitantes (2019 = 23,19; 2023 = 18,75)
      soma: nao
    use_para: taxas anuais estaduais do RJ
    nao_use_para: somar anos; algumas taxas têm nan como texto-número em anos antigos
    rascunho:
    - use_para
    - nao_use_para
    verificado: 33 linhas = 33 anos distintos — medido 2026-10-27
  taxa_evolucao_mensal_municipio:
    ultima_data: "2024-12"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um município × mês
    chave: (ano, mes, id_municipio)
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2014-01–2024-12
    territorio:
      nivel: municipio
      colunas:
        id_municipio: IBGE
        regiao: 4 regiões, nula em 0,02% das linhas
    medidas:
    - coluna: taxa_homicidio_doloso
      o_que: taxa de homicídio doloso no mês
      unidade: por 100 mil habitantes
      soma: nao
    use_para: taxas mensais por município
    nao_use_para: somar sem ponderar pela população
    rascunho:
    - use_para
    - nao_use_para
    verificado: 12.144 linhas = 12.144 distintas em (ano, mes, id_municipio) — medido 2026-10-27
  taxa_evolucao_mensal_uf:
    ultima_data: "2024-12"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: o estado do RJ × mês
    chave: (ano, mes)
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2003-01–2024-12
    territorio:
      nivel: uf
      colunas: {}
    medidas:
    - coluna: taxa_homicidio_doloso
      o_que: taxa mensal de homicídio doloso
      unidade: por 100 mil habitantes; a soma dos 12 meses de 2019 = 23,2 = taxa anual
      soma: nao
    use_para: taxas mensais do RJ
    nao_use_para: comparar com outras UFs
    rascunho:
    - use_para
    - nao_use_para
    verificado: 264 linhas = 264 distintas em (ano, mes) — medido 2026-10-27
  taxa_letalidade:
    ultima_data: "2022"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma região × delito × ano
    chave: (ano, regiao, delito)
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 1991–2022
    territorio:
      nivel: regiao
      colunas:
        regiao: '''Estado'',''Capital'',''Baixada Fluminense'',''Interior'',''Grande Niteroi'' (sem acento aqui, com acento nas outras tabelas)'
    medidas:
    - coluna: contagem_delito
      o_que: número de casos
      unidade: 'ARMADILHA: valores de 1.000 ou mais aparecem com ponto de milhar lido como decimal (Estado, 2019, Homicídio Doloso = 4.004, que é 4004 casos na evolucao_mensal_uf); não use como contagem sem conferir'
      soma: nao
    - coluna: populacao
      o_que: população da região
      unidade: habitantes
      soma: nao
    - coluna: taxa_cem_mil_habitantes
      o_que: taxa
      unidade: por 100 mil habitantes (Estado 2019 = 23,2)
      soma: nao
    filtros_tipicos:
    - delito IN ('Homicídio Doloso','Letalidade Violenta','Morte por Intervencao do Agente do Estado') (grafia literal; sem acento em 'Intervencao')
    - regiao = 'Estado' para o total estadual
    use_para: taxas de letalidade por região do RJ
    nao_use_para: contagem de casos (contagem_delito corrompida em milhares)
    rascunho:
    - use_para
    - nao_use_para
    verificado: '383 linhas = 383 distintas em (ano, regiao, delito); delitos: Homicídio Doloso 133, Letalidade Violenta 133, Intervencao 117 — medido 2026-10-27'
