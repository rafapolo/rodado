# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ok_queridodiario
tabelas:
  diarios:
    grao: "uma edição de diário oficial de um município numa data (metadados, sem texto)"
    chave: "(territory_id, date, url) — 320.424 linhas = 320.424 distintos; url sozinha repete em 504 URLs (um mesmo PDF serve vários municípios, ex.: 2700000 com 2701100, 2703759, 2704500...)"
    tempo: {natureza: serie_diaria, coluna: date, cobertura: "2023-07-10–2026-10-06 (2023: 53.079; 2024: 108.005; 2025: 92.316; 2026: 67.024 linhas)"}
    territorio:
      nivel: municipio
      colunas:
        territory_id: "código IBGE do município, VARCHAR (7 dígitos); BIGINT na tabela _texto, faça CAST no join"
        territory_name: "nome do município"
        state_code: "UF (27)"
    medidas:
      - {expressao: "count(*)", o_que: "edições publicadas coletadas (cobertura de 524 municípios, não os 5.570)", unidade: "edições", soma: sim}
    filtros_tipicos:
      - "is_extra_edition = true (15.482) | false (300.682); nulo em 4.260 linhas — edição extra"
      - "state_code = 'SP' (74.974), 'BA' (73.377), 'AL' (25.815)"
      - "url começa com 'https://data.queridodiario.ok.org.br/' em 319.008 linhas; o resto é 's3://okbr-qd-migration//...', que não abre como link"
    use_para: "saber quais municípios e datas têm diário coletado e achar a url do PDF/txt de uma edição"
    nao_use_para: "afirmar que um município não publicou (a coleta cobre só 524 municípios) nem ler o conteúdo (use br_ok_queridodiario_texto)"
    rascunho: [use_para, nao_use_para]
    verificado: "320.424 linhas = 320.424 distintos (territory_id,date,url); 296.930 url distintas; 524 territory_id distintos; join com br_ok_queridodiario_texto.diarios por (url, territory_id, date) casa 320.422 linhas — medido 2026-10-27"
