# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_pncp
tabelas:
  contratos:
    ultima_data: "2026-11-03"
    grao: "um contrato/empenho/ata registrado no PNCP por um órgão (número de controle PNCP), com linhas inteiras duplicadas na carga"
    chave: "nenhuma: 5.370.608 linhas, 4.393.725 linhas distintas e 4.391.100 numeroControlePNCP distintos (979.508 linhas a mais que chaves). As repetições estão só em ano_publicacao 2025 (2.189.821 linhas para 1.690.768 chaves) e 2026 (2.230.671 para 1.750.216); de 2021 a 2024 há uma linha por chave. Deduplique (gotcha contrato_repetido) com SELECT DISTINCT * ou QUALIFY row_number() OVER (PARTITION BY numeroControlePNCP ORDER BY dataAtualizacao DESC) = 1"
    tempo: {natureza: serie_diaria, coluna: "dataAssinatura", cobertura: "assinatura de 2021-04-02 a 2026-11-03 (mais 76 linhas com data futura, até 2031-02-09; dataVigenciaFim chega a 9999-12-31); ano_publicacao 2021–2026; publicado até 2026-11-01"}
    territorio: {nivel: municipio, colunas: {unidadeOrgao.codigoIbge: "código IBGE do município da unidade compradora (STRUCT unidadeOrgao; nulo em 0 linhas)", unidadeOrgao.ufSigla: "UF da unidade compradora", orgaoEntidade.esferaId: "esfera do órgão: M (municipal) 3.765.231 linhas, E (estadual) 795.930, F (federal) 691.418, N 113.216, D (distrital) 4.813. N é \"não se aplica\" por medição: estatais e consórcios que não são de um ente (Caixa 44.703, consórcios intermunicipais de saúde, IMBEL, BNDES, EBSERH), não uma esfera de governo", orgaoEntidade.poderId: "poder: E executivo, L legislativo, J judiciário, N não se aplica (M+N = prefeituras sem poder informado, 2.934.895 linhas)"}}
    medidas:
      - {coluna: "valorGlobal", o_que: "valor global do contrato incluindo aditivos", unidade: "R$", soma: "sim, depois de deduplicar e de tirar os outliers: máximo R$ 6,0 tri; 86 contratos acima de R$ 10 bi somam R$ 34,2 tri, mais que todo o resto (R$ 2,2 tri); sem eles, assinados em 2025 R$ 998 bi e em 2026 R$ 835 bi (com eles, 13.564 e 20.479 bi). A soma de 2025 cai de R$ 14.924 bi para R$ 13.564 bi só pela deduplicação"}
      - {coluna: "valorInicial", o_que: "valor inicial do contrato", unidade: "R$", soma: "sim, mesma ressalva (igual a valorGlobal em 5.214.021 linhas; valorGlobal maior em 85.982, valorInicial maior em 70.605)"}
      - {coluna: "valorParcela", o_que: "valor da parcela", unidade: "R$", soma: "nao: parcela, não o total do contrato"}
      - {coluna: "valorAcumulado", o_que: "valor acumulado (nulo em 41%)", unidade: "R$", soma: nao}
    filtros_tipicos:
      - "year(dataAssinatura) = 2025, nunca anoContrato (75 valores fora de 2000–2030, ver gotcha ano_contrato_corrompido)"
      - "tipoPessoa = 'PJ' (fornecedor pessoa jurídica, 5.152.289 linhas; também 'PF' 204.598 e 'PE' estrangeiro 13.721), mas o tipo não confere com os dígitos (gotcha tipo_pessoa_nao_confere_com_digitos)"
      - "tipoContrato.nome = 'Contrato (termo inicial)' (1.947.287) para excluir 'Empenho' (1.967.021) e 'Outros' (1.427.609); há ainda Carta Contrato 13.523, Termo de Adesão 9.673, Comodato 3.272, Concessão 1.394 e outros menores; categoriaProcesso.nome = 'Compras' (3.652.250), 'Serviços' (1.365.136), 'Obras' (61.962) e mais 8 categorias; tipoContrato e categoriaProcesso são STRUCT(id, nome): acesse com .nome ou .id"
      - "receita = false para despesa (true = contrato que gera receita ao órgão: 59.909 linhas)"
      - "o campo esferaId do STRUCT orgaoEntidade: IN ('M','E','F','D') para só entes de governo; 'N' é estatal/consórcio (113.216 linhas)"
    use_para: "contratos, empenhos e termos públicos por fornecedor (niFornecedor), órgão (orgaoEntidade.cnpj) ou município e UF do comprador, no ano de assinatura, depois de deduplicar por numeroControlePNCP."
    nao_use_para: "somar valorGlobal sem deduplicar e sem tratar os outliers (86 contratos respondem por 94% do valor); usar anoContrato como ano; contar contratos por linha de 2025 em diante (22% das linhas de 2025–2026 são repetição); tratar Empenho e Outros como contrato (63% das linhas); ler esferaId = N como esfera."
    verificado: "5.370.608 linhas; 4.393.725 distintas; 4.391.100 numeroControlePNCP distintos; ano_publicacao 2021 5.175, 2022 40.645, 2023 241.449, 2024 662.847, 2025 2.189.821, 2026 2.230.671 linhas (chaves 2025 1.690.768, 2026 1.750.216); versão mais recente por chave: valorGlobal 2022 R$ 171 bi, 2023 435, 2024 1.754, 2025 13.564, 2026 20.479, sem as 86 chaves > R$ 10 bi 4,6; 63,5; 313,6; 998,4; 835,3; contratos por year(dataAssinatura): 2024 735.825, 2025 2.295.434, 2026 2.010.050; esferaId e poderId cruzados com razão social dos órgãos — medido 2026-11-18. Gotchas: ano_contrato_corrompido, contrato_repetido, valorglobal_outliers_dominam_a_soma"