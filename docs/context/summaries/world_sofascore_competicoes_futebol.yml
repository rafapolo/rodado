# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: world_sofascore_competicoes_futebol
tabelas:
  brasileirao_serie_a:
    grao: 'uma partida × tempo (um tempo de jogo): cada partida ocupa 2 linhas (tempos 1 e 2)'
    chave: (id_partida, tempo)
    tempo:
      natureza: serie_de_periodos
      coluna: data
      cobertura: 2016-05-14–2025-03-31 (ano 2016–2025, 2025 só 10 partidas; 2020 e 2021 têm temporada '20/21' dividida por ano civil)
    territorio:
      nivel: nenhum
      colunas:
        time_mandante: time da casa (texto)
        time_visitante: time visitante (texto)
    medidas:
    - coluna: gols_mandante, gols_visitante
      o_que: 'gols marcados NAQUELE tempo (não acumulado: em 930 de 3.423 partidas do Brasileirão os gols do 2º tempo são menores que os do 1º); o placar final é a soma das linhas da partida'
      unidade: gols
      soma: sim
    - coluna: finalizacao_*, escanteio_*, falta_*, passe_*, passes_certo_*, cartao_amarelo_*, defesa_goleiro_*, ...
      o_que: estatísticas contáveis do time naquele tempo (sufixo _mandante / _visitante)
      unidade: contagens por tempo
      soma: sim
    - coluna: posse_bola_mandante, posse_bola_visitante
      o_que: posse de bola no tempo
      unidade: '% do tempo; não some entre tempos, tire a média'
      soma: nao
    - coluna: gol_esperado_*
      o_que: xG do time no tempo (muito nulo)
      unidade: gols esperados
      soma: sim
    filtros_tipicos:
    - tempo IN ('1','2') (texto; as duas linhas de cada partida)
    - temporada = '20/21' para o campeonato 2020/21 (partido em ano 2020 e 2021); demais temporadas têm o ano ('2016'…'2025')
    - rodada é texto ('1'…'38')
    use_para: estatísticas de jogo por tempo; somando os tempos de uma partida tem-se o jogo inteiro
    nao_use_para: contar partidas com count(*) (cada partida são 2+ linhas; use count(DISTINCT id_partida)); média de gols por linha como se fosse por jogo
    rascunho:
    - use_para
    - nao_use_para
    verificado: '6.846 linhas = 6.846 distintas em (id_partida, tempo); 3.423 partidas; gols por partida 2,37 somando os dois tempos; por tempo: 1º 3.633 gols, 2º 4.481 — medido 2026-10-27'
  uefa_champions_league:
    grao: 'uma partida × tempo (um tempo de jogo): cada partida ocupa 2 linhas (tempos 1 e 2); partidas com tempo 3 e 4 têm linhas extras (28 partidas), provavelmente prorrogação (significado não documentado)'
    chave: (id_partida, tempo)
    tempo:
      natureza: serie_de_periodos
      coluna: data
      cobertura: 2007-09-18–2025-03-12
    territorio:
      nivel: nenhum
      colunas:
        time_mandante: time da casa (texto)
        time_visitante: time visitante (texto)
    medidas:
    - coluna: gols_mandante, gols_visitante
      o_que: 'gols marcados NAQUELE tempo (não acumulado: em 930 de 3.423 partidas do Brasileirão os gols do 2º tempo são menores que os do 1º); o placar final é a soma das linhas da partida'
      unidade: gols
      soma: sim
    - coluna: finalizacao_*, escanteio_*, falta_*, passe_*, passes_certo_*, cartao_amarelo_*, defesa_goleiro_*, ...
      o_que: estatísticas contáveis do time naquele tempo (sufixo _mandante / _visitante)
      unidade: contagens por tempo
      soma: sim
    - coluna: posse_bola_mandante, posse_bola_visitante
      o_que: posse de bola no tempo
      unidade: '% do tempo; não some entre tempos, tire a média'
      soma: nao
    - coluna: gol_esperado_*
      o_que: xG do time no tempo (muito nulo)
      unidade: gols esperados
      soma: sim
    filtros_tipicos:
    - tempo IN ('1','2') para o tempo regulamentar (3 e 4 só em 28 partidas, provavelmente prorrogação)
    - temporada como texto '07/08'…'24/25'; ano é o ano civil da partida e uma temporada cruza dois anos
    - 'rodada é texto: ''1''–''8'' ou ''Oitavos-De-Final'',''Quartas De Final'',''Semifinal'',''Final'',''Rodada De Playoff'',''Quarta Rodada De Qualificação'' etc. (grafia literal)'
    use_para: estatísticas de jogo por tempo; somando os tempos de uma partida tem-se o jogo inteiro
    nao_use_para: contar partidas com count(*) (cada partida são 2+ linhas; use count(DISTINCT id_partida)); média de gols por linha como se fosse por jogo
    rascunho:
    - use_para
    - nao_use_para
    verificado: '4.478 linhas = 4.478 distintas em (id_partida, tempo); 2.211 partidas; tempos: 1 e 2 em 2.211 cada, 3 e 4 em 28 cada; gols por partida 2,89 nos tempos 1 e 2 — medido 2026-10-27'
