# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_siop_orcamento
tabelas:
  dados:
    ultima_data: "2025-12-31"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma ação orçamentária (cadastro de ações do PLOA 2025: esfera × UO × programa × ação)"
    chave: "Esfera, UO, Função, Subfunção, Programa, Ação (5.610 linhas, 5.610 distintos; Esfera+UO+Programa+Ação já basta, e as 5.610 ações são as mesmas de localizadores)"
    tempo: {natureza: sem_tempo, coluna: "Exercício", cobertura: "2025–2025 (Início e Término do projeto vão de 1992-12-31 a 2041-12-31)"}
    territorio: {nivel: brasil}
    medidas:
      - {coluna: "Custo OFSS/OI", o_que: "custo total do projeto (só Tipo = Projeto tem valor: 468 das 490 linhas; Atividade, Operações Especiais e Reserva de Contingência vêm vazias)", unidade: "R$ (soma 879.186.498.042)", soma: sim}
      - {coluna: "Custo Demais Fontes", o_que: "custo de projeto em outras fontes (soma 7.995.649.973)", unidade: "R$", soma: sim}
      - {coluna: "Total Físico", o_que: "meta física do projeto (447 linhas com valor, todas Projeto), na unidade de Unidade de Medida", unidade: "varia: 23 unidades de medida (unidade, km, m³, '% de execução'...); 3.099 linhas têm Unidade de Medida vazia", soma: nao}
    filtros_tipicos:
      - "Esfera = 10 (Orçamento Fiscal, 4.454), 20 (Seguridade Social, 916) ou 30 (Investimento das estatais, 240): número, não texto, nesta tabela"
      - "Tipo = 'Atividade' (3.262), 'Operações Especiais' (1.728), 'Projeto' (490) ou 'Reserva de Contingência' (130)"
      - "Origem = 'PLOA' (5.542), 'Emenda' (57) ou 'Crédito Adicional' (11)"
    use_para: "cadastro descritivo das ações do orçamento federal de 2025 (título, tipo, produto, unidade de medida, beneficiário, base legal) e o custo total dos 490 projetos (R$ 879,2 bi)."
    nao_use_para: "valor dotado, empenhado ou pago (não há coluna de dotação); tratar Custo OFSS/OI como a despesa da LOA (só Projeto tem custo); somar Total Físico (unidades misturadas: 'km', 'unidade', '% de execução' chegando a 45.000.000); somar dados com localizadores (o custo dos localizadores é a repartição do custo da mesma ação)."
    verificado: "5.610 linhas, 5.610 distintos da chave; Esfera 10→4.454, 20→916, 30→240; Custo OFSS/OI nulo em 91,66% (soma 879.186.498.042, Projeto: 468 de 490 linhas; Atividade 3.262 e Operações Especiais 1.728 com 0); Total Físico preenchido em 447 linhas, nenhuma fora de Projeto; 23 valores de Unidade de Medida, 3.099 linhas vazias; Exercício só 2025 — medido 2026-10-27, refeito 2026-11-10"
  localizadores:
    ultima_data: "2025-12-31"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um localizador (recorte geográfico) de uma ação orçamentária em 2025, com Origem (PLOA, Emenda, crédito); a repartição geográfica do custo da ação, não uma cópia dele"
    chave: "Esfera, UO, Função, Subfunção, Programa, Ação, Localizador, Origem (8.054 linhas, 8.054 distintos; sem Origem também 8.054). 393 das 5.610 ações têm mais de um localizador"
    tempo: {natureza: sem_tempo, coluna: "Exercício", cobertura: "2025–2025"}
    territorio: {nivel: uf, colunas: {"Região": "por extenso: 'Nacional' 2.328, 'Região Nordeste' 1.645, 'Região Sudeste' 1.413, 'Região Centro-Oeste' 880, 'Região Norte' 797, 'Região Sul' 716, 'Exterior' 275", UF: "estado por extenso, vazio em 2.824 linhas (Nacional, Exterior e parte dos regionais)", "Município": "município por extenso, texto livre, preenchido só em 777 linhas", "Recorte Geográfico": "texto de agrupamento (ex.: 'Amazônia Legal', '1ª Região da Justiça Federal'), vazio em 7.776"}}
    medidas:
      - {coluna: "Valor da Repercussão Financeira sobre o Custeio da União", o_que: "repercussão no custeio (846 linhas, 89,5% nulos; soma 16,5 bi, com 1 valor negativo)", unidade: "R$", soma: sim}
      - {coluna: "Custo OFSS/OI", o_que: "parte do custo do projeto atribuída ao localizador (595 linhas preenchidas, 92,6% nulos); a soma por ação é igual à de dados em 5.610 de 5.610 ações, e a soma total é 879.186.498.042 nas duas tabelas", unidade: "R$", soma: sim}
      - {coluna: "Custo Demais Fontes", o_que: "idem para outras fontes (479 linhas); soma 7.955.649.973 contra 7.995.649.973 em dados (R$ 40 mi a menos)", unidade: "R$", soma: sim}
    filtros_tipicos:
      - "Origem = 'PLOA' (6.043), 'Emenda' (1.961), 'CrÃ©dito ExtraordinÃ¡rio' (47) ou 'CrÃ©dito Especial' (3): o texto vem com mojibake (gotcha colunas_com_mojibake_e_bom)"
      - "Esfera = 10, 20 ou 30 (número)"
      - "UF = '' (vazio) quando o localizador é Nacional, Exterior ou de região: 2.824 linhas"
    use_para: "ver onde (região, UF, município) uma ação ou emenda está localizada no orçamento 2025, e repartir o custo dos projetos por região ou UF (Custo OFSS/OI soma por localizador sem repetir)."
    nao_use_para: "somar localizadores junto com dados (o custo é o mesmo, conta em dobro); valor de dotação, empenho ou pagamento (não existe aqui); contar município como lista completa (só 777 linhas o trazem); presumir que 'UF' vazio é erro (é localizador Nacional, Exterior ou regional)."
    verificado: "8.054 linhas, 8.054 distintos da chave; 8.054 de 8.054 casam com dados por (Esfera, UO, Programa, Ação); 393 ações com mais de um localizador. Custo OFSS/OI: 595 linhas preenchidas (116 só ele, 479 com Custo Demais Fontes), soma 879.186.498.042 = soma de dados, igual em 5.610 de 5.610 ações (o rascunho dizia que repetia o da ação: errado). Custo Demais Fontes 7.955.649.973 contra 7.995.649.973 em dados. Origem PLOA 6.043 (593 com custo, 879.135.921.497), Emenda 1.961 (1 com custo), CE 47, Especial 3. Repercussão: 846 linhas, soma 16.545.250.076. Nomes de colunas e textos com mojibake ('FunÃ§Ã£o', 'RegiÃ£o'): use esses nomes literais — medido 2026-10-27, refeito 2026-11-10"
  planos_orcamentarios:
    grao: "um plano orçamentário (subdivisão da ação) em 2025: esfera × UO × programa × ação × plano"
    chave: "Esfera, UO, Função, Subfunção, Programa, Ação, Plano Orçamentário (13.490 linhas, 13.490 distintos; sem Função e Subfunção também 13.490)"
    tempo: {natureza: sem_tempo, coluna: "Exercício", cobertura: "2025–2025"}
    territorio: {nivel: brasil}
    filtros_tipicos:
      - "Esfera = 10 (11.604), 20 (1.646) ou 30 (240): número"
      - "Novo = 'Sim' (1.406) ou 'Não' (12.084): em texto com mojibake ('NÃ£o')"
    use_para: "cadastro descritivo dos planos orçamentários de cada ação (título, caracterização, produto intermediário)"
    nao_use_para: "qualquer valor: a tabela não tem coluna numérica"
    rascunho: [use_para, nao_use_para]
    verificado: "13.490 linhas, 13.490 distintos da chave; colunas e textos com mojibake como em localizadores — medido 2026-10-27"
  alteracoes_orcamentarias:
    ultima_data: "2026-08-14"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma linha de alteração orçamentária (crédito, portaria, MP) de 2026: documento × classificação orçamentária, com acréscimo e redução"
    chave: "numero_documento mais esfera, unidade, funcao, subfuncao, programa, acao, localizador, plano_orcamentario, categoria_economica, grupo_despesa, modalidade, fonte, idoc, iduso, resultado_primario, tipo_credito (10.093 linhas, 10.093 distintos)"
    tempo: {natureza: serie_de_periodos, coluna: data_publicacao_instrumento_legal, cobertura: "2026 (coluna ano, nome gravado 'ï»¿ano')"}
    territorio: {nivel: brasil}
    medidas:
      - {coluna: val_acrescimo, o_que: "valor acrescido à dotação", unidade: "R$ (texto com vírgula decimal, ex. '30000000,00')", soma: sim}
      - {coluna: val_reducao, o_que: "valor reduzido da dotação", unidade: "R$ (texto com vírgula decimal)", soma: sim}
    filtros_tipicos:
      - "classificacao_alteracao: o texto vem com mojibake ('CrÃ©dito Suplementar' 7.264, 'Outras AlteraÃ§Ãµes OrÃ§amentÃ¡rias' 2.731, 'CrÃ©dito ExtraordinÃ¡rio' 81, 'Reabertura de CrÃ©dito' 17)"
      - "tipo_credito = 'A - Inicial (LOA)' (9.991), 'G - Extraordinário' (101), 'C - Especial' (1): o valor inclui o código e o rótulo"
      - "esfera = '10 - Orçamento Fiscal' (8.121) ou '20 - Orçamento da Seguridade Social' (1.972): texto com código, não número"
    use_para: "o que foi suplementado, remanejado ou aberto como crédito extraordinário em 2026, por órgão, função e fonte"
    nao_use_para: "somar val_acrescimo sem converter (é texto) nem tratar 'Outras Alterações' como gasto novo: acréscimo e redução quase se anulam"
    rascunho: [use_para, nao_use_para]
    verificado: "10.093 linhas, 10.093 distintos da chave; datas dd-mm-aaaa em texto; soma em R$ bi após converter: Crédito Suplementar +112,2 / -59,9; Crédito Extraordinário +100,2 / 0; Outras Alterações +1.281,8 / -1.281,8; Reabertura +0,13 / -0,001 — medido 2026-10-27"
