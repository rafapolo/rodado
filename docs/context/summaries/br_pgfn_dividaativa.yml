# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_pgfn_dividaativa
tabelas:
  divida:
    grao: "uma inscrição em dívida ativa × um devedor (CPF/CNPJ), no estoque do trimestre mais recente (2026 T2)"
    chave: "(NUMERO_INSCRICAO, CPF_CNPJ): não é única por 10 linhas em 49.702.198 (49.702.188 distintos). NUMERO_INSCRICAO sozinho NÃO é chave: 34.993.563 distintos, 12.747.823 inscrições têm mais de um devedor"
    tempo: {natureza: retrato_atual, coluna: trimestre, cobertura: "2026_trimestre_02–2026_trimestre_02 (um só valor; DATA_INSCRICAO é texto dd/mm/aaaa, de 01/01/1000 a 31/12/2024 no perfil)"}
    territorio: {nivel: uf, colunas: {UF_DEVEDOR: "UF do endereço do devedor", UNIDADE_RESPONSAVEL: "região/unidade da PGFN que cobra (não é território do devedor)"}}
    medidas:
      - {coluna: VALOR_CONSOLIDADO, o_que: "valor consolidado da inscrição (DOUBLE, ponto decimal)", unidade: "R$", soma: "sim por linha, mas o valor se repete em cada devedor da mesma inscrição: SUM por linha = R$ 7,385 tri; somando uma vez por NUMERO_INSCRICAO (max) dá R$ 3,513 tri. Em inscrições com mais de um devedor o valor nunca diverge entre as linhas (0 casos). Para 'dívida total da União' use a soma por inscrição; para 'dívida de um devedor' a soma por linha serve"}
    filtros_tipicos:
      - "TIPO_SITUACAO_INSCRICAO = 'Em cobrança' (40.163.378 linhas); outros: 'Benefício Fiscal' 9.382.216, 'Garantia' 111.846, 'Suspenso por decisão judicial' 44.646, 'Em negociação' 112"
      - "TIPO_DEVEDOR tem variação de caixa: 'PRINCIPAL' (30.845.336), 'Principal' (4.148.227), 'CORRESPONSAVEL' (14.656.817), 'SOLIDARIO' (51.818); para o principal use upper(TIPO_DEVEDOR) = 'PRINCIPAL'"
      - "TIPO_PESSOA = 'Pessoa jurídica' / 'Pessoa física'; cnpj_basico só existe para PJ (ver gotcha filtrar_por_cnpj_basico)"
      - "categoria IN ('nao_previdenciario' 45.553.971, 'previdenciario' 3.606.529, 'fgts' 541.698)"
      - "INDICADOR_AJUIZADO = 'SIM' (11.052.587) ou 'NAO' (38.649.611)"
    use_para: "Consultar a dívida ativa de um devedor/empresa (por cnpj_basico) ou o estoque por UF, situação, categoria e receita"
    nao_use_para: "Série temporal ou fluxo (use divida_trimestres); total nacional somando VALOR_CONSOLIDADO por linha sem tratar devedores repetidos"
    rascunho: [use_para, nao_use_para]
    verificado: "49.702.198 linhas; 49.702.188 distintos de (NUMERO_INSCRICAO, CPF_CNPJ); 34.993.563 inscrições distintas; soma por linha 7.385.472.245.199; soma por inscrição 3.512.786.565.271; DATA_INSCRICAO = '01/01/1000' em 3.458 linhas (data inválida) — medido 2026-10-27. Gotchas: valor_consolidado_double, filtrar_por_cnpj_basico, trimestre_e_retrato_do_estoque"
  divida_trimestres:
    grao: "uma inscrição × um devedor no estoque de um trimestre (2020 T1 a 2026 T2); cada trimestre é um retrato completo"
    chave: "(trimestre, NUMERO_INSCRICAO, CPF_CNPJ): medido no trimestre 2024_trimestre_04, 37.183.467 linhas e 37.183.462 distintos (5 repetidas); nos demais trimestres, não medido"
    tempo: {natureza: soma_de_retratos, coluna: trimestre, cobertura: "2020_trimestre_01–2026_trimestre_02 (26 trimestres, texto aaaa_trimestre_nn)"}
    territorio: {nivel: uf, colunas: {UF_DEVEDOR: "UF do devedor (nula em ~34% da amostra)", UNIDADE_RESPONSAVEL: "unidade da PGFN que cobra"}}
    medidas:
      - {coluna: VALOR_CONSOLIDADO, o_que: "valor consolidado da inscrição no trimestre", unidade: "R$", soma: "nao entre trimestres (retrato do estoque, ver gotcha trimestre_e_retrato_do_estoque); dentro de um trimestre só com a ressalva de devedores repetidos descrita em divida"}
    filtros_tipicos:
      - "trimestre = '2026_trimestre_02' (sempre fixe um trimestre; tabela com 807 milhões de linhas)"
      - "TIPO_DEVEDOR com variação de caixa ('PRINCIPAL'/'Principal'), como em divida; em 2020_trimestre_01: PRINCIPAL 13.935.839, Principal 5.501.131, CORRESPONSAVEL 4.273.375, SOLIDARIO 3.426"
      - "evitar 2020_trimestre_03 (cópia de T2) e 2022_trimestre_04 (sem nao_previdenciario), ver gotcha trimestres_falsos_na_fonte"
    use_para: "Comparar o estoque de dívida ativa entre trimestres (dois retratos por NUMERO_INSCRICAO)"
    nao_use_para: "Somar trimestres; ler UF_DEVEDOR/cnpj_basico como se existissem em todos os trimestres (nesta tabela não há cnpj_basico)"
    rascunho: [use_para, nao_use_para]
    verificado: "807.424.243 linhas; 2020_trimestre_01 tem 23.713.771 linhas; 2024_trimestre_04 tem 37.183.467 linhas — medido 2026-10-27"
