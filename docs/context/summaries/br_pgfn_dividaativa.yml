# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_pgfn_dividaativa
tabelas:
  divida:
    ultima_data: "2026-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma inscrição em dívida ativa × um devedor (CPF/CNPJ), no estoque do trimestre mais recente (2026 T3 em 2026-11-03)"
    chave: "(NUMERO_INSCRICAO, CPF_CNPJ): não é única por 10 linhas em 49.702.198 (49.702.188 distintos). NUMERO_INSCRICAO sozinho NÃO é chave: 34.993.563 distintos, 12.747.823 inscrições têm mais de um devedor"
    tempo: {natureza: retrato_atual, coluna: trimestre, cobertura: "2026_trimestre_03 (um só valor, medido 2026-11-03; DATA_INSCRICAO é texto dd/mm/aaaa, de 01/01/1000 a 31/12/2024 no perfil)"}
    territorio: {nivel: uf, colunas: {UF_DEVEDOR: "UF do endereço do devedor", UNIDADE_RESPONSAVEL: "região/unidade da PGFN que cobra (não é território do devedor)"}}
    medidas:
      - {coluna: VALOR_CONSOLIDADO, o_que: "valor consolidado da inscrição (DOUBLE, ponto decimal)", unidade: "R$", soma: "sim por linha, mas o valor se repete em cada devedor da mesma inscrição: SUM por linha = R$ 7,385 tri; somando uma vez por NUMERO_INSCRICAO (max) dá R$ 3,513 tri. Em inscrições com mais de um devedor o valor nunca diverge entre as linhas (0 casos). Para 'dívida total da União' use a soma por inscrição (gotcha divida_repetida_por_devedor); para 'dívida de um devedor' a soma por linha serve"}
    filtros_tipicos:
      - "TIPO_SITUACAO_INSCRICAO = 'Em cobrança' (40.163.378 linhas); outros: 'Benefício Fiscal' 9.382.216, 'Garantia' 111.846, 'Suspenso por decisão judicial' 44.646, 'Em negociação' 112"
      - "TIPO_DEVEDOR tem variação de caixa: 'PRINCIPAL' (30.845.336), 'Principal' (4.148.227), 'CORRESPONSAVEL' (14.656.817), 'SOLIDARIO' (51.818); para o principal use upper(TIPO_DEVEDOR) = 'PRINCIPAL'"
      - "TIPO_PESSOA = 'Pessoa jurídica' / 'Pessoa física'; cnpj_basico só existe para PJ (ver gotcha filtrar_por_cnpj_basico)"
      - "categoria IN ('nao_previdenciario' 45.553.971, 'previdenciario' 3.606.529, 'fgts' 541.698)"
      - "INDICADOR_AJUIZADO = 'SIM' (11.052.587) ou 'NAO' (38.649.611)"
    use_para: "consultar a dívida ativa de um devedor ou empresa (por cnpj_basico) ou o estoque por UF, situação, categoria e receita no trimestre mais recente"
    nao_use_para: "série temporal ou fluxo (use divida_trimestres, 27 trimestres de 2020 T1 a 2026 T3); total nacional somando VALOR_CONSOLIDADO por linha sem tratar devedores repetidos"
    verificado: "49.702.198 linhas; 49.702.188 distintos de (NUMERO_INSCRICAO, CPF_CNPJ); 34.993.563 inscrições distintas; soma por linha 7.385.472.245.199; soma por inscrição 3.512.786.565.271; DATA_INSCRICAO = '01/01/1000' em 3.458 linhas (data inválida) — medido 2026-10-27. Gotchas: valor_consolidado_double, filtrar_por_cnpj_basico, trimestre_e_retrato_do_estoque. o retrato passou a 2026_trimestre_03: 53.566.733 linhas (as contagens acima são do T2); divida_trimestres com 27 trimestres, 2020_trimestre_01 a 2026_trimestre_03 — medido 2026-11-03"
  divida_trimestres:
    ultima_data: "2026-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma inscrição × um devedor (CPF/CNPJ) no estoque de um trimestre (2020 T1 a 2026 T3); cada trimestre é um retrato completo das inscrições em aberto, sem cnpj_basico"
    chave: "(trimestre, NUMERO_INSCRICAO, CPF_CNPJ): quase única; 53.566.733 linhas e 53.566.689 distintos em 2026_trimestre_03 (44 repetidas), 37.183.467 e 37.183.462 em 2024_trimestre_04 (5), 23.713.771 e 23.713.764 em 2020_trimestre_01 (7). Os demais não medidos"
    tempo: {natureza: soma_de_retratos, coluna: trimestre, cobertura: "2020_trimestre_01–2026_trimestre_03 (27 trimestres, texto aaaa_trimestre_nn, um parquet por trimestre); 2020 T3 é cópia de T2 e 2022 T4 está incompleto (6,4 milhões de linhas, sem nao_previdenciario)"}
    territorio: {nivel: uf, colunas: {UF_DEVEDOR: "UF do devedor: NULA em 100% das linhas de 2020 T1 a 2022 T3 (11 trimestres) e preenchida de 2022 T4 em diante (0% nula)", UNIDADE_RESPONSAVEL: "unidade da PGFN que cobra (não é território do devedor)"}}
    medidas:
      - {coluna: VALOR_CONSOLIDADO, o_que: "valor consolidado da inscrição no trimestre (DOUBLE, R$). Por trimestre, soma por linha / só TIPO_DEVEDOR principal, em R$ tri: 2020 T1 4,51 / 2,53; 2022 T1 5,16 / 2,81; 2024 T4 6,00 / 3,05; 2026 T3 7,63 / 3,57", unidade: "R$", soma: "não entre trimestres (retrato do estoque, gotcha trimestre_e_retrato_do_estoque). Dentro de um trimestre o valor se repete em cada devedor da mesma inscrição: some uma vez por NUMERO_INSCRICAO (max) para a dívida da União; o filtro upper(TIPO_DEVEDOR) = 'PRINCIPAL' dá uma linha por inscrição só de 2023 T2 em diante (antes diferem: 2020 T1 tem 215 inscrições sem principal, 2022 T1 a T3 de 37 a 82, 2021 T2 e T4 têm mais principais que inscrições); nos trimestres antigos use max(VALOR_CONSOLIDADO) por NUMERO_INSCRICAO"}
    filtros_tipicos:
      - "trimestre = '2026_trimestre_03' (sempre fixe um trimestre; tabela com 861 milhões de linhas, 23,7 a 53,6 milhões por trimestre)"
      - "TIPO_DEVEDOR tem variação de caixa ('PRINCIPAL'/'Principal'), como em divida: use upper(TIPO_DEVEDOR)"
      - "evitar 2020_trimestre_03 (cópia exata de T2) e 2022_trimestre_04 (só fgts e previdenciario), ver gotcha trimestres_falsos_na_fonte"
      - "UF_DEVEDOR só de 2022_trimestre_04 em diante; antes dela, agrupar por UF devolve uma linha NULL com tudo"
    use_para: "comparar o estoque de dívida ativa entre trimestres (inscrições presentes num trimestre e ausentes em outro, por NUMERO_INSCRICAO), e a evolução do estoque: inscrições distintas de 19,4 milhões (2020 T1) a 36,3 milhões (2026 T3)."
    nao_use_para: "somar trimestres (cada um repete o estoque); série por UF de 2020 T1 a 2022 T3 (UF_DEVEDOR nula); ler a variação 2020 T2→T3 ou 2022 T3→T4 como real; achar empresa por cnpj_basico (a coluna só existe em divida, o trimestre mais recente); somar por linha como dívida total (devedores repetidos: por linha 7,63 tri, por inscrição 3,57 tri em 2026 T3)."
    verificado: "860.990.976 linhas em 27 trimestres (contagem por trimestre, 2020_trimestre_01 23.713.771 a 2026_trimestre_03 53.566.733, 2026 T2 = 49.702.198); inscrições distintas por trimestre: 19.437.185 (2020 T1), 22.248.716 (2022 T2), 6.401.148 (2022 T4), 28.340.353 (2024 T4), 34.993.563 (2026 T2), 36.279.356 (2026 T3); UF_DEVEDOR nula em 100% das linhas de 2020 T1 a 2022 T3 (exemplo 2022 T3: 25.933.580 nulas) e em 0% de 2022 T4 a 2026 T3 (2022 T4: SP 1.921.813, MG 702.430, RS 505.236); linhas com TIPO_DEVEDOR principal contra inscrições distintas: 2020 T1 19.436.970 / 19.437.185, 2021 T2 21.361.927 / 21.195.198, 2021 T4 21.152.773 / 21.009.671, 2022 T3 21.088.433 / 21.088.470, 2023 T1 22.687.315 / 22.687.316, iguais de 2022 T4 e de 2023 T2 em diante; 2020 T2 e T3 idênticas (24.607.286 linhas, 20.101.271 inscrições, 4,602 tri) — medido 2026-11-10 (o cartão de 2026-10-27 tinha 26 trimestres, 807.424.243 linhas, e UF nula em ~34%)"
