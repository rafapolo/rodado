  registro_classe:
    ultima_data: "2026-10-06"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma classe de cotas de fundo no cadastro vigente (RCVM 175)
    chave: 'nenhuma: ID_Registro_Classe repete em 4 casos (36.807 linhas, 36.803 IDs distintos; 1 linha exatamente duplicada)'
    tempo:
      natureza: retrato_atual
      coluna: Data_Registro / Data_Inicio_Situacao
      cobertura: Data_Registro 2023-04-06–2026-10-06
    territorio:
      nivel: nenhum
      colunas:
        ID_Registro_Fundo: liga ao fundo em registro_fundo
        CNPJ_Classe: CNPJ da classe (dado pessoal, só contagem)
    medidas:
    - coluna: Patrimonio_Liquido
      o_que: patrimônio líquido da classe em Data_Patrimonio_Liquido (7,7% nulo)
      unidade: R$
      soma: 'nao: saldo; evite somar com registro_fundo ou subclasses'
    filtros_tipicos:
    - Situacao = 'Em Funcionamento Normal' (33.779 linhas, 33.771 CNPJ_Classe distintos)
    - 'Tipo_Classe: ''Classes de Cotas de Fundos FIF'' (26.722), ''... FIDC'' (5.374), etc.'
    use_para: classes em funcionamento por tipo, classificação ANBIMA, público-alvo e patrimônio.
    nao_use_para: histórico de situação (só há o estado atual) ou contagem de fundos (a unidade é a classe).
    rascunho:
    - use_para
    - nao_use_para
    verificado: 36.807 linhas; 36.803 ID_Registro_Classe distintos; 36.806 linhas distintas; Em Funcionamento Normal 33.779 linhas / 33.771 CNPJ_Classe — medido 2026-10-27
  registro_fundo:
    ultima_data: "2026-10-06"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um registro de fundo no cadastro vigente (RCVM 175); alguns fundos vêm em mais de uma linha
    chave: 'nenhuma: ID_Registro_Fundo repete (90.502 linhas, 89.364 IDs distintos; 90.485 linhas distintas no total, 1.042 IDs com conteúdo diferente)'
    tempo:
      natureza: retrato_atual
      coluna: Data_Registro / Data_Inicio_Situacao
      cobertura: Data_Registro 1957-01-18–2026-10-06
    territorio:
      nivel: nenhum
      colunas:
        CNPJ_Fundo: CNPJ do fundo (dado pessoal, só contagem)
        ID_Registro_Fundo: id do registro CVM
    medidas:
    - coluna: Patrimonio_Liquido
      o_que: patrimônio líquido na Data_Patrimonio_Liquido (24% nulo); vem como TEXTO (VARCHAR), faça CAST
      unidade: R$
      soma: 'nao: saldo, e há linhas repetidas'
    filtros_tipicos:
    - 'Situacao = ''Em Funcionamento Normal'' (34.454 linhas, 33.768 CNPJ_Fundo distintos): conte CNPJ_Fundo DISTINCT (gotcha registro_fundo_repetido)'
    - Tipo_Fundo = 'FI' é o mais comum (62.401 linhas); 'FIF', 'FIDC', 'FIP', 'FII' etc.
    use_para: contar fundos por situação, tipo, gestor e administrador no cadastro vigente.
    nao_use_para: somar linhas como se cada uma fosse um fundo; usar Patrimonio_Liquido sem CAST.
    rascunho:
    - medidas.o_que
    verificado: 90.502 linhas; 89.364 ID_Registro_Fundo distintos; Em Funcionamento Normal 34.454 linhas / 33.768 CNPJ distintos — medido 2026-10-27
  registro_subclasse:
    ultima_data: "2026-10-06"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma subclasse de cotas de uma classe de fundo
    chave: 'ID_Subclasse: count(*) = count(DISTINCT ID_Subclasse) = 10.293'
    tempo:
      natureza: retrato_atual
      coluna: Data_Inicio_Situacao
      cobertura: Data_Inicio_Situacao 2019-10-17–2026-10-06
    territorio:
      nivel: nenhum
      colunas:
        ID_Registro_Classe: liga à classe em registro_classe (todas as 10.293 casam)
    filtros_tipicos:
    - Situacao = 'Em Funcionamento Normal' (6.148 no top do perfil; 'Fase Pré-Operacional' 3.740)
    use_para: subclasses por situação, público-alvo e forma de condomínio.
    nao_use_para: patrimônio ou rentabilidade (a tabela não tem).
    rascunho:
    - use_para
    - nao_use_para
    verificado: 10.293 linhas, 10.293 ID_Subclasse distintos, 3.896 classes distintas; 10.293 casam com registro_classe — medido 2026-10-27
