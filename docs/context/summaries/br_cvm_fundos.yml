# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_cvm_fundos
tabelas:
  balancete:
    grao: o saldo de uma conta contábil (cd_conta_balcte) de um fundo/classe num mês
    chave: 'cnpj_fundo_classe_norm + plano_conta_balcte + cd_conta_balcte (+ dt_comptc): count(*) = count(DISTINCT) = 1.123.574 em dt_comptc = ''2026-09-30'' (partição; 316,6 mi de linhas no total)'
    tempo:
      natureza: serie_mensal
      coluna: dt_comptc
      cobertura: 2005-01-31–2026-09-30 (261 meses)
    territorio:
      nivel: nenhum
      colunas:
        cnpj_fundo_classe_norm: CNPJ do fundo ou classe, sempre preenchido (13.358 em 2026-09-30); cnpj_fundo e cnpj_fundo_classe vêm nulos em parte das linhas
    medidas:
    - coluna: vl_saldo_balcte
      o_que: saldo da conta contábil no fim do mês (pode ser negativo)
      unidade: R$
      soma: 'sim: dentro de um dt_comptc e de contas do mesmo nível do plano; não some meses nem contas pai e filha juntas (hierarquia do plano de contas não medida)'
    filtros_tipicos:
    - sempre filtre dt_comptc (316,6 mi de linhas)
    - 'plano_conta_balcte = ''COFI'' em todas as 1.123.574 linhas de 2026-09-30; ''COSIF'' aparece só em meses antigos (no perfil de amostra: COFI 1.807.030, COSIF 57.344)'
    - 'cd_conta_balcte como texto (ex.: ''10000007''); o nome da conta não está na tabela'
    use_para: balancete contábil mensal de fundos por conta.
    nao_use_para: patrimônio líquido (use carteira_pl ou informe_diario) ou somar contas sem conhecer a hierarquia do plano.
    rascunho:
    - use_para
    - nao_use_para
    - medidas.soma
    - hierarquia do plano de contas
    verificado: 316.620.509 linhas no total; 1.123.574 linhas, 1.123.574 combinações da chave e 13.358 cnpj_fundo_classe_norm em 2026-09-30 — medido 2026-10-27
