  fundos:
    ultima_data: "2024-09-24"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um registro do cadastro ANTIGO de fundos de investimento (anterior à RCVM 175) — um fundo pode aparecer em mais de uma linha
    chave: 'nenhuma: CNPJ_FUNDO repete (46.806 linhas, 41.103 CNPJ distintos; 5.244 CNPJs em mais de uma linha); nenhuma linha é duplicata exata'
    tempo:
      natureza: retrato_atual
      coluna: DT_REG / DT_INI_SIT
      cobertura: DT_REG 1957-01-18–2024-09-24; DT_CANCEL até 2026-09-30
    territorio:
      nivel: nenhum
      colunas:
        CNPJ_FUNDO: CNPJ do fundo (dado pessoal, só contagem)
        CD_CVM: código CVM do fundo
    medidas:
    - coluna: VL_PATRIM_LIQ
      o_que: patrimônio líquido na data DT_PATRIM_LIQ (18% nulo)
      unidade: R$
      soma: 'nao: é saldo de um dia, e a linha pode repetir o fundo'
    - coluna: TAXA_ADM
      o_que: taxa de administração (68% nulo)
      unidade: percentual a.a. segundo a fonte; valor máximo 450000 sugere unidades mistas
      soma: nao
    filtros_tipicos:
    - 'SIT = ''EM FUNCIONAMENTO NORMAL'' (22 linhas; 46.579 são ''CANCELADA''): o cadastro vivo está em registro_fundo / registro_classe (gotcha fundos_e_cadastro_antigo)'
    - 'CONDOM, FUNDO_COTAS e outras flags: '''' (vazio) é frequente, não ''N'' — significado de '''' não documentado'
    use_para: histórico/atributos de fundos até 2024 (classe, gestor, administrador, taxas) e fundos já cancelados.
    nao_use_para: 'contar fundos ativos hoje: use registro_fundo (conte CNPJ_Fundo distinto).'
    rascunho:
    - use_para
    - nao_use_para
    - medidas.unidade
    verificado: 46.806 linhas; 41.103 CNPJ_FUNDO distintos; 34.201 CD_CVM distintos; sem linhas totalmente duplicadas; SIT normal = 22 (gotcha) — medido 2026-10-27
