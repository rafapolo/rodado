        cnpj_fundo_classe_norm: CNPJ normalizado, para ligar às demais tabelas do dataset (mesmos distintos de cnpj_fundo)
    filtros_tipicos:
    - 'dt_fim_admin IS NULL: período sem data de fim (em geral o vigente; 55.86% das linhas) — significado de fim nulo não documentado'
    use_para: saber como administrador do fundo de um fundo mudou ao longo do tempo.
