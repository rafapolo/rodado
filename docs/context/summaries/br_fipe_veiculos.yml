# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_fipe_veiculos
tabelas:
  precos:
    grao: "um modelo de veículo (catálogo FIPE: tipo × marca × modelo); a tabela não tem coluna de preço nem de ano"
    chave: "(vehicle_type, brand_code, model_code)"
    tempo: {natureza: sem_tempo}
    territorio: {nivel: nenhum}
    filtros_tipicos: ["vehicle_type = 'cars' (7386), 'motorcycles' (2038) ou 'trucks' (2001): em inglês, como está no banco"]
    use_para: "listar marcas e modelos do catálogo FIPE por tipo de veículo."
    nao_use_para: "preço de veículos, apesar do nome 'precos': só tem 5 colunas (vehicle_type, brand_code, brand_name, model_code, model_name), sem valor."
    rascunho: [use_para]
    verificado: "11425 linhas = 11425 distintos de (vehicle_type,brand_code,model_code); colunas conferidas em information_schema — medido 2026-10-27"
