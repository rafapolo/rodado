# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_bd_vizinhanca
tabelas:
  municipio:
    ultima_data: "2020"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um par ordenado de municípios vizinhos (id_municipio_1, id_municipio_2) numa data de malha (ano)"
    chave: "nenhuma: 522.822 linhas, 522.803 distintos de (ano, id_municipio_1, id_municipio_2); 19 repetem, todas com id 'NA' ou '0' (malhas de 1991 e 1980)"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "1872–2020 (23 anos de malha, não anual: 1872, 1900, 1911, 1920, 1933, 1940, 1950, 1960, 1970, 1980, 1991, 2000, 2005, 2007, 2010, 2013–2020)"}
    territorio: {nivel: municipio, colunas: {id_municipio_1: "município de origem (VARCHAR, 7 dígitos nos anos recentes)", id_municipio_2: "município vizinho"}}
    filtros_tipicos: ["ano = '2020' (VARCHAR, não número) para a malha atual: 31.832 pares", "id_municipio_1 <> id_municipio_2 e ids com 7 caracteres: em anos antigos há ids 'NA', '0' e de 1–2 caracteres (133 + 22 linhas), e 4 pares consigo mesmo"]
    use_para: "vizinhança de municípios (adjacência), a malha de 2020 para análise atual."
    nao_use_para: "distância ou área de fronteira; só diz se são vizinhos. Não conte pares sem dedup: a relação é simétrica (A,B e B,A)."
    rascunho: [use_para, nao_use_para]
    verificado: "522.822 linhas; 522.803 distintos da chave; 2020 tem 31.832 linhas, todas com o par simétrico; 4 pares id_1 = id_2 (todos 'NA', 1991) — medido 2026-10-27"
  uf:
    ultima_data: "2020"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um par ordenado de UFs vizinhas (sigla_uf_1, sigla_uf_2) num ano"
    chave: "ano, sigla_uf_1, sigla_uf_2 (1.104 linhas = 1.104 distintos, medido)"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "2000–2020 (11 anos: 2000, 2001, 2010, 2013–2020)"}
    territorio: {nivel: uf, colunas: {sigla_uf_1: "UF de origem", sigla_uf_2: "UF vizinha"}}
    filtros_tipicos: ["ano = '2020' (VARCHAR, não número)"]
    use_para: "adjacência entre estados."
    nao_use_para: "adjacência municipal (use municipio). Cada par aparece nas duas direções."
    rascunho: [use_para, nao_use_para]
    verificado: "1.104 linhas, 1.104 distintos da chave; 0 pares UF consigo mesma — medido 2026-10-27"
