# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_bcb_scrdata
tabelas:
  dados:
    ultima_data: "2026-07-31"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma célula agregada da carteira de crédito do SCR × mês (data_base) × UF × segmento da instituição × tipo de cliente (PF/PJ) × CNAE ou ocupação × porte × modalidade × submodalidade × origem × indexador; nunca é um contrato nem um município"
    chave: "(data_base, uf, segmento, cliente, cnae_ocupacao, porte, modalidade, submodalidade, origem, indexador): 310.080 linhas = 310.080 combinações distintas em data_base = 2026-07-31. numero_de_operacoes não entra na chave."
    tempo: {natureza: soma_de_retratos, coluna: data_base, cobertura: "2012-07-31–2026-07-31"}
    territorio: {nivel: uf, colunas: {uf: "sigla da UF do tomador (28 valores distintos no perfil, um a mais que as 27 UFs: conferir antes de juntar com a tabela uf)"}}
    medidas:
      - {coluna: carteira_ativa, o_que: "saldo da carteira de crédito (a vencer + vencida) ao fim do mês", unidade: "R$", soma: sim}
      - {coluna: carteira_a_vencer, o_que: "parte a vencer da carteira; é a soma das 6 faixas a_vencer_*", unidade: "R$", soma: sim}
      - {coluna: carteira_vencida, o_que: "parte vencida; é vencido_de_15_ate_90_dias + vencido_acima_de_90_dias", unidade: "R$", soma: sim}
      - {coluna: vencido_acima_de_90_dias, o_que: "parcela vencida há mais de 90 dias", unidade: "R$", soma: sim}
      - {coluna: carteira_inadimplencia, o_que: "carteira de contratos inadimplentes (atraso > 90 dias): NÃO é igual a vencido_acima_de_90_dias, porque inclui o saldo a vencer desses contratos", unidade: "R$", soma: sim}
      - {coluna: ativo_problematico, o_que: "carteira classificada como ativo problemático (conceito do BCB, mais amplo que a inadimplência); definição exata não documentada", unidade: "R$", soma: sim}
      - {coluna: numero_de_operacoes, o_que: "número de operações da célula, mas guardado como texto e com -1 em 27% das linhas (82.378 de 310.080 no mês medido; provável sigilo, significado não documentado)", unidade: "contratos", soma: nao}
    filtros_tipicos:
      - "data_base = '2026-07-31' (ou outro fim de mês): a tabela é retrato mensal do estoque; somar vários meses de carteira_ativa não tem sentido"
      - "cliente = 'PJ' ou 'PF': porte e cnae_ocupacao mudam de significado conforme o cliente (PF: faixa de salário mínimo e ocupação; PJ: Micro/Pequeno/Médio/Grande e CNAE)"
      - "modalidade = 'Financiamentos rurais  (ex-financiamentos rurais e agroindustriais)' (com DOIS espaços após 'rurais') para crédito rural; R$ 841,1 bi em 2026-07-31"
      - "porte = 'Indisponível' aparece em PF e PJ (14.334 e 20.265 linhas no mês medido)"
    use_para: "estoque e inadimplência do crédito do SCR por UF, mês, tipo de cliente, modalidade e atividade, em série mensal desde 2012-07."
    nao_use_para: "análise por município, por instituição ou por contrato (a tabela só chega à UF); nem fluxo de concessão (é estoque)."
    rascunho: [use_para, nao_use_para, ativo_problematico, numero_de_operacoes]
    verificado: "43.061.984 linhas, 169 meses; em 2026-07-31: 310.080 linhas, chave de 10 colunas única; carteira_ativa total R$ 7.573,9 bi (PF 4.665,9; PJ 2.908,1); carteira_vencida 264,7 bi; vencido_acima_de_90_dias 188,4 bi; carteira_inadimplencia 359,1 bi; ativo_problematico 633,6 bi; identidades ativa = a_vencer + vencida, a_vencer = soma das 6 faixas e vencida = 15–90 + >90 valeram em 0 linhas divergentes; carteira_inadimplencia diverge de vencido_acima_de_90_dias em 88.847 linhas — medido 2026-10-27"
