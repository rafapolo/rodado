# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: world_iea_timss
tabelas:
  student_achievement_grade_4:
    grao: "um aluno do 4º ano (grade_id 4, ou 5 em alguns países) que fez o TIMSS 2023, com notas, pesos amostrais e réplicas jackknife"
    chave: "(country_id, school_id, class_id, student_id) (395961 linhas = 395961 distintos); student_id sozinho NÃO é único (93352 distintos)"
    tempo: {natureza: sem_tempo, coluna: year, cobertura: "2023 em todas as linhas"}
    territorio: {nivel: outro, colunas: {country_id: "código numérico do país ou entidade em texto (Brasil = '76', sem zero à esquerda); inclui entidades subnacionais, 71 valores", country_m49: "código M49 do país; NULL para entidades subnacionais (ver gotcha subnacional_sem_pais)"}}
    medidas:
      - {coluna: "asmmat01..asmmat05", o_que: "5 valores plausíveis da nota de matemática do aluno (escala TIMSS, de 5 a ~906); nunca nulos", unidade: "pontos da escala TIMSS", soma: nao}
      - {coluna: "asmnum01.., asmgeo.., asmdat.. (domínios de conteúdo), asmkno.., asmapp.., asmrea.. (domínios cognitivos), asssci.. (ciências) e outros", o_que: "valores plausíveis por subescala; o prefixo asm = matemática e ass = ciências é inferência pelos nomes, sem entrada no dicionário; asmnum é nulo em 5,59% das linhas", unidade: "pontos da escala TIMSS", soma: nao}
      - {coluna: "totwgt (houwgt e senwgt são variantes)", o_que: "peso amostral do aluno", unidade: "peso", soma: sim}
    filtros_tipicos:
      - "Brasil: country_id = '76' (22130 alunos, todos com country_m49 = '76')"
      - "ranquear países: exclua country_m49 IS NULL (gotcha subnacional_sem_pais); média de nota deve usar o peso totwgt: no Brasil a média simples de asmmat01 é 376,8 e a ponderada por totwgt é 400,5"
      - "sexo: sex_students = '1' (menina, 196334) ou '2' (menino, 199418); NULL em 209 (gotcha sexo_nome_diferente: aqui se chama sex_students)"
      - "grade_id = '4' (369690) ou '5' (26271, países que testam outra série)"
    use_para: "comparar o desempenho em matemática e ciências do 4º ano entre países, sexo e escolas, com o Brasil incluído"
    nao_use_para: "média de uma única coluna asmmat sem os cinco valores plausíveis e os pesos (erro-padrão); nome e dados de contexto do aluno (estão em student_context_grade_4)"
    rascunho: [use_para, nao_use_para, "prefixos asm/ass", "sentido dos pesos houwgt e senwgt"]
    verificado: "395961 linhas = 395961 (country_id, school_id, class_id, student_id); 93352 student_id distintos; Brasil 22130; média Brasil asmmat01 simples 376,8 e ponderada 400,5 — medido 2026-10-27"
  student_achievement_grade_8:
    grao: "um aluno do 8º ano (grade_id 8, ou 9) que fez o TIMSS 2023, com notas, pesos e réplicas jackknife"
    chave: "(country_id, school_id, class_id, student_id) (323920 linhas = 323920 distintos); student_id sozinho NÃO é único (104508 distintos)"
    tempo: {natureza: sem_tempo, coluna: year, cobertura: "2023 em todas as linhas"}
    territorio: {nivel: outro, colunas: {country_id: "código do país ou entidade em texto (Brasil = '76'), 47 valores", country_m49: "NULL em 8,23% das linhas (26658 alunos de entidades subnacionais, ex. country_id '7842', '7841', '7843')"}}
    medidas:
      - {coluna: "bsmmat01..bsmmat05", o_que: "5 valores plausíveis da nota de matemática (de 5 a ~939); nunca nulos", unidade: "pontos da escala TIMSS", soma: nao}
      - {coluna: "bsmnum01.., bss*.. e demais subescalas", o_que: "valores plausíveis por subescala (bsm = matemática, bss = ciências, inferido pelos nomes); bsmnum nulo em 11,6%", unidade: "pontos da escala TIMSS", soma: nao}
      - {coluna: "totwgt (houwgt e senwgt são variantes)", o_que: "peso amostral do aluno", unidade: "peso", soma: sim}
    filtros_tipicos:
      - "Brasil: country_id = '76' (22770 alunos)"
      - "ranquear países: country_m49 IS NOT NULL (gotcha subnacional_sem_pais)"
      - "sexo: student_sex = '1' (menina, 160462) ou '2' (menino, 163092), NULL em 366; aqui a coluna se chama student_sex"
      - "grade_id = '8' (295948) ou '9' (27972)"
    use_para: "comparar o desempenho em matemática e ciências do 8º ano entre países, sexo e escolas, com o Brasil incluído"
    nao_use_para: "média de um único valor plausível sem pesos; fatores de contexto do aluno (student_context_grade_8)"
    rascunho: [use_para, nao_use_para, "prefixos bsm/bss"]
    verificado: "323920 linhas = 323920 (country_id, school_id, class_id, student_id); 104508 student_id distintos; Brasil 22770; country_m49 nulo = 26658 alunos nas entidades 7841, 7842, 7843 (top) — medido 2026-10-27"
  student_context_grade_4:
    grao: "um aluno do 4º ano, com as respostas ao questionário do aluno (colunas asbg*) e sexo/idade"
    chave: "(country_id, school_id, class_id, student_id) (395961 linhas = 395961 distintos); mesmo conjunto de alunos de student_achievement_grade_4"
    tempo: {natureza: sem_tempo, coluna: year, cobertura: "2023"}
    territorio: {nivel: outro, colunas: {country_id: "código do país em texto (Brasil = '76')", country_m49: "NULL para entidades subnacionais"}}
    filtros_tipicos: ["respostas são códigos em texto ('1','2','3'...) cujo significado está em dictionary (table_id = 'student_context_grade_4', column_name = <coluna>, key = <código>)", "student_sex = '1' menina (196334), '2' menino (199418)"]
    use_para: "contexto do aluno (casa, escola, atitudes), juntando a student_achievement_grade_4 pelas quatro colunas da chave"
    nao_use_para: "notas: estão em student_achievement_grade_4"
    rascunho: [use_para, nao_use_para]
    verificado: "395961 linhas = 395961 chaves — medido 2026-10-27"
  student_context_grade_8:
    grao: "um aluno do 8º ano, com as respostas ao questionário do aluno (colunas bsbg*) e sexo/idade"
    chave: "(country_id, school_id, class_id, student_id) (323920 linhas = 323920 distintos)"
    tempo: {natureza: sem_tempo, coluna: year, cobertura: "2023"}
    territorio: {nivel: outro, colunas: {country_id: "código do país em texto (Brasil = '76')", country_m49: "NULL para entidades subnacionais"}}
    filtros_tipicos: ["respostas em código textual: consulte dictionary por (table_id, column_name, key)", "student_sex = '1' menina (160462), '2' menino (163092)"]
    use_para: "contexto do aluno do 8º ano, junto a student_achievement_grade_8 pela chave"
    nao_use_para: "notas: estão em student_achievement_grade_8"
    rascunho: [use_para, nao_use_para]
    verificado: "323920 linhas = 323920 chaves — medido 2026-10-27"
  home_context_grade_4:
    grao: "um aluno do 4º ano, com as respostas do questionário dos responsáveis (colunas asbh*)"
    chave: "(country_id, school_id, class_id, student_id) (395961 linhas = 395961 distintos)"
    tempo: {natureza: sem_tempo, coluna: year, cobertura: "2023"}
    territorio: {nivel: outro, colunas: {country_id: "código do país em texto (Brasil = '76')", country_m49: "NULL em 9,31% (entidades subnacionais)"}}
    filtros_tipicos: ["muitas respostas são nulas (cerca de 30% em asbh01a..e): quem não respondeu o questionário fica NULL; códigos em dictionary"]
    use_para: "contexto familiar (respostas dos responsáveis) do aluno do 4º ano"
    nao_use_para: "análise com todos os alunos: ~30% não têm resposta dos responsáveis"
    rascunho: [use_para, nao_use_para, "significado do nulo = não respondeu"]
    verificado: "395961 linhas = 395961 chaves; asbh01a nulo em 29,5% — medido 2026-10-27"
  school_context_grade_4:
    grao: "uma escola de 4º ano, com as respostas do diretor (colunas acbg*)"
    chave: "(country_id, school_id) (12955 linhas = 12955 distintos); school_id sozinho se repete entre países"
    tempo: {natureza: sem_tempo, coluna: year, cobertura: "2023"}
    territorio: {nivel: outro, colunas: {country_id: "código do país em texto (Brasil = '76')", country_m49: "NULL em 6,14%"}}
    filtros_tipicos: ["grade_id = '4' (12148) ou '5' (807)", "códigos de resposta em dictionary"]
    use_para: "características das escolas (dirigentes) do 4º ano, junto aos alunos por (country_id, school_id)"
    nao_use_para: "número de alunos ou notas da escola: precisa agregar student_achievement_grade_4"
    rascunho: [use_para, nao_use_para]
    verificado: "12955 linhas = 12955 (country_id, school_id) — medido 2026-10-27"
  school_context_grade_8:
    grao: "uma escola de 8º ano, com as respostas do diretor (colunas bcbg*)"
    chave: "(country_id, school_id) (9406 linhas = 9406 distintos)"
    tempo: {natureza: sem_tempo, coluna: year, cobertura: "2023"}
    territorio: {nivel: outro, colunas: {country_id: "código do país em texto (Brasil = '76')", country_m49: "NULL em 6,59%"}}
    filtros_tipicos: ["grade_id = '8' (8779) ou '9' (627)", "códigos de resposta em dictionary"]
    use_para: "características das escolas do 8º ano, junto aos alunos por (country_id, school_id)"
    nao_use_para: "número de alunos ou notas da escola: precisa agregar student_achievement_grade_8"
    rascunho: [use_para, nao_use_para]
    verificado: "9406 linhas = 9406 (country_id, school_id) — medido 2026-10-27"
  teacher_context_grade_4:
    grao: "um vínculo professor × turma do 4º ano (tealin_id), com as respostas do questionário do professor (atbg*)"
    chave: "(country_id, school_id, tealin_id) (27100 linhas = 27100 distintos); teacher_id sozinho se repete (um professor tem várias turmas/vínculos)"
    tempo: {natureza: sem_tempo, coluna: year, cobertura: "2023"}
    territorio: {nivel: outro, colunas: {country_id: "código do país em texto (Brasil = '76')", country_m49: "NULL em 7,49%"}}
    filtros_tipicos: ["subject_id = '1' matemática (7538), '2' ciências (7253), '3' matemática e ciências (12309), conforme dictionary; course = '1' matemática, '6' ciências integradas, '7' matemática e ciências integradas", "códigos de resposta em dictionary"]
    use_para: "perfil e práticas dos professores do 4º ano, ligados às turmas pelo vínculo tealin_id"
    nao_use_para: "contar professores com count(*): a linha é o vínculo professor × turma"
    rascunho: [use_para, nao_use_para, "como tealin_id liga à turma (não medi a junção)"]
    verificado: "27100 linhas = 27100 (country_id, school_id, tealin_id); subject_id e course conferidos no dictionary — medido 2026-10-27"
  teacher_mathematics_grade_8:
    grao: "um vínculo professor de matemática × turma do 8º ano (tealin_id), com as respostas do questionário (colunas btbg* e de matemática)"
    chave: "(country_id, school_id, tealin_id) (15094 linhas = 15094 distintos); (country_id, school_id, teach_id, tealin_id) também único"
    tempo: {natureza: sem_tempo, coluna: year, cobertura: "2023 (year aqui é VARCHAR, nas outras tabelas é BIGINT)"}
    territorio: {nivel: outro, colunas: {country_id: "código do país em texto (Brasil = '76')", country_m49: "NULL em 8,14%"}}
    filtros_tipicos: ["course = 1 e subject_id = '1' (matemática) em todas as 15094 linhas: o filtro não separa nada", "teach_id, link_id e tealin_id são BIGINT aqui, mas VARCHAR em teacher_science_grade_8 (teach_id): cuidado em junções"]
    use_para: "perfil dos professores de matemática do 8º ano"
    nao_use_para: "contar professores com count(*): a linha é o vínculo professor × turma"
    rascunho: [use_para, nao_use_para]
    verificado: "15094 linhas = 15094 (country_id, school_id, tealin_id) — medido 2026-10-27"
  teacher_science_grade_8:
    grao: "mesmo grão de teacher_mathematics_grade_8, para professores de ciências do 8º ano: um vínculo professor × turma (tealin_id)"
    chave: "(country_id, school_id, tealin_id) (24889 linhas = 24889 distintos)"
    tempo: {natureza: sem_tempo, coluna: year, cobertura: "2023 (year em VARCHAR)"}
    territorio: {nivel: outro, colunas: {country_id: "código do país em texto (Brasil = '76')", country_m49: "NULL em 5,37%"}}
    filtros_tipicos: ["subject_id = '2' (ciências) em todas as 24889 linhas; course tem 13 valores (de 2 a 14), significado em dictionary (não consultado)"]
    use_para: "perfil dos professores de ciências do 8º ano (biologia, química, física, etc. em course)"
    nao_use_para: "contar professores com count(*): a linha é o vínculo professor × turma"
    rascunho: [use_para, nao_use_para, "significado dos valores de course"]
    verificado: "24889 linhas = 24889 (country_id, school_id, tealin_id) — medido 2026-10-27"
  dictionary:
    grao: "uma opção de resposta de uma coluna de uma tabela do dataset: (table_id, column_name, key) → value"
    chave: "(table_id, column_name, key) (4428 linhas = 4428 distintos)"
    tempo: {natureza: sem_tempo}
    territorio: {nivel: nenhum, colunas: {}}
    use_para: "traduzir os códigos das tabelas (ex.: sex_students 1 = Girl, 2 = Boy; grade_id) para texto; não traz as colunas de nota nem country_id"
    nao_use_para: "descobrir o nome dos países: country_id não consta no dicionário"
    rascunho: [nao_use_para]
    verificado: "4428 linhas = 4428 (table_id, column_name, key); consultas sobre country_id, country_m49 e asmmat01 não retornaram entradas — medido 2026-10-27"
