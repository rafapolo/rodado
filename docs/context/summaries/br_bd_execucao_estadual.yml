# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_bd_execucao_estadual
# Cobertura por UF varia muito entre tabelas (medida em 2026-10-27): despesa = CE ES MG PB PE RS SC;
# despesa_anual = só SP; despesa_mensal = só BA; despesa_dotacao = só RJ; empenho_credor = só BA;
# contrato = ES MG RO RS SC; licitacao = BA ES MG; liquidacao = CE PB SC; pagamento = CE PB PE SC;
# nota_fiscal, contrato_fiscal, contrato_item, plano_contratacao_item, fornecedor_sancionado = só MG;
# relacionamentos = BA ES MG. Nunca diga "total dos estados" sem listar as UFs que a tabela cobre.
tabelas:
  dicionario:
    grao: "um código de coluna da tabela despesa (acao, programa, funcao, elemento_despesa, fonte_recurso, etc.) de ES ou MG, com seu texto (chave, valor) e ano de cobertura"
    chave: "nenhuma: não medida (10.375 linhas, id_tabela é sempre 'despesa', só sigla_uf ES e MG)"
    tempo: {natureza: sem_tempo, coluna: cobertura_temporal, cobertura: "não medida (visto 2009 em linhas de ES)"}
    territorio: {nivel: uf, colunas: {sigla_uf: "ES ou MG"}}
    filtros_tipicos: ["id_tabela = 'despesa' (único valor), filtre também por sigla_uf e nome_coluna; a mesma chave pode ter vários valores de anos diferentes"]
    use_para: "traduzir códigos de despesa (ES e MG) em texto"
    nao_use_para: "outras UFs ou outras tabelas: só cobre despesa de ES e MG"
    rascunho: [use_para, nao_use_para]
    verificado: "10.375 linhas, 1 id_tabela, 2 UFs (ES, MG); colunas por UF contadas — medido 2026-10-27"
  despesa:
    grao: "um lançamento de despesa por estado: em ES e MG, um evento (tipo_documento NE empenho, NL liquidação, OB ordem bancária) com o valor no campo correspondente; em CE, PB e SC, uma linha por empenho; em PE, uma linha por empenho × elemento/item, muitas sem data nem mês; RS quase uma linha por empenho"
    chave: "nenhuma: não é única e varia por UF. Em 2026, id_empenho_bd tem 1.793.707 distintos em 4.862.768 linhas (ES 16.393 empenhos em 963.759 linhas; MG 567.662 em 2.562.213; PE 63.488 em 190.415; CE, PB e SC têm 1 linha por empenho, RS 676.382 em 676.599)"
    tempo: {natureza: serie_mensal, coluna: ano, cobertura: "2002–2026 (MG 2002, CE 2006, PE 2008, ES 2009, SC 2011, RS 2012, PB 2015)"}
    territorio: {nivel: uf, colunas: {sigla_uf: "CE, ES, MG, PB, PE, RS, SC", id_unidade_gestora: "unidade gestora, codificação própria de cada UF", orgao: "órgão, codificação própria de cada UF"}}
    medidas:
      - {coluna: valor_empenhado, o_que: "valor empenhado no lançamento", unidade: "R$", soma: sim}
      - {coluna: valor_liquidado, o_que: "valor liquidado no lançamento", unidade: "R$", soma: sim}
      - {coluna: valor_pago, o_que: "valor pago no lançamento", unidade: "R$", soma: sim}
    filtros_tipicos: ["ano = 2026 (ou outro) sempre: 125.379.049 linhas no total, 4.862.768 em 2026", "sigla_uf = 'PE' + valor_pago < 1e12 por causa do gotcha pe_2009_quatrilhoes", "mes pode ser NULL (PE) ou 0/13: veja o gotcha mes_nulo_e_mes_0_13", "tipo_documento: em ES 'NE','NL','OB' (um por tipo de evento); em PE 'NORMAL' e outros; valores variam por UF, medir antes de filtrar"]
    use_para: "gasto estadual no nível de empenho/credor/classificação funcional, para as 7 UFs cobertas"
    nao_use_para: "total estadual de uma UF fora das 7 cobertas; série mensal de PE (mes é NULL); comparar valor_empenhado entre UFs sem ver que o grão muda"
    rascunho: [nao_use_para]
    verificado: "125.379.049 linhas no total e 4.862.768 em ano = 2026; id_empenho_bd distintos por UF em 2026 e o formato de linha de ES e PE inspecionados — medido 2026-10-27. Gotchas: pe_2009_quatrilhoes, mes_nulo_e_mes_0_13."
  despesa_anual:
    grao: "um ano × órgão × unidade gestora × fonte × natureza da despesa × credor, do estado de SP"
    chave: "nenhuma confirmada: (ano, orgao, id_unidade_gestora, fonte_recurso, natureza_despesa, documento_credor) deixou 4.817.713 linhas em 4.816.242 combinações com nome_credor incluído; ~1.471 linhas repetem"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "2010–2026"}
    territorio: {nivel: uf, colunas: {sigla_uf: "sempre 'SP'", id_unidade_gestora: "unidade gestora de SP", orgao: "órgão de SP"}}
    medidas:
      - {coluna: valor_empenhado, o_que: "empenhado no ano", unidade: "R$", soma: sim}
      - {coluna: valor_liquidado, o_que: "liquidado no ano", unidade: "R$", soma: sim}
      - {coluna: valor_pago, o_que: "pago no ano da despesa do exercício", unidade: "R$", soma: sim}
      - {coluna: valor_pago_restos, o_que: "pago no ano referente a restos a pagar (separado de valor_pago)", unidade: "R$", soma: sim}
    filtros_tipicos: ["ano = 2025 para o último ano fechado (2025: valor_empenhado ≈ R$ 385 bi, valor_pago ≈ R$ 349 bi, medidos); 2026 é parcial (≈ R$ 293 bi empenhado)", "tipo_documento_credor IN ('CNPJ','CPF','UNIDADE_GESTORA','OUTRO'): UNIDADE_GESTORA e OUTRO não são fornecedores (124.370 e 42.620 linhas)"]
    use_para: "gasto de SP por órgão, fonte, natureza e credor"
    nao_use_para: "qualquer outra UF: só tem SP"
    rascunho: [nao_use_para]
    verificado: "4.817.713 linhas; só SP; ano 2010–2026; soma por ano 2022–2026 medida; tipo_documento_credor contado — medido 2026-10-27"
  despesa_dotacao:
    grao: "um retrato de fim de ano (acumulado do exercício) por unidade gestora × unidade orçamentária × programa × ação × elemento × subelemento × fonte × gestão, do estado do RJ"
    chave: "nenhuma confirmada: a combinação (ano, mes, id_unidade_gestora, unidade_orcamentaria, programa, acao, elemento_despesa, subelemento_despesa, fonte_recurso, gestao, funcao, subfuncao) deu 176.470 distintos em 176.525 linhas; 55 linhas repetem"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "2016–2025; cada ano tem um só mes (12), exceto 2025 com mes = 7"}
    territorio: {nivel: uf, colunas: {sigla_uf: "sempre 'RJ'", id_unidade_gestora: "unidade gestora do RJ"}}
    medidas:
      - {coluna: valor_dotacao_inicial, o_que: "dotação inicial da LOA", unidade: "R$", soma: sim}
      - {coluna: valor_dotacao_atual, o_que: "dotação atualizada (pode ser negativa)", unidade: "R$", soma: sim}
      - {coluna: valor_empenhado, o_que: "empenhado acumulado até o mes do retrato", unidade: "R$", soma: sim}
      - {coluna: valor_pago, o_que: "pago acumulado até o mes do retrato", unidade: "R$", soma: sim}
    filtros_tipicos: ["ano e mes juntos: 2025 só tem mes = 7 (retrato de julho, valor_empenhado ≈ R$ 53 bi contra ≈ R$ 102–107 bi em dezembro de 2023 e 2024), por isso 2025 não é comparável com os outros anos"]
    use_para: "dotação e execução anual do RJ por programa/ação/elemento"
    nao_use_para: "série mensal e outras UFs; comparar 2025 com anos fechados"
    rascunho: [use_para]
    verificado: "176.525 linhas; só RJ; mes = 12 em 2016–2024 e 7 em 2025; sums de 2023–2025 medidas — medido 2026-10-27"
  despesa_mensal:
    grao: "um mês × dotação orçamentária (unidade, ação, elemento, fonte, destinação, região) do estado da BA"
    chave: "nenhuma confirmada: (ano, mes, dotacao_orcamentaria, id_unidade_gestora, destinacao_recurso, regiao, unidade_orcamentaria) deu 2.131.360 distintos em 2.226.760 linhas; ~95.400 linhas repetem"
    tempo: {natureza: serie_mensal, coluna: ano e mes, cobertura: "2013–2026"}
    territorio: {nivel: uf, colunas: {sigla_uf: "sempre 'BA'", regiao: "código da região de planejamento da BA (ex.: '9900' = não regionalizável, dedução do código; significado não documentado)"}}
    medidas:
      - {coluna: valor_empenhado, o_que: "empenhado no mês (em 2025 ≈ R$ 5–10 bi por mês, estável: não acumulado)", unidade: "R$", soma: sim}
      - {coluna: valor_liquidado, o_que: "liquidado no mês", unidade: "R$", soma: sim}
      - {coluna: valor_pago, o_que: "pago no mês", unidade: "R$", soma: sim}
      - {coluna: valor_dotacao_atual, o_que: "dotação atualizada: é saldo, não fluxo", unidade: "R$", soma: nao}
    filtros_tipicos: ["ano e mes: um mês por vez para valores de fluxo; poder IN ('Executivo','Judiciário','Ministério Público','Legislativo','Defensoria Pública')"]
    use_para: "série mensal de execução da BA"
    nao_use_para: "outras UFs; somar valor_dotacao_inicial/atual ao longo dos meses (repete a dotação a cada mês)"
    rascunho: [medidas, filtros_tipicos]
    verificado: "2.226.760 linhas; só BA; 2013–2026; soma mensal de 2025 medida (jan R$ 5,3 bi, dez R$ 9,9 bi empenhado) — medido 2026-10-27"
