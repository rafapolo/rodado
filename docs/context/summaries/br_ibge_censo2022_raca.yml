# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ibge_censo2022_raca
tabelas:
  fecundidade_idade:
    grao: "um município × cor/raça × grupo de idade da mulher × variável (mulheres, ou filhos nascidos vivos), Censo 2022"
    chave: "(id_municipio, cor_raca, categoria_principal, variavel) — 1.247.904 linhas = 1.247.904 chaves distintas; 5.571 municípios"
    tempo: {natureza: retrato_atual, coluna: ano, cobertura: "2022–2022 (BIGINT)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos (texto)", municipio: "nome com UF: 'São Paulo (SP)'"}}
    medidas:
      - {coluna: valor, o_que: "contagem de mulheres OU de filhos, conforme variavel (nulo em 42%: significado do nulo não documentado)", unidade: "pessoas / filhos", soma: sim}
    filtros_tipicos: ["variavel = 'Mulheres de 12 anos ou mais de idade' ou 'Filhos tidos nascidos vivos pelas mulheres de 12 anos ou mais de idade': sempre filtre uma, senão soma mulheres com filhos", "cor_raca = 'Total' (id 58898) é o agregado; as outras 6 (Branca, Preta, Amarela, Parda, Indígena, Sem declaração) são as categorias (soma não conferida)", "categoria_principal = 'Total' é o agregado de idade; '15 a 19 anos' SOBREPÕE '15 a 17 anos' e '18 ou 19 anos' (hierarquia): para somar idades use 12 a 14, 15 a 19, 20 a 24 ... 70 anos ou mais"]
    use_para: "fecundidade (filhos por mulher) por cor/raça e faixa etária no município: filhos / mulheres."
    nao_use_para: "somar categoria_principal inteira ou cor_raca inteira sem tirar os 'Total' (conta em dobro)."
    rascunho: [use_para, nao_use_para]
    verificado: "1.247.904 linhas, 1.247.904 chaves, 5.571 municípios; Brasil (cor Total, idade Total): mulheres 88.912.634, filhos 150.980.668 (soma dos municípios) — medido 2026-10-27"
  instrucao:
    grao: "um município × cor/raça × nível de instrução de pessoas de 18 anos ou mais, Censo 2022"
    chave: "(id_municipio, cor_raca, categoria_principal) — 167.130 linhas = 167.130 chaves distintas; 5.571 municípios"
    tempo: {natureza: retrato_atual, coluna: ano, cobertura: "2022–2022 (BIGINT)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos (texto)", municipio: "nome com UF"}}
    medidas:
      - {coluna: valor, o_que: "pessoas de 18 anos ou mais (variavel é constante; nulo em 19%: significado do nulo não documentado)", unidade: "pessoas", soma: sim}
    filtros_tipicos: ["cor_raca IN ('Branca','Preta','Amarela','Parda','Indígena') ou 'Total' (aqui não há 'Sem declaração'): 'Total' é agregado", "categoria_principal = 'Total' é agregado de instrução; as 4 faixas (Sem instrução e fundamental incompleto, Fundamental completo e médio incompleto, Médio completo e superior incompleto, Superior completo) somam 154.309.446 contra 154.309.509 do Total (diferença de 63 por nulos/arredondamento)"]
    use_para: "escolaridade por cor/raça no município."
    nao_use_para: "população total de cor/raça: as 5 cores somam 154.279.097 contra 154.309.509 do Total (diferença de nulos)."
    rascunho: [use_para, nao_use_para]
    verificado: "167.130 linhas, 167.130 chaves, 5.571 municípios; soma Brasil cor Total/instrução Total = 154.309.509; soma das 5 cores = 154.279.097 — medido 2026-10-27"
