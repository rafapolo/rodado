# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_mte_listasuja
tabelas:
  empregadores:
    ultima_data: "2026-10-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um empregador × estabelecimento fiscalizado da Lista Suja (Cadastro de Empregadores) na última coleta"
    chave: "id (1..508, só sequência da coleta, não estável entre coletas); chave natural (cpf_cnpj, estabelecimento, ano_acao_fiscal) NÃO é única: 506 distintos em 508 linhas (2 pares repetidos) e 498 cpf_cnpj distintos"
    tempo: {natureza: retrato_atual, coluna: data_coleta, cobertura: "2026-10-09 (única coleta); ano_acao_fiscal 2020–2026; data_inclusao 2025-04-09–2026-10-06"}
    territorio:
      nivel: uf
      colunas:
        sigla_uf: "UF do estabelecimento fiscalizado (28 valores; 0,59% nulo)"
        estabelecimento: "texto livre 'FAZENDA X, ZONA RURAL, BARROLÂNDIA/TO'; sem código de município (ver empregadores_municipio)"
    medidas:
      - {coluna: trabalhadores_envolvidos, o_que: "trabalhadores resgatados/envolvidos na ação fiscal", unidade: "pessoas (soma 3.989 nas 508 linhas)", soma: sim}
      - {expressao: "count(DISTINCT cpf_cnpj)", o_que: "empregadores distintos", unidade: "empregadores", soma: nao}
    filtros_tipicos:
      - "tipo_documento = 'CNPJ' (167 linhas) | 'CPF' (341 linhas) — CPF é pessoa física, inclui serviço doméstico"
      - "reincluido = true (12 linhas) | false (496)"
      - "cnae no formato '0111-3/01' (cnae_subclasse '0111301'); divisão = left(cnae, 2)"
      - "ano_acao_fiscal = 2025 (202 linhas), 2024 (192), 2023 (63)"
    use_para: "quem está hoje na Lista Suja do trabalho escravo, por UF, ano da ação fiscal e atividade"
    nao_use_para: "série temporal da lista (é um retrato; use empregadores_historico) ou local por município (use empregadores_municipio)"
    rascunho: [use_para, nao_use_para]
    verificado: "508 linhas = 508 id distintos; 506 distintos de (cpf_cnpj,estabelecimento,ano_acao_fiscal); 498 cpf_cnpj distintos; soma de trabalhadores_envolvidos 3.989; coleta única 2026-10-09 — medido 2026-10-27"
  empregadores_historico:
    ultima_data: "2026-10-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma linha de empregadores por coleta: soma dos retratos coletados (hoje dois), o mesmo empregador aparece uma vez por coleta"
    chave: "(data_coleta, id) — 1.086 linhas = 1.086 distintos; chave natural (data_coleta, cpf_cnpj, estabelecimento, ano_acao_fiscal) tem 1.083 distintos (3 repetem)"
    tempo: {natureza: soma_de_retratos, coluna: data_coleta, cobertura: "2026-09-25 (578 linhas) e 2026-10-09 (508 linhas)"}
    territorio:
      nivel: uf
      colunas:
        sigla_uf: "UF do estabelecimento"
        estabelecimento: "texto livre com município; sem código"
    medidas:
      - {coluna: trabalhadores_envolvidos, o_que: "trabalhadores na ação fiscal", unidade: "pessoas", soma: nao}
    filtros_tipicos:
      - "data_coleta = '2026-10-09' para ficar com o retrato atual (508 linhas)"
      - "conte empregadores com count(DISTINCT cpf_cnpj) (647 distintos); somar trabalhadores_envolvidos sem filtrar a coleta dobra (ver gotcha historico_sao_retratos)"
    use_para: "ver o que mudou entre coletas (entradas e saídas da lista)"
    nao_use_para: "histórico desde 2003: cobre só duas coletas (ver gotcha historico_sao_retratos)"
    rascunho: [use_para, nao_use_para]
    verificado: "1.086 linhas; 578 em 2026-09-25 e 508 em 2026-10-09; (data_coleta,id) único; 647 cpf_cnpj distintos — medido 2026-10-27"
  empregadores_municipio:
    ultima_data: "2026-10-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um caso distinto (cpf_cnpj × estabelecimento × ano_acao_fiscal) com o município inferido do texto do estabelecimento"
    chave: "(cpf_cnpj, estabelecimento, ano_acao_fiscal) — 660 linhas = 660 distintos"
    tempo: {natureza: soma_de_retratos, coluna: data_coleta, cobertura: "2026-09-25 e 2026-10-09 (cada caso aparece uma vez, com a coleta em que foi visto)"}
    territorio:
      nivel: municipio
      colunas:
        id_municipio: "município inferido do texto (IBGE, 7 dígitos); nulo em 35 casos, quase todos 'RESIDÊNCIA DE …' (serviço doméstico)"
        uf: "UF do município inferido (pode ter valor mesmo sem id_municipio)"
        sigla_uf: "UF registrada no cadastro"
        id_municipio_cnpj: "município da sede pelo CNPJ — não é o local da fiscalização"
        origem_municipio: "como achou o município: 'texto' (611), 'df' (7), nulo (35); há ainda casos por nome parecido e pelo CNPJ (ver gotcha municipio_pelo_texto)"
    medidas:
      - {coluna: trabalhadores_envolvidos, o_que: "trabalhadores na ação fiscal", unidade: "pessoas (soma 5.248 nos 660 casos)", soma: sim}
    filtros_tipicos:
      - "origem_municipio = 'texto' é o casamento mais confiável; IS NULL = sem município"
      - "id_municipio IS NOT NULL para mapear por município"
    use_para: "mapear casos da Lista Suja por município sem repetir empregador entre coletas"
    nao_use_para: "usar id_municipio_cnpj como local do flagrante (diverge em 88 de 216 casos)"
    rascunho: [use_para, nao_use_para, sigla_uf vs uf]
    verificado: "660 linhas = 660 distintos de (cpf_cnpj,estabelecimento,ano_acao_fiscal); 2 coletas; soma de trabalhadores 5.248 — medido 2026-10-27"
  ceac:
    grao: "um empregador do CEAC (cadastro paralelo de empregadores do MTE, com termo de ajustamento de conduta) na versão vigente"
    chave: "id (1..13) — 13 linhas = 13 distintos; 12 cpf_cnpj distintos (um repete)"
    tempo: {natureza: retrato_atual, coluna: versao, cobertura: "versão '2026_0017'; data_coleta 2026-10-09; data_inclusao_ceac 2025-09-24–2026-10-06"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF (9 valores)"}}
    medidas: []
    filtros_tipicos:
      - "tipo_documento = 'CNPJ' | 'CPF'; cnpj_basico é nulo em 38% (os CPFs)"
    use_para: "empregadores hoje no CEAC e termo de ajustamento (termo_ajustamento_conduta)"
    nao_use_para: "somar com a Lista Suja: são cadastros distintos"
    rascunho: [grao (a descrição do CEAC é dedução), use_para, nao_use_para]
    verificado: "13 linhas; 13 id distintos; 12 cpf_cnpj distintos; versao única '2026_0017' — medido 2026-10-27"
  ceac_historico:
    grao: "um empregador do CEAC por versão do cadastro (soma de retratos)"
    chave: "(versao, id) — 49 linhas = 49 distintos; 9 versões, de '2025_0001' a '2026_0017'"
    tempo: {natureza: soma_de_retratos, coluna: versao, cobertura: "2025_0001–2026_0017"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF"}}
    filtros_tipicos:
      - "versao = '2026_0017' reproduz a tabela ceac (13 linhas); versões intermediárias têm 2 a 12 linhas"
    use_para: "evolução do CEAC entre versões"
    nao_use_para: "contar empregadores sem DISTINCT: o mesmo id aparece em várias versões (13 ids em 49 linhas)"
    rascunho: [use_para, nao_use_para]
    verificado: "49 linhas; 49 (versao,id) distintos; 9 versões; 13 ids distintos — medido 2026-10-27"
