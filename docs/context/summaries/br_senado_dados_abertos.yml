# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_senado_dados_abertos
tabelas:
  senador:
    grao: "um senador (cadastro, inclusive de legislaturas passadas)"
    chave: "id_senador (1.567 linhas = 1.567 distintos)"
    tempo: {natureza: sem_tempo}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF de representação (inclui 'GB', 6 senadores do antigo estado da Guanabara)"}}
    filtros_tipicos: ["sexo = 'Masculino' (1.442) ou 'Feminino' (125)", "sigla_partido é nulo em 64,33% das linhas: só vale para senadores atuais, não use como partido histórico"]
    use_para: "ligar id_senador a nome, sexo, UF e partido atual"
    nao_use_para: "partido na época de uma votação (use votacao_parlamentar.sigla_partido ou senador_filiacao)"
    rascunho: [use_para, nao_use_para]
    verificado: "1.567 linhas, 1.567 id_senador distintos — medido 2026-10-27"
  senador_mandato:
    grao: "um mandato de um senador (titular ou suplente), com as duas legislaturas que ele cobre"
    chave: "nenhuma: id_mandato é nulo em 686 de 1.778 linhas (participacao nula nelas); (id_senador, data_inicio_legislatura_1, participacao, sigla_uf) tem 1.777 distintos, 1 linha repete"
    tempo: {natureza: serie_de_periodos, coluna: data_inicio_legislatura_1, cobertura: "1906-05-03–2023-02-01"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF do mandato"}}
    filtros_tipicos: ["participacao = 'Titular' (416), '1º Suplente' (356), '2º Suplente' (320); nulo em 686"]
    use_para: "datas de início e fim das legislaturas de cada mandato"
    rascunho: [use_para]
    verificado: "1.778 linhas; 416 id_mandato distintos — medido 2026-10-27"
  senador_filiacao:
    grao: "uma filiação partidária de um senador"
    chave: "nenhuma: não há id; (id_senador, id_partido, data_filiacao, data_desfiliacao, sigla_partido) tem 2.261 distintos = linhas, mas data_filiacao é nula em 43,56% das linhas"
    tempo: {natureza: serie_de_periodos, coluna: data_filiacao, cobertura: "1980-09-24–2026-09-25"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos: ["data_desfiliacao IS NULL (68,29% das linhas) como 'filiação sem saída registrada'"]
    use_para: "histórico de partidos de cada senador"
    rascunho: [use_para]
    verificado: "2.261 linhas; combinação de 5 colunas com 2.261 distintos — medido 2026-10-27"
  partido:
    grao: "um partido (inclusive extintos)"
    chave: "id_partido (108 linhas = 108 distintos; sigla tem só 86 distintas, então não é única)"
    tempo: {natureza: serie_de_periodos, coluna: data_criacao, cobertura: "1900-01-01–2025-11-04"}
    territorio: {nivel: nenhum, colunas: {}}
    use_para: "traduzir id_partido para sigla e ver criação/extinção"
    nao_use_para: "juntar por sigla: siglas repetem entre partidos"
    rascunho: [use_para]
    verificado: "108 linhas, 108 id_partido, 86 siglas — medido 2026-10-27"
  bloco:
    grao: "um bloco parlamentar"
    chave: "id_bloco (6 linhas = 6 distintos)"
    tempo: {natureza: serie_de_periodos, coluna: data_criacao, cobertura: "2023-02-01–2025-02-18"}
    territorio: {nivel: nenhum, colunas: {}}
    use_para: "nome e criação dos blocos parlamentares"
    rascunho: [use_para]
    verificado: "6 linhas, 6 distintos; data_extincao 100% nula — medido 2026-10-27"
  mesa:
    grao: "um cargo da Mesa Diretora do Senado (retrato atual)"
    chave: "(id_senador, cargo) (11 linhas = 11 distintos)"
    tempo: {natureza: retrato_atual}
    territorio: {nivel: nenhum, colunas: {}}
    use_para: "quem ocupa os 11 cargos da Mesa agora"
    rascunho: [use_para]
    verificado: "11 linhas — medido 2026-10-27"
  comissao:
    grao: "um colegiado (comissão, grupo, frente, conselho etc., do Senado e do Congresso)"
    chave: "id_comissao (221 linhas = 221 distintos)"
    tempo: {natureza: serie_de_periodos, coluna: data_inicio, cobertura: "1900-01-01–2026-08-25"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos: ["sigla_casa = 'SF' (78) ou 'CN' (143)", "publica = 'S' (210) ou 'N' (11)"]
    use_para: "traduzir id_comissao para sigla, nome e tipo de colegiado"
    rascunho: [use_para]
    verificado: "221 linhas, 221 id_comissao distintos — medido 2026-10-27"
  senador_comissao:
    grao: "a participação de um senador em um colegiado num período"
    chave: "(id_senador, id_comissao, data_inicio, participacao) (21.812 linhas = 21.812 distintos)"
    tempo: {natureza: serie_de_periodos, coluna: data_inicio, cobertura: "1995-03-14–2026-09-15"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos: ["participacao = 'Titular' (13.355), 'Suplente' (8.447) ou 'Nato' (10)", "data_fim IS NULL (8,21%) = participação em aberto"]
    use_para: "quem participa ou participou de cada comissão"
    rascunho: [use_para]
    verificado: "21.812 linhas, chave de 4 colunas com 21.812 distintos — medido 2026-10-27"
  senador_cargo:
    grao: "um cargo (presidente, relator etc.) de um senador num colegiado num período"
    chave: "(id_senador, id_comissao, id_cargo, data_inicio) (2.461 linhas = 2.461 distintos)"
    tempo: {natureza: serie_de_periodos, coluna: data_inicio, cobertura: "1995-03-21–2026-09-02"}
    territorio: {nivel: nenhum, colunas: {}}
    use_para: "cargos de direção em comissões ao longo do tempo (descricao_cargo tem 94 grafias, incluindo erros como 'VlCE-PRESIDENTE')"
    rascunho: [use_para]
    verificado: "2.461 linhas; chave de 4 colunas com 2.461 distintos; data_fim nula em 34,82% — medido 2026-10-27"
  lideranca:
    grao: "uma designação de liderança ou vice-liderança (Senado, Câmara ou Congresso)"
    chave: "id_lideranca (306 linhas = 306 distintos)"
    tempo: {natureza: retrato_atual, coluna: data_designacao, cobertura: "2023-01-06–2026-09-01"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos: ["casa = 'SF' (35), 'CD' (234), 'CN' (37)", "sigla_tipo_lideranca = 'V' (250), 'L' (47), '1' (7), 'R' (2): significado não documentado"]
    use_para: "líderes e vice-líderes vigentes por partido ou bloco"
    nao_use_para: "histórico de lideranças (só as designações vigentes no perfil)"
    rascunho: [use_para, nao_use_para]
    verificado: "306 linhas, 306 id_lideranca distintos — medido 2026-10-27"
  processo:
    grao: "um processo legislativo (matéria: projeto, requerimento, mensagem etc.)"
    chave: "id_processo (160.524 linhas = 160.524 distintos; codigo_materia também é único)"
    tempo: {natureza: serie_anual, coluna: data_apresentacao, cobertura: "1946-09-23–2026-04-01"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos: ["tramitando = 'Sim' (9.514) ou 'Não' (151.010)", "casa_identificadora = 'SF' (140.758) ou 'CN' (19.766)", "sigla = 'PL', 'PEC' etc. (118 siglas)"]
    use_para: "contar e buscar matérias por sigla, autoria, ementa, situação e ano"
    nao_use_para: "data_situacao_atual como data real: tem valores impossíveis (min 0195-06-18, max 2502-04-16)"
    rascunho: [use_para]
    verificado: "160.524 linhas, 160.524 id_processo e codigo_materia distintos — medido 2026-10-27"
  relatoria:
    grao: "uma designação de relator para uma matéria num colegiado"
    chave: "id_relatoria (3.593 linhas = 3.593 distintos)"
    tempo: {natureza: serie_anual, coluna: data_designacao, cobertura: "2021-10-13–2026-08-31"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos: ["tipo_relator = 'Relator' (3.592) ou 'Relator Revisor' (1)", "tramitando = 'S' (3.588) ou 'N' (5)"]
    use_para: "quem relata cada matéria em cada comissão (id_senador, id_processo, id_colegiado)"
    rascunho: [use_para]
    verificado: "3.593 linhas, id_relatoria 3.593 distintos; data_destituicao 100% nula — medido 2026-10-27"
  discurso:
    grao: "um pronunciamento em plenário"
    chave: "id_pronunciamento (99.987 linhas = 99.987 distintos)"
    tempo: {natureza: serie_diaria, coluna: data_sessao, cobertura: "1997-02-26–2026-03-18"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF do orador (nula quando tipo_autor = 'Autor Externo', 5.296 linhas)"}}
    filtros_tipicos: ["tipo_autor = 'Senador(a)' (93.840), 'Autor Externo' (5.296) ou 'Deputado(a)' (851)", "sigla_casa = 'SF' (96.520) ou 'CN' (3.467)", "sigla_tipo_uso_palavra = 'DIS' (68.925, 'Discurso')"]
    use_para: "contar discursos por senador, partido, UF, ano e tipo de uso da palavra; resumo e indexação para busca"
    rascunho: [use_para]
    verificado: "99.987 linhas, 99.987 id_pronunciamento distintos — medido 2026-10-27"
  votacao:
    grao: "uma votação nominal ou simbólica no Senado, com o placar agregado"
    chave: "id_votacao (3.593 linhas = 3.593 distintos)"
    tempo: {natureza: serie_diaria, coluna: data_sessao, cobertura: "1991-03-05–2026-02-25"}
    territorio: {nivel: nenhum, colunas: {}}
    medidas:
      - {coluna: voto_sim, o_que: "votos Sim; coincide com a contagem de votacao_parlamentar.voto = 'Sim' nas 3.577 votações que têm detalhe", unidade: "votos", soma: nao}
      - {coluna: voto_nao, o_que: "votos Não", unidade: "votos", soma: nao}
      - {coluna: voto_abstencao, o_que: "abstenções", unidade: "votos", soma: nao}
    filtros_tipicos: ["resultado = 'A' (3.092), 'R' (389), 'E' (2), 'P' (1), nulo (109): significado não documentado (A e R provavelmente aprovado e rejeitado)", "votacao_secreta = 'S' (1.822) ou 'N' (1.771)", "sigla_colegiado = 'PLEN' (1.108) ou nulo (2.484)"]
    use_para: "resultado e placar das votações por matéria, sessão e ano"
    nao_use_para: "saber como cada senador votou (use votacao_parlamentar); somar placares entre votações"
    rascunho: [use_para, nao_use_para]
    verificado: "3.593 linhas, 3.593 id_votacao distintos; voto_sim = contagem de 'Sim' em 3.577 de 3.577 votações com detalhe — medido 2026-10-27"
  votacao_parlamentar:
    grao: "o voto de um senador numa votação"
    chave: "(id_votacao, id_senador) (284.400 linhas = 284.400 distintos)"
    tempo: {natureza: serie_diaria, coluna: data_sessao, cobertura: "1991-03-05–2026-02-25"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF do senador (1,53% nulos)"}}
    filtros_tipicos:
      - "voto = 'Sim' (84.194), 'Não' (22.293), 'Abstenção' (1.619), 'Obstrução' (39): são os votos de fato (literais, com acento)"
      - "voto = 'Votou' (98.177): voto registrado sem revelar o sentido; em 97.951 dessas linhas a votação é secreta (votacao.votacao_secreta = 'S')"
      - "voto = 'P-NRV' (44.120, 'Presente – Não registrou voto'), 'AP' (15.264, atividade parlamentar), 'LS' (5.373, licença saúde), 'NCom' (5.322), 'MIS' (3.597, missão): ausências; 'descricao_voto' traz o texto"
    use_para: "votos nominais de cada senador, por partido, UF e votação"
    nao_use_para: "contar linhas como votos: só 'Sim', 'Não', 'Abstenção' e 'Obstrução' são votos; as demais são ausência ou voto secreto"
    rascunho: [use_para]
    verificado: "284.400 linhas, chave 284.400 distintos; 22 valores de voto; 'Votou' em votação secreta em 97.951 de 98.177 — medido 2026-10-27"
  votacao_orientacao_bancada:
    grao: "a orientação de uma bancada (partido, bloco ou Governo) numa votação"
    chave: "(id_votacao_sve, bancada) (6.753 linhas = 6.753 distintos)"
    tempo: {natureza: serie_diaria, coluna: data_votacao, cobertura: "2018-10-16–2026-08-12"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos: ["orientacao = 'SIM' (4.683), 'NÃO' (1.353), 'LIVRE' (689), 'OBSTRUÇÃO' (8), nulo (20)"]
    use_para: "orientação de bancada por votação (id_votacao_sve; a junção com id_votacao das outras tabelas não foi conferida)"
    rascunho: [use_para]
    verificado: "6.753 linhas, chave 6.753 distintos — medido 2026-10-27"
  votacao_comissao:
    grao: "uma votação ocorrida numa reunião de comissão do Senado"
    chave: "id_votacao (1.645 linhas = 1.645 distintos)"
    tempo: {natureza: serie_diaria, coluna: data_reuniao, cobertura: "2013-04-10–2026-02-25"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos: ["tipo_reuniao = 'Extraordinária' (1.113), 'Ordinária' (523), 'Reunião' (6), 'Conjunta' (3)"]
    use_para: "placar das votações em comissões (voto_sim, voto_nao, voto_abstencao) por comissão e matéria"
    rascunho: [use_para]
    verificado: "1.645 linhas, 1.645 id_votacao distintos — medido 2026-10-27"
  votacao_comissao_parlamentar:
    grao: "o voto de um senador numa votação de comissão"
    chave: "(id_votacao, id_senador) (21.296 linhas = 21.296 distintos)"
    tempo: {natureza: serie_diaria, coluna: data_reuniao, cobertura: "2013-04-10–2026-02-25"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos: ["voto = 'S' (18.646), 'N' (2.606), 'A' (44)", "voto_presidente = 'true' (4) ou 'false' (21.292): texto, não booleano"]
    use_para: "voto individual de cada senador em comissões"
    nao_use_para: "juntar direto com votacao_comissao: o perfil mostra 1.968 id_votacao distintos aqui contra 1.645 lá (junção não conferida)"
    rascunho: [use_para, nao_use_para]
    verificado: "21.296 linhas, chave 21.296 distintos — medido 2026-10-27"
