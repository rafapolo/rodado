# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_cgu_cartao_pagamento
tabelas:
  dicionario:
    grao: "um significado de código de transação (transacao) do cartão, por tabela do dataset"
    use_para: "traduzir o texto de transacao (ex.: 'SAQUE CASH/ATM BB' = saque em terminal do Banco do Brasil)"
  microdados_governo_federal:
    ultima_data: "2026-01-29"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma transação no cartão de pagamento do governo federal (CPGF), num extrato mensal"
    chave: "nenhuma: 1.801.842 linhas contra 1.546.528 linhas distintas (255.314 cópias exatas, que podem ser compras idênticas legítimas) (gotcha linhas_repetidas_e_sigilo)"
    tempo: {natureza: serie_mensal, coluna: "ano_extrato, mes_extrato (data_transacao é nula em 19,23%)", cobertura: "2013–2026 (data_transacao 2012-10-28–2026-01-29)"}
    territorio: {nivel: nenhum, colunas: {codigo_orgao_superior: "órgão superior (33 valores)", codigo_unidade_gestora: "unidade gestora que pagou"}}
    medidas:
      - {coluna: valor_transacao, o_que: "valor da transação, sem negativos nesta tabela", unidade: "R$", soma: sim}
    filtros_tipicos:
      - "transacao = 'Informações protegidas por sigilo' (346.581 linhas, soma 440.221.810,58): sem cpf_portador, data_transacao nula e cnpj_cpf_favorecido/nome_favorecido = 'Sigiloso'; não entram em análises por pessoa, favorecido ou data (gotcha linhas_repetidas_e_sigilo)"
      - "transacao = 'SAQUE CASH/ATM BB' (217.217 linhas, soma 87.165.406) é saque em terminal do BB; 'COMPRA A/V - R$ - APRES' (1.225.532) é compra à vista em reais (dicionário)"
      - "regexp_full_match(cpf_portador, '[0-9]{11}') para CPF completo (gotcha cpf_completado)"
    use_para: "gasto de cartão corporativo por órgão, unidade gestora, favorecido e mês de extrato"
    nao_use_para: "análise por data ou portador sem tratar as 346.581 linhas sigilosas, nem deduplicar por linha repetida"
    rascunho: [use_para, nao_use_para]
    verificado: "1.801.842 linhas; 1.546.528 distintas; 346.581 sigilosas com data nula; soma sigilo 440.221.810,58 — medido 2026-10-27"
  microdados_defesa_civil:
    grao: "uma transação no cartão de pagamento da Defesa Civil (repasse a convenentes), num extrato mensal"
    chave: "nenhuma: 129.151 linhas contra 101.125 linhas distintas (cópias exatas; algumas podem ser pagamentos idênticos legítimos)"
    tempo: {natureza: serie_mensal, coluna: "ano_extrato, mes_extrato", cobertura: "2013–2025 (data_transacao 2012-11-19–2025-11-26)"}
    territorio: {nivel: outro, colunas: {executor_despesa: "município/UF executor em texto (ex.: 'ABAETETUBA / PA')", nome_convenente: "convenente", codigo_convenente: "CNPJ do convenente"}}
    medidas:
      - {coluna: valor_transacao, o_que: "valor da transação; há negativos (5.379 linhas: estornos, ex.: 'ESTORNO DE PAGAMENTO CONVENIO CPB')", unidade: "R$", soma: sim}
    filtros_tipicos:
      - "transacao = 'PAGAMENTO CONVENIO CPB' (85.299), 'COMPRA A/V - R$ - APRES' (30.494), 'ESTORNO DE PAGAMENTO CONVENIO CPB' (4.980, estorno)"
      - "repasse = 'Sim' (14.778) ou 'Nã' (114.373, o 'Não' truncado na carga)"
      - "codigo_orgao_superior = '53000' (128.631 linhas); '-1' (519) significa sem informação (não documentado)"
    use_para: "repasses por cartão da Defesa Civil a convenentes e municípios"
    nao_use_para: "somar valor_transacao sem tratar estornos (negativos) e repetição de linhas"
    rascunho: [use_para, nao_use_para, "significado de codigo_* = '-1'"]
    verificado: "129.151 linhas; 101.125 distintas; 5.379 negativas — medido 2026-10-27"
  microdados_compras_centralizadas:
    grao: "uma transação de compra centralizada de passagem aérea no cartão do governo federal, num extrato mensal"
    chave: "nenhuma: 1.282.184 linhas; a combinação (extrato, unidade gestora, favorecido, data, valor, transacao) tem 998.160 distintos"
    tempo: {natureza: serie_mensal, coluna: "ano_extrato, mes_extrato", cobertura: "2014–2026, concentrada em 2015–2018 (data_transacao 2014-08-28–2025-12-04; nula em 2.562 linhas)"}
    territorio: {nivel: nenhum, colunas: {codigo_orgao_superior: "órgão superior (35 valores)", codigo_unidade_gestora: "unidade gestora"}}
    medidas:
      - {coluna: valor_transacao, o_que: "valor da compra (mínimo 1,33; sem negativos)", unidade: "R$", soma: sim}
    filtros_tipicos:
      - "tipo_aquisicao = 'Aquisição de Passagem Aérea' (1.281.272 linhas); 'Sem informação' (912)"
      - "transacao = 'COMPRA A/V - R$ - APRES' (1.279.570); 'Informações protegidas por sigilo' (2.562)"
    use_para: "gasto centralizado com passagens aéreas por órgão e favorecido (companhias)"
    nao_use_para: "gasto com cartão em geral; só passagens aéreas, quase todo em 2014–2019"
    rascunho: [use_para, nao_use_para]
    verificado: "1.282.184 linhas; 998.160 combinações distintas; 0 negativos — medido 2026-10-27"
