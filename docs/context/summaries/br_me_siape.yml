# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_me_siape
tabelas:
  servidores_executivo_federal:
    ultima_data: "2022-06-20"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um servidor (vínculo) do Poder Executivo federal, sem identificador, só com perfil e lotação"
    chave: "nenhuma: não há id nem CPF; as 9 colunas juntas dão 358.869 combinações distintas em 358.869 linhas, mas isso é coincidência, não chave"
    tempo: {natureza: retrato_atual, coluna: data_admissao, cobertura: "retrato de data não documentada; data_admissao 1960-10-10–2022-06-20 e o órgão 'Ministério da Economia' indicam algo próximo de meados de 2022"}
    territorio: {nivel: nenhum, colunas: {orgao_exercicio: "órgão de exercício (189 valores, texto em maiúsculas)", orgao_vinculacao: "órgão de vinculação (21 valores, ex.: 'MINISTERIO DA EDUCACAO' 215.639)"}}
    filtros_tipicos:
      - "situacao_vinculo = 'ATIVO PERMANENTE' (302.066 linhas); há 40 situações, entre elas cedidos, requisitados e contratos temporários"
      - "funcao IS NULL para quem não tem função gratificada/cargo comissionado (276.809 linhas, 77,13%); funcao = 'FG', 'FUC', 'CD', 'DAS'... para quem tem (valores em maiúsculas; nivel_funcao como 'CA-1')"
      - "sexo = 'F' / 'M'; raca_cor com 'NÃO INFORMADO' (18.849) e 184 NULL, grafia 'INDIGENA' sem acento"
    use_para: "perfil do funcionalismo federal (órgão, sexo, raça/cor, situação do vínculo, função) por contagem de linhas"
    nao_use_para: "remuneração (não há coluna de salário) ou acompanhar uma pessoa (não há identificador)"
    rascunho: [use_para, nao_use_para, "grão = servidor/vínculo", "data do retrato"]
    verificado: "358.869 linhas; 9 colunas, todas VARCHAR; nulos em funcao/nivel_funcao/atividade 77,13%; contagens de situacao_vinculo e funcao do perfil (tabela inteira) — medido 2026-10-27"
