# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_presidencia_comunicabr
tabelas:
  municipio:
    grao: "um indicador (bloco × programa × variável) × município × ano, da coleta mais recente do painel ComunicaBR"
    chave: "(id_municipio, bloco, programa, variavel, ano): 1.551.434 linhas e 1.551.434 distintos. Vale enquanto houver uma só coleta (data_coleta única = 2026-10-13); com duas coletas repete, ver gotcha uma_coleta_por_arquivo"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "2023–2026 (2026 parcial, até o mês de 'ref', que muda por variável)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos (6.859 distintos)", sigla_uf: "UF do município"}}
    medidas:
      - {coluna: valor, o_que: "valor do indicador definido por variavel; a unidade está na coluna unidade", unidade: "depende de unidade: QTD (981.158 linhas), R$ (483.899), % em fração (77.978), km2 (5.571), HE hectares (2.828)", soma: "só dentro de uma mesma (programa, variavel, unidade): nunca some variáveis irmãs (total e partes) nem unidades diferentes; % não se soma; 168 linhas têm valor negativo"}
    filtros_tipicos:
      - "variavel = 'Famílias Beneficiadas' e programa = 'Bolsa Família' (QTD) ou variavel = 'Valor transferido - Bolsa Família' (R$): a quantidade e o valor estão em blocos diferentes (PROTEÇÃO SOCIAL e TRANSFERÊNCIAS AOS CIDADÃOS), ver gotcha quantidade_e_valor_em_blocos_diferentes"
      - "unidade = 'R$' para dinheiro, 'QTD' para contagens, '%' (fração, 0,4780 = 47,8%)"
      - "data_coleta = (SELECT max(data_coleta) ...) quando houver mais de uma coleta"
    use_para: "Indicadores de programas federais (beneficiários, valores repassados) por município e ano"
    nao_use_para: "Total estadual (use uf) e somar valor por programa sem escolher variavel"
    rascunho: [use_para, nao_use_para]
    verificado: "1.551.434 linhas; 1.551.434 distintos da chave; exemplo Nova Friburgo (3303401), Bolsa Família 2025: Famílias Beneficiadas 8.072, Valor transferido R$ 73.931.653 — medido 2026-10-27. Gotchas: uma_coleta_por_arquivo, total_e_partes_na_mesma_coluna, ano_corrente_parcial, percentual_em_fracao_e_acima_de_1"
  uf:
    grao: "mesmo grão de municipio, mas por UF: um indicador × UF × ano"
    chave: "(sigla_uf, bloco, programa, variavel, ano): 14.460 linhas e 14.460 distintos"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "2023–2026"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF (28 valores distintos no perfil)"}}
    medidas:
      - {coluna: valor, o_que: "valor do indicador por variavel", unidade: "conforme unidade (QTD 9.417, R$ 4.371, % 378, HE 267, km2 27)", soma: "mesma regra de municipio; não some uf com municipio"}
    filtros_tipicos: ["mesmos de municipio; existem 10 programas só aqui e em brasil (ver gotcha programa_so_na_uf)"]
    use_para: "Total estadual de um indicador federal, inclusive programas sem linha municipal"
    nao_use_para: "Somar junto com municipio (dupla contagem) ou conferir como soma exata dos municípios (ver gotcha uf_nao_e_soma_dos_municipios)"
    rascunho: [use_para, nao_use_para]
    verificado: "14.460 linhas; 14.460 distintos da chave — medido 2026-10-27"
  brasil:
    grao: "mesmo grão de municipio, mas nacional: um indicador × ano"
    chave: "(bloco, programa, variavel, ano): 594 linhas e 594 distintos"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "2023–2026 (134, 147, 147 e 166 linhas por ano)"}
    territorio: {nivel: brasil, colunas: {}}
    medidas:
      - {coluna: valor, o_que: "valor nacional do indicador", unidade: "conforme unidade (QTD 385, R$ 178, % 14, HE 12, U$ 4, km2 1); U$ só na balança comercial", soma: "nao entre variáveis; só dentro da mesma variavel"}
    filtros_tipicos: ["ano = 2025 (último ano fechado; 2026 é parcial e o mês muda por variável em ref)"]
    use_para: "Série nacional de um indicador de programa federal"
    nao_use_para: "Comparar 2026 com ano cheio; somar variáveis irmãs"
    rascunho: [use_para, nao_use_para]
    verificado: "594 linhas; 594 distintos da chave — medido 2026-10-27"
