# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_inmet_bdmep
tabelas:
  estacao:
    ultima_data: "2026-04-30"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma estação meteorológica do INMET"
    chave: "id_estacao (633 linhas, 633 distintas)"
    tempo: {natureza: retrato_atual, coluna: data_fundacao, cobertura: "2000-05-07–2026-04-30 (data de fundação, não de medição)"}
    territorio: {nivel: ponto, colunas: {id_municipio: "município da estação, IBGE 7 dígitos (608 municípios distintos)", geolocalizacao: "POINT(lat lon) com eixos trocados (ver gotcha geolocalizacao_eixos_trocados)", altitude: "metros (1 NULL)"}}
    use_para: "localizar a estação (município, coordenada, altitude) de um id_estacao de microdados."
    nao_use_para: "assumir uma estação por município (608 municípios para 633 estações)."
    rascunho: [use_para, nao_use_para]
    verificado: "633 linhas = 633 id_estacao distintos; 608 id_municipio distintos; altitude NULL em 1 — medido 2026-10-27"
  microdados:
    ultima_data: "2025-06-30"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma observação horária de uma estação (id_estacao × data × hora)"
    chave: "id_estacao, data, hora — única até 2024 (mar/2015, 2020, 2024: linhas = chaves), mas em 2025 cada linha vem duplicada: 4.891.176 linhas para 2.452.104 chaves (mar/2025: 837.000 linhas, 419.616 chaves, 421.103 linhas distintas) (gotcha ano_2025_linhas_em_dobro)"
    tempo: {natureza: serie_diaria, coluna: data, cobertura: "2000–2025 (2025 só até 2025-06-30); hora é TIME WITH TIME ZONE, 00:00–23:00 em UTC"}
    territorio: {nivel: ponto, colunas: {id_estacao: "estação; junte a estacao para município e coordenada"}}
    medidas:
      - {coluna: precipitacao_total, o_que: "chuva acumulada na hora", unidade: "mm", soma: sim}
      - {coluna: "temperatura_bulbo_hora, temperatura_max, temperatura_min, temperatura_orvalho_*", o_que: "temperatura do ar e do ponto de orvalho (hora, máxima e mínima da hora)", unidade: "°C", soma: nao}
      - {coluna: "pressao_atm_hora, pressao_atm_max, pressao_atm_min", o_que: "pressão atmosférica", unidade: "hPa (mB)", soma: nao}
      - {coluna: "umidade_rel_hora, umidade_rel_max, umidade_rel_min", o_que: "umidade relativa", unidade: "%", soma: nao}
      - {coluna: radiacao_global, o_que: "radiação global na hora", unidade: "kJ/m² (unidade não documentada)", soma: sim}
      - {coluna: "vento_velocidade, vento_rajada_max, vento_direcao", o_que: "vento", unidade: "m/s; graus", soma: nao}
    filtros_tipicos:
      - "ano = <ano> (partição; 84,5 milhões de linhas no total); ano = 2025 exige DISTINCT/deduplicação (gotcha ano_2025_linhas_em_dobro: DISTINCT não basta, agrupe pela chave)"
      - "precipitacao_total IS NOT NULL e cobertura ≥ 90% das horas antes de somar o ano (gotcha horas_sem_chuva_medida); em 2025 (jan–jun) cerca de 37% é NULL"
    use_para: "séries horárias de clima por estação (chuva, temperatura, vento)."
    nao_use_para: "somar precipitacao_total sem checar nulos e, em 2025, sem deduplicar."
    rascunho: [use_para, nao_use_para, "unidade de radiacao_global"]
    verificado: "2025: 4.891.176 linhas, 2.452.104 chaves, 567 estações, 2025-01-01–2025-06-30; mar/2015 353.400=353.400, mar/2020 438.216=438.216, mar/2024 420.360=420.360; anos 2000–2025 (26) — medido 2026-10-27"
