# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_bcb_ifdata
tabelas:
  cadastro:
    ultima_data: "2026-06"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma instituição financeira × trimestre (cadastro IF.data)"
    chave: "ano_mes, cod_inst (512.941 linhas = 512.941 distintos)"
    tempo: {natureza: serie_de_periodos, coluna: ano_mes, cobertura: "200003–202606 (trimestral: meses 3, 6, 9, 12)"}
    territorio: {nivel: municipio, colunas: {municipio: "nome da sede em texto (sem código IBGE)", sigla_uf: "UF da sede, nula em 3,58%"}}
    filtros_tipicos:
      - "cod_inst é o código de 8 caracteres usado também em relatorio (CNPJ básico ou 'C00xxxxx'), não o id_instituicao de instituicao (gotcha instituicao_da_bd_nao_casa)"
      - "situacao: 'I', 'A', 'LO', 'F', 'LE' (em 202606: I 3.403, A 2.372, F 45, LO 27, LE 18); significado não documentado"
      - "tcb em maiúsculas aqui ('B3S' 237.174, 'N2', 'N1', 'B1'); em instituicao vem em minúsculas ('b3S')"
      - "tc: 1 = Público, 2 = Privado Nacional, 3 = Privado com Controle Estrangeiro (dicionario)"
      - "td: 'C' conglomerado, 'I' instituição independente (dicionario)"
    use_para: "classificar e localizar instituições (tipo, segmento, UF, conglomerado) por trimestre"
    nao_use_para: "valores contábeis (use relatorio) ou juntar com instituicao"
    rascunho: [use_para, nao_use_para, "significado de situacao"]
    verificado: "512.941 linhas, chave (ano_mes, cod_inst) única; 202606: 5.865 instituições — medido 2026-10-27"
  coluna:
    ultima_data: "2025-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma coluna (conta) dos relatórios do IF.data num trimestre, com nome e grupo"
    chave: "nenhuma: (ano, mes, id_coluna) dá 36.231 distintos em 48.482 linhas e, com id_relatorio e tipo_consolidado, 48.261"
    tempo: {natureza: serie_de_periodos, coluna: "ano + mes", cobertura: "2000–2025"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos:
      - "tipo_consolidado: 1004 Conglomerados Prudenciais, 1005 Conglomerados Financeiros, 1006 Instituições Individuais, 1007 com Operações de Câmbio, 1008 Conglomerados Financeiros (SCR), 1009 Prudenciais desde 2023 (dicionario); nulo em 27,55%"
      - "id_relatorio nulo em 25,83%"
    use_para: "ler o nome de uma coluna/conta do IF.data por ano"
    nao_use_para: "valores: não há saldo aqui; o código muda entre trimestres (gotcha conta_muda_de_codigo)"
    rascunho: [use_para, nao_use_para]
    verificado: "48.482 linhas; (ano, mes, id_coluna) repete — medido 2026-10-27"
  instituicao:
    ultima_data: "2025-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma instituição × trimestre × tipo de consolidação (tabela Base dos Dados)"
    chave: "ano, mes, id_instituicao, tipo_consolidado (440.444 linhas = 440.444 distintos); sem tipo_consolidado são 217.072"
    tempo: {natureza: serie_de_periodos, coluna: "ano + mes", cobertura: "2000–2025"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos da sede"}}
    filtros_tipicos:
      - "tipo_consolidado: 1006 Instituições Individuais (187.526), 1005 Conglomerados Financeiros (168.578), 1004 Prudenciais (53.335), 1008 (13.225), 1009 (12.263), 1007 (5.517): filtre um para não repetir instituição"
      - "tc: '1' Público, '2' Privado Nacional, '3' Privado Estrangeiro; td: 'C' ou 'I'; ti e segmento: código do dicionario (ex.: '9' = Cooperativa de Crédito, '1' = Banco do Brasil)"
      - "id_instituicao é recodificado: não casa com cod_inst de cadastro e relatorio"
    use_para: "classificação de instituições por segmento, tipo e conglomerado até 2025"
    nao_use_para: "ligar com relatorio (chave diferente) ou contar instituições sem filtrar tipo_consolidado"
    rascunho: [use_para, nao_use_para]
    verificado: "440.444 linhas; (ano, mes, id_instituicao) 217.072 distintos; com tipo_consolidado única — medido 2026-10-27"
  relatorio:
    ultima_data: "2026-06"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "o saldo de uma conta (coluna do relatório) de uma instituição, num tipo de consolidação e trimestre: um relatório do IF.data em formato longo"
    chave: "(ano_mes, tipo_instituicao, cod_inst, numero_relatorio, conta): única em 202606 (874.212 linhas = 874.212 distintos) e em 2026 (1.751.234); com grupo na chave também 874.212"
    tempo: {natureza: serie_de_periodos, coluna: ano_mes, cobertura: "200003–202606, trimestral (meses 3, 6, 9, 12; 106 trimestres); ano e mes também existem. Cada trimestre é um retrato do balanço, não fluxo"}
    territorio: {nivel: nenhum, colunas: {}}
    medidas:
      - {coluna: saldo, o_que: "saldo da conta no trimestre, em reais (BB, Ativo Total 202606: 2.461.086.914.237,77); nulo em 27,05%; negativo em contas como Perda Esperada", unidade: "R$ (valor inteiro, não em milhares)", soma: "sim só dentro de um mesmo relatório e conta; as contas de um relatório são subtotais e componentes uns dos outros (Operações de Crédito (e) = e1 + e2 + e3 + e4; Ativo Total = a + b + ... + j), então somar contas diferentes conta em dobro"}
    filtros_tipicos:
      - "tipo_instituicao: 1 = prudencial (desde 201403), 2 = financeiro, 3 = individual (os dois desde 200003), 4 = só o relatório 15 de câmbio (201412 a 202306, 121.374 linhas, 217 instituições). Os três primeiros contam a mesma instituição de novo: Ativo Total do Resumo em 202412 é 17,05 tri (tipo 1), 17,48 (tipo 2) e 17,51 (tipo 3); em 202606, 18,94 / 19,46 / 19,50 (gotcha um_tipo_e_um_relatorio)"
      - "numero_relatorio (202606, tipo 3): 1 Resumo (11.354 linhas, 7 contas), 2 Ativo (38.928, 24), 3 Passivo (35.684, 22), 4 Demonstração de Resultado (84.344, 52). O tipo 1 tem também 5 Informações de Capital, 6 Segmentação, 7 Carteira por indexador, 9 por região, 10 clientes e operações, 11 Pessoa Física, 12 Pessoa Jurídica por CNAE, 13 PJ por modalidade, 14 por porte, 16 por carteiras de instrumentos (o 8 acaba em 202412; o 15 é o câmbio do tipo 4)"
      - "ativo total: use numero_relatorio = 1 e nome_coluna = 'Ativo Total' (sozinho esse nome também aparece no relatório 4 (visto em 202506, 202509 e 202512) e, no relatório 2, vem com a quebra de linha e a fórmula: 'Ativo Total \n(k) = ...'). O código da conta mudou de 78182 (até 202412) para 140220 (a partir de 202503); filtre pelo nome dentro do trimestre"
      - "cod_inst: 8 caracteres (CNPJ básico com zeros ou 'C00xxxxx'): Banco do Brasil = '00000000'. 202606 tipo 3, Resumo: 1.622 instituições, Ativo Total R$ 2,461 tri no BB"
      - "tabela de 54,7 milhões de linhas: filtre ano ou ano_mes (um parquet por trimestre)"
    use_para: "ativo, captações, patrimônio líquido, lucro, carteira de crédito e demonstração de resultado por instituição e trimestre, e a carteira de crédito por modalidade, CNAE ou região (tipo 1)."
    nao_use_para: "somar tipos de instituição ou relatórios juntos (triplica o ativo do sistema); somar contas de um relatório entre si (subtotais); comparar o código de conta entre trimestres (muda em 202503); juntar com instituicao (chave recodificada, gotcha instituicao_da_bd_nao_casa); tratar o resultado (relatório 4 e Lucro Líquido do 1) como fluxo do trimestre ou do ano: é acumulado no **semestre** (março = 1º tri, junho = 1º semestre, setembro = só o 3º tri, dezembro = 2º semestre); o ano é junho + dezembro e o trimestre isolado de junho ou dezembro é a diferença para março ou setembro (gotcha resultado_acumulado_no_semestre). As contas de balanço (relatórios 1 a 3) são estoque na data."
    verificado: "54.698.889 linhas; ano_mes 200003–202606; 202606: 874.212 linhas = 874.212 chaves; tipo 1 (1.398 instituições), tipo 2 (1.458), tipo 3 (1.622); numero_relatorio 1 a 16. Ativo Total do Banco do Brasil, tipo 3, Resumo: 283,7 bi (200612), 973,8 (201212), 1.327,8 (201712), 1.927,6 (202212), 2.304,1 (202412), 2.340,9 (202506), 2.430,7 (202509), 2.341,2 (202512), 2.461,1 (202606); conta 78182 até 202412 e 140220 de 202503 em diante (a gotcha conta_muda_de_codigo diz que o layout novo é de 2025-09: o código já mudou em 202503); em 202606 o BB tem no relatório 2 Operações de Crédito (e) 885,1 bi = Valor Contábil Bruto 981,6 − Perda Esperada 96,4 − hedge 0,001; DRE acumulada no semestre: Despesas de Pessoal de C0080738 (tipo 1) em 2024: 03 −8.044 mi, 06 −15.262, 09 −7.076, 12 −14.865 (setembro volta ao tamanho de março), o mesmo padrão em 2019, 2023, 2025 e 2026 e nos tipos 2 e 3; Lucro Líquido do relatório 1 = o do relatório 4 em 2025 (5.388 / 8.719 / 3.416 / 5.862 mi) — medido 2026-10-27, refeito 2026-11-10 e 2026-11-12"
  dicionario:
    grao: "um código com seu rótulo (sr, tc, tcb, td, ti, tipo_consolidado) para instituicao e coluna"
    use_para: "traduzir os códigos de classificação do IF.data em texto"
    verificado: "tabela de metadado lida — medido 2026-10-27"
