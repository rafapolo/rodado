# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_bcb_ifdata
tabelas:
  cadastro:
    grao: "uma instituição financeira × trimestre (cadastro IF.data)"
    chave: "ano_mes, cod_inst (512.941 linhas = 512.941 distintos)"
    tempo: {natureza: serie_de_periodos, coluna: ano_mes, cobertura: "200003–202606 (trimestral: meses 3, 6, 9, 12)"}
    territorio: {nivel: municipio, colunas: {municipio: "nome da sede em texto (sem código IBGE)", sigla_uf: "UF da sede, nula em 3,58%"}}
    filtros_tipicos:
      - "cod_inst é o código de 8 caracteres usado também em relatorio (CNPJ básico ou 'C00xxxxx'), não o id_instituicao de instituicao (gotcha instituicao_da_bd_nao_casa)"
      - "situacao: 'I', 'A', 'LO', 'F', 'LE' (em 202606: I 3.403, A 2.372, F 45, LO 27, LE 18); significado não documentado"
      - "tcb em maiúsculas aqui ('B3S' 237.174, 'N2', 'N1', 'B1'); em instituicao vem em minúsculas ('b3S')"
      - "tc: 1 = Público, 2 = Privado Nacional, 3 = Privado com Controle Estrangeiro (dicionario)"
      - "td: 'C' conglomerado, 'I' instituição independente (dicionario)"
    use_para: "classificar e localizar instituições (tipo, segmento, UF, conglomerado) por trimestre"
    nao_use_para: "valores contábeis (use relatorio) ou juntar com instituicao"
    rascunho: [use_para, nao_use_para, "significado de situacao"]
    verificado: "512.941 linhas, chave (ano_mes, cod_inst) única; 202606: 5.865 instituições — medido 2026-10-27"
  coluna:
    grao: "uma coluna (conta) dos relatórios do IF.data num trimestre, com nome e grupo"
    chave: "nenhuma: (ano, mes, id_coluna) dá 36.231 distintos em 48.482 linhas e, com id_relatorio e tipo_consolidado, 48.261"
    tempo: {natureza: serie_de_periodos, coluna: "ano + mes", cobertura: "2000–2025"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos:
      - "tipo_consolidado: 1004 Conglomerados Prudenciais, 1005 Conglomerados Financeiros, 1006 Instituições Individuais, 1007 com Operações de Câmbio, 1008 Conglomerados Financeiros (SCR), 1009 Prudenciais desde 2023 (dicionario); nulo em 27,55%"
      - "id_relatorio nulo em 25,83%"
    use_para: "ler o nome de uma coluna/conta do IF.data por ano"
    nao_use_para: "valores: não há saldo aqui; o código muda entre trimestres (gotcha conta_muda_de_codigo)"
    rascunho: [use_para, nao_use_para]
    verificado: "48.482 linhas; (ano, mes, id_coluna) repete — medido 2026-10-27"
  instituicao:
    grao: "uma instituição × trimestre × tipo de consolidação (tabela Base dos Dados)"
    chave: "ano, mes, id_instituicao, tipo_consolidado (440.444 linhas = 440.444 distintos); sem tipo_consolidado são 217.072"
    tempo: {natureza: serie_de_periodos, coluna: "ano + mes", cobertura: "2000–2025"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos da sede"}}
    filtros_tipicos:
      - "tipo_consolidado: 1006 Instituições Individuais (187.526), 1005 Conglomerados Financeiros (168.578), 1004 Prudenciais (53.335), 1008 (13.225), 1009 (12.263), 1007 (5.517): filtre um para não repetir instituição"
      - "tc: '1' Público, '2' Privado Nacional, '3' Privado Estrangeiro; td: 'C' ou 'I'; ti e segmento: código do dicionario (ex.: '9' = Cooperativa de Crédito, '1' = Banco do Brasil)"
      - "id_instituicao é recodificado: não casa com cod_inst de cadastro e relatorio"
    use_para: "classificação de instituições por segmento, tipo e conglomerado até 2025"
    nao_use_para: "ligar com relatorio (chave diferente) ou contar instituições sem filtrar tipo_consolidado"
    rascunho: [use_para, nao_use_para]
    verificado: "440.444 linhas; (ano, mes, id_instituicao) 217.072 distintos; com tipo_consolidado única — medido 2026-10-27"
  relatorio:
    grao: "um saldo de uma conta de um relatório × instituição × tipo de consolidação × trimestre"
    chave: "ano_mes, tipo_instituicao, cod_inst, numero_relatorio, conta (ano = 2026: 1.751.234 linhas = 1.751.234 distintos)"
    tempo: {natureza: serie_de_periodos, coluna: ano_mes, cobertura: "2000–202606 (trimestral)"}
    territorio: {nivel: nenhum, colunas: {}}
    medidas:
      - {coluna: saldo, o_que: "saldo da conta no trimestre (nulo em 27,05%)", unidade: "R$", soma: sim}
    filtros_tipicos:
      - "tipo_instituicao: 1 = prudencial, 2 = financeiro, 3 = individual (gotcha um_tipo_e_um_relatorio); em 2026: 1 (1.103.594 linhas), 3 (341.145), 2 (306.495)"
      - "numero_relatorio: 1 Resumo, 2 Ativo, 3 Passivo, 4 Demonstração de Resultado (tipo 3, 202606)"
      - "ativo total: conta 140220 / nome_coluna 'Ativo Total' no Resumo, mas o código muda entre trimestres (gotcha conta_muda_de_codigo); em 202606, tipo 3, cod_inst '00000000' (Banco do Brasil): R$ 2,461 tri"
      - "tabela de 54,7 milhões de linhas: filtre ano ou ano_mes"
    use_para: "ativo, captações, patrimônio e resultado por instituição e trimestre"
    nao_use_para: "somar tipos de instituição ou relatórios juntos (dobra) ou juntar com instituicao"
    rascunho: [use_para, nao_use_para]
    verificado: "ano=2026: 1.751.234 linhas = chave única; 202606 tipo 3: relatórios 1 (11.354 linhas), 2 (38.928), 3 (35.684), 4 (84.344) — medido 2026-10-27"
  dicionario:
    grao: "um código com seu rótulo (sr, tc, tcb, td, ti, tipo_consolidado) para instituicao e coluna"
    use_para: "traduzir os códigos de classificação do IF.data em texto"
    verificado: "tabela de metadado lida — medido 2026-10-27"
