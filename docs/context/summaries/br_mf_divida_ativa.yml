# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_mf_divida_ativa
tabelas:
  fgts:
    ultima_data: "2026"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma inscrição em dívida ativa do FGTS e seu devedor, no estoque de um trimestre"
    chave: "ano, trimestre, numero_inscricao, cpf_cnpj (única; em 2026 tri 2, 541.698 linhas, numero_inscricao sozinho também é único)"
    tempo: {natureza: soma_de_retratos, coluna: "ano, trimestre", cobertura: "2020 tri 1–2026 tri 2 (26 trimestres)"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF do devedor (0,29% nulo)"}}
    medidas:
      - {coluna: valor_consolidado, o_que: "valor consolidado da inscrição no trimestre", unidade: "R$", soma: sim}
    filtros_tipicos:
      - "ano = <ano> AND trimestre = <n>: cada trimestre é o estoque inteiro; somar trimestres conta a mesma dívida de novo (2026 tri 2: R$ 70,97 bi; tri 1: R$ 67,66 bi)"
      - "tipo_situacao_inscricao = 'Em cobrança' (R$ 66,35 bi em 2026 tri 2); 'Benefício Fiscal' e 'Garantia' são os outros"
      - "tipo_pessoa = 'Pessoa jurídica' ou 'Pessoa física' (com acento); receita_principal = 'Contribuições FGTS' ou 'Contribuições LC110 (FGTS)'; indicador_ajuizado = 'SIM'/'NAO'"
      - "entidade_responsavel = 'PGFN' ou 'CAIXA' (só existe no fgts)"
    use_para: "estoque da dívida ativa do FGTS por devedor, UF, situação e receita, trimestre a trimestre"
    nao_use_para: "somar vários trimestres; contar devedores com count(*) (um devedor tem muitas inscrições: use count(DISTINCT cpf_cnpj))"
    rascunho: [use_para, nao_use_para]
    verificado: "11.543.880 linhas; 2026 tri 2: 541.698 = 541.698 pares (numero_inscricao,cpf_cnpj) = 541.698 numero_inscricao; 2020 tri 2 e tri 3 têm as mesmas 440.888 linhas e R$ 37,80 bi (as duas inscrições coincidem em 440.888 pares): o retrato de tri 3 de 2020 repete o de tri 2 (gotcha trimestre_3_de_2020_repete_o_2; vale também para previdenciario) — medido 2026-10-27"
  previdenciario:
    ultima_data: "2026"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma inscrição em dívida ativa previdenciária e seu devedor, no estoque de um trimestre"
    chave: "ano, trimestre, numero_inscricao, cpf_cnpj (única; em 2026 tri 2, 3.606.529 linhas, numero_inscricao sozinho também é único)"
    tempo: {natureza: soma_de_retratos, coluna: "ano, trimestre", cobertura: "2020 tri 1–2026 tri 2 (26 trimestres)"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF do devedor (0,02% nulo)", unidade_responsavel: "região da PGFN ('3ª REGIÃO') ou, em poucas linhas, o estado"}}
    medidas:
      - {coluna: valor_consolidado, o_que: "valor consolidado da inscrição no trimestre", unidade: "R$", soma: sim}
    filtros_tipicos:
      - "ano = <ano> AND trimestre = <n>: tabela de 131 mi de linhas; cada trimestre é o estoque inteiro (2026 tri 2: R$ 480,0 bi; tri 1: R$ 479,6 bi; 2025 tri 1: R$ 491,3 bi)"
      - "tipo_situacao_inscricao = 'Em cobrança' (2.723.093 linhas, R$ 337,7 bi em 2026 tri 2), 'Benefício Fiscal' (868.350, R$ 111,5 bi), 'Garantia', 'Suspenso por decisão judicial', 'Em negociação'"
      - "receita_principal = 'OUTROS' em ~99% (maiúsculas e sem acento, diferente do fgts); situacao_inscricao tem 96 valores"
      - "não tem entidade_responsavel nem unidade_inscricao (só no fgts)"
    use_para: "estoque da dívida ativa previdenciária por devedor, UF e situação, trimestre a trimestre"
    nao_use_para: "somar vários trimestres, contar devedores com count(*), ou comparar receita_principal com a do fgts (valores diferentes)"
    rascunho: [use_para, nao_use_para]
    verificado: "131.607.772 linhas; 2026 tri 2: 3.606.529 linhas = 3.606.529 pares = 3.606.529 numero_inscricao; contagens de tipo_situacao_inscricao e somas de 2026 tri 2 acima — medido 2026-10-27"
