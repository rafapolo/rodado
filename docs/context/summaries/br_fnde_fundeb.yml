# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_fnde_fundeb
tabelas:
  indicador_estadual:
    grao: "um indicador do FUNDEB × UF × ano × período (formato longo: uma linha por indicador)"
    chave: "ano, periodo, id_uf, id_indicador (67.448 linhas = 67.448 distintos)"
    tempo: {natureza: serie_de_periodos, coluna: "ano, periodo", cobertura: "2008–2026 (periodo 1 a 6, bimestres do relatório; 2026 só até 4; significado não documentado)"}
    territorio: {nivel: uf, colunas: {id_uf: "código IBGE da UF", sigla_uf: "sigla"}}
    medidas:
      - {coluna: valor, o_que: "valor do indicador; a unidade depende de id_indicador (gotcha valor_muda_de_unidade_por_indicador) (percentual, R$, R$ por aluno ou índice)", unidade: "varia por indicador", soma: nao}
    filtros_tipicos: ["id_indicador = '<id>' (texto; um indicador por vez, ex.: '47' = % dos recursos do FUNDEB no ensino médio) e um periodo", "valor_texto repete valor, ambos DOUBLE"]
    use_para: "comparar um indicador do FUNDEB entre UFs e ao longo dos anos."
    nao_use_para: "somar valores de indicadores diferentes, nem somar percentuais entre UFs."
    rascunho: [use_para, nao_use_para]
    verificado: "67.448 linhas; chave de 4 colunas única; id_grupo = '3' em todas — medido 2026-10-27"
  indicador_municipal:
    grao: "um indicador do FUNDEB × município × ano × período (formato longo)"
    chave: "ano, periodo, id_municipio, id_indicador (única em ano = 2026: 666.656 linhas = 666.656; e em 2025: 849.533 = 849.533)"
    tempo: {natureza: serie_de_periodos, coluna: "ano, periodo", cobertura: "2008–2026 (19 anos; periodo 1 a 4 em 2026; 2025: 46 indicadores, 2026: 49)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos", id_municipio_6: "código de 6 dígitos", id_uf: "código da UF", sigla_uf: "sigla"}}
    medidas:
      - {coluna: valor, o_que: "valor do indicador; unidade depende do indicador (percentual, R$, R$ por aluno); há percentuais fora de 0–100 (ex.: indicador 1.1 de -246 a 1.346 em 2025)", unidade: "varia por indicador", soma: nao}
    filtros_tipicos: ["ano = <ano> AND id_indicador = '<id>' (texto): sem fixar o indicador, a soma mistura unidades (gotcha valor_muda_de_unidade_por_indicador)", "codigo_exibicao = '1.2' é o percentual do FUNDEB na remuneração dos profissionais (mínimo 70%)"]
    use_para: "indicador FUNDEB por município (cumprimento dos mínimos legais, gasto por aluno)."
    nao_use_para: "somar valor entre indicadores; tabela com 15 mi de linhas, sempre filtre ano e indicador."
    rascunho: [use_para, nao_use_para]
    verificado: "14.995.808 linhas; chave de 4 colunas única em 2025 e 2026 — medido 2026-10-27"
