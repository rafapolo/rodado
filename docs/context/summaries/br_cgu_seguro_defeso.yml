# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_cgu_seguro_defeso
tabelas:
  favorecido:
    grao: "uma combinação distinta de CPF × NIS × RGP × nome de um beneficiário do seguro-defeso (dimensão da pagamento); NÃO é uma pessoa"
    chave: "favorecido_id (3.982.685 linhas = 3.982.685 distintos)"
    tempo: {natureza: sem_tempo}
    territorio: {nivel: nenhum}
    use_para: "obter CPF, NIS, RGP e nome a partir do favorecido_id da pagamento; para contar pescadores use nis_favorecido (ver gotcha contar_por_nis)"
    nao_use_para: "contar pescadores por count(DISTINCT favorecido_id), que conta combinações (3,98 mi) e não pessoas (2,18 mi NIS)"
    rascunho: [use_para, nao_use_para]
    verificado: "3.982.685 linhas, 3.982.685 favorecido_id distintos — medido 2026-10-27"
  pagamento:
    ultima_data: "2026-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma parcela de seguro-defeso paga a um favorecido_id num mês de referência e município"
    chave: "nenhuma: (mes_referencia, favorecido_id, codigo_municipio_siafi) tem 25.144.850 distintos em 43.418.500 linhas; há repetição (em 202401, 58.641 grupos com mês, favorecido, município e valor idênticos)"
    tempo: {natureza: serie_mensal, coluna: mes_referencia, cobertura: "201301–202608"}
    territorio: {nivel: municipio, colunas: {uf: "UF do pagamento (vazia em 121 linhas)", codigo_municipio_siafi: "código SIAFI de 4 dígitos (vazio em 121 linhas); não é código IBGE", nome_municipio: "nome do município"}}
    medidas:
      - {coluna: valor_parcela, o_que: "valor da parcela paga", unidade: "R$", soma: sim}
    filtros_tipicos:
      - "mes_referencia LIKE '2024%' — mes_referencia é VARCHAR 'AAAAMM'; para um ano use prefixo (2024: 4.230.934 linhas, R$ 5,89 bi, 12 meses)"
      - "valor_parcela > 0 se quiser só pagamentos: há 124.868 linhas negativas (estornos/devoluções, significado não documentado)"
    use_para: "somar o valor pago e contar parcelas por mês, UF ou município; agregue direto na pagamento (mais rápida que a view seguro_defeso)"
    nao_use_para: "contar pescadores (count(DISTINCT favorecido_id) conta combinações); use a view seguro_defeso e nis_favorecido para isso"
    rascunho: [use_para, nao_use_para]
    verificado: "43.418.500 linhas; chave composta 25.144.850 distintos (não única); 124.868 valores negativos; 121 linhas sem UF/município — medido 2026-10-27. Ver gotchas contar_por_nis e agregue_pela_pagamento"
  seguro_defeso:
    ultima_data: "2026-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "view pagamento JOIN favorecido: um pagamento de seguro-defeso (parcela ou estorno, com sinal) × (CPF, NIS, RGP, nome) do beneficiário num mês de referência; o mesmo pescador aparece em média 1,2 a 2,4 vezes por mês de referência; mesmo grão da pagamento"
    chave: "nenhuma: mesmas 43.770.343 linhas da pagamento, que não tem chave única. (mes_referencia, favorecido_id) tem 25.361.661 combinações, 8.689.410 com mais de uma linha (até 74) e há linhas idênticas (só 25,98 milhões distintas em (mes_referencia, favorecido_id, município, valor))"
    tempo: {"natureza": "serie_mensal", "coluna": "mes_referencia", "cobertura": "201301–202609 (texto aaaamm), 162 meses: faltam 202511, 202512 e 202601 (por dedução, fora do período de defeso); o ciclo concentra os meses de 202603 a 202609 (2026: 3,96 milhões de linhas, R$ 6,37 bi)"}
    territorio: {"nivel": "municipio", "colunas": {"codigo_municipio_siafi": "código SIAFI de 4 dígitos (junta com o diretório como inteiro, gotcha contar_por_nis)", "nome_municipio": "nome do município", "uf": "UF; 27 UFs e vazia em 125 linhas; PA (12,2 milhões), MA (10,2) e BA (4,9) lideram"}}
    medidas:
      - {coluna: "valor_parcela", o_que: "valor do pagamento em R$; 126.354 linhas são negativas (estornos, por dedução: soma R$ -132,5 mi, mínimo R$ -67.891) e 99.684 valem zero; a soma líquida é R$ 49,54 bi, a dos positivos R$ 49,68 bi", unidade: "R$", soma: "sim, mas decida se entram os negativos (líquido) ou só valor_parcela > 0 (bruto)"}
    filtros_tipicos:
      - "mes_referencia LIKE '2024%' — VARCHAR 'AAAAMM'"
      - "valor_parcela > 0 quando a pergunta é quanto foi pago (os negativos são estornos)"
      - "regexp_full_match(cpf_favorecido, '[0-9]{11}') para só CPFs completos (gotcha cpf_completado)"
    use_para: "consultas que precisam de NIS, CPF, RGP ou nome do pescador; contar pescadores por count(DISTINCT nis_favorecido); valor pago por mês, UF e município (use a pagamento quando não precisar da pessoa)."
    nao_use_para: "somas e contagens simples por mês/UF/município, que ficam ~9x mais rápidas na pagamento (gotcha agregue_pela_pagamento); contar pescadores por count(*) ou por (mes_referencia, favorecido_id) (a linha é pagamento, não pessoa; o mesmo mês repete a pessoa); somar valor_parcela sem decidir sobre os negativos; ler mes_referencia como o mês em que o dinheiro foi pago (a tabela só tem esse campo)."
    verificado: "43.770.343 linhas, igual à pagamento (o cartão de 2026-10-27 tinha 43.418.500; a partir de 202609 o espelho ganhou 351.843 linhas); soma R$ 49.542.757.156 (positivos R$ 49,68 bi, negativos R$ -132,5 mi); 162 meses de 201301 a 202609, faltam 202511, 202512, 202601; pessoas-mês com 1 linha: 16.672.251, com 2: 3.245.146, com 4: 3.439.147, máximo 74; 25.984.545 distintos de (mes_referencia, favorecido_id, município, valor); valor_parcela de R$ -67.891 a R$ 7.204,06; UF vazia em 125 linhas, 27 UFs — medido 2026-10-27 e 2026-11-12"