# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_me_estoque_divida_publica
tabelas:
  microdados:
    ultima_data: "2022-10"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um título (id_divida) de uma carteira (classe_carteira) num mês: o estoque da dívida pública federal ao fim do mês"
    chave: "ano, mes, id_divida, classe_carteira (única nas 124.419 linhas). Atenção: (ano, mes, id_divida) sozinho repete em 2.772 linhas, que são as do Banco Central"
    tempo: {natureza: serie_mensal, coluna: "ano, mes", cobertura: "2017-09–2022-10 (2017 só set–dez; 2022 só jan–out)"}
    territorio: {nivel: brasil, colunas: {}}
    medidas:
      - {coluna: valor_estoque, o_que: "valor do estoque do título no mês", unidade: "R$ (out/2022: Mercado 5,78 tri + Banco Central 2,07 tri = 7,85 tri)", soma: sim}
      - {coluna: quantidade_estoque, o_que: "quantidade de títulos em estoque", unidade: "unidades de título", soma: nao}
    filtros_tipicos:
      - "classe_carteira = 'Mercado' para o estoque da dívida em poder do mercado; sem o filtro entra a carteira do Banco Central (gotcha carteira_do_banco_central)"
      - "tipo_divida = 'Dívida interna' (120.330 linhas no perfil) ou 'Dívida externa' (4.089)"
      - "um único mês: o estoque é saldo, não fluxo (ex.: ano = 2022 AND mes = 10, o último)"
    use_para: "estoque da dívida pública federal por título, tipo e vencimento, mês a mês"
    nao_use_para: "somar valor_estoque entre meses (cada mês é um saldo completo) ou comparar quantidade_estoque entre títulos diferentes"
    rascunho: [use_para, nao_use_para, "unidade de quantidade_estoque", "quantidade_estoque soma:nao"]
    verificado: "124.419 linhas; count(DISTINCT (ano,mes,id_divida,classe_carteira)) = 124.419 e sem classe_carteira = 121.647; último mês 2022-10; soma de valor_estoque em dez/2017–dez/2021 e out/2022: 5,22; 5,67; 6,14; 6,94; 7,64; 7,85 tri — medido 2026-10-27"
