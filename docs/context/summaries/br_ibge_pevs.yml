# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ibge_pevs
tabelas:
  producao_extracao_vegetal:
    grao: "um município × ano × produto da extração vegetal (com tipo_produto quando houver)"
    chave: "(ano, id_municipio, produto, tipo_produto) — 463.825 linhas = 463.825 distintos (medido). Sem tipo_produto, (ano, id_municipio, produto) repete (817 linhas em grupos, 415 a mais que o número de chaves), todas dos produtos 'Outros' (797) e 'Outras' (20)"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "1986–2024"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos (VARCHAR)"}}
    medidas:
      - {coluna: quantidade, o_que: "quantidade produzida", unidade: "depende de unidade: Metros cúbicos (lenha, madeira em tora), Toneladas (carvão, erva-mate, castanha etc.), Mil árvores", soma: "sim, só dentro do mesmo produto e mesma unidade"}
      - {coluna: valor, o_que: "valor da produção", unidade: "mil reais (rascunho: unidade não documentada nas colunas; escala compatível com R$ mil)", soma: sim}
    filtros_tipicos: ["produto = 'Madeira em tora' / 'Lenha' / 'Carvão vegetal' com unidade correspondente; os nomes são por extenso (ver column_codes, status nao_e_codigo)", "unidade = 'Toneladas' ou 'Metros cúbicos' antes de somar quantidade; nunca some quantidade entre unidades", "valor IS NOT NULL: 7.526 NULLs, todos da unidade 'Mil árvores'"]
    use_para: "produção e valor da extração vegetal por município e produto (madeira, lenha, carvão, açaí, castanha, erva-mate)."
    nao_use_para: "somar quantidade entre produtos, ou usar tipo_produto como filtro de produto (70% NULL)."
    rascunho: [use_para, nao_use_para, "unidade de valor"]
    verificado: "463.825 linhas, 463.825 chaves distintas com tipo_produto, 463.410 sem; unidade: Metros cúbicos 230.077, Toneladas 225.995, Mil árvores 7.753; valor NULL só em Mil árvores (7.526 de 7.753); tipo_produto NULL 70,47% — medido 2026-10-27"
  producao_silvicultura:
    grao: "um município × ano × produto da silvicultura (floresta plantada)"
    chave: "(ano, id_municipio, produto) — 94.626 linhas = 94.626 distintos (medido)"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "1986–2024"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos (VARCHAR)"}}
    medidas:
      - {coluna: quantidade, o_que: "quantidade produzida", unidade: "Metros cúbicos ou Toneladas conforme unidade (Toneladas: 17.863 linhas, ex.: resina, casca)", soma: "sim, só dentro da mesma unidade"}
      - {coluna: valor, o_que: "valor da produção", unidade: "mil reais (rascunho: escala compatível, 2024 soma 37.234.200)", soma: sim}
    filtros_tipicos: ["produto = 'Madeira em tora de eucalipto para papel e celulose' (valor por extenso, como no banco)", "unidade = 'Metros cúbicos' para somar madeira/lenha"]
    use_para: "silvicultura por município: madeira em tora, lenha, carvão, resina por espécie (eucalipto, pinus)."
    nao_use_para: "somar quantidade entre unidades; categoria_produto, tipo_produto e subtipo_produto são NULL em boa parte (93%, 6,5%, 57%) — o nome completo está em produto."
    rascunho: [use_para, nao_use_para, "unidade de valor"]
    verificado: "94.626 linhas, 94.626 chaves (ano, id_municipio, produto); valor sem nulos; soma de valor em 2024 = 37.234.200 — medido 2026-10-27"
