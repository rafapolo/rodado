# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ms_sinan_febre_amarela
tabelas:
  microdados_febre_amarela:
    ultima_data: "2026-07-03"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma notificação individual de febre amarela (ficha SINAN), sem identificador do caso"
    chave: "nenhuma: sem identificador; 82.844 linhas, 82.837 distintas (7 repetidas)"
    tempo: {natureza: serie_diaria, coluna: "DT_NOTIFIC (ano em NU_ANO e ano_sinan, iguais em todas as linhas)", cobertura: "2007–2026 (2026 até 2026-07-03)"}
    territorio: {nivel: municipio, colunas: {ID_MUNICIP: "município de notificação", ID_MN_RESI: "município de residência", SG_UF: "UF de residência (código numérico)", SG_UF_NOT: "UF da notificação"}}
    medidas:
      - {expressao: "count(*)", o_que: "notificações (inclui descartados e suspeitos)", unidade: "notificações", soma: sim}
    filtros_tipicos:
      - "ano_sinan = <ano>"
      - "CLASSI_FIN: '2' é 68.200, '1' 3.895, '8' 4.027, vazio 6.722; significado não documentado nas fontes do repo (palpite: 1 confirmado, 2 descartado); medir com cuidado antes de chamar de 'caso'"
      - "EVOLUCAO: '1' 58.197, '3' 2.900, '2' 1.142, '9' 3.268; significado não documentado (palpite como nas outras fichas: 1 cura, 2 óbito pelo agravo, 3 óbito por outra causa, 9 ignorado)"
      - "DIAGNO_LAB e CRITERIO ('1' 44.664, '2' 26.089, '3' 198): significado não documentado"
    use_para: "notificações de febre amarela por município e ano (picos 2017–2019 e 2023)."
    nao_use_para: "contar casos confirmados antes de documentar CLASSI_FIN."
    rascunho: [use_para, nao_use_para, filtros_tipicos]
    verificado: "82.844 linhas; 82.837 distintas (hash da linha); CLASSI_FIN 2 = 68.200, 8 = 4.027, 1 = 3.895, vazio 6.722 — medido 2026-10-27"
