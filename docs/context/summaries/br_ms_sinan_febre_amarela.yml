# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ms_sinan_febre_amarela
tabelas:
  microdados_febre_amarela:
    ultima_data: "2026-07-03"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma notificação individual de febre amarela (ficha SINAN), sem identificador do caso"
    chave: "nenhuma: sem identificador; 82.844 linhas, 82.837 distintas (7 repetidas)"
    tempo: {natureza: serie_diaria, coluna: "DT_NOTIFIC (ano em NU_ANO e ano_sinan, iguais em todas as linhas)", cobertura: "2007–2026 (2026 até 2026-07-03)"}
    territorio: {"nivel": "municipio", "colunas": {"ID_MN_RESI": "município de residência, IBGE de 6 dígitos sem dígito verificador (vazio em 16 linhas)", "ID_MUNICIP": "município de notificação", "SG_UF": "UF de residência (código IBGE de 2 dígitos: '35' = SP, 55.834 linhas)", "SG_UF_NOT": "UF da notificação", "COUFINF / COMUNINF": "UF e município prováveis da infecção: preenchidos em 9% das linhas e em 87% dos confirmados; em 526 dos 3.406 confirmados com município de infecção, ele difere do de residência"}}
    medidas:
      - {expressao: "count(*)", o_que: "notificações (inclui descartados e suspeitos)", unidade: "notificações", soma: sim}
    filtros_tipicos:
      - "ano_sinan = <ano> (BIGINT; NU_ANO é VARCHAR e igual em 100% das linhas, e igual ao ano de DT_NOTIFIC)"
      - "CLASSI_FIN = '1' para casos confirmados (3.895): sentido do código não está em dicionário do espelho (o br_ms_sinan.dicionario não cobre febre amarela), mas é o da ficha do SINAN (1 confirmado, 2 descartado, 8 inconclusivo) e fecha com os dados: 3.427 dos 3.895 confirmados têm CRITERIO '1' (laboratorial, por dedução), 1.124 dos 1.142 óbitos por agravo (EVOLUCAO '2') são '1' e só 2 são '2'; '2' 68.200 (descartado), '8' 4.027 (inconclusivo), vazio 6.722 (sem classificação, mais frequente em 2025-26)"
      - "EVOLUCAO: '1' 58.197, '2' 1.142, '3' 2.900, '9' 3.268 (e vazio); '2' é óbito pelo agravo (98% de 1.142 são confirmados), no padrão das outras fichas do SINAN e conferido com DT_OBITO"
      - "CRITERIO: '1' 44.664 (por dedução, laboratório, pelo peso entre os confirmados), '2' 26.089 (por dedução, clínico-epidemiológico), '3' 198 (196 são descartados; sentido não confirmado), vazio 11.893; DIAGNO_LAB '1', '2', '9' (padrão sim/não/ignorado, não confirmado)"
      - "para onde o caso se infectou, use COUFINF/COMUNINF (só 7.467 linhas preenchidas, 3.406 dos 3.895 confirmados) e TPAUTOCTO (gotcha local_de_infeccao), não SG_UF/ID_MN_RESI"
    use_para: "notificações de febre amarela por município de notificação ou residência e ano (picos 2017–2019 e 2023 são de notificações, não de casos); casos confirmados (CLASSI_FIN = '1'), letalidade e perfil (idade, sexo, raça) dos confirmados; série de confirmados por ano (91 a 409 por ano, 2007–2025)."
    nao_use_para: "contar casos sem filtrar CLASSI_FIN = '1' (4,7% das linhas); dimensionar os surtos de 2017–2018 (186 e 256 confirmados, abaixo do divulgado pelo Ministério); série de confirmados de 2025 e 2026 (1.865 e 1.045 notificações ainda sem classificação); localizar onde a pessoa se infectou pelo município de residência; contar pessoas sem deduplicar (7 linhas repetidas por inteiro, 178 a mais por 8 campos)."
    verificado: "82.844 linhas, 82.837 distintas (hash de todas as colunas); ID_AGRAVO só 'A779'; DT_NOTIFIC de 2007-01-02 a 2026-07-03; NU_ANO = ano_sinan = ano de DT_NOTIFIC em 100%; CLASSI_FIN × CRITERIO: confirmados 3.427 '1' / 390 '2' / 78 vazio; descartados 40.957 '1' / 25.581 '2' / 196 '3' / 1.466 vazio; EVOLUCAO '2' = 1.142 (1.124 confirmados, 2 descartados); confirmados por ano de 91 (2008) a 409 (2024), 116 em 2026 (até julho); TPAUTOCTO preenchido em 3.894 dos 3.895 confirmados e em 10.529 linhas no total (autóctone '1' 7.484, '2' 1.759, '3' 1.286); COUFINF diverge de SG_UF em 558 confirmados; COPAISINF '1' (Brasil, por dedução) em 3.463 confirmados — medido 2026-10-27 e 2026-11-12 (sentido de CLASSI_FIN, EVOLUCAO e CRITERIO corroborado por cruzamento; DIAGNO_LAB e CRITERIO '3' seguem sem fonte)"
