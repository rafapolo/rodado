    chave: "(ano, grupo_idade, sexo): 408 linhas = 408 distintos"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "2012–2019"}
    territorio: {nivel: brasil, colunas: {}}
    medidas:
