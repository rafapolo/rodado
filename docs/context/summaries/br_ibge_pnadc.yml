    grao: "uma pessoa × trimestre da PNAD Contínua (424 colunas; 28 milhões de linhas)"
    chave: "(ano, trimestre, id_pessoa): em ano = 2025, 1.438.445 linhas = 1.438.445 distintos; em 2025-T3, 490.488 linhas e 490.488 id_pessoa"
    tempo: {natureza: serie_de_periodos, coluna: "ano, trimestre", cobertura: "2012-T1–2025-T3 (último trimestre medido em 2025: T3)"}
    territorio: {nivel: uf, colunas: {id_uf: "UF", capital: "capital (sem id_municipio)", rm_ride: "região metropolitana"}}
    medidas:
      - {coluna: V1028, o_que: "peso calibrado da pessoa; soma estima população", unidade: "pessoas", soma: sim}
    filtros_tipicos:
      - "ano = 2025 AND trimestre = 3 (uma partição; nunca count(*), some V1028 — gotcha pesar_por_v1028)"
      - "VD4002 = '1' para ocupados (102,4 mi em 2025-T3 somando V1028), '2' desocupados (6,0 mi); VD4002 é NULL em 258.095 linhas (fora da força de trabalho ou abaixo da idade), 104,5 mi"
    use_para: "mercado de trabalho, renda e demografia por UF, capital e RM, ponderando por V1028"
    nao_use_para: "município (não há id_municipio) ou séries de rendimento real depois de 2021-T4 sem deflator externo; ver gotchas"
    rascunho: [nao_use_para]
    verificado: "2025: T1 472.367, T2 475.590, T3 490.488 linhas; chave confirmada em 2025; VD4002 em 2025-T3 medido — medido 2026-10-27"
