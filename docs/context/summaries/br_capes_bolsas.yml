# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_capes_bolsas
tabelas:
  mobilidade_internacional:
    grao: "um pagamento de bolsa de mobilidade internacional da CAPES (processo de concessão × moeda; um processo aparece em várias linhas, uma por componente/moeda)"
    chave: "nenhuma: id_processo_concessao tem 98.219 distintos em 146.036 linhas (38.613 processos repetem); (id_processo_concessao, sigla_moeda) tem 131.477 distintos; só 64 linhas são cópias exatas"
    tempo: {natureza: serie_de_periodos, coluna: "ano_inicial/mes_inicial até ano_final/mes_final (período da bolsa)", cobertura: "2005–2023"}
    territorio: {nivel: outro, colunas: {pais_destino: "país de destino do bolsista (105 valores)", uf_instituicao_origem: "UF da instituição de origem; também traz estados estrangeiros (ex.: WYOMING)", instituicao_ensino: "instituição de destino"}}
    medidas:
      - {coluna: valor_recebido_total, o_que: "total recebido no processo/moeda da linha; NULL em 7,24% das linhas e não é a soma de bolsa + mensalidade (só 12.946 linhas batem)", unidade: "moeda em sigla_moeda (USD, EUR, BRL, GBP...), sem conversão", soma: nao}
      - {coluna: "valor_recebido_bolsa, valor_recebido_mensalidade, valor_auxilio_*, valor_recebido_*", o_que: "componentes do pagamento (bolsa, mensalidade, instalação, seguro saúde, deslocamento...); quase todos nulos, o significado exato de cada um não está documentado", unidade: "moeda em sigla_moeda", soma: nao}
    filtros_tipicos:
      - "sigla_moeda = 'BRL' para somar valores como reais (8.968 linhas, soma de valor_recebido_total = 203.474.862); somar valor_recebido_total sem filtrar a moeda mistura USD, EUR, GBP etc. (a soma crua é 2.867.482.167, sem sentido)"
      - "nivel_ensino = 'GRADUAÇÃO SANDUÍCHE' (85.548 linhas) ou 'DOUTORADO SANDUÍCHE' (34.089) para as modalidades mais comuns (44 valores no total)"
      - "regexp_full_match(cpf, '[0-9]{11}') para CPF completo (gotcha cpf_completado)"
    use_para: "contar bolsistas, processos e distribuição por país, modalidade, área e período; valores só dentro de uma moeda"
    nao_use_para: "somar valores em reais sem filtrar sigla_moeda, nem contar pessoas com count(*) ou count(DISTINCT cpf) (ver gotcha cpf_completado)"
    rascunho: [use_para, nao_use_para, "interpretação de valor_* como moeda da linha (várias moedas num mesmo processo; medido o BRL, não a conversão)", "significado de cada componente valor_*"]
    verificado: "146.036 linhas; 98.219 id_processo_concessao distintos; 131.477 (processo, moeda); 145.972 linhas distintas; valor_recebido_total nulo em 10.577 — medido 2026-10-27"
