# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_cgu_gas_do_povo
tabelas:
  gas_do_povo:
    grao: "um vale de gás retirado por um beneficiário (CPF) num estabelecimento, numa data de retirada"
    chave: "nenhuma: em ano_mes = '202603' há 7.118.269 linhas para 7.117.429 trincas (cpf_beneficiario, cnpj_estabelecimento, data_retirada_vale), ou seja ~840 linhas repetidas; e o CPF mascarado repete entre pessoas diferentes (gotcha cpf_completado)"
    tempo: {natureza: serie_mensal, coluna: ano_mes, cobertura: "202511–202607 (texto AAAAMM; ano_mes = mes_referencia em 202603)"}
    territorio: {nivel: municipio, colunas: {uf: "UF", codigo_municipio_siafi: "código SIAFI de 4 dígitos, não é IBGE", nome_municipio: "nome do município"}}
    medidas:
      - {coluna: valor_beneficio, o_que: "valor do vale retirado", unidade: "R$", soma: sim}
      - {expressao: "count(*)", o_que: "vales retirados", unidade: "vales", soma: sim}
      - {coluna: quantidade_pessoas_familia, o_que: "tamanho da família do beneficiário (1 a 16)", unidade: "pessoas", soma: nao}
    filtros_tipicos: ["ano_mes = '202603': texto AAAAMM; tabela tem 20,8 milhões de linhas, filtre o mês", "periodo_validade_vale_meses = '3': texto, valores '2' ou '3'", "regexp_full_match(cpf_beneficiario, '[0-9]{11}'): só CPFs completos (gotcha cpf_completado)"]
    use_para: "somar retiradas de vale de gás por mês, UF, município ou estabelecimento (cnpj_estabelecimento)."
    nao_use_para: "contar famílias com count(DISTINCT cpf_beneficiario): CPF mascarado conta como pessoa; e não há chave para deduplicar vales."
    rascunho: [use_para, nao_use_para]
    verificado: "20.817.231 linhas; em 202603: 7.118.269 linhas, 5.361.717 CPFs distintos, R$ 724.948.563; soma por ano_mes: 202511 R$ 69,0 mi ... 202607 R$ 384,1 mi (8 meses; falta 202512) — medido 2026-10-27"
