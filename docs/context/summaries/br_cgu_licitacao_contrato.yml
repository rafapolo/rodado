# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_cgu_licitacao_contrato
tabelas:
  licitacao:
    grao: "uma licitação (ou dispensa/inexigibilidade) de uma unidade gestora, no estado em que foi publicado o resultado"
    chave: "nenhuma: 1.715.344 linhas (todas distintas) para 99.361 id_licitacao e 1.354.764 pares (id_licitacao, id_unidade_gestora); id_licitacao se repete entre unidades gestoras"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "2013–2023; ano e mes saem de data_resultado_compra (coincidem em 100% das linhas)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE de 7 dígitos da unidade gestora (nulo em 1,36%)", sigla_uf: "UF da unidade gestora (nula em 1,16%)"}}
    medidas:
      - {coluna: valor_licitacao, o_que: "valor da licitação; tem outliers absurdos (3 linhas acima de R$ 100 bi), a soma total é R$ 4.423,5 bi e cai para R$ 666,1 bi sem essas 3", unidade: "R$", soma: sim}
    filtros_tipicos: ["modalidade_compra = 'Dispensa de Licitação' (id_modalidade_compra = '6', 1.108.354 linhas) ou 'Pregão' ('5', 167.018) ou 'Inexigibilidade de Licitação' ('7', 230.046) ou 'Pregão - Registro de Preço' ('-99', 196.668): ids são texto", "situacao_licitacao = 'Encerrado' (1.106.755 linhas); 39 situações, algumas truncadas ('Evento de Resultado de Julgame')", "valor_licitacao < 1e11: tira os outliers antes de somar"]
    use_para: "contar licitações e dispensas por órgão, UF, município, modalidade e ano."
    nao_use_para: "somar valor_licitacao sem tirar outliers, ou usar count(*) como número de licitações (use count(DISTINCT id_licitacao, id_unidade_gestora))."
    rascunho: [use_para, nao_use_para]
    verificado: "1.715.344 linhas, 99.361 id_licitacao, 1.354.764 pares com UG, linhas todas distintas; soma por ano em R$ bi: 2013 43,7; 2015 225,0; 2020 2.488,9; 2021 1.259,2; 2023 53,3; 3 linhas > R$ 100 bi — medido 2026-10-27"
  licitacao_item:
    grao: "um item de uma licitação, com o vencedor, a quantidade e o valor"
    chave: "nenhuma: em ano = 2023, 712.789 linhas para 710.214 trincas (id_licitacao, id_unidade_gestora, id_item)"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "2013–2023 (2023 vai até o mês 10)"}
    territorio: {nivel: nenhum, colunas: {id_unidade_gestora: "código SIAFI da unidade gestora", id_orgao: "código do órgão"}}
    medidas:
      - {coluna: valor_item, o_que: "valor do item; tem outliers gigantes (soma de 2015 R$ 66.241 bi, de 2020 R$ 18.056 bi, de 2023 R$ 5.184 bi contra ~R$ 100 bi nos outros anos)", unidade: "R$", soma: sim}
      - {coluna: quantidade_item, o_que: "quantidade do item", unidade: "unidades do item (variam)", soma: nao}
    filtros_tipicos: ["ano = 2023: a tabela tem 14,1 milhões de linhas", "modalidade = 'Pregão - Registro de Preço' (id_modalidade '-99'): 535.743 das 712.789 linhas de 2023", "valor_item < 1e10: tira outliers antes de somar"]
    use_para: "ver o que foi comprado (descricao_item) e quem ganhou (cpf_cnpj_vencedor) por licitação."
    nao_use_para: "somar valor_item de anos inteiros sem tratar outliers; e contar licitações por count(*)."
    rascunho: [use_para, nao_use_para]
    verificado: "14.145.107 linhas; 2023: 712.789 linhas, 710.214 trincas distintas; linhas por ano de 2.058.293 (2013) a 712.789 (2023) — medido 2026-10-27"
  licitacao_participante:
    grao: "um participante (CPF/CNPJ) de um item de uma licitação, com indicador de vencedor"
    chave: "nenhuma: em ano = 2023 e mes = 10, 301.213 linhas para 300.181 quádruplas (id_licitacao, id_unidade_gestora, id_item_compra, cpf_cnpj_participante)"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "2013–2023 (2023 vai até o mês 10)"}
    territorio: {nivel: nenhum, colunas: {id_unidade_gestora: "código SIAFI da unidade gestora", id_orgao: "código do órgão"}}
    medidas:
      - {coluna: vencedor, o_que: "booleano: o participante ganhou o item (27% das linhas na amostra do perfil)", unidade: "booleano", soma: nao}
    filtros_tipicos: ["ano = 2023 AND mes = 10: tabela com 74,4 milhões de linhas, filtre a partição", "vencedor = true: só os vencedores", "cpf_cnpj_participante = '<14 dígitos>' em coluna crua, sem função (gotcha ordenada_pela_chave); 94% dos participantes de 2023-10 têm 14 dígitos (CNPJ) e 0,2% 11 (CPF)"]
    use_para: "ver concorrência por item: quantos participaram, quem perdeu e quem ganhou."
    nao_use_para: "total gasto: a tabela não tem valor; use licitacao_item."
    rascunho: [use_para, nao_use_para]
    verificado: "74.372.781 linhas, 2013–2023 (9,6 milhões em 2013 a 3,5 milhões em 2023); 2023-10: 301.213 linhas, 300.181 quádruplas distintas, 81.402 vencedores — medido 2026-10-27"
  licitacao_empenho:
    grao: "um empenho ligado a uma licitação (nota de empenho emitida)"
    chave: "id_empenho quase único: 7.430.965 linhas para 7.429.201 id_empenho distintos"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "2013–2023; 97% das linhas até 2020 (2021: 10.902, 2022: 1.478, 2023: 1.688); data_emissao de 2014-01-01 a 2024-07-29"}
    territorio: {nivel: nenhum, colunas: {id_unidade_gestora: "código SIAFI da unidade gestora"}}
    medidas:
      - {coluna: valor, o_que: "valor do empenho", unidade: "R$", soma: sim}
    filtros_tipicos: ["ano = 2019: inteiro; a tabela tem 7,4 milhões de linhas", "modalidade = 'Pregão - Registro de Preço' (id_modalidade '-99') aparece em 2023"]
    use_para: "ligar licitações aos empenhos e somar quanto foi empenhado em cada uma."
    nao_use_para: "análise recente: a cobertura cai muito a partir de 2021."
    rascunho: [use_para, nao_use_para]
    verificado: "7.430.965 linhas, 7.429.201 id_empenho distintos, soma R$ 332,0 bi; linhas por ano 1.081.859 (2013) a 1.688 (2023); em ano = 2023 as 1.688 trincas (id_empenho, id_licitacao, id_unidade_gestora) são distintas — medido 2026-10-27"
  contrato_compra:
    grao: "um contrato de compra do governo federal, no registro publicado no DOU em ano/mes"
    chave: "nenhuma: 498.207 linhas (497.719 distintas) para 57.890 id_contrato; (id_contrato, id_unidade_gestora) dá 488.526 pares"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "2013–2026; ano e mes = ano e mês de data_publicacao_dou (100% das linhas)"}
    territorio: {nivel: nenhum, colunas: {id_unidade_gestora: "unidade gestora do contrato", id_orgao: "órgão"}}
    medidas:
      - {coluna: valor_inicial_compra, o_que: "valor inicial do contrato; tem outliers (2013: soma R$ 16.229 bi por um valor de R$ 16 trilhões)", unidade: "R$", soma: sim}
      - {coluna: valor_final_compra, o_que: "valor final com aditivos; tem outliers (2021: R$ 51.385 bi) e 182 linhas negativas; sem a linha acima de R$ 100 bi a soma total é R$ 1.064 bi", unidade: "R$", soma: sim}
    filtros_tipicos: ["modalidade = 'Pregão - Registro de Preço' (128.544 linhas) ou 'Dispensa de Licitação' (62.212) ou 'Sem Informação' (131.003; 26,5% das linhas): texto", "situacao_contrato = 'Publicado' (163.359) ou 'Não se aplica' (265.835): 17 situações, algumas truncadas ('Sem informaçã')", "valor_final_compra < 1e11: tira outliers antes de somar"]
    use_para: "contar e somar contratos por órgão, contratado (cpf_cnpj_contratado) e modalidade."
    nao_use_para: "somar valores sem tirar outliers, ou ler data_assinatura_contrato como data confiável (vai de 1980 a 2103)."
    rascunho: [use_para, nao_use_para]
    verificado: "498.207 linhas, 497.719 distintas, 57.890 id_contrato, 488.526 pares com UG; soma de valor_final por ano em R$ bi: 2017 135,2; 2021 51.385,5; 2024 115,5 — medido 2026-10-27"
  contrato_item:
    grao: "um item de um contrato de compra (descrição, quantidade e valor)"
    chave: "nenhuma: 1.620.478 linhas para 1.499.829 combinações (id_contrato, id_ug, id_item, ano, mes), 1.581.949 linhas distintas"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "2013–2026"}
    territorio: {nivel: nenhum, colunas: {id_ug: "unidade gestora", id_orgao: "órgão"}}
    medidas:
      - {coluna: valor_item, o_que: "valor do item; 4 linhas passam de R$ 10 bi em valor absoluto (soma total R$ 1.980 bi) e há negativos", unidade: "R$", soma: sim}
      - {coluna: quantidade_item, o_que: "quantidade do item; pode ser negativa", unidade: "unidades do item (variam)", soma: nao}
    filtros_tipicos: ["ano = 2023: inteiro", "abs(valor_item) < 1e10: tira outliers antes de somar"]
    use_para: "ver o que cada contrato compra (descricao_item) e quanto custa por item."
    nao_use_para: "somar valor_item sem tratar outliers; ligar contratos só por id_contrato (use id_contrato + id_ug)."
    rascunho: [use_para, nao_use_para]
    verificado: "1.620.478 linhas, 1.258.754 id_item distintos, 1.581.949 linhas distintas — medido 2026-10-27"
  contrato_termo_aditivo:
    grao: "um termo aditivo de um contrato (alteração de prazo ou valor), com o objeto"
    chave: "nenhuma: 424.383 linhas para 419.141 trincas (id_contrato, id_ug, id_termo_aditivo); id_termo_aditivo sozinho tem só 11.145 valores distintos (não identifica)"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "2013–2026; data_publicacao_dou de 2003 a 9999-12-31 (valor sentinela)"}
    territorio: {nivel: nenhum, colunas: {id_ug: "unidade gestora", id_orgao: "órgão"}}
    filtros_tipicos: ["ano = 2023: inteiro", "data_publicacao_dou < '2100-01-01': tira a data sentinela 9999-12-31"]
    use_para: "contar aditivos por contrato e ler o objeto de cada um."
    nao_use_para: "valores: a tabela não tem valor, só texto do objeto."
    rascunho: [use_para, nao_use_para]
    verificado: "424.383 linhas, 422.682 distintas, 419.141 trincas distintas, 11.145 id_termo_aditivo distintos — medido 2026-10-27"
  contrato_apostilamento:
    grao: "um apostilamento (reajuste ou ajuste administrativo) de um contrato"
    chave: "nenhuma: 9.714 linhas para 9.708 trincas (id_contrato, id_unidade_gestora, id_apostilamento); id_apostilamento sozinho tem 1.150 valores"
    tempo: {natureza: serie_de_periodos, coluna: data_apostilamento, cobertura: "2006-12-26–2018-07-31 (ano 2013–2018)"}
    territorio: {nivel: nenhum, colunas: {id_unidade_gestora: "unidade gestora", id_orgao: "órgão"}}
    medidas:
      - {coluna: valor_apostilamento, o_que: "valor do apostilamento", unidade: "R$", soma: sim}
    filtros_tipicos: ["situacao_apostilamento = 'Encerrado' (9.363 linhas); outros: 'Efetivado' (202), 'Pendente' (148), 'Em Encerramento' (1)"]
    use_para: "somar reajustes de contratos entre 2013 e 2018."
    nao_use_para: "período recente: a tabela termina em 2018."
    rascunho: [use_para, nao_use_para]
    verificado: "9.714 linhas, todas distintas, 9.708 trincas distintas, 1.150 id_apostilamento — medido 2026-10-27"
