# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: world_wb_mides
tabelas:
  dicionario:
    grao: "uma linha por (id_tabela, nome_coluna, chave) com o texto do código (valor)"
    use_para: "traduzir códigos de licitacao, licitacao_participante e empenho; não distingue UF, então um código pode valer diferente entre estados (não conferido)"
  orgao_unidade_gestora:
    ultima_data: "2022"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um órgão/unidade gestora de um município ou estado (cadastro), sem controle de ano"
    chave: "nenhuma: (sigla_uf, id_municipio, orgao, id_unidade_gestora) tem 291.769 distintos em 341.573 linhas"
    tempo: {natureza: sem_tempo, coluna: ano, cobertura: "ano 2002–2022 mas 83,4% nulo"}
    territorio: {nivel: municipio, colunas: {sigla_uf: "UF (MG 279.929, RJ 47.934, CE, SP, PE, DF, RS, PR, PB)", id_municipio: "código IBGE 7 dígitos", orgao: "código local do órgão", id_unidade_gestora: "código local da unidade; 13,65% nulo"}}
    filtros_tipicos: ["esfera = 'municipal' (54.532) ou 'estadual' (421); 83,9% nulo"]
    use_para: "nomes de órgão e unidade gestora (nome_orgao, nome_unidade_gestora)"
    nao_use_para: "juntar por id_unidade_gestora sozinho: o código é local de cada ente"
    rascunho: [use_para, nao_use_para]
    verificado: "341.573 linhas; chave candidata 291.769 distintos — medido 2026-10-27"
  licitacao:
    ultima_data: "2026"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um processo licitatório ou dispensa/inexigibilidade, em um município de MG, PR, RS, CE, PE ou PB"
    chave: "nenhuma garantida: id_licitacao_bd tem 2.839.279 distintos em 2.842.166 linhas (2.887 repetidas); (id_licitacao_bd, id_municipio, sigla_uf) 2.839.405; sem linhas inteiras duplicadas"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "2009–2026 (CE 2009–2021, PR 2013–2021, RS 2016–2021, PE 2012–2021, PB 2014–2021, MG 2014–2026)"}
    territorio: {nivel: municipio, colunas: {sigla_uf: "UF", id_municipio: "IBGE 7 dígitos", id_unidade_gestora: "unidade local"}}
    medidas:
      - {coluna: valor, o_que: "valor da licitação; 44,6% nulo no slice MG 2026; máximo 6,18e12 (outlier)", unidade: "R$", soma: sim}
      - {coluna: valor_corrigido, o_que: "valor corrigido (igual a valor no slice MG 2026)", unidade: "R$", soma: sim}
    filtros_tipicos:
      - "modalidade = '8' (Dispensa, 719.804), '5' (Pregão Presencial, 616.226), '4' (Pregão, 432.096), '10' (Inexigibilidade, 406.122), '6' (Pregão Eletrônico, 263.890) segundo o dicionário; 23.631 nulos"
      - "situacao: 59,4% nulo (1.688.080 de 2.842.166); preenchida só em parte das UFs, quais não medido; '1' = Concluída no dicionário"
      - "estagio: 77,6% nulo (2.204.793); '7' = Adjudicado/Homologado (187.508) no dicionário"
      - "natureza_objeto = '2' (Compras e Serviços) domina no slice MG 2026; dicionário em world_wb_mides.dicionario"
    use_para: "contar e valorar processos licitatórios por município, UF, ano e modalidade"
    nao_use_para: "somar valor sem tratar nulos/outliers, ou comparar modalidade entre UFs sem checar o código (dicionário único para 6 UFs)"
    rascunho: [use_para, nao_use_para, vigência dos códigos entre UFs]
    verificado: "2.842.166 linhas; 2.839.279 id_licitacao_bd distintos; UFs MG 1.062.241, PR 735.632, RS 417.348, CE 273.719, PE 220.025, PB 133.201; 0 linhas duplicadas — medido 2026-10-27"
  licitacao_item:
    ultima_data: "2021"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um item (ou lote) de uma licitação ou dispensa"
    chave: "nenhuma: no arquivo 000000000150 (MG 2019) id_item_bd tem 226.378 distintos em 226.560 linhas; não medido na tabela inteira (50,3M linhas)"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "2009–2021 (amostra 0,3% só MG, PR, CE, RS)"}
    territorio: {nivel: municipio, colunas: {sigla_uf: "UF", id_municipio: "IBGE 7 dígitos"}}
    medidas:
      - {coluna: valor_total, o_que: "quantidade × valor_unitario (diferença 0 no arquivo MG 2019); 48,7% nulo no slice 2021", unidade: "R$", soma: sim}
      - {coluna: quantidade, o_que: "quantidade; 60% nulo no slice 2021", unidade: "unidade de medida do item", soma: nao}
      - {coluna: valor_unitario, o_que: "preço unitário", unidade: "R$", soma: nao}
    filtros_tipicos: ["ano = 2021 ou outro ano fixo (50 milhões de linhas)"]
    use_para: "preços unitários e itens comprados; nome_vencedor e documento (CPF/CNPJ sem zeros à esquerda, ver column_codes)"
    nao_use_para: "somar quantidade entre unidades de medida diferentes"
    rascunho: [use_para, nao_use_para]
    verificado: "50.287.199 linhas; arquivo MG 2019 226.560 linhas, 226.378 id_item_bd; valor_total = quantidade × valor_unitario em 100% das linhas com valor — medido 2026-10-27"
  licitacao_participante:
    ultima_data: "2026"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um participante (CNPJ/CPF) de uma licitação ou dispensa"
    chave: "nenhuma: (id_licitacao_bd, documento) tem 5.719.688 distintos em 5.782.572 linhas"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "2009–2026 (CE 2009–2021, PE 2012, PR 2013, PB 2014, MG 2014–2026, RS 2016)"}
    territorio: {nivel: municipio, colunas: {sigla_uf: "UF (MG 1.719.351, PR 1.569.229, RS 912.823, CE 652.998, PE 651.047, PB 277.124)", id_municipio: "IBGE 7 dígitos"}}
    medidas:
      - {coluna: vencedor, o_que: "1 = vencedor, 0 = não vencedor (dicionário); 1 em 4,16M linhas", unidade: "0/1", soma: sim}
      - {coluna: habilitado, o_que: "1 habilitado, 0 não habilitado; 1,56M nulos", unidade: "0/1", soma: sim}
    filtros_tipicos:
      - "vencedor = 1 (BIGINT, sem aspas): 2.921 vencedores com habilitado = 0 e 1.323.592 com habilitado NULL"
      - "tipo: dicionário diz 1 = PJ, 2 = PF, mas no slice MG 2026 o valor é o texto 'CNPJ'; não medido nas outras UFs"
    use_para: "quem disputa e ganha licitações; juntar por documento (CNPJ) e id_licitacao_bd"
    nao_use_para: "contar empresas sem DISTINCT documento (linhas repetem)"
    rascunho: [use_para, nao_use_para]
    verificado: "5.782.572 linhas; (id_licitacao_bd,documento) 5.719.688 distintos; vencedor×habilitado medido por combinação — medido 2026-10-27"
  relacionamentos:
    ultima_data: "2021"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um par empenho × licitação (ligação entre despesa e processo licitatório), só PR"
    chave: "nenhuma: (id_empenho, id_licitacao, id_municipio) tem 13.782.967 distintos em 20.592.522 linhas; sem linhas inteiras duplicadas"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "2013–2021"}
    territorio: {nivel: municipio, colunas: {sigla_uf: "só PR", id_municipio: "IBGE 7 dígitos"}}
    filtros_tipicos: ["sigla_uf = 'PR' (única UF)"]
    use_para: "ligar empenhos de PR a licitações"
    nao_use_para: "cobertura nacional ou contar empenhos sem DISTINCT"
    rascunho: [use_para, nao_use_para]
    verificado: "20.592.522 linhas, só PR; 13.782.967 triplas distintas; 0 linhas inteiras repetidas — medido 2026-10-27"
  empenho:
    ultima_data: "2024-01-10"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um empenho (reserva de despesa) ou movimento do empenho (reforço/anulação) de um município ou estado"
    chave: "nenhuma: em 3 arquivos (SP 2015, PB 2011, MG 2014) id_empenho_bd tem 587.812 distintos em 590.680 linhas (PB 2011: 138.635 em 139.292, pares com anulação diferentes); não medido na tabela inteira (303M linhas)"
    tempo: {natureza: serie_diaria, coluna: data, cobertura: "ano 1989–2024 (estatística dos arquivos); UFs na amostra 0,3%: SP, RS, MG, PR, PB, RJ, PE, SC, CE, DF"}
    territorio: {nivel: municipio, colunas: {sigla_uf: "UF", id_municipio: "IBGE 7 dígitos", orgao: "código local do órgão", funcao: "função de governo (dicionário: '10' Saúde, '12' Educação, '4' Administração…)"}}
    medidas:
      - {coluna: valor_final, o_que: "valor do empenho; valor_inicial + valor_reforco - valor_anulacao + valor_ajuste não bate em 5.273 de 139.292 linhas (PB 2011); 125 negativos em 590.680", unidade: "R$", soma: sim}
      - {coluna: valor_inicial, o_que: "valor inicial; preenchido em quase todas as linhas dos 3 arquivos", unidade: "R$", soma: sim}
      - {coluna: valor_anulacao, o_que: "anulação; diferente de zero em 32.879 de 590.680", unidade: "R$", soma: sim}
    filtros_tipicos:
      - "ano = <ano> e sigla_uf = '<UF>' (os arquivos são por UF e ano); a tabela tem 303 milhões de linhas"
      - "funcao = '10' (Saúde), '12' (Educação): VARCHAR, dicionário em world_wb_mides.dicionario"
    use_para: "despesa empenhada por município, função e elemento de despesa"
    nao_use_para: "total pago ao credor (use pagamento) e comparar valores de empenho entre UFs sem checar a cobertura do ano"
    rascunho: [use_para, nao_use_para]
    verificado: "303.323.046 linhas; ano 1989–2024; 3 arquivos 590.680 linhas, 587.812 id_empenho_bd — medido 2026-10-27"
  liquidacao:
    ultima_data: "2023-08-31"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma liquidação (reconhecimento da despesa) de um município ou estado"
    chave: "nenhuma garantida: no arquivo PR 2013 id_liquidacao_bd tem 146.200 distintos em 146.200 linhas; não medido na tabela inteira (357M linhas)"
    tempo: {natureza: serie_diaria, coluna: data, cobertura: "ano 1992–2024; amostra: SP, RS, MG, PR, PB, PE, CE, RJ, SC, DF"}
    territorio: {nivel: municipio, colunas: {sigla_uf: "UF", id_municipio: "IBGE 7 dígitos"}}
    medidas:
      - {coluna: valor_final, o_que: "valor liquidado; 0 negativos no arquivo PR 2013", unidade: "R$", soma: sim}
    filtros_tipicos: ["ano = <ano> e sigla_uf = '<UF>' (357M linhas)"]
    use_para: "despesa liquidada por município e ano"
    nao_use_para: "totais nacionais sem checar a cobertura por UF e ano"
    rascunho: [use_para, nao_use_para]
    verificado: "357.301.758 linhas; arquivo PR 2013 146.200 linhas, 146.200 id_liquidacao_bd — medido 2026-10-27"
  pagamento:
    ultima_data: "2023-09-22"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um pagamento a um credor, de um município ou estado"
    chave: "nenhuma garantida: no arquivo PR 2019 id_pagamento_bd tem 239.008 distintos em 239.008 linhas; não medido na tabela inteira (393M linhas)"
    tempo: {natureza: serie_diaria, coluna: data, cobertura: "ano 1994–2024; amostra: RS, SP, MG, PR, PB, PE, RJ, CE, SC, DF"}
    territorio: {nivel: municipio, colunas: {sigla_uf: "UF (163 linhas da amostra sem UF)", id_municipio: "IBGE 7 dígitos"}}
    medidas:
      - {coluna: valor_final, o_que: "valor do pagamento; é a medida somável do pagamento em todas as UFs", unidade: "R$", soma: sim}
      - {coluna: valor_liquido_recebido, o_que: "valor líquido recebido; vale 0 em quase todas as linhas de RS, PR, PE, CE, SP (97,8% a 100% na amostra), só confiável em MG, PB, RJ, SC, DF", unidade: "R$", soma: nao}
    filtros_tipicos:
      - "ano = <ano> e sigla_uf = '<UF>' (393M linhas)"
      - "documento_credor sem os sentinelas 99999999999 / 00000000000000 / 99999999999999 (ver column_codes)"
    use_para: "quanto cada município pagou, por credor e ano (valor_final)"
    nao_use_para: "somar valor_liquido_recebido (zerado em 5 UFs) ou rankear credor sem tirar os sentinelas"
    observacoes: ["valor_final ≠ valor_liquido_recebido em 239.003 de 239.008 linhas de PR 2019"]
    rascunho: [use_para, nao_use_para]
    verificado: "392.731.053 linhas; arquivo PR 2019 239.008 linhas, 239.008 id_pagamento_bd; valor_liquido_recebido = 0 em 100% de RS, PR, PE, CE na amostra 0,3% — medido 2026-10-27"
