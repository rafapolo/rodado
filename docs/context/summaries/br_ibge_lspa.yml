# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ibge_lspa
tabelas:
  sidra:
    grao: 'uma célula do SIDRA: uma tabela × localidade (Brasil ou UF) × período × variável × combinação de categorias
      das classificações'
    chave: id_tabela, id_localidade, periodo, id_variavel, id_categoria_1, id_categoria_2
    tempo:
      natureza: serie_mensal
      coluna: periodo (VARCHAR)
      cobertura: '202110–202609 (levantamentos mensais; 7878: 202110–202512 só out–dez de cada ano; 1618 e 188:
        só 202609; 7832: só 202512)'
    territorio:
      nivel: uf
      colunas:
        id_nivel: '''1'' = Brasil (id_localidade ''1''), ''3'' = Unidade da Federação'
        id_localidade: 'código IBGE da UF em VARCHAR (ex.: ''11'' Rondônia, ''12'' Acre, ''51'' Mato Grosso) ou
          ''1'' para Brasil'
        localidade: nome da UF ou Brasil
    medidas:
    - coluna: valor
      o_que: 'dado do SIDRA: um número por célula; unidade na coluna unidade (rendimento em kg/ha, produção em t,
        áreas em ha); a tabela 1618 tem 56 linhas de Produção com unidade vazia'
      unidade: 'varia por linha: ver coluna `unidade` (e `variavel`)'
      soma: nao
    filtros_tipicos:
    - 'id_tabela decide a forma: 7878 (prognóstico, periodos 202110–202512, só meses 10–12 de cada ano; id_categoria_1/categoria_1
      é o PRODUTO, categoria_2 nula), 7832 (periodo 202512, categoria_1 = ''Safra …'', categoria_2 = produto), 1618
      (periodo 202609, categoria_1 = ''Safra 2025'' ou ''Safra 2026'', categoria_2 = produto; cobre área plantada,
      área colhida e produção), 188 (202609, só rendimento médio). Nunca misture id_tabela na mesma soma'
    - periodo é o mês do LEVANTAMENTO (VARCHAR aaaamm), não a safra; filtre um periodo só (o último de cada tabela)
      e diga a qual levantamento o número pertence
    - id_nivel = '1' Brasil, '3' UF; não há município (ver gotcha so_uf_e_mensal)
    - 'variavel: ''Área plantada'' (id 109), ''Área colhida'' (216), ''Produção'' (35), ''Rendimento médio'' (36);
      unidade ''Hectares'', ''Toneladas'', ''Quilogramas por Hectare'''
    - 'produto em categoria_1 (7878) ou categoria_2 (1618, 7832) com prefixo de numeração, ex.: ''1.17 Soja''; as
      linhas 0 (Total) e 39428 (''1 Cereais, leguminosas e oleaginosas'') são agregados (ver gotcha produto_em_safras)'
    - 'valor IS NOT NULL: nulo vem sempre com simbolo ''...'' ou ''..'''
    use_para: 'Estimativa mensal da safra por UF e Brasil: área plantada/colhida, produção e rendimento previstos
      de cada produto.'
    nao_use_para: Não é produção realizada nem tem município (use br_ibge_pam para o realizado); não some rendimento
      médio nem some tabelas ou produtos agregados com seus componentes.
    rascunho:
    - use_para
    - nao_use_para
    - o significado exato do símbolo ".." e "..." (só medido que o valor é nulo)
    verificado: '76720 linhas = 76720 distintos de (id_tabela, id_localidade, periodo, id_variavel, id_categoria_1,
      id_categoria_2); por tabela: 7878=60480, 7832=8064, 1618=6216, 188=1960 linhas; 27 UFs + Brasil; 2744 valores
      NULOS, todos com simbolo (''...'' 2688, ''..'' 56) — medido 2026-10-27'
  sidra_tabelas:
    grao: 'uma tabela do SIDRA espelhada (metadado): título, período, variáveis, classificações e quantas linhas
      entraram em `sidra`'
    chave: id_tabela
    use_para: Descobrir qual id_tabela responde à pergunta (título, período, linhas) antes de consultar `sidra`;
      linhas = 0 ou no_espelho = false significam tabela sem dados no banco.
    rascunho:
    - use_para
    verificado: '5 linhas = 5 id_tabela distintos — medido 2026-10-27. Tabela 6588 (série histórica 200609–202609)
      tem 0 linhas em `sidra`: fora do espelho por passar de 1.268.624 células em UF (teto 1.000.000).'
