# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ms_cnes
tabelas:
  dicionario:
    grao: "um código (id_tabela, nome_coluna, chave) → valor: significado dos códigos das tabelas do CNES"
    use_para: "traduzir códigos (tipo_unidade, tipo_leito, tipo_equipe, tipo_equipamento etc.); consulte antes de filtrar por código."
  estabelecimento:
    grao: "um estabelecimento de saúde × mês (cadastro completo no retrato do mês)"
    chave: "ano, mes, id_estabelecimento_cnes (465.866 linhas = 465.866 distintos em 2025-08)"
    tempo: {natureza: soma_de_retratos, coluna: "ano, mes", cobertura: "2005-08–2025-08 (sem 2026)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos", id_municipio_6: "IBGE 6 dígitos", sigla_uf: "UF", id_regiao_saude: "região de saúde"}}
    medidas:
      - {coluna: "indicador_* (atenção ambulatorial/hospitalar, vínculo SUS, serviços de apoio, atendimentos por convênio), quantidade_* (consultórios, salas, leitos de repouso/recuperação/neonatal por instalação)", o_que: "0/1 ou contagem de instalações do estabelecimento no mês", unidade: "0/1 ou unidades", soma: sim}
    filtros_tipicos:
      - "ano = 2025 AND mes = 8 para o retrato mais recente; sem fixar mes cada estabelecimento aparece uma vez por mês"
      - "indicador_vinculo_sus = 1 para estabelecimentos que atendem pelo SUS (124.412 de 465.866 em 2025-08)"
      - "situacao_cadastral_codigo = '2' (Ativa; 234.392) — nulo em 214.767 (46%) e '8' = Baixada (13.938): a ausência de situação não significa inativo"
      - "tipo_unidade = '2' UBS, '5' hospital geral, '7' hospital especializado, '22' consultório isolado (maior grupo), '36' clínica/ambulatório especializado, '45' unidade de saúde da família; significados no dicionario"
      - "indicador_atencao_hospitalar = 1 (10.395) para estabelecimentos com atenção hospitalar"
    use_para: "contar e caracterizar estabelecimentos de saúde por município, tipo de unidade, gestão e vínculo SUS, num mês."
    nao_use_para: "contar estabelecimentos somando meses; leitos por especialidade (use leito); profissionais (use profissional); tipo_esfera_administrativa e tipo_natureza_administrativa."
    rascunho: [use_para, nao_use_para]
    verificado: "partição 2025-08: 465.866 linhas, 465.866 distintos de id_estabelecimento_cnes; tipo_esfera_administrativa tem M 449.740 / E 13.822 / D 2.303 / F 1, idêntico a tipo_gestao (M/E/D), códigos que o dicionario marca como 'Não encontrado' — não é esfera federal/estadual/municipal/privada; tipo_natureza_administrativa 100% nulo; não há ano 2026 nesta tabela — medido 2026-10-27"
  equipe:
    grao: "uma equipe de saúde (ESF, ESB, eAP, eMulti etc.) × mês, vinculada a um estabelecimento"
    chave: "ano, mes, id_equipe (123.307 linhas = 123.307 distintos de id_equipe em 2026-02)"
    tempo: {natureza: soma_de_retratos, coluna: "ano, mes", cobertura: "2007-04–2026-02"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos", sigla_uf: "UF", id_estabelecimento_cnes: "estabelecimento da equipe", area: "nome da área", id_segmento: "código do segmento territorial"}}
    medidas:
      - {coluna: "count(*) ou count(distinct id_equipe)", o_que: "nº de equipes no retrato do mês", unidade: "equipes", soma: nao}
    filtros_tipicos:
      - "ano_desativacao_equipe = 9000 para equipes ainda abertas (sentinela, não é ano); com tipo_desativacao_equipe = '0' (equipe ainda ativa) são 119.410 em 2026-02; 3.141 têm '1' (temporária) e 751 '2' (definitiva) com ano de desativação preenchido"
      - "tipo_equipe = '70' ESF (57.149), '71' ESB saúde bucal (43.615), '72' eNASF-AP/núcleo ampliado (9.149), '76' eAP atenção primária (7.152) — significados do dicionario"
      - "ano = 2026 AND mes = 2 (mais recente); fixe o mês ou a mesma equipe repete a cada mês"
    use_para: "contar equipes de atenção primária por município e tipo, no mês, e acompanhar ativação/desativação."
    nao_use_para: "contar profissionais (use profissional) ou população coberta (use br_ms_atencao_basica)."
    rascunho: [use_para, nao_use_para]
    verificado: "partição 2026-02: 123.307 linhas, 123.307 distintos de id_equipe; 14.556.313 linhas no total — medido 2026-10-27"
  equipamento:
    grao: "um estabelecimento × tipo de equipamento × mês (quantidade existente e em uso)"
    chave: "nenhuma: 1.185.947 linhas e 1.185.637 distintos de (id_estabelecimento_cnes, id_equipamento, tipo_equipamento) em 2025-08 (310 linhas repetem; incluir indicador_equipamento_disponivel_sus deixa 291)"
    tempo: {natureza: soma_de_retratos, coluna: "ano, mes", cobertura: "2005-08–2025-08"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos", sigla_uf: "UF", id_estabelecimento_cnes: "estabelecimento"}}
    medidas:
      - {coluna: quantidade_equipamentos, o_que: "equipamentos existentes (VARCHAR: use CAST para número)", unidade: "equipamentos", soma: sim}
      - {coluna: quantidade_equipamentos_ativos, o_que: "equipamentos em uso (VARCHAR: use CAST)", unidade: "equipamentos", soma: sim}
    filtros_tipicos:
      - "ano = 2025 AND mes = 8 (retrato recente); a tabela tem ~153 milhões de linhas, sempre filtre a partição"
      - "indicador_equipamento_disponivel_sus = 1 para equipamento disponível ao SUS (e o oposto em indicador_equipamento_indisponivel_sus = 1; em 2025-08 os dois são complementares)"
      - "id_equipamento = código do equipamento específico (ex.: '17' mamógrafo computadorizado, no dicionario); tipo_equipamento = grupo ('1' diagnóstico por imagem, '5' manutenção da vida, '7' odontologia)"
    use_para: "inventário de equipamentos (mamógrafo, tomógrafo etc.) por estabelecimento e município."
    nao_use_para: "somar meses (cada mês repete o parque); identificar o equipamento só por tipo_equipamento (grupo de 16, não o aparelho)."
    rascunho: [use_para, nao_use_para]
    verificado: "partição 2025-08: 1.185.947 linhas; distintos da chave 1.185.637; id_equipamento tem 98 valores e 116 pares com tipo_equipamento (um id_equipamento pode aparecer em mais de um tipo) — medido 2026-10-27"
  leito:
    grao: "um estabelecimento × especialidade de leito × tipo de leito × mês"
    chave: "ano, mes, id_estabelecimento_cnes, tipo_especialidade_leito, tipo_leito (51.763 linhas = 51.763 distintos em 2025-08)"
    tempo: {natureza: soma_de_retratos, coluna: "ano, mes", cobertura: "2005-10–2026-02"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos", sigla_uf: "UF", id_estabelecimento_cnes: "estabelecimento"}}
    medidas:
      - {coluna: quantidade_total, o_que: "leitos existentes", unidade: "leitos", soma: sim}
      - {coluna: quantidade_sus, o_que: "leitos disponíveis ao SUS (nunca maior que quantidade_total em 2025-08)", unidade: "leitos", soma: sim}
      - {coluna: quantidade_contratado, o_que: "leitos contratados (quase sempre 0: 28 linhas, 155 leitos em 2025-08)", unidade: "leitos", soma: sim}
    filtros_tipicos:
      - "ano = 2026 AND mes = 2 (ou um mês fixo): leitos são retrato mensal, nunca some meses"
      - "tipo_leito = '1' cirúrgico, '2' clínico, '3' complementar, '4' obstétricos, '5' pediátricos, '6' outras especialidades, '7' hospital dia (dicionario)"
      - "tipo_leito IN ('1','2','4','5','6') para leitos de internação gerais; '3' complementar e '7' hospital dia à parte"
    use_para: "leitos hospitalares totais e SUS por município, estabelecimento e tipo."
    nao_use_para: "ocupação ou internações (use br_ms_sih)."
    rascunho: [use_para, nao_use_para]
    verificado: "partição 2025-08: 51.763 linhas, 51.763 distintos da chave; soma quantidade_total por tipo_leito: 1=124.078, 2=176.636, 3=83.119, 4=49.804, 5=46.619, 6=45.874, 7=14.709; quantidade_sus nunca maior que o total — medido 2026-10-27"
  profissional:
    grao: "um vínculo de profissional × estabelecimento × ocupação (CBO) × mês"
    chave: "nenhuma: em 2025-08, 6.350.074 linhas e 6.339.618 distintos de (id_estabelecimento_cnes, cartao_nacional_saude, cbo_2002, tipo_vinculo); 4.410.253 CNS distintos"
    tempo: {natureza: soma_de_retratos, coluna: "ano, mes", cobertura: "2005-08–2025-08"}
    territorio: {nivel: outro, colunas: {id_estabelecimento_cnes: "estabelecimento (todo CNES casa com estabelecimento no mesmo mês)", sigla_uf: "UF"}}
    medidas:
      - {coluna: "carga_horaria_ambulatorial, carga_horaria_hospitalar, carga_horaria_outros", o_que: "horas semanais do vínculo em cada tipo de atendimento", unidade: "horas/semana", soma: sim}
    filtros_tipicos:
      - "ano = 2025 AND mes = 8: a tabela tem ~869 milhões de linhas (~6,3 milhões por mês), sempre filtre a partição"
      - "id_municipio é 100% nulo em 2025-08: junte com estabelecimento por id_estabelecimento_cnes (mesmo ano e mes) para obter o município"
      - "indicador_atende_sus = 1 (4.749.959) atende SUS; indicador_atende_nao_sus = 1 (1.600.114): complementares em quase todas as linhas"
      - "tipo_vinculo é texto de 6 dígitos ('010101' é o mais frequente, 1.182.827); significado no dicionario"
    use_para: "contar vínculos e horas por estabelecimento e (via join) por município, no mês."
    nao_use_para: "contar pessoas distintas sem count(distinct cartao_nacional_saude); somar entre meses; achar município diretamente."
    rascunho: [use_para, nao_use_para]
    verificado: "partição 2025-08: 6.350.074 linhas; 465.864 CNES distintos, todos presentes em estabelecimento; 15 linhas com cartao_nacional_saude = 'nan'; 111 linhas com as 3 cargas horárias zeradas; soma ambulatorial 96.213.820, hospitalar 40.537.926, outros 48.130.324 — medido 2026-10-27"
  servico_especializado:
    grao: "um estabelecimento × serviço especializado (tipo/subtipo) × caracterização × mês"
    chave: "nenhuma: em 2025-08, 1.039.692 linhas e 1.037.780 distintos de (id_estabelecimento_cnes, tipo, subtipo, tipo_caracterizacao); com os 4 indicadores de atendimento ainda 1.038.629"
    tempo: {natureza: soma_de_retratos, coluna: "ano, mes", cobertura: "2005-08–2025-08"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos", sigla_uf: "UF", id_estabelecimento_cnes: "estabelecimento"}}
    filtros_tipicos:
      - "ano = 2025 AND mes = 8: tabela com ~146 milhões de linhas, sempre filtre a partição"
      - "tipo_servico_especializado = '145' laboratório clínico (162.319), '159' atenção primária (100.362), '126' fisioterapia (90.197); subtipos e demais códigos no dicionario"
      - "indicador_servico_ambulatorial_sus = 1 / indicador_servico_hospitalar_sus = 1 para serviço prestado ao SUS"
    use_para: "saber que serviços especializados (laboratório, fisioterapia, etc.) cada estabelecimento declara."
    nao_use_para: "volume de produção (use br_ms_sia/sih); contar sem fixar mês."
    rascunho: [use_para, nao_use_para, quantidade_nacional_estabelecimento_saude_terceiro (100% nulo na amostra)]
    verificado: "partição 2025-08: 1.039.692 linhas; distintos da chave 1.037.780 — medido 2026-10-27"
  habilitacao:
    grao: "uma habilitação concedida a um estabelecimento (tipo_habilitacao × nível × início × portaria) × mês"
    chave: "ano, mes, id_estabelecimento_cnes, tipo_habilitacao, nivel_habilitacao, ano_competencia_inicial, mes_competencia_inicial, portaria (32.600 linhas = 32.600 distintos em 2026-02)"
    tempo: {natureza: soma_de_retratos, coluna: "ano, mes", cobertura: "2007-03–2026-02"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos (nulo se estabelecimento sem município)", sigla_uf: "UF", id_estabelecimento_cnes: "estabelecimento"}}
    medidas:
      - {coluna: quantidade_leitos, o_que: "leitos habilitados", unidade: "leitos", soma: sim}
    filtros_tipicos:
      - "mes_competencia_final = 99 (e ano_competencia_final = 9999) quer dizer 'ainda vigente', não um mês (gotcha competencia_final_99); em 2026-02, 29.694 de 32.600 linhas estão em vigor"
      - "ano = 2026 AND mes = 2 para as habilitações do retrato mais recente; sem fixar mês a mesma habilitação repete"
      - "nivel_habilitacao = '1' federal, '2' local (dicionario)"
    use_para: "habilitações do Ministério/gestor (UTI, oncologia, etc.) por estabelecimento; tipo_habilitacao traduzido no dicionario."
    nao_use_para: "contar leitos existentes (use leito)."
    rascunho: [use_para, nao_use_para]
    verificado: "partição 2026-02: 32.600 linhas, 32.600 distintos da chave; 4.785.178 linhas no total, 4.304.563 delas com mes_competencia_final = 99 (gotcha competencia_final_99) — medido 2026-10-27"
  incentivos:
    grao: "um incentivo financeiro concedido a um estabelecimento (tipo_habilitacao × tipo_incentivo × início × portaria) × mês"
    chave: "ano, mes, id_estabelecimento_cnes, tipo_habilitacao, tipo_incentivo, ano_competencia_inicial, mes_competencia_inicial, portaria (14.293 linhas = 14.293 distintos em 2026-02)"
    tempo: {natureza: soma_de_retratos, coluna: "ano, mes", cobertura: "2007-10–2026-02"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos (0,03% nulo)", sigla_uf: "UF", id_estabelecimento_cnes: "estabelecimento"}}
    filtros_tipicos:
      - "mes_competencia_final = 99 quer dizer vigente (gotcha competencia_final_99)"
      - "tipo_incentivo = '1' federal, '2' local (dicionario)"
      - "ano = 2026 AND mes = 2 para o retrato mais recente"
    use_para: "quais estabelecimentos têm incentivos (tipo_habilitacao 8xxx no dicionario) vigentes."
    nao_use_para: "valores em reais (a tabela não traz valor)."
    rascunho: [use_para, nao_use_para]
    verificado: "partição 2026-02: 14.293 linhas, 14.293 distintos da chave; 1.268.903 linhas no total — medido 2026-10-27"
  regra_contratual:
    grao: "uma regra contratual de um estabelecimento (tipo_habilitacao × tipo_regra × início × portaria) × mês"
    chave: "nenhuma: em 2023-07, 17.031 linhas e 16.727 distintos de (id_estabelecimento_cnes, tipo_habilitacao, tipo_regra_contratual, ano/mes_competencia_inicial, portaria): 304 repetem"
    tempo: {natureza: soma_de_retratos, coluna: "ano, mes", cobertura: "2007-03–2023-07 (parou em 2023-07)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos", sigla_uf: "UF", id_estabelecimento_cnes: "estabelecimento"}}
    filtros_tipicos:
      - "mes_competencia_final = 99 quer dizer vigente (gotcha competencia_final_99)"
      - "tipo_regra_contratual = '1' federal, '2' local (dicionario); a tabela não tem dados depois de 2023-07"
    use_para: "regras contratuais vigentes por estabelecimento até 2023-07."
    nao_use_para: "análises depois de 2023-07 (a série acabou)."
    rascunho: [use_para, nao_use_para]
    verificado: "partição 2023-07: 17.031 linhas, 16.727 distintos da chave candidata; 1.544.420 linhas no total — medido 2026-10-27"
  gestao_metas:
    grao: "um registro de gestão por metas de um estabelecimento (tipo_habilitacao 7001–7009 × tipo × início × portaria) × mês"
    chave: "ano, mes, id_estabelecimento_cnes, tipo_habilitacao, tipo_gestao_metas, ano/mes_competencia_inicial, portaria (824 linhas = 824 distintos em 2026-02)"
    tempo: {natureza: soma_de_retratos, coluna: "ano, mes", cobertura: "2007-03–2026-02"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos (0,25% nulo)", sigla_uf: "UF", id_estabelecimento_cnes: "estabelecimento"}}
    filtros_tipicos:
      - "mes_competencia_final = 99 quer dizer vigente (gotcha competencia_final_99)"
      - "tipo_gestao_metas = '1' federal, '2' local (dicionario)"
    use_para: "estabelecimentos com gestão por metas contratualizada, por período."
    nao_use_para: "medir as metas ou resultados (a tabela só registra a habilitação)."
    rascunho: [use_para, nao_use_para]
    verificado: "partição 2026-02: 824 linhas, 824 distintos da chave; 156.788 linhas no total — medido 2026-10-27"
  estabelecimento_ensino:
    grao: "um estabelecimento reconhecido como hospital de ensino (habilitação 5001) × início da competência × mês"
    chave: "ano, mes, id_estabelecimento_cnes, ano_competencia_inicial, mes_competencia_inicial (26.689 linhas = 26.689 distintos)"
    tempo: {natureza: soma_de_retratos, coluna: "ano, mes", cobertura: "2007-03–2019-12 (série encerrada)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos (0,64% nulo)", sigla_uf: "UF", id_estabelecimento_cnes: "estabelecimento"}}
    filtros_tipicos:
      - "mes_competencia_final = 99 quer dizer vigente (gotcha competencia_final_99); tipo_habilitacao é sempre '5001' (hospital de ensino)"
    use_para: "hospitais de ensino habilitados entre 2007 e 2019 (~266 estabelecimentos distintos, aproximado do perfil)."
    nao_use_para: "estado atual: a tabela termina em 2019-12; para ensino atual use estabelecimento.tipo_atividade_ensino_pesquisa."
    rascunho: [use_para, nao_use_para]
    verificado: "26.689 linhas, 26.689 distintos da chave; ~266 estabelecimentos (perfil) — medido 2026-10-27"
  estabelecimento_filantropico:
    grao: "um estabelecimento certificado como hospital filantrópico (habilitação 6001) × início da competência × mês"
    chave: "ano, mes, id_estabelecimento_cnes, ano_competencia_inicial, mes_competencia_inicial (162.005 linhas = 162.005 distintos)"
    tempo: {natureza: soma_de_retratos, coluna: "ano, mes", cobertura: "2007-03–2026-02"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos", sigla_uf: "UF", id_estabelecimento_cnes: "estabelecimento"}}
    filtros_tipicos:
      - "mes_competencia_final = 99 e ano_competencia_final = 9999 em todas as linhas (todas vigentes; gotcha competencia_final_99); tipo_habilitacao é sempre '6001'"
      - "ano = 2026 AND mes = 2 para o retrato mais recente"
    use_para: "hospitais filantrópicos por município e mês (~715 estabelecimentos distintos, aproximado do perfil)."
    nao_use_para: "somar meses: o mesmo estabelecimento aparece em cada mês."
    rascunho: [use_para, nao_use_para]
    verificado: "162.005 linhas, 162.005 distintos da chave; ~715 estabelecimentos (perfil) — medido 2026-10-27"
  dados_complementares:
    grao: "um estabelecimento com serviços complementares (hemoterapia, nefrologia/diálise, radioterapia, oncologia) × mês, com os CNS dos médicos responsáveis e a contagem de salas e máquinas"
    chave: "ano, mes, id_estabelecimento_cnes (2.647 linhas = 2.647 distintos em 2026-02)"
    tempo: {natureza: soma_de_retratos, coluna: "ano, mes", cobertura: "2005-08–2026-02 (de 2005-08 a 2006-11 ~110 a 150 mil linhas por mês; a partir de 2006-12 só ~2,4 mil)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos", sigla_uf: "UF", id_estabelecimento_cnes: "estabelecimento"}}
    medidas:
      - {coluna: "quantidade_salas_*, quantidade_maquinas_proporcao, quantidade_outras_maquinas", o_que: "salas e máquinas do serviço complementar", unidade: "unidades", soma: sim}
    filtros_tipicos:
      - "ano = 2026 AND mes = 2 para o retrato mais recente; antes de 2006-12 a tabela cobria quase todos os estabelecimentos e depois só os com serviço complementar, então séries cruzando 2006 não são comparáveis"
      - "colunas cns_* usam a string 'nan' (não NULL) quando ausentes"
    use_para: "quais estabelecimentos têm hemodiálise, radioterapia e oncologia declaradas e quantas salas/máquinas."
    nao_use_para: "contar equipamentos em geral (use equipamento) ou séries contínuas atravessando 2006-12."
    rascunho: [use_para, nao_use_para, significado individual das colunas quantidade_*]
    verificado: "partição 2026-02: 2.647 linhas, 2.647 distintos de id_estabelecimento_cnes; 2.740.506 linhas no total; por mês: 2006-11 = 143.287 e 2006-12 = 2.565 — medido 2026-10-27"
