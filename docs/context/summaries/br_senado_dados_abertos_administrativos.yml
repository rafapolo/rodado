# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_senado_dados_abertos_administrativos
tabelas:
  ata_acionamento:
    ultima_data: "2026-09-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um acionamento de uma ata de registro de preços
    chave: id_acionamento (2.886 linhas = 2.886 distintos)
    tempo:
      natureza: retrato_atual
      coluna: data_extracao
      cobertura: retrato único extraído em 2026-09-09 (data_extracao)
    territorio: &id001
      nivel: nenhum
      colunas: {}
    use_para: acionamentos de atas de registro de preços, ligáveis a contratacao (tipo_contratacao = 'atas_registro_preco')
    rascunho:
    - use_para
    - nao_use_para
    verificado: 2.886 linhas, id_acionamento único; 536 id_contratacao distintos (sem coluna tipo_contratacao; presumivelmente atas) — medido 2026-10-27
  contratacao:
    ultima_data: "2026-09-08"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma contratação do Senado (contrato, nota de empenho ou ata de registro de preços)
    chave: tipo_contratacao + id_contratacao (12.863 linhas = 12.863 distintos); id_contratacao sozinho NÃO é único (9.142 distintos)
    tempo:
      natureza: retrato_atual
      coluna: data_assinatura
      cobertura: '1997–2026-09-08 (retrato de 2026-09-09; há datas inválidas: anos 21, 208, 210; 79 nulas)'
    territorio: *id001
    filtros_tipicos:
    - tipo_contratacao = 'contratos' (8.219), 'notas_empenho' (3.969) ou 'atas_registro_preco' (675)
    - 'status só existe para contratos: ''ENCERRADO'' (5.724), ''VIGENTE'' (2.486), ''EM_RENOVACAO'' (9); nulo (4.644) para empenhos e atas — filtre tipo_contratacao=''contratos'' antes de status'
    - indicador_mao_de_obra = 'sim' (274) / 'nao' (12.589), minúsculo sem acento
    - 'sigla_sub_especie: ''NE'' 3.973, ''CT'' 3.352, ''RP'' 1.880, ''AC'' 1.620'
    use_para: listar contratos e empenhos do Senado por empresa (cpf_cnpj_empresa, nome_empresa), objeto, modalidade e vigência
    nao_use_para: 'achar valor contratado (não há coluna de valor aqui: use contratacao_item, contratacao_pagamento ou contrato_aditivo)'
    rascunho:
    - use_para
    - nao_use_para
    - significado de data_publicacao 9999-09-09 (sentinela)
    verificado: '12.863 linhas, chave composta única; id_contratacao só é único dentro de tipo_contratacao (12.863 linhas, 9.142 id_contratacao distintos): junte com (tipo_contratacao, id_contratacao) —
      medido 2026-10-27'
  contratacao_documento_fiscal:
    ultima_data: "2026-09-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um documento fiscal (nota) de um contrato
    chave: id_contratacao + id_documento_fiscal (14.428 = 14.428 distintos); id_documento_fiscal sozinho repete (13.960)
    tempo:
      natureza: retrato_atual
      coluna: data_extracao
      cobertura: retrato único extraído em 2026-09-09 (data_extracao)
    territorio: *id001
    filtros_tipicos:
    - tipo_contratacao tem valor único 'contratos'
    use_para: datas de emissão e vencimento das notas fiscais por contrato
    nao_use_para: valores (a tabela não tem valor)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 14.428 linhas, chave composta única; data_emissao tem datas inválidas (min 0200-02-04) e 7,7% nulas — medido 2026-10-27
  contratacao_garantia:
    ultima_data: "2026-09-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma garantia contratual (caução, fiança, seguro) de um contrato
    chave: id_garantia (2.466 linhas = 2.466 distintos)
    tempo:
      natureza: retrato_atual
      coluna: data_extracao
      cobertura: retrato único extraído em 2026-09-09 (data_extracao)
    territorio: *id001
    medidas:
    - coluna: valor
      o_que: valor da garantia
      unidade: R$
      soma: sim
    filtros_tipicos:
    - tipo = 'Seguro garantia' (1.543), 'Depósito em caução' (514), 'Fiança bancária' (357), 'Retenção em pagamentos' (51), 'Títulos da dívida pública'
    use_para: garantias prestadas por contrato (tipo, valor, vencimento)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 2.466 linhas, id_garantia único; valor 0 a 5.000.000 — medido 2026-10-27
  contratacao_item:
    ultima_data: "2026-09-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um item de uma contratação
    chave: tipo_contratacao + id_contratacao + id_item (61.155 = 61.155 distintos); id_item sozinho repete (51.304 distintos)
    tempo:
      natureza: retrato_atual
      coluna: data_extracao
      cobertura: retrato único extraído em 2026-09-09 (data_extracao)
    territorio: *id001
    medidas:
    - coluna: quantidade
      o_que: quantidade do item (unidade varia por item, sem coluna de unidade)
      unidade: não documentada
      soma: nao entre itens de unidades diferentes
    filtros_tipicos:
    - tipo_contratacao = 'notas_empenho' (31.802), 'contratos' (22.108), 'atas_registro_preco' (7.245)
    use_para: o que foi contratado (descricao, numero_item, quantidade)
    nao_use_para: valor financeiro (não há preço nem valor aqui)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 61.155 linhas, chave composta única — medido 2026-10-27
  contratacao_orgao_gestor:
    ultima_data: "2026-09-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um órgão gestor (ou comissão) responsável por uma contratação
    chave: tipo_contratacao + id_contratacao + sigla_orgao_gestor + tipo_gestao (7.334 = 7.334 distintos); sem tipo_gestao repete (7.248)
    tempo:
      natureza: retrato_atual
      coluna: data_extracao
      cobertura: retrato único extraído em 2026-09-09 (data_extracao)
    territorio: *id001
    filtros_tipicos:
    - tipo_gestao = 'Órgão Gestor' (6.168), 'Órgão Gestor Substituto' (679), 'Comissão' (487)
    use_para: quem gere cada contrato, ata ou empenho
    rascunho:
    - use_para
    - nao_use_para
    verificado: 7.334 linhas, chave composta única — medido 2026-10-27
  contratacao_pagamento:
    ultima_data: "2026-09-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um pagamento (nota cobrada) de um contrato
    chave: id_pagamento (10.236 linhas = 10.236 distintos; com id_contratacao também)
    tempo:
      natureza: retrato_atual
      coluna: data_extracao
      cobertura: retrato único extraído em 2026-09-09 (data_extracao)
    territorio: *id001
    medidas:
    - coluna: valor_cobrado
      o_que: valor cobrado pelo fornecedor
      unidade: R$
      soma: sim
    - coluna: multa
      o_que: multa aplicada
      unidade: R$
      soma: sim
    - coluna: glosa
      o_que: valor glosado (descontado)
      unidade: R$
      soma: sim
    filtros_tipicos:
    - tipo_contratacao tem valor único 'contratos'
    use_para: pagamentos de contratos com multa e glosa
    nao_use_para: data do pagamento (a tabela não tem data); valor líquido pago exige conferir se valor_cobrado já desconta glosa (não medido)
    rascunho:
    - use_para
    - nao_use_para
    - relação valor_cobrado x glosa
    verificado: 10.236 linhas, id_pagamento único; valor_cobrado de 0 a 67.937.896,67 (11 linhas com 0) — medido 2026-10-27
  contratacao_pagamento_empenho:
    ultima_data: "2026-09-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um empenho vinculado a um pagamento de contrato
    chave: id_pagamento + id_empenho (12.685 = 12.685 distintos)
    tempo:
      natureza: retrato_atual
      coluna: data_extracao
      cobertura: retrato único extraído em 2026-09-09 (data_extracao)
    territorio: *id001
    medidas:
    - coluna: valor_empenhado
      o_que: valor empenhado
      unidade: R$
      soma: sim
    - coluna: valor_liquidado
      o_que: valor liquidado
      unidade: R$
      soma: sim
    - coluna: saldo
      o_que: saldo do empenho (0 em 12.627 linhas)
      unidade: R$
      soma: sim
    filtros_tipicos:
    - 'natureza_despesa: ''SERVICOS DE TECNOLOGIA DA INFORMACAO E COMUNICACAO - PJ'', ''OUTROS SERVICOS DE TERCEIROS - PESSOA JURIDICA'' (6.188) etc., maiúsculo sem acento'
    use_para: empenhos por pagamento e natureza da despesa
    nao_use_para: somar valor_empenhado ao lado de contratacao_pagamento.valor_cobrado (um pagamento pode ter vários empenhos)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 12.685 linhas, chave composta única; valor_empenhado = valor_liquidado em 12.627 linhas — medido 2026-10-27
  contrato_aditivo:
    ultima_data: "2026-09-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um aditivo de contrato
    chave: id_contratacao + id_aditivo (7.450 = 7.450 distintos); id_aditivo sozinho repete (4.918)
    tempo:
      natureza: retrato_atual
      coluna: data_extracao
      cobertura: retrato único extraído em 2026-09-09 (data_extracao)
    territorio: *id001
    medidas:
    - coluna: valor
      o_que: 'valor do aditivo (pode ser negativo: supressão)'
      unidade: R$
      soma: 'sim, com cuidado: 38,6% nulos'
    use_para: aditivos (acréscimos e supressões) de contratos
    nao_use_para: valor total do contrato (não há valor original aqui)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 7.450 linhas, chave composta única; valor de -14.993.937,93 a 189.069.188; data_assinatura com anos inválidos (0207, 2027) — medido 2026-10-27
  despesa_ceaps:
    ultima_data: "2026-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma despesa reembolsada pela CEAPS (cota para o exercício da atividade parlamentar) a um senador
    chave: id_despesa (37.461 linhas = 37.461 distintos)
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2025-01–2026-09 (2026-08 parcial com 756 linhas; 2026-09 só 39 linhas)
    territorio:
      nivel: nenhum
      colunas:
        id_senador: junta com senador.id_senador (todas as 37.461 linhas casam)
    medidas:
    - coluna: valor_reembolsado
      o_que: valor reembolsado ao senador pela despesa (71 linhas negativas = estornos; nenhuma igual a 0)
      unidade: R$
      soma: sim
    filtros_tipicos:
    - 'ano/mes definem o período; NÃO use a coluna data: 421 linhas têm year(data) ≠ ano e 142 estão fora de 2025–2026 (datas de 0202 a 2026-12-29)'
    - tipo_despesa é o texto longo, ex. 'Locomoção, hospedagem, alimentação, combustíveis e lubrificantes' (16.972; R$ 14,5 mi), 'Divulgação da atividade parlamentar' (2.961; R$ 10,7 mi), 'Serviços de Segurança
      Privada' (11); 120 nulos
    - 'tipo_documento: ''Nota Fiscal Eletrônica'' (19.499), ''Fatura'' (7.837), ''Cupom Fiscal'' (3.135), ''Recibo'' (2.698), ''Passagem / Bilhete / Código Localizador'' (1.990), ''Boleto'', ''Nota Fiscal'''
    use_para: gasto da CEAPS por senador, fornecedor, tipo de despesa e mês
    nao_use_para: série anterior a 2025 (não há) ou total anual de 2026 (ano incompleto)
    rascunho:
    - use_para
    - nao_use_para
    verificado: '37.461 linhas, id_despesa único; soma por ano: 2025 e 2026 conforme meses acima (ex. 2025-12: 1.810 linhas, R$ 3.318.301) — medido 2026-10-27'
  diretor_coordenador:
    ultima_data: "2026-09-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um setor do Senado com seu diretor/coordenador titular (e substituto, quando há)
    chave: 'nenhuma: sigla_setor repete (234 linhas, 200 distintos); 34 linhas repetidas'
    tempo:
      natureza: retrato_atual
      coluna: data_extracao
      cobertura: retrato único extraído em 2026-09-09 (data_extracao)
    territorio: *id001
    filtros_tipicos:
    - 'referencia_chefia: ''FC-3'' (128), ''SN01'' (48), ''FC-4'' (32)'
    use_para: quem chefia cada setor e quem o substitui
