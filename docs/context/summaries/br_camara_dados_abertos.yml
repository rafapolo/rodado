      coluna: data_cadastro
      cobertura: 2010-03-12–2025-12-26
    territorio: *id002
    filtros_tipicos:
    - tipo_registo = 'Pedido' (2.826) ou 'Solicitação' (43)
    use_para: pedidos por licitação e órgão.
    nao_use_para: valores (a tabela não tem).
    rascunho:
    - use_para
    - nao_use_para
    verificado: 2.869 linhas; 2.862 combinações distintas — medido 2026-10-27
  licitacao_proposta:
    grao: uma proposta de fornecedor a uma licitação (por item)
    chave: 'nenhuma: id_proposta repete entre fornecedores — 41.836 linhas, 12.484 (id_licitacao, id_proposta, fornecedor) distintos'
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 1999–2026
    territorio: *id002
    medidas:
    - coluna: valor_proposta
      o_que: valor da proposta (64% nulo)
      unidade: R$ (inteiro)
      soma: 'nao: por item, não por licitação'
    use_para: propostas recebidas e valores propostos (agregado).
    nao_use_para: datas sem filtrar (há ano 3201); identificar fornecedores.
    rascunho:
    - use_para
    - nao_use_para
    - medidas.unidade
    - chave
    verificado: 41.836 linhas; 12.484 combinações de (id_licitacao, id_proposta, cpf_cnpj_fornecedor); data_proposta máxima 3201 (erro) — medido 2026-10-27
  orgao:
