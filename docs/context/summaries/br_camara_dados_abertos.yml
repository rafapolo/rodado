  votacao:
    grao: uma votação no plenário ou comissão
    chave: 'nenhuma: id_votacao repete em 97 casos (187.246 linhas, 187.149 distintos); (id_votacao, id_orgao, id_evento, data) é único'
    tempo:
      natureza: serie_diaria
      coluna: data
      cobertura: 1935-04-17–2026-03-03
    territorio: *id002
    medidas:
    - coluna: voto_sim
      o_que: votos sim
      unidade: votos
      soma: sim
    - coluna: voto_nao
