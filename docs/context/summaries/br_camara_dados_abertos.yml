    - 'situacao: 26% nulo; ''Extinta'' (1.492), ''Instalada'' (57)'
    use_para: cadastro de órgãos por tipo e situação.
    nao_use_para: membros (use orgao_deputado).
    rascunho:
    - use_para
    - nao_use_para
    verificado: 2.375 linhas, 2.375 id_orgao distintos — medido 2026-10-27
  orgao_deputado:
    grao: a participação (cargo) de um deputado em um órgão em um período
    chave: 'nenhuma: (id_orgao, nome_deputado, cargo, data_inicio) repete — 93.730 linhas, 93.673 combinações distintas'
    tempo:
      natureza: serie_de_periodos
      coluna: data_inicio, data_final
      cobertura: 1999-02-01–2026-09-16
    territorio: *id002
    use_para: composição de comissões e cargos.
    nao_use_para: identificar deputados pelo nome (tabela não tem id_deputado).
    rascunho:
    - use_para
    - nao_use_para
    verificado: 93.730 linhas; 93.673 combinações — medido 2026-10-27
  proposicao_autor:
