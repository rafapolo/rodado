    use_para: proposições por tema.
    nao_use_para: 'somar relevancia: 98% são 0 (328.278).'
    rascunho:
    - use_para
    - nao_use_para
    verificado: 333.286 linhas; 333.265 combinações — medido 2026-10-27
  sigla_partido:
    grao: uma sigla antiga de partido e sua sigla atual
