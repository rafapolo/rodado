# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ms_sinan_zika
tabelas:
  microdados_zika:
    ultima_data: "2026-10-05"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma notificação individual de zika (ficha SINAN), sem identificador do caso; inclui descartadas (gotcha notificacao_nao_e_caso)"
    chave: "nenhuma: sem identificador; 607.893 linhas, 606.185 distintas pela linha inteira (1.708 repetidas). NDUPLIC_N (marca de duplicidade da ficha) vem vazio em 578.137 linhas, não serve de chave"
    tempo: {natureza: serie_diaria, coluna: "DT_NOTIFIC (DATE, nunca nula); NU_ANO (VARCHAR) = year(DT_NOTIFIC) em todas as linhas; ano_sinan (BIGINT) é o ano do arquivo de origem e diverge de NU_ANO em 303 linhas", cobertura: "DT_NOTIFIC 2015-01-04 a 2026-10-22; ano_sinan 2015–2026 (2016 concentra 45%: 273.904 de 607.893; 2026 é parcial, 14.115)"}
    territorio: {nivel: municipio, colunas: {ID_MUNICIP: "município de notificação, IBGE 6 dígitos (sem dígito verificador), nunca vazio", ID_MN_RESI: "município de residência, 6 dígitos; vazio em 89 linhas", SG_UF: "UF de residência, código IBGE de 2 dígitos (não é sigla); vazio em 89", SG_UF_NOT: "UF da notificação, código IBGE de 2 dígitos (não é sigla)"}}
    medidas:
      - {expressao: "count(*)", o_que: "notificações (ou casos, com CLASSI_FIN = '1')", unidade: "notificações", soma: sim}
    filtros_tipicos:
      - "ano_sinan = <ano> (BIGINT); ou year(DT_NOTIFIC), que é o ano da notificação sem a divergência de 303 linhas"
      - "ID_AGRAVO: 'A928' (588.114) e 'A92.' (19.779) — dois formatos do mesmo agravo; filtre left(ID_AGRAVO,3) = 'A92'"
      - "CLASSI_FIN (texto; '' quando vazio): '2' 266.177, '1' 193.918, '8' 132.981, '' 14.563, '0' 254. Pela ficha do SINAN (sem dicionário no espelho): 1 confirmado, 2 descartado, 8 inconclusivo; caso confirmado = CLASSI_FIN = '1'"
      - "CRITERIO (ficha: 1 laboratorial, 2 clínico-epidemiológico): dos confirmados, 163.668 são por critério 2 e 29.483 por 1; dos descartados, 153.990 por 1 e 110.182 por 2"
      - "CS_SEXO = 'F' 397.293, 'M' 210.110, 'I' 489 (uma linha em minúscula 'f')"
      - "NU_IDADE_N é texto com a unidade no 1º dígito ('4021' = 21 anos): gotcha idade_codificada"
    use_para: "notificações de zika por município, UF e ano (ou semana) de notificação; casos confirmados com CLASSI_FIN = '1'; série da epidemia de 2015–2016 e da fase endêmica depois."
    nao_use_para: "chamar notificação de caso sem filtrar CLASSI_FIN (44% das linhas são descartadas); somar para contar pessoas (sem identificador, 1.708 linhas repetidas); incidência sem denominador (junte com br_ms_populacao.municipio); comparar 2026 com ano fechado; usar SG_UF como sigla."
    verificado: "607.893 linhas; 606.185 distintas pela linha inteira; DT_NOTIFIC 2015-01-04 a 2026-10-22, nunca nula; NU_ANO = year(DT_NOTIFIC) em 607.893 de 607.893; ano_sinan diverge de NU_ANO em 303; ano_sinan: 2015 56.159, 2016 273.904, 2017 31.754, 2018 20.032, 2019 30.536, 2020 20.768, 2021 19.742, 2022 35.804, 2023 36.003, 2024 43.312, 2025 25.764, 2026 14.115; CLASSI_FIN 2/1/8/''/0 = 266.177 / 193.918 / 132.981 / 14.563 / 254; ID_MUNICIP com 6 dígitos em todas; ID_MN_RESI vazio em 89 — medido 2026-11-10. Corrige o cartão de 2026-10-27: contagens defasadas (607.162 linhas) e SG_UF descrito como código numérico sem dizer que são 2 dígitos IBGE"
