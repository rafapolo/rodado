# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Escrito à mão; o que
# o catálogo já diz (linhas, fonte, data) e as armadilhas (gotchas/) não se repetem aqui.
# Plano: tasks/plans/cartao_tabela.md (piloto de 2026-10-26).
dataset: br_me_cnpj
tabelas:
  empresas:
    ultima_data: "2026-09-01"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma empresa (raiz do CNPJ, 8 dígitos), no último retrato da Receita"
    chave: cnpj_basico
    tempo:
      natureza: retrato_atual
      coluna: data
      cobertura: "2026-09 (só o último mês publicado; o passado está em empresas_historico, gotcha so_o_ultimo_retrato)"
    territorio: {nivel: nenhum, nota: "o endereço é do estabelecimento: junte com estabelecimentos pela raiz"}
    medidas:
      - {expressao: "count(*)", o_que: "empresas cadastradas, inclusive as que já fecharam", soma: sim}
      - {coluna: capital_social, unidade: "R$ declarados na abertura", soma: sim, nota: "tire o sentinela antes (gotcha capital_social_sentinela)"}
    use_para: "natureza jurídica, porte e capital da empresa; ligar estabelecimentos e sócios da mesma empresa"
    nao_use_para: "situação (ativa ou baixada) e município: estão em estabelecimentos"
    verificado: "70.081.764 linhas e 70.081.764 cnpj_basico distintos; data única 2026-09-01 — medido 2026-10-26"
  estabelecimentos:
    ultima_data: "2026-09-01"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um estabelecimento (CNPJ de 14 dígitos: matriz ou filial), no último retrato"
    chave: cnpj
    tempo:
      natureza: retrato_atual
      coluna: data
      cobertura: "2026-09"
    territorio:
      nivel: municipio
      colunas: {id_municipio: "endereço do estabelecimento (IBGE)", id_municipio_rf: "o código da Receita"}
    medidas:
      - {expressao: "count(*) FILTER (situacao_cadastral = '2')", o_que: "estabelecimentos ativos", soma: sim}
    filtros_tipicos: ["situacao_cadastral = '2' (ativa); os códigos são 1 nula, 2 ativa, 3 suspensa, 4 inapta, 8 baixada, sem zero à esquerda"]
    use_para: "onde as empresas estão, por CNAE (cnae_fiscal_principal) e município; data de abertura (data_inicio_atividade)"
    nao_use_para: "contar negócios ativos sem filtrar a situação: 47% das linhas são baixadas; emprego (use a RAIS)"
    verificado: "73.366.147 linhas = cnpj distintos; situação: 8 → 34,6 mi, 2 → 28,3 mi, 4 → 10,1 mi, 3 → 0,3 mi, 1 → 0,1 mi; 73,19 mi com id_municipio — medido 2026-10-26"
  socios:
    ultima_data: "2026-09-01"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um vínculo de sócio × empresa no último retrato, com linhas repetidas (gotcha socios_linha_repetida)"
    chave: "nenhuma única: use socios_historico para contar vínculos"
    tempo: {natureza: retrato_atual, coluna: data, cobertura: "2026-09"}
    territorio: {nivel: nenhum}
    use_para: "quem é sócio de quê hoje, pelo nome e documento (CPF mascarado ou completado, gotcha cpf_completado)"
    nao_use_para: "contar vínculos ou pessoas sem tirar a repetição"
    verificado: "28.341.092 linhas no retrato, contra 28.340.770 vínculos vigentes em socios_historico — medido 2026-10-26"
  simples:
    ultima_data: "2026-09-13"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma empresa (raiz) que já optou pelo Simples ou pelo MEI alguma vez; quem nunca optou não tem linha"
    chave: cnpj_basico
    tempo: {natureza: retrato_atual, cobertura: "2026-09; as datas de opção e exclusão contam a história"}
    territorio: {nivel: nenhum}
    medidas:
      - {expressao: "count(*) FILTER (opcao_simples = 1)", o_que: "optantes do Simples hoje", soma: sim}
      - {expressao: "count(*) FILTER (opcao_mei = 1)", o_que: "MEI hoje", soma: sim, nota: "não filtre data_exclusao_mei IS NULL: a exclusão com data depois do retrato é agendada, e a empresa ainda é MEI (vale o mesmo para o Simples)"}
    use_para: "regime tributário atual e quando a empresa entrou ou saiu dele"
    nao_use_para: "a parte que não é do Simples: falta linha, não há opcao_simples = 0 para ela"
    verificado: "50.396.768 linhas = raízes distintas; 25,9 mi optantes do Simples, 17,5 mi MEI; com opcao_mei = 1, 353.425 têm data de exclusão, todas depois de 2026-09-01 (no Simples, 828.865) — medido 2026-10-26"
  empresas_historico:
    ultima_data: "2026-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma empresa × período em que o cadastro não mudou (inicio e fim em aaaamm)"
    chave: "cnpj_basico, inicio"
    tempo: {natureza: serie_de_periodos, coluna: "inicio, fim", cobertura: "2021-11 a 2026-09, com meses ausentes (gotcha historico_meses_ausentes)"}
    territorio: {nivel: nenhum}
    use_para: "o cadastro numa data passada: inicio <= X AND fim >= X (gotcha historico_como_ler)"
    nao_use_para: "antes de 2021-11"
    verificado: "80.024.491 linhas, 70.081.769 raízes distintas; inicio mínimo 202111, fim máximo 202609 — medido 2026-10-26"
  estabelecimentos_historico:
    ultima_data: "2026-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um estabelecimento × período sem mudança no cadastro"
    chave: "cnpj, inicio"
    tempo: {natureza: serie_de_periodos, coluna: "inicio, fim", cobertura: "2021-11 a 2026-09"}
    territorio: {nivel: municipio, colunas: {id_municipio: "endereço no período"}}
    use_para: "abertura, fechamento e mudança de endereço ou de CNAE desde 2021-11"
    verificado: "196.655.712 linhas = pares (cnpj, inicio) distintos; 73.366.147 cnpj — medido 2026-10-26"
  socios_historico:
    ultima_data: "2026-09"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um vínculo de sócio × empresa, do primeiro ao último retrato em que apareceu"
    chave: "cnpj_basico, tipo, documento, nome, qualificacao, primeiro_retrato"
    tempo: {natureza: serie_de_periodos, coluna: "primeiro_retrato, ultimo_retrato", cobertura: "2021-11 a 2026-09"}
    territorio: {nivel: nenhum}
    medidas:
      - {expressao: "count(*) FILTER (no_ultimo_retrato)", o_que: "vínculos vigentes", soma: sim}
    use_para: "entrada e saída de sócios; contar vínculos sem a repetição de socios"
    verificado: "35.022.573 linhas = chaves distintas; 28.340.770 vigentes — medido 2026-10-26"
