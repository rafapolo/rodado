# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_simet_educacao_conectada
tabelas:
  escola:
    grao: uma escola (retrato único do Censo Escolar 2023 com medições SIMET até dez/2024)
    chave: 'id_escola (única: 137.914 linhas, 137.914 distintas; ano_censo é sempre 2023)'
    tempo:
      natureza: retrato_atual
      coluna: ano_censo
      cobertura: 2023–2023 (data_ultima_atualizacao = 2024-12-12 em todas)
    territorio:
      nivel: ponto
      colunas:
        sigla_uf: UF
        id_municipio: município (código IBGE)
        id_escola: código INEP da escola
        id_setor: setor censitário (44% nulo)
        latitude: graus
        longitude: graus
        ponto: geometria do ponto
    medidas:
    - coluna: quantidade_matricula
      o_que: matrículas da escola
      unidade: alunos
      soma: sim
    - coluna: media_tcp_download
      o_que: 'média de download medido (43% nulo: escola sem medidor)'
      unidade: Mbit/s (rascunho)
      soma: nao
    - coluna: media_tcp_upload
      o_que: média de upload medido
      unidade: Mbit/s (rascunho)
      soma: nao
    - coluna: media_latencia
      o_que: latência média
      unidade: ms (rascunho)
      soma: nao
    - coluna: media_perda_pacote
      o_que: perda de pacotes média
      unidade: '% (rascunho)'
      soma: nao
    - coluna: velocidade_download_necessaria
      o_que: velocidade que a escola precisaria
      unidade: Mbit/s (rascunho)
      soma: nao
    - coluna: razao_download_aluno
      o_que: download por aluno (43% nulo)
      unidade: Kbit/s por aluno (rascunho; ver tipo_download_aluno)
      soma: nao
    - coluna: media_download_entorno, media_upload_entorno, media_latencia_entorno, media_pacotes_entorno, media_jitter_*_entorno
      o_que: 'medições no entorno da escola; ARMADILHA: as seis colunas são idênticas linha a linha nas 24.985 escolas com valor, então só uma carrega informação (provavelmente de download) e as outras são cópia'
      unidade: não confiável
      soma: nao
    - expressao: count(*)
      o_que: número de escolas
      unidade: escolas
      soma: sim
    filtros_tipicos:
    - indicador_internet = true (booleano; 122.122 escolas com internet, 15.792 sem; faixa_velocidade = 'Sem Internet' coincide com false)
    - rede IN ('Municipal','Estadual','Federal'); localizacao IN ('Urbana','Rural')
    - faixa_velocidade IN ('Com Mais De 50 Mbits/S','Sem Medidor Instalado','Com 20 A 50 Mbits/S','Sem Internet') (grafia literal, nulo em 9.964 escolas com internet)
    - tipo_recurso_recebido IN ('PIEC e PBLE','Nenhum Recurso','só PBLE','só PIEC','PIEC e Rural-4G','só Rural-4G')
    - tipo_tecnologia = 'Sem Informação' em 56.506 escolas
    use_para: escolas por conectividade, rede, UF e município, com velocidade medida e programas recebidos
    nao_use_para: série temporal (um só retrato); média de download por município sem excluir os 43% sem medição; usar as colunas *_entorno como seis medidas distintas
    rascunho:
    - use_para
    - nao_use_para
    - unidades das medidas de velocidade e latência
    verificado: 137.914 linhas = 137.914 distintas em id_escola e em (ano_censo, id_escola); indicador_internet true 122.122 / false 15.792; faixa_velocidade nula em 9.964 (todas com internet); media_download_entorno = media_upload_entorno em 24.985 de 24.985 não nulas — medido 2026-10-27
