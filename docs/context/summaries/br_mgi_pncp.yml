# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_mgi_pncp
tabelas:
  ata_registro_preco:
    ultima_data: "2026-09-30"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma ata de registro de preços publicada no PNCP (cabeçalho: órgão, compra de origem, vigência, adesão); cada linha traz também a coluna json, sempre nula"
    chave: "numeroControlePNCPAta: 1.176.452 linhas = 1.176.452 distintos (nenhum nulo). Colunas em camelCase, precisam de aspas duplas."
    tempo: {natureza: serie_de_periodos, coluna: dataPublicacaoPncp, cobertura: "2022–2026 (publicação); anoAta tem 1.386 valores fora de 2021–2027 (ex.: 2424, 1.352 linhas), e dataAssinatura/vigenciaFim têm datas absurdas (ex.: 9201, 9999)"}
    territorio: {nivel: outro, colunas: {cnpjOrgao: "órgão (8.128 distintos)", codigoUnidadeOrgao: "unidade", numeroControlePNCPCompra: "compra de origem"}}
    filtros_tipicos: ["cancelado = false (BOOLEAN; 1.172.340) — true são 4.112", "use year(dataPublicacaoPncp) para o ano, não anoAta", "possibilidadeAdesao é nula em 66,8% das linhas (true 196.578, false 193.913)"]
    use_para: "contar atas de registro de preços por órgão e ano de publicação, e ligar cada ata à compra de origem (numeroControlePNCPCompra = contratacao.numeroControlePNCP, 99,998% casam)."
    nao_use_para: "preço ou item (a tabela só tem o cabeçalho; veja br_mgi_compras_publicas.ata_registro_preco_item); ano por anoAta; atas de antes de 2022-07 (a tabela começa aí); somar atas como valor (não há medida)."
    verificado: "1.176.452 linhas = 1.176.452 numeroControlePNCPAta distintos; linhas inteiras distintas 1.176.452; dataPublicacaoPncp 2022-07-25 a 2026-09-30 (205 / 37.629 / 302.667 / 482.931 / 353.020 por ano, 2022 a 2026); 316.798 compras distintas (numeroControlePNCPCompra) e 1.176.426 das atas casam com br_mgi_pncp.contratacao.numeroControlePNCP; cancelado true 4.112; possibilidadeAdesao nula em 785.961 (66,8%); json nulo em todas — medido 2026-10-28, refeito 2026-11-10 (cobertura, casamento com contratacao)"
  contratacao:
    ultima_data: "2026-10-31"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma contratação (compra: dispensa, pregão, inexigibilidade, concorrência etc.) publicada no PNCP, de qualquer esfera e órgão do país; o cartão anterior tratava a tabela como uma amostra de 3.171 dispensas de 2021, o que era falso"
    chave: "numeroControlePNCP: 4.250.794 linhas = 4.250.794 distintos. Colunas em camelCase, precisam de aspas duplas. Alguns parquets mensais de 2021 são arquivos vazios (101 bytes) só com a coluna json; leia pela view br_mgi_pncp.contratacao, não por read_parquet no diretório (o esquema do primeiro arquivo vence e só aparece `json`)."
    tempo: {natureza: serie_de_periodos, coluna: "dataPublicacaoPncp (VARCHAR 'AAAA-MM-DD HH:MM:SS'; anoCompra é o ano do processo e difere da publicação em 171.399 linhas)", cobertura: "2021-08-10 a 2026-10-31; por ano de publicação 2021 7.236 / 2022 62.207 / 2023 252.580 / 2024 1.231.760 / 2025 1.462.710 / 2026 (até out) 1.234.301. A tabela só se populou de verdade a partir de 2024. anoCompra tem 4.023 valores fora de 2020–2026 (máx. 20254023), quase todos de 2026"}
    territorio: {nivel: municipio, colunas: {unidadeOrgao: "STRUCT com ufSigla, municipioNome, codigoIbge (7 dígitos em 100% das linhas, casa com o diretório sem conversão), nomeUnidade", orgaoEntidade: "STRUCT com cnpj, esferaId (M municipal 2.909.884, E estadual 707.557, F federal 526.462, N 98.571, D distrital 8.320), poderId, razaoSocial", unidadeSubRogada: "unidade subrogada, quando houver"}}
    medidas:
      - {coluna: valorTotalEstimado, o_que: "valor estimado da contratação (nunca nulo)", unidade: "R$", soma: "sim, mas tem registros impossíveis (gotcha valor_homologado_com_registros_impossiveis)"}
      - {coluna: valorTotalHomologado, o_que: "valor homologado (nulo em 1.220.232 linhas, 28,7%)", unidade: "R$", soma: "sim, depois do corte por registro (gotcha valor_homologado_com_registros_impossiveis)"}
      - {expressao: "count(*)", o_que: "contratações", unidade: "contratações", soma: sim}
    filtros_tipicos: ["year(CAST(dataPublicacaoPncp AS TIMESTAMP)) = <ano> ou left(dataPublicacaoPncp, 4) = '2024'", "valorTotalHomologado > 0 AND valorTotalHomologado < 1e9 antes de qualquer soma", "modalidadeId BIGINT: 8 Dispensa 2.180.998, 6 Pregão eletrônico 1.108.344, 9 Inexigibilidade 709.092, 4 Concorrência eletrônica 150.971, 12 Credenciamento 54.812; modalidadeNome traz o texto", "situacaoCompraId: 1 Divulgada 4.185.813, 2 Revogada 34.145, 3 Anulada 17.652, 4 Suspensa 13.184 (somar sem filtrar inclui revogadas e anuladas)", "orgaoEntidade.esferaId para a esfera; unidadeOrgao.codigoIbge para o município (gotcha municipio_no_struct)", "srp = true são registros de preço (615.423)"]
    use_para: "contar e somar compras públicas de todas as esferas, por município, órgão, modalidade e ano de publicação; ligar a br_mgi_pncp.ata_registro_preco e a br_mgi_compras_publicas.contratacao por numeroControlePNCP."
    nao_use_para: "somar valorTotalHomologado ou valorTotalEstimado sem corte (gotcha valor_homologado_com_registros_impossiveis: R$ 5.289 bi em 2024, 88% em 81 registros); tratar valor homologado nulo como zero (28,7% das compras não têm); usar anoCompra como ano da publicação; ler por read_parquet no diretório."
    verificado: "4.250.794 linhas = 4.250.794 numeroControlePNCP distintos; dataPublicacaoPncp 2021-08-10 07:54:24 a 2026-10-31 21:22:52; anoCompra diferente do ano de publicação em 171.399 linhas; modalidade 8 = 2.180.998 linhas (51,3%); esfera M 2.909.884; unidadeOrgao.codigoIbge com 7 dígitos em 4.250.794; valorTotalHomologado negativo 0; situação 1 = 4.185.813; os cortes de valor estão no gotcha (medido 2026-11-04) — medido 2026-11-10"
  instrumento_cobranca:
    ultima_data: "2026-10-14"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um instrumento de cobrança (nota fiscal eletrônica) ligado a um contrato do PNCP, com a nota e o contrato embutidos em colunas STRUCT"
    chave: "(cnpj, ano, sequencialContrato, sequencialInstrumentoCobranca): 311.474 linhas = 311.474 distintos. (cnpj, ano, sequencialContrato) tem só 125.405 distintos: um contrato tem várias notas."
    tempo: {natureza: serie_de_periodos, coluna: dataEmissaoDocumento, cobertura: "2021-12-07–2026-10-14 (ano do contrato 2021–2026)"}
    territorio: {nivel: uf, colunas: {"recuperarContratoDTO.unidadeOrgao.ufSigla": "UF da unidade (RJ 48.860, DF 36.591, RS 33.507 no topo)", cnpj: "órgão contratante"}}
    medidas:
      - {expressao: "recuperarContratoDTO.valorGlobal", o_que: "valor global do contrato (DOUBLE; repete em cada nota do contrato)", unidade: "R$", soma: "nao: soma repetida por nota"}
      - {expressao: "notaFiscalEletronica.valorNotaFiscal", o_que: "valor da nota, em texto no formato brasileiro ('4.920,00'); preenchido em 103.152 linhas", unidade: "R$", soma: "sim, depois de replace('.','') e replace(',','.') e cast para DOUBLE (try_cast direto dá NULL em todas)"}
    filtros_tipicos: ["tipoInstrumentoCobranca.nome = 'Nota Fiscal Eletrônica (NF-e)' (todas as 311.474)", "statusResponseNFe = '200' (291.369); 403, 405 e 400 são consultas à NF-e que falharam; nulo em 11.350", "notaFiscalEletronica IS NOT NULL (103.152): sem isso a nota detalhada não existe (208.322 nulas)"]
    use_para: "ligar contratos do PNCP às notas fiscais emitidas contra eles (valor, itens da nota, emitente)."
    nao_use_para: "somar valorGlobal (repete por nota); dados de pessoas: emitente e fornecedor podem ser pessoa física."
    verificado: "311.474 linhas = 311.474 chaves distintas (cnpj, ano, sequencialContrato, sequencialInstrumentoCobranca); 125.405 contratos distintos; dataEmissaoDocumento 2021-12-07 a 2026-10-14; notaFiscalEletronica não nulo em 103.152; valorNotaFiscal só converte para DOUBLE depois de trocar ponto e vírgula (103.152 de 103.152) — medido 2026-10-28, refeito 2026-11-10 (linhas, chave, cobertura, nota)"
  dicionario:
    grao: "um código (id_tabela × nome_coluna × chave) com o seu significado em valor; 224 linhas, chave confirmada"
    chave: "(id_tabela, nome_coluna, chave): 224 linhas = 224 distintos"
    tempo: {natureza: sem_tempo, coluna: cobertura_temporal, cobertura: "coluna quase toda vazia"}
    filtros_tipicos: ["id_tabela = 'contratacao' e nome_coluna = 'id_modalidade' (14 códigos) ou 'codigo_amparo_legal' (151)"]
    use_para: "traduzir códigos do PNCP (modalidade, amparo legal, esfera, poder)"
    nao_use_para: "dados de contratações (estão em contratacao, ata_registro_preco e instrumento_cobranca); o cartão anterior dizia que as tabelas de fato não estavam no banco, o que era falso"
    verificado: "224 linhas, 224 chaves distintas (id_tabela, nome_coluna, chave) — medido 2026-11-10"
