# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_rf_cafir
tabelas:
  imoveis_rurais:
    grao: "um imóvel rural cadastrado no CAFIR × uma data de referência (cada data é o cadastro inteiro)"
    chave: "(data_referencia, id_imovel_incra): medido em data_referencia = 2025-09-02, 10.157.996 linhas e 10.157.996 distintos de id_imovel_incra (que guarda o código NIRF/CIB de 8 dígitos, nomes trocados — ver gotcha id_imovel_nomes_trocados). Nas outras datas, não medido"
    tempo: {natureza: soma_de_retratos, coluna: data_referencia, cobertura: "2023-04-05–2025-09-02 (18 datas; 10 a 9,7 milhões de imóveis cada, exceto 2025-02-18 com só 39.666 linhas, retrato parcial)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos (nulo em 0,23%)", sigla_uf: "UF do imóvel", distrito: "texto livre (nulo em 42%)", cep: "CEP"}}
    medidas:
      - {coluna: area, o_que: "área do imóvel; unidade não fecha com nenhuma (ver gotcha area_sem_unidade)", unidade: "não documentada", soma: "nao: os ativos somam 9,0 bilhões contra 851 milhões de ha do Brasil; use só contagens"}
    filtros_tipicos:
      - "data_referencia = DATE '2025-09-02' (sempre fixe uma data, cada uma tem o cadastro todo; somar datas conta o mesmo imóvel até 18 vezes)"
      - "situacao_imovel = '02' (texto de 2 dígitos; 8.822.761 de 10.157.996 em 2025-09-02; outros: '49' 831.024, '52' 184.222, '58' 163.821, '55' 62.330; significado dos códigos não documentado, '02' provavelmente ativo)"
      - "tipo_itr = 'SIM' / 'NAO' (3.217.798 e 6.940.198 em 2025-09-02; significado: imóvel sujeito à declaração do ITR, por dedução)"
      - "status_sncr = '3' (6.269.198) / '1' (3.887.788) / '4' (1.009), texto; significado não documentado"
    use_para: "Contagem de imóveis rurais por município/UF e evolução do cadastro entre datas de referência"
    nao_use_para: "Somar area (sem unidade confiável); contar imóveis sem fixar data_referencia; juntar com SIGEF/SICOR pela coluna cuja descrição o nome sugere (os nomes estão trocados)"
    rascunho: [use_para, nao_use_para, tipo_itr, situacao_imovel]
    verificado: "169.935.535 linhas em 18 datas; 2025-09-02: 10.157.996 linhas, 10.157.996 id_imovel_incra distintos, também distintos em (id_imovel_incra, id_municipio) — medido 2026-10-27. Gotchas: snapshot_mensal, id_imovel_nomes_trocados, area_sem_unidade"
