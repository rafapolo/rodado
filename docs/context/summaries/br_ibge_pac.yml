# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ibge_pac
tabelas:
  sidra:
    grao: 'uma célula do SIDRA: uma tabela × localidade (Brasil ou UF) × período × variável × combinação de categorias
      das classificações'
    chave: id_tabela, id_localidade, periodo, id_variavel, id_categoria_1, id_categoria_2, id_categoria_3
    tempo:
      natureza: serie_anual
      coluna: periodo (VARCHAR)
      cobertura: '1988–2024 (por id_tabela: 1988–1990, 1988–1995, 1996, 1996–2002, 1996–2007, 2000–2007, 2003–2007,
        2007–2023, 2019–2023, 2024)'
    territorio:
      nivel: uf
      colunas:
        id_nivel: '''1'' = Brasil (id_localidade ''1''), ''3'' = Unidade da Federação'
        id_localidade: 'código IBGE da UF em VARCHAR (ex.: ''11'' Rondônia, ''12'' Acre, ''51'' Mato Grosso) ou
          ''1'' para Brasil'
        localidade: nome da UF ou Brasil
    medidas:
    - coluna: valor
      o_que: 'dado do SIDRA: um número por célula; a unidade e o significado estão em unidade e variavel'
      unidade: 'varia por linha: ver coluna `unidade` (e `variavel`)'
      soma: nao
    filtros_tipicos:
    - 'id_tabela é parte da chave e define o tema: tabelas de eras diferentes se SOBREPÕEM (ex.: 2007 está nas séries
      2003–2007 e 2007–2023) e a mesma célula tem valores diferentes entre tabelas (2007: 6744 células repetidas,
      5911 com valor distinto). Sempre filtre uma id_tabela (gotcha mesma_celula_em_varias_tabelas)'
    - 'variavel é texto único por id_variavel (368 variáveis); muitas existem em duas versões: valor absoluto e
      ''… - percentual do total geral'' (unidade Percentual): não some as duas nem misture na mesma agregação'
    - 'unidade varia por linha: ''Mil Reais'', ''Unidades'', ''Pessoas'', ''Percentual'', ''%'', ''Coeficiente''
      e moedas antigas (Milhões de Cruzeiros, Mil Cruzados Novos, Milhões de Cruzados, Milhões de Cruzeiros Reais)
      antes do Real: não compare nem some entre unidades ou atravessando 1994'
    - 'valor IS NOT NULL (10,4% é nulo, sempre com simbolo: ''...'' 24504, ''A'' 17493, ''B'' 7685, ''X'' 1391,
      ''C'' 992, ''D'' 163, ''E'' 67, ''Z'' 52; significado dos símbolos não documentado aqui)'
    - classificacao_1/2/3 e categoria_1/2/3 dizem os recortes (divisão de comércio, grupo e classe de atividade,
      faixas de pessoal ocupado, formas de comercialização, região de atuação); cada id_tabela tem suas classificações
      e há agregados (divisão, grupo, classe) misturados na mesma tabela
    - valor pode ser negativo em 6 linhas (medido)
    use_para: 'Resultados da Pesquisa Anual de Comércio (empresas comerciais: número, pessoal ocupado, receita,
      gastos, margem) por atividade, Brasil e UF, em formato longo.'
    nao_use_para: Não tem município; não some valores entre id_tabela, variáveis ou unidades; não use para série
      longa sem escolher uma id_tabela e dizer a era (tabelas 2007–2023 e 2024 'série nova' são separadas).
    rascunho:
    - use_para
    - nao_use_para
    - sentido dos símbolos A–E, X, Z
    verificado: 503922 linhas = 503922 distintos de (id_tabela, id_localidade, periodo, id_variavel, id_categoria_1,
      id_categoria_2, id_categoria_3); 92 id_tabela com linhas, Brasil 496470 e UF 7452 linhas (27 UFs) — medido
      2026-10-27
  sidra_tabelas:
    grao: 'uma tabela do SIDRA espelhada (metadado): título, período, variáveis, classificações e quantas linhas
      entraram em `sidra`'
    chave: id_tabela
    use_para: Descobrir qual id_tabela responde à pergunta (título, período, linhas) antes de consultar `sidra`;
      linhas = 0 ou no_espelho = false significam tabela sem dados no banco.
    rascunho:
    - use_para
    verificado: 94 linhas = 94 id_tabela distintos — medido 2026-10-27. 92 tabelas têm linhas; 1407 e 2716 têm 0
      linhas (fora do espelho).
