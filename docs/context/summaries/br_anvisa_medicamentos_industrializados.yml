# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_anvisa_medicamentos_industrializados
tabelas:
  microdados:
    ultima_data: "2021-03"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma venda agregada de medicamento controlado (SNGPC) por mês × município × princípio ativo × apresentação × prescritor"
    chave: "nenhuma: microdados sem id; a tabela foi cortada em exatamente 10.000.000 linhas (ver gotcha tabela_cortada_em_10_milhoes)"
    tempo: {natureza: serie_mensal, coluna: "ano + mes", cobertura: "2014–2021, só 52 pares (ano, mes) presentes de 96 possíveis"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos, VARCHAR (235 distintos no perfil de 2021)", sigla_uf: "UF da venda", sigla_uf_conselho_prescritor: "UF do conselho do prescritor"}}
    medidas:
      - {coluna: quantidade_vendida, o_que: "unidades vendidas", unidade: "caixas ou frascos conforme unidade_medida", soma: sim}
    filtros_tipicos:
      - "unidade_medida = 'caixa' (336.879 em 2021) ou 'frasco' (49.648): não somar as duas juntas sem separar"
      - "conselho_prescritor: 'CRM' (médico), 'CRO', 'CRMV', 'RMS' (significado das siglas fora do banco)"
      - "tipo_receituario 1–5: significado não documentado"
      - "sexo 1/2 e unidade_idade 1/2: significado não documentado; nulos em 34,29% (2021)"
      - "meses ausentes são lacuna da fonte: 2019-10 tem metade das linhas e 2020-07 o dobro"
    use_para: "ver composição de vendas de controlados por princípio ativo, UF e prescritor dentro dos meses presentes"
    nao_use_para: "totais nacionais ou séries mensais completas (recorte de 10 milhões de linhas, meses faltando)"
    rascunho: [use_para, nao_use_para]
    verificado: "10.000.000 linhas; 52 pares (ano,mes), 2014–2021; 2021 só mes 2 e 3 (193.192 e 193.335 linhas); quantidade_vendida de 2021 soma 742.688 + 1.542.312 — medido 2026-10-27"
