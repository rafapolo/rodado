# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: eu_sanctions
tabelas:
  sanctions:
    grao: "uma linha do XML de sanções da UE já achatado: cada entidade sancionada (pessoa ou empresa) repetida pelo produto de seus apelidos/nomes, endereços, documentos, nascimentos e cidadanias; as colunas NameAlias_*, Address_*, BirthDate_*, Identification_* e Citizenship_* ficam nulas quando a linha não é daquele tipo"
    chave: "nenhuma: Entity_LogicalId tem 6241 distintos em 43891 linhas (uma entidade tem de 1 a 6+ linhas); só a linha inteira é única (43891 = 43891 distintas); (Entity_LogicalId, NameAlias_LogicalId) também repete (36875 distintos)"
    tempo: {natureza: retrato_atual, coluna: Entity_DesignationDate, cobertura: "2000-04-12–2026-07-23 (data da designação; fileGenerationDate é uma só, 2026-09-22)"}
    territorio: {nivel: outro, colunas: {Address_CountryIso2Code: "país do endereço (ISO-2), preenchido em 6% das linhas", Citizenship_CountryIso2Code: "cidadania (ISO-2)", BirthDate_CountryIso2Code: "país de nascimento (ISO-2)"}}
    filtros_tipicos:
      - "contar entidades: count(DISTINCT Entity_LogicalId), nunca count(*) (43891 linhas para 6241 entidades)"
      - "Entity_SubjectType = 'P' (pessoa, 4465 entidades) ou 'E' (empresa/entidade, 1776); Entity_SubjectType_ClassificationCode traz 'person'/'enterprise' para os mesmos"
      - "Entity_Regulation_Programme = 'UKR' (2960 entidades), 'IRN' (707), 'SYR' (380), 'BLR' (374): cada entidade tem exatamente 1 programa (medido); no top por linhas UKR aparece 19867 por causa da repetição"
      - "Entity_Regulation_Type = 'amendment' (43009 linhas), 'regulation' (533) ou 'repealing' (349); 'repealing' (82 entidades) parece indicar regulamento revogador, significado não documentado: confira antes de tratar como delistado"
      - "nome: NameAlias_WholeName (preenchido em 31073 linhas); 12818 linhas têm NameAlias_LogicalId nulo (a linha é de outro componente, ex. endereço)"
    use_para: "saber quais entidades a UE sanciona, em que programa e desde quando (Entity_DesignationDate), com nomes alternativos, documentos e endereços"
    nao_use_para: "contagem de sancionados por count(*) e totais por tipo de linha, pois a tabela é um produto de componentes"
    rascunho: [use_para, nao_use_para, "significado de Entity_Regulation_Type = 'repealing'"]
    verificado: "43891 linhas; 6241 Entity_LogicalId distintos (= 6241 Entity_EU_ReferenceNumber); linha inteira distinta 43891; P 4465 e E 1776 entidades; 1 programa por entidade — medido 2026-10-27"
