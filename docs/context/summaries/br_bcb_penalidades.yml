# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_bcb_penalidades
tabelas:
  penalidades:
    ultima_data: "2026-08-31"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma penalidade do Banco Central aplicada a um infrator (PAS × CPF/CNPJ), com decisão de 1ª e 2ª instância"
    chave: "nenhuma: PAS tem 13.052 distintos e (PAS, CPF_CNPJ) 16.170 em 16.963 linhas (793 repetem)"
    tempo: {natureza: serie_de_periodos, coluna: Data_da_citacao, cobertura: "1999-03-05–2026-08-31 (citação); decisão de 1ª instância 2013-01-16–2026-10-02"}
    territorio: {nivel: nenhum, colunas: {}}
    medidas:
      - {coluna: Valor_da_multa_1_instancia, o_que: "multa aplicada na 1ª instância (nula quando a pena não é MULTA)", unidade: "R$", soma: sim}
      - {coluna: Valor_da_multa_2_instancia, o_que: "multa após recurso (nula em 87,74%)", unidade: "R$", soma: nao}
      - {coluna: "Duracao_da_pena_1_instancia, Duracao_da_pena_2_instancia", o_que: "duração da pena (inabilitação/proibição)", unidade: "anos (rascunho)", soma: nao}
    filtros_tipicos:
      - "Tipo_penalidade_1_instancia = 'MULTA' (13.690 linhas, todas com valor, soma R$ 1,857 bi); outros: 'NÃO HOUVE PENALIDADE' 1.781, 'INABILITAÇÃO' 1.349, 'ADVERTÊNCIA' 99"
      - "Situacao: 'MULTA PAGA' 11.926, 'NÃO HOUVE PENALIDADE' 1.552, 'PENALIDADE CUMPRIDA' 1.107, 'MULTA TRANSFERIDA PARA COBRANÇA' 896, 'MULTA VENCIDA E NÃO PAGA' 127"
      - "Apresentou_recurso = 'SIM' (3.124): 2.927 delas têm decisão de 2ª instância; 'NÃO' (13.839) tem 495"
      - "CPF_CNPJ: ver gotcha cpf_completado"
    use_para: "multas e penas do Banco Central por infrator, período e situação de cumprimento"
    nao_use_para: "contar pessoas distintas por CPF_CNPJ (máscara repete) ou somar a multa final sem escolher a instância (use a 2ª quando existir)"
    rascunho: [use_para, nao_use_para, "unidade da duração da pena"]
    verificado: "16.963 linhas; 13.052 PAS; (PAS, CPF_CNPJ) 16.170; multa 1ª instância soma R$ 1.857.217.910 — medido 2026-10-27"
