# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ibge_pas
tabelas:
  sidra:
    grao: 'uma célula do SIDRA: uma tabela × localidade (Brasil ou UF) × período × variável × combinação de categorias
      das classificações'
    chave: id_tabela, id_localidade, periodo, id_variavel, id_categoria_1, id_categoria_2, id_categoria_3
    tempo:
      natureza: serie_anual
      coluna: periodo (VARCHAR)
      cobertura: '1998–2024 (por id_tabela: 1998–2001, 1998–2002, 2000–2002, 2002–2023, 2003–2007, 2003–2023, 2024)'
    territorio:
      nivel: uf
      colunas:
        id_nivel: '''1'' = Brasil (id_localidade ''1''), ''3'' = Unidade da Federação'
        id_localidade: 'código IBGE da UF em VARCHAR (ex.: ''11'' Rondônia, ''12'' Acre, ''51'' Mato Grosso) ou
          ''1'' para Brasil'
        localidade: nome da UF ou Brasil
    medidas:
    - coluna: valor
      o_que: 'dado do SIDRA: um número por célula; unidade e significado em unidade e variavel'
      unidade: 'varia por linha: ver coluna `unidade` (e `variavel`)'
      soma: nao
    filtros_tipicos:
    - 'id_tabela é parte da chave e define o tema (307 tabelas, uma por assunto/era: transportes, informação e comunicação,
      serviços prestados às famílias etc.). Tabelas de eras diferentes SE SOBREPÕEM: a mesma célula aparece em mais
      de uma id_tabela (2007: 9936 células repetidas; no total 57239 combinações sem id_tabela repetem). Sempre filtre uma id_tabela (gotcha mesma_celula_em_varias_tabelas)'
    - 'variavel é texto único por id_variavel (366 variáveis); muitas existem em duas versões: valor absoluto e
      ''… - percentual do total geral'' (unidade Percentual): não some as duas nem misture na mesma agregação'
    - 'unidade varia por linha: ''Mil Reais'', ''Unidades'', ''Pessoas'', ''Percentual'', ''%'' e vazio; valores
      antes do Real não estão em reais constantes: não compare nem some entre unidades ou atravessando 1994'
    - 'valor IS NOT NULL (7,5% é nulo, sempre com simbolo: ''...'' 30587, ''A'' 13153, ''B'' 6086, ''..'' 5319,
      ''X'' 3499, ''C'' 1174, ''Z'' 748, ''D'' 290, ''E'' 139; significado não documentado aqui)'
    - classificacao_1/2/3 e categoria_1/2/3 dizem os recortes (divisão de comércio, grupo e classe de atividade,
      faixas de pessoal ocupado, formas de comercialização, região de atuação); cada id_tabela tem suas classificações
      e há agregados (divisão, grupo, classe) misturados na mesma tabela
    - valor pode ser negativo em 44 linhas (medido, sentido não verificado)
    use_para: 'Resultados da Pesquisa Anual de Serviços (empresas de serviços: número, pessoal ocupado, receita,
      despesas, gastos de pessoal) por atividade de serviços, Brasil e UF, em formato longo.'
    nao_use_para: Não tem município nem UF em quase todas as tabelas (só 14 das 306 id_tabela têm UF; ~3% das linhas);
      não some entre id_tabela, variáveis ou unidades.
    rascunho:
    - use_para
    - nao_use_para
    - sentido dos símbolos
    verificado: 811865 linhas = 811865 distintos de (id_tabela, id_localidade, periodo, id_variavel, id_categoria_1,
      id_categoria_2, id_categoria_3); Brasil 788537 e UF 23328 linhas; 306 id_tabela com linhas, só 14 delas com
      UF — medido 2026-10-27
  sidra_tabelas:
    grao: 'uma tabela do SIDRA espelhada (metadado): título, período, variáveis, classificações e quantas linhas
      entraram em `sidra`'
    chave: id_tabela
    use_para: Descobrir qual id_tabela responde à pergunta (título, período, linhas) antes de consultar `sidra`;
      linhas = 0 ou no_espelho = false significam tabela sem dados no banco.
    rascunho:
    - use_para
    verificado: 307 linhas = 307 id_tabela distintos — medido 2026-10-27. 306 tabelas no espelho; 1 (fora do espelho)
      tem 1.005.312 células em UF, acima do teto de 1.000.000, e 0 linhas.
