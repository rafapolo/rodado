  dfp_composicao_capital:
    grao: a composição do capital (ações ordinárias, preferenciais, total, integralizadas e em tesouraria) de uma companhia numa data de referência do DFP
    chave: 'nenhuma exata: (CNPJ_CIA, DT_REFER) tem 4.353 distintos em 4.356 linhas; com VERSAO, 4.354 — 2 linhas excedentes'
    tempo:
      natureza: serie_anual
      coluna: DT_REFER
      cobertura: 2020-02-29–2026-06-30
    territorio:
      nivel: nenhum
      colunas:
        CNPJ_CIA: companhia aberta
    medidas:
    - coluna: QT_ACAO_TOTAL_CAP_INTEGR
      o_que: quantidade de ações (ordinárias + preferenciais) do capital integralizado; as variantes ORDIN e PREF separam as espécies
      unidade: unidades de ação (não milhares, pelos valores do perfil)
      soma: sim
    - coluna: QT_ACAO_TOTAL_TESOURO
      o_que: 'quantidade de ações em tesouraria (há valores negativos no perfil: mínimo −16.318)'
      unidade: unidades de ação
      soma: sim
    filtros_tipicos:
    - DT_REFER = <data> e, se houver mais de uma VERSAO para o mesmo CNPJ_CIA × DT_REFER, ficar com a maior VERSAO (3 pares repetem)
    use_para: número de ações de cada companhia ao fim do exercício (base para valor de mercado ou lucro por ação).
    nao_use_para: somar entre datas diferentes (cada linha é um retrato) ou obter preço da ação.
    rascunho:
    - use_para
    - nao_use_para
    - unidade
    verificado: 4.356 linhas; 4.353 pares (CNPJ_CIA, DT_REFER) distintos; 4.354 com VERSAO — medido 2026-10-27
