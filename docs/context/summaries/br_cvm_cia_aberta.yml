# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_cvm_cia_aberta
tabelas:
  cadastro:
    grao: uma companhia aberta (registro na CVM), com situação, setor, controle acionário, endereço da sede, diretor de relações com investidores e auditor
    chave: 'nenhuma: 2.678 linhas, 2.567 CD_CVM e 2.531 CNPJ_CIA distintos — 107 CD_CVM aparecem em 2 linhas (nas duas vistas, linhas idênticas); para contar empresas use count(DISTINCT CD_CVM)'
    tempo:
      natureza: retrato_atual
      coluna: DT_REG
      cobertura: cadastro vigente; DT_REG 1923-05-23–2026-09-21, DT_CANCEL 1984-10-15–2026-09-08
    territorio:
      nivel: municipio
      colunas:
        MUN: município da sede (texto)
        UF: UF da sede
        PAIS: país da sede ('BRASIL' em 2.579 linhas)
    filtros_tipicos:
    - SIT = 'ATIVO' (756 linhas; 'CANCELADA' 1.914; 'SUSPENSO(A) - DECISÃO ADM' 8) para companhias em funcionamento
    - TP_MERC = 'BOLSA' (495) ou 'BALCÃO ORGANIZADO' (258) para companhias com valores negociados; nulo em 71% das linhas
    - 'CATEG_REG IN (''Categoria A'',''Categoria B''): nulo em 46% (as canceladas antigas)'
    - CONTROLE_ACIONARIO IN ('PRIVADO','PRIVADO HOLDING','ESTRANGEIRO','ESTRANGEIRO HOLDING','ESTATAL','ESTATAL HOLDING')
    - SIT_EMISSOR = 'FASE OPERACIONAL' (1.124) vs 'FASE PRÉ-OPERACIONAL' (134); nulo em 50%
    use_para: listar companhias abertas, seu status, setor, controle e sede, e ligar CD_CVM ↔ CNPJ_CIA.
    nao_use_para: histórico de mudanças de situação ou de endereço (só o estado atual) e valores financeiros.
    rascunho:
    - use_para
    - nao_use_para
    - significado de SIT x SIT_EMISSOR (duas colunas de situação, não medida a diferença)
    verificado: '2.678 linhas; 2.567 CD_CVM, 2.531 CNPJ_CIA distintos; 107 CD_CVM com mais de uma linha; SIT: ATIVO 756 (662 CD_CVM), CANCELADA 1.914 (1.897 CD_CVM), SUSPENSO 8 — medido 2026-10-27'
  cgvn_documentos:
    grao: um Informe do Código de Governança (CBGC) entregue por uma companhia (uma versão de um exercício), com link de download
    chave: 'ID_Documento (confirmada: 3.047 linhas = 3.047 distintos); (CNPJ_Companhia, Data_Referencia, Versao) também 3.047'
    tempo:
      natureza: serie_anual
      coluna: Data_Fim_Exercicio_Social
      cobertura: 2017-12-31–2025-12-31; Data_Referencia (data do informe) 2018-09-14–2026-12-31
    territorio: &id001
      nivel: nenhum
      colunas:
        CNPJ_Companhia: companhia (CNPJ pontuado)
        Nome_Empresarial: nome da companhia
    filtros_tipicos:
    - Categoria = 'Código de Governança' (único valor)
    - 'Versao: todas as versões ficam na tabela (''1'' 2.914, ''2'' 114, ''3'' 14…); pegar a maior por CNPJ_Companhia × exercício para o informe vigente (3.047 linhas para 2.916 pares CNPJ_Companhia × Data_Referencia)'
    use_para: listar quais companhias entregaram o informe de governança e quando.
    nao_use_para: as respostas por prática (estão em cgvn_praticas).
    rascunho:
    - use_para
    - nao_use_para
    - natureza do tempo
    verificado: 3.047 linhas; 3.047 ID_Documento; 2.916 pares (CNPJ_Companhia, Data_Referencia) — medido 2026-10-27
  cgvn_praticas:
    grao: uma prática recomendada do Código de Governança respondida por uma companhia num informe (adotada ou não, com explicação)
    chave: 'ID_Documento, ID_Item (confirmada: 157.410 linhas = 157.410 distintos)'
    tempo:
      natureza: serie_anual
      coluna: Data_Referencia
      cobertura: 2018-09-14–2026-12-31
    territorio: *id001
    medidas:
    - coluna: contagem de linhas por Pratica_Adotada
      o_que: número de práticas por resposta
      unidade: práticas
      soma: sim
    filtros_tipicos:
    - Pratica_Adotada IN ('Sim','Parcialmente','Não','Não se Aplica') (valores literais com acento; 'Sim' 85.097, 'Não' 29.987, 'Parcialmente' 23.761, 'Não se Aplica' 18.565)
    - Capitulo IN ('Acionistas','Conselho de Administração','Ética e Conflito de Interesses','Órgãos de Fiscalização e Controle','Diretoria')
    - 'uma só versão por informe: a tabela guarda Versao ''1''–''5'' (151.254 linhas na ''1''); filtre pela maior Versao por CNPJ_Companhia × Data_Referencia para não contar reapresentações em dobro'
    use_para: percentual de adoção das práticas de governança por capítulo/empresa.
    nao_use_para: ranquear empresas sem filtrar a versão vigente.
    rascunho:
    - use_para
    - nao_use_para
    - regra de versão vigente
    verificado: '157.410 linhas; 157.410 pares (ID_Documento, ID_Item); ID_Documento distintos: 2.915 — medido 2026-10-27'
  dfp_bpa_con:
    grao: uma conta contábil (CD_CONTA) da Balanço Patrimonial – Ativo (consolidado) × companhia × data de referência (DT_REFER) × exercício (ORDEM_EXERC)
    chave: 'nenhuma exata: (CNPJ_CIA, DT_REFER, ORDEM_EXERC, CD_CONTA) tem 820.290 distintos em 823.543 linhas, ou seja 3.253 linhas excedentes (repetições da própria origem; para somar, deduplique antes ou use max/any_value por chave)'
    tempo:
      natureza: serie_anual
      coluna: DT_REFER
      cobertura: 2010-12-31–2026-06-30
    territorio:
      nivel: nenhum
      colunas:
        CNPJ_CIA: companhia aberta (CNPJ pontuado)
        CD_CVM: código CVM da companhia
    medidas:
    - coluna: VL_CONTA
      o_que: 'valor da conta CD_CONTA (saldo (retrato na data DT_FIM_EXERC)); as contas são hierárquicas (pai contém filhas), portanto NÃO some contas diferentes entre si: escolha um CD_CONTA (ex.: ''1''). Soma entre empresas só dentro do mesmo CD_CONTA, com ORDEM_EXERC = ''ÚLTIMO'' e depois de aplicar ESCALA_MOEDA.'
      unidade: R$ em milhares quando ESCALA_MOEDA = 'MIL' e em reais quando 'UNIDADE' (ver gotcha escala_moeda); MOEDA = 'REAL' em tudo o que o perfil mostra
      soma: sim
    filtros_tipicos:
    - ORDEM_EXERC = 'ÚLTIMO' (com acento e maiúsculas; o valor 'PENÚLTIMO' é o período comparativo e dobra os totais — ver gotcha dois_exercicios_por_documento)
    - 'CD_CONTA = <código como texto, ponto como separador> escolhendo uma conta: 1 = Ativo Total, 1.01 = Ativo Circulante, 1.02 = Ativo Não Circulante'
    - 'ESCALA_MOEDA: ''MIL'' ou ''UNIDADE'' (multiplicar por 1000 quando ''MIL''; gotcha escala_moeda)'
    - ST_CONTA_FIXA = 'S' para as contas padrão CVM (comparáveis entre empresas); 'N' são subcontas específicas da empresa (significado de S/N não documentado, deduzido do perfil)
    - CNPJ_CIA vem pontuado (00.000.000/0001-91); CD_CVM é texto com zeros à esquerda (gotcha cnpj_pontuado)
    use_para: série de balanço patrimonial – ativo por empresa e conta, anual (DFP, exercício fechado).
    nao_use_para: somar contas diferentes entre si, somar sem filtrar ORDEM_EXERC, ou comparar empresas sem converter ESCALA_MOEDA.
    rascunho:
    - use_para
    - nao_use_para
    - ST_CONTA_FIXA
    - hierarquia das contas fora das contas citadas
    - natureza do ITR (trimestres)
    - 'ITR: PENÚLTIMO = comparativo (bate com o visto na Petrobras)'
    verificado: '823.543 linhas; chave CNPJ_CIA, DT_REFER, ORDEM_EXERC, CD_CONTA: 820.290 distintos; mesma estrutura de dfp_dre_con — medido 2026-10-27; Petrobras 2024-12-31 conta 1 (Ativo Total) ÚLTIMO 1.124.797.000 e PENÚLTIMO (2023-12-31) 1.050.888.000, em MIL'
