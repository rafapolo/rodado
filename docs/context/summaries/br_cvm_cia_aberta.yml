  itr_bpa_con:
    grao: uma conta contábil (CD_CONTA) da Balanço Patrimonial – Ativo (consolidado) × companhia × data de referência (DT_REFER) × exercício (ORDEM_EXERC)
    chave: 'nenhuma exata: (CNPJ_CIA, DT_REFER, ORDEM_EXERC, CD_CONTA) tem 2.332.474 distintos em 2.336.868 linhas, ou seja 4.394 linhas excedentes (repetições da própria origem; para somar, deduplique antes ou use max/any_value por chave)'
    tempo:
      natureza: serie_de_periodos
      coluna: DT_REFER
      cobertura: 2011-03-31–2026-06-30 (data de fim do trimestre)
    territorio:
      nivel: nenhum
      colunas:
        CNPJ_CIA: companhia aberta (CNPJ pontuado)
        CD_CVM: código CVM da companhia
    medidas:
    - coluna: VL_CONTA
      o_que: 'valor da conta CD_CONTA (saldo (retrato na data DT_FIM_EXERC)); as contas são hierárquicas (pai contém filhas), portanto NÃO some contas diferentes entre si: escolha um CD_CONTA (ex.: ''1''). Soma entre empresas só dentro do mesmo CD_CONTA, com ORDEM_EXERC = ''ÚLTIMO'' e depois de aplicar ESCALA_MOEDA.'
      unidade: R$ em milhares quando ESCALA_MOEDA = 'MIL' e em reais quando 'UNIDADE' (ver gotcha escala_moeda); MOEDA = 'REAL' em tudo o que o perfil mostra
      soma: sim
    filtros_tipicos:
    - ORDEM_EXERC = 'ÚLTIMO' (com acento e maiúsculas; o valor 'PENÚLTIMO' é o período comparativo e dobra os totais — ver gotcha dois_exercicios_por_documento)
    - 'CD_CONTA = <código como texto, ponto como separador> escolhendo uma conta: 1 = Ativo Total, 1.01 = Ativo Circulante, 1.02 = Ativo Não Circulante'
    - 'ESCALA_MOEDA: ''MIL'' ou ''UNIDADE'' (multiplicar por 1000 quando ''MIL''; gotcha escala_moeda)'
    - ST_CONTA_FIXA = 'S' para as contas padrão CVM (comparáveis entre empresas); 'N' são subcontas específicas da empresa (significado de S/N não documentado, deduzido do perfil)
    - CNPJ_CIA vem pontuado (00.000.000/0001-91); CD_CVM é texto com zeros à esquerda (gotcha cnpj_pontuado)
    use_para: série de balanço patrimonial – ativo por empresa e conta, trimestral (ITR, três primeiros trimestres do exercício).
    nao_use_para: somar contas diferentes entre si, somar sem filtrar ORDEM_EXERC, ou comparar empresas sem converter ESCALA_MOEDA.
    rascunho:
    - use_para
    - nao_use_para
    - ST_CONTA_FIXA
    - hierarquia das contas fora das contas citadas
    - natureza do ITR (trimestres)
    - 'ITR: PENÚLTIMO = comparativo (bate com o visto na Petrobras)'
