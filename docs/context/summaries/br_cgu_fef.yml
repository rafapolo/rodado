# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_cgu_fef
tabelas:
  microdados:
    grao: "uma constatação (falha ou informação) de uma ordem de serviço de fiscalização em sorteio, num município; há linhas totalmente repetidas"
    chave: "nenhuma: das 82.664 linhas só 28.591 são distintas (colunas inteiras repetidas); numero_ordem_servico tem 22.713 distintos e o montante é o mesmo em todas as linhas da mesma ordem"
    tempo: {natureza: serie_de_periodos, coluna: ano_evento, cobertura: "2006–2018 (ano_exercicio_repasse: 1996–2018)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos (texto)", sigla_uf: "UF"}}
    medidas:
      - {coluna: montante_fiscalizado, o_que: "valor fiscalizado da ordem de serviço, repetido em cada constatação dela (nulo em 7,15% das linhas)", unidade: "R$", soma: nao}
      - {expressao: "sum(m) FROM (SELECT numero_ordem_servico, max(montante_fiscalizado) m ... GROUP BY 1)", o_que: "montante fiscalizado sem repetição, uma vez por ordem de serviço", unidade: "R$", soma: sim}
      - {expressao: "count(*)", o_que: "número de constatações (inclui linhas duplicadas)", unidade: "linhas", soma: nao}
    filtros_tipicos: ["tipo_constatacao = 'Falha Grave' (valores: 'Falha Grave', 'Falha Média', 'Falha Formal', 'Informação'; Falha Média é 65.298 das 82.664 linhas)", "trim(funcao) ILIKE 'educa_ao': funcao vem com espaços à direita ('EDUCACAO' + espaços, 20.673 linhas) e também como 'Educação' (4.395), então funcao = 'EDUCACAO' casa 0 linhas", "sorteio_ciclo_fef = '029': texto; 26 valores, '020'–'040' e 'V01'–'V05'"]
    use_para: "contar ordens de serviço e tipos de falha por município, UF, órgão ou função de governo nos sorteios da CGU."
    nao_use_para: "somar montante_fiscalizado por linha: a soma bruta dá R$ 376,8 bi, sobre linhas distintas R$ 90,3 bi e por ordem de serviço R$ 45,8 bi."
    rascunho: [use_para, nao_use_para]
    verificado: "82.664 linhas, 28.591 distintas, 22.713 ordens de serviço, 0 ordens com mais de um montante; soma bruta R$ 376.752.951.285, distinta R$ 90.294.395.072, por ordem (max) R$ 45.839.032.612; funcao com espaço à direita em 70.430 linhas — medido 2026-10-27"
  municipios_sorteados:
    grao: "um município × sorteio da CGU em que foi sorteado"
    chave: "sorteio + id_municipio"
    tempo: {natureza: serie_de_periodos, coluna: sorteio, cobertura: "sorteios 1–40 (datas na tabela sorteio)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos (texto)", sigla_uf: "UF"}}
    filtros_tipicos: ["sorteio = 29: inteiro aqui, enquanto microdados.sorteio_ciclo_fef é texto ('029'); junte com cast(sorteio_ciclo_fef as int) só nos ciclos numéricos"]
    use_para: "saber quais municípios entraram em cada sorteio (inclusive os sem constatação)."
    nao_use_para: "achados da fiscalização: eles estão em microdados."
    rascunho: [use_para, nao_use_para]
    verificado: "2.241 linhas = 2.241 pares distintos (sorteio, id_municipio); 1.949 municípios distintos; todo município de microdados com ciclo numérico está nesta tabela (0 faltantes) — medido 2026-10-27"
  sorteio:
    ultima_data: "2015-02-02"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um sorteio da CGU, com a data"
    chave: "sorteio"
    tempo: {natureza: serie_de_periodos, coluna: data, cobertura: "2003-04-03–2015-02-02 (texto AAAA-MM-DD)"}
    territorio: {nivel: nenhum}
    use_para: "datar os sorteios (1 a 40) de municipios_sorteados."
    nao_use_para: "análise por si só: 40 linhas de metadado."
    rascunho: [use_para, nao_use_para]
    verificado: "40 linhas, 40 sorteios distintos — medido 2026-10-27"
