# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_cgu_despesas_publicas
tabelas:
  execucao:
    grao: "um lançamento mensal da execução orçamentária por unidade gestora × ação × subtítulo/localizador × elemento de despesa × modalidade (valores do mês)"
    chave: "nenhuma: em 2025/12, 92.907 linhas e 91.683 combinações de unidade gestora, gestão, ação, plano, subtítulo, localizador, elemento, modalidade, programa, unidade orçamentária, autor de emenda, programa de governo, subfunção, função e órgão subordinado (cerca de 1.200 linhas repetem). Some sempre; não deduplique."
    tempo: {natureza: serie_mensal, coluna: ano_e_mes_do_lancamento, cobertura: "2014/01–2026/10 (texto 'AAAA/MM'; ordena como texto)"}
    territorio: {nivel: outro, colunas: {codigo_orgao_superior: "ministério/órgão superior (ex.: '26000', '52000')", codigo_unidade_gestora: "unidade gestora que executa", uf: "UF do localizador; nula em 70% das linhas", municipio: "nulo em 99% das linhas"}}
    medidas:
      - {coluna: valor_empenhado_r, o_que: "valor empenhado no mês (pode ser negativo, anulações)", unidade: "R$", soma: sim}
      - {coluna: valor_liquidado_r, o_que: "valor liquidado no mês", unidade: "R$", soma: sim}
      - {coluna: valor_pago_r, o_que: "valor pago no mês", unidade: "R$", soma: sim}
      - {coluna: valor_restos_a_pagar_inscritos_r, o_que: "restos a pagar inscritos", unidade: "R$", soma: sim}
      - {coluna: valor_restos_a_pagar_pagos_r, o_que: "restos a pagar pagos", unidade: "R$", soma: sim}
    filtros_tipicos: ["ano_e_mes_do_lancamento LIKE '2025/%' para um ano (formato AAAA/MM, ao contrário de favorecido)", "codigo_orgao_superior = '26000' (código literal do top do perfil; significado do código não conferido no dicionário)", "codigo_categoria_economica = '3' despesa corrente, '4' capital (palpite não medido; cheque o nome_categoria_economica)"]
    use_para: "total empenhado, liquidado e pago da União por órgão, função, ação ou natureza de despesa ao longo dos meses."
    nao_use_para: "saber quem recebeu o dinheiro (use favorecido) ou análise municipal (uf/município quase sempre nulos)."
    rascunho: [use_para, nao_use_para, filtros_tipicos]
    verificado: "10.473.104 linhas; mês 2025/12 com 92.907 linhas e chave candidata de 15 colunas com 91.683 distintos (não única); último mês 2026/10 com 45.072 linhas (parcial) — medido 2026-10-27"
  favorecido:
    grao: "o total recebido por um favorecido (pessoa ou empresa) de uma unidade gestora num mês, cerca de uma linha por favorecido × unidade gestora × mês"
    chave: "nenhuma: em 12/2025, 843.921 linhas e 832.415 combinações de favorecido × unidade gestora (11,5 mil repetem); com órgão, UF e município ainda 842.846. Some sempre; não deduplique."
    tempo: {natureza: serie_mensal, coluna: ano_e_mes_do_lancamento, cobertura: "01/2014–12/2025 (texto 'MM/AAAA', não ordena como data; ao contrário de execucao)"}
    territorio: {nivel: municipio, colunas: {sigla_uf: "UF do favorecido (inclui '-1' como não informado)", nome_municipio: "município do favorecido, por nome, sem código IBGE", codigo_orgao_superior: "órgão superior pagador", codigo_unidade_gestora: "unidade pagadora"}}
    medidas:
      - {coluna: valor_recebido, o_que: "valor recebido pelo favorecido no mês; há valores negativos (estornos: 8.390 linhas em 12/2025)", unidade: "R$", soma: sim}
    filtros_tipicos: ["ano_e_mes_do_lancamento LIKE '%/2025' para um ano (formato MM/AAAA)", "codigo_orgao_superior = '26000' (literal do top do perfil; significado não conferido)"]
    use_para: "ranking de favorecidos, totais recebidos por UF/município ou por órgão pagador."
    nao_use_para: "execução orçamentária por ação (use execucao); não filtre a tabela inteira (120 mi de linhas) sem mês; não liste codigo_favorecido, que é documento de pessoa."
    rascunho: [use_para, nao_use_para, filtros_tipicos]
    verificado: "119.922.442 linhas; 12/2025: 843.921 linhas, soma de valor_recebido 3,47e11 R$ — medido 2026-10-27"
