# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_prf_infracoes
tabelas:
  infracoes:
    grao: "uma infração autuada pela PRF em rodovia federal (um auto), com data, local (BR/km/município), tipo da infração e dados do veículo"
    chave: "numero_auto (só preenchido de 2019 em diante): medido no ano 2021, 5.241.299 linhas e 5.241.298 numero_auto distintos (1 repetida), 0 nulos; (numero_auto, codigo_infracao) dá o mesmo 5.241.298. Antes de 2019 não há chave (numero_auto nulo)"
    tempo: {natureza: serie_diaria, coluna: data, cobertura: "2007–2021 (coluna ano, partição); linhas por ano de 1,86 milhão (2007) a 7,36 milhões (2018); 2021: 5.241.299"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos casado por nome+UF (nulo em ~0,4%)", municipio: "nome como publicado pela PRF", sigla_uf: "UF da infração", br: "rodovia federal (texto, ex. '010', '80')", km: "quilômetro da rodovia"}}
    medidas:
      - {coluna: quantidade_infracoes, o_que: "contagem de infrações por linha; sempre 1 quando preenchida (só de 2020 em diante)", unidade: "infrações", soma: "sim, mas count(*) é equivalente e vale para todos os anos"}
      - {coluna: excesso_verificado, o_que: "excesso medido (ex. km/h acima do limite; unidade depende do tipo_medicao)", unidade: "depende de tipo_medicao", soma: "nao: mistura velocidade, peso, alcoolemia e dimensão"}
      - {coluna: medicao_considerada, o_que: "valor considerado na medição (velocidade, peso etc.)", unidade: "depende de tipo_medicao", soma: "nao"}
    filtros_tipicos:
      - "ano = 2021 (ou outro): tabela de 63 milhões de linhas, sempre filtre a partição"
      - "tipo_medicao = 'Veiculo' (velocidade; 2.626.546 em 2021) ou 'Nenhuma' (2.580.986), 'Peso' 17.502, 'Alcoolemia' 12.116, 'Dimensão' 4.149; 'Veiculo' é o valor literal (sem acento)"
      - "codigo_infracao = '<código>' com descricao_infracao para o tipo (codigo_infracao só existe de 2017 em diante)"
      - "indicador_abordagem = 'S' (3.677.608 em 2021) / 'C' (1.563.691), significado não documentado"
    use_para: "Contagem de infrações por trecho, município, tipo de infração e período"
    nao_use_para: "Série por hora com o texto de hora cru (dois formatos) ou comparação de velocidade com medicao_realizada entre períodos"
    rascunho: [use_para, nao_use_para]
    verificado: "63.217.947 linhas no total; ano=2021: 5.241.299 linhas, 5.241.298 numero_auto distintos, 0 linhas duplicadas inteiras — medido 2026-10-27. Gotchas: colunas_por_periodo, hora_dois_formatos, medicao_tipo_x_valor, municipio_por_nome"
