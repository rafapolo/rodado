# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ibge_ipca15
tabelas:
  mes_brasil:
    ultima_data: "2026-03"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um mês do IPCA-15 (prévia do IPCA) nacional (índice geral do Brasil)
    chave: ano, mes
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2000-05–2026-03
    territorio:
      nivel: brasil
      colunas: {}
    medidas:
    - coluna: indice
      o_que: número-índice do mês
      unidade: pontos
      soma: nao
    - coluna: variacao_mensal
      o_que: variação em relação ao mês anterior
      unidade: '% (0.33 = 0,33%)'
      soma: nao
    - coluna: variacao_trimestral
      o_que: variação acumulada nos 3 meses até o mês
      unidade: '%'
      soma: nao
    - coluna: variacao_semestral
      o_que: variação acumulada nos 6 meses até o mês
      unidade: '%'
      soma: nao
    - coluna: variacao_anual
      o_que: variação acumulada no ano calendário até o mês (em dezembro é igual a variacao_doze_meses; medido no
        IPCA 2025, nos outros índices é por analogia)
      unidade: '%'
      soma: nao
    - coluna: variacao_doze_meses
      o_que: variação acumulada nos últimos 12 meses
      unidade: '%'
      soma: nao
    filtros_tipicos:
    - ano = <ano> AND mes = <mes> para um mês (ambos inteiros, mes de 1 a 12)
    - variacao_doze_meses é a inflação anual 'oficial'; variacao_anual é só o acumulado do ano até aquele mês
    use_para: 'Série nacional de inflação (IPCA-15 (prévia do IPCA)): variação mensal, no ano e em 12 meses.'
    nao_use_para: 'Não some nem faça média das variações (são taxas acumuladas): encadeie com a razão entre índices
      ou multiplique (1+v/100). Antes de 1994 o `indice` não é comparável em nível (mudança de moeda; no IPCA o
      mínimo é 7.6e-09), use as variações.'
    rascunho:
    - use_para
    - nao_use_para
    verificado: 311 linhas = 311 pares (ano, mes) distintos — medido 2026-10-27
  mes_categoria_brasil:
    ultima_data: "2026-03"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um mês × Brasil × uma categoria da cesta do IPCA-15 (grupo, subgrupo, item ou subitem, todos os níveis
      na mesma tabela)
    chave: ano, mes, id_categoria, categoria (id_categoria nulo só na linha Índice geral)
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2020-02–2026-03
    territorio:
      nivel: brasil
      colunas: {}
    medidas:
    - coluna: peso_mensal
      o_que: peso da categoria no índice, dentro do seu nível hierárquico
      unidade: '% (cada nível soma 100 em um mês e local)'
      soma: nao
    - coluna: variacao_mensal
      o_que: variação do mês
      unidade: '%'
      soma: nao
    - coluna: variacao_anual
      o_que: variação acumulada no ano até o mês
      unidade: '%'
      soma: nao
    - coluna: variacao_doze_meses
      o_que: variação acumulada em 12 meses (nula nos primeiros 12 meses da série)
      unidade: '%'
      soma: nao
    filtros_tipicos:
    - 'id_categoria IS NULL = linha ''Índice geral'' (total); length(id_categoria)=1 grupos, 2 subgrupos, 4 itens,
      7 subitens (medido: em cada nível o peso soma 100). Misturar níveis conta o mesmo gasto várias vezes'
    - 'id_categoria é VARCHAR (ex.: ''1'', ''11''), categoria é o nome; nomes repetem entre níveis (ex.: ''Transportes''
      é id 5 e id 51 no IPCA)'
    use_para: Inflação por categoria de despesa (Brasil) e peso de cada uma na cesta.
    nao_use_para: Não some peso_mensal nem variações entre níveis; não traz preços em reais, só variação e peso.
    rascunho:
    - use_para
    - nao_use_para
    verificado: 33078 linhas = 33078 distintos da chave; em 2024-12 níveis 1/2/4/7 = 9/19/51/367 categorias, cada
      nível soma peso 100, 1 geral; sem nulos em peso_mensal no Brasil — medido 2026-10-27
  mes_categoria_municipio:
    ultima_data: "2026-03"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um mês × município × uma categoria da cesta do IPCA-15 (grupo, subgrupo, item ou subitem, todos os níveis
      na mesma tabela)
    chave: ano, mes, id_municipio, id_categoria, categoria
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2020-02–2026-03
    territorio:
      nivel: municipio
      colunas:
        id_municipio: código IBGE de 7 dígitos; só 5208707 (GO) e 5300108 (DF)
        sigla_uf: 'UF (atenção: pode não bater com o código, ver filtros)'
    medidas:
    - coluna: peso_mensal
      o_que: peso da categoria no índice, dentro do seu nível hierárquico
      unidade: '% (cada nível soma 100 em um mês e local)'
      soma: nao
    - coluna: variacao_mensal
      o_que: variação do mês
      unidade: '%'
      soma: nao
    - coluna: variacao_anual
      o_que: variação acumulada no ano até o mês
      unidade: '%'
      soma: nao
    - coluna: variacao_doze_meses
      o_que: variação acumulada em 12 meses (nula nos primeiros 12 meses da série)
      unidade: '%'
      soma: nao
    filtros_tipicos:
    - 'id_categoria IS NULL = linha ''Índice geral'' (total); length(id_categoria)=1 grupos, 2 subgrupos, 4 itens,
      7 subitens (medido: em cada nível o peso soma 100). Misturar níveis conta o mesmo gasto várias vezes'
    - 'id_categoria é VARCHAR (ex.: ''1'', ''11''), categoria é o nome; nomes repetem entre níveis (ex.: ''Transportes''
      é id 5 e id 51 no IPCA)'
    - 'só 2 municípios: id_municipio = ''5208707'' (GO) e ''5300108'' (DF); peso e variações nulos em 32% das linhas,
      filtre IS NOT NULL'
    use_para: Inflação por categoria de despesa (município) e peso de cada uma na cesta.
    nao_use_para: Não some peso_mensal nem variações entre níveis; não traz preços em reais, só variação e peso.
    rascunho:
    - use_para
    - nao_use_para
    verificado: 66156 linhas = 66156 distintos da chave; 33078 linhas por município — medido 2026-10-27
  mes_categoria_rm:
    ultima_data: "2026-03"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: um mês × região metropolitana × uma categoria da cesta do IPCA-15 (grupo, subgrupo, item ou subitem, todos
      os níveis na mesma tabela)
    chave: ano, mes, regiao_metropolitana, id_categoria, categoria
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2020-02–2026-03
    territorio:
      nivel: outro
      colunas:
        regiao_metropolitana: 'nome da região metropolitana (texto com acento, ex.: Belém, São Paulo, Grande Vitória)'
        sigla_uf: UF da região
    medidas:
    - coluna: peso_mensal
      o_que: peso da categoria no índice, dentro do seu nível hierárquico
      unidade: '% (cada nível soma 100 em um mês e local)'
      soma: nao
    - coluna: variacao_mensal
      o_que: variação do mês
      unidade: '%'
      soma: nao
    - coluna: variacao_anual
      o_que: variação acumulada no ano até o mês
      unidade: '%'
      soma: nao
    - coluna: variacao_doze_meses
      o_que: variação acumulada em 12 meses (nula nos primeiros 12 meses da série)
      unidade: '%'
      soma: nao
    filtros_tipicos:
    - 'id_categoria IS NULL = linha ''Índice geral'' (total); length(id_categoria)=1 grupos, 2 subgrupos, 4 itens,
      7 subitens (medido: em cada nível o peso soma 100). Misturar níveis conta o mesmo gasto várias vezes'
    - 'id_categoria é VARCHAR (ex.: ''1'', ''11''), categoria é o nome; nomes repetem entre níveis (ex.: ''Transportes''
      é id 5 e id 51 no IPCA)'
    - 9 regiões (sem Grande Vitória, que existe no IPCA); peso e variações nulos em ~30% das linhas
    use_para: Inflação por categoria de despesa (região metropolitana) e peso de cada uma na cesta.
    nao_use_para: Não some peso_mensal nem variações entre níveis; não traz preços em reais, só variação e peso.
    rascunho:
    - use_para
    - nao_use_para
    verificado: 297702 linhas = 297702 distintos da chave; 9 regiões — medido 2026-10-27
