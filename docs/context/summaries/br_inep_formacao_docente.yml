# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_inep_formacao_docente
tabelas:
  brasil:
    grao: um Brasil × ano × grupo de formação × modalidade × rede × localização
    chave: ano, grupo, modalidade, rede, tipo_localizacao (5.040 linhas, 5.040 distintos)
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 2013–2020
    territorio:
      nivel: brasil
      colunas: {}
    medidas:
    - coluna: percentual
      o_que: '% de docentes da etapa (modalidade) naquele grupo de formação, dentro da rede e localização'
      unidade: '% (0–100) (VARCHAR: contém ''--'' em 25 linhas; faça TRY_CAST)'
      soma: nao
    filtros_tipicos:
    - 'grupo = 1..5 (codificação do dicionario; ver tabela). grupo: 1 = licenciatura com complementação pedagógica na mesma área; 2 = bacharelado sem complementação pedagógica na mesma área; 3 = superior com complementação pedagógica em área diferente; 4 = superior não considerada nas anteriores; 5 = sem formação superior (dicionario)'
    - 'modalidade (valores SEM espaço nesta tabela): ''educacaoinfantil'', ''ejaensinofundamental'', ''ejaensinomedio'', ''ensinofundamentalanosfinais'', ''ensinofundamentalanosiniciais'', ''ensinofundamentaltotal'', ''ensinomediototal'''
    - 'ano e grupo são VARCHAR nesta tabela (''2013'', ''1''), BIGINT em regiao/uf; rede: ''estadual'',''federal'',''municipal'',''privada'',''pública'',''total''; tipo_localizacao: ''rural'',''urbana'',''total'''
    - 'rede e tipo_localizacao: inclua um valor só (há linhas ''total'', ''pública'' e a soma por rede, além das redes individuais); some nada entre elas'
    - Sempre filtre modalidade (gotcha modalidade_soma_percentual)
    use_para: Distribuição percentual da formação dos docentes por etapa, rede e localização.
    nao_use_para: Contagem de docentes (a tabela só tem %); somar percentual entre modalidades, redes ou grupos de redes agregadas.
    rascunho:
    - use_para
    - nao_use_para
    verificado: '5.040 linhas, chave única; percentual VARCHAR: 25 linhas valem ''--'' e 608 não têm ponto decimal (ex. inteiros) — medido 2026-10-27'
  regiao:
    grao: um região × ano × grupo × modalidade × rede × localização
    chave: ano, regiao, grupo, modalidade, rede, tipo_localizacao (25.200 linhas, 25.200 distintos)
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 2013–2020
    territorio:
      nivel: regiao
      colunas:
        regiao: '''Centro-Oeste'',''Nordeste'',''Norte'',''Sudeste'',''Sul'''
    medidas:
    - coluna: percentual
      o_que: '% de docentes da etapa (modalidade) naquele grupo de formação, dentro da rede e localização'
      unidade: '% (0–100); 4,46% NULL'
      soma: nao
    filtros_tipicos:
    - 'grupo = 1..5 (codificação do dicionario; ver tabela). grupo: 1 = licenciatura com complementação pedagógica na mesma área; 2 = bacharelado sem complementação pedagógica na mesma área; 3 = superior com complementação pedagógica em área diferente; 4 = superior não considerada nas anteriores; 5 = sem formação superior (dicionario)'
    - 'modalidade (COM espaço, diferente de brasil): ''educacao infantil'', ''eja ensino fundamental'', ''eja ensino medio'', ''ensino fundamental anos finais'', ''ensino fundamental anos iniciais'', ''ensino fundamental total'', ''ensino medio total'''
    - 'rede e tipo_localizacao: inclua um valor só (há linhas ''total'', ''pública'' e a soma por rede, além das redes individuais); some nada entre elas'
    - Sempre filtre modalidade (gotcha modalidade_soma_percentual)
    use_para: Distribuição percentual da formação dos docentes por etapa, rede e localização.
    nao_use_para: Contagem de docentes (a tabela só tem %); somar percentual entre modalidades, redes ou grupos de redes agregadas.
    rascunho:
    - use_para
    - nao_use_para
    verificado: 25.200 linhas, chave única; percentual DOUBLE com 4,46% NULL — medido 2026-10-27
  uf:
    grao: um UF × ano × grupo × modalidade × rede × localização
    chave: ano, sigla_uf, grupo, modalidade, rede, tipo_localizacao (133.840 linhas, 133.840 distintos)
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 2013–2020
    territorio:
      nivel: uf
      colunas:
        sigla_uf: sigla da UF (27 valores)
        regiao: região da UF
    medidas:
    - coluna: percentual
      o_que: '% de docentes da etapa (modalidade) naquele grupo de formação, dentro da rede e localização'
      unidade: '% (0–100); 12,25% NULL'
      soma: nao
    filtros_tipicos:
    - 'grupo = 1..5 (codificação do dicionario; ver tabela). grupo: 1 = licenciatura com complementação pedagógica na mesma área; 2 = bacharelado sem complementação pedagógica na mesma área; 3 = superior com complementação pedagógica em área diferente; 4 = superior não considerada nas anteriores; 5 = sem formação superior (dicionario)'
    - 'modalidade (COM espaço): ''educacao infantil'', ''eja ensino fundamental'', ''eja ensino medio'', ''ensino fundamental anos finais'', ''ensino fundamental anos iniciais'', ''ensino fundamental total'', ''ensino medio total'''
    - 'rede e tipo_localizacao: inclua um valor só (há linhas ''total'', ''pública'' e a soma por rede, além das redes individuais); some nada entre elas'
    - Sempre filtre modalidade (gotcha modalidade_soma_percentual)
    use_para: Distribuição percentual da formação dos docentes por etapa, rede e localização.
    nao_use_para: Contagem de docentes (a tabela só tem %); somar percentual entre modalidades, redes ou grupos de redes agregadas.
    rascunho:
    - use_para
    - nao_use_para
    - motivo dos NULL
    verificado: '133.840 linhas, chave única; percentual NULL em 16.390 linhas (12,25%); 27 UFs; sem 4 linhas por ano para algumas redes (não é grade completa: federal 21.630, privada 22.330 linhas) — medido 2026-10-27'
