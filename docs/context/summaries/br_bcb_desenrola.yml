# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_bcb_desenrola
tabelas:
  dados:
    grao: "um mês × tipo de Desenrola × UF × conglomerado financeiro"
    chave: "DATA_BASE, TIPO_DESENROLA, UNIDADE_FEDERACAO, COD_CONGLOMERADO_FINANCEIRO (13.638 linhas = 13.638 distintos)"
    tempo: {natureza: serie_mensal, coluna: "DATA_BASE (inteiro AAAAMM)", cobertura: "202309–202608"}
    territorio: {nivel: uf, colunas: {UNIDADE_FEDERACAO: "sigla da UF (28 valores)"}}
    medidas:
      - {coluna: NUMERO_OPERACOES, o_que: "operações de renegociação no mês", unidade: "operações", soma: sim}
      - {coluna: VOLUME_OPERACOES, o_que: "valor das operações", unidade: "R$", soma: sim}
    filtros_tipicos:
      - "TIPO_DESENROLA em 1, 2, 3, 4 (inteiros; significado não documentado). Por tipo: 1 = 6.647 linhas, 2.104.204 operações, R$ 2,18 bi; 2 = 3.085, 577.641, R$ 2,33 bi; 3 = 1.510, 72.010, R$ 3,15 bi; 4 = 2.396, 1.908.562, R$ 3,66 bi"
      - "DATA_BASE = 202309 (início): 326.016 operações, R$ 1,23 bi"
    use_para: "evolução mensal do Desenrola por UF, tipo e instituição"
    nao_use_para: "saldo devedor ou número de pessoas (só operações e volume)"
    rascunho: [use_para, nao_use_para]
    verificado: "13.638 linhas, chave de 4 colunas única; total 4.662.417 operações e R$ 11.324.108.753 — medido 2026-10-27"
