      - {expressao: "V72C01, V72C02", o_que: "medidas antropométricas (rascunho: nomes sugerem peso e altura, não conferido)", unidade: "não documentada", soma: nao}
    filtros_tipicos: ["V7101 '1' a '4'; V7102 '1' sim, '2' não (rascunho: significado só no dicionário)"]
    use_para: "características da dieta e hábitos alimentares autodeclarados."
    nao_use_para: "consumo alimentar medido em quantidade (use despesa/consumo, não incluído aqui)."
    rascunho: [use_para, nao_use_para, "significado dos V71xx e V72Cxx"]
    verificado: "46.164 linhas, 46.164 id_informante — medido 2026-10-27"
  restricao_saude_2017:
    grao: "uma restrição de saúde declarada por um informante (um informante pode ter várias)"
    chave: "nenhuma: id_informante repete (24.612 informantes em 40.863 linhas); (id_informante, V9001) tem 40.743 pares, ainda 120 linhas a mais"
    tempo: {natureza: sem_tempo, coluna: "", cobertura: "pesquisa única 2017–2018"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF", situacao: "'1' urbano, '2' rural"}}
    medidas:
