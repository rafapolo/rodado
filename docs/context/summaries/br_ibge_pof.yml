    filtros_tipicos: ["V9013: '1' a '4' (significado só no dicionário, não conferido)"]
    use_para: "restrições de saúde por tipo de item (V9001) de cada informante."
    nao_use_para: "contar pessoas somando linhas (um informante repete)."
    rascunho: [use_para, nao_use_para, "significado de V9013"]
    verificado: "40.863 linhas, 24.612 id_informante, 40.743 pares (id_informante, V9001) — medido 2026-10-27"
  aluguel_estimado_2017:
    grao: "o aluguel estimado de uma unidade de consumo (imputado a quem mora em imóvel próprio ou cedido)"
    chave: "id_unidade_consumo — 48.935 linhas = 48.935 distintos (medido)"
    tempo: {natureza: sem_tempo, coluna: V9010, cobertura: "pesquisa única 2017–2018; V9010 é o mês de referência (1 a 12)"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF", situacao: "'1' urbano, '2' rural"}}
