      - {coluna: V8000, o_que: "valor nominal; 9999999.99 é código de valor imputado/sem informação (2.478 linhas)", unidade: "R$", soma: nao}
    filtros_tipicos: ["use V8000_deflacionado, nunca V8000 (sentinela 9999999.99) (gotcha valor_nominal_com_sentinela)", "indicador_imputacao_valor = 0 para valor declarado (46.446) e 1 para imputado (2.489)"]
    use_para: "aluguel imputado na despesa de habitação."
    nao_use_para: "somar V8000 bruto ou sem peso_final."
    rascunho: [use_para, nao_use_para, "unidade mensal"]
    verificado: "48.935 linhas, 48.935 id_unidade_consumo e id_domicilio; V8000 = 9999999.99 em 2.478 linhas — medido 2026-10-27"
  despesa_coletiva_2017:
    grao: "um lançamento de despesa coletiva (um produto comprado pela unidade de consumo)"
