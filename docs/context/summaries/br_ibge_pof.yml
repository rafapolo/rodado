# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ibge_pof
# Convenções comuns às tabelas (medidas em despesa_coletiva_2017, morador_2017 e domicilio_2017):
# pesquisa única de 2017–2018, sem coluna de ano; expansão com peso_final (peso é o peso sem calibração);
# situacao '1' urbano, '2' rural (dicionário); V9010 mês (1 a 12, 'Janeiro'..'Dezembro' no dicionário);
# id_domicilio liga todas as tabelas; id_unidade_consumo (UC) = id_domicilio + 2 dígitos; id_informante = UC + 2 dígitos.
tabelas:
  domicilio_2017:
    grao: "um domicílio da POF 2017–2018"
    chave: "id_domicilio — 57.920 linhas = 57.920 distintos (medido)"
    tempo: {natureza: sem_tempo, coluna: "", cobertura: "pesquisa única 2017–2018, sem coluna de ano"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF", situacao: "'1' urbano, '2' rural", id_estrato: "estrato amostral"}}
    medidas:
      - {coluna: peso_final, o_que: "peso de expansão do domicílio", unidade: "domicílios", soma: sim}
    filtros_tipicos: ["situacao = '1' urbano; '2' rural (texto)"]
    use_para: "características do domicílio (V02xx: material, água, esgoto, bens), expandidas com peso_final (soma 68.862.296 domicílios)."
    nao_use_para: "gastos e rendas (estão nas outras tabelas)."
    rascunho: [use_para, nao_use_para, "significado de cada V02xx"]
    verificado: "57.920 linhas, 57.920 id_domicilio; sum(peso_final) = 68.862.296, sum(peso) = 57.329.977 — medido 2026-10-27"
  morador_2017:
    grao: "um morador da POF 2017–2018"
    chave: "id_informante — 178.431 linhas = 178.431 distintos, em 57.920 domicílios (medido)"
    tempo: {natureza: sem_tempo, coluna: "", cobertura: "pesquisa única 2017–2018"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF", situacao: "'1' urbano, '2' rural", id_domicilio: "domicílio", id_unidade_consumo: "unidade de consumo"}}
    medidas:
      - {coluna: peso_final, o_que: "peso de expansão do morador", unidade: "pessoas", soma: sim}
      - {expressao: "renda_total, renda_monetaria_per_capita, renda_nao_monetaria_per_capita, renda_disponivel_per_capita, deducao_per_capita", o_que: "rendas da unidade de consumo e per capita (rascunho: definição exata não conferida)", unidade: "R$ (rascunho)", soma: nao}
    filtros_tipicos: ["sexo = '1' homem, '2' mulher; raca_cor = '1' branca, '2' preta, '3' amarela, '4' parda, '5' indígena, '9' sem declaração (dicionário)", "V0306 = '1' pessoa de referência da UC (dicionário)", "V0401 = '1' morador presente, '2' ausente"]
    use_para: "perfil sociodemográfico do morador (idade, sexo, raça, instrução, rendas per capita) com expansão para a população."
    nao_use_para: "somar renda_total sobre moradores como renda do país (é por UC, repete por morador)."
    rascunho: [use_para, nao_use_para, "definição das rendas"]
    verificado: "178.431 linhas = 178.431 id_informante, 57.920 id_domicilio; sum(peso_final) = 207.103.790, sum(peso) = 172.087.781 — medido 2026-10-27"
  condicoes_vida_2017:
    grao: "um informante (morador) da POF — bloco de condições de vida e percepções"
    chave: "id_informante — 58.039 linhas = 58.039 distintos (medido)"
    tempo: {natureza: sem_tempo, coluna: "", cobertura: "pesquisa única 2017–2018"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF", situacao: "'1' urbano, '2' rural"}}
    medidas:
      - {coluna: peso_final, o_que: "peso de expansão", unidade: "pessoas representadas", soma: sim}
    filtros_tipicos: ["V6101 a V6121: respostas categóricas (V61041 etc. com '1' a '3'; V6101 '1' a '6'); significado só no dicionário"]
    use_para: "percepção de suficiência de renda e condições de vida (V6101–V6121), ponderada por peso_final."
    nao_use_para: "análise de gastos."
    rascunho: [use_para, nao_use_para, "significado dos V61xx"]
    verificado: "58.039 linhas, 58.039 id_informante — medido 2026-10-27"
  caracteristicas_dieta_2017:
    grao: "um informante (morador) da POF — bloco de características da dieta"
