        max: x
        top:
        - ["A transferência voluntária, via fundo a fundo, possibilita que os recursos do Funpen sejam repassados diretamente ao fundo estadual,\
            \ com destinação às ações e objetos específicos, que têm como objetivo garantir a descentralização de recursos e fortalecer a execução\
            \ de políticas penais.  \nCada política penal se baseia em EIXO composta de aquisições diretas por parte do órgão repassador (doação)\
            \ e a descentralização de recursos (fundo a fundo), os quais, em sua grande parte, são rubricados na natureza de despesa de custeio,\
            \ da qual a formalização desse repasse se justifica para a continuidade de fomento às políticas penais na unidade federada eleita. ",
          26]
        - ['Articular órgãos e entidades da administração pública federal, dos Estados, do Distrito Federal, dos Municípios, do setor privado
            e da sociedade civil na promoção da intermediação de mão de obra para o aumento da produtividade e da empregabilidade.', 14]
        - [Aumentar a participação do SINE no total de admissões no mercado de trabalho formal por meio da promoção de ações de qualificação social
            e profissional em alinhamento com as demandas do setor produtivo apuradas por meio de solicitações diretas na plataforma SuperTec
            ou previstas em contratos com incentivos de desempenho., 7]
        - ['O programa está voltado ao desenvolvimento de ações de qualificação social e profissional a jovens e trabalhadores, de forma a contribuir
            com a formação geral, acesso e permanência no mundo de trabalho. ', 4]
        - ['Promover a execução descentralizada de atividades de assessoramento estatístico em âmbito local, observados os termos da Lei n° 13.667,
            de 2018, da Resolução CODEFAT n° 994, de 15/02/2024, e demais normativos que regulamentam a matéria.', 4]
        - ['Executar a Lei nº 14.399, de 08 de julho de 2022 (Política Nacional Aldir Blanc de Fomento à Cultura), regulamentada pelo Decreto
            nº 11.740, de 18 de outubro de 2023.', 3]
        - ['Execução da Lei 14.017, de 29 de junho de 2020 (Lei Aldir Blanc).', 3]
        - ['I - construção, reforma, ampliação e aprimoramento de estabelecimentos penais;

            II - manutenção dos serviços e realização de investimentos penitenciários, inclusive em informação e segurança;

            III - formação, aperfeiçoamento e especialização do serviço penitenciário;

            IV - aquisição de material permanente, equipamentos e veículos especializados, imprescindíveis ao funcionamento e à segurança dos
            estabelecimentos penais;

            V - implantação de medidas pedagógicas relacionadas ao trabalho profissionalizante do preso e do internado;

            VI - formação educacional e cultural do preso e do internado;

            VII - elaboração e execução de projetos destinados à reinserção social de presos, internados e egressos, inclusive por meio da realização
            de cursos técnicos e profissionalizantes;

            VIII - programas de assistência jurídica aos presos e internados carentes;

            IX - programa de assistência às vítimas de crime;

            X - programa de assistência aos dependentes de presos e internados;

            XI - participação de representantes oficiais em eventos científicos sobre matéria penal, penitenciária ou criminológica, realizados
            no Brasil ou no exterior;

            XII - publicações e programas de pesquisa científica na área penal, penitenciária ou criminológica;

            XIII - custos de sua própria gestão, excetuando-se despesas de pessoal relativas a servidores públicos já remunerados pelos cofres
            públicos.

            XIV - manutenção de casas de abrigo destinadas a acolher vítimas de violência doméstica.

            XV – implantação e manutenção de berçário, creche e seção destinada à gestante e à parturiente nos estabelecimentos penais, nos termos
            do § 2º do art. 83 e do art. 89 da Lei nº 7.210, de 11 de julho de 1984 – Lei de Execução Penal.

            XVI - programas de alternativas penais à prisão com o intuito do cumprimento de penas restritivas de direitos e de prestação de serviços
            à comunidade, executados diretamente ou mediante parcerias, inclusive por meio da viabilização de convênios e acordos de cooperação;
            e

            XVII - financiamento e apoio a políticas e atividades preventivas, inclusive da inteligência policial, vocacionadas à redução da criminalidade
            e da população carcerária.', 3]
        - ['Promover a execução descentralizada de atividades de assessoramento estatístico em âmbito local,

            observados os termos da Lei n° 13.667, de 2018, da Resolução Codefat n° 921, de 2021, e demais

            normativos que regulamentam a matéria.', 3]
        - ['Promover a integração de programas fomento de geração de emprego e renda locais, que inclui apoio à concessão de microcrédito produtivo
