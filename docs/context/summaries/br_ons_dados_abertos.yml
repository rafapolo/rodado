    chave: num_fsarh, ano_fsarh (10937 linhas = 10937 distintos)
    tempo:
      natureza: serie_de_periodos
      coluna: dat_inicio
      cobertura: dat_inicio 1804-01-01 (sentinela)–2027-05-14; dat_termino 2012-02-11–9996-12-31
    territorio:
      nivel: outro
      colunas:
        nom_reservatorio: reservatório
        nom_bacia: bacia
        nom_rio: rio
    medidas:
    - coluna: val_restricao
      o_que: valor da restrição
      unidade: depende do tipo (vazão m3/s, nível m, taxa)
      soma: nao
    filtros_tipicos:
    - 'sts_restricao IN (''Aceito'',''Vencido''): ''Aceito'' (762) são as vigentes, ''Vencido'' (10175) as encerradas; ''Aceito'' têm dat_termino >= 2026-10-13'
