# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ons_dados_abertos
tabelas:
  acesso_consumidor:
    grao: uma solicitação de acesso de consumidor à rede básica na fila de análise do ONS (um protocolo)
    chave: num_protocolo (366 linhas = 366 distintos)
    tempo:
      natureza: retrato_atual
      coluna: din_solicitacaoacesso
      cobertura: 2022-01-07–2026-09-21
    territorio:
      nivel: uf
      colunas:
        id_estado: UF do ponto de conexão
        nom_pontoconexao: subestação/linha onde se conecta
    filtros_tipicos:
    - sts_protocolo = 'Documento emitido' (287 de 366 em consumidor; os demais são 'Anulada', 'Em andamento', 'Interrompida')
    - 'nom_fila IN (''Consumidor_30Dias'',''Consumidor_120Dias''): fila de prazo de análise (215 e 151 linhas)'
    - num_rank = '-' quando fora do ranking (351 de 366); é texto
    use_para: acompanhar pedidos de conexão de grandes consumidores por UF e situação de viabilidade.
    nao_use_para: 'medir carga ou consumo: não há coluna de potência.'
    rascunho:
    - use_para
    - nao_use_para
    - significado de nom_fila e dia_contadorprocesso (texto no formato 'n / prazo')
    verificado: 366 linhas, 366 distintos de num_protocolo; tabela inteira — medido 2026-10-27
  acesso_distribuidor:
    grao: uma solicitação de acesso de distribuidora à rede básica (um protocolo)
    chave: num_protocolo (1167 linhas = 1167 distintos)
    tempo:
      natureza: retrato_atual
      coluna: din_solicitacaoacesso
      cobertura: 2021-12-30–2026-09-25
    territorio:
      nivel: uf
      colunas:
        id_estado: UF (0,09% nulo)
        nom_pontoconexao: ponto de conexão (64,6% nulo)
    filtros_tipicos:
    - sts_protocolo = 'Documento emitido' (1091 de 1167)
    - nom_fila IN ('Distribuicao_30Dias','Distribuicao_120Dias')
    use_para: acompanhar pedidos de acesso de distribuidoras por UF e viabilidade.
    nao_use_para: 'medir carga: não há coluna de potência.'
    rascunho:
    - use_para
    - nao_use_para
    verificado: 1167 linhas, 1167 distintos de num_protocolo; tabela inteira — medido 2026-10-27
  acesso_gerador:
    grao: uma solicitação de acesso de empreendimento gerador (usina) à rede básica; um protocolo pode ter várias linhas (uma por empreendimento/núcleo CEG)
    chave: 'nenhuma: num_protocolo tem 706 distintos em 4626 linhas; (num_protocolo, nom_fila, nom_solicitacaoacesso, nom_empreendimento, cod_nucleoceg) dá 4623 distintos, 3 linhas repetem'
    tempo:
      natureza: retrato_atual
      coluna: din_solicitacaoacesso
      cobertura: 2022-01-01–2026-09-22
    territorio:
      nivel: uf
      colunas:
        id_estado: UF (0,26% nulo)
        nom_pontoconexao: ponto de conexão
    medidas:
    - coluna: val_potenciainstalada
      o_que: potência do empreendimento (2,6% nulo)
      unidade: MW
      soma: sim
    filtros_tipicos:
    - 'sgl_tipoempreendimento IN (''UFV'',''EOL'',''ASSOCIADA'',''UTE'',''BIOM'',''UHE'',''PCH''): UFV (2617) e EOL (1313) dominam'
    - sts_protocolo = 'Documento emitido' (4171 de 4626; 'Anulada' 413, 'Em andamento' 42)
    - nom_ambientecontratacao IN ('ACL','ACR','ACL e ACR')
    use_para: pipeline de conexão de geração (solar, eólica) por UF e tipo, somando val_potenciainstalada com protocolo emitido.
    nao_use_para: capacidade instalada em operação (são pedidos, inclusive anulados e com início de operação até 2030).
    rascunho:
    - use_para
    - nao_use_para
    - medidas.unidade
    verificado: 4626 linhas; 706 distintos de num_protocolo; 4623 distintos da chave composta; tabela inteira — medido 2026-10-27
  acesso_provisorio:
    grao: uma solicitação de acesso provisório (conexão temporária, testes, importação/exportação) à rede básica
    chave: num_protocolo (400 linhas = 400 distintos)
    tempo:
      natureza: retrato_atual
      coluna: din_solicitacaoacesso
      cobertura: 2022-01-20–2026-09-23
    territorio:
      nivel: uf
      colunas:
        id_estado: UF
        nom_pontoconexao: ponto de conexão
    filtros_tipicos:
    - 'sgl_tipoempreendimento IN (''EXP'',''IMP'',''UTE'',''DIST'',''UC'',''BIOM'',''EOL'',''ASSOCIADA''); nom_tipoempreendimento traz o nome por extenso (ex.: ''EXPORTAÇÃO DE ENERGIA ELÉTRICA PARA O EXTERIOR'')'
    - sts_viabilidade = 'Viável' (327 de 400)
    use_para: ver pedidos de acesso provisório por tipo e UF.
    nao_use_para: 'medir potência: não há coluna de potência.'
    rascunho:
    - use_para
    - nao_use_para
    - significado de sts_solicitacao
    verificado: 400 linhas, 400 distintos de num_protocolo; tabela inteira — medido 2026-10-27
  balanco_dessem_detalhe:
    grao: um subsistema × patamar de meia hora × dia de programação (DESSEM), geração por fonte
    chave: din_programacaodia, num_patamar, cod_subsistema (96845 linhas = 96845 distintos)
    tempo:
      natureza: serie_diaria
      coluna: din_programacaodia
      cobertura: 2025-05-23–2026-10-26; 485 dias, 48 patamares/dia (meia hora)
    territorio:
      nivel: regiao
      colunas:
        cod_subsistema: N, NE, S, SE
    medidas:
    - coluna: val_demanda
      o_que: demanda programada
      unidade: MW
      soma: sim
    - coluna: val_ger_hidraulica
      o_que: geração hidráulica
      unidade: MW
      soma: sim
    - coluna: val_ger_termica
      o_que: geração térmica
      unidade: MW
      soma: sim
    - coluna: val_ger_eolica
      o_que: geração eólica
      unidade: MW
      soma: sim
    - coluna: val_ger_fotovoltaica
      o_que: geração fotovoltaica
      unidade: MW
      soma: sim
    - coluna: val_ger_mmgd
      o_que: geração de micro e minigeração distribuída
      unidade: MW
      soma: sim
    - coluna: val_ger_pch
      o_que: geração PCH
      unidade: MW
      soma: sim
    - coluna: val_ger_pct
      o_que: geração de pequenas centrais térmicas (PCT)
      unidade: MW
      soma: sim
    - coluna: val_cons_elevatoria
      o_que: consumo de bombeamento
      unidade: MW
      soma: sim
    filtros_tipicos:
    - sem filtro obrigatório; patamar 1 a 48 é a meia hora do dia (num_patamar tem 45 distintos nos dados, nem todo dia tem 48)
    use_para: balanço programado por fonte e subsistema, por meia hora, desde mai/2025.
    nao_use_para: geração verificada (é programação) ou série anterior a 2025-05-23.
    rascunho:
    - medidas.unidade
    - use_para
    - nao_use_para
    - significado de patamar = meia hora
    verificado: 96845 linhas, 96845 distintos da chave; tabela inteira. Tem menos linhas que balanco_dessem_geral (99072) — medido 2026-10-27
  balanco_dessem_geral:
    grao: um subsistema × patamar de meia hora × dia de programação (DESSEM), geração agregada por fonte
    chave: din_programacaodia, num_patamar, cod_subsistema (99072 linhas = 99072 distintos)
    tempo:
      natureza: serie_diaria
      coluna: din_programacaodia
      cobertura: 2025-05-23–2026-10-26
    territorio:
      nivel: regiao
      colunas:
        cod_subsistema: N, NE, S, SE
    medidas:
    - coluna: val_demanda
      o_que: demanda programada
      unidade: MW
      soma: sim
    - coluna: val_geracao_renovavel
      o_que: geração renovável
      unidade: MW
      soma: sim
    - coluna: val_geracao_hidraulica
      o_que: geração hidráulica
      unidade: MW
      soma: sim
    - coluna: val_geracao_termica
      o_que: geração térmica
      unidade: MW
      soma: sim
    - coluna: val_cons_elevatoria
      o_que: consumo de bombeamento
      unidade: MW
      soma: sim
    use_para: balanço programado agregado (renovável, hidráulica, térmica) por subsistema e meia hora.
    nao_use_para: detalhe por fonte renovável (use balanco_dessem_detalhe) ou dados anteriores a 2025-05-23.
    rascunho: &id001
    - medidas.unidade
    - use_para
    - nao_use_para
    verificado: 99072 linhas, 99072 distintos da chave; tabela inteira (4 subsistemas × 24768 cada) — medido 2026-10-27
  balanco_energia_subsistema_ho:
    grao: um subsistema (ou o SIN agregado) × hora, geração por fonte, carga e intercâmbio
    chave: id_subsistema, din_instante (1175037 linhas = 1175037 distintos)
    tempo:
      natureza: serie_diaria
      coluna: din_instante
      cobertura: 2000-01-01 00:00–2026-10-23 23:00, horária
    territorio:
      nivel: regiao
      colunas:
        id_subsistema: N, NE, S, SE e 'SIN' (linha de total nacional)
        nom_subsistema: nome
    medidas:
    - coluna: val_gerhidraulica
      o_que: geração hidráulica
      unidade: MWmed
      soma: sim
    - coluna: val_gertermica
      o_que: geração térmica
      unidade: MWmed
      soma: sim
    - coluna: val_gereolica
      o_que: geração eólica (4,7% nulo)
      unidade: MWmed
      soma: sim
    - coluna: val_gersolar
      o_que: geração solar (11,6% nulo)
      unidade: MWmed
      soma: sim
    - coluna: val_carga
      o_que: carga
      unidade: MWmed
      soma: sim
    - coluna: val_intercambio
      o_que: intercâmbio líquido do subsistema (negativo = importa)
      unidade: MWmed
      soma: sim
    filtros_tipicos:
    - 'id_subsistema <> ''SIN'' para somar por subsistema: a linha ''SIN'' já é o total e duplica a soma (5 linhas por hora, 1 delas SIN)'
    - 'id_subsistema vem com espaços no fim a partir de 2026 (''N  '', ''NE '', ''S  '', ''SE ''): use trim(id_subsistema)'
    use_para: geração por fonte, carga e intercâmbio por subsistema/SIN, hora a hora, desde 2000.
    nao_use_para: somar todas as linhas sem excluir SIN (conta o dobro).
    rascunho:
    - use_para
    - nao_use_para
    - medidas.unidade
    verificado: 1175037 linhas, 1175037 distintos de (id_subsistema, din_instante); 5 linhas por hora em 2026-10-20 12:00 (N, NE, S, SE e SIN); tabela inteira — medido 2026-10-27
  capacidade_geracao:
    grao: uma unidade geradora do SIN (um equipamento), com potência efetiva e datas de entrada/desativação
    chave: cod_equipamento (5796 linhas = 5796 distintos)
    tempo:
      natureza: retrato_atual
      coluna: dat_entradaoperacao
      cobertura: entrada em operação 1924-03-01–2026-10-23; dat_desativacao preenchida em 19% das linhas
    territorio:
      nivel: uf
      colunas:
        id_estado: UF
        id_subsistema: N, NE, S, SE e 'PY' (Paraguai, 10 linhas)
        nom_usina: usina
        ceg: código CEG ANEEL
    medidas:
    - coluna: val_potenciaefetiva
      o_que: potência efetiva da unidade geradora
      unidade: MW
      soma: sim
    filtros_tipicos:
    - dat_desativacao IS NULL para unidades em operação (4695 de 5796)
    - 'nom_tipousina IN (''EOLIELÉTRICA'',''TÉRMICA'',''FOTOVOLTAICA'',''HIDROELÉTRICA'',''NUCLEAR''): valores em maiúsculas com acento'
    - nom_combustivel = 'EÓLICA' (2179), 'FOTOVOLTAICA' (1222), 'HIDRÁULICA' (819), 'ÓLEO DIESEL' (890)
    use_para: capacidade instalada do SIN por fonte, subsistema e UF (soma de val_potenciaefetiva das unidades ativas).
    nao_use_para: geração realizada, ou total sem filtrar dat_desativacao (inclui unidades desativadas).
    rascunho:
    - use_para
    - nao_use_para
    - medidas.unidade
    verificado: 5796 linhas, 5796 distintos de cod_equipamento; unidades ativas 4695; soma de val_potenciaefetiva das ativas = 200,7 GW (total com desativadas 207,6 GW) — medido 2026-10-27
  capacidade_transformacao:
    grao: um transformador da rede (equipamento), com tensões e potência nominal
    chave: '(cod_equipamento, nom_transformador): 2045 linhas = 2045 distintos; cod_equipamento sozinho tem 2017 distintos (28 repetem)'
    tempo:
      natureza: retrato_atual
      coluna: dat_entradaoperacao
      cobertura: 1965-03-29–2026-10-18; dat_desativacao preenchida em 10%
    territorio:
      nivel: uf
      colunas:
        id_estado: UF
        nom_subestacao: subestação
    medidas:
    - coluna: val_potencianominal_mva
      o_que: potência nominal
      unidade: MVA
      soma: sim
    filtros_tipicos:
    - dat_desativacao IS NULL para os em operação (~90%)
    - 'nom_tipoderede vem com espaços no fim (''BASICA         '', ''COMPLEMENTAR   ''): use trim()'
    use_para: inventário de transformação por tensão, subestação e UF.
    nao_use_para: carga ou fluxo (é cadastro).
    rascunho: *id001
    verificado: 2045 linhas; 2017 distintos de cod_equipamento; 2045 de (cod_equipamento, nom_transformador); tabela inteira — medido 2026-10-27
  carga_energia_di:
    grao: um subsistema × dia, carga média
    chave: id_subsistema, din_instante (39173 linhas = 39173 distintos)
    tempo:
      natureza: serie_diaria
      coluna: din_instante
      cobertura: 2000-01-01–2026-10-23
    territorio:
      nivel: regiao
      colunas:
        id_subsistema: N, NE, S, SE (às vezes com espaço no fim; use trim)
        nom_subsistema: nome do subsistema
    medidas:
    - coluna: val_cargaenergiamwmed
      o_que: carga média do dia
      unidade: MWmed
      soma: sim
    filtros_tipicos:
    - id_subsistema sem espaços nesta tabela (N, NE, S, SE)
    use_para: carga diária por subsistema; somar os 4 subsistemas no mesmo dia dá o SIN.
    nao_use_para: 'somar dias para obter energia (é potência média: some e divida pela quantidade de dias, ou multiplique por 24 h antes).'
    rascunho:
    - use_para
    - nao_use_para
    - medidas.unidade
    verificado: 39173 linhas, 39173 distintos da chave; 4 linhas em 2026-10-20 (N, NE, S, SE), soma 84.456 MWmed — medido 2026-10-27
  carga_energia_me:
    grao: um subsistema × mês, carga média mensal
    chave: id_subsistema, din_instante (1288 linhas = 1288 distintos)
    tempo:
      natureza: serie_mensal
      coluna: din_instante
      cobertura: 2000-01-31–2026-10-31 (data = último dia do mês)
    territorio:
      nivel: regiao
      colunas:
        id_subsistema: 'N, NE, S, SE (com espaço no fim em N e S: ''N '', ''S '')'
        nom_subsistema: nome
    medidas:
    - coluna: val_cargaenergiamwmed
      o_que: carga média do mês
      unidade: MWmed
      soma: sim
    filtros_tipicos:
    - 'id_subsistema vem com espaço no fim em N e S: use trim()'
    use_para: carga mensal por subsistema.
    nao_use_para: carga horária.
    rascunho: *id001
    verificado: '1288 linhas, 1288 distintos da chave; tabela inteira. Atenção: data máxima 2026-10-31 está no futuro em relação a 2026-10-27 (mês corrente) — medido 2026-10-27'
  cargaglobal_roraima:
    grao: 'uma hora de carga de Roraima (a coluna de data perdeu a hora: cada data tem 24 linhas)'
    chave: 'nenhuma: din_instante é DATE com 1673 datas distintas em 40152 linhas (24 linhas por dia, sem coluna de hora)'
    tempo:
      natureza: serie_diaria
      coluna: din_instante
      cobertura: 2022-02-01–2026-08-31
    territorio:
      nivel: uf
    medidas:
    - coluna: val_carga_mw
      o_que: carga
      unidade: MW
      soma: sim
    filtros_tipicos:
    - 'val_carga_mw é VARCHAR com vírgula decimal (''190,2256165''): replace(val_carga_mw, '','', ''.'')::DOUBLE'
    use_para: média diária de carga de Roraima (agrupar por dia e tirar a média das 24 linhas).
    nao_use_para: análise horária (a hora não existe na tabela).
    rascunho: *id001
    verificado: 40152 linhas; 1673 datas distintas; 24 linhas em 2026-08-31 e 2026-08-30 — medido 2026-10-27
  classificacao_evt:
    grao: uma hora (data sem hora; 24 linhas por dia) com valor verificado de EVT e suas razões energética/elétrica
    chave: 'nenhuma: 731 datas distintas em 17547 linhas (24 por dia, a hora perdida)'
    tempo:
      natureza: serie_diaria
      coluna: din_instante
      cobertura: 2024-01-01–2025-12-31
    medidas:
    - coluna: val_evt_verificado
      o_que: EVT verificado (VARCHAR com vírgula decimal)
      unidade: significado não documentado
      soma: nao
    filtros_tipicos:
    - colunas val_evt_* são VARCHAR com vírgula decimal ('134,29')
    use_para: ver a classificação de EVT por dia.
    nao_use_para: qualquer cálculo sem converter a vírgula decimal.
    rascunho:
    - use_para
    - nao_use_para
    - significado de EVT (não documentado)
    - unidade
    verificado: 17547 linhas; 731 datas distintas; tabela inteira — medido 2026-10-27
  cmo_se:
    grao: um subsistema × semana operativa, custo marginal de operação (CMO) semanal e por patamar de carga
    chave: id_subsistema, din_instante (4556 linhas = 4556 distintos)
    tempo:
      natureza: serie_de_periodos
      coluna: din_instante
      cobertura: 2005-01-07–2026-10-30 (sextas; 1139 semanas)
    territorio:
      nivel: regiao
      colunas:
        id_subsistema: N, NE, S, SE
        nom_subsistema: NORTE, NORDESTE, SUDESTE, SUL (maiúsculas)
    medidas:
    - coluna: val_cmomediasemanal
      o_que: CMO médio da semana
      unidade: R$/MWh
      soma: nao
    - coluna: val_cmoleve
      o_que: CMO no patamar leve
      unidade: R$/MWh
      soma: nao
    - coluna: val_cmomedia
      o_que: CMO no patamar médio
      unidade: R$/MWh
      soma: nao
    - coluna: val_cmopesada
      o_que: CMO no patamar pesado
      unidade: R$/MWh
      soma: nao
    use_para: preço (CMO) semanal por submercado; tirar a média ou o último valor da semana.
    nao_use_para: somar preços; série horária (use cmo_tm).
    rascunho:
    - medidas.unidade
    - use_para
    - nao_use_para
    - significado de din_instante (início/fim da semana)
    verificado: 4556 linhas, 4556 distintos de (id_subsistema, din_instante); 1139 datas × 4; tabela inteira — medido 2026-10-27
  cmo_tm:
    grao: um subsistema × meia hora, CMO
    chave: id_subsistema, din_instante (470016 linhas = 470016 distintos)
    tempo:
      natureza: serie_diaria
      coluna: din_instante
      cobertura: 2020-01-01 00:00–2026-10-25 23:30, meia hora (192 linhas por dia = 48 × 4)
    territorio:
      nivel: regiao
      colunas:
        id_subsistema: N, NE, S, SE
        nom_subsistema: NORTE, NORDESTE, SUDESTE, SUL
    medidas:
    - coluna: val_cmo
      o_que: CMO
      unidade: R$/MWh
      soma: nao
    use_para: preço de curto prazo (CMO) por submercado em meia hora.
    nao_use_para: somar val_cmo; use média.
    rascunho: *id001
    verificado: 470016 linhas, 470016 distintos da chave; 192 linhas em 2026-10-20; val_cmo vai de -39,24 a 54729,62 (inclui negativos); tabela inteira — medido 2026-10-27
  curva_carga_ho:
    grao: um subsistema × hora, carga horária
    chave: id_subsistema, din_instante (940024 linhas = 940024 distintos)
    tempo:
      natureza: serie_diaria
      coluna: din_instante
      cobertura: 2000-01-01 00:00–2026-10-23 23:00, horária
    territorio:
      nivel: regiao
      colunas:
        id_subsistema: N, NE, S, SE (limpo)
        nom_subsistema: nome; o Sudeste aparece como 'SUDESTE' (227914) até 2025 e 'SUDESTE/CENTRO-OESTE' (7104) em 2026
    medidas:
    - coluna: val_cargaenergiahomwmed
      o_que: carga média da hora
      unidade: MWmed
      soma: sim
    filtros_tipicos:
    - filtre por id_subsistema (nom_subsistema muda de nome em 2026 para o Sudeste)
    use_para: carga horária por subsistema; somar 4 subsistemas na mesma hora dá o SIN.
    nao_use_para: filtrar Sudeste por nom_subsistema = 'SUDESTE' (perde 2026).
    rascunho: *id001
    verificado: 940024 linhas, 940024 distintos da chave; tabela inteira — medido 2026-10-27
  cvu_usitermica_se:
    grao: uma usina térmica × semana operativa (× revisão), custo variável unitário (CVU)
    chave: 'nenhuma: (dat_iniciosemana, cod_usinaplanejamento) tem 107047 distintos em 107089 linhas; 42 pares aparecem repetidos (os 2 vistos são linhas idênticas)'
    tempo:
      natureza: serie_de_periodos
      coluna: dat_iniciosemana
      cobertura: 2005-01-01–2026-10-24 (semanas operativas, sábado a sexta)
