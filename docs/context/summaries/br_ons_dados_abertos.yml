    nao_use_para: somar val_restricao (unidades diferentes por tipo).
    rascunho:
    - medidas.unidade
    - use_para
    - nao_use_para
    - significado de IOR
    verificado: 10937 linhas, 10937 distintos de (num_fsarh, ano_fsarh); tabela inteira — medido 2026-10-27
