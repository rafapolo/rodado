# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_mma_cnuc
tabelas:
  unidades_conservacao:
    grao: "uma unidade de conservação (UC) × foto semestral do cadastro CNUC (16 fotos); cada UC reaparece em todas as fotos em que consta"
    chave: "data_referencia, codigo_uc (44508 linhas = 44508 distintos). codigo_uc sozinho NÃO é único (repete por foto); id_uc tem 4,95% de nulos e nome_da_uc repete (3529 nomes para 3576 UCs em 2026-07)"
    tempo: {natureza: soma_de_retratos, coluna: data_referencia, cobertura: "2018-01-01–2026-07-01"}
    territorio: {nivel: outro, colunas: {uf: "UF em texto; UCs que cruzam estados trazem lista ('RS, SC', 'BA, MA, PI, TO')", municipios_abrangidos: "texto livre 'MUNICÍPIO (UF) - ...', sem código IBGE"}}
    medidas:
      - {coluna: area_soma_biomas, o_que: "área da UC somada pelos biomas (amazonia+caatinga+cerrado+mata_atlantica+pampa+pantanal+area_marinha, conferido em 2026-07)", unidade: "hectares", soma: sim}
      - {coluna: "amazonia, caatinga, cerrado, mata_atlantica, pampa, pantanal, area_marinha", o_que: "área da UC em cada bioma", unidade: "hectares", soma: sim}
      - {coluna: area_ato_legal_de_criacao, o_que: "área declarada no ato legal de criação (4,95% nulos)", unidade: "hectares", soma: sim}
      - {coluna: "count(DISTINCT codigo_uc)", o_que: "número de UCs", unidade: "UCs", soma: nao}
    filtros_tipicos: ["data_referencia = '2026-07-01' (foto mais recente): sem isso tudo é multiplicado por ~16 (ver gotcha fotos_nao_fluxo)", "esfera_administrativa IN ('Federal','Estadual','Municipal')", "grupo: valores 'Proteção Integral' e 'Uso Sustentável' na foto de 2026-07; fotos antigas usam siglas 'PI' e 'US' e 15% de nulos, então filtre por grupo só na foto recente", "categoria_de_manejo = 'Reserva Particular do Patrimônio Natural' para RPPNs (maior categoria em contagem de linhas)", "colunas que mudam de foto em foto: ver gotcha colunas_que_entram_e_saem; municípios em texto livre: ver gotcha municipios_texto_livre"]
    use_para: "contar e somar a área de unidades de conservação por esfera, categoria, UF ou bioma na foto mais recente, ou comparar fotos"
    nao_use_para: "somar linhas de várias fotos; cruzar por município (não há código IBGE); somar áreas de UCs sobrepostas como área protegida exclusiva"
    rascunho: [nao_use_para]
    verificado: "44508 linhas = 44508 distintos (data_referencia, codigo_uc); foto 2026-07-01: 3576 linhas, 3576 codigo_uc, 3575 id_uc, 3529 nomes; sum(area_soma_biomas) 263201600,7 ha (Federal 173853199, Estadual 79996022, Municipal 9352379,7); grupo 1127 Proteção Integral + 2449 Uso Sustentável; area_soma_biomas = soma dos 7 biomas em todas as 3576 linhas (tolerância 1 ha) — medido 2026-10-27"
