    nao_use_para: 'DT_ASSINATURA_PRORROGA como data: é texto dd/mm/aaaa.'
    rascunho:
    - chave
    - use_para
    - nao_use_para
    verificado: 155.651 linhas (perfil); chave não medida — medido 2026-10-27
  siconv_termo_aditivo:
    grao: um termo aditivo a um convênio
    chave: 'nenhuma: 455.215 linhas, 455.179 distintos de (NR_CONVENIO, NUMERO_TA)'
    tempo:
      natureza: serie_diaria
      coluna: DT_ASSINATURA_TA
      cobertura: texto dd/mm/aaaa, 01/01/2010–31/12/2025
    territorio: *id001
    medidas:
    - coluna: VL_GLOBAL_TA
      o_que: variação de valor global (pode ser negativa); NULL em 74,66%
      unidade: R$
      soma: sim
    - coluna: VL_REPASSE_TA
      o_que: variação do repasse
      unidade: R$
      soma: sim
    use_para: ver aditivos de valor e prazo de um convênio.
    nao_use_para: somar sem notar que 74,66% das linhas não têm valor (aditivos de prazo).
    rascunho:
    - use_para
    - nao_use_para
    verificado: 455.215 linhas, 455.179 distintos de (NR_CONVENIO, NUMERO_TA), 256.969 de ID_SOLICITACAO — medido 2026-10-27
  siconv_solicitacao_alteracao:
    grao: uma solicitação de alteração do convênio feita pelo convenente
    chave: ID_SOLICITACAO (390.899 linhas = 390.899 distintos. medido)
