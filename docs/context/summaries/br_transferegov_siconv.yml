      natureza: serie_diaria
      coluna: DATA_SOLICITACAO
      cobertura: 2008-11-20–2026-07-16
    territorio: *id001
    filtros_tipicos:
    - SITUACAO_SOLICITACAO = 'Aceita' (300.735), 'Recusada' (63.741), 'Em Análise' (20.154), 'Cadastrada' (6.269)
    use_para: ver pedidos de alteração e seu desfecho.
    nao_use_para: 'valores: a tabela não tem.'
    rascunho:
    - use_para
