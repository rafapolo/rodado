# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_transferegov_siconv
tabelas:
  siconv_proposta:
    grao: uma proposta/plano de trabalho cadastrada no SICONV/Plataforma +Brasil (inclui as que nunca viraram convênio)
    chave: ID_PROPOSTA (1.153.701 linhas = 1.153.701 distintos. medido)
    tempo:
      natureza: serie_anual
      coluna: DIA_PROPOSTA
      cobertura: 2008-01-01–2026-07-16 (DIA_PROPOSTA é DATE; ANO_PROP é INTEGER 2008–2026)
    territorio:
      nivel: municipio
      colunas:
        COD_MUNIC_IBGE: município do PROPONENTE (convenente, 7 dígitos, texto), não o local da obra
        UF_PROPONENTE: UF do proponente
        MUNIC_PROPONENTE: nome do município do proponente
    medidas:
    - coluna: VL_GLOBAL_PROP
      o_que: valor global da proposta (= VL_REPASSE_PROP + VL_CONTRAPARTIDA_PROP em 1.153.700 de 1.153.701 linhas)
      unidade: R$
      soma: sim
    - coluna: VL_REPASSE_PROP
      o_que: parcela da União
      unidade: R$
      soma: sim
    - coluna: VL_CONTRAPARTIDA_PROP
      o_que: contrapartida do proponente; há valores negativos (mín -78.764,95)
      unidade: R$
      soma: sim
    filtros_tipicos:
    - MODALIDADE = 'CONVENIO' (497.298) ou 'CONTRATO DE REPASSE' (540.581); há ainda 'CONVENIO OU CONTRATO DE REPASSE' (52.004), 'TERMO DE COMPROMISSO', 'TERMO DE FOMENTO', 'TERMO DE COLABORACAO', 'TERMO DE PARCERIA'
    - SIT_PROPOSTA = 'Proposta/Plano de Trabalho Aprovados' (276.081) para aprovadas; 'Proposta/Plano de Trabalho Rejeitados' (211.713) e 'Proposta/Plano de Trabalho Enviado para Análise' (371.965) são as maiores outras situações
    - ANO_PROP ou DIA_PROPOSTA para recortar o ano; para dinheiro de fato contratado junte com siconv_convenio por ID_PROPOSTA (só 285.743 das propostas viraram convênio)
    use_para: ver o que foi pedido ao governo federal (valor, órgão, modalidade, proponente) antes da assinatura.
    nao_use_para: 'dinheiro efetivamente repassado: propostas incluem rejeitadas e em análise; use siconv_convenio / siconv_desembolso.'
    rascunho:
    - use_para
    - nao_use_para
    verificado: 1.153.701 linhas. 1.153.701 distintos de ID_PROPOSTA; VL_GLOBAL_PROP = VL_REPASSE_PROP + VL_CONTRAPARTIDA_PROP em 1.153.700 linhas; 285.743 têm convênio (join por ID_PROPOSTA) — medido 2026-10-27
  siconv_proposta_cancelada:
    grao: uma proposta cancelada, com as mesmas colunas de siconv_proposta (mesmo grão de siconv_proposta)
    chave: ID_PROPOSTA (45.332 linhas = 45.332 distintos. medido)
    tempo:
      natureza: serie_anual
      coluna: DIA_PROPOSTA
      cobertura: 2008-08-20–2026-07-16
    territorio:
      nivel: municipio
      colunas:
        COD_MUNIC_IBGE: município do proponente (texto)
        UF_PROPONENTE: UF do proponente
    medidas:
    - coluna: VL_GLOBAL_PROP
      o_que: 'valor global; máx 1,6 trilhão de reais no perfil: valor digitado errado na origem'
      unidade: R$
      soma: sim
    filtros_tipicos:
    - 'SIT_PROPOSTA tem um único valor nesta tabela (45.332 linhas, texto começa com ''Proposta/Plano de Trabalh'', truncado no perfil): não filtra'
    use_para: estudar propostas canceladas por órgão, UF e modalidade.
    nao_use_para: 'somar VL_GLOBAL_PROP sem tratar outliers (máx 1,6e12): um registro domina a soma.'
    rascunho:
    - filtros_tipicos
    - use_para
    - nao_use_para
    verificado: 45.332 linhas. 45.332 distintos de ID_PROPOSTA — medido 2026-10-27
  siconv_convenio:
    grao: um convênio / contrato de repasse / termo (instrumento) com número NR_CONVENIO, já com situação e valores
    chave: NR_CONVENIO (285.743 linhas = 285.743 distintos. medido); ID_PROPOSTA também é único (285.743) e liga à proposta
    tempo:
      natureza: serie_anual
      coluna: DIA_ASSIN_CONV
      cobertura: 2008-09-15–2026-07-17 (DATE; 50.118 linhas sem data de assinatura = não assinados, IND_ASSINADO = 'NÃO'); o texto ANO é VARCHAR
    territorio:
      nivel: nenhum
      colunas:
        NR_CONVENIO: liga a empenho, desembolso, pagamento, licitação etc.
        ID_PROPOSTA: liga à proposta (município do proponente está em siconv_proposta)
    medidas:
    - coluna: VL_GLOBAL_CONV
      o_que: valor global (= VL_REPASSE_CONV + VL_CONTRAPARTIDA_CONV em 277.410 de 285.743 linhas)
      unidade: R$
      soma: sim
    - coluna: VL_REPASSE_CONV
      o_que: repasse da União
      unidade: R$
      soma: sim
    - coluna: VL_CONTRAPARTIDA_CONV
      o_que: contrapartida do convenente (há negativos)
      unidade: R$
      soma: sim
    - coluna: VL_DESEMBOLSADO_CONV
      o_que: 'total desembolsado no convênio; NULL em 98.446 linhas. A soma da tabela inteira (R$ 150,246 bi) é igual à de siconv_desembolso: não some as duas'
      unidade: R$
      soma: sim
    - coluna: VL_EMPENHADO_CONV
      o_que: 'empenhado; é VARCHAR com vírgula decimal (ex.: ''1878146,98''): troque a vírgula por ponto e converta (0 valores falham)'
      unidade: R$
      soma: sim
    filtros_tipicos:
    - 'INSTRUMENTO_ATIVO = ''SIM'' (113.020) é o indicador de ativo da tabela; SIT_CONVENIO = ''Em execução'' (45.873) é outra coisa e menor: todos os ''Em execução'' são ativos, mas os ativos incluem 49.100 de outras situações e 18.047 com SIT_CONVENIO
      NULL'
    - SIT_CONVENIO = 'Prestação de Contas Concluída' (90.951), 'Prestação de Contas Aprovada' (42.968), 'Convênio Anulado' (23.101), 'Cancelado' (7.453), 'Convênio Rescindido' (2.334), 'Inadimplente' (371)
    - IND_ASSINADO = 'SIM' (235.625) para instrumentos assinados; os 50.118 'NÃO' não têm DIA_ASSIN_CONV
    use_para: contar e somar convênios por situação, ano de assinatura, valores de repasse e desembolso.
    nao_use_para: achar o município da obra (a tabela não tem município; o do proponente está em siconv_proposta) ou somar desembolso junto com siconv_desembolso.
    rascunho:
    - use_para
    - nao_use_para
    verificado: '285.743 linhas. 285.743 distintos de NR_CONVENIO; INSTRUMENTO_ATIVO: SIM 113.020, NÃO 172.723; SIT_CONVENIO NULL em 18.047 — medido 2026-10-27'
  siconv_desembolso:
    grao: um desembolso (ordem bancária) de recursos da União a um convênio
    chave: ID_DESEMBOLSO (378.212 linhas = 378.212 distintos. medido)
    tempo:
      natureza: serie_diaria
      coluna: DATA_DESEMBOLSO
      cobertura: 1900-06-24–2026-07-16; 1 linha com data anterior a 2008 (1900-06-24) é erro de digitação
    territorio:
      nivel: nenhum
      colunas:
        NR_CONVENIO: liga a siconv_convenio
    medidas:
    - coluna: VL_DESEMBOLSADO
      o_que: valor desembolsado; soma total R$ 150,246 bi = soma de VL_DESEMBOLSADO_CONV em siconv_convenio
      unidade: R$
      soma: sim
    filtros_tipicos:
    - 'ANO_DESEMBOLSO = 2025 (INTEGER): 24.570 desembolsos e R$ 18,38 bi'
    - 'QTD_DIAS_SEM_DESEMBOLSO e DT_ULT_DESEMBOLSO são atributos do convênio repetidos em cada linha: não some nem conte por linha'
    use_para: série de dinheiro repassado por mês/ano e convênio.
    nao_use_para: somar junto com VL_DESEMBOLSADO_CONV de siconv_convenio (é o mesmo dinheiro).
    rascunho:
    - use_para
    - nao_use_para
    verificado: '378.212 linhas. 378.212 distintos de ID_DESEMBOLSO; ANO_DESEMBOLSO=2025: 24.570 linhas, R$ 18.381.182.387,46 — medido 2026-10-27'
  siconv_empenho:
    grao: um empenho (nota de empenho, incluindo anulações e reforços) de um convênio
    chave: ID_EMPENHO + NR_CONVENIO (434.899 linhas = 434.899 distintos, medido); ID_EMPENHO sozinho repete (335.655 distintos) e NR_CONVENIO + NR_EMPENHO também (431.913)
    tempo:
      natureza: serie_anual
      coluna: DATA_EMISSAO
      cobertura: texto dd/mm/aaaa, 01/01/2020–31/12/2025 em ordem textual
    territorio:
      nivel: nenhum
      colunas:
        NR_CONVENIO: liga a siconv_convenio
    medidas:
    - coluna: VALOR_EMPENHO
      o_que: valor da nota; anulações e cancelamentos são negativos (mín -135.719.747,19), então a soma é líquida
      unidade: R$
      soma: sim
    filtros_tipicos:
    - 'DESC_TIPO_NOTA = ''Empenho Original'' (199.829, R$ 110,32 bi) ou ''Ordinário'' (54.991) para empenhos novos; ''Anulação de Empenho'' (25.386) e ''OUTROS CANC DE RP'' (43.977) são negativos. TIPO_NOTA é código ambíguo: ''01'' vale ''Empenho Original''
      e ''Ordinário'', ''05'' vale ''Global'' e ''Estorno de Anulação de Empenho'', ''03'' vale ''Anulação de Empenho'' e ''Estimativo'''
    - 'COD_SITUACAO_EMPENHO = ''4'' (252.075), ''ENVIADO'' (158.766) ou ''6'' (24.058): significado de ''4'' não documentado; DESC_SITUACAO_EMPENHO só tem ''Enviado'' e ''Registrado no SIAFI'''
    use_para: dinheiro empenhado por convênio, UG emitente e fonte.
    nao_use_para: somar VALOR_EMPENHO filtrando um só tipo de nota achando que é o total (cancelamentos negativos ficam de fora).
    rascunho:
    - use_para
    - nao_use_para
    verificado: 434.899 linhas. 434.899 distintos de (ID_EMPENHO. NR_CONVENIO); ID_EMPENHO sozinho 335.655 distintos — medido 2026-10-27
  siconv_empenho_desembolso:
    grao: ligação entre um desembolso e um empenho que o cobre
    chave: 'nenhuma: (ID_DESEMBOLSO, ID_EMPENHO) tem 382.768 distintos em 382.787 linhas, ou seja 19 repetidas; ID_EMPENHO é NULL em 36,16% das linhas'
    tempo:
      natureza: sem_tempo
    territorio: &id001
      nivel: nenhum
    medidas:
    - coluna: VALOR_GRUPO
      o_que: parte do desembolso atribuída ao empenho (NULL em 36,13%)
      unidade: R$
      soma: sim
    use_para: ligar siconv_desembolso a siconv_empenho (por ID_DESEMBOLSO e ID_EMPENHO).
    nao_use_para: 'contar desembolsos: ID_DESEMBOLSO repete (382.787 linhas, 378.237 distintos) quando há mais de um empenho.'
    rascunho:
    - use_para
    - nao_use_para
    verificado: 382.787 linhas, 382.768 distintos de (ID_DESEMBOLSO, ID_EMPENHO), 378.237 de ID_DESEMBOLSO — medido 2026-10-27
  siconv_pagamento:
    grao: um pagamento do convenente a um fornecedor/favorecido (movimento financeiro)
    chave: NR_MOV_FIN (7.359.136 linhas = 7.359.136 distintos. medido)
    tempo:
      natureza: serie_diaria
      coluna: DATA_PAG
      cobertura: 2001-01-19–2026-07-16
    territorio:
      nivel: nenhum
      colunas:
        NR_CONVENIO: liga a siconv_convenio
    medidas:
    - coluna: VL_PAGO
      o_que: valor pago; 27 linhas negativas (estorno)
      unidade: R$
      soma: sim
    filtros_tipicos:
    - TP_MOV_FINANCEIRA = 'PAGAMENTO A FAVORECIDO COM OBTV' (5.518.429) ou 'PAGAMENTO A FAVORECIDO' (1.840.707)
    - DESC_DL = 'FOLHA DE PAGAMENTO' / 'NOTA FISCAL' / 'DIÁRIAS' etc. (21 tipos de documento)
    use_para: quanto o convenente pagou, a quem e quando.
    nao_use_para: 'identificar o favorecido por CPF: IDENTIF_FORNECEDOR vem mascarado (ex.: ''***00000***'') e nulo em 7,79%.'
    rascunho:
    - use_para
    - nao_use_para
    verificado: 7.359.136 linhas. 7.359.136 distintos de NR_MOV_FIN; 27 VL_PAGO negativos — medido 2026-10-27
  siconv_obtv_convenente:
    grao: um favorecido de uma ordem bancária de tesouro voluntário (OBTV) paga pelo convenente
    chave: 'nenhuma: 3.051.514 linhas, 3.018.020 distintos de (NR_MOV_FIN, IDENTIF_FAVORECIDO_OBTV_CONV, VL_PAGO_OBTV_CONV); NR_MOV_FIN repete (357.195 distintos)'
    tempo:
      natureza: sem_tempo
    territorio: *id001
    medidas:
    - coluna: VL_PAGO_OBTV_CONV
      o_que: valor pago ao favorecido (há negativos)
      unidade: R$
      soma: sim
    use_para: 'detalhar os favorecidos finais de pagamentos com OBTV (liga a siconv_pagamento por NR_MOV_FIN: todas as 3.051.514 linhas casam).'
    nao_use_para: 'achar a data: a tabela não tem data, vem de siconv_pagamento.'
    rascunho:
    - use_para
    - nao_use_para
    verificado: 3.051.514 linhas; 3.018.020 distintos de (NR_MOV_FIN, IDENTIF_FAVORECIDO_OBTV_CONV, VL_PAGO_OBTV_CONV); todas ligam a siconv_pagamento — medido 2026-10-27
  siconv_pagamento_tributo:
    grao: um pagamento de tributo feito pelo convenente (agrupado por convênio e data)
    chave: nenhuma única simples; (NR_CONVENIO, DATA_TRIBUTO, VL_PAG_TRIBUTOS) é único (450.477 = 450.477, medido)
    tempo:
      natureza: serie_diaria
      coluna: DATA_TRIBUTO
      cobertura: texto dd/mm/aaaa, 01/01/2010–31/12/2021 em ordem textual
    territorio: *id001
    medidas:
    - coluna: VL_PAG_TRIBUTOS
      o_que: tributo pago
      unidade: R$
      soma: sim
    use_para: tributos pagos com recursos do convênio.
    nao_use_para: datas como texto sem converter.
    rascunho:
    - use_para
    - nao_use_para
    verificado: 450.477 linhas. 450.477 distintos de (NR_CONVENIO. DATA_TRIBUTO. VL_PAG_TRIBUTOS) — medido 2026-10-27
  siconv_ingresso_contrapartida:
    grao: um ingresso de contrapartida do convenente na conta do convênio
    chave: '(NR_CONVENIO, DT_INGRESSO_CONTRAPARTIDA, VL_INGRESSO_CONTRAPARTIDA): 343.600 linhas = 343.600 distintos, medido'
    tempo:
      natureza: serie_diaria
      coluna: DT_INGRESSO_CONTRAPARTIDA
      cobertura: 2000-01-01–2026-07-16
    territorio: *id001
    medidas:
    - coluna: VL_INGRESSO_CONTRAPARTIDA
      o_que: valor ingressado
      unidade: R$
      soma: sim
    use_para: acompanhar se a contrapartida foi depositada.
    nao_use_para: repasse da União.
    rascunho:
    - use_para
    - nao_use_para
    verificado: 343.600 linhas. 343.600 distintos de as três colunas juntas — medido 2026-10-27
  siconv_desbloqueio_cr:
    grao: um desbloqueio de recursos da conta do contrato de repasse (OB, ingresso de contrapartida ou rendimento)
    chave: 'nenhuma: 520.479 linhas, 520.474 distintos de (NR_CONVENIO, NR_OB, DATA_CADASTRO, TIPO_RECURSO_DESBLOQUEIO, VL_TOTAL_DESBLOQUEIO, VL_DESBLOQUEADO, VL_BLOQUEADO)'
    tempo:
      natureza: serie_diaria
      coluna: DATA_CADASTRO
      cobertura: 2013-02-25–2026-07-16
    territorio: *id001
    medidas:
    - coluna: VL_DESBLOQUEADO
      o_que: valor desbloqueado
      unidade: R$
      soma: sim
    - coluna: VL_TOTAL_DESBLOQUEIO
      o_que: total do desbloqueio (repetido nas linhas do mesmo ato)
      unidade: R$
      soma: nao
    - coluna: VL_BLOQUEADO
      o_que: VARCHAR com vírgula decimal
      unidade: R$
      soma: nao
    filtros_tipicos:
    - TIPO_RECURSO_DESBLOQUEIO = 'OB' (313.553), 'INGRESSO CONTRAPARTIDA' (205.974) ou 'RENDIMENTO APLICAÇÃO' (952)
    use_para: ver o fluxo de desbloqueios em contratos de repasse (Caixa).
    nao_use_para: somar VL_TOTAL_DESBLOQUEIO.
    rascunho:
    - use_para
    - nao_use_para
    verificado: 520.479 linhas, 520.474 distintos das 7 colunas — medido 2026-10-27
  siconv_cronograma_desembolso:
    grao: uma parcela prevista do cronograma de desembolso de uma proposta, por responsável (Concedente, Convenente, Rendimento de Aplicação)
    chave: '(ID_PROPOSTA, NR_PARCELA_CRONO_DESEMBOLSO, TIPO_RESP_CRONO_DESEMBOLSO): 2.732.825 linhas = 2.732.825 distintos, medido'
    tempo:
      natureza: serie_de_periodos
      coluna: ANO_CRONO_DESEMBOLSO + MES_CRONO_DESEMBOLSO
      cobertura: ano 9–2035 (24 linhas com ano < 2000 são erro de digitação)
    territorio: *id001
    medidas:
    - coluna: VALOR_PARCELA_CRONO_DESEMBOLSO
      o_que: valor previsto da parcela; máx R$ 10,58 bi em uma parcela (outlier)
      unidade: R$
      soma: sim
    filtros_tipicos:
    - 'TIPO_RESP_CRONO_DESEMBOLSO = ''Concedente'' (1.494.914), ''Convenente'' (1.226.937) ou ''Rendimento de Aplicação'' (10.974): separe, pois a parte do convenente é contrapartida'
    use_para: ver o que estava planejado desembolsar, não o realizado.
    nao_use_para: dinheiro efetivamente repassado (use siconv_desembolso).
    rascunho:
    - use_para
    - nao_use_para
    verificado: 2.732.825 linhas. 2.732.825 distintos de (ID_PROPOSTA. NR_PARCELA. TIPO_RESP) — medido 2026-10-27
  siconv_historico_situacao:
    grao: uma mudança de situação de uma proposta/convênio (evento de histórico)
    chave: 'nenhuma: 8.957.864 linhas, 8.919.014 distintos de (ID_PROPOSTA, DIA_HISTORICO_SIT, COD_HISTORICO_SIT)'
    tempo:
      natureza: serie_diaria
      coluna: DIA_HISTORICO_SIT
      cobertura: 1991-12-05–2026-07-16 (TIMESTAMP)
    territorio: *id001
    filtros_tipicos:
    - 'HISTORICO_SIT = ''PROPOSTA_CADASTRADA'' (cod 10), ''PROPOSTA_ENVIADA_ANALISE'' (11), ''PLANO_TRABALHO_APROVADO'' (24), ''EM_EXECUCAO'' (32): 32 valores'
    use_para: reconstruir a linha do tempo de uma proposta ou convênio.
    nao_use_para: 'contar situação atual: tome o último evento por ID_PROPOSTA.'
    rascunho:
    - use_para
    - nao_use_para
    verificado: 8.957.864 linhas; 8.919.014 distintos de (ID_PROPOSTA, DIA_HISTORICO_SIT, COD_HISTORICO_SIT) — medido 2026-10-27
  siconv_prorroga_oficio:
    grao: uma prorrogação de ofício de vigência de um convênio
    chave: 'nenhuma: não medido; NR_CONVENIO repete (155.651 linhas, ~89.937 distintos no perfil)'
    tempo:
      natureza: serie_de_periodos
      coluna: DT_INICIO_PRORROGA / DT_FIM_PRORROGA
      cobertura: 2008-10-30–2031-01-04
