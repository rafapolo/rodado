# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_mgi_compras_publicas
tabelas:
  ata_registro_preco:
    grao: "não lida: tabela sem view no banco (Catalog Error: Table with name ata_registro_preco does not exist)"
  ata_registro_preco_item:
    grao: "não lida: tabela sem view no banco (Catalog Error: Table with name ata_registro_preco_item does not exist)"
  contratacao:
    grao: "não lida: tabela sem view no banco (Catalog Error: Table with name contratacao does not exist)"
  contratacao_item:
    grao: "não lida: tabela sem view no banco (Catalog Error: Table with name contratacao_item does not exist)"
  contratacao_item_resultado:
    grao: "não lida: tabela sem view no banco (Catalog Error: Table with name contratacao_item_resultado does not exist)"
  catalogo_material:
    grao: "um item do catálogo de materiais (CATMAT) na extração de 2026-10-04"
    chave: "codigo_item: 345.283 linhas = 345.283 distintos"
    tempo: {natureza: retrato_atual, coluna: data_extracao, cobertura: "2026-10-04–2026-10-04"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos: ["indicador_item_ativo = true (BOOLEAN; 249.745 de 345.283 ativos)"]
    use_para: "classificar materiais (grupo, classe, PDM) de licitacao_item e outras tabelas"
    nao_use_para: "preço ou quantidade: o catálogo não tem valores; descricao_ncm é 100% nula"
    rascunho: [use_para, nao_use_para]
    verificado: "345.283 linhas, chave confirmada, 249.745 ativos — medido 2026-10-27"
  catalogo_servico:
    grao: "um serviço do catálogo CATSER na extração de 2026-10-04"
    chave: "codigo_servico: 2.970 = 2.970"
    tempo: {natureza: retrato_atual, coluna: data_extracao, cobertura: "2026-10-04–2026-10-04"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos: ["indicador_servico_ativo = true (BOOLEAN)"]
    use_para: "classificar serviços (seção, divisão, grupo, classe)"
    nao_use_para: "preço ou quantidade"
    rascunho: [use_para, nao_use_para]
    verificado: "2.970 linhas, chave confirmada — medido 2026-10-27"
  fornecedor:
    grao: "um fornecedor do cadastro (cópia do SICAF, gotcha fornecedor_duplica_sicaf), pessoa jurídica ou física"
    chave: "nenhuma: 962.012 linhas, 943.071 distintos de coalesce(cnpj, cpf); ~19.000 repetem"
    tempo: {natureza: retrato_atual, coluna: data_extracao, cobertura: "2026-10-04–2026-10-04"}
    territorio: {nivel: municipio, colunas: {sigla_uf: "UF", nome_municipio: "nome do município (texto)"}}
    filtros_tipicos: ["indicador_fornecedor_ativo = true (826.568 linhas)", "indicador_habilitado_licitar = true (826.104)", "cnpj IS NOT NULL para pessoa jurídica (cpf preenchido em 80% das linhas, nulo em cnpj)"]
    use_para: "porte, CNAE e natureza jurídica de fornecedores que ganham licitações"
    nao_use_para: "somar junto de br_comprasgov_sicaf.fornecedores (mesma fonte); contar linhas como fornecedores"
    rascunho: [use_para, nao_use_para]
    verificado: "962.012 linhas; coalesce(cnpj,cpf) 943.071 distintos; nenhuma linha sem os dois; ativos 826.568 — medido 2026-10-27"
  orgao:
    grao: "um órgão cadastrado (SIORG/SIASG) na extração de 2026-10-04"
    chave: "codigo_orgao: 12.056 = 12.056"
    tempo: {natureza: retrato_atual, coluna: data_extracao, cobertura: "2026-10-04–2026-10-04"}
    territorio: {nivel: nenhum, colunas: {esfera: "F, E, M", poder: "E, L (ou nulo)"}}
    filtros_tipicos: ["indicador_uso_sisg = true (órgãos que usam o SISG)", "esfera = 'F' para federal (valores do perfil: M, E, F)"]
    use_para: "hierarquia de órgãos (vinculado, superior) e esfera/poder"
    nao_use_para: "valor de compras"
    rascunho: [use_para, nao_use_para]
    verificado: "12.056 linhas, chave confirmada — medido 2026-10-27"
  unidade_administrativa:
    grao: "uma unidade administrativa (UASG)"
    chave: "nenhuma conferida (tabela não perfilada)"
    use_para: "ligar codigo_uasg a órgão e município"
    rascunho: [grao, chave, use_para]
    verificado: "não medido — a tabela não está no perfil"
  licitacao:
    grao: "uma licitação (aviso) de compra pública federal"
    chave: "id_compra: 940.703 linhas = 940.703 distintos (identificador também)"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "1997–2025 (data_publicacao)"}
    territorio: {nivel: ponto, colunas: {codigo_uasg: "unidade compradora", codigo_municipio_uasg: "município da UASG"}}
    medidas:
      - {coluna: valor_estimado_total, o_que: "valor estimado (nulo em 20,5%; há valores negativos)", unidade: "R$", soma: sim}
      - {coluna: valor_homologado_total, o_que: "valor homologado", unidade: "R$", soma: sim}
    filtros_tipicos: ["codigo_modalidade = '5' (PREGÃO, 831.953 de 940.703); outras: '2' tomada de preços, '1' convite, '3' concorrência, '99' RDC", "ano = <ano>"]
    use_para: "contagem e valor de licitações por modalidade, UASG e ano"
    nao_use_para: "valores totais sem checar outliers: o perfil mostra máximos inverossímeis em valor_estimado_total/valor_homologado_total"
    rascunho: [use_para]
    verificado: "940.703 linhas, id_compra e identificador únicos; modalidades medidas — medido 2026-10-27"
  licitacao_item:
    grao: "um item de licitação (exceto pregão eletrônico) × ano"
    chave: "nenhuma: 4.738.615 linhas, 4.735.922 id_compra_item distintos (2.693 repetidos)"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "1990–2024"}
    territorio: {nivel: ponto, colunas: {codigo_uasg: "unidade compradora"}}
    medidas:
      - {coluna: valor_estimado, o_que: "valor estimado do item (nulo em 4.934 linhas)", unidade: "R$", soma: sim}
      - {coluna: quantidade, o_que: "quantidade", unidade: "unidade do item", soma: nao}
    filtros_tipicos: ["ano = 2022 (3.185 linhas; as partições recentes são pequenas, 2024 tem 1 linha)", "codigo_item_material ou codigo_item_servico preenchido: um dos dois"]
    use_para: "itens e preços de licitações até 2024 (gotcha compras_terminam_em_2024)"
    nao_use_para: "pregão eletrônico (use licitacao_item_pregao); CPF do vencedor (cpf_vencedor_com_letras)"
    rascunho: [use_para, nao_use_para]
    verificado: "4.738.615 linhas; 2.693 chaves repetidas; ano 2022: 3.185 linhas, 3.162 id_compra_item — medido 2026-10-27"
  licitacao_item_pregao:
    grao: "um item de pregão eletrônico"
    chave: "id_compra_item em ano = 2020: 1.353.838 linhas = 1.353.838 distintos; ano = 2025: 1.408 = 1.408"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "2000–2025"}
    territorio: {nivel: nenhum, colunas: {}}
    medidas:
      - {coluna: valor_homologado_item, o_que: "valor homologado do item (nulo em 32% na amostra)", unidade: "R$", soma: sim}
      - {coluna: valor_estimado_item, o_que: "valor estimado", unidade: "R$", soma: sim}
    filtros_tipicos: ["situacao_item = 'homologado' (valores: homologado, adjudicado, cancelado, cancelado no julgamento, cancelado na adjudicação, encerrado)", "ano = <ano>"]
    use_para: "itens de pregão eletrônico por situação e valor"
    nao_use_para: "chave em todos os anos: só medida em 2020 e 2025"
    rascunho: [use_para]
    verificado: "24.794.084 linhas; ano 2020 e 2025 com chave confirmada — medido 2026-10-27"
  licitacao_pregao:
    grao: "um pregão eletrônico (cabeçalho)"
    chave: "id_compra: 1.065.272 = 1.065.272"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "2000–2024"}
    territorio: {nivel: nenhum, colunas: {codigo_orgao: "órgão", nome_uasg: "unidade"}}
    medidas:
      - {coluna: valor_homologado_total, o_que: "valor homologado do pregão", unidade: "R$", soma: sim}
    filtros_tipicos: ["situacao_pregao = 'homologado' (também aberto, deserto, suspenso, fechado)"]
    use_para: "contagem de pregões por situação e ano"
    nao_use_para: "somar valor_homologado_total sem filtrar outliers: soma de 2023 homologados deu 2,3e17 R$"
    rascunho: [use_para]
    verificado: "1.065.272 linhas, chave confirmada; valor_homologado_total 2023 com situacao_pregao = 'homologado' soma absurda — medido 2026-10-27"
  compra_sem_licitacao:
    grao: "uma compra direta (dispensa ou inexigibilidade)"
    chave: "nenhuma: 5.235.862 linhas, 5.235.771 id_compra distintos (91 repetidos)"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "1997–2025"}
    territorio: {nivel: ponto, colunas: {codigo_uasg: "unidade", codigo_orgao: "órgão"}}
    medidas:
      - {coluna: valor_estimado, o_que: "valor estimado da compra (nulo em 14%)", unidade: "R$", soma: sim}
    filtros_tipicos: ["codigo_modalidade IN ('6','7') (6 e 7 são as únicas; significado não documentado aqui, ver modalidade em compra_sem_licitacao_item)"]
    use_para: "contagem de dispensas/inexigibilidades por órgão e ano"
    nao_use_para: "itens e fornecedor (use compra_sem_licitacao_item)"
    rascunho: [use_para, filtros_tipicos]
    verificado: "5.235.862 linhas; 5.235.771 id_compra distintos — medido 2026-10-27"
  compra_sem_licitacao_item:
    grao: "um item de compra sem licitação"
    chave: "nenhuma: 4.827.874 linhas, 4.827.808 id_compra_item distintos (66 repetidos)"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "1997–2024"}
    territorio: {nivel: ponto, colunas: {codigo_uasg: "unidade", codigo_orgao: "órgão"}}
    medidas:
      - {coluna: valor_estimado_item, o_que: "valor estimado do item (nulo em ~21%)", unidade: "R$", soma: sim}
      - {coluna: quantidade_material, o_que: "quantidade", unidade: "unidade do item", soma: nao}
    filtros_tipicos: ["modalidade = 'Dispensa' ou 'Inexigibilidade' (2023: 97.605 e 25.775 itens)", "tipo_item = 'material' ou 'servico' (2023: 58.344 e 65.036)"]
    use_para: "itens, fornecedor vencedor e valor de dispensas e inexigibilidades até 2024"
    nao_use_para: "identificar pessoa física por cpf_vencedor (gotcha cpf_vencedor_com_letras)"
    rascunho: [use_para]
    verificado: "4.827.874 linhas; 66 id_compra_item repetidos; 2023: 123.380 linhas — medido 2026-10-27"
  pregao_item_evento:
    grao: "um evento de um item de pregão (ordem_evento 1 a 6)"
    chave: "(id_compra, numero_item, ordem_evento) em ano = 2020: 966.299 = 966.299"
    tempo: {natureza: serie_de_periodos, coluna: data_hora_evento, cobertura: "ano 2002–2024"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos: ["ano = <ano> (16 milhões de linhas em 2024)"]
    use_para: "linha do tempo de um item de pregão"
    nao_use_para: "valores (não há)"
    rascunho: [use_para]
    verificado: "chave confirmada só em ano = 2020 — medido 2026-10-27"
  pregao_item_oferta:
    grao: "uma oferta de um fornecedor a um item de pregão"
    chave: "(id_compra, numero_item, cnpj_cpf_fornecedor) em ano = 2020: 966.818 = 966.818"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "2004–2024"}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos: ["ano = <ano>"]
    use_para: "ofertas e fornecedores concorrentes por item"
    nao_use_para: "chave em outros anos: só medida em 2020"
    rascunho: [use_para]
    verificado: "chave confirmada só em ano = 2020 — medido 2026-10-27"
  dicionario:
    grao: "um código (id_tabela × nome_coluna × chave × cobertura_temporal) com o significado em valor"
    chave: "82 linhas = 82 distintos"
    use_para: "traduzir códigos das tabelas de compras"
    verificado: "82 linhas, chave confirmada — medido 2026-10-27"
