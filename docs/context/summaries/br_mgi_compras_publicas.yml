    use_para: "quem ganhou cada item de compra e por quanto (ligue a contratacao_item por id_compra_item)."
    nao_use_para: "dados de pessoas: ni_fornecedor e nome do fornecedor podem ser pessoa física; somar sem excluir resultados cancelados."
    rascunho: [use_para, nao_use_para]
