# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_mp_pep
tabelas:
  cargos_funcoes:
    grao: "uma célula agregada do Painel Estatístico de Pessoal: mês × órgão × função/nível × UF × sexo × raça/cor × faixa etária × escolaridade, com a quantidade de cargos comissionados e funções ocupados (não é pessoa nem CPF; ver gotcha nao_e_pessoa_exposta)"
    chave: "ano, mes, funcao, natureza_juridica, orgao_superior, escolaridade_servidor, orgao, regiao, sexo, nivel_funcao, subnivel_funcao, sigla_uf, faixa_etaria, raca_cor (1799733 linhas = 1799733 distintos)"
    tempo: {natureza: serie_mensal, coluna: "ano, mes", cobertura: "1999-12–2025-05: só dezembro de 1999 a 2017; 12 meses de 2018 a 2023; 2024 com 11 meses (sem dezembro); 2025 só meses 1 a 5"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF de lotação (DF concentra 878484 linhas)", regiao: "região da UF"}}
    medidas:
      - {coluna: cce_e_fce, o_que: "cargos CCE e funções FCE ocupados (Cargos Comissionados Executivos e Funções Comissionadas Executivas, nomes inferidos das siglas)", unidade: "cargos ocupados no mês", soma: sim}
      - {coluna: das_e_correlatas, o_que: "cargos DAS e correlatas ocupados", unidade: "cargos ocupados no mês", soma: sim}
    filtros_tipicos: ["fixe um mês (ano = 2023 AND mes = 12): é um estoque mensal, então somar meses conta o mesmo cargo várias vezes", "DAS e CCE/FCE trocam de lugar com o tempo: em 2023-12 funcao = 'DAS' tem só 13 em das_e_correlatas e CCX/FEX têm tudo em cce_e_fce (7533 e 30419); some as duas colunas para o total de cargos", "funcao IN ('FEX','DAS','FPE','CCX','FCI','FCD','FDI','FPR')", "natureza_juridica IN ('Administração Direta Federal','Autarquia Federal','Fundação Federal')", "sexo IN ('Masculino','Feminino')"]
    use_para: "contar cargos e funções comissionados do Executivo federal por órgão, UF, sexo, raça/cor, faixa etária e escolaridade num mês"
    nao_use_para: "identificar pessoas ou PEP; somar vários meses; série mensal antes de 2018 (só dezembro) ou comparação de 2024-12 e 2025-06 em diante (meses ausentes)"
    rascunho: [use_para, nao_use_para, significado das siglas CCE e FCE]
    verificado: "1799733 linhas = 1799733 distintos nas 14 colunas de dimensão; 2023 (12 meses): 285657 linhas, nenhuma com as duas medidas zeradas; 2023-12: cce_e_fce + das_e_correlatas = 37968 (cce_e_fce 37952, das_e_correlatas 16); 2023-01: 36011; meses por ano medidos (2024 sem dezembro) — medido 2026-10-27"
