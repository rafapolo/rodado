# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ibge_cnefe
tabelas:
  enderecos:
    grao: "um endereço (domicílio ou estabelecimento) do CNEFE do Censo 2022, com coordenada; ~111,1 mi de linhas no Brasil"
    chave: "(COD_UNICO_ENDERECO, COD_ESPECIE) na UF 53 (DF): 1.318.887 linhas = 1.318.887 pares distintos. COD_UNICO_ENDERECO sozinho NÃO é único: 10.851 códigos se repetem no DF (1.307.955 distintos). Não medido no Brasil inteiro (111 mi)."
    tempo: {natureza: retrato_atual, coluna: null, cobertura: "Censo 2022 (sem coluna de data)"}
    territorio:
      nivel: ponto
      colunas:
        COD_UF: "UF (2 dígitos, texto, ex.: '35')"
        COD_MUNICIPIO: "município IBGE de 7 dígitos, texto"
        COD_DISTRITO: "distrito (9 dígitos)"
        COD_SUBDISTRITO: "subdistrito (11 dígitos)"
        COD_SETOR: "setor censitário (15 dígitos + letra, ex.: terminado em P)"
        LATITUDE: "graus decimais (DOUBLE); no DF vai de -16,05 a -15,50"
        LONGITUDE: "graus decimais (DOUBLE)"
    medidas:
      - {expressao: "count(*)", o_que: "número de endereços (cada linha é um endereço; domicílios e estabelecimentos misturados, separar por COD_ESPECIE)", unidade: "endereços", soma: sim}
    filtros_tipicos:
      - "COD_UF = '53' (texto, não inteiro) para particionar: tabela com 111 mi de linhas, sempre filtre UF ou município"
      - "COD_ESPECIE (documentação do CNEFE 2022, IBGE): '1' domicílio particular, '2' domicílio coletivo, '3' estabelecimento agropecuário, '4' de ensino, '5' de saúde, '6' de outras finalidades, '7' edificação em construção, '8' estabelecimento religioso. Para contar domicílios: COD_ESPECIE = '1' (no DF, 1.172.001 de 1.318.887)"
      - "NV_GEO_COORD = '1' para a melhor qualidade de coordenada (~93% da amostra; códigos '1' a '6'); significado não documentado no banco"
    use_para: "contar e localizar endereços por município, setor ou ponto (adensamento, cobertura de endereços, distância a pontos)."
    nao_use_para: "contar domicílios ou população sem filtrar COD_ESPECIE; chavear só por COD_UNICO_ENDERECO; colunas pessoais (CEP, número, logradouro) não são para listar."
    rascunho: [use_para, nao_use_para, significado de NV_GEO_COORD, rótulos de COD_ESPECIE (da documentação do IBGE, coerentes com as contagens do DF, não com dicionário no banco), tempo]
    verificado: "UF 53: 1.318.887 linhas, 1.307.955 COD_UNICO_ENDERECO distintos, 1.318.887 pares (COD_UNICO_ENDERECO, COD_ESPECIE) distintos, 1 município, 0 COD_SETOR nulo, COD_ESPECIE 1..8 (1.172.001 / 688 / 4.515 / 2.175 / 2.279 / 100.889 / 30.911 / 5.429); linhas totais 111.102.875 (perfil) — medido 2026-10-27"
