# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ibge_cnefe
tabelas:
  enderecos:
    grao: "um endereço × espécie (COD_ESPECIE) do CNEFE do Censo 2022, com coordenada: domicílios, estabelecimentos e obras misturados; 111.102.875 linhas no Brasil"
    chave: "(COD_UNICO_ENDERECO, COD_ESPECIE): único em DF (1.318.887 linhas) e SE (1.258.755 linhas = 1.258.755 pares). COD_UNICO_ENDERECO sozinho NÃO é único (SE: 1.178.377 distintos; DF: 1.307.955). Não medido no Brasil inteiro"
    tempo: {natureza: retrato_atual, coluna: null, cobertura: "Censo 2022 (sem coluna de data)"}
    territorio:
      nivel: ponto
      colunas:
        COD_UF: "UF (2 dígitos, texto, ex.: '35'); o arquivo de origem é um por UF (27 arquivos)"
        COD_MUNICIPIO: "município IBGE de 7 dígitos, texto"
        COD_DISTRITO: "distrito (9 dígitos)"
        COD_SUBDISTRITO: "subdistrito (11 dígitos)"
        COD_SETOR: "setor do CNEFE: 15 dígitos + 'P' (16 caracteres, 'P' em 100% das linhas). NÃO casa com id_setor_censitario de setor_censitario (15 dígitos): em SE, 1.226 dos 5.148 setores do CNEFE (24%) não existem lá, mesmo tirando o 'P'"
        LATITUDE: "graus decimais (DOUBLE); sem nulos"
        LONGITUDE: "graus decimais (DOUBLE)"
    medidas:
      - {expressao: "count(*) com COD_ESPECIE = '1'", o_que: "domicílios particulares: 90.600.065 no Brasil, igual a sum(domicilios_particulares) de br_ibge_censo_2022.setor_censitario", unidade: "domicílios", soma: sim}
      - {expressao: "count(*) com COD_ESPECIE = '2'", o_que: "domicílios coletivos: 104.517 no Brasil, igual a sum(domicilios_coletivos) de setor_censitario", unidade: "domicílios", soma: sim}
      - {expressao: "count(*)", o_que: "endereços-espécie (todas as finalidades; não é domicílio nem população)", unidade: "linhas", soma: sim}
    filtros_tipicos:
      - "COD_UF = '53' (texto, não inteiro) para particionar: tabela com 111 mi de linhas, sempre filtre UF ou município; o parquet é um arquivo por UF (ex.: 28_SE.parquet)"
      - "COD_ESPECIE (texto) no Brasil: '1' 90.600.065 domicílio particular, '2' 104.517 coletivo, '3' 4.058.385, '4' 264.445, '5' 247.510, '6' 11.706.713, '7' 3.541.442, '8' 579.798. Os rótulos 1 e 2 estão confirmados contra o Censo (setor_censitario); 3 a 8 são do dicionário oficial do IBGE (Dicionario_CNEFE_Censo_2022.xls: 3 estabelecimento agropecuário, 4 de ensino, 5 de saúde, 6 de outras finalidades, 7 edificação em construção ou reforma, 8 estabelecimento religioso), coerentes com DSC_ESTABELECIMENTO preenchido nas espécies 4, 5, 6 e 8, mas não conferidos contra outra tabela"
      - "NV_GEO_COORD = '1' para coordenada original do Censo 2022 (SE: 1.214.144 de 1.258.755). Pelo dicionário do IBGE: 1 coordenada original, 2 modificada (apartamentos no mesmo número), 3 estimada (sem coordenada ou inválida), 4 face de quadra, 5 localidade, 6 setor censitário: de 4 a 6 o ponto não é do endereço, não use para distância"
    use_para: "contar e localizar endereços por município, setor ou ponto (adensamento, cobertura de endereços, distância a pontos); contar domicílios (COD_ESPECIE '1' e '2'), que bate com o Censo por município (SE: 75 de 75 municípios iguais, diferença absoluta 0) e por UF."
    nao_use_para: "contar domicílios ou população sem filtrar COD_ESPECIE; chavear só por COD_UNICO_ENDERECO; juntar com setor_censitario por COD_SETOR (24% dos setores de SE não existem lá: agregue por município); listar CEP, número ou logradouro (dado de endereço)."
    verificado: "total 111.102.875 linhas (contagem do parquet); COD_ESPECIE no Brasil 1→90.600.065, 2→104.517, 3→4.058.385, 4→264.445, 5→247.510, 6→11.706.713, 7→3.541.442, 8→579.798; 1 e 2 iguais a sum(domicilios_particulares) = 90.600.065 e sum(domicilios_coletivos) = 104.517 de setor_censitario. SE: 1.258.755 linhas, 1.178.377 COD_UNICO_ENDERECO, 1.258.755 pares com COD_ESPECIE, 75 municípios, 5.148 COD_SETOR, 0 COD_SETOR nulo, NUM_ENDERECO = '0' em 269.836 (21%); espécie 1 = 1.006.925 e 2 = 556, iguais ao setor_censitario de SE (1.006.925 e 556), município a município. COD_SETOR tem 16 caracteres terminando em 'P' nas 111.102.875 linhas. DF (UF 53): 1.318.887 linhas, 1.307.955 COD_UNICO_ENDERECO distintos — medido 2026-10-27, refeito 2026-11-10; rótulos de COD_ESPECIE 3–8 e níveis 1–6 de NV_GEO_COORD conferidos no dicionário oficial (ftp.ibge.gov.br, Censo_Demografico_2022/Arquivos_CNEFE/CSV/Dicionario_CNEFE_Censo_2022.xls) — 2026-11-12"
