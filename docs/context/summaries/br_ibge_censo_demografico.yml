# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ibge_censo_demografico
tabelas:
  microdados_pessoa_2022:
    grao: "uma pessoa da amostra do Censo 2022 (21,5 milhões de linhas, 170 colunas)"
    chave: "(id_uf, controle, numero_ordem): confirmada em sigla_uf = 'DF' (141.502 = 141.502); controle só é único dentro da UF (gotcha censo2022_controle_por_uf)"
    tempo: {natureza: retrato_atual, coluna: "(tabela de um único censo)", cobertura: "2022–2022"}
    territorio: {nivel: uf, colunas: {id_uf: "UF (2 dígitos)", sigla_uf: "sigla", id_regiao: "região"}}
    medidas:
      - {coluna: peso_amostral, o_que: "peso; SUM(peso_amostral) = 203.080.756 no Brasil (gotcha censo2022_amostra_com_peso); DF = 2.817.381", unidade: "pessoas", soma: sim}
    filtros_tipicos: ["sigla_uf = 'DF' (texto)", "sem município: gotcha censo2022_publico_sem_municipio"]
    use_para: "estimativas do Censo 2022 ponderadas por amostra"
    nao_use_para: "contar linhas como população: é amostra"
    rascunho: [use_para, nao_use_para]
    verificado: "21.538.508 linhas no perfil; DF 141.502 linhas, chave confirmada, peso soma 2.817.381 — medido 2026-10-27"
