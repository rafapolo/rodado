# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_cgu_dados_abertos
tabelas:
  conjunto:
    ultima_data: "2024-02-18"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um conjunto de dados do catálogo dados.gov.br (foto de fev/2024)"
    chave: "id (12.731 linhas = 12.731 distintos, medido)"
    tempo: {natureza: retrato_atual, coluna: data_atualizacao, cobertura: "2015-06-03–2024-02-18 (data_criacao 2011-11-25–2024-02-16)"}
    territorio: {nivel: nenhum, colunas: {id_organizacao_responsavel: "organizacao.id do órgão dono (todas as 12.731 linhas casam)"}}
    medidas:
      - {coluna: quantidade_recursos, o_que: "recursos do conjunto segundo o catálogo (soma 76.834, contra 76.786 linhas em recurso)", unidade: "contagem", soma: sim}
      - {coluna: quantidade_downloads, o_que: "downloads acumulados", unidade: "contagem", soma: sim}
      - {coluna: quantidade_reusos, o_que: "reusos registrados (máximo 2)", unidade: "contagem", soma: sim}
    filtros_tipicos: ["join com organizacao por id_organizacao_responsavel = organizacao.id (todos casam); organizacao_responsavel é um texto, em parte slug (ex.: universidade-federal-de-sao-paulo)"]
    use_para: "inventariar o catálogo de dados abertos por órgão, data e popularidade"
    nao_use_para: "medir dados em si; é só metadado, e é uma foto de fev/2024"
    rascunho: [use_para, nao_use_para]
    verificado: "12.731 linhas; 12.731 id distintos; 12.271 nomes distintos; 12.731 de 12.731 organizações casam — medido 2026-10-27"
  organizacao:
    grao: "uma organização publicadora do catálogo dados.gov.br"
    chave: "id (254 linhas = 254 distintos, medido)"
    tempo: {natureza: retrato_atual, coluna: nenhuma, cobertura: "foto de fev/2024"}
    territorio: {nivel: outro, colunas: {sigla_uf: "UF (nulo em 70,5%)", id_municipio: "município (nulo em 74%)", tipo_esfera_administrativa: "esfera"}}
    medidas:
      - {coluna: quantidade_conjuntos, o_que: "conjuntos da organização (máx. 4.022)", unidade: "contagem", soma: sim}
      - {coluna: quantidade_seguidores, o_que: "seguidores (máx. 37)", unidade: "contagem", soma: sim}
    filtros_tipicos: ["tipo_esfera_administrativa = 'Federal' (69), 'Municipal' (6), 'Estadual/Distrital' (2); 177 nulos"]
    use_para: "listar órgãos publicadores e quantos conjuntos mantêm"
    nao_use_para: "análise territorial: UF e município quase sempre nulos"
    rascunho: [use_para, nao_use_para]
    verificado: "254 linhas; 254 id distintos; esfera: nulo 177, Federal 69, Municipal 6, Estadual/Distrital 2 — medido 2026-10-27"
  recurso:
    ultima_data: "2024-02-19"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um recurso (arquivo, link ou API) de um conjunto do catálogo dados.gov.br"
    chave: "(id, id_conjunto) (76.786 linhas = 76.786 distintos); id sozinho não: 76.763 distintos (23 repetidos)"
    tempo: {natureza: retrato_atual, coluna: data_modificacao_metadados, cobertura: "2012-06-15–2024-02-19 (data_criacao 2010-11-06–2024-02-19)"}
    territorio: {nivel: nenhum, colunas: {}}
    medidas:
      - {coluna: quantidade_downloads, o_que: "downloads do recurso", unidade: "contagem", soma: sim}
      - {coluna: tamanho_bytes, o_que: "tamanho do arquivo; nulo em 74,85%", unidade: "bytes", soma: sim}
    filtros_tipicos:
      - "formato = 'CSV' (33.407), 'PDF' (10.931), 'JSON' (7.308), 'HTML' (5.917), 'ZIP' (2.480); 'wsdl' em minúsculas (3.387); a coluna é texto livre com 163 grafias"
      - "tipo = 'DADOS' (5.063), 'DICIONARIO_DE_DADOS' (317), 'DOCUMENTACAO' (189), 'API' (69), 'OUTRO' (19), 'INVALIDO' (1); nulo em 71.128 (92,6%)"
    use_para: "achar arquivos e links de download por formato, conjunto e popularidade"
    nao_use_para: "contar formatos sem normalizar a caixa e o ponto; classificar por tipo (quase todo nulo)"
    rascunho: [use_para, nao_use_para]
    verificado: "76.786 linhas; 76.763 id distintos; 76.786 (id, id_conjunto) distintos; 76.786 de 76.786 id_conjunto existem em conjunto — medido 2026-10-27"
