# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ipea_avs
tabelas:
  municipio:
    ultima_data: "2010"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um município (udh = 'geral') ou uma UDH (unidade de desenvolvimento humano, dentro de 363 municípios) × recorte raça/cor × sexo × localização × ano censitário"
    chave: "(ano, id_municipio, udh, raca_cor, sexo, localizacao): 319.681 linhas = 319.681 distintos"
    tempo: {natureza: serie_de_periodos, coluna: ano, cobertura: "2000–2010 (dois censos)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos, 5.565 municípios", udh: "'geral' = município inteiro; outro valor = UDH (11.122 em 2010)", sigla_uf: "UF"}}
    medidas:
      - {coluna: ivs, o_que: "Índice de Vulnerabilidade Social (0 a 1; nulo em 58,7% das linhas)", unidade: "índice", soma: nao}
      - {coluna: idhm, o_que: "IDH municipal (0 a 1; nulo em 18,6%)", unidade: "índice", soma: nao}
      - {coluna: populacao_15_mais, o_que: "população de 15 anos ou mais (144.471.582 somando udh = 'geral', recorte total, 2010)", unidade: "pessoas", soma: sim}
      - {coluna: renda_per_capita, o_que: "renda per capita", unidade: "R$ (valor de referência do censo, não documentado)", soma: nao}
    filtros_tipicos:
      - "udh = 'geral' para o município inteiro (149.576 linhas em 2010, 5.565 municípios, 27 combinações de raca_cor × sexo × localizacao); linhas de UDH somadas com as 'geral' contam duas vezes"
      - "raca_cor = 'total' AND sexo = 'total' AND localizacao = 'total' para o recorte sem desagregação (valores literais minúsculos; as UDH só existem neste recorte)"
      - "ano = 2010 (ou 2000): nunca somar os dois anos"
    use_para: "vulnerabilidade social, IDHM e população por município, UDH e recorte de raça/sexo/localização nos censos 2000 e 2010"
    nao_use_para: "série anual ou dados recentes; proporções (proporcao_*) não se somam, recalcule com as populações"
    rascunho: [use_para, nao_use_para]
    verificado: "319.681 linhas, chave confirmada; 2010: 160.698 linhas (149.576 geral + 11.122 UDH em 363 municípios), 2000: 158.983 — medido 2026-10-27"
