# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_anm
tabelas:
  cfem_cfem_arrecadacao:
    grao: "um recolhimento de CFEM (royalty de mineração) por processo minerário × substância × município × mês de competência"
    chave: "nenhuma: sem identificador do recolhimento; em 2026 há 176.299 linhas e só 71.433 linhas distintas (SELECT DISTINCT), e dezembro/2025 a março/2026 têm 3–4× mais linhas que os demais meses"
    tempo: {natureza: serie_mensal, coluna: "ano, mes (ambos texto)", cobertura: "2002–2026 (2026: meses 1–10, última datacriacao 2026-10-01)"}
    territorio:
      nivel: municipio
      colunas:
        uf: "sigla da UF"
        codigomunicipio: "código IBGE de 7 dígitos do município de produção (texto)"
        municipio: "nome do município (nas tabelas antigas aparece '***' em alguns casos)"
    medidas:
      - {coluna: valorrecolhido, o_que: "CFEM recolhida", unidade: "R$", soma: sim}
      - {coluna: quantidadecomercializada, o_que: "quantidade comercializada que gerou o recolhimento (texto com vírgula decimal nesta tabela)", unidade: "a de unidadedemedida (t, m3, l, kg, g, ct...)", soma: nao}
    filtros_tipicos:
      - "ano = '2024' (texto); a tabela é a união das cinco cfem_cfem_arrecadacao_AAAA_AAAA, então nunca somar as duas"
      - "trim(unidadedemedida) = 't': o valor literal tem espaços à direita ('t  ', 'm3 ', 'l  ', 'kg ')"
      - "substancia IN ('FERRO','MINÉRIO DE FERRO'): o ferro tem dois rótulos (2025: FERRO R$ 3.366 mi, MINÉRIO DE FERRO R$ 2.098 mi)"
      - "tipo_pf_pj = 'PJ' (também existem 'PF' e '-', este com 25 linhas em 2026)"
    use_para: "arrecadação de CFEM por município, UF, substância ou mês"
    nao_use_para: "somar quantidadecomercializada entre unidades diferentes ou contar linhas como recolhimentos distintos (há linhas repetidas)"
    rascunho: [use_para, nao_use_para]
    verificado: "2.433.829 linhas = soma das cinco tabelas de período (198.897+364.848+500.422+625.460+744.202); soma de valorrecolhido igual nas duas: 2023 R$ 6.858,1 mi, 2024 R$ 7.733,4 mi (134.410 linhas, 132.892 distintas, R$ 7.436,7 mi sem as repetidas), 2026 R$ 3.893,5 mi; dez/2025 39.761 linhas (12.816 distintas, R$ 753,1 mi contra 752,5 mi), jan/2026 52.410 (11.446 distintas), fev/2026 50.254 (11.088), mar/2026 40.388 (15.713) — medido 2026-10-27"
  cfem_cfem_arrecadacao_2002_2006:
    grao: "mesmo grão de cfem_cfem_arrecadacao, recortado em 2002–2006; a união das cinco tabelas de período é cfem_cfem_arrecadacao"
    tempo: {natureza: serie_mensal, coluna: "ano, mes (texto)", cobertura: "2002–2006"}
    use_para: "o mesmo que cfem_cfem_arrecadacao quando o período cabe nesta faixa"
    nao_use_para: "somar junto com cfem_cfem_arrecadacao (duplica o valor)"
    rascunho: [use_para, nao_use_para]
    verificado: "198.897 linhas; quantidadecomercializada é DOUBLE nesta faixa — medido 2026-10-27"
  cfem_cfem_arrecadacao_2007_2011:
