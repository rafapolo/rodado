    rascunho: [use_para, nao_use_para]
    verificado: "112.107 linhas, 112.104 processos; fase_atual = 'Autorização de Pesquisa' e situacao = 'Sim' em todas; gotcha cpf_completado vale para cpf_cnpj_do_titular — medido 2026-10-27"
