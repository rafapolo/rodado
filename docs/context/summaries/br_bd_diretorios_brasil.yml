    chave: "id_uf: 27 linhas = 27 distintos"
    tempo: {natureza: sem_tempo, coluna: nenhuma}
    territorio: {nivel: nenhum, colunas: {}}
    filtros_tipicos:
      - "regiao tem texto ('Nordeste' 9, 'Norte' 7, 'Centro-Oeste' 4, 'Sudeste' 4, 'Sul' 3)"
    use_para: "ponte de id_uf para sigla e região."
    nao_use_para: "qualquer cálculo; tem 27 linhas."
    rascunho: [use_para, nao_use_para]
    verificado: "27 linhas, chave única — medido 2026-10-27"
