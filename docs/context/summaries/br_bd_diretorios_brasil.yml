    use_para: "ligar setor 2022 a município, microrregião e concentração urbana; area_km2 em km²."
    nao_use_para: "comparar a soma de area_km2 (8.510.418 km² medidos) com a área oficial sem conferir."
    rascunho: [use_para, nao_use_para]
    verificado: "452.340 linhas, chave única — medido 2026-10-27"
  subatividade_ibge:
