# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: world_ampas_oscar
tabelas:
  winner_demographics:
    grao: "um vencedor do Oscar × edição × categoria (as 5 categorias de atuação e direção)"
    chave: "(name, year_edition, category) (415 linhas = 415 distintos); (year_edition, category) NÃO é única: há anos com 2 vencedores na mesma categoria (ex. 1938 Melhor Ator Coadjuvante, 1961 Melhor Diretor, 1969 Melhor Atriz)"
    tempo: {natureza: serie_anual, coluna: year_edition, cobertura: "1927–2014"}
    territorio: {nivel: nenhum, colunas: {birthplace: "local de nascimento do vencedor, texto livre (cidade, estado/país)"}}
    medidas:
      - {coluna: birth_year, o_que: "ano de nascimento do vencedor", unidade: "ano", soma: nao}
    filtros_tipicos:
      - "category IN ('Best Actress','Best Actor','Best Director','Best Supporting Actor','Best Supporting Actress'): apenas essas 5 existem"
      - "race_ethnicity = 'White' (386), 'Black' (14), 'Hispanic' (8), 'Asian' (4), 'Multiracial' (2), 'Middle Eastern' (1)"
      - "sexual_orientation = 'Straight' (373), 'Bisexual' (20), 'Na' (10, não disponível), 'Gay' (7), 'Matter of Dispute' (3), 'Lesbian' (2)"
      - "religion IS NULL em 256 das 415 linhas (61,7%): não trate NULL como 'sem religião'; 'Atheist' é valor próprio (15)"
    use_para: "perfil demográfico (etnia, religião, orientação, idade) dos vencedores das categorias de atuação e direção"
    nao_use_para: "contagem de vencedores de Oscar em geral: só 5 categorias, edições até 2014, e uma pessoa que ganhou várias vezes aparece em várias linhas (342 nomes distintos para 415 linhas)"
    rascunho: [use_para, nao_use_para]
    verificado: "415 linhas = 415 (name, year_edition, category) distintos; 342 nomes distintos; religion nula em 256 — medido 2026-10-27"
