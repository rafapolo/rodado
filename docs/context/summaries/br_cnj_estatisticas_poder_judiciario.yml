# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_cnj_estatisticas_poder_judiciario
tabelas:
  recursos_financeiros:
    ultima_data: "2025"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um tribunal × ano (Justiça em Números do CNJ), com despesas, orçamento, pessoal e receitas"
    chave: "(ano, sigla_tribunal) — 1.581 linhas = 1.581 distintos; id_tribunal NÃO serve: (ano, id_tribunal) tem só 1.502 distintos (999991 é de todos os agregados por ramo; AudM repete o id do STM)"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "2009–2025 (61 linhas em 2009 e 2010, 97 de 2011 a 2021, 98 de 2022 a 2025 com o TRF6); inclui 6 linhas/ano de agregado por ramo (TJ, TRE, TRF, TRT, TJM, JMU)"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF do tribunal (nula em 42,5% das linhas: tribunais superiores, federais e trabalhistas regionais sem UF)"}}
    medidas:
      - {coluna: despesa_total_justica_estadual, o_que: "despesa total do tribunal (qualquer ramo, apesar do nome); somar sem as linhas id_tribunal 999991/999992, que são agregados", unidade: "R$", soma: sim}
      - {coluna: despesa_rh, o_que: "despesa com recursos humanos", unidade: "R$", soma: sim}
      - {coluna: despesa_pessoal_encargos, o_que: "despesa com pessoal e encargos", unidade: "R$", soma: sim}
      - {coluna: quantidade_servidores, o_que: "quantidade de servidores", unidade: "pessoas", soma: sim}
      - {coluna: cargos_magistrados_providos, o_que: "cargos de magistrado providos", unidade: "pessoas", soma: sim}
      - {coluna: gastos_totais, o_que: "gastos totais (GT, despesa pública do ente usada como denominador de G2); só 30 valores distintos por ano (é do ente, não do tribunal) e revisado pelo CNJ a cada edição: NÃO some", unidade: "R$ (escala inconsistente)", soma: nao}
      - {coluna: "proporcao_* e despesa_total_pib, despesa_total_justica_pc", o_que: "razões (fração da despesa total, do PIB, por habitante)", unidade: "razão", soma: nao}
    filtros_tipicos:
      - "ramo_justica = 'Estadual' (476 linhas, 28 siglas com o agregado TJ), 'Trabalho' (425), 'Eleitoral' (420), 'Federal' (106), 'Superior' (64), 'Militar Estadual' (60), 'Militar Uniao' (30)"
      - "ano = <ano>: um tribunal por linha; sem filtro de ano, somas misturam 17 anos"
    use_para: "comparar despesa total, despesa com pessoal e despesa média por magistrado/servidor entre tribunais e anos"
    nao_use_para: "somar todas as linhas (agregados por ramo contam em dobro, gotcha linhas_de_agregado_por_ramo) e gastos_totais"
    rascunho: [use_para, nao_use_para]
    verificado: "1.581 linhas, 1.581 distintos (ano, sigla_tribunal), 1.502 de (ano, id_tribunal); gastos_totais com 30 distintos por ano; anos 2009–2025; tabela refeita da fonte do CNJ (valores em R$ da BD eram inflados, gotcha valores_em_reais_inflados_ate_2021_corrigido) — medido 2026-11-23"
