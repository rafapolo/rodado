        max: "REALIZAR EXTRAÇÃO SELETIVA DE ÁRVORES EM ÁREA DE PRESERVAÇÃO PERMANENTE - APP  (HECTARE) - Art. 39 da Lei Federal n. 9.605/1998\
          \ C/C Art. 44 do Decreto Federal n. 6.514/2008.\nArt. 44.  Cortar árvores em área considerada de preservação permanente ou cuja espécie\
          \ seja especialmente protegida, sem permissão da autoridade competente: \nMulta de R$ 5.000,00 (cinco mil reais) a R$ 20.000,00 (vinte\
