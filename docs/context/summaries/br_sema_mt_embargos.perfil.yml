        top:
        - [null, 4727]
        - ["DESMATE A CORTE RASO EM ÁREA CONSIDERADA OBJETO DE ESPECIAL PRESERVAÇÃO (SEM AUTORIZAÇÃO OU EM DESACORDO) - Art. 50 da Lei Federal\
            \ n. 9.605/1998 C/C Art. 50 do Decreto Federal n. 6.514/2008.\nArt. 50.  Destruir ou danificar florestas ou qualquer tipo de vegetação\
            \ nativa ou de espécies nativas plantadas, objeto de especial preservação, sem autorização ou licença da autoridade ambiental competente:\n\
            Multa de R$ 5.000,00 (cinco mil reais) por hectare ou fração. \n§ 2° - Para os fins dispostos no art. 49 e no caput deste artigo,\
            \ são consideradas de especial preservação as florestas e demais formas de vegetação nativa que tenham regime jurídico próprio e especial\
            \ de conservação ou preservação definido pela legislação. ", 674]
        - ['DESMATE A CORTE RASO DE VEGETAÇÃO NATIVA EM ÁREA PASSÍVEL DE SUPRESSÃO (FORA DA RESERVA LEGAL) - Art. 52 do Decreto Federal n. 6.514/2008.

            Art. 52.  Desmatar, a corte raso, florestas ou demais formações nativas, fora da reserva legal, sem autorização da autoridade competente:

            Multa de R$ 1.000,00 (mil reais) por hectare ou fração.', 491]
        - ['DESMATE A CORTE RASO DE VEGETAÇÃO NATIVA EM ÁREA DE RESERVA LEGAL - Art. 51 do Decreto Federal n. 6.514/2008.

            Art. 51.  Destruir, desmatar, danificar ou explorar floresta ou qualquer tipo de vegetação nativa ou de espécies nativas plantadas,
            em área de reserva legal ou servidão florestal, de domínio público ou privado, sem autorização prévia do órgão ambiental competente
            ou em desacordo com a concedida:

            Multa de R$ 5.000,00 (cinco mil reais) por hectare ou fração.

            ', 251]
        - ["DESTRUIR/DANIFICAR VEGETAÇÃO EM ÁREA DE PRESERVAÇÃO PERMANENTE (APP) - Art. 38 da Lei Federal n. 9.605/1998 C/C Art. 43 do Decreto\
            \ Federal n. 6.514/2008.\nArt. 43.  Destruir ou danificar florestas ou demais formas de vegetação natural ou utilizá-las com infringência\
            \ das normas de proteção em área considerada de preservação permanente, sem autorização do órgão competente, quando exigível, ou em\
            \ desacordo com a obtida: \nMulta de R$ 5.000,00 (cinco mil reais) a R$ 50.000,00 (cinquenta mil reais), por hectare ou fração.\n",
          140]
        - ["IMPEDIR OU DIFICULTAR A REGENERAÇÃO NATURAL DE VEGETAÇÃO NATIVA EM LOCAL INDICADO PELO ÓRGÃO AMBIENTAL (ÁREA EMBARGADA) - Art. 48\
            \ da Lei Federal n. 9.605/1998 C/C Art. 48 e 108 do Decreto Federal n. 6.514/2008.\nArt. 48.  Impedir ou dificultar a regeneração\
            \ natural de florestas ou demais formas de vegetação nativa em unidades de conservação ou outras áreas especialmente protegidas, quando\
            \ couber, área de preservação permanente, reserva legal ou demais locais cuja regeneração tenha sido indicada pela autoridade ambiental\
            \ competente: \nMulta de R$ 5.000,00 (cinco mil reais), por hectare ou fração.\nParágrafo único.  O disposto no caput não se aplica\
            \ para o uso permitido das áreas de preservação permanente.\nArt. 108.  O embargo de obra ou atividade e suas respectivas áreas tem\
            \ por objetivo impedir a continuidade do dano ambiental, propiciar a regeneração do meio ambiente e dar viabilidade à recuperação\
            \ da área degradada, devendo restringir-se exclusivamente ao local onde verificou-se a prática do ilícito.", 112]
        - ['CONSTRUIR, REFORMAR, AMPLIAR, INSTALAR OU FAZER FUNCIONAR ESTABELECIMENTOS, ATIVIDADES, OBRAS OU SERVIÇOS UTILIZADORES DE RECURSOS
            AMBIENTAIS, CONSIDERADOS EFETIVA OU POTENCIALMENTE POLUIDORES, SEM LICENÇA OU AUTORIZAÇÃO DOS ÓRGÃOS AMBIENTAIS COMPETENTES, EM DESACORDO
            COM A LICENÇA OBTIDA OU CONTRARIANDO AS NORMAS LEGAIS E REGULAMENTOS PERTINENTES - Art. 60 da Lei Federal n. 9.605/1998 C/C Art. 66
            do Decreto Federal n. 6.514/2008. Neste dispositivo será inserido arquivo SHAPE de polígono do dano. ', 106]
        - ["DESMATE A CORTE RASO DE VEGETAÇÃO NATIVA DE CERRADO (SENDO QUE PARTE DO DESMATE É DENTRO E PARTE FORA DA RESERVA LEGAL) - Art. 51\
            \ e Art. 52 do Decreto Federal n. 6.514/2008.\nCONSIDERANDO QUE A PROPRIEDADE NÃO POSSUI A REGULARIZAÇÃO AMBIENTAL NECESSÁRIA PARA\
            \ ESTIPULAR A LOCALIZAÇÃO PRECISA DA RESERVA LEGAL,  SERÁ ESTIPULADO UM VALOR MÉDIO DE MULTA POR HECTARE CONFORME LEGISLAÇÃO AMBIENTAL\
            \ VIGENTE. \nArt. 51.  Destruir, desmatar, danificar ou explorar floresta ou qualquer tipo de vegetação nativa ou de espécies nativas\
            \ plantadas, em área de reserva legal ou servidão florestal, de domínio público ou privado, sem autorização prévia do órgão ambiental\
            \ competente ou em desacordo com a concedida:\nMulta de R$ 5.000,00 (cinco mil reais) por hectare ou fração.\nArt. 52.  Desmatar,\
            \ a corte raso, florestas ou demais formações nativas, fora da reserva legal, sem autorização da autoridade competente:\nMulta de\
            \ R$ 1.000,00 (mil reais) por hectare ou fração.", 76]
        - ["IMPEDIR OU DIFICULTAR A REGENERAÇÃO NATURAL DE VEGETAÇÃO NATIVA EM ÁREA DE PRESERVAÇÃO PERMANENTE (APP) - Art. 48 da Lei Federal n.\
            \ 9.605/1998 C/C Art. 48 do Decreto Federal n. 6.514/2008.\nArt. 48.  Impedir ou dificultar a regeneração natural de florestas ou\
            \ demais formas de vegetação nativa em unidades de conservação ou outras áreas especialmente protegidas, quando couber, área de preservação\
            \ permanente, reserva legal ou demais locais cuja regeneração tenha sido indicada pela autoridade ambiental competente: \nMulta de\
            \ R$ 5.000,00 (cinco mil reais), por hectare ou fração.\nParágrafo único.  O disposto no caput não se aplica para o uso permitido\
            \ das áreas de preservação permanente.", 63]
        - ["FAZER FUNCIONAR ATIVIDADE POTENCIALMENTE POLUIDORA (PECUÁRIA E/OU AGRICULTURA) SEM AUTORIZAÇÃO DO ÓRGÃO AMBIENTAL (APF - AUTORIZAÇÃO\
            \ PROVISÓRIA DE FUNCIONAMENTO RURAL) - Art. 60 da Lei Federal n. 9.605/1998 C/C Art. 66 do Decreto Federal n. 6.514/2008. \nArt. 66.\
            \  Construir, reformar, ampliar, instalar ou fazer funcionar estabelecimentos, atividades, obras ou serviços utilizadores de recursos\
            \ ambientais, considerados efetiva ou potencialmente poluidores, sem licença ou autorização dos órgãos ambientais competentes, em\
            \ desacordo com a licença obtida ou contrariando as normas legais e regulamentos pertinentes: \nMulta de R$ 500,00 (quinhentos reais)\
            \ a R$ 10.000.000,00 (dez milhões de reais). \nA AUTORIZAÇÃO PROVISÓRIA DE FUNCIONAMENTO RURAL (APF) é regulamentada pelo Decreto\
            \ Estadual n. 262/2019 e as Instruções Normativas SEMA n. 06/2017 e 03/2018. ", 61]
