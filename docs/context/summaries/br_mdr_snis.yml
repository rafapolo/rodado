# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_mdr_snis
tabelas:
  municipio_agua_esgoto:
    ultima_data: "2022"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um município × ano, indicadores de água e esgoto do SNIS agregados"
    chave: "(ano, id_municipio)"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "1995–2022"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos", sigla_uf: "UF"}}
    medidas:
      - {coluna: populacao_atendida_agua, o_que: "população atendida com água", unidade: "pessoas", soma: sim}
      - {coluna: populacao_atentida_esgoto, o_que: "população atendida com esgoto (a coluna se chama 'atentida', com erro de grafia)", unidade: "pessoas", soma: sim}
      - {coluna: "volume_agua_produzido, volume_agua_consumido, volume_agua_faturado, volume_esgoto_coletado, volume_esgoto_tratado", o_que: "volumes anuais", unidade: "não documentado (m³ por ano no SNIS, não medido)", soma: sim}
      - {coluna: "receita_operacional*, despesa_*, investimento_*", o_que: "valores financeiros do ano", unidade: "R$", soma: sim}
      - {coluna: "indice_atendimento_total_agua", o_que: "população atendida com água sobre a população total (0–100 em 2022)", unidade: "%", soma: nao}
      - {coluna: "demais indice_*", o_que: "índices do SNIS, com valores absurdos (negativos e acima de 100 mil) em colunas como indice_perda_ligacao_agua; não documentados", unidade: "variada", soma: nao}
    filtros_tipicos:
      - "ano = 2022 para o último retrato (5.425 municípios); em 1995 só há 54"
      - "populacao_urbana e populacao_urbana_atendida_agua vêm nulas em 2022 (soma NULL): use populacao_atendida_agua ou indice_atendimento_total_agua"
    use_para: "cobertura de água e esgoto, volumes e finanças do saneamento por município e ano"
    nao_use_para: "saber quem presta o serviço (use prestador_agua_esgoto) ou comparar anos antigos sem checar nulos"
    rascunho: [use_para, nao_use_para, "unidade dos volumes"]
    verificado: "119.256 linhas = 119.256 distintos de (ano, id_municipio); 2022: 5.425 linhas, populacao_atendida_agua soma 170.966.418, populacao_atentida_esgoto 112.795.436, volume_agua_produzido 15.819.193; indice_atendimento_total_agua 0–100, mediana 76,5; 2010: 4.950 linhas — medido 2026-10-27."
  prestador_agua_esgoto:
    ultima_data: "2022"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um prestador de serviço × município × ano"
    chave: "(ano, id_municipio, id_prestador)"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "1995–2022"}
    territorio: {nivel: municipio, colunas: {id_municipio: "município atendido, código IBGE de 7 dígitos", sigla_uf: "UF"}}
    medidas:
      - {coluna: "mesmas colunas de população, volume, receita, despesa e investimento de municipio_agua_esgoto", o_que: "valores do prestador naquele município", unidade: "iguais às de municipio_agua_esgoto", soma: sim}
    filtros_tipicos:
      - "tipo_servico tem espaços à direita: 'Agua         ', 'Esgotos      ', 'Esgoto    ...' (2.409) e 'Agua e Esgoto'; use trim(tipo_servico)"
      - "natureza_juridica em texto sem acento, ex. 'Sociedade de economia mista com administracao publica' (89.901), 'Administracao publica direta' (14.806), 'Autarquia', 'Empresa privada'"
      - "abrangencia IN ('Regional','Local','Microrregional')"
    use_para: "comparar prestadores (companhia estadual, autarquia, privada) em um município ou no país"
    nao_use_para: "total do município sem conferir duplicidade: com vários prestadores no mesmo município some só se a coluna não repetir (em 2022 a soma de populacao_atendida_agua bate com a tabela do município: 170.966.418)"
    rascunho: [use_para, nao_use_para]
    verificado: "125.845 linhas = 125.845 distintos de (ano, id_municipio, id_prestador) e de (ano, id_municipio, id_prestador, tipo_servico); tipo_servico: Agua 79.402, Agua e Esgoto 41.002, Esgotos 3.032, Esgoto 2.409; 2022 soma populacao_atendida_agua = 170.966.418 — medido 2026-10-27."
