# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_inpe_prodes_acumulado
tabelas:
  desmatamento:
    ultima_data: "2025"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um polígono do PRODES (representado pelo centroide) × bioma_arquivo; main_class separa DESMATAMENTO, RESERVATORIO e QUEIMADA; o mesmo uuid repete no arquivo amazonia_legal"
    chave: "(bioma_arquivo, uuid) e (bioma_arquivo, OGC_FID): 7.598.548 linhas = 7.598.548 distintos; uuid sozinho NÃO é único (6.796.791)"
    tempo: {natureza: serie_anual, coluna: year, cobertura: "2000–2025, mas só é um ano por linha a partir de 2008 na Amazônia e de 2017 nos demais biomas; antes disso o 'ano' é uma máscara de vários anos (Caatinga 2004 = 46.907 km², Cerrado 2002 = 53.854 e 2004 = 57.539, Mata Atlântica 2004 = 22.271) e há anos faltando (Caatinga 2005, 2007, 2009, 2012, 2015). year é nulo em 4 linhas. Ano PRODES vai de agosto a julho"}
    territorio: {nivel: ponto, colunas: {centroid_lon: "longitude do centroide", centroid_lat: "latitude do centroide (sem nulos)", state: "UF, 41 valores que misturam sigla e nome por extenso (BA 836.594, PA 767.652, MARANHÃO 594.910)", bioma_arquivo: "bioma do arquivo de origem: amazonia, amazonia_legal, caatinga, cerrado, mata_atlantica, pampa, pantanal"}}
    medidas:
      - {coluna: area_km, o_que: "área do polígono (mediana 0,036 km², máximo 343,7 km²)", unidade: "km²", soma: sim}
      - {expressao: "count(*)", o_que: "polígonos de desmatamento (não é número de eventos nem de propriedades)", unidade: "polígonos", soma: sim}
    filtros_tipicos:
      - "main_class = 'DESMATAMENTO' (caixa alta; 'RESERVATORIO' soma 2.833 km² na Caatinga, 555 na Mata Atlântica e 278 no Pampa, e 'QUEIMADA' tem 9 polígonos com 0 km²): sem esse filtro entram reservatórios"
      - "bioma_arquivo <> 'amazonia_legal' ao somar vários biomas (gotcha amazonia_legal_duplica); soma dos seis biomas, todos os anos: 703.348 km², o que mistura as máscaras antigas e não é 'desmatamento do Brasil'"
      - "year = <ano PRODES>; class_name é 'dAAAA' e bate com year em 7.598.533 das 7.598.548 linhas (11 diferentes, 4 com year nulo)"
    use_para: "área desmatada por ano PRODES na Amazônia (2008–2025) e por bioma nos anos recentes; mapear pontos de desmatamento (centroide) e cruzar com coordenadas; série anual de 2017 em diante nos seis biomas."
    nao_use_para: "série por município (use incremento_municipio, de 2017 em diante); total do Brasil somando todos os bioma_arquivo (amazonia_legal duplica) ou todos os anos (máscaras antigas); ler os anos anteriores a 2017 fora da Amazônia como incremento anual; análise espacial de interseção (o centroide não é o polígono: use desmatamento_poligono)."
    verificado: "7.598.548 linhas; (bioma_arquivo, uuid) = 7.598.548 distintos; uuid sozinho 6.796.791. DESMATAMENTO por bioma_arquivo (polígonos / km²): amazonia 802.282 / 134.951, amazonia_legal 835.279 / 139.868, caatinga 2.213.727 / 125.446, cerrado 2.335.921 / 326.731, mata_atlantica 1.104.743 / 63.743, pampa 208.573 / 35.580, pantanal 37.155 / 16.897. Amazônia por ano PRODES 2008–2025 (km²): 12.374 / 5.868 / 5.822 / 5.393 / 4.126 / 5.148 / 4.867 / 5.907 / 7.070 / 6.758 / 6.951 / 10.697 / 10.348 / 12.174 / 12.467 / 7.802 / 6.069 / 5.108; 2002 e 2004 têm 3 polígonos de 0 km². Cerrado: 2002, 2004, 2006, 2008, 2010 e 2012 são acumulados, anos consecutivos de 2013 em diante (2013 13.472 km², 2025 7.235) — medido 2026-10-27, refeito 2026-11-10. Gotcha: amazonia_legal_duplica."
  desmatamento_poligono:
    ultima_data: "2026"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um polígono de desmatamento PRODES com geometria completa × bioma_arquivo (versão do catálogo de 2026, sem amazonia_legal)"
    chave: "(bioma_arquivo, uuid); uuid sozinho repete em 2 linhas"
    tempo: {natureza: serie_anual, coluna: year, cobertura: "2002–2026"}
    territorio: {nivel: ponto, colunas: {geometria: "polígono (GEOMETRY CRS84)", state: "UF, sigla ou nome por extenso", bioma_arquivo: "bioma do arquivo"}}
    medidas:
      - {coluna: area_km, o_que: "área do polígono", unidade: "km²", soma: sim}
    filtros_tipicos:
      - "main_class = 'DESMATAMENTO' (caixa alta; também 'RESERVATORIO' e 'QUEIMADA')"
      - "versao diz o arquivo de origem (v20261016 para Amazônia e Cerrado); veja gotcha poligono_versao_nova"
    use_para: "análise espacial (interseção com municípios, terras, propriedades) do desmatamento"
    nao_use_para: "conferir linha a linha com desmatamento: as versões diferem"
    rascunho: [use_para, nao_use_para]
    verificado: "6.816.093 linhas; (bioma_arquivo, uuid) = 6.816.093 distintos; uuid sozinho 6.816.091 — medido 2026-10-27. Gotcha: poligono_versao_nova."
  incremento_municipio:
    ultima_data: "2025"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um município × bioma × ano PRODES (desmatamento incremental do ano, atribuído pelo centroide)"
    chave: "(ano, id_municipio, bioma)"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "2017–2025"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos (NULL em 39 linhas)", sigla_uf: "UF", bioma: "Amazônia, Cerrado, Caatinga, Mata Atlântica, Pampa, Pantanal"}}
    medidas:
      - {coluna: area_km2, o_que: "área desmatada no ano", unidade: "km²", soma: sim}
      - {coluna: poligonos, o_que: "número de polígonos", unidade: "unidades", soma: sim}
    filtros_tipicos:
      - "bioma = 'Amazônia' (com acento, como está no banco)"
      - "id_municipio IS NOT NULL para análises por município (39 linhas sem município)"
    use_para: "desmatamento por município e ano a partir de 2017"
    nao_use_para: "séries anteriores a 2017 (use br_inpe_prodes.municipio_bioma)"
    rascunho: [use_para, nao_use_para]
    verificado: "42.709 linhas = 42.709 distintos de (ano, id_municipio, bioma); 39 com id_municipio nulo; Amazônia km² 2020–2025: 10.348 / 12.175 / 12.467 / 7.802 / 6.069 / 5.108, igual a desmatamento (centroide) — medido 2026-10-27. Gotcha: incremento_municipio_desde_2017."
