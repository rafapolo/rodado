# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_bcb_agencia
tabelas:
  agencia:
    ultima_data: "2024-11"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma agência bancária × mês (retrato mensal do cadastro de agências)"
    chave: "(cnpj, sequencial_do_cnpj, dv_do_cnpj, ano, mes): única de 2009-01 a 2024-11 (3.801.001 linhas = 3.801.001 distintos). Em 2007-10 a 2008-05 a chave repete 35 linhas por mês (48 chaves com 329 linhas, cod_compe_ag não resolve); 2007-09 e 2008-06 em diante são únicas. id_instalacao é nula antes de 2020-05 (preenchida de 2020-05 em diante) e (ano, mes, id_instalacao) é única de 2021 em diante (703.425 linhas distintas)"
    tempo: {"natureza": "serie_mensal", "coluna": "ano, mes", "cobertura": "2007-09 a 2024-11, 199 meses (2007 só set–dez; 2024 só os meses 1, 5 e 11; demais anos 12 meses). A fonte parou em 2024-11: o retrato mais novo (2026-10-15) está em agencia_olinda"}
    territorio: {"nivel": "municipio", "colunas": {"id_instalacao": "id de instalação da agência (físico: uma por linha de 2021 em diante), nulo até 2020-04", "id_instalacao_estban": "ponte para o ESTBAN: nula em 2024-01 e 2024-05 (67,5% de 2024) e preenchida em 2024-11; nula em todos os meses de 2021-07 a 2024-05 verificados", "municipio": "nome do município (a chave para antes de 2021-08)", "municipio_ibge": "código IBGE do município (texto): vazio até 2021-07 (18.493 linhas em 2021-07), preenchido de 2021-08 (3.147 municípios) a 2024-11 (3.010)", "uf": "sigla da UF; vazia em 0,01% das linhas"}}
    medidas:
      - {expressao: "count(*) por municipio_ibge, ano, mes", o_que: "número de agências no mês", unidade: "agências", soma: sim}
    filtros_tipicos:
      - "ano = <ano> AND mes = <mes>: sem fixar o mês, a mesma agência aparece em até 12 linhas por ano (e some em dobro ao contar)"
      - "segmento = 'Banco do Brasil - Banco Múltiplo' (3.997 em 2024-11), 'Caixa Econômica Federal' (3.258) ou 'Banco Múltiplo' (8.410, os demais bancos) para recortar por banco; 21 segmentos em 2024-11; em 2007-10 a 2008-02 o segmento está em segmentos (plural), use coalesce(segmento, segmentos)"
      - "para agência em município use municipio_ibge (só de 2021-08 em diante); antes, o par municipio + uf (nome)"
    use_para: "contar e localizar agências por município (nome, ou código IBGE de 2021-08 em diante), UF e segmento num mês fixo, e acompanhar a rede: 18.361 agências em 2007-09, 19.013 em 2008-12, 16.550 em 2024-11 (636 instituições)."
    nao_use_para: "volume de crédito ou depósitos (não há medida financeira); contar agências sem fixar ano e mes; série mensal contínua de 2024 (3 meses); situação depois de 2024-11 (use agencia_olinda); casar município pelo código IBGE antes de 2021-08 (nulo); ler a linha como 'banco' (é a agência, de qualquer instituição: corretoras e financeiras incluídas)."
    verificado: "4.099.847 linhas em 199 meses (o cartão de 2026-10-27 tinha 4.100.044, com 197 linhas de rodapé apagadas em 2026-10-29); chave (cnpj, sequencial_do_cnpj, dv_do_cnpj, ano, mes) única em 3.801.001 linhas de 2009+; 2007-08: 298.846 linhas e 298.565 chaves (281 a mais, 2007-10 a 2008-05); id_instalacao nula em 82.336 das 944.362 linhas de 2020+, todas de 2020-01 a 2020-04; (ano, mes, id_instalacao) única nas 703.425 linhas de 2021+; 2024: 51.126 linhas, 3 meses; 2024-11: 16.550 agências, 636 raízes de CNPJ, 21 segmentos; municipio_ibge vazio em 2021-07 e preenchido de 2021-08; segmentos (plural) preenchido só de 2007-10 a 2008-02 (37.009 linhas); colunas nome_da_instituicao, cod_compe_bco, segmentos, estado, coluna, coluna_2 nulas ou pessoais em 2024 (use nome_instituicao e segmento) — medido 2026-10-27 e 2026-11-12"
  agencia_olinda:
    ultima_data: "2026-10-13"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma agência bancária no retrato atual (posição 2026-10-13, coleta 2026-10-15) vinda da API Olinda do BCB"
    chave: "cnpjbase, cnpjsequencial, cnpjdv (13.664 linhas = 13.664 distintos)"
    tempo: {natureza: retrato_atual, coluna: posicao, cobertura: "2026-10-13–2026-10-13"}
    territorio: {nivel: municipio, colunas: {municipioibge: "código IBGE do município", municipio: "nome", uf: "sigla da UF"}}
    medidas:
      - {expressao: "count(*)", o_que: "número de agências em funcionamento na posição", unidade: "agências", soma: sim}
    filtros_tipicos: ["segmento = 'Banco Múltiplo' ou 'Caixa Econômica Federal' (literais do top do perfil)"]
    use_para: "mapa atual de agências por município/UF/segmento."
    nao_use_para: "série histórica (use agencia); colunas têm nomes diferentes de agencia (nomeif, codigocompe, municipioibge, datainicio como DATE)."
    rascunho: [use_para, nao_use_para]
    verificado: "13.664 linhas; chave de 3 colunas única; posicao e data_coleta com 1 valor — medido 2026-10-27"
