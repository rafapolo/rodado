# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_bcb_agencia
tabelas:
  agencia:
    grao: "uma agência bancária × mês (retrato mensal do cadastro de agências)"
    chave: "cnpj, sequencial_do_cnpj, dv_do_cnpj, ano, mes (única de 2009 a 2024: 3.801.182 linhas = 3.801.182 distintos). Em 2007-2008 a chave com cod_compe_ag repete cerca de 35 linhas por mês; id_instalacao é nulo antes de 2020 (só preenchido em 2020 parcial e 2021 em diante), onde com ano, mes também é única."
    tempo: {natureza: serie_mensal, coluna: "ano, mes", cobertura: "2007-09 a 2024-11 (2007 só set-dez; 2024 só meses 1, 5 e 11; demais anos 12 meses)"}
    territorio: {nivel: municipio, colunas: {municipio_ibge: "código IBGE do município (texto)", municipio: "nome", uf: "sigla da UF; nulo em 0,01% das linhas", id_instalacao: "id de instalação da agência, nulo antes de 2020", id_instalacao_estban: "ponte para o ESTBAN (nulo em cerca de 68% em 2024)"}}
    medidas:
      - {expressao: "count(*) por municipio_ibge, ano, mes", o_que: "número de agências no mês", unidade: "agências", soma: sim}
    filtros_tipicos: ["ano = <ano> AND mes = <mes>: sem fixar o mês, a mesma agência aparece em até 12 linhas por ano (e some em dobro ao contar)", "segmento = 'Banco do Brasil - Banco Múltiplo' ou 'Caixa Econômica Federal' (valores literais no top do perfil de 2024) para recortar por banco"]
    use_para: "contar e localizar agências por município/UF/segmento em um mês fixo, e acompanhar a rede ao longo do tempo."
    nao_use_para: "volume de crédito ou depósitos (não há medida financeira); contar agências sem fixar ano e mes."
    rascunho: [use_para, nao_use_para]
    verificado: "4.100.044 linhas; chave (cnpj, sequencial_do_cnpj, dv_do_cnpj, ano, mes) única em 3.801.182 linhas de 2009+; 2024: 51.129 linhas, 3 meses; colunas nome_da_instituicao, cod_compe_bco, segmentos, estado, coluna, coluna_2 nulas ou pessoais em 2024 (use nome_instituicao e segmento) — medido 2026-10-27"
  agencia_olinda:
    grao: "uma agência bancária no retrato atual (posição 2026-10-13, coleta 2026-10-15) vinda da API Olinda do BCB"
    chave: "cnpjbase, cnpjsequencial, cnpjdv (13.664 linhas = 13.664 distintos)"
    tempo: {natureza: retrato_atual, coluna: posicao, cobertura: "2026-10-13–2026-10-13"}
    territorio: {nivel: municipio, colunas: {municipioibge: "código IBGE do município", municipio: "nome", uf: "sigla da UF"}}
    medidas:
      - {expressao: "count(*)", o_que: "número de agências em funcionamento na posição", unidade: "agências", soma: sim}
    filtros_tipicos: ["segmento = 'Banco Múltiplo' ou 'Caixa Econômica Federal' (literais do top do perfil)"]
    use_para: "mapa atual de agências por município/UF/segmento."
    nao_use_para: "série histórica (use agencia); colunas têm nomes diferentes de agencia (nomeif, codigocompe, municipioibge, datainicio como DATE)."
    rascunho: [use_para, nao_use_para]
    verificado: "13.664 linhas; chave de 3 colunas única; posicao e data_coleta com 1 valor — medido 2026-10-27"
