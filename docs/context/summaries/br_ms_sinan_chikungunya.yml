# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ms_sinan_chikungunya
tabelas:
  microdados_chikungunya:
    ultima_data: "2026-10-24"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma notificação individual de chikungunya (ficha SINAN), sem identificador do caso; inclui descartadas e sem classificação (gotcha notificacao_nao_e_caso)"
    chave: "nenhuma: sem identificador; 2.514.085 linhas, 2.511.328 distintas pela linha inteira (2.757 repetidas)"
    tempo: {natureza: serie_diaria, coluna: "DT_NOTIFIC (DATE, nunca nula); NU_ANO (VARCHAR) = year(DT_NOTIFIC) em 100% das linhas; ano_sinan (BIGINT) é o ano do arquivo de origem e diverge de NU_ANO em 4.353 linhas", cobertura: "DT_NOTIFIC 2014-01-07 a 2026-10-24; ano_sinan 2014–2026 (13 anos; 2026 parcial, 139.795; 2024 é o maior ano completo, 426.214)"}
    territorio: {nivel: municipio, colunas: {ID_MUNICIP: "município de notificação, IBGE 6 dígitos (sem dígito verificador), nunca vazio", ID_MN_RESI: "município de residência, 6 dígitos; vazio em 99 linhas e 1 linha com lixo binário", SG_UF: "UF de residência, código IBGE de 2 dígitos em texto (não é sigla); vazio em 39 linhas e 2 com lixo", SG_UF_NOT: "UF da notificação, código IBGE de 2 dígitos"}}
    medidas:
      - {expressao: "count(*)", o_que: "notificações; caso confirmado = CLASSI_FIN = '13' (a partir de 2017)", unidade: "notificações", soma: sim}
    filtros_tipicos:
      - "ano_sinan = <ano> (BIGINT), ou year(DT_NOTIFIC), que é o ano da notificação sem a divergência de 4.353 linhas; NU_ANO é texto"
      - "CLASSI_FIN (texto; '' quando vazio, nunca NULL): '13' 1.234.465 chikungunya, '5' 821.418 descartado (códigos 13 e 5 conferidos no dicionário da dengue em br_ms_sinan.dicionario, classificacao_final: 13 = Chikungunya, 5 = Descartado), '' 267.551 sem classificação, '1' 89.398, '8' 54.732, '2' 45.852, '0' 663 e 6 linhas com lixo"
      - "'1', '2' e '8' são códigos de 2014–2016 (de 2017 em diante: 14, 11 e 19 linhas no total) e não são chikungunya confirmada: em 2014–2016 só 0,2% das linhas '1' têm RES_CHIKS1 = '1' (191 de 89.384, como nos descartados '5' com 0,5%), contra 15,8% das '13' (14.112 de 89.363); o significado exato dos três não está no espelho"
      - "ano_sinan 2014–2016: só 10, 665 e 88.688 linhas '13': a série de confirmados só faz sentido de 2017 em diante"
      - "CRITERIO em 2024 nos '13': '2' clínico-epidemiológico 124.016, '1' laboratorial 104.782, '3' 3.205 (códigos da ficha, sem dicionário no espelho)"
      - "ID_AGRAVO em dois formatos ('A92.0' 2.434.901 e 'A920' 79.184): gotcha id_agravo_em_dois_formatos; a tabela só tem chikungunya"
      - "CS_SEXO = 'F' 1.511.404, 'M' 1.000.009, 'I' 2.659, vazio 12 e 1 lixo; EVOLUCAO em 2024: '1' cura 347.598, vazio 52.624, '9' ignorado 24.564, '3' 653, '0' 459, '2' 247, '4' 69 (códigos da ficha: 2 óbito pelo agravo, 3 óbito por outra causa)"
    use_para: "notificações e casos de chikungunya por município, UF e ano (ou semana epidemiológica) de notificação, de 2017 em diante; sazonalidade por DT_NOTIFIC; perfil clínico dos notificados."
    nao_use_para: "chamar notificação de caso sem filtrar CLASSI_FIN (33% das linhas são descartadas e 11% não têm classificação); 'CLASSI_FIN <> 5' como caso provável em 2014–2016 (inclui '1', '2' e '8', sem lastro laboratorial); somar para contar pessoas (sem identificador, 2.757 linhas repetidas); incidência sem denominador (junte com br_ms_populacao.municipio); comparar 2026 com ano fechado; usar SG_UF como sigla."
    rascunho: ["significado de CLASSI_FIN '1', '2', '8' em 2014–2016 e de CRITERIO/EVOLUCAO (só pela ficha do SINAN)"]
    verificado: "2.514.085 linhas; 2.511.328 distintas por hash da linha; DT_NOTIFIC 2014-01-07 a 2026-10-24, nunca nula; NU_ANO = year(DT_NOTIFIC) em todas; ano_sinan diverge em 4.353; ano_sinan 2014–2026: 4.622 / 52.342 / 310.746 / 244.070 / 116.526 / 178.349 / 112.481 / 134.414 / 274.331 / 266.442 / 426.214 / 253.753 / 139.795; CLASSI_FIN '13' por ano_sinan: 10 / 665 / 88.688 / 164.480 / 73.556 / 103.708 / 51.769 / 71.686 / 148.605 / 130.196 / 232.047 / 110.477 / 58.578 (2014–2026); '5' em 2024: 162.176, '' em 2024: 31.991; ID_MUNICIP com 6 dígitos em 100%; TP_NOT '2' em 2.514.083 — medido 2026-11-10 (cartão de 2026-10-27 tinha 2.507.780 linhas)"
