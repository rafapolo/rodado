# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_me_siconfi
tabelas:
  brasil_despesas_funcao:
    ultima_data: "2025"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma conta de despesa por função/subfunção da União (portaria '9.272' = subfunção) × estágio × ano
    chave: 'nenhuma por pouco: (ano, estagio, portaria, conta) dá 10.360 distintos em 10.361 linhas (uma linha duplicada: 2013, ''Despesas Empenhadas'', portaria ''15.451'', ''Infra-Estrutura Urbana'',
      R$ 2.544.716.025,27 nas duas)'
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 2013–2025
    territorio:
      nivel: brasil
      colunas: {}
    medidas:
    - &id001
      coluna: valor
      o_que: valor da conta no estágio (uma linha por estágio e por nível da hierarquia de contas)
      unidade: R$
      soma: sim, depois de fixar UM estagio_bd e UM nível de id_conta_bd
    filtros_tipicos:
    - 'estagio_bd = ''Despesas Pagas'' (ou ''Despesas Empenhadas''/''Despesas Liquidadas''): os estágios são fases do mesmo gasto, não se somam (gotcha estagio_multiplica, medido em municipio_despesas_funcao)'
    - id_conta_bd = '3.00.000' é o total ('Despesas Exceto Intraorçamentárias'; empenhado 2025 = R$ 5,35 tri); 3.<função>.000 é a função inteira e 3.<função>.<subfunção> a subfunção; 'Inscrição de RP Não
      Processados' é nome curto antigo em estagio (use estagio_bd)
    - id_conta_bd é NULL em 0,48% das linhas
    use_para: despesa da União por função e subfunção, por estágio
    nao_use_para: somar total, funções e subfunções juntos, ou somar estágios
    rascunho:
    - use_para
    - nao_use_para
    verificado: '10.361 linhas, 10.360 chaves distintas; 2025: estágios ''Despesas Empenhadas'', ''Despesas Liquidadas'', ''Despesas Pagas'' com o total 3.00.000 = R$ 5.346,9 / 5.123,1 / 5.024,1 bi — medido
      2026-10-27'
  brasil_despesas_orcamentarias:
    ultima_data: "2025"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma conta de despesa por natureza econômica (categoria, grupo, modalidade) da União × estágio × ano
    chave: ano, estagio, portaria, conta (única nas 8.872 linhas)
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 2013–2025
    territorio:
      nivel: brasil
      colunas: {}
    medidas:
    - *id001
    filtros_tipicos:
    - estagio_bd = 'Despesas Pagas' etc. (4–5 estágios; não somar)
    - 'id_conta_bd é NULL ou '''' em 63,85% das linhas (só 11 contas harmonizadas, ex.: ''2.0.0.00.00.00'' total de despesas orçamentárias, ''2.3.0.00.00.00'' correntes): para as demais use portaria/conta;
      portaria é o código da natureza (ex.: ''4.6.99.00.00.00'')'
    use_para: despesa da União por natureza econômica (pessoal, outras correntes, capital...) e estágio
    nao_use_para: somar níveis diferentes de portaria juntos nem estágios
    rascunho:
    - use_para
    - nao_use_para
    verificado: 8.872 linhas = 8.872 chaves; id_conta_bd NULL 5.665 e '' 2.625 — medido 2026-10-27
  brasil_execucao_restos_pagar:
    ultima_data: "2025"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma conta de despesa (natureza econômica) da União × estágio de restos a pagar × ano
    chave: ano, estagio, portaria, conta (única nas 11.338 linhas)
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 2013–2025
    territorio:
      nivel: brasil
      colunas: {}
    medidas:
    - coluna: valor
      o_que: valor de restos a pagar no estágio
      unidade: R$
      soma: sim dentro de um estagio; estágios são etapas do mesmo estoque (inscrito, liquidado, pago, cancelado), não se somam
    filtros_tipicos:
    - 'use a coluna estagio (9 valores, ex.: ''Restos a Pagar Não Processados Pagos'', ''Restos a Pagar Processados Cancelados''): estagio_bd, id_conta_bd e conta_bd são NULL ou '''' em todas as linhas'
    use_para: restos a pagar da União por natureza de despesa e estágio
    nao_use_para: usar estagio_bd/id_conta_bd (vazios) ou somar estágios
    rascunho:
    - use_para
    - nao_use_para
    verificado: 11.338 linhas = 11.338 chaves; estagio_bd NULL 6.978 e '' 4.360 (100%) — medido 2026-10-27
  brasil_execucao_restos_pagar_funcao:
    ultima_data: "2025"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma função/subfunção da União × estágio de restos a pagar × ano
    chave: ano, estagio, portaria, conta (única nas 15.151 linhas)
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 2013–2025
    territorio:
      nivel: brasil
      colunas: {}
    medidas:
    - coluna: valor
      o_que: valor de restos a pagar no estágio
      unidade: R$
      soma: sim dentro de um estagio; estágios não se somam
    filtros_tipicos:
    - use estagio (9 valores); estagio_bd, id_conta_bd e conta_bd são NULL ou '' em todas as linhas; portaria é o código da função/subfunção
    use_para: restos a pagar da União por função e subfunção
    nao_use_para: usar estagio_bd/id_conta_bd (vazios) ou somar estágios
    rascunho:
    - use_para
    - nao_use_para
    verificado: 15.151 linhas = 15.151 chaves — medido 2026-10-27
  brasil_receitas_orcamentarias:
    ultima_data: "2025"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma conta de receita (hierarquia do ementário) da União × estágio × ano
    chave: ano, estagio, portaria, conta (única nas 7.301 linhas)
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 2013–2025
    territorio:
      nivel: brasil
      colunas: {}
    medidas:
    - coluna: valor
      o_que: receita realizada (bruta) ou dedução
      unidade: R$
      soma: sim, filtrando um estagio_bd e um nível de conta; deduções vêm positivas e se subtraem
    filtros_tipicos:
    - estagio_bd = 'Receitas Brutas Realizadas' (receita) ou 'Outras Deduções da Receita' / 'Deduções da Receita' (dedução); estagio antigo traz também 'Receitas Realizadas'
    - 'id_conta_bd é NULL ou '''' em 49,61% das linhas (28 contas harmonizadas, ex.: ''1.0.0.0.0.00.00.00'' = Receitas Orçamentárias); os níveis se empilham'
    use_para: receita da União por conta do ementário
    nao_use_para: somar todas as contas (os níveis se empilham) ou somar deduções com receitas
    rascunho:
    - use_para
    - nao_use_para
    verificado: 7.301 linhas = 7.301 chaves — medido 2026-10-27
  brasil_variacoes_patrimoniais:
    ultima_data: "2025"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma conta de variação patrimonial (aumentativa/diminutiva) da União × ano
    chave: ano, portaria, conta (única nas 6.323 linhas)
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 2013–2025
    territorio:
      nivel: brasil
      colunas: {}
    medidas:
    - coluna: valor
      o_que: variação patrimonial da conta no ano; há valores negativos
      unidade: R$
      soma: sim, fixando um nível da hierarquia de portaria
    filtros_tipicos:
    - 'id_conta_bd e conta_bd são NULL ou '''' em todas as linhas: filtre por portaria (código da conta, ex.: ''3.0.0.0.0.00.00'' variação diminutiva, ''4.0.0.0.0.00.00'' aumentativa nas linhas dos municípios)
      ou conta'
    use_para: variações patrimoniais aumentativas e diminutivas da União
    nao_use_para: somar contas de níveis diferentes juntas
    rascunho:
    - use_para
    - nao_use_para
    - significado dos prefixos 3 e 4 da portaria
    verificado: 6.323 linhas = 6.323 chaves — medido 2026-10-27
  municipio_balanco_patrimonial:
    ultima_data: "2025"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma conta do balanço patrimonial (ativo, passivo, atos potenciais) de um município × ano
    chave: 'nenhuma: em 2025, (id_municipio, portaria, conta, conta_bd) dá 983.422 distintos em 1.004.322 linhas (20.900 repetidas); não há coluna de estágio nem de quadro para separá-las'
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 1998–2025
    territorio:
      nivel: municipio
      colunas:
        id_municipio: município IBGE de 7 dígitos
        sigla_uf: 'UF (o DF não aparece: não tem município)'
    medidas:
    - coluna: valor
      o_que: saldo da conta no balanço (com negativos)
      unidade: R$
      soma: 'nao: a hierarquia e as linhas repetidas empilham totais; significado não documentado'
    filtros_tipicos:
    - 'ano = <ano>: tabela de 17,9 mi de linhas'
    - 'conta e conta_bd NÃO concordam: para SP capital 2025 a mesma conta ''Passivo Permanente'' (R$ 300,44 bi) aparece com conta_bd ''Ativo Financeiro'', ''Passivo Financeiro'' e ''Execução dos Atos Potenciais
      Passivos''; confira conta e portaria antes de usar conta_bd; id_conta_bd é preenchido em todas as linhas (838 valores) mas não foi decodificado'
    use_para: consultar contas do balanço patrimonial municipal (com cuidado, após inspecionar as linhas do município)
    nao_use_para: somar valor entre contas ou assumir que conta_bd rotula a conta
    rascunho:
    - use_para
    - nao_use_para
    - medidas.o_que
    - filtros_tipicos
    verificado: '17.888.122 linhas; 2025: 1.004.322 linhas, 983.422 chaves distintas sobre (id_municipio,portaria,conta,conta_bd) — medido 2026-10-27'
  municipio_despesas_funcao:
    ultima_data: "2025"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma conta de despesa por função (3.NN.000) ou subfunção (3.NN.SSS) de um município × estágio × ano
    chave: 'ano, id_municipio, estagio, portaria, conta (única; medido em ano = 2025, 1.096.272 linhas). Antes de 2013 estagio vem NULL (8.690.188 linhas): a chave não foi medida nos outros anos'
    tempo:
      natureza: serie_anual
      coluna: ano
      cobertura: 1996–2025
    territorio:
      nivel: municipio
      colunas:
        id_municipio: município IBGE de 7 dígitos
        sigla_uf: 'UF (o DF não aparece: não tem município)'
    medidas:
    - *id001
    filtros_tipicos:
    - 'ano = <ano>: tabela de 22 mi de linhas'
    - 'estagio_bd = ''Despesas Pagas'' (ou ''Despesas Empenhadas''/''Despesas Liquidadas''; mais ''Inscrição de Restos a Pagar Processados''/''Não Processados''): sem filtrar, o mesmo gasto aparece em até
      5 estágios (gotcha estagio_multiplica)'
    - id_conta_bd = '3.08.000' é Assistência Social, '3.10.000' Saúde, '3.12.000' Educação (gotcha funcao_08_assistencia); id_conta_bd = '3.00.000' é o total ('Despesas Exceto Intraorçamentárias')
    - 'pagas 2023: soma das funções (regexp ''^3\.[0-9]{2}\.000$'' sem 3.00.000) = total 3.00.000 = R$ 1.054,97 bi em 5.556 municípios: funções somam o total, mas não some funções com subfunções nem com
      o total'
    use_para: gasto municipal por função (saúde, educação, assistência...) e subfunção, por estágio
    nao_use_para: somar total + funções + subfunções, ou somar estágios
    rascunho:
    - nao_use_para
    - use_para
    verificado: '22.098.549 linhas; 2025: 1.096.272 linhas = chaves, 5.446 municípios com ''Despesas Pagas''; estágios em 2025: Empenhadas 272.218, Liquidadas 271.530, Pagas 271.038, RP Processados 152.444,
      RP Não Processados 129.042; pagas 2023 total R$ 1.054,97 bi — medido 2026-10-27'
  municipio_despesas_orcamentarias:
    ultima_data: "2025"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: uma conta de despesa por natureza econômica (categoria, grupo, modalidade, elemento) de um município × estágio × ano
    chave: "(ano, id_municipio, estagio, portaria, conta): única de 1989 a 1992, em 1994 e de 1998 em diante; em 1993 e 1995–1997 há 94 chaves repetidas (188 linhas, 83 com valores diferentes). 27.829.868 linhas, 27.829.774 chaves distintas"
