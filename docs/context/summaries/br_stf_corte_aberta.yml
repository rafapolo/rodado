# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_stf_corte_aberta
tabelas:
  decisoes:
    ultima_data: "2025-01-19"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma decisão (andamento decisório) do STF sobre um processo; um processo pode ter várias linhas"
    chave: "nenhuma: em 2025 são 1.068 linhas para 1.036 link distintos; mesmo com (link, data_decisao, andamento, subgrupo_andamento) há 1.066 distintos"
    tempo: {natureza: serie_diaria, coluna: data_decisao, cobertura: "2000–2025 (coluna ano; em 2025 só 2025-01-01 a 2025-01-19)"}
    territorio: {nivel: nenhum}
    medidas:
      - {expressao: "count(*)", o_que: "número de decisões", unidade: "decisão", soma: sim}
    filtros_tipicos:
      - "ano = <ano> (partição; ano = year(data_decisao) em 2023 e 2024) e use 2024 ou antes para ano completo: 2025 tem só 19 dias"
      - "modalidade_julgamento = 'Monocrática' (decisão do relator); em 2023 há também 'Virtual' (12.975, tipo_julgamento 'Colegiada') e 'Presencial' (67)"
      - "subgrupo_andamento = 'Decisão Final' (895 de 1.068 em 2025); andamento = 'Negado Seguimento' é o mais comum"
      - "classe = 'HC', 'Rcl', 'ARE', 'RE' etc. (sigla da classe processual, valor como no banco)"
    use_para: "contar decisões do STF por relator, classe, andamento e período"
    nao_use_para: "contar processos (um processo repete) ou ver série de 2025 inteira: a base cobre só janeiro de 2025"
    rascunho: [use_para, nao_use_para]
    verificado: "2.708.849 linhas em 26 anos (2000–2025); 2025: 1.068 linhas, 1.036 link, datas 2025-01-01 a 2025-01-19; 2023: 76.707 linhas (19.545 sem data_baixa_processo); anos 2019–2024 entre 72 mil e 116 mil linhas — medido 2026-10-27"
