# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_cgu_orcamento_publico
tabelas:
  orcamento:
    grao: "uma linha de dotação orçamentária de um exercício: unidade orçamentária × função/subfunção × programa × ação × grupo de despesa × elemento de despesa"
    chave: "nenhuma: 341.269 linhas para 307.286 combinações distintas dos 11 códigos (ano, órgão superior, subordinado, unidade, função, subfunção, programa, ação, categoria, grupo, elemento); só 86 linhas são cópias exatas, as demais repetidas diferem em valores/nomes"
    tempo: {natureza: serie_anual, coluna: ano_exercicio, cobertura: "2014–2026 (2026 em execução)"}
    territorio: {nivel: brasil, colunas: {}}
    medidas:
      - {coluna: orcamento_inicial, o_que: "dotação inicial (lei orçamentária)", unidade: "R$", soma: sim}
      - {coluna: orcamento_atualizado, o_que: "dotação atualizada após créditos", unidade: "R$", soma: sim}
      - {coluna: orcamento_empenhado, o_que: "valor empenhado", unidade: "R$", soma: sim}
      - {coluna: orcamento_realizado, o_que: "valor realizado (pago, pelo nome da coluna; definição não conferida)", unidade: "R$", soma: sim}
      - {coluna: porcentagem_realizado_orcamento, o_que: "realizado / atualizado em %; bate com 100*realizado/atualizado em 312.129 das 341.269 linhas", unidade: "%", soma: nao}
    filtros_tipicos: ["ano_exercicio = 2024: inteiro", "id_categoria_economica = '3' (despesa corrente; 279.492 linhas) ou '4' (capital); '9' é reserva de contingência (877) e 'I' é 'Inválido' (1 linha de 2020); o nome da categoria muda entre anos ('DESPESA CORRENTE' em 2014, 'DESPESAS CORRENTES' depois), então filtre pelo id", "id_funcao = '12' (126.486 linhas, a mais frequente): ids com zero à esquerda são texto ('05', '09')", "id_grupo_despesa = '1' (Pessoal e Encargos Sociais), '2' (Juros), '3' (Outras Correntes), '4' (Investimentos), '5' (Inversões Financeiras), '6' (Amortização da Dívida), '9' (Reserva)"]
    use_para: "somar orçamento inicial, atualizado, empenhado e realizado por ano, órgão, função, programa, ação ou elemento de despesa."
    nao_use_para: "contar ações ou programas por count(*): as linhas repetem os mesmos códigos; use count(DISTINCT id_acao)."
    rascunho: [use_para, nao_use_para]
    verificado: "341.269 linhas, 307.286 combinações distintas de 11 códigos, 341.183 linhas distintas; soma por ano em R$ bi (inicial/atualizado/empenhado/realizado): 2014 2.332/2.557/2.241/2.105, 2024 5.324/5.428/4.736/4.491, 2026 6.238/6.405/4.998/4.376; valores negativos existem — medido 2026-10-27"
