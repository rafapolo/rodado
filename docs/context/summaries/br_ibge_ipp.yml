# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ibge_ipp
tabelas:
  mes_industria_geral:
    grao: um mês do IPP da indústria geral (total; composição não conferida)
    chave: ano, mes
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 2013-12–2022-02
    territorio:
      nivel: brasil
      colunas: {}
    medidas:
    - coluna: numero_indice
      o_que: 'número-índice de preços de produtor do mês (base aparente dez/2018 = 100: só 2018-12 vale 100.0 na
        série geral; não documentada)'
      unidade: pontos
      soma: nao
    - coluna: variacao_mensal
      o_que: variação em relação ao mês anterior (nula no primeiro mês)
      unidade: '%'
      soma: nao
    - coluna: variacao_anual
      o_que: 'variação em relação ao mesmo mês do ano anterior ou acumulada no ano: significado NÃO medido'
      unidade: '%'
      soma: nao
    - coluna: variacao_doze_meses
      o_que: variação em 12 meses (nula nos primeiros 12 meses da série)
      unidade: '%'
      soma: nao
    filtros_tipicos:
    - ano = <ano> AND mes = <mes> (inteiros; mes 1–12)
    use_para: Série nacional de preços de produtor da indústria no total.
    nao_use_para: Não some nem faça média dos índices ou das variações entre meses ou categorias; não há dado por
      UF e a série termina em 2022-02.
    rascunho:
    - use_para
    - nao_use_para
    - significado exato de variacao_anual
    - grão exato do geral (soma extrativa+transformação não conferida)
    verificado: 99 linhas = 99 pares (ano, mes) distintos; numero_indice de 76.83 a 164.15 — medido 2026-10-27
