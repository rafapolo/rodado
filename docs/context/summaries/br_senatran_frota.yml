# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_senatran_frota
tabelas:
  municipio_tipo:
    grao: "um mês × município × tipo de veículo (estoque da frota registrada no mês), incluindo uma linha tipo_veiculo = 'total' por município × mês"
    chave: "ano, mes, id_municipio (ou municipio+sigla_uf quando id_municipio é nulo), tipo_veiculo — conferido em ano = 2026 (980.672 linhas = 980.672 distintos); id_municipio é nulo em 176 linhas de 2026"
    tempo: {natureza: serie_mensal, coluna: "ano, mes", cobertura: "2013-01–2026-08 (12 meses por ano até 2025; 8 em 2026)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "código IBGE de 7 dígitos, VARCHAR; nulo em 'MUNICIPIO NAO INFORMADO'", sigla_uf: "UF", municipio: "nome em maiúsculas sem acento"}}
    medidas:
      - {coluna: quantidade, o_que: "veículos registrados no mês daquele município e tipo (estoque)", unidade: "veículos", soma: "sim entre municípios; nao entre meses; nao somar com a linha 'total' (ver gotchas linha_total_dobra_soma e frota_e_estoque_mensal)"}
    filtros_tipicos:
      - "tipo_veiculo <> 'total' para somar por tipo; ou tipo_veiculo = 'total' para a frota geral (ago/2026: total 132.827.716)"
      - "ano = 2025 AND mes = 12 — um mês por ano"
      - "tipo_veiculo = 'caminhao_trator' / 'micro_onibus' / 'chassi_plataf' / 'trator_estei' (underscore e nomes truncados, ≠ br_senatran_estatisticas)"
    use_para: "frota por município e tipo de veículo, mês a mês desde 2013"
    nao_use_para: "somar a tabela inteira ou vários meses; série anterior a 2013 (use br_senatran_estatisticas.uf_tipo)"
    rascunho: [use_para, nao_use_para]
    verificado: "20.101.202 linhas no total; em 2026: 980.672 linhas, 8 meses, 5.572 linhas por mês e tipo (22 valores de tipo_veiculo, incl. 'total'), chave única; ago/2026 automovel 65.735.076, motocicleta 31.129.858, total 132.827.716 — medido 2026-10-27. Gotchas: linha_total_dobra_soma, frota_e_estoque_mensal, municipio_nao_informado"
