# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_mjsp_sinesp
tabelas:
  ocorrencias:
    ultima_data: "2022-12-01"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um município do Acre × mês, com a contagem de vítimas (tipo de crime não identificado na tabela)"
    chave: "cód_ibge, mes/ano (823 linhas = 823 distintos)"
    tempo: {natureza: serie_mensal, coluna: "mes/ano", cobertura: "2018-01-01–2022-12-01"}
    territorio: {nivel: municipio, colunas: {"cód_ibge": "código IBGE do município (7 dígitos, BIGINT)", "município": "nome", sigla_uf: "só 'AC'", regiao: "só 'NORTE'"}}
    medidas:
      - {coluna: "vítimas", o_que: "número de vítimas no município-mês; tipo de crime não documentado", unidade: "pessoas", soma: sim}
    filtros_tipicos: ["os nomes das colunas têm acento e barra: use aspas duplas (\"cód_ibge\", \"mes/ano\", \"vítimas\")", "a tabela cobre só 21 municípios do Acre (regiao = 'NORTE' é constante, não é a região toda)"]
    use_para: "série mensal de vítimas nos municípios do Acre listados"
    nao_use_para: "Brasil, Norte inteiro ou comparação entre crimes; para UFs use ocorrencias_uf"
    rascunho: [use_para, nao_use_para]
    verificado: "823 linhas, 823 distintos (cód_ibge, mes/ano); 21 municípios, só sigla_uf = 'AC' — medido 2026-10-27"
  ocorrencias_uf:
    grao: "uma UF × tipo de crime × ano × mês, com a contagem de ocorrências"
    chave: "uf, tipo_crime, ano, mes (23020 linhas = 23020 distintos)"
    tempo: {natureza: serie_mensal, coluna: "ano, mes", cobertura: "2015–2022; mes é o nome do mês em texto minúsculo ('janeiro'…'dezembro'), sem coluna numérica"}
    territorio: {nivel: uf, colunas: {uf: "nome da UF por extenso (ex.: 'Minas Gerais'), 27 valores"}}
    medidas:
      - {coluna: ocorrencias, o_que: "ocorrências registradas no mês", unidade: "ocorrências", soma: sim}
    filtros_tipicos: ["tipo_crime IN ('Homicídio doloso','Furto de veículo','Roubo de veículo','Estupro','Tentativa de homicídio','Roubo seguido de morte (latrocínio)','Lesão corporal seguida de morte','Roubo a instituição financeira','Roubo de carga'): 9 crimes, filtre um antes de somar", "ano = 2022 para o último ano; combinações sem ocorrência registrada podem faltar (ex.: 'Roubo a instituição financeira' tem 280 linhas em 2022, não 324), então ausência não é zero comprovado"]
    use_para: "série mensal de crimes selecionados por UF (2015–2022)"
    nao_use_para: "dados após 2022 ou crimes fora dos 9 listados; não misture tipos de crime ao somar"
    rascunho: [use_para]
    verificado: "23020 linhas, 23020 distintos (uf, tipo_crime, ano, mes); 27 UFs, 9 tipos; 2022 somado por tipo: Homicídio doloso 37439 (324 linhas), Furto de veículo 219548, Estupro 58087 — medido 2026-10-27"
