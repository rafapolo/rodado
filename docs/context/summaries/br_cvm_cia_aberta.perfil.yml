          títulos poderá declarar que o principal, prêmio e juros ainda não pagos estão vencidos e devem ser pagos imediatamente. Os eventos de
          defaul são: (i) inadimplemento pecuniário do título em questão, relacionado a pagamento de juros, não sanado em 30 dias e, também, relacionado
          a pagamento de principal, não sanado em 3 dias úteis (ii inadimplemento de covenants ou demais obrigações não pecuniárias previstas
          nos títulos ou escritura de emissão, não sanados dentro do período de cura de 90 dias contados da data de notificação do inadimplemento
          (iii) inadimplemento, por parte da Braskem ou qualquer subsidiária relevante, de qualquer dívida em valor igual ou superior a US$ 100.000.000,00
          (iv) descumprimento de decisão judicial final ou de ordem judicial de pagamento de valor igual ou superior a US $ 100.000.000,00, não
          suspensa ou cancelada (v) a Braskem ou qualquer subsidiária relevante inicie processo de falência, observadas as exceções previstas
          na escritura de emissão Juros: 8,0000% a.a. Garantia corporativa da Companhia crédito quirografário ou subordinado: Quirografário Distribuição
          de dividendos: Não há restrições Alienação de determinados ativos: A Braskem S.A. não deverá se consolidar ou se fundir com, ou transmitir,
          transferir ou locar todos ou parte substancial de seus ativo a qualquer Pessoa, a menos que, resumidamente: (i) a entidade resultante
          e/ou que receber os ativos relevantes seja uma Pessoa organizada e existente sob as leis do Brasil, Estados Unidos da América, qualquer
          de seus estados ou o distrito de Columbia qualquer país membro da União Europeia ou OCDE, ou qualquer país cuja dívida de longo prazo
          em moeda estrangeira seja considerada como "lnvestment Grade" pela S&P ou Moody''s e a entidade resultante e/ou que receber os ativos
          relevantes assuma expressamente (na forma de lndenture suplementar à lndenture do título em questão a ser entregue ao Trustee) todas
          as Obrigações previstas na respectiva lndenture e as garantias aplicáveis (ii) a entidade resultante e/ou que receber os ativos relevantes,
          se não fo organizada e existente de acordo com as leis do Brasil, assuma po meio de supplemental indenture a obrigação de pagar os montantes
          adicionais necessários para garantir que os montantes líquidos de principal, juros e prêmio não sejam menores em relação àqueles em
          vigor (iii) imediatamente após a transação, nenhum Default ou Evento de Default ocorra e (iv) a Braskem entregue ao custodiante um officer´s
          certificate e uma opinião legal, confirmando que tal operação está de acordo com a escritura de emissão dos bonds. Contratação de novas
          dívidas: A Braskem Netherlands Finance B.V. não poderá incorrer em qualquer Dívida, a menos que: (i) tenham as mesmas condições qu o
          título em questão (ii) sejam subordinadas a este título Emissão de novos valores mobiliários: Não há restrições Realização de operações
          societárias envolvendo o emissor, seus controladores ou controladoras: descrito no campo "Outras características aplicáveis"."', max: 'títulos
          de dívida (9,75% Senior Unsecured Notes) destinados à colocação no mercado internacional, no montante de US$50.000, sem garantia, juros
          nominais de 9,75% (taxa de juros efetiva de 10,68% ao ano), pagáveis semestralmente em 11 de novembro e 11 de maio de cada ano, a partir
          de 2011.'}
      Condicao_Alteracao_Direitos: {tipo: VARCHAR, nulos_pct: 7.41, distintos_aprox: 145, min: '"O Banco poderá realizar "alterações qualificadas"
          nos títulos, sem o consentimento dos investidores, a qualquer momento e quando necessário para atender novo normativo do Banco Central
          do Brasil, cumprindo requisitos para manter a qualificação da dívida como Capital de Nível 1 ou Nível 2, devido à implementação de Basileia
          III. O Banco poderá também proceder a outras alterações ("alterações não qualificadas"), desde que não causem qualquer prejuízo material
          aos detentores dos títulos, conforme formalmente certificado pelo Banco ao trustee.As "alterações qualificadas" consistem em:a) alterações
          para absorção de perdas (nos limites necessários à adequação da dívida como Capital de Nível 1 ou de Nível 2) eb) alterações de pagamento
          de juros e de não principal (sendo previsto que o Banco se compromete a recomendar o não pagamento de dividendos a seus acionistas até
          que haja o pagamento dos juros e não principal dos títulos relativos a um período).A ocorrência das alterações qualificadas (a) e (b)
          implicará na eliminação, nos termos e condições dos títulos, da obrigatoriedade de o Banco pagar juros e não principal caso pague dividendos
          a seus acionistas."', max: 'vi. condições para alteração dos direitos:O Banco poderá realizar "alterações qualificadas" nos títulos,
          sem o consentimento dos investidores, a qualquer momento e quando necessário para atender novo normativo do Banco Central do Brasil,
          cumprindo requisitos para manter a qualificação da dívida como Capital de Nível 1 ou Nível 2, devido à implementação de Basileia III.
          O Banco poderá também proceder a outras alterações ("alterações não qualificadas"), desde que não causem qualquer prejuízo material
          aos detentores dos títulos, conforme formalmente certificado pelo Banco ao trustee.As "alterações qualificadas" consistem em:a) alterações
          para absorção de perdas (nos limites necessários à adequação da dívida como Capital de Nível 1 ou de Nível 2) eb) alterações de pagamento
          de juros e de não principal (sendo previsto que o Banco se compromete a recomendar o não pagamento de dividendos a seus acionistas até
          que haja o pagamento dos juros e não principal dos títulos relativos a um período).A ocorrência das alterações qualificadas (a) e (b)
          implicará na eliminação, nos termos e condições dos títulos, da obrigatoriedade de o Banco pagar juros e não principal caso pague dividendos
          a seus acionistas.'}
      Outras_Caracteristicas: {tipo: VARCHAR, nulos_pct: 8.54, distintos_aprox: 523, min: "\aEmissora: Rede D'Or Finance S.À.R.L., subsidiária\
          \ integral da Companhia.\aAgente Fiduciário: O BNY Mellon atua como trustee, paying agent transfer agent dos títulos no âmbito da escritura\
          \ de emissão e tem como função principal assegurar o direito dos investidores.\aAgente de Pagamento de Luxemburgo: Banque Internationale\
          \ à Luxembourg S.A.\aPara quantidade, essa informação deve ser considerada como \"não aplicável\". O título emitido é um Bond.Hipóteses\
          \ de vencimento antecipado: caso ocorra algum evento de inadimplemento que não seja curado ou perdoado, (i) detentores dos títulos representando\
          \ pelo menos 25% do valor de principal das notas em aberto ou (ii) o trustee, sob a determinação de tais detentores dos títulos representando\
          \ 25% do valor de principal das notas em aberto, mediante entrega de notificação ao Avalista, declarar o descumprimento dentro do prazo\
          \ previsto. Determinados eventos de inadimplemento não exigem a entrega de qualquer notificação por parte dos detentores dos títulos\
          \ ou do trustee para a declaração de vencimento antecipado.\aGarantia: os títulos possuem garantia fidejussória da Companhia.\aSe o\
          \ crédito é quirografário ou subordinado: Não aplicável.\aEventuais restrições de dividendos: Não há restrições de distribuição de dividendos\
          \ pela Companhia.A consolidação e fusões: há restrições a consolidações e fusões conforme especificado nos termos da escritura", max: 'vii.
          outras características relevantes:Qualquer pagamento de não principal não será devido e não acumulará se o emissor não distribuir dividendos
          aos detentores de ações ordinárias com relação ao período correspondente ao período de juros dos títulos.Taxa de câmbio em 29/12/2017
          US$1,00 = R$ 3,3080.'}
