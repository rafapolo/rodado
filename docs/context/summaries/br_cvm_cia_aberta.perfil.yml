      Hipotese_Calculo_Resgate: {tipo: VARCHAR, nulos_pct: 18.28, distintos_aprox: 423, min: "\aData da Opção de Recompra: 25/01/2026. A partir\
          \ da Data de Reinicialização do Benchmark (25/01/2026), a taxa de juros dos cupons semestrais será igual à Taxa de Redefinição do Benchmark\
          \ (US Treasury 5 years) mais o Spread de Crédito de 4,928% ao ano.\aBaixa da Nota pelo Emitente: As notas serão baixadas de forma permanente,\
          \ em valor mínimo correspondente ao saldo alocado ao Capital Nível 2, mediante a ocorrência dos seguintes eventos, ou outros eventos\
          \ que possam ser determinados pelo Banco Central ou por qualquer Autoridade Governamental brasileira competente: I.divulgação pela Emissora,\
          \ na forma estabelecida pelo Banco Central, de que seu Capital Principal Nível 1 é inferior a 4,5% do RWA apurado de acordo com a Resolução\
          \ 4.193II.celebração de contrato de integralização de capital nos termos da exceção prevista no Artigo 28 da Lei Complementar nº 101,\
          \ de 4 de maio de 2000III.decreto, do Banco Central, de Regime de Administração Especial Temporária, de intervenção nos negócios ou\
          \ de liquidação da Emissora ou IV.determinação, pelo Banco Central, com base nos critérios estabelecidos pelo Conselho Monetário Nacional,\
          \ de baixa das Notas. \aResgate Opcional pelo Emitente: Sujeito à aprovação prévia do Banco Central ou de qualquer outra Autoridade\
          \ Governamental Brasileira aplicável, se necessária, o Emissor pode, a sua opção, resgatar as Notas, no todo, mas não em parte, na Data\
          \ de Convocação, ao par, desde que a Emissora, imediatamente após o referido resgate, cumpra os requisitos mínimos de Capital Regulatório\
          \ e cumpra o Adicional de Capital Principal e demais limites operacionais. \aResgate Opcional em caso de Evento Fiscal: Sujeito à aprovação\
          \ prévia do Banco Central ou de qualquer outra Autoridade Governamental Brasileira aplicável para tal resgate (se tal aprovação for\
          \ necessária), a qualquer momento, na Data da Convocação ou após a Data de Convocação, o Emissor pode resgatar as Notas, no todo, mas\
          \ não em parte, após a ocorrência de um Evento Fiscal, no par. \aResgate Opcional devido a Evento Regulatório: Sujeito à aprovação prévia\
          \ do Banco Central ou de qualquer outra Autoridade Governamental Brasileira aplicável para tal resgate (se tal aprovação for necessária),\
          \ o Emissor pode resgatar as Notas, no todo, mas não em parte, a qualquer momento, ao par, seguindo a ocorrência de um Evento Regulatório.",
