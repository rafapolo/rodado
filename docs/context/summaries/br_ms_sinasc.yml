# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ms_sinasc
tabelas:
  microdados:
    ultima_data: "2023"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma declaração de nascido vivo (DN) do SINASC, uma linha por nascimento"
    chave: "(id_municipio_nascimento, sequencial_nascimento, data_nascimento) — único em ano = 2023; sequencial_nascimento sozinho NÃO é único (min 1, max 99999, repete entre municípios)"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "1994–2023 (30 anos; 2023 parcial: data_nascimento vai só até 2023-06-05, 986.591 linhas)"}
    territorio:
      nivel: municipio
      colunas:
        id_municipio_nascimento: "município (IBGE, 7 dígitos) onde ocorreu o nascimento"
        id_municipio_residencia: "município de residência da mãe; use este para perfil de moradores"
        id_municipio_mae: "município da mãe (nulo em 3,11%); sigla_uf é a UF do nascimento"
        sigla_uf: "UF do nascimento"
    medidas:
      - {expressao: "count(*)", o_que: "nascidos vivos (uma DN por nascimento; gêmeos são DNs separadas)", unidade: "nascidos", soma: sim}
      - {coluna: peso, o_que: "peso ao nascer", unidade: "gramas (min 100, max 7000, média 3152 em 2023)", soma: nao}
      - {coluna: idade_mae, o_que: "idade da mãe", unidade: "anos (min 8, max 99)", soma: nao}
      - {coluna: apgar1, o_que: "Apgar 1º minuto; 99 = ignorado segundo o dicionário", unidade: "pontos 0–10", soma: nao}
      - {coluna: semana_gestacao, o_que: "semanas de gestação", unidade: "semanas", soma: nao}
    filtros_tipicos:
      - "ano = 2023 (ou outro ano) — tabela de 85,6 milhões de linhas, filtre sempre a partição ano"
      - "sexo = '1' masculino, '2' feminino, '0' ignorado (dicionário; VARCHAR, não número)"
      - "tipo_parto = '2' cesário, '1' vaginal, '9' ignorado (em 2023: 582.846 cesáreos, 402.900 vaginais)"
      - "raca_cor = '1' branca, '2' preta, '3' amarela, '4' parda, '5' indígena; nulo em 1,91% dos casos"
      - "local_nascimento = '1' hospital (972.156 em 2023), '2' outros estabelecimentos, '3' domicílio, '4' outros, '9' ignorado; o valor '5' (308 linhas) não está no dicionário"
      - "tipo_gravidez = '1' única, '2' dupla, '3' tripla ou mais"
      - "pre_natal_agr = '4' (7 ou mais consultas), '3' 4 a 6, '2' 1 a 3, '1' nenhuma, '9' ignorado"
      - "id_anomalia = '1' com anomalia (8.648 em 2023), '2' sem, '9' ignorado; codigo_anomalia (CID) é nulo em 99,12%"
      - "tipo_robson vem com zero à esquerda ('01'..'11') mas o dicionário usa chave '1'..'11' sem zero: junte com cuidado"
      - "status_dn = '1'/'0': significado não documentado no perfil (dicionário diz Sim/Não)"
    use_para: "contar nascimentos e traçar perfil de mães e recém-nascidos (peso, parto, pré-natal, escolaridade) por município e ano"
    nao_use_para: "taxas por habitante sem denominador de população, ou 2023 como ano completo (só vai até junho)"
    rascunho: [use_para, nao_use_para]
    verificado: "85.559.034 linhas; ano=2023: 986.591 linhas = 986.591 distintos de (id_municipio_nascimento, sequencial_nascimento, data_nascimento) e também de ...+codigo_estabelecimento+numero_lote; 30 anos distintos (1994–2023); cartorio, registro_cartorio e data_registro_cartorio 100% nulos em 2023 — medido 2026-10-27"
  dicionario:
    grao: "um valor de código por coluna (id_tabela, nome_coluna, chave, cobertura_temporal, valor)"
    use_para: "traduzir códigos de microdados (sexo, raca_cor, tipo_parto, local_nascimento, escolaridade_mae...) em rótulos"
