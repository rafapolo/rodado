# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_icmbio_embargos
tabelas:
  termo_embargo:
    grao: "uma feição (polígono) de um termo de embargo do ICMBio; um embargo pode ter várias feições"
    chave: "nenhuma: 14.806 linhas para 13.585 embargos (origem, serie, numero_emb); 22 grupos repetem até com a mesma geometria"
    tempo: {natureza: serie_de_periodos, coluna: data, cobertura: "2009-05-17–2026-10-13"}
    territorio: {nivel: ponto, colunas: {uf: "UF da feição", municipio: "nome do município (texto)", nome_uc: "unidade de conservação", cnuc: "código da UC no CNUC", geometria: "polígono (CRS84); nula em 272 linhas"}}
    medidas:
      - {coluna: area_calc_ha, o_que: "área do polígono calculada em EPSG:5880", unidade: "hectare", soma: sim}
      - {expressao: "count(DISTINCT (origem, serie, numero_emb))", o_que: "número de embargos", unidade: "embargos", soma: nao}
    filtros_tipicos:
      - "origem = 'Papel' (7.234 feições; serie 'A' ou 'B') ou origem = 'Eletrônico' (7.572; serie é NULL): numero_emb só é único junto com serie e origem; contar distinct sobre serie||numero_emb descarta todo o Eletrônico (ver gotchas varias_feicoes_por_embargo)"
      - "tipo_infra = 'Das Infrações Contra a Flora' (9.886 feições), a categoria dominante"
    use_para: "área embargada (ha) e número de embargos por UF, UC ou ano de data"
    nao_use_para: "saber se o embargo segue vigente (não há desembargo; ver gotchas sem_desembargo) ou somar o texto de area (ver area_texto)"
    rascunho: [use_para, nao_use_para]
    verificado: "14.806 linhas; 13.585 embargos distintos (Papel 6.398 por serie+numero_emb, Eletrônico 7.187); area_calc_ha soma 952.901 ha; 272 sem geometria; 22 grupos duplicados — medido 2026-10-27."
