# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_fgv_igp
tabelas:
  igp_10_mes:
    grao: um mês do IGP-10
    chave: 'ano + mes: count(*) = count(DISTINCT (ano, mes)) = 359'
    tempo:
      natureza: serie_mensal
      coluna: ano, mes
      cobertura: 1993–2023
    territorio:
      nivel: brasil
      colunas: {}
    medidas:
    - coluna: indice
      o_que: número-índice do mês
      unidade: número-índice
      soma: nao
    - coluna: variacao_mensal
      o_que: variação sobre o mês anterior
      unidade: percentual
      soma: 'nao: acumule por produto de (1+v/100), nunca some'
    - coluna: variacao_12_meses
      o_que: variação em 12 meses
      unidade: percentual
      soma: nao
    - coluna: variacao_acumulada_ano
      o_que: variação acumulada no ano
      unidade: percentual
      soma: nao
    filtros_tipicos:
    - 'ano = ano civil, mes = mês (1–12): esta tabela está certa'
    use_para: inflação e correção de valores mês a mês pelo IGP-10.
    nao_use_para: somar variações percentuais; buscar 2022 nas tabelas anuais (param em 2021).
    verificado: 359 linhas, 359 pares (ano, mes) distintos; ano 1993–2023, mes 1–12 (certa) — medido 2026-10-27
