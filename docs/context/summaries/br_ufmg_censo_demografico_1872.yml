      o_que: 'contagem de pessoas por célula do quadro (colunas pelo nome: sexo, raça/estado civil, livre/escravizado)'
      unidade: pessoas
      soma: sim (dentro de uma mesma id_categoria e sem as linhas de Total/conferência)
    filtros_tipicos:
    - 'no corrigido id_categoria = ''30'' é ''Total''; no original ''29''–''31'' são linhas de conferência (Estado civil, Religião, Total de estrangeiros) — excluí-las ao somar nacionalidades; ''1'' e ''2'' são africanos escravos e livres; o significado de cada id_categoria é específico da tabela: ler br_ufmg_censo_demografico_1872.dicionario com id_tabela = nome da tabela e nome_coluna = ''id_categoria'' (chave é texto, ex.: ''1'')'
    use_para: estrangeiros por nacionalidade, religião e estado civil
    nao_use_para: somar todas as id_categoria juntas (categorias se sobrepõem e há linhas de Total); comparar ids de categoria entre tabelas ou entre original e corrigido (a numeração difere)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 19080 linhas, 19080 distintos de (id_municipio_1872, id_categoria) — chave confirmada em todas as tabelas, medido 2026-10-27
