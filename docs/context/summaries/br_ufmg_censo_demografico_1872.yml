# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ufmg_censo_demografico_1872
tabelas:
  domicilio_corrigido_municipio:
    ultima_data: "1872"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: 'um município × ano: casas habitadas, desabitadas e fogos, nos dados corrigidos'
    chave: id_municipio_1872
    tempo:
      natureza: retrato_atual
      coluna: ano
      cobertura: 1872–1872 (censo único)
    territorio:
      nivel: outro
      colunas:
        id_provincia: província
        id_municipio_1872: município de 1872 (código próprio do censo, não IBGE; nomes em municipio)
    medidas:
    - coluna: casas_habitadas
      o_que: casas habitadas
      unidade: casas
      soma: sim
    - coluna: casas_desabitadas
      o_que: casas desabitadas
      unidade: casas
      soma: sim
    - coluna: fogos
      o_que: fogos (domicílios/famílias recenseadas)
      unidade: fogos
      soma: sim
    use_para: contar casas e fogos por local em 1872
    nao_use_para: população de pessoas — não há contagem de habitantes aqui
    rascunho:
    - use_para
    - nao_use_para
    verificado: 636 linhas, 636 distintos de (id_municipio_1872) — chave confirmada em todas as tabelas, medido 2026-10-27; 636 municípios com dado de 6 a menos que os 642 de municipio
