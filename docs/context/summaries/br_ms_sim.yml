# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ms_sim
tabelas:
  microdados:
    ultima_data: "2026-05-31"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "uma declaração de óbito (DO) do SIM"
    chave: "(sigla_uf, sequencial_obito) — confirmada em ano = 2024: 1.532.015 linhas = 1.532.015 distintos; sequencial_obito sozinho também deu 1.532.015 distintos nesse ano"
    tempo: {natureza: serie_diaria, coluna: "data_obito (ano = ano do óbito; data_cadastro e data_recebimento são datas do sistema)", cobertura: "1996–2026 (2026 só até 2026-08-31, 912.010 óbitos); ano = year(data_obito) em todas as linhas"}
    territorio: {nivel: municipio, colunas: {id_municipio_residencia: "residência do falecido, IBGE 7 dígitos (0,1% nulo)", id_municipio_ocorrencia: "onde morreu, 7 dígitos", sigla_uf: "UF do registro", id_municipio_naturalidade: "naturalidade"}}
    medidas:
      - {expressao: "count(*)", o_que: "óbitos", unidade: "óbitos", soma: sim}
      - {coluna: idade, o_que: "idade em anos completos (DOUBLE; nula em 0,26%)", unidade: "anos", soma: nao}
    filtros_tipicos:
      - "ano = <ano> sempre (36 milhões de linhas)"
      - "substr(causa_basica,1,3) BETWEEN 'X60' AND 'X84' para suicídio; causa_basica é CID-10 de 4 caracteres sem ponto (gotcha causa_vs_circunstancia)"
      - "tipo_obito = 'nao-fetal' (único valor visto em 2024 e 2026)"
      - "sexo = 'masculino' ou 'feminino' (minúsculas); raca_cor = 'branca','parda','preta','amarela','indigena' (minúsculas, sem acento; gotcha codigos_como_float cobre o resto)"
      - "local_ocorrencia = 'hospital','domicilio','via publica','outro estabelecimento de saude','outros','aldeia indigena'"
    use_para: "causas de morte, perfil do falecido e mortalidade por ocorrência/residência, município por município e dia a dia."
    nao_use_para: "taxas sem denominador (junte com br_ms_populacao.municipio, ano de mesma referência); causa de morte por circunstancia_obito (gotcha causa_vs_circunstancia); comparar 2026 com ano fechado (vai só até agosto); óbito fetal (a tabela só tem tipo_obito 'nao-fetal')."
    verificado: "chave (sigla_uf, sequencial_obito) única em cada ano de 2019 a 2026: 1.349.801 / 1.556.824 / 1.832.649 / 1.544.266 / 1.465.610 / 1.532.015 / 1.534.588 / 912.010 (data_obito até 2026-08-31); ano = year(data_obito) em 100% das linhas; tipo_obito só 'nao-fetal' em 2019 e 2025; 2019: id_municipio_residencia não nulo em 1.347.262 e ocorrência em 1.349.784; 2024: residência nula em 2.290 e ocorrência em 18; ano 1996–2026 — medido 2026-10-27, refeito 2026-11-10 (cobertura de 2026 era 05-31 no cartão anterior)"
  municipio:
    ultima_data: "2019"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um município de residência do falecido × ano com o total de óbitos; as linhas com id_municipio nulo são os óbitos de residência ignorada, uma por UF e ano"
    chave: "(ano, sigla_uf, id_municipio): 172.024 linhas = 172.024 distintos. Só (ano, id_municipio) repete (173 linhas a mais), porque a residência ignorada vem uma vez por UF."
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "1996–2026 (2026 até agosto, soma 912.010); o cartão anterior dizia que acabava em 2019, o que era falso"}
    territorio: {nivel: municipio, colunas: {id_municipio: "município de RESIDÊNCIA, IBGE 7 dígitos (nulo = residência ignorada)", sigla_uf: "UF"}}
    medidas:
      - {coluna: numero_obitos, o_que: "óbitos do município no ano", unidade: "óbitos", soma: sim}
    use_para: "total anual de óbitos por município de residência, de 1996 a 2026; o mais barato para taxa de mortalidade geral."
    nao_use_para: "óbitos por município de ocorrência (em 2024 só 7 dos 5.595 municípios batem com a ocorrência de microdados; 5.570 batem com a residência); causa, idade, sexo ou raça (use as tabelas mais abertas); linha com id_municipio nulo como se fosse um município (somar sem ela perde 2.290 óbitos em 2024)."
    verificado: "172.024 linhas = 172.024 distintos de (ano, sigla_uf, id_municipio); soma de numero_obitos: 2019 = 1.347.263, 2020 = 1.556.824, 2024 = 1.532.015 (= contagem de microdados), 2025 = 1.534.588, 2026 = 912.010; 2024: 5.595 linhas, 5.570 com numero_obitos igual à contagem de microdados por id_municipio_residencia, 7 por ocorrência; id_municipio nulo soma 2.290 em 2024 (= residência nula em microdados); ano 1996–2026 — medido 2026-11-10. O cartão de 2026-10-27 dizia 1996–2019 e 15 chaves repetidas"
  municipio_causa:
    ultima_data: "2026"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um município × ano × causa básica (CID-10 de 4 caracteres)"
    chave: "(ano, sigla_uf, id_municipio, causa_basica): ano = 2024 495.722 linhas = 495.722 distintos; sem sigla_uf repete, porque id_municipio nulo vem uma vez por UF (830 linhas em 2024)"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "1996–2026 (2026 até agosto)"}
    territorio: {nivel: municipio, colunas: {id_municipio: "município de RESIDÊNCIA, IBGE 7 dígitos (nulo = residência ignorada)", sigla_uf: "UF"}}
    medidas:
      - {coluna: numero_obitos, o_que: "óbitos naquela causa e município", unidade: "óbitos", soma: sim}
    filtros_tipicos: ["ano = <ano> (11 milhões de linhas); causa_basica como 'X60'… (sem ponto; 4 caracteres, ex.: 'A020')"]
    use_para: "óbitos por causa básica e município de residência, mais rápido que microdados."
    nao_use_para: "cortes por idade, sexo ou raça (use as tabelas mais abertas); município de ocorrência (aqui é residência); datas ou local do óbito (microdados)."
    verificado: "ano = 2024: 495.722 linhas = 495.722 distintos de (ano, sigla_uf, id_municipio, causa_basica); soma de numero_obitos 1.532.015 (igual a microdados), com 2.290 em id_municipio nulo; somas 2019 1.349.801, 2020 1.556.824, 2025 1.534.588, 2026 912.010 (todas iguais a microdados do ano) — medido 2026-11-10"
  municipio_causa_idade:
    ultima_data: "2026"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um município × ano × causa básica × idade em anos"
    chave: "(ano, sigla_uf, id_municipio, causa_basica, idade): ano = 2024 1.178.176 linhas = 1.178.176 distintos"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "1996–2026"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos", sigla_uf: "UF"}}
    medidas:
      - {coluna: numero_obitos, o_que: "óbitos", unidade: "óbitos", soma: sim}
    filtros_tipicos: ["ano = <ano> (27 milhões de linhas); idade BIGINT em anos (nula em 0,26%)"]
    use_para: "óbitos por causa e idade em anos no município de residência."
    nao_use_para: "sexo/raça (use municipio_causa_idade_sexo_raca); município de ocorrência."
    verificado: "ano = 2024: 1.178.176 linhas = 1.178.176 distintos de (ano, sigla_uf, id_municipio, causa_basica, idade); soma 1.532.015; 2025 1.179.863 linhas, soma 1.534.588; 2026 745.506 linhas, soma 912.010 — medido 2026-11-10"
  municipio_causa_idade_sexo_raca:
    ultima_data: "2026"  # dado mais recente, gerado por scripts/gera_ultima_data.py
    grao: "um município × ano × causa básica × idade × sexo × raça/cor"
    chave: "(ano, sigla_uf, id_municipio, causa_basica, idade, sexo, raca_cor): ano = 2024 1.340.506 linhas = 1.340.506 distintos"
    tempo: {natureza: serie_anual, coluna: ano, cobertura: "1996–2026"}
    territorio: {nivel: municipio, colunas: {id_municipio: "IBGE 7 dígitos", sigla_uf: "UF"}}
    medidas:
      - {coluna: numero_obitos, o_que: "óbitos", unidade: "óbitos", soma: sim}
    filtros_tipicos: ["ano = <ano> (31 milhões de linhas)", "sexo = 'masculino'/'feminino'; raca_cor = 'branca','parda','preta','amarela','indigena' (minúsculas; nulo em 1,3%)"]
    use_para: "óbitos por causa, idade, sexo e raça no município de residência."
    nao_use_para: "detalhes da DO (local, escolaridade, data): use microdados; município de ocorrência."
    verificado: "ano = 2024: 1.340.506 linhas = 1.340.506 distintos da chave inteira; soma 1.532.015; 2025 1.342.479 linhas, soma 1.534.588; 2026 828.450 linhas, soma 912.010 — medido 2026-11-10"
  dicionario:
    grao: "uma linha por código (nome_coluna, chave, valor) das colunas do SIM"
    use_para: "traduzir códigos das tabelas do SIM."
