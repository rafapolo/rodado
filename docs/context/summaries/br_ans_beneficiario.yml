# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ans_beneficiario
tabelas:
  informacao_consolidada:
    grao: "uma célula agregada de beneficiários: mês × município × operadora × plano × sexo × faixa etária × vínculo × características do contrato (não é uma pessoa)"
    chave: "(ano, mes, sigla_uf, id_municipio, codigo_operadora, codigo_plano, sexo, faixa_etaria, faixa_etaria_reajuste, tipo_vinculo, contratacao_beneficiario, segmentacao_beneficiario, abrangencia_beneficiario, cobertura_assistencia_beneficiario, tipo_vigencia_plano, data_carga): confirmada em ano = 2025, mes = 6 (15.219.249 linhas = 15.219.249 combinações), mês que tem uma só data_carga"
    tempo: {natureza: serie_mensal, coluna: "ano, mes", cobertura: "2014–2025 (em 2025, meses 1–10)"}
    territorio:
      nivel: municipio
      colunas:
        sigla_uf: "UF do beneficiário; 'XX' = sem informação (7.494 linhas em 2025-06)"
        id_municipio: "código IBGE de 7 dígitos; nulo em ~0,06% das linhas"
        codigo_operadora: "registro ANS da operadora, 6 dígitos com zero à esquerda"
    medidas:
      - {coluna: quantidade_beneficiario_ativo, o_que: "beneficiários ativos na célula no mês (estoque)", unidade: "pessoas", soma: sim}
      - {coluna: quantidade_beneficiario_aderido, o_que: "adesões no mês (fluxo)", unidade: "pessoas", soma: sim}
      - {coluna: quantidade_beneficiario_cancelado, o_que: "cancelamentos no mês (fluxo)", unidade: "pessoas", soma: sim}
    filtros_tipicos:
      - "ano = 2025 AND mes = 6: a tabela tem 2,3 bilhões de linhas; sempre filtre a partição"
      - "data_carga = MAX(data_carga) do mês: cargas diferentes convivem no mesmo (ano, mes) (gotcha data_carga_sobreposta; a métrica pronta é get_metric('beneficiarios_ans_ativos'))"
      - "cobertura_assistencia_beneficiario com acento corrompido: 'Ma©dico-Hospitalar' e 'Medico-Hospitalar' coexistem, 'Odontola³gico' também (agrupar pelo texto parte a categoria)"
      - "tipo_vigencia_plano = 'P' (14.535.987 linhas em 2025-06) ou 'A' (683.262): significado não documentado"
    use_para: "contar beneficiários ativos por município, operadora, faixa etária ou tipo de plano em um mês"
    nao_use_para: "contar pessoas distintas entre meses ou somar vários meses de quantidade_beneficiario_ativo (é estoque mensal)"
    rascunho: [use_para, nao_use_para]
    verificado: "ano = 2025, mes = 6: 15.219.249 linhas, uma só data_carga (2025-07-31), soma de quantidade_beneficiario_ativo 87.295.978 (inclui odontológico: 5.113.613 linhas odontológicas contra 10.105.636 médico-hospitalares), aderidos 2.341.220, cancelados 2.391.766 — medido 2026-10-27"
