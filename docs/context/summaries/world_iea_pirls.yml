# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: world_iea_pirls
tabelas:
  dictionary:
    grao: um valor codificado (table_id, column_name, key → value) do questionário PIRLS 2021
    chave: (table_id, column_name, key)
    tempo: &id001
      natureza: sem_tempo
      coluna: temporal_coverage (só no dicionário)
      cobertura: PIRLS 2021 (aplicação em 2021)
    use_para: 'traduzir códigos das demais tabelas (ex.: sex_student 1 = Girl, 2 = Boy; student_wave_indicator 1 = Spring 2021; country_id 8 = Albania)'
    nao_use_para: dados de alunos
    rascunho:
    - use_para
    - nao_use_para
    verificado: 7.654 linhas = 7.654 distintas em (table_id, column_name, key) — medido 2026-10-27
  student_context:
    grao: um aluno de 4º ano (grade_id 4–6) com respostas de contexto do teste
    chave: (country_id, student_id) (413.387 linhas, 413.387 distintas); student_id sozinho NÃO é único (92.503 distintos), pois se repete entre países
    tempo: *id001
    territorio: &id002
      nivel: outro
      colunas:
        country_id: código IEA numérico do país ou entidade de referência (65 valores, inclui entidades como 7842, 7106, 7841, 643001 com sufixo)
        country_iso3_code: código numérico ISO do país (em texto, 51 valores); nulo em ~19% das linhas, nas entidades de referência sem código ISO próprio
    filtros_tipicos:
    - country_id (texto) para o país; country_iso3_code é nulo em ~19% das linhas, não filtre por ele sem checar
    - 'valores de código são texto (''1'',''2''): sex_student = ''1'' Girl, ''2'' Boy (pelo dicionário)'
    - grade_id IN ('4','5','6') (275.005, 129.065 e 9.317 linhas)
    use_para: caracterizar o aluno (sexo, língua, posição no teste) e ligar a student_achievement/home_context por (country_id, student_id)
    nao_use_para: notas (estão em student_achievement, tabela não lida) ou perguntas aos pais (home_context); perguntas do país Brasil (ausente)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 413.387 linhas = 413.387 distintas em (country_id, student_id) e em (country_id, school_id, class_id, student_id); 65 country_id, 51 country_iso3_code — medido 2026-10-27
  home_context:
    grao: um aluno × respostas do questionário dos pais (home)
    chave: (country_id, student_id) (413.387 linhas, 413.387 distintas)
    tempo: *id001
    territorio: *id002
    filtros_tipicos: &id003
    - country_id (texto) para o país; country_iso3_code é nulo em ~19% das linhas, não filtre por ele sem checar
    - 'valores de código são texto (''1'',''2''): sex_student = ''1'' Girl, ''2'' Boy (pelo dicionário)'
    use_para: 'contexto doméstico do aluno: recursos de casa, língua, hábitos (colunas asbh*, 20–23% de nulos)'
    nao_use_para: país/aluno sem juntar por (country_id, student_id); student_id sozinho
    rascunho:
    - use_para
    - nao_use_para
    verificado: 413.387 linhas = 413.387 distintas em (country_id, student_id) — medido 2026-10-27
  school_context:
    grao: uma escola × respostas do questionário da escola
    chave: 'nenhuma: 14.026 linhas, 13.374 pares (country_id, school_id) distintos; school_id sozinho tem só 709 distintos e se repete entre países'
    tempo: *id001
    territorio: *id002
    filtros_tipicos:
    - country_id (texto) para o país; country_iso3_code é nulo em ~19% das linhas, não filtre por ele sem checar
    - 'valores de código são texto (''1'',''2''): sex_student = ''1'' Girl, ''2'' Boy (pelo dicionário)'
    - 'grade_id IN (''4'',''5'',''6'') (12.835, 938 e 253 linhas): uma escola pode aparecer mais de uma vez por grade'
    use_para: características das escolas (colunas acbg*)
    nao_use_para: contar escolas com count(*) (repete); chave (country_id, school_id)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 14.026 linhas, 13.374 distintas em (country_id, school_id) — medido 2026-10-27
  teacher_context:
    grao: um professor × turma/vínculo (teacher_link_id) × questionário do professor
    chave: 'nenhuma: 21.561 linhas, 21.439 distintas em (country_id, teacher_id, teacher_link_id); 122 linhas repetem'
    tempo: *id001
    territorio: *id002
    filtros_tipicos: *id003
    use_para: perfil de professores (colunas atbg*, 16–18% de nulos) ligável por student_teacher_link
    nao_use_para: contar professores com count(*)
    rascunho:
    - use_para
    - nao_use_para
    verificado: 21.561 linhas, 21.439 distintas em (country_id, teacher_id, teacher_link_id) e em (country_id, school_id, teacher_id, teacher_link_id) — medido 2026-10-27
  student_teacher_link:
    grao: um aluno × professor (vínculo teacher_link_id)
    chave: (country_id, student_id, teacher_id, teacher_link_id) (414.735 linhas, 414.735 distintas); também única em (country_id, student_id, teacher_link_id)
    tempo: *id001
    territorio: *id002
    filtros_tipicos: *id003
    use_para: ligar alunos a professores (student_context ↔ teacher_context)
    nao_use_para: 'contar alunos com count(*) (1.348 alunos têm mais de uma linha: 413.387 distintos em 414.735)'
    rascunho:
    - use_para
    - nao_use_para
    verificado: 414.735 linhas = 414.735 distintas; 413.387 alunos distintos — medido 2026-10-27
  student_achievement:
    grao: "um aluno avaliado no PIRLS 2021 (leitura, 4º ano), com respostas aos itens, pesos amostrais e cinco valores plausíveis de proficiência"
    chave: "version, scope, pirls_type, country_id, school_id, class_id, student_id (413.387 linhas = 413.387 distintos); (country_id, student_id) com pirls_type também é única"
    tempo: {natureza: serie_de_periodos, coluna: student_wave_indicator, cobertura: "PIRLS 2021 (version = '6'): '1' = Spring 2021, '2' = Fall 2021, '3' = Spring 2022 (dicionário)"}
    territorio: {nivel: outro, colunas: {country_id: "código numérico do país ou entidade (75 distintos; ex. '784', '710', '7842')", country_iso3_code: "apesar do nome contém código numérico ISO (784, 710, 398), nulo em 19% das linhas (entidades subnacionais como '7842')", school_id: "escola", class_id: "turma"}}
    medidas:
      - {expressao: "asrrea01..asrrea05", o_que: "valores plausíveis de proficiência geral em leitura (média 499,8, mín. 5, máx. 868,7)", unidade: "pontos da escala PIRLS", soma: nao}
      - {expressao: "asrlit01..05, asrinf01..05", o_que: "valores plausíveis das subescalas de leitura literária e informativa (sufixos 01 a 05); outros grupos asriie, asrrsi, asribm não documentados aqui", unidade: "pontos", soma: nao}
      - {coluna: total_student_weight, o_que: "peso amostral final do aluno (média 69,3, máx. 7.424)", unidade: "peso", soma: sim}
      - {coluna: house_weight, o_que: "peso 'house' (média 1,0)", unidade: "peso", soma: nao}
    filtros_tipicos: ["pirls_type = 'Normal' (367.575 linhas) ou 'Bridge' (45.812): significado de Bridge não documentado, não misture sem decidir", "sex_student = '1' (Girl) ou '2' (Boy), VARCHAR", "grade_id = '4' (275.005 linhas), '5' ou '6'", "reliability_coding_status = true marca 243.691 linhas (significado não documentado)"]
    use_para: "estimar proficiência em leitura por país com os pesos total_student_weight e os cinco valores plausíveis (média de cada asrrea0N, depois média dos cinco)."
    nao_use_para: "média simples sem pesos; usar só asrrea01 como nota individual; as 864 colunas de itens (rp*, re*, e*) são respostas brutas, não resultados."
    rascunho: [use_para, nao_use_para, medidas]
    verificado: "413.387 linhas, 864 colunas; chave de 7 colunas única; version = '6' e scope = '1' em todas — medido 2026-10-27"
  within_country_scoring_reliability:
    grao: "um aluno cuja correção de itens de resposta construída foi recodificada por um segundo avaliador (confiabilidade da correção dentro do país); são as 243.691 linhas de student_achievement com reliability_coding_status = true"
    chave: "(country_id, student_id): 243.691 linhas = 243.691 distintas; student_id sozinho NÃO é único (69.471 distintos). Também única com student_wave_indicator."
    tempo: {natureza: sem_tempo, coluna: "(PIRLS 2021)", cobertura: "PIRLS 2021"}
    territorio: {nivel: outro, colunas: {country_id: "código IEA do país (65 valores)", country_iso3_code: "código numérico ISO em texto; nulo em 40.715 linhas (16,7%)"}}
    medidas:
      - {coluna: "rpr*, rer* (ex.: rpr41b01)", o_que: "avaliação da resposta pelo primeiro/segundo avaliador: '1' = Acceptable Response, '0' = Unacceptable Response (pelo dicionário)", unidade: "código 0/1 em texto", soma: nao}
      - {coluna: "rpi*, rei* (ex.: rpi41b01)", o_que: "concordância entre os dois avaliadores: '1' = Identical codes, '0' = Different Codes (pelo dicionário)", unidade: "código 0/1 em texto", soma: nao}
    filtros_tipicos: ["pirls_type = 'Normal' (222.113 linhas, 65 países) ou 'Bridge' (21.578, 26 países): gotcha amostra_ponte", "grade_id = '4' (161.136), '5' (80.786), '6' (1.769)", "item de interesse não nulo: cada item é preenchido em só 5% das linhas (o aluno só responde parte dos itens do caderno)"]
    use_para: "medir concordância entre avaliadores por item e país (confiabilidade da correção)."
    nao_use_para: "notas ou proficiência (estão em student_achievement); contar alunos do país (é subconjunto recodificado)."
    rascunho: [use_para, nao_use_para]
    verificado: "243.691 linhas = 243.691 (country_id, student_id) distintos; 1.057 colunas; dicionário traz 2.460 códigos desta tabela; 243.691 = linhas de student_achievement com reliability_coding_status — medido 2026-10-28"
