# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_ms_sinan_esquistossomose
tabelas:
  microdados_esquistossomose:
    grao: "uma notificação individual de esquistossomose (ficha SINAN), sem identificador do caso"
    chave: "nenhuma: sem identificador; 169.721 linhas, 169.258 distintas (463 repetidas)"
    tempo: {natureza: serie_diaria, coluna: "DT_NOTIFIC (ano em NU_ANO e ano_sinan, iguais em todas as linhas)", cobertura: "2007–2026 (2026 até 2026-05-25)"}
    territorio: {nivel: municipio, colunas: {ID_MUNICIP: "município de notificação, 6 dígitos", ID_MN_RESI: "município de residência", SG_UF: "UF de residência (código numérico)", SG_UF_NOT: "UF da notificação"}}
    medidas:
      - {expressao: "count(*)", o_que: "notificações", unidade: "notificações", soma: sim}
    filtros_tipicos:
      - "ano_sinan = <ano>"
      - "FORMA = '1' intestinal (79.577), '2' hepatointestinal, '3' hepatoesplênica, '4' aguda, '5' outra; vazio em 74.754"
      - "EVOLUCAO = '1' cura (102.845), '2' não cura, '3' óbito por esquistossomose (1.291), '4' óbito por outras causas, '9' ignorado"
      - "TPAUTOCTO = '1' sim, '2' não, '3' indeterminado (autóctone do município de residência)"
    use_para: "casos de esquistossomose por município, forma clínica e evolução."
    nao_use_para: "incidência sem denominador; os anos 2007–2011 concentram mais de 60% das notificações (cobertura desigual)."
    rascunho: [use_para, nao_use_para]
    verificado: "169.721 linhas; 169.258 distintas (hash da linha); ano_sinan = NU_ANO em todas — medido 2026-10-27"
