# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_cgu_novo_bolsa_familia
tabelas:
  pagamento:
    grao: "uma parcela do Novo Bolsa Família paga a um favorecido num mês de pagamento (ano_mes), com o mês de competência e o de referência da parcela"
    chave: "nenhuma: em ano_mes = '202403', 20.534.090 linhas para 20.508.639 pares (favorecido_id, mes_referencia), ~25 mil linhas repetidas (0,12%)"
    tempo: {natureza: serie_mensal, coluna: ano_mes, cobertura: "202303–202608 (texto AAAAMM; 42 meses)"}
    territorio: {nivel: municipio, colunas: {uf: "UF", codigo_municipio_siafi: "código SIAFI de 4 dígitos, não é IBGE", nome_municipio: "nome do município"}}
    medidas:
      - {coluna: valor_parcela, o_que: "valor da parcela paga", unidade: "R$", soma: sim}
      - {expressao: "count(*)", o_que: "parcelas pagas (um favorecido pode ter mais de uma por mês)", unidade: "parcelas", soma: sim}
    filtros_tipicos: ["ano_mes = '202403': texto AAAAMM; a tabela tem 840 milhões de linhas, filtre sempre o mês", "mes_referencia = mes_competencia = ano_mes na maioria; em 202403, 163.301 linhas (0,8%) têm mes_referencia anterior (parcelas retroativas) e mes_competencia sempre igual a ano_mes"]
    use_para: "somar pagamentos e contar parcelas por mês, UF ou município (gotcha agregue_pela_pagamento: sem nome/CPF/NIS vá direto aqui)."
    nao_use_para: "contar famílias com count(DISTINCT favorecido_id) como se fosse pessoa: o mesmo NIS pode ter mais de um favorecido_id; e o NIS/CPF/nome está em favorecido."
    rascunho: [use_para, nao_use_para]
    verificado: "840.156.267 linhas, 42 meses; em 202403: 20.534.090 linhas, 20.345.412 favorecido_id distintos, R$ 13.399.004.244 (bate com o gotcha diverge_da_copia_cgu), mes_competencia = ano_mes em todas — medido 2026-10-27"
  favorecido:
    grao: "um trio (NIS, CPF, nome) de beneficiário, com identificador inteiro favorecido_id"
    chave: "favorecido_id"
    tempo: {natureza: sem_tempo}
    territorio: {nivel: nenhum}
    filtros_tipicos: ["regexp_full_match(cpf_favorecido, '[0-9]{11}'): só CPFs completos (gotcha cpf_completado); cpf_favorecido é nulo em ~22% na amostra do perfil"]
    use_para: "obter NIS, CPF e nome de uma parcela, ligando por favorecido_id."
    nao_use_para: "contar beneficiários pelo número de linhas: um NIS pode ter vários trios."
    rascunho: [use_para, nao_use_para]
    verificado: "30.065.885 linhas = 30.065.885 favorecido_id distintos — medido 2026-10-27"
  novo_bolsa_familia:
    grao: "uma parcela paga num mês (view: pagamento JOIN favorecido, com NIS, CPF e nome)"
    chave: "mesma de pagamento: nenhuma"
    tempo: {natureza: serie_mensal, coluna: ano_mes, cobertura: "202303–202608 (texto AAAAMM)"}
    territorio: {nivel: municipio, colunas: {uf: "UF", codigo_municipio_siafi: "código SIAFI de 4 dígitos", nome_municipio: "nome"}}
    medidas:
      - {coluna: valor_parcela, o_que: "valor da parcela", unidade: "R$", soma: sim}
    filtros_tipicos: ["ano_mes = '202403': texto AAAAMM; a view junta 840 milhões de linhas, filtre o mês"]
    use_para: "consultas que precisam do NIS, CPF ou nome junto da parcela."
    nao_use_para: "somas e contagens sem pessoa: use pagamento, 3–7x mais barato (gotcha agregue_pela_pagamento); e não compare o total com br_cgu_beneficios_cidadao sem citar a fonte (gotcha diverge_da_copia_cgu)."
    rascunho: [use_para, nao_use_para]
    verificado: "ano_mes é VARCHAR; as linhas são as de pagamento (840.156.267) — o perfil mostra 0 por ser view — medido 2026-10-27"
