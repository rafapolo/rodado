# Cartão das tabelas: o que é uma linha, o que se soma e para que serve. Rascunho gerado por
# agente e conferido por medição no beelink; os campos `rascunho` não foram medidos.
dataset: br_mme_consumo_energia_eletrica
tabelas:
  uf:
    grao: "uma UF × mês × classe de consumo (tipo_consumo)"
    chave: "ano, mes, sigla_uf, tipo_consumo (38880 linhas = 38880 distintos)"
    tempo: {natureza: serie_mensal, coluna: "ano, mes", cobertura: "2004-01–2023-12"}
    territorio: {nivel: uf, colunas: {sigla_uf: "UF (27)"}}
    medidas:
      - {coluna: consumo, o_que: "energia elétrica consumida no mês; unidade não documentada na tabela (a soma de 2023 é 531 milhões, compatível com MWh)", unidade: "MWh (inferido, rascunho)", soma: sim}
      - {coluna: numero_consumidores, o_que: "consumidores da classe; nulo (33%) para Total e Cativo", unidade: "unidades consumidoras", soma: nao}
    filtros_tipicos: ["tipo_consumo = 'Total' para o consumo total; Total = Comercial + Industrial + Residencial + Outros em todas as 6480 combinações UF-mês", "'Cativo' é um recorte à parte (consumo no mercado cativo, subconjunto do total): NÃO some com as outras classes (Total + Cativo ou todas as seis dobra a conta)", "numero_consumidores só existe para Comercial, Industrial, Residencial e Outros; soma de meses de consumidores não é cabível (é estoque mensal)"]
    use_para: "série de consumo de eletricidade por UF e classe, 2004–2023"
    nao_use_para: "somar todas as classes juntas; somar numero_consumidores entre meses; dados após 2023"
    rascunho: [unidade de consumo, use_para, nao_use_para]
    verificado: "38880 linhas, 38880 distintos (ano, mes, sigla_uf, tipo_consumo); 6480 combinações ano-mes-UF com Total = soma das 4 classes (diferença ≤ 10) e 0 com Total = soma das 5; consumo Total 2023 = 531012496 — medido 2026-10-27"
