    expr: lpad(cnpj_estabelecimento, 14, '0') = e.cnpj
    verified: 'todos os 5.059 CNPJs reais casaram (100,000%) contra o snapshot
      2025-09 de br_me_cnpj.estabelecimentos; o único valor não casado é a string
