  - table: global_icij_offshoreleaks.entities
    column: name
    description: no CNPJ/CPF in any of the 6 ICIJ tables (entities, officers,
      intermediaries, addresses, relationships, other) — just name, address
      and country in free text. For entities (shell company), normalized
      name (upper + strip_accents) matches cleanly against
      br_me_cnpj.empresas.razao_social — shell-company names are
      distinctive enough not to collide (max 2 CNPJ per matched ICIJ name
      in 292 matches). The SAME technique fails for officers (pessoa
      física, see rejected below) — common 2-3 word person names collide
      across hundreds of unrelated socios.
    expr: upper(strip_accents(trim(name))) = upper(strip_accents(trim(e.razao_social)))
    verified: 292 distinct CNPJs matched of 1.532 ICIJ entities tagged
      Brazil (2025-09 snapshot) — 290 of 292 (99%) carry
      natureza_juridica '2216' "Empresa Domiciliada no Exterior" (foreign
      entity holding a registrable asset — property/aircraft — in
      Brazil); 191 still Ativa. Found answering tema 48, T48-2, 2026-08-25.
    concept: cnpj
    join_expr: upper(strip_accents(trim({s}.name))) = upper(strip_accents(trim({d}.razao_social)))
    rejected:
    - column: officers.name
      reason: no CPF exposed by ICIJ — matching pessoa física names
        against br_me_cnpj.socios.nome produces high volume (2.293 of
        4.025 names matched) but with massive collision on common names
        (e.g. "ROBERTO RESTUM" matches 944 distinct socio rows) —
        unreliable for beneficial-owner identification without a second
        key (CPF, birth date) ICIJ doesn't provide. Same class of trap as
        the general common-name false_friend already documented.
