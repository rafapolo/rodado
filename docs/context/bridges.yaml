      11 dígitos de CPF alinhados à direita num campo de 14 (`00087978997120` é o
      CPF 87978997120). Juntar sem filtrar `tipo_pessoa` joga 22,8M linhas de
      pessoa física contra a base de CNPJ. Um terço das linhas de PJ traz
      `cpf_cnpj` vazio e identifica o estabelecimento só por `cnpj_mantenedora`'
