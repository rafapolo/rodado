# column_codes.yaml — o significado dos códigos de colunas que nenhuma outra
# fonte do projeto decodificava.
#
# Estágio 4 de tasks/generate-full-schema-dict.md (pesquisa manual), rodado
# em 2026-09-25 sobre o topo do ranking de uso real de
# docs/context/schema_dict_prioridade.json (estágio 3). Escrito à mão, como
# bridges.yaml: é a fonte. schema_dict_status.json é o gerado.
#
# Cada entrada cobre uma ou mais colunas de UMA tabela e tem um `status`:
#   documentado    o significado dos valores foi conferido numa fonte oficial
#                  (URL em `fontes`) E os valores medidos no beelink batem com
#                  ela. Vira `documentado_em_outro_lugar` em schema_dict_status.
#   padrao_externo a coluna é um código de padrão público (UF/município IBGE,
#                  CID-10, natureza jurídica CONCLA...), conferido por join
#                  medido contra a tabela de referência do espelho.
#   nao_e_codigo   os valores medidos são rótulo por extenso, nome, texto livre,
#                  ano ou número: não há código a decodificar. A maioria veio do
#                  estágio 1 como "tabela grande, cardinalidade adiada".
#   pendente       pesquisado e NÃO confirmado. Continua `nao_verificado`; a
#                  `nota` diz o que se sabe e o que falta. Nunca promover a
#                  documentado sem fonte.
#
# `verificado` é o que casou no beelink, com data — mesma regra de bridges.yaml:
# sem isso a linha é aspiracional. Valores fora do dicionário oficial ficam
# registrados em `nota`, não escondidos.
#
# Depois de editar: python3 scripts/aplica_column_codes.py (reescreve os labels
# em schema_dict_status.json) e python3 scripts/prioriza_schema_dict_status.py.
# describe_table (mcp/mcp_server.py) lê este arquivo direto e devolve o decode
# no bloco `column_codes`.

fontes:
  sinan_violencia_v5:
    titulo: "Dicionário de dados SINAN NET v5 — Violência interpessoal/autoprovocada (MS/SVS, revisado jun/2015)"
    url: http://portalsinan.saude.gov.br/images/documentos/Agravos/via/DIC_DADOS_NET_Violencias_v5.pdf
    consultado: 2026-09-25
  sinan_violencia_5_0_naovigente:
    titulo: "Dicionário de dados SINAN — Violência doméstica, sexual e/ou outras violências, versão 5.0 não vigente (MS/SVS)"
    url: http://www.portalsinan.saude.gov.br/images/documentos/Agravos/Violencia/DIC_DADOS_violencias_5_0_naovigente.pdf
    consultado: 2026-09-25
  sinan_malaria_v5:
    titulo: "Dicionário de dados SINAN NET v5 — Malária (MS/SVS, revisado jul/2010)"
    url: http://portalsinan.saude.gov.br/images/documentos/Agravos/Malaria/DIC_DADOS_Malaria_v5.pdf
    consultado: 2026-09-25
  sinan_esquistossomose_v5:
    titulo: "Dicionário de dados SINAN NET v5 — Esquistossomose (MS/SVS, revisado mar/2012)"
    url: http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf
    consultado: 2026-09-25
  sim_estrutura:
    titulo: "Estrutura do SIM — Mortalidade Geral (DATASUS; deriva de Estrutura_SIM_para_CD.DBF)"
    url: https://diaad.s3.sa-east-1.amazonaws.com/sim/Mortalidade_Geral+-+Estrutura.pdf
    consultado: 2026-09-25
  lei_4320:
    titulo: "Lei 4.320/1964, arts. 58–65 e 36 — estágios da despesa (empenho, liquidação, pagamento) e restos a pagar"
    url: https://www.planalto.gov.br/ccivil_03/leis/l4320.htm
    consultado: 2026-09-25
  espelho:
    titulo: "Tabela de referência do próprio espelho, conferida por join medido no beelink"
    url: https://basedosdados.org
    consultado: 2026-09-25

