entradas:

  # --- SINAN Violência -------------------------------------------------------
  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [AG_AMEACA, AG_CORTE, AG_ENFOR, AG_ENVEN, AG_FOGO, AG_FORCA, AG_OBJETO,
              AG_OUTROS, AG_QUENTE, ASSIST_SOC, AUTOR_ALCO, CONS_IDO, CONS_TUTEL,
              DEFEN_PUBL, DELEG, DELEG_CRIA, DELEG_IDOS, DIR_HUMAN, INFAN_JUV, MPU,
              REDE_EDUCA, REL_CONHEC, REL_CONJ, REL_CUIDA, REL_DESCO, REL_EXCON,
              REL_EXNAM, REL_FILHO, REL_INST, REL_MAD, REL_MAE, REL_NAMO, REL_OUTROS,
              REL_PAD, REL_PAI, REL_PATRAO, REL_POL, REL_PROPRI, REL_TRAB, VIOL_FINAN,
              VIOL_FISIC, VIOL_INFAN, VIOL_LEGAL, VIOL_NEGLI, VIOL_OUTR, VIOL_PSICO,
              VIOL_SEXU, VIOL_TORT, VIOL_TRAF, OUT_VEZES]
    status: documentado
    significado: "Campo sim/não da ficha: tipo de violência (VIOL_*), meio de agressão (AG_*), relação do provável autor com a vítima (REL_*), encaminhamento (DELEG*, CONS_*, MPU...), suspeita de álcool do autor (AUTOR_ALCO), violência de repetição (OUT_VEZES)"
    valores: {"1": Sim, "2": Não, "9": Ignorado, "": não preenchido}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: valores distintos medidos coluna a coluna ⊆ {'',1,2,9} (+ '0' em OUT_VEZES/VIOL_OUTR e '.' em REL_PAI); cada DBF achado no dicionário com as categorias 1/2/9. VIOL_FISIC: 2.705.730 sim, 2.103.796 não, 54.477 ignorado, 75.263 vazio de 4.939.266"
    nota: "Contar 'sim' é = '1', nunca soma da coluna. '0' (OUT_VEZES, VIOL_OUTR) e '.' (REL_PAI) não existem no dicionário: tratar como não preenchido."

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [DEF_AUDITI, DEF_FISICA, DEF_MENTAL, DEF_OUT, DEF_VISUAL, DEF_TRANS,
              TRAN_COMP, TRAN_MENT, PROC_ABORT, PROC_CONTR, PROC_DST, PROC_HEPB,
              PROC_HIV, PROC_SANG, PROC_SEMEN, PROC_VAGIN, REL_CAT, SEX_ESTUPR,
              SEX_EXPLO, SEX_OUTRO, SEX_PORNO, LES_AUTOP]
    status: documentado
    significado: "Campo sim/não com 'não se aplica': deficiência/transtorno (DEF_*, TRAN_*), procedimento após violência sexual (PROC_*), tipo de violência sexual (SEX_*), emissão de CAT (REL_CAT), lesão autoprovocada (LES_AUTOP)"
    valores: {"1": Sim, "2": Não, "8": Não se aplica, "9": Ignorado, "": não preenchido}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: valores medidos ⊆ {'',1,2,8,9} (LES_AUTOP tem 1 linha '0'). LES_AUTOP: 1.304.571 sim, 3.275.066 não, 269.797 ignorado, 89.831 vazio"
    nota: "DEF_TRANS no dicionário v5 lista só 1/2/9; o 8 aparece no dado (versão anterior da ficha). SEX_* com 8 = a violência não foi sexual."

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [TP_NOT]
    status: documentado
    significado: Tipo de notificação
    valores: {"1": Negativa, "2": Individual, "3": Surto, "4": Agregado}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: um valor só, '2' (individual), em 4.939.266 linhas — coluna constante, não filtra nada"

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [ID_AGRAVO]
    status: padrao_externo
    significado: "Agravo notificado, código CID-10 sem ponto. Y09 = agressão por meios não especificados, o código do agravo violência interpessoal/autoprovocada"
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: um valor só, 'Y09', em 4.939.266 linhas — coluna constante"

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [CS_SEXO]
    status: documentado
    significado: Sexo da vítima
    valores: {M: Masculino, F: Feminino, I: Ignorado}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: F 3.505.452, M 1.432.147, I 1.666, vazio 1"
    nota: "Letras, não 1/2 como em SIM/SINASC — ver bridges.yaml coded_differently.sexo."

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [CS_RACA]
    status: documentado
    significado: Raça/cor declarada
    valores: {"1": Branca, "2": Preta, "3": Amarela, "4": Parda, "5": Indígena, "9": Ignorado}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: 4 parda 2.065.124, 1 branca 1.933.108, 2 preta 413.804, 9 ignorado 398.514, 5 indígena 45.410, 3 amarela 41.332, vazio 41.974"

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [CS_GESTANT]
    status: documentado
    significado: Gestante (idade gestacional)
    valores: {"1": 1º trimestre, "2": 2º trimestre, "3": 3º trimestre, "4": Idade gestacional ignorada, "5": Não, "6": Não se aplica, "9": Ignorado}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: valores medidos {'',1,2,3,4,5,6,8,9}"
    nota: "O dicionário v5 está truncado no PDF para o código 5 (lê 'Não preenchido'); o padrão SINAN é 5 = Não. O 8 aparece no dado e não está no dicionário."

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [SIT_CONJUG]
    status: documentado
    significado: Situação conjugal da vítima
    valores: {"1": Solteiro, "2": Casado/União consensual, "3": Viúvo, "4": Separado, "8": Não se aplica, "9": Ignorado}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: valores medidos {'',1,2,3,4,8,9}"

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [ORIENT_SEX]
    status: documentado
    significado: Orientação sexual da vítima (obrigatório a partir de 10 anos)
    valores: {"1": Heterossexual, "2": Homossexual (gay/lésbica), "3": Bissexual, "8": Não se aplica, "9": Ignorado}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: valores medidos {'',1,2,3,8,9}"

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [IDENT_GEN]
    status: documentado
    significado: Identidade de gênero da vítima
    valores: {"1": Travesti, "2": Transexual mulher, "3": Transexual homem, "8": Não se aplica, "9": Ignorado}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: valores medidos {'',1,2,3,5,8,9}"
    nota: "O código 5 aparece no dado e não está no dicionário v5 — não interpretar."

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [LOCAL_OCOR]
    status: documentado
    significado: Local de ocorrência
    valores: {"01": Residência, "02": Habitação coletiva, "03": Escola, "04": Local de prática esportiva, "05": Bar ou similar, "06": Via pública, "07": Comércio/Serviços, "08": Indústrias/construção, "09": Outro, "99": Ignorado}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: valores medidos {'',01..09,1,99}"
    nota: "Há '1' sem zero à esquerda misturado com '01': filtrar residência com IN ('01','1')."

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [AUTOR_SEXO]
    status: documentado
    significado: Sexo do provável autor da agressão
    valores: {"1": Masculino, "2": Feminino, "3": Ambos os sexos, "9": Ignorado}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: valores medidos {'',1,2,3,4,5,9}"
    nota: "4 e 5 aparecem no dado e não estão no dicionário v5. Aqui o sexo é NÚMERO (1/2); em CS_SEXO, da vítima, é LETRA (M/F)."

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [VIOL_MOTIV]
    status: documentado
    significado: Violência motivada por
    valores: {"01": Sexismo, "02": Homofobia/Lesbofobia/Bifobia/Transfobia, "03": Racismo, "04": Intolerância religiosa, "05": Xenofobia, "06": Conflito geracional, "07": Situação de rua, "08": Deficiência, "09": Outros, "88": Não se aplica, "99": Ignorado}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: valores medidos {'',01..09,4,7,88,99}"
    nota: "Há '4' e '7' sem zero à esquerda misturados com '04'/'07': filtrar com IN ('04','4')."

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [CICL_VID]
    status: documentado
    significado: "Ciclo de vida do provável autor da agressão (DBF CICL_VID_AUTOR no dicionário, truncado para 8 caracteres no arquivo)"
    valores: {"1": Criança, "2": Adolescente, "3": Jovem, "4": Pessoa adulta, "5": Pessoa idosa, "9": Ignorado}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: valores medidos {'',1,2,3,4,5,9}, idênticos às categorias do dicionário"
    nota: "É do AUTOR, não da vítima — o nome da coluna não diz."

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [SG_UF_NOT, SG_UF, SG_UF_OCOR]
    status: padrao_externo
    significado: "UF de notificação / de residência / de ocorrência, código IBGE de 2 dígitos (11..53), não sigla"
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: 27 códigos distintos de 11 a 53 (SG_UF e SG_UF_OCOR com vazio). Junta com br_bd_diretorios_brasil.uf.id_uf"

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [REL_SEXUAL]
    status: pendente
    nota: "Valores {'',1,2,3,8,9}, preenchido só de 2009 a ~2021 (4.242.249 vazios de 4.939.266). Não está no dicionário v5 vigente nem no 5.0 não vigente: é campo de ficha anterior. Significado dos códigos NÃO confirmado — não usar sem o dicionário da ficha 2009–2014."

  - tabela: br_ms_sinan_violencia.microdados_violencia
    colunas: [ATEND_MULH, CONS_COMP, CONS_ESTRE, CONS_GRAV, CONS_MENT, CONS_OUTR,
              CONS_SUIC, CONS_ABORT, CONS_DST, DELEG_MULH, ENC_ABRIGO, ENC_CREAS, ENC_DEAM,
              ENC_DELEG, ENC_DPCA, ENC_IML, ENC_MPU, ENC_MULHER, ENC_OUTR, ENC_SENTIN,
              ENC_TUTELA, ENC_VARA, PEN_ANAL, PEN_ORAL, PEN_VAGINA, REDE_SAU, REL_IRMAO,
              SEX_PUDOR, SEX_ASSEDI]
    status: pendente
    nota: "Valores medidos parecem sim/não ({'',1,2,9} ou {'',1,2,8,9}; CONS_ABORT/CONS_DST/SEX_ASSEDI trazem também letras N/O/F/M), mas o DBF não aparece no dicionário v5 vigente nem no 5.0 não vigente — são campos de versões antigas da ficha. Plausível 1=Sim/2=Não/9=Ignorado, não confirmado."

  # --- SINAN Malária ---------------------------------------------------------
  - tabela: br_ms_sinan_malaria.microdados_malaria
    colunas: [CLASSI_FIN]
    status: documentado
    significado: Classificação final do caso
    valores: {"1": Confirmado, "2": Descartado}
    fonte: sinan_malaria_v5
    verificado: "2026-09-25: 2 descartado 35.347, 1 confirmado 10.591, 8 → 610, vazio 9.746, NULL 12.026 (de 68.320)"
    nota: "O código 8 (610 linhas) não está no dicionário. A maioria das notificações de malária fora da Amazônia Legal é DESCARTADA: contar casos exige CLASSI_FIN = '1'."

  - tabela: br_ms_sinan_malaria.microdados_malaria
    colunas: [TPAUTOCTO]
    status: documentado
    significado: O caso é autóctone do município de residência?
    valores: {"1": Sim, "2": Não, "3": Indeterminado}
    fonte: sinan_malaria_v5
    verificado: "2026-09-25: 2 → 13.056, 1 → 3.287, 3 → 1.283, vazio 38.668, NULL 12.026"

  - tabela: br_ms_sinan_malaria.microdados_malaria
    colunas: [RESULT]
    status: documentado
    significado: "Resultado do exame parasitológico (espécie/forma do plasmódio, notação do dicionário)"
    valores: {"1": Negativo, "2": F, "3": F + FG, "4": V, "5": F + V, "6": V + FG, "7": FG, "8": M, "9": F + M, "10": O}
    fonte: sinan_malaria_v5
    verificado: "2026-09-25: 1 → 44.880, 4 → 13.593, 2 → 4.550, 5 → 635, 3 → 425, 6 → 235, 10 → 118, 8 → 87, 7 → 72, 9 → 23, vazio 3.702"
    nota: "O dicionário usa as siglas sem expandir. Na notação corrente da vigilância de malária F = P. falciparum, V = P. vivax, M = P. malariae, FG = gametócitos de falciparum, O = P. ovale — expansão não escrita nesta fonte. O rótulo do 10 está cortado no PDF ('10 - O')."

  - tabela: br_ms_sinan_malaria.microdados_malaria
    colunas: [COUFINF]
    status: padrao_externo
    significado: "UF provável da fonte de infecção — aqui como SIGLA (AC, AM, PA...), não código IBGE"
    fonte: sinan_malaria_v5
    verificado: "2026-09-25: 28 valores distintos, todos siglas (RO 2.840, AM 1.894, PA 1.588...), vazio 44.658, NULL 12.026"
    nota: "Diverge do mesmo campo em br_ms_sinan_esquistossomose, que guarda o código IBGE numérico (11..53). Juntar as duas pelo COUFINF sem converter devolve zero."

