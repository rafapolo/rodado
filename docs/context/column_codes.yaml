    colunas: [estagio, estagio_bd]
    status: documentado
    significado: "Estágio da despesa. Empenhada ⊇ liquidada ⊇ paga são o MESMO gasto em fases sucessivas; restos a pagar são inscrições à parte. Somar estágios conta o mesmo real duas ou três vezes."
    valores: {Despesas Empenhadas: empenho, Despesas Liquidadas: liquidação, Despesas Pagas: pagamento, "Inscrição de Restos a Pagar Processados": liquidado não pago, "Inscrição de Restos a Pagar Não Processados": empenhado não liquidado}
    fonte: lei_4320
    verificado: "2026-09-25: estagio_bd preenchido 1996–2025; de 1996 a 2012 só existe 'Despesas Empenhadas', os 5 estágios só a partir de 2013. estagio vem NULL antes de 2013 (8.690.188 linhas) e com nome curto ('Inscrição de RP Processados') em parte dos anos"
    nota: "Usar estagio_bd (harmonizado), não estagio. Série histórica comparável só em 'Despesas Empenhadas'. 285.416 linhas de 2004–2010 têm estagio_bd NULL."

  - tabela: br_me_siconfi.municipio_despesas_orcamentarias
    colunas: [estagio, estagio_bd]
    status: documentado
    significado: "Estágio da despesa, mesma semântica de municipio_despesas_funcao: não somar estágios"
    valores: {Despesas Empenhadas: empenho, Despesas Liquidadas: liquidação, Despesas Pagas: pagamento, "Inscrição de Restos a Pagar Processados": liquidado não pago, "Inscrição de Restos a Pagar Não Processados": empenhado não liquidado}
    fonte: lei_4320
    verificado: "2026-09-25: Empenhadas 12.034.369 linhas (estagio preenchido em só 6.435.085), Liquidadas 6.430.233, Pagas 6.395.144"
    nota: "Usar estagio_bd."

  - tabela: br_me_siconfi.municipio_receitas_orcamentarias
    colunas: [estagio, estagio_bd]
    status: documentado
    significado: "Estágio da receita: bruta realizada e deduções (FUNDEB, transferências constitucionais, outras) em linhas separadas. Receita líquida = brutas − deduções; somar tudo mistura sinal"
    valores: {Receitas Brutas Realizadas: receita arrecadada bruta, "Deduções - FUNDEB": retenção para o FUNDEB, "Deduções - Transferências Constitucionais": repasse constitucional deduzido, Outras Deduções da Receita: demais deduções}
    fonte: lei_4320
    verificado: "2026-09-25: Brutas 1989–2025 (18.008.034 linhas; estagio preenchido em 5.923.389); deduções só de 2013/2014 em diante. estagio antigo usa 'Receitas Realizadas' e 'Deduções da Receita' onde estagio_bd diz 'Receitas Brutas Realizadas' e 'Outras Deduções da Receita'"
    nota: "Usar estagio_bd. Deduções vêm com valor POSITIVO (2022: FUNDEB R$ 525 bi, outras R$ 40 bi): subtrair, não somar. Antes de 2013 não há dedução separada: comparar série longa só por 'Receitas Brutas Realizadas'. Somar todas as linhas de um estágio também empilha os níveis de `conta` (2022: R$ 8,4 tri em brutas, contra ordem de grandeza de ~R$ 1 tri de receita municipal): filtrar a conta de total."

