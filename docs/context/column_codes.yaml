              VIOL_SEXU, VIOL_TORT, VIOL_TRAF, OUT_VEZES]
    status: documentado
    significado: "Campo sim/não da ficha: tipo de violência (VIOL_*), meio de agressão (AG_*), relação do provável autor com a vítima (REL_*), encaminhamento (DELEG*, CONS_*, MPU...), suspeita de álcool do autor (AUTOR_ALCO), violência de repetição (OUT_VEZES)"
    valores: {"1": Sim, "2": Não, "9": Ignorado, "": não preenchido}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: valores distintos medidos coluna a coluna ⊆ {'',1,2,9} (+ '0' em OUT_VEZES/VIOL_OUTR e '.' em REL_PAI); cada DBF achado no dicionário com as categorias 1/2/9. VIOL_FISIC: 2.705.730 sim, 2.103.796 não, 54.477 ignorado, 75.263 vazio de 4.939.266"
    nota: "Contar 'sim' é = '1', nunca soma da coluna. '0' (OUT_VEZES, VIOL_OUTR) e '.' (REL_PAI) não existem no dicionário: tratar como não preenchido."

