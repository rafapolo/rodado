              PROC_HIV, PROC_SANG, PROC_SEMEN, PROC_VAGIN, REL_CAT, SEX_ESTUPR,
              SEX_EXPLO, SEX_OUTRO, SEX_PORNO, LES_AUTOP]
    status: documentado
    significado: "Campo sim/não com 'não se aplica': deficiência/transtorno (DEF_*, TRAN_*), procedimento após violência sexual (PROC_*), tipo de violência sexual (SEX_*), emissão de CAT (REL_CAT), lesão autoprovocada (LES_AUTOP)"
    valores: {"1": Sim, "2": Não, "8": Não se aplica, "9": Ignorado, "": não preenchido}
    fonte: sinan_violencia_v5
    verificado: "2026-09-25: valores medidos ⊆ {'',1,2,8,9} (LES_AUTOP tem 1 linha '0'). LES_AUTOP: 1.304.571 sim, 3.275.066 não, 269.797 ignorado, 89.831 vazio"
    nota: "DEF_TRANS no dicionário v5 lista só 1/2/9; o 8 aparece no dado (versão anterior da ficha). SEX_* com 8 = a violência não foi sexual."

  - tabela: br_ms_sinan_violencia.microdados_violencia
