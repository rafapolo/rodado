    nota: "O dicionário usa as siglas sem expandir. Na notação corrente da vigilância de malária F = P. falciparum, V = P. vivax, M = P. malariae, FG = gametócitos de falciparum, O = P. ovale — expansão não escrita nesta fonte. O rótulo do 10 está cortado no PDF ('10 - O')."

