<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Brasil — Salário Médio RAIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
  <link rel="stylesheet" href="atlas.css">
  <script src="https://unpkg.com/deck.gl@8.9.33/dist.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="atlas.js"></script>
  <style>
    #control-panel { max-height: min(480px, calc(100vh - 80px)); }
    .filter-item .color-dot { width: 12px; height: 12px; border-radius: 3px; }
  </style>
</head>
<body>

<nav id="atlas-nav">
  <span style="color:var(--text-muted)">Salário Médio RAIS</span>
  <span style="margin-left:auto;font-size:11px;color:var(--text-muted)">Vínculos formais 2020-2022</span>
</nav>

<div id="app">
  <div id="deckgl-overlay"></div>

  <!-- Control panel -->
  <div class="panel" id="control-panel">
    <div class="panel-header">
      <span class="panel-dot">⌖</span>
      <h2>Salário RAIS</h2>
    </div>
    <div class="panel-subtitle">Vínculos formais ativos por município</div>

    <div class="select-group">
      <label for="select-setor">Setor</label>
      <select id="select-setor">
        <option value="privado">Iniciativa Privada</option>
        <option value="publico">Setor Público</option>
        <option value="todos">Todos os Setores</option>
      </select>
    </div>

    <div class="select-group">
      <label for="select-ano">Ano</label>
      <select id="select-ano">
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
      </select>
    </div>

    <div style="margin-bottom:4px;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);">Métrica do mapa</div>
    <div class="metric-pills" id="metric-pills">
      <button class="metric-pill active" data-metric="salario_medio">Média (R$)</button>
      <button class="metric-pill" data-metric="salario_stddev">Desvio Padrão</button>
      <button class="metric-pill" data-metric="coef_variacao">Coef. Variação</button>
      <button class="metric-pill" data-metric="range_p75_p25">Range P75-P25</button>
    </div>
  </div>

  <!-- Stats panel -->
  <div class="panel" id="stats-panel">
    <div class="panel-header">
      <span class="panel-dot" style="color:var(--accent-blue);">◈</span>
      <h2>Brasil</h2>
    </div>
    <div id="stats-content">
      <div class="stat-row"><span class="stat-label">Média nacional</span><span class="stat-value" id="stat-media">—</span></div>
      <div class="stat-row"><span class="stat-label">Menor município</span><span class="stat-value" id="stat-menor">—</span></div>
      <div class="stat-row"><span class="stat-label">Maior município</span><span class="stat-value" id="stat-maior">—</span></div>
      <div class="stat-row" style="border-top:1px solid var(--border-item);margin-top:6px;padding-top:10px;">
        <span class="stat-label">Vínculos</span><span class="stat-value" id="stat-vinculos">—</span>
      </div>
      <div class="stat-row"><span class="stat-label">Municípios</span><span class="stat-value" id="stat-municipios">—</span></div>
    </div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip"></div>

  <!-- Legend -->
  <div id="legend"></div>

  <!-- Map actions -->
  <div id="map-actions">
    <button id="btn-reset" title="Resetar vista">⟲</button>
    <button id="btn-share" title="Compartilhar">⎘</button>
    <button id="btn-sql" title="Ver dados brutos">{ }</button>
  </div>
</div>

<!-- SQL Modal -->
<div class="modal-overlay" id="sql-modal">
  <div class="modal-content">
    <h3>Query DuckDB</h3>
    <pre><code id="sql-code"></code></pre>
    <button class="modal-close" onclick="document.getElementById('sql-modal').classList.remove('open')">Fechar</button>
  </div>
</div>

<!-- Mobile toggles -->
<button id="toggle-left">◀</button>
<button id="toggle-right">▶</button>

<!-- Loading -->
<div id="loading"><div class="loading-spinner"></div></div>

<script>
const VIZ_NUM = 28;

const SQL_TEMPLATE = `WITH salarios AS (
  SELECT id_municipio, sigla_uf, ano,
    CASE WHEN natureza_juridica NOT LIKE '1%' THEN 'privado' ELSE 'publico' END AS setor,
    valor_remuneracao_media
  FROM br_me_rais.microdados_vinculos
  WHERE ano BETWEEN 2020 AND 2022 AND vinculo_ativo_3112 = '1'
)
SELECT id_municipio, sigla_uf, ano, setor,
  ROUND(AVG(valor_remuneracao_media), 2) AS salario_medio,
  ROUND(STDDEV(valor_remuneracao_media), 2) AS salario_stddev,
  ROUND(PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY valor_remuneracao_media), 2) AS p25,
  ROUND(PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY valor_remuneracao_media), 2) AS p75,
  COUNT(*) AS n_vinculos
FROM salarios GROUP BY id_municipio, sigla_uf, ano, setor

UNION ALL

SELECT id_municipio, sigla_uf, ano, 'todos',
  ROUND(AVG(valor_remuneracao_media), 2),
  ROUND(STDDEV(valor_remuneracao_media), 2),
  ROUND(PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY valor_remuneracao_media), 2),
  ROUND(PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY valor_remuneracao_media), 2),
  COUNT(*)
FROM salarios GROUP BY id_municipio, sigla_uf, ano`;

const METRICS = {
  salario_medio: {
    label: 'Salário médio',
    palette: ATLAS.SEQUENTIAL_BLUE,
    format: ATLAS.fmtMoney,
    getValue: (d) => d.salario_medio,
  },
  salario_stddev: {
    label: 'Desvio padrão',
    palette: ATLAS.SEQUENTIAL_RED,
    format: ATLAS.fmtMoney,
    getValue: (d) => d.salario_stddev,
  },
  coef_variacao: {
    label: 'Coef. variação',
    palette: ATLAS.SEQUENTIAL_RED,
    format: (v) => ATLAS.fmtNum(v, 3),
    getValue: (d) => (d.salario_medio && d.salario_medio > 0) ? d.salario_stddev / d.salario_medio : null,
  },
  range_p75_p25: {
    label: 'Range P75-P25',
    palette: ATLAS.SEQUENTIAL_RED,
    format: ATLAS.fmtMoney,
    getValue: (d) => (d.p75 != null && d.p25 != null) ? d.p75 - d.p25 : null,
  },
};

let mapInstance, deckInstance;
let geoData = null;       // raw GeoJSON
let salaryLookup = null;  // Map<id_municipio, { ano: { setor: {...} } }>
let choroplethLayer = null;
let currentState = { ano: '2022', setor: 'privado', metrica: 'salario_medio' };

function getActiveSql() {
  return SQL_TEMPLATE;
}

function getShareState() {
  return currentState;
}

function buildLookup(salarios) {
  const map = {};
  for (const [ano, setores] of Object.entries(salarios)) {
    for (const [setor, entries] of Object.entries(setores)) {
      for (const e of entries) {
        if (!map[e.id_municipio]) map[e.id_municipio] = {};
        if (!map[e.id_municipio][ano]) map[e.id_municipio][ano] = {};
        map[e.id_municipio][ano][setor] = e;
      }
    }
  }
  return map;
}

function updateMap() {
  if (!geoData || !salaryLookup) return;

  const { ano, setor, metrica } = currentState;
  const metricDef = METRICS[metrica];
  const features = [];
  const values = [];

  for (const f of geoData.features) {
    const id = f.properties.id_municipio;
    const data = salaryLookup[id]?.[ano]?.[setor];
    if (!data) {
      features.push({
        type: 'Feature',
        geometry: f.geometry,
        properties: { id_municipio: id, _noData: true },
      });
      continue;
    }
    const val = metricDef.getValue(data);
    if (val != null) values.push(val);
    features.push({
      type: 'Feature',
      geometry: f.geometry,
      properties: { ...data, _noData: false, _metricValue: val, _metricFormatted: metricDef.format(val) },
    });
  }

  const merged = { type: 'FeatureCollection', features };

  const colorScale = ATLAS.quantileScale(values, metricDef.palette);
  const getFillColor = (d) => {
    if (d.properties._noData) return [80, 80, 80, 80];
    return colorScale(d.properties._metricValue);
  };

  if (!choroplethLayer) {
    choroplethLayer = new deck.GeoJsonLayer({
      id: 'rais-choropleth',
      data: merged,
      pickable: true,
      stroked: true,
      filled: true,
      lineWidthMinPixels: 0.4,
      getFillColor,
      getLineColor: [255, 255, 255, 50],
      getLineWidth: 1,
      onHover: (info) => {
        if (ATLAS.isTouch) return;
        handleHover(info);
      },
      onClick: (info) => {
        if (ATLAS.isTouch) handleHover(info);
      },
      updateTriggers: {
        getFillColor: [ano, setor, metrica],
        data: [ano, setor, metrica],
      },
      transitions: { getFillColor: { duration: 200 } },
    });
    deckInstance.setProps({ layers: [choroplethLayer] });
  } else {
    choroplethLayer.setProps({
      data: merged,
      getFillColor,
      updateTriggers: {
        getFillColor: [ano, setor, metrica],
        data: [ano, setor, metrica],
      },
    });
    deckInstance.setProps({ layers: [choroplethLayer] });
  }

  updateLegend(values, metricDef);
  updateStats(values, merged);
}

function handleHover(info) {
  if (!info.object) {
    ATLAS.hideTooltip();
    return;
  }
  const p = info.object.properties;
  const { ano, setor, metrica } = currentState;
  const metricDef = METRICS[metrica];

  const nomeMun = window.municipioNome?.[p.id_municipio] || p.id_municipio;

  if (p._noData) {
    ATLAS.showTooltip(info.x, info.y, `
      <div class="tt-name">${nomeMun}</div>
      <div class="tt-detail" style="color:var(--text-muted);">Sem dados de vínculos formais</div>
    `);
    return;
  }

  const avgAll = ATLAS.fmtMoney(p.salario_medio);
  const stdAll = ATLAS.fmtMoney(p.salario_stddev);
  const p25v = ATLAS.fmtMoney(p.p25);
  const p75v = ATLAS.fmtMoney(p.p75);
  const cov = p.salario_medio ? (p.salario_stddev / p.salario_medio).toFixed(3) : '—';
  const rangeVal = (p.p75 != null && p.p25 != null) ? ATLAS.fmtMoney(p.p75 - p.p25) : '—';

  const compareHtml = buildComparisonHtml(p._metricValue, metrica);

  ATLAS.showTooltip(info.x, info.y, `
    <div class="tt-name">${nomeMun}</div>
    <div class="tt-uf">${p.sigla_uf || ''}</div>
    <div class="tt-metric">${metricDef.format(p._metricValue)}</div>
    <div class="tt-detail">
      Média: ${avgAll}<br>
      Desv. pad.: ${stdAll}<br>
      P25: ${p25v} &nbsp;|&nbsp; P75: ${p75v}<br>
      Coef. var.: ${cov} &nbsp;|&nbsp; Range: ${rangeVal}<br>
      Vínculos: ${ATLAS.fmtNum(p.n_vinculos, 0)}
    </div>
    ${compareHtml}
  `);
}

function buildComparisonHtml(val, metrica) {
  if (val == null) return '';
  const { ano, setor } = currentState;
  if (!salaryLookup) return '';

  const allValues = [];
  for (const years of Object.values(salaryLookup)) {
    const entry = years[ano]?.[setor];
    if (entry) {
      const v = METRICS[metrica].getValue(entry);
      if (v != null) allValues.push(v);
    }
  }
  if (allValues.length === 0) return '';
  const avg = allValues.reduce((s, v) => s + v, 0) / allValues.length;
  const diff = val - avg;
  const pct = avg > 0 ? (diff / avg) : 0;
  const cls = diff >= 0 ? 'above' : 'below';
  const sign = diff >= 0 ? '+' : '';
  return `<div class="tt-compare ${cls}">${sign}${(pct * 100).toFixed(1)}% ${diff >= 0 ? 'acima' : 'abaixo'} da média nacional</div>`;
}

function updateLegend(values, metricDef) {
  if (values.length === 0) {
    ATLAS.buildLegend({ type: 'gradient', title: metricDef.label, gradient: { from: '#fff', to: '#000', min: 0, max: 0 } });
    return;
  }
  values.sort((a, b) => a - b);
  const pal = metricDef.palette;
  const from = pal[0];
  const to = pal[pal.length - 1];
  const min = values[0];
  const max = values[values.length - 1];

  ATLAS.buildLegend({
    type: 'gradient',
    title: metricDef.label,
    unit: '',
    gradient: {
      from: `rgb(${from.join(',')})`,
      to: `rgb(${to.join(',')})`,
      min,
      max,
    },
  });
}

function updateStats(values, merged) {
  if (values.length === 0 || merged.features.length === 0) {
    document.getElementById('stat-media').textContent = '—';
    document.getElementById('stat-menor').textContent = '—';
    document.getElementById('stat-maior').textContent = '—';
    document.getElementById('stat-vinculos').textContent = '—';
    document.getElementById('stat-municipios').textContent = '—';
    return;
  }

  values.sort((a, b) => a - b);
  const metricDef = METRICS[currentState.metrica];
  const avg = values.reduce((s, v) => s + v, 0) / values.length;
  const min = values[0];
  const max = values[values.length - 1];

  let totalVinculos = 0;
  for (const f of merged.features) {
    totalVinculos += f.properties.n_vinculos || 0;
  }

  document.getElementById('stat-media').textContent = metricDef.format(avg);
  document.getElementById('stat-menor').textContent = metricDef.format(min);
  document.getElementById('stat-maior').textContent = metricDef.format(max);
  document.getElementById('stat-vinculos').textContent = ATLAS.fmtNum(totalVinculos, 0);
  document.getElementById('stat-municipios').textContent = ATLAS.fmtNum(values.length, 0);
}

function onFilterChange() {
  currentState.setor = document.getElementById('select-setor').value;
  currentState.ano = document.getElementById('select-ano').value;
  updateMap();
  updateUrlState();
}

function onMetricChange(metric) {
  currentState.metrica = metric;
  document.querySelectorAll('.metric-pill').forEach(el => {
    el.classList.toggle('active', el.dataset.metric === metric);
  });
  updateMap();
  updateUrlState();
}

function updateUrlState() {
  const params = new URLSearchParams(window.location.search);
  Object.entries(currentState).forEach(([k, v]) => params.set(k, v));
  const url = `${window.location.pathname}?${params}`;
  window.history.replaceState({}, '', url);
}

function applyUrlState() {
  const params = new URLSearchParams(window.location.search);
  if (params.has('ano')) {
    const v = params.get('ano');
    if (['2020', '2021', '2022'].includes(v)) {
      currentState.ano = v;
      document.getElementById('select-ano').value = v;
    }
  }
  if (params.has('setor')) {
    const v = params.get('setor');
    if (['privado', 'publico', 'todos'].includes(v)) {
      currentState.setor = v;
      document.getElementById('select-setor').value = v;
    }
  }
  if (params.has('metrica')) {
    const v = params.get('metrica');
    if (METRICS[v]) {
      currentState.metrica = v;
      document.querySelectorAll('.metric-pill').forEach(el => {
        el.classList.toggle('active', el.dataset.metric === v);
      });
    }
  }
}

(async () => {
  const { map, deck } = ATLAS.initMap('deckgl-overlay');
  mapInstance = map;
  deckInstance = deck;

  ATLAS.setupActions(map, VIZ_NUM, getShareState, getActiveSql);
  ATLAS.setupMobilePanels();

  // Event listeners
  document.getElementById('select-setor').addEventListener('change', onFilterChange);
  document.getElementById('select-ano').addEventListener('change', onFilterChange);
  document.querySelectorAll('.metric-pill').forEach(el => {
    el.addEventListener('click', () => onMetricChange(el.dataset.metric));
  });

  // Load data (relative to HTML file location)
  const [geojson, salarios, nomes] = await Promise.all([
    ATLAS.loadJSON('dados/municipios.geojson'),
    ATLAS.loadJSON('dados/salarios.json'),
    ATLAS.loadJSON('dados/id_municipio_nome.json'),
  ]);

  geoData = geojson;
  window.municipioNome = nomes; // lookup id_municipio → nome

  // Build lookup: Map<id, { ano: { setor: entry } }>
  salaryLookup = buildLookup(salarios);

  applyUrlState();

  ATLAS.hideLoading();
  updateMap();

  // Nav arrows — disabled for standalone viz
  document.getElementById('prev-viz')?.style.setProperty('opacity', '0.3');
  document.getElementById('next-viz')?.style.setProperty('opacity', '0.3');
})();
</script>

</body>
</html>
