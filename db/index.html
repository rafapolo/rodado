<style>
  /* Catppuccin Mocha — https://catppuccin.com/palette */
  :root {
    --base: #1e1e2e; --mantle: #181825; --crust: #11111b;
    --surface0: #313244; --surface1: #45475a; --overlay0: #6c7086; --overlay1: #7f849c; --overlay2: #9399b2;
    --subtext0: #a6adc8; --text: #cdd6f4;
    --blue: #89b4fa; --mauve: #cba6f7; --peach: #fab387; --green: #a6e3a1; --yellow: #f9e2af; --red: #f38ba8;
    --moldura: rgb(144 157 235);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--base); color: var(--text);
    font: 12px/1.45 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; overflow: hidden; }
  /* moldura da página inteira, por cima de tudo e sem roubar clique nem espaço */
  html::after { content: ""; position: fixed; inset: 0; border: 2px solid var(--moldura);
    pointer-events: none; z-index: 100; }
  #esquerda { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
  #terminal { flex: 1; min-height: 0; width: 100%; border: 0; background: var(--base); }
  /* editor de SQL: a digitação é local (sem ida e volta ao beelink); só o Enter manda ao terminal */
  #editor { position: relative; flex: 0 0 auto; border-top: 1px solid var(--surface0); background: var(--mantle);
    padding: 6px 8px 6px 6px; display: flex; gap: 6px; align-items: flex-start; }
  /* "sql>" preso ao pé, na altura da última linha (5px = padding + borda do campo) */
  #editor::before { content: "sql>"; color: var(--mauve); align-self: flex-end; padding-bottom: 5px; flex: 0 0 auto; }
  #campo { position: relative; flex: 1; min-width: 0; }
  #realce, #sql { margin: 0; padding: 4px 6px; border: 1px solid transparent; border-radius: 4px; width: 100%;
    font: inherit; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }
  #realce { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--text);
    background: var(--base); border-color: var(--surface0); }
  #sql { position: relative; display: block; resize: none; overflow-y: auto; max-height: 40vh; background: transparent;
    color: transparent; caret-color: var(--text); scrollbar-width: thin; scrollbar-color: var(--surface0) transparent; }
  #sql::placeholder { color: var(--overlay2); }
  #sql::selection { background: #585b7099; }
  #sql:focus { outline: none; }
  #campo:focus-within #realce { border-color: var(--mauve); }
  #realce .k { color: var(--mauve); font-weight: 700; } #realce .s { color: var(--green); }
  #realce .n { color: var(--peach); } #realce .c { color: var(--overlay1); font-style: italic; }
  #realce .t { color: var(--blue); }
  /* os dois botões: mesma caixa, da altura de uma linha do editor, presos ao pé quando ele cresce */
  #executa, #compartilha { flex: 0 0 auto; align-self: flex-end; display: grid; place-items: center;
    width: 30px; height: calc(1.45em + 10px); padding: 0; font: inherit; background: var(--base);
    border: 1px solid var(--surface0); border-radius: 4px; cursor: pointer; }
  #executa { color: var(--green); }
  #executa:hover { border-color: var(--green); }
  #compartilha { color: var(--blue); margin-right: 2px; }
  #compartilha:hover { border-color: var(--blue); }
  #compartilha svg { width: 13px; height: 13px; }
  #compartilha.ok { color: var(--green); border-color: var(--green); }
  #sugestoes { position: absolute; left: 44px; bottom: 100%; margin: 0 0 2px; padding: 2px 0; list-style: none;
    min-width: 260px; max-width: min(640px, 90%); max-height: 220px; overflow-y: auto; background: var(--crust);
    border: 1px solid var(--surface1); border-radius: 6px; z-index: 5; box-shadow: 0 -6px 20px #0006; }
  #sugestoes li { display: flex; gap: 12px; padding: 1px 8px; cursor: pointer; white-space: nowrap; }
  #sugestoes li .meta { margin-left: auto; color: var(--subtext0); }
  #sugestoes li[aria-selected=true], #sugestoes li:hover { background: var(--surface0); }
  /* divisor: 1px visível, 9px de área de pegar; realça no hover e enquanto arrasta */
  #arrasta { position: relative; flex: 0 0 1px; background: var(--surface0); cursor: col-resize;
    transition: background .15s; z-index: 2; }
  #arrasta::before { content: ""; position: absolute; inset: 0 -4px; }
  #arrasta::after { content: ""; position: absolute; top: 50%; left: -2px; width: 5px; height: 28px;
    margin-top: -14px; border-radius: 3px; background: var(--surface1); transition: background .15s; }
  #arrasta:hover, body.arrastando #arrasta { background: var(--mauve); }
  #arrasta:hover::after, body.arrastando #arrasta::after { background: var(--mauve); }
  body.arrastando, body.arrastando * { cursor: col-resize !important; user-select: none; }
  body.arrastando #terminal { pointer-events: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface0); border-radius: 4px; border: 2px solid transparent;
    background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--surface1); background-clip: padding-box; }
  aside { width: 360px; min-width: 220px; max-width: 70vw; display: flex; flex-direction: column;
    background: var(--mantle); }
  header { display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-bottom: 1px solid var(--surface0); }
  header b { color: var(--mauve); }
  #resumo { color: var(--overlay1); font-size: 11px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #busca { flex: 1; min-width: 80px; padding: 3px 6px; background: var(--base); color: var(--text);
    border: 1px solid var(--surface0); border-radius: 4px; font: inherit; }
  #busca::placeholder { color: var(--overlay2); }
  #busca:focus { outline: none; border-color: var(--mauve); }
  #arvore { flex: 1; overflow-y: auto; padding: 4px 0 20px; scrollbar-width: thin; scrollbar-color: var(--surface0) transparent; }
  details > summary { list-style: none; cursor: pointer; padding: 1px 8px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸ "; color: var(--overlay2); }
  details[open] > summary::before { content: "▾ "; color: var(--mauve); }
  /* colunas carregando: o girador ocupa o lugar do ▾, sem empurrar o nome */
  .tb > summary[aria-busy=true]::before { content: ""; display: inline-block; width: 10px; height: 10px;
    margin-right: calc(2ch - 10px); vertical-align: -1px; border: 2px solid var(--surface1);
    border-top-color: var(--mauve); border-radius: 50%; animation: gira .7s linear infinite; }
  summary:hover, .coluna:hover { background: var(--surface0); }
  /* texto secundário: overlay2 no mantle (6,2:1) e subtext0 sobre o surface0 do hover/foco (5,6:1) — AA nos dois */
  .ds > summary .n { color: var(--overlay2); }
  summary:hover .n, summary:focus-visible .n, .coluna:hover .tipo, .coluna:focus-visible .tipo,
  summary:hover::before, summary:focus-visible::before { color: var(--subtext0); }
  .tb > summary { padding-left: 20px; }
  /* tabela aberta: filete à esquerda e nome preso no topo enquanto as colunas rolam */
  .tb[open] { box-shadow: inset 2px 0 var(--mauve); padding-bottom: 4px; margin-bottom: 2px; }
  .tb[open] > summary { position: sticky; top: 0; z-index: 1; background: var(--mantle);
    box-shadow: inset 2px 0 var(--mauve); }
  .tb[open] > summary:hover, .tb[open] > summary:focus-visible { background: var(--surface0); }
  .tb[open] > summary .nome { font-weight: 700; }
  .tb > summary .nome { color: var(--blue); }
  /* trecho que casou com o filtro */
  #arvore mark { background: var(--mauve); color: var(--crust); }
  .tb > summary .linhas { color: var(--peach); float: right; }
  /* onde a tabela mora: verde = SSD do servidor (rápido), amarelo = bucket S3; ◐ = dataset misto */
  .onde { margin-right: 4px; font-size: 9px; vertical-align: 1px; }
  .onde.ssd { color: var(--green); } .onde.s3 { color: var(--yellow); }
  /* legenda: também filtra (onde:ssd / onde:s3 na busca) */
  #legenda { display: flex; gap: 6px; padding: 3px 8px; border-bottom: 1px solid var(--surface0); font-size: 11px; }
  #legenda button { background: none; border: 1px solid transparent; border-radius: 4px; padding: 1px 6px;
    color: var(--subtext0); font: inherit; cursor: pointer; }
  #legenda button:hover { background: var(--surface0); }
  #legenda button[aria-pressed=true] { border-color: var(--mauve); color: var(--text); }
  #legenda .onde { font-size: 9px; }
  #legenda .n { color: var(--overlay2); }
  #legenda button:hover .n, #legenda button[aria-pressed=true] .n { color: var(--subtext0); }
  .usar { color: var(--green); cursor: pointer; margin-left: 6px; visibility: hidden; }
  .tb > summary:hover .usar { visibility: visible; }
  .info { padding: 4px 8px 6px 34px; color: var(--subtext0); white-space: normal; }
  .info .fatos b { color: var(--peach); font-weight: 400; }
  .info a { color: var(--blue); text-decoration: none; }
  .info a:hover { text-decoration: underline; }
  .acoes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .acoes button { font: inherit; font-size: 11px; color: var(--text); background: var(--base);
    border: 1px solid var(--surface0); border-radius: 4px; padding: 1px 6px; cursor: pointer; }
  .acoes button:hover { border-color: var(--mauve); color: var(--mauve); }
  .acoes button .play { color: var(--green); }
  /* girando enquanto algo carrega: no item da tabela (colunas) e no catálogo */
  .gira { display: inline-block; width: 9px; height: 9px; margin: 0 6px; vertical-align: -1px;
    border: 2px solid var(--surface1); border-top-color: var(--mauve); border-radius: 50%;
    animation: gira .7s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .gira, .tb > summary[aria-busy=true]::before { animation-duration: 2s; } }
  .aviso { margin-top: 5px; padding: 3px 6px; border-left: 2px solid var(--peach); background: var(--crust);
    color: var(--peach); border-radius: 0 4px 4px 0; }
  .aviso code { color: var(--text); }
  .buscacol { width: 100%; margin-top: 5px; padding: 2px 6px; background: var(--base); color: var(--text);
    border: 1px solid var(--surface0); border-radius: 4px; font: inherit; }
  .buscacol::placeholder { color: var(--overlay2); }
  .info.erro { color: var(--red); }
  .dsinfo { padding: 2px 8px 6px 22px; color: var(--subtext0); }
  .dsinfo .desc { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dsinfo.aberta .desc { -webkit-line-clamp: unset; display: block; }
  .dsinfo .mais { background: none; border: 0; padding: 0; color: var(--blue); font: inherit; cursor: pointer; }
  .etq { font-size: 10px; padding: 0 4px; border-radius: 3px; margin-left: 6px; align-self: center; }
  .etq.particao { color: var(--crust); background: var(--mauve); }
  .etq.filtre { color: var(--peach); border: 1px solid var(--peach); }
  .coluna { padding: 0 8px 0 34px; display: flex; gap: 8px; cursor: pointer; }
  .coluna .tipo { color: var(--overlay2); margin-left: auto; }
  /* etiqueta encostada à direita, logo antes do tipo */
  .coluna .etq { margin-left: auto; }
  .coluna .etq + .tipo { margin-left: 0; }
  .vazio { padding: 8px; color: var(--overlay1); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  /* foco visível só para teclado (régua do swissviz) */
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--mauve); outline-offset: -2px; border-radius: 3px; }
  summary:focus-visible, .coluna:focus-visible { background: var(--surface0); }
  #arrasta:focus-visible { background: var(--mauve); outline: none; }
  button:focus-visible { outline: 2px solid var(--mauve); outline-offset: 1px; }
  /* campos de texto: o foco é só a borda fina mauve, sem anel por cima */
  #sql:focus-visible, #busca:focus-visible { outline: none; }
  .vazio.erro { color: var(--red); }
  #teclas, #fundo, #fecha { display: none; }

  /* celular: terminal em tela cheia, árvore como painel que sobe de baixo, barra de teclas */
  @media (max-width: 760px), (pointer: coarse) and (max-width: 1024px) {
    html, body { height: var(--altura, 100dvh); }
    body { flex-direction: column; position: fixed; inset: 0 0 auto 0; }
    #esquerda { flex: 1; height: auto; min-height: 0; }
    #editor { display: none; }   /* no celular a digitação segue no terminal, com a barra de teclas */
    #arrasta { display: none; }
    #teclas { display: flex; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      background: var(--mantle); border-top: 1px solid var(--surface0); overflow-x: auto;
      scrollbar-width: none; flex: 0 0 auto; }
    #teclas::-webkit-scrollbar { display: none; }
    #teclas button { flex: 0 0 auto; min-width: 42px; height: 36px; padding: 0 10px; border-radius: 6px;
      border: 1px solid var(--surface0); background: var(--base); color: var(--text); font: inherit;
      font-size: 13px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #teclas button:active { background: var(--surface1); }
    #teclas button.principal { color: var(--mauve); border-color: var(--mauve); }
    #teclas button.enviar { color: var(--green); }
    #teclas button.parar { color: var(--red); }
    aside { position: fixed; left: 0; right: 0; bottom: 0; width: auto !important; max-width: none;
      height: 75%; z-index: 10; border-top: 1px solid var(--surface1); border-radius: 12px 12px 0 0;
      transform: translateY(105%); transition: transform .22s ease; padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -8px 30px #0008; }
    body.arvore-aberta aside { transform: none; }
    #fundo { display: block; position: fixed; inset: 0; background: #11111b99; z-index: 9;
      opacity: 0; pointer-events: none; transition: opacity .22s; }
    body.arvore-aberta #fundo { opacity: 1; pointer-events: auto; }
    header { padding: 10px; }
    header::before { content: ""; position: absolute; top: 4px; left: 50%; width: 36px; height: 4px;
      margin-left: -18px; border-radius: 2px; background: var(--surface1); }
    #resumo { display: none; }
    #busca { font-size: 16px; padding: 6px 8px; } /* 16px: o iOS não dá zoom no foco */
    #fecha { display: grid; place-items: center; background: none; border: 0; color: #fff; padding: 0;
      min-width: 40px; height: 40px; cursor: pointer; }
    #fecha svg { width: 14px; height: 14px; }
    details > summary { padding: 7px 10px; }
    .tb > summary { padding-left: 24px; }
    .coluna { padding: 6px 10px 6px 40px; }
    .usar { visibility: visible; padding: 0 6px; }
    .acoes button { font-size: 13px; min-height: 36px; padding: 0 10px; }
    .buscacol { font-size: 16px; padding: 6px 8px; }
  }
  @media (hover: none) { .usar { visibility: visible; } }
</style>
</head>
<body>
<div id="esquerda">
<iframe id="terminal" src="/tty/" title="terminal SQL (DuckDB, só leitura)"></iframe>
<div id="editor" role="group" aria-label="editor de SQL">
  <div id="campo">
    <pre id="realce" aria-hidden="true"></pre>
    <textarea id="sql" rows="1" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
      role="combobox" aria-expanded="false" aria-controls="sugestoes" aria-autocomplete="list"
      aria-label="consulta SQL: Enter executa, Shift+Enter quebra a linha, Tab completa, seta para cima traz a anterior"
      placeholder="escreva a consulta aqui · Enter executa · Shift+Enter nova linha · Tab completa · ↑ anterior"></textarea>
  </div>
  <button id="compartilha" type="button" aria-label="copiar link que abre e executa esta consulta" title="copiar link que abre e executa esta consulta"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2.6-2.6a3 3 0 0 0-4.2-4.2L8 3.8"/><path d="M9.5 6.5a3 3 0 0 0-4.2 0L2.7 9.1a3 3 0 0 0 4.2 4.2L8 12.2"/></svg></button>
  <button id="executa" type="button" aria-label="executar a consulta (Enter)" title="executar (Enter)">▶</button>
  <ul id="sugestoes" role="listbox" aria-label="sugestões de dataset, tabela, coluna e palavra-chave" hidden></ul>
</div>
</div>
<div id="arrasta" role="separator" aria-orientation="vertical" aria-controls="painel" tabindex="0"
  aria-label="redimensionar a árvore de datasets (setas ← →, Enter volta ao padrão)"
  title="arraste para redimensionar · duplo clique volta ao padrão"></div>
<aside id="painel" aria-label="datasets e tabelas">
  <header style="position:relative" title="clique na tabela: colunas · ▶ ou duplo clique: põe a consulta no editor · clique na coluna: insere o nome">
    <b>rodado</b>
    <input id="busca" type="search" placeholder="filtrar…" autocomplete="off"
      aria-label="filtrar datasets, tabelas e descrições (↓ entra na árvore)" aria-controls="arvore">
    <span id="resumo" aria-live="polite"></span>
    <button id="fecha" aria-label="fechar a árvore de datasets"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg></button>
  </header>
  <div id="legenda" role="group" aria-label="onde as tabelas são lidas">
    <button type="button" data-onde="ssd" aria-pressed="false" title="tabelas no SSD do servidor: leitura rápida · clique para filtrar"><span class="onde ssd" aria-hidden="true">●</span> SSD <span class="n" id="n-ssd"></span></button>
    <button type="button" data-onde="s3" aria-pressed="false" title="tabelas no bucket S3: leitura mais lenta · clique para filtrar"><span class="onde s3" aria-hidden="true">●</span> S3 <span class="n" id="n-s3"></span></button>
  </div>
  <div id="arvore" role="tree" aria-label="árvore de datasets"><div class="vazio"><span class="gira" aria-hidden="true"></span>carregando catálogo…</div></div>
  <div id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
</aside>
<div id="fundo"></div>
<nav id="teclas" aria-label="teclas do terminal">
  <button class="principal" data-acao="arvore" aria-expanded="false" aria-controls="painel" aria-label="abrir a árvore de datasets"><span aria-hidden="true">☰</span> datasets</button>
  <button class="enviar" data-k="enter" aria-label="executar (Enter)">⏎</button>
  <button data-k="tab" aria-label="completar (Tab)">Tab</button>
  <button data-t=";" aria-label="ponto e vírgula">;</button>
  <button data-k="cima" aria-label="comando anterior">↑</button>
  <button data-k="baixo" aria-label="próximo comando">↓</button>
  <button data-k="esq" aria-label="cursor à esquerda">←</button>
  <button data-k="dir" aria-label="cursor à direita">→</button>
  <button data-t="*" aria-label="asterisco">*</button>
  <button data-t="'" aria-label="aspas simples">'</button>
  <button class="parar" data-k="ctrlc" aria-label="interromper ou limpar a linha (Ctrl-C)">Ctrl-C</button>
  <button data-k="esc" aria-label="Esc">Esc</button>
</nav>
<script>
const arvore = document.getElementById("arvore");
const busca = document.getElementById("busca");
let catalogo = [];

const fmt = n => n == null ? "" : n >= 1e9 ? (n / 1e9).toFixed(1).replace(".", ",") + " bi"
  : n >= 1e6 ? (n / 1e6).toFixed(1).replace(".", ",") + " mi"
  : n >= 1e3 ? (n / 1e3).toFixed(0) + " mil" : String(n);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

// consulta inteira (termina em ;) substitui o que está no editor; nome de coluna entra no cursor.
// No celular não há editor: vai direto para o terminal, como sempre foi.
function cola(texto) {
  if (editorVisivel()) {
    if (/;\s*$/.test(texto) || !sql.value) sql.value = texto;
    else sql.setRangeText(texto, sql.selectionStart, sql.selectionEnd, "end");
    sql.focus();
    if (/;\s*$/.test(texto)) sql.setSelectionRange(sql.value.length, sql.value.length);
    atualizaEditor();
    return;
  }
  const f = document.getElementById("terminal");
  try {
    const term = f.contentWindow.term;
    term.paste(texto);
    fechaArvore();
    term.focus();
  } catch (e) {
    navigator.clipboard?.writeText(texto);
  }
}

// botões da tabela (amostra, DESCRIBE, SUMMARIZE): cola e já executa
function roda(texto) {
  if (editorVisivel()) { cola(texto); executa(); return; }
  try {
    const term = document.getElementById("terminal").contentWindow.term;
    term.paste(texto);
    term.input("\r", true);
    fechaArvore();
    term.focus();
  } catch (e) {
    navigator.clipboard?.writeText(texto);
  }
}

// nome com os trechos que casam com o filtro em <mark>. O filtro casa em "dataset.tabela", então a busca
// corre em `base` e só a fatia que cabe ao nome (a partir de `desloc`) é marcada: "cnpj.emp" pinta as duas pontas.
function marca(nome, f, base = nome, desloc = 0) {
  if (!f) return esc(nome);
  const alvo = base.toLowerCase();
  let html = "", pos = 0;
  for (let i = alvo.indexOf(f); i >= 0; i = alvo.indexOf(f, i + f.length)) {
    const a = Math.max(i - desloc, pos), b = Math.min(i + f.length - desloc, nome.length);
    if (b <= a) continue;
    html += esc(nome.slice(pos, a)) + "<mark>" + esc(nome.slice(a, b)) + "</mark>";
    pos = b;
  }
  return html + esc(nome.slice(pos));
}

const onde = ssd => ssd
  ? '<span class="onde ssd" role="img" aria-label="no SSD" title="no SSD do servidor: leitura rápida">●</span>'
  : '<span class="onde s3" role="img" aria-label="no S3" title="no bucket S3: leitura mais lenta">●</span>';

const ONDE = /(?:^|\s)onde:(ssd|s3)(?=\s|$)/;

function desenha(filtro) {
  const bruto = filtro.trim().toLowerCase();
  const so = (ONDE.exec(bruto) || [])[1];                    // onde:ssd / onde:s3 na busca
  const f = bruto.replace(ONDE, " ").trim();
  for (const b of document.querySelectorAll("#legenda button")) b.setAttribute("aria-pressed", String(b.dataset.onde === so));
  const grupos = new Map();
  for (const t of catalogo) {
    if (so && (so === "ssd") !== !!t.ssd) continue;
    if (f && !(t.dataset + "." + t.tabela + " " + (t.descricao || "") + " " + (t.fonte || "")).toLowerCase().includes(f)) continue;
    if (!grupos.has(t.dataset)) grupos.set(t.dataset, []);
    grupos.get(t.dataset).push(t);
  }
  const nTab = [...grupos.values()].reduce((s, g) => s + g.length, 0);
  document.getElementById("status").textContent = bruto
    ? `${nTab} ${nTab === 1 ? "tabela" : "tabelas"} em ${grupos.size} ${grupos.size === 1 ? "dataset" : "datasets"}`
    : "";
  if (!grupos.size) { arvore.innerHTML = '<div class="vazio">nada encontrado</div>'; return; }
  let html = "";
  for (const [ds, tabelas] of grupos) {
    const comPonto = f && tabelas.find(t => (ds + "." + t.tabela).toLowerCase().includes(f));
    const nSsd = tabelas.filter(t => t.ssd).length;
    const ondeDs = nSsd === tabelas.length ? onde(true) : nSsd === 0 ? onde(false)
      : `<span class="onde ssd" role="img" aria-label="${nSsd} de ${tabelas.length} tabelas no SSD" title="${nSsd} de ${tabelas.length} tabelas no SSD, o resto no S3">◐</span>`;
    html += `<details class="ds" data-ds="${esc(ds)}"><summary role="treeitem" aria-level="1" title="${esc((catalogo.find(x => x.dataset === ds && x.descricao) || {}).descricao || "")}">${ondeDs}${marca(ds, f, comPonto ? ds + "." + comPonto.tabela : ds)} <span class="n">(${tabelas.length})</span></summary>`;
    for (const t of tabelas) {
      html += `<details class="tb" data-t="${esc(ds + "." + t.tabela)}"><summary role="treeitem" aria-level="2">${onde(t.ssd)}<span class="nome">${marca(t.tabela, f, ds + "." + t.tabela, ds.length + 1)}</span>`
        + `<span class="usar" role="button" aria-label="colar FROM ${esc(ds + "." + t.tabela)} no terminal" title="colar no terminal">▶</span>`
        + `<span class="linhas" aria-label="${esc(fmt(t.linhas))} linhas">${fmt(t.linhas)}</span></summary></details>`;
    }
    html += "</details>";
  }
  arvore.innerHTML = html;
}

arvore.addEventListener("dblclick", e => {

const GRANDE = 50e6;          // acima disto, aviso para filtrar
const FILTRAVEL = 10e6;       // acima disto, ano/mes/sigla_uf ganham a etiqueta "filtre"
const FILTROS = ["ano", "mes", "sigla_uf"];
const COLUNAS_COM_BUSCA = 40;
const numero = n => n == null ? "?" : n.toLocaleString("pt-BR");
const data = d => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : ""; };
const linkSeguro = u => /^https?:\/\//i.test(u || "") ? u : "";

function htmlDataset(ds) {
  const t = catalogo.find(x => x.dataset === ds && x.descricao);
  if (!t) return "";
  return `<div class="dsinfo"><p class="desc">${esc(t.descricao)}</p>`
    + `<button class="mais" type="button" aria-expanded="false">mais…</button></div>`;
}

function htmlTabela(t, cols) {
  const fonte = linkSeguro(t.url)
    ? `<a href="${esc(t.url)}" target="_blank" title="${esc(t.url)}">${esc(t.fonte || "fonte")} <span aria-hidden="true">↗</span></a>`
    : esc(t.fonte || "");
  const fatos = [t.linhas != null && `<b>${numero(t.linhas)}</b> linhas`, data(t.atualizado) && `atualizado ${data(t.atualizado)}`,
    t.ssd ? `${onde(true)}lida do SSD` : `${onde(false)}lida do S3, mais lenta`, fonte]
    .filter(Boolean).join(" · ");
  const nomes = new Set(cols.map(c => c.coluna));
  const filtros = [...cols.filter(c => c.particao).map(c => c.coluna), ...FILTROS.filter(f => nomes.has(f))];
  const filtrosUnicos = [...new Set(filtros)];
  let html = `<div class="info"><div class="fatos">${fatos}</div>`
    + `<div class="acoes" role="group" aria-label="ações da tabela">`
    + ["amostra", "DESCRIBE", "SUMMARIZE"].map(a =>
      `<button type="button" data-roda="${a.toLowerCase()}" aria-label="rodar ${a} de ${esc(t.dataset + "." + t.tabela)}"><span class="play" aria-hidden="true">▶</span> ${a}</button>`).join("")
    + `</div>`;
  if ((t.linhas || 0) >= GRANDE)
    html += `<div class="aviso" role="note">⚑ ${numero(t.linhas)} linhas — `
      + (filtrosUnicos.length ? `filtre por ${filtrosUnicos.map(f => `<code>${esc(f)}</code>`).join(", ")}` : "use LIMIT ou agregue")
      + `; sem filtro passa dos ${300} s</div>`;
  if (cols.length > COLUNAS_COM_BUSCA)
    html += `<input class="buscacol" type="search" placeholder="filtrar ${cols.length} colunas…" aria-label="filtrar as colunas de ${esc(t.tabela)}">`;
  html += `</div>`;
  html += cols.map(c => {
    const etiqueta = c.particao ? `<span class="etq particao" title="partição: filtrar por ela pula arquivos inteiros">partição</span>`
      : (FILTROS.includes(c.coluna) && (t.linhas || 0) >= FILTRAVEL) ? `<span class="etq filtre" title="filtre por esta coluna em tabelas grandes">filtre</span>` : "";
    return `<div class="coluna" role="treeitem" aria-level="3" tabindex="-1" data-c="${esc(c.coluna)}" title="colar o nome no terminal">`
      + `<span class="nomecol">${esc(c.coluna)}</span>${etiqueta}<span class="tipo">${esc(c.tipo)}</span></div>`;
  }).join("");
  return html;
}

arvore.addEventListener("toggle", async e => {
  const det = e.target;
  if (!det.open || det.dataset.ok) return;
  if (det.classList?.contains("ds")) {
    det.dataset.ok = 1;
    det.querySelector(":scope > summary").insertAdjacentHTML("afterend", htmlDataset(det.dataset.ds));
    // "mais…" só quando as 2 linhas cortam a descrição
    const desc = det.querySelector(":scope > .dsinfo .desc");
    if (desc && desc.scrollHeight <= desc.clientHeight + 1) desc.nextElementSibling.remove();
    return;
  }
  if (!det.classList?.contains("tb")) return;
  det.dataset.ok = 1;
  const t = catalogo.find(x => x.dataset + "." + x.tabela === det.dataset.t) || {};
  const resumo = det.querySelector(":scope > summary");
  resumo.setAttribute("aria-busy", "true");
  let html;
  try {
    const r = await fetch(location.origin + "/colunas?t=" + encodeURIComponent(det.dataset.t));
    const cols = await r.json();
    if (cols.erro) throw new Error(cols.erro);
    html = htmlTabela(t, cols);
  } catch (err) {
    html = `<div class="info erro">erro ao ler colunas: ${esc(err.message)}</div>`;
  }
  resumo.removeAttribute("aria-busy");
  det.insertAdjacentHTML("beforeend", html);
}, true);

// JetBrains Mono dentro do iframe do ttyd (mesma origem): copia o <link> e,
// quando a fonte carregar, troca a família para o xterm re-medir as células.
const termFrame = document.getElementById("terminal");
termFrame.addEventListener("load", async () => {
  const doc = termFrame.contentDocument;
  doc.head.appendChild(doc.importNode(document.getElementById("fonte"), true));
  const css = doc.createElement("style");
  css.textContent = `
    html, body, #terminal-container, .xterm, .xterm-viewport { background: #1e1e2e !important; }
    #terminal-container { padding: 4px 0 0 6px; box-sizing: border-box; }
    .xterm-viewport { scrollbar-width: thin; scrollbar-color: #313244 transparent; }
    .xterm-viewport::-webkit-scrollbar { width: 8px; }
    .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
    .xterm-viewport::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px;
      border: 2px solid transparent; background-clip: padding-box; }
    .xterm-viewport::-webkit-scrollbar-thumb:hover { background: #45475a; background-clip: padding-box; }`;
  doc.head.appendChild(css);
  await doc.fonts.load('12px "JetBrains Mono"');
  for (let i = 0; i < 50 && !termFrame.contentWindow.term; i++) await new Promise(r => setTimeout(r, 100));
  const term = termFrame.contentWindow.term;
  if (!term) return;
  term.options.fontFamily = '"JetBrains Mono", monospace';
  // links OSC 8 do terminal.py: [atlas] abre em nova aba (sem o confirm() padrão do xterm),
  // [ajuda] é rodado:.ajuda e roda o comando
  term.options.linkHandler = {
    allowNonHttpProtocols: true,
    activate: (_, uri) => {
      // direto no terminal, sem passar pelo editor: não mexe no rascunho de quem está escrevendo
      if (uri.startsWith("rodado:")) { term.paste(uri.slice(7)); term.input("\r", true); }
      else if (/^https?:/.test(uri)) window.open(uri, "_blank", "noopener");
    },
  };
  ajustaFonte(term);
  addEventListener("resize", () => ajustaFonte(term));
  if (editorVisivel()) sql.focus();      // no desktop o teclado começa no editor, não no terminal
  rodaDaUrl(term);
});

// Tela estreita (celular): diminui a fonte até caberem COLUNAS_MIN colunas — o logo da
// abertura e a linha de números do terminal.py — sem descer de FONTE_MIN.
const FONTE = 12, FONTE_MIN = 9, COLUNAS_MIN = 62;
function ajustaFonte(term) {
  let px = FONTE;
  term.options.fontSize = px;
  term.fit?.();
  while (term.cols < COLUNAS_MIN && px > FONTE_MIN) {
    px = Math.max(FONTE_MIN, px - 0.5);
    term.options.fontSize = px;
    term.fit?.();
  }
}

// ?query=<base64 do SQL> roda ao abrir: link pronto para uma consulta (base64 ou base64url, UTF-8).
// ?z=<base64 do SQL comprimido em deflate cru> é o mesmo, 25–60% mais curto.
// /q/<id> (link curto) e ?q=<id> executam o SQL salvo por POST /q.
async function sqlDaUrl() {
  const p = new URLSearchParams(location.search);
  const id = location.pathname.match(/^\/q\/([\w-]{8,16})$/)?.[1] || p.get("q");
  if (id) {
    const r = await fetch(location.origin + "/q/" + encodeURIComponent(id) + "/sql");
    if (!r.ok) throw new Error("link não encontrado");
    return (await r.text()).trim();
  }
  const nome = p.has("z") ? "z" : "query";
  // URLSearchParams lê "+" como espaço; no base64 ele é dígito
  const b64 = p.get(nome)?.trim().replace(/ /g, "+");
  if (!b64) return null;
  const bin = atob(b64.replace(/-/g, "+").replace(/_/g, "/").replace(/=+$/, ""));
  let bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  if (nome === "z")
    bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  return new TextDecoder("utf-8", { fatal: true }).decode(bytes).trim();
}
async function rodaDaUrl(term) {
  let texto;
  try { texto = await sqlDaUrl(); }
  catch (_) { term.write("\r\n\x1b[31m?query=, ?z= ou ?q= não traz um SQL válido (base64, deflate no ?z=, link salvo no ?q=)\x1b[0m\r\n"); return; }
  if (!texto) return;
  // colado antes do prompt, o texto se perde: espera o "rodado>" aparecer no terminal
  const temPrompt = () => {
    const b = term.buffer.active;
    for (let i = 0; i < b.length; i++) if (b.getLine(i)?.translateToString().includes("rodado>")) return true;
    return false;
  };
  for (let i = 0; i < 150 && !temPrompt(); i++) await new Promise(r => setTimeout(r, 100));
  if (editorVisivel()) { sql.value = texto; atualizaEditor(); executa(); sql.focus(); }
  else roda(/;\s*$/.test(texto) || texto.startsWith(".") ? texto : texto + ";");
}


// ---------------------------------------------------------------- editor de SQL (desktop)
const sql = document.getElementById("sql");
const realce = document.getElementById("realce");
const sugestoes = document.getElementById("sugestoes");
const editorVisivel = () => document.getElementById("editor").offsetParent !== null;
const PALAVRAS = ("SELECT FROM WHERE GROUP BY ORDER HAVING LIMIT OFFSET JOIN LEFT RIGHT INNER FULL OUTER CROSS ON USING AS AND OR NOT "
  + "IN IS NULL LIKE ILIKE BETWEEN CASE WHEN THEN ELSE END DISTINCT UNION ALL EXCEPT INTERSECT WITH DESC ASC DESCRIBE SUMMARIZE "
  + "SHOW COUNT SUM AVG MIN MAX CAST TRY_CAST COALESCE QUALIFY OVER PARTITION EXISTS TRUE FALSE PIVOT UNPIVOT").split(" ");
const EH_PALAVRA = new Set(PALAVRAS);
const colunasDe = {};            // dataset.tabela -> [{coluna, tipo}] (vazio enquanto busca)
let tabelasConhecidas = new Set(), datasets = [];
let historico = [], posHist = -1, rascunho = "", itens = [], escolhido = -1;
try { historico = JSON.parse(localStorage.getItem("rodado.historico") || "[]"); } catch (_) {}

function pinta(texto) {
  return texto.replace(/(--[^\n]*)|('(?:[^']|'')*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w]*(?:\.[A-Za-z_][\w]*)?)|([&<>])/g,
    (m, com, str, num, pal, simb) => {
      if (simb) return esc(simb);
      if (com) return `<span class="c">${esc(com)}</span>`;
      if (str) return `<span class="s">${esc(str)}</span>`;
      if (num) return `<span class="n">${num}</span>`;
      if (EH_PALAVRA.has(pal.toUpperCase())) return `<span class="k">${pal}</span>`;
      if (tabelasConhecidas.has(pal)) return `<span class="t">${pal}</span>`;
      return pal;
    });
}

function atualizaEditor() {
  realce.innerHTML = pinta(sql.value) + "\n";      // a quebra final mantém a altura da última linha vazia
  const antes = sql.offsetHeight;
  sql.style.height = "auto";
  sql.style.height = Math.min(sql.scrollHeight + 2, innerHeight * 0.4) + "px";
  realce.scrollTop = sql.scrollTop;
  if (sql.offsetHeight !== antes) { cancelAnimationFrame(quadro); quadro = requestAnimationFrame(refit); }
  sugere();
}

function pedeColunas(tabela) {
  if (colunasDe[tabela]) return;
  colunasDe[tabela] = [];
  fetch(location.origin + "/colunas?t=" + encodeURIComponent(tabela)).then(r => r.json())
    .then(cols => { if (Array.isArray(cols)) { colunasDe[tabela] = cols; sugere(); } }).catch(() => {});
}

function sugere() {
  const ate = sql.value.slice(0, sql.selectionStart);
  const palavra = (/[\w.]+$/.exec(ate) || [""])[0];
  itens = [];
  const citadas = (sql.value.match(/\b\w+\.\w+\b/g) || []).filter(t => tabelasConhecidas.has(t));
  citadas.forEach(pedeColunas);
  if (palavra.length >= 2 && sql.selectionStart === sql.selectionEnd) {
    const p = palavra.toLowerCase();
    if (palavra.includes(".")) {
      for (const t of tabelasConhecidas) if (t.startsWith(p) && t !== p) itens.push({ texto: t, meta: "tabela" });
    } else {
      const vistas = new Set();
      for (const t of citadas) for (const c of colunasDe[t] || [])
        if (c.coluna.toLowerCase().startsWith(p) && c.coluna.toLowerCase() !== p && !vistas.has(c.coluna)) {
          vistas.add(c.coluna); itens.push({ texto: c.coluna, meta: c.tipo.toLowerCase() });
        }
      for (const d of datasets) if (d.startsWith(p)) itens.push({ texto: d + ".", meta: "dataset" });
      for (const k of PALAVRAS) if (k.toLowerCase().startsWith(p) && k.toLowerCase() !== p) itens.push({ texto: k, meta: "" });
    }
  }
  itens = itens.slice(0, 12).map(i => ({ ...i, troca: palavra.length }));
  escolhido = itens.length ? 0 : -1;
  desenhaSugestoes();
}

function desenhaSugestoes() {
  sugestoes.hidden = !itens.length;
  sql.setAttribute("aria-expanded", String(!!itens.length));
  sugestoes.innerHTML = itens.map((i, n) =>
    `<li role="option" id="sug${n}" data-n="${n}" aria-selected="${n === escolhido}"><span>${esc(i.texto)}</span><span class="meta">${esc(i.meta)}</span></li>`).join("");
  if (escolhido >= 0) { sql.setAttribute("aria-activedescendant", "sug" + escolhido); sugestoes.children[escolhido]?.scrollIntoView({ block: "nearest" }); }
  else sql.removeAttribute("aria-activedescendant");
}

function aceita(n) {
  const i = itens[n];
  if (!i) return false;
  const fim = sql.selectionStart;
  sql.setRangeText(i.texto, fim - i.troca, fim, "end");
  atualizaEditor();
  return true;
}

function executa() {
  let texto = sql.value.trim();
  const term = termFrame.contentWindow.term;
  if (!term) return;
  if (!texto) { term.input("\r", true); return; }      // Enter vazio ainda serve ao terminal
  if (!texto.startsWith(".") && !texto.endsWith(";")) texto += ";";
  term.paste(texto);
  term.input("\r", true);
  historico = historico.filter(h => h !== texto);
  historico.push(texto);
  historico = historico.slice(-100);
  try { localStorage.setItem("rodado.historico", JSON.stringify(historico)); } catch (_) {}
  posHist = -1;
  sql.value = "";
  atualizaEditor();
}

function anda(dir) {                 // histórico: ↑ na primeira linha, ↓ na última
  if (!historico.length) return false;
  if (posHist < 0) { if (dir > 0) return false; rascunho = sql.value; posHist = historico.length; }
  posHist += dir;
  if (posHist >= historico.length) { posHist = -1; sql.value = rascunho; }
  else { posHist = Math.max(0, posHist); sql.value = historico[posHist]; }
  sql.setSelectionRange(sql.value.length, sql.value.length);
  atualizaEditor();
  itens = []; desenhaSugestoes();
  return true;
}

sql.addEventListener("input", () => { posHist = -1; atualizaEditor(); });
sql.addEventListener("scroll", () => { realce.scrollTop = sql.scrollTop; });
sql.addEventListener("click", sugere);
sql.addEventListener("blur", () => setTimeout(() => { itens = []; desenhaSugestoes(); }, 150));
sql.addEventListener("keydown", e => {
  const aberto = itens.length > 0;
  if (e.key === "Tab" && !e.shiftKey && aberto) { e.preventDefault(); aceita(escolhido); }
  else if (e.key === "Escape" && aberto) { e.preventDefault(); e.stopPropagation(); itens = []; desenhaSugestoes(); }
  else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && aberto && itens.length > 1) {
    e.preventDefault();
    escolhido = (escolhido + (e.key === "ArrowDown" ? 1 : -1) + itens.length) % itens.length;
    desenhaSugestoes();
  }
  else if (e.key === "ArrowUp" && !sql.value.slice(0, sql.selectionStart).includes("\n")) { if (anda(-1)) e.preventDefault(); }
  else if (e.key === "ArrowDown" && posHist >= 0 && !sql.value.slice(sql.selectionEnd).includes("\n")) { if (anda(1)) e.preventDefault(); }
  else if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); executa(); }
  else if (e.key === "c" && e.ctrlKey && sql.selectionStart === sql.selectionEnd) {      // Ctrl-C sem seleção: interrompe a consulta
    e.preventDefault(); termFrame.contentWindow.term?.input("\x03", true);
  }
});
sugestoes.addEventListener("pointerdown", e => {
  const li = e.target.closest("li");
  if (li) { e.preventDefault(); aceita(+li.dataset.n); sql.focus(); }
});
document.getElementById("executa").addEventListener("click", () => { executa(); sql.focus(); });

// link curto da consulta do editor (ou da última executada, se o editor está vazio): POST /q
// salva o SQL e devolve o id; /q/<id> abre o terminal e executa, sem pedir senha a quem recebe
async function linkDaConsulta(texto) {
  const r = await fetch(location.origin + "/q", { method: "POST", body: texto });
  const d = await r.json();
  if (!r.ok) throw new Error(d.erro || "não deu para salvar o link");
  return location.origin + d.url;
}
const compartilha = document.getElementById("compartilha");
compartilha.addEventListener("click", async () => {
  const texto = sql.value.trim() || historico.at(-1);
  const status = document.getElementById("status");
  if (!texto) { status.textContent = "nada para compartilhar: escreva ou execute uma consulta"; sql.focus(); return; }
  // o link só existe depois do POST: no Safari, writeText() depois de um await perde o gesto
  // do clique; ClipboardItem com promessa copia o que a promessa entregar
  const pedido = linkDaConsulta(texto);
  let copiado = false, url;
  try {
    await navigator.clipboard.write([new ClipboardItem({ "text/plain": pedido.then(u => new Blob([u], { type: "text/plain" })) })]);
    copiado = true;
  } catch (_) {}
  try { url = await pedido; }
  catch (e) { status.textContent = e.message; sql.focus(); return; }
  if (!copiado) { try { await navigator.clipboard.writeText(url); copiado = true; } catch (_) {} }
  if (!copiado) { prompt("link da consulta:", url); return; }      // sem permissão de área de transferência
  status.textContent = "link copiado";
  compartilha.classList.add("ok");
  compartilha.title = "link copiado";
  setTimeout(() => { compartilha.classList.remove("ok"); compartilha.title = "copiar link que abre e executa esta consulta"; }, 1500);
  sql.focus();
});

// celular: painel da árvore, barra de teclas e altura que acompanha o teclado virtual
const celular = matchMedia("(max-width: 760px), (pointer: coarse) and (max-width: 1024px)");
const botaoArvore = document.querySelector("[data-acao=arvore]");
function fechaArvore() {
  if (!document.body.classList.contains("arvore-aberta")) return;
  document.body.classList.remove("arvore-aberta");
  botaoArvore.setAttribute("aria-expanded", "false");
}
function abreArvore() {
  document.body.classList.add("arvore-aberta");
  botaoArvore.setAttribute("aria-expanded", "true");
}
document.getElementById("fundo").addEventListener("click", fechaArvore);
document.getElementById("fecha").addEventListener("click", fechaArvore);
const teclas = document.getElementById("teclas");
const TECLAS = { enter: "\r", tab: "\t", cima: "\x1b[A", baixo: "\x1b[B", esq: "\x1b[D", dir: "\x1b[C",
  ctrlc: "\x03", esc: "\x1b" };
// pointerdown + preventDefault: o botão não rouba o foco, o teclado virtual continua aberto
teclas.addEventListener("pointerdown", e => { if (e.target.closest("button")) e.preventDefault(); });
teclas.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.acao === "arvore") { abreArvore(); return; }
  const term = termFrame.contentWindow.term;
  if (!term) return;
  const k = b.dataset.k ? TECLAS[b.dataset.k] : b.dataset.t;
  term.input(k, true);
  term.focus();
});
function ajustaAltura() {
  const vv = window.visualViewport;
  if (!vv || !celular.matches) { document.documentElement.style.removeProperty("--altura"); return; }
  document.documentElement.style.setProperty("--altura", vv.height + "px");
  document.body.style.top = vv.offsetTop + "px";
  cancelAnimationFrame(quadro); quadro = requestAnimationFrame(refit);
}
window.visualViewport?.addEventListener("resize", ajustaAltura);
window.visualViewport?.addEventListener("scroll", ajustaAltura);
celular.addEventListener?.("change", ajustaAltura);

// teclado na árvore: ↓ da busca entra; ↑/↓ andam pelos itens visíveis; → abre ou desce;
// ← fecha ou sobe; Enter abre/fecha (nativo); Shift+Enter cola; Esc volta para a busca
const visiveis = () => [...arvore.querySelectorAll("summary, .coluna")].filter(e => e.offsetParent !== null);
function foca(el) { if (el) { el.focus(); el.scrollIntoView({ block: "nearest" }); } }
busca.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); foca(visiveis()[0]); }
});
arvore.addEventListener("keydown", e => {
  const atual = document.activeElement;
  const lista = visiveis();
  const i = lista.indexOf(atual);
  if (i < 0) return;
  const det = atual.tagName === "SUMMARY" ? atual.parentElement : null;
  if (e.key === "ArrowDown") { e.preventDefault(); foca(lista[i + 1]); }
  else if (e.key === "ArrowUp") { e.preventDefault(); i === 0 ? busca.focus() : foca(lista[i - 1]); }
  else if (e.key === "ArrowRight" && det) { e.preventDefault(); det.open ? foca(lista[i + 1]) : (det.open = true); }
  else if (e.key === "ArrowLeft") {
    e.preventDefault();
    if (det?.open) det.open = false;
    else foca((atual.closest(".coluna") ? atual.closest(".tb") : (det ?? atual).parentElement.closest("details"))?.querySelector(":scope > summary"));
  }
  else if (e.key === "Enter" && e.shiftKey && det?.classList.contains("tb")) { e.preventDefault(); cola(`FROM ${det.dataset.t} LIMIT 10;`); }
  else if (e.key === "Enter" && atual.classList.contains("coluna")) { e.preventDefault(); cola(atual.dataset.c); }
  else if (e.key === "Escape") { e.preventDefault(); busca.focus(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") fechaArvore(); });

let espera;
document.getElementById("legenda").addEventListener("click", e => {
  const b = e.target.closest("button[data-onde]");
  if (!b) return;
  const resto = busca.value.replace(ONDE, " ").trim();
  busca.value = b.getAttribute("aria-pressed") === "true" ? resto : `onde:${b.dataset.onde} ${resto}`.trim();
  desenha(busca.value);
});
busca.addEventListener("input", () => { clearTimeout(espera); espera = setTimeout(() => desenha(busca.value), 120); });

// redimensionar o painel: refit ao vivo, largura lembrada, duplo clique volta ao padrão
const aside = document.querySelector("aside");
const arrasta = document.getElementById("arrasta");
const PADRAO = 360;
const refit = () => { try { termFrame.contentWindow.term.fit(); } catch (_) {} };
const largura = w => { aside.style.width = Math.min(Math.max(220, w), innerWidth * 0.7) + "px"; };
try { const w = +localStorage.getItem("rodado.arvore"); if (w) largura(w); } catch (_) {}
let quadro = 0;
arrasta.addEventListener("pointerdown", e => {
  e.preventDefault();
  arrasta.setPointerCapture(e.pointerId);
  document.body.classList.add("arrastando");
});
arrasta.addEventListener("pointermove", e => {
  if (!arrasta.hasPointerCapture(e.pointerId)) return;
  largura(innerWidth - e.clientX);
  cancelAnimationFrame(quadro);
  quadro = requestAnimationFrame(refit);
});
arrasta.addEventListener("pointerup", e => {
  arrasta.releasePointerCapture(e.pointerId);
  document.body.classList.remove("arrastando");
  try { localStorage.setItem("rodado.arvore", parseInt(aside.style.width)); } catch (_) {}
  refit();
});
arrasta.addEventListener("keydown", e => {
  const passo = e.shiftKey ? 80 : 20;
  const atual = aside.getBoundingClientRect().width;
  if (e.key === "ArrowLeft") largura(atual + passo);
  else if (e.key === "ArrowRight") largura(atual - passo);
  else if (e.key === "Enter" || e.key === "Home") largura(PADRAO);
  else return;
  e.preventDefault();
  arrasta.setAttribute("aria-valuenow", Math.round(aside.getBoundingClientRect().width));
  try { localStorage.setItem("rodado.arvore", Math.round(aside.getBoundingClientRect().width)); } catch (_) {}
  cancelAnimationFrame(quadro); quadro = requestAnimationFrame(refit);
});
arrasta.addEventListener("dblclick", () => {
  largura(PADRAO);
  try { localStorage.removeItem("rodado.arvore"); } catch (_) {}
  refit();
});
addEventListener("resize", () => { cancelAnimationFrame(quadro); quadro = requestAnimationFrame(refit); });

fetch(location.origin + "/catalogo.json").then(r => r.json()).then(d => {
  catalogo = d;
  tabelasConhecidas = new Set(d.map(t => t.dataset + "." + t.tabela));
  datasets = [...new Set(d.map(t => t.dataset))];
  atualizaEditor();
  const ds = new Set(d.map(t => t.dataset)).size;
  const linhas = d.reduce((s, t) => s + (t.linhas || 0), 0);
  document.getElementById("resumo").textContent = `${ds} ds · ${d.length} tab · ${fmt(linhas)}`;
  const nSsd = d.filter(t => t.ssd).length;
  document.getElementById("n-ssd").textContent = `(${nSsd.toLocaleString("pt-BR")})`;
  document.getElementById("n-s3").textContent = `(${(d.length - nSsd).toLocaleString("pt-BR")})`;
  desenha("");
}).catch(err => { arvore.innerHTML = `<div class="vazio erro">erro ao carregar catálogo: ${esc(err.message)}</div>`; });
ajustaAltura();
</script>
