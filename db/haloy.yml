name: rodado-db
server: haloy.tocador.cc
api_token:
  from:
    env: HALOY_API_TOKEN
port: 8080
health_check_path: /health
domains:
  - domain: db.rodado.xyz
# o catálogo leva ~30 min para montar: fica no volume entre um deploy e outro
volumes:
  - "rodado-db-dados:/dados"
env:
  - name: DB_USUARIO
    from:
      env: DB_USUARIO
  - name: DB_SENHA_HASH
    from:
      env: DB_SENHA_HASH
  - name: DB_TOKEN
    from:
      env: DB_TOKEN
  - name: S3_KEY
    from:
      env: S3_KEY
  - name: S3_SECRET
    from:
      env: S3_SECRET
  # 10 s (o padrão do rodado_sql.py) x 8 tentativas cobre ~80 s; em 2026-10-26 o bucket travou
  # requisições por ~100 s, e o count(*) de tabelas com mais de mil arquivos (sicor, estban) caía.
  # Com keep-alive desligado, cada tentativa abre conexão nova: 30 s não repete a falha de 12/10.
  - name: RODADO_HTTP_TIMEOUT
    value: "30"
