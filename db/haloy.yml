name: rodado-db
server: haloy.tocador.cc
api_token:
  from:
    env: HALOY_API_TOKEN
port: 8080
health_check_path: /health
domains:
  - domain: db.rodado.xyz
# o catálogo leva ~30 min para montar: fica no volume entre um deploy e outro
volumes:
  - "rodado-db-dados:/dados"
env:
  - name: DB_USUARIO
    from:
      env: DB_USUARIO
  - name: DB_SENHA_HASH
    from:
      env: DB_SENHA_HASH
  - name: DB_TOKEN
    from:
      env: DB_TOKEN
  # tokens por pessoa, `nome:token` separados por vírgula (vazio: só o DB_TOKEN do dono vale)
  - name: DB_TOKENS
    from:
      env: DB_TOKENS
  - name: S3_KEY
    from:
      env: S3_KEY
  - name: S3_SECRET
    from:
      env: S3_SECRET
  # 10 s (o padrão do rodado_sql.py) x 8 tentativas cobre ~80 s; em 2026-10-26 o bucket travou
  # requisições por ~100 s, e o count(*) de tabelas com mais de mil arquivos (sicor, estban) caía.
  # Com keep-alive desligado, cada tentativa abre conexão nova: 30 s não repete a falha de 12/10.
  - name: RODADO_HTTP_TIMEOUT
    value: "30"
  # Limites contra raspagem (db/limites.py, plano tasks/plans/limites_abuso_db.md). Os valores
  # abaixo são os padrões do código; 0 desliga cada um. Descomente para mudar sem editar o código.
  # - {name: RODADO_COTA_DIA, value: "200000"}        # linhas devolvidas por token (ou IP) e dia
  # - {name: RODADO_POR_MINUTO, value: "30"}          # consultas por IP por minuto
  # - {name: RODADO_SIMULTANEAS_IP, value: "2"}       # consultas ao mesmo tempo por IP
  # - {name: RODADO_OFFSET_MAX, value: "100000"}      # OFFSET acima disto é recusado
  # - {name: RODADO_AMPLO_LINHAS, value: "1000000"}   # tabela maior que isto não sai inteira sem filtro...
  # - {name: RODADO_AMPLO_LIMITE, value: "1000"}      # ...salvo com LIMIT/limite até isto
  # - {name: RODADO_PARQUET_SO_TOKEN, value: "0"}     # 1: formato=parquet só com token pessoal
  # - {name: RODADO_ISENTOS, value: ""}               # nomes de token fora da cota (ex.: "polo")
