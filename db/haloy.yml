name: rodado-db
server: haloy.tocador.cc
api_token:
  from:
    env: HALOY_API_TOKEN
port: 8080
health_check_path: /health
domains:
  - domain: db.rodado.xyz
# o catálogo leva ~30 min para montar: fica no volume entre um deploy e outro
volumes:
  - "rodado-db-dados:/dados"
env:
  - name: DB_USUARIO
    from:
      env: DB_USUARIO
  - name: DB_SENHA_HASH
    from:
      env: DB_SENHA_HASH
  - name: DB_TOKEN
    from:
      env: DB_TOKEN
  - name: S3_KEY
    from:
      env: S3_KEY
  - name: S3_SECRET
    from:
      env: S3_SECRET
